# Microsoft Graph application permissions the shipped rules need, by request path. All are read permissions.
# A rule's path takes the entries of the longest matching path (the whole path, or the path followed by '/' or '(').
# 'any' lists permissions of which one is enough; an entry with 'select' applies only when the rule selects that
# field. Sources: docs/backlog/microsoft-cloud.md ("Graph permissions") and the Graph API reference for each call.
# Entries marked 'confirm' are documented loosely by Microsoft; the first run on a tenant settles them.
#
# Never listed here, on purpose: permissions that read secrets or content (BitlockerKey.Read.All,
# DeviceLocalCredential.Read.All, Mail.Read, Files.Read.All, Sites.Read.All). The rules read metadata only.

# ---- Directory: users, groups, devices, organisation
- { path: /users, any: [User.Read.All, Directory.Read.All] }
- { path: /users, select: signInActivity, any: [AuditLog.Read.All] }
- { path: /users/*/authentication/requirements, any: [Policy.Read.All, UserAuthenticationMethod.Read.All], confirm: true }
- { path: /users/*/mailFolders/inbox/messageRules, any: [MailboxSettings.Read] }
- { path: /groups, any: [GroupMember.Read.All, Group.Read.All, Directory.Read.All] }
- { path: /groupSettings, any: [Directory.Read.All] }
- { path: /groupLifecyclePolicies, any: [Directory.Read.All, Group.Read.All] }
- { path: /devices, any: [Device.Read.All, Directory.Read.All] }
- { path: /organization, any: [Organization.Read.All, Directory.Read.All] }
- { path: /domains, any: [Domain.Read.All, Directory.Read.All] }
- { path: /subscribedSkus, any: [Organization.Read.All, LicenseAssignment.Read.All, Directory.Read.All] }
- { path: /directory/subscriptions, any: [Organization.Read.All, Directory.Read.All] }
- { path: /directory/administrativeUnits, any: [AdministrativeUnit.Read.All, Directory.Read.All] }
- { path: /directory/deletedItems, any: [Directory.Read.All] }
- { path: /directory/onPremisesSynchronization, any: [OnPremDirectorySynchronization.Read.All] }
- { path: /directory/recommendations, any: [DirectoryRecommendations.Read.All] }
- { path: /directory/deviceLocalCredentials, any: [DeviceLocalCredential.ReadBasic.All] }
- { path: /informationProtection/bitlocker/recoveryKeys, any: [BitlockerKey.ReadBasic.All] }

# ---- Applications and consent
- { path: /applications, any: [Application.Read.All, Directory.Read.All] }
- { path: /servicePrincipals, any: [Application.Read.All, Directory.Read.All] }
- { path: /servicePrincipals/*/synchronization/jobs, any: [Synchronization.Read.All] }
- { path: /oauth2PermissionGrants, any: [DelegatedPermissionGrant.Read.All, Directory.Read.All] }

# ---- Roles and PIM
- { path: /roleManagement/directory/roleAssignments, any: [RoleManagement.Read.Directory, RoleManagement.Read.All, Directory.Read.All] }
- { path: /roleManagement/directory/roleDefinitions, any: [RoleManagement.Read.Directory, RoleManagement.Read.All] }
- { path: /roleManagement/directory/roleAssignmentScheduleInstances, any: [RoleAssignmentSchedule.Read.Directory, RoleManagement.Read.Directory] }
- { path: /roleManagement/directory/roleEligibilityScheduleInstances, any: [RoleEligibilitySchedule.Read.Directory, RoleManagement.Read.Directory] }
- { path: /roleManagement/directory/roleEligibilitySchedules, any: [RoleEligibilitySchedule.Read.Directory, RoleManagement.Read.Directory] }
- { path: /policies/roleManagementPolicies, any: [RoleManagementPolicy.Read.Directory] }
- { path: /policies/roleManagementPolicyAssignments, any: [RoleManagementPolicy.Read.Directory] }
- { path: /identityGovernance/roleManagementAlerts/alerts, any: [RoleManagementAlert.Read.Directory] }

