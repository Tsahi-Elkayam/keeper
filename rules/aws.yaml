  - id: AWS-CODEBUILD-TOKEN-CREDENTIAL
    title: CodeBuild uses a stored personal access token or basic-auth credential
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: codebuild-credential
    refresh: 7d
    why: A personal access token or basic-auth credential stored for source access is a long-lived secret tied to one person's account; an OAuth app or CodeConnections connection is scoped and revocable.
    fix: Replace the stored token with an AWS CodeConnections (or OAuth) connection and delete the credential.
    refs: [NIST-800-53:IA-5]
    query:
      protocol: aws
      service: codebuild
      action: ListSourceCredentials
      items: sourceCredentialsInfos
      key: arn
    each: { field: authType, op: in, value: [PERSONAL_ACCESS_TOKEN, BASIC_AUTH] }
    evidence: "CodeBuild {serverType} credential ({_account} {_region}): {authType}"
