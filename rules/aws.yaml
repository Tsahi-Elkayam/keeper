  - id: AWS-SG-WIDE-PORT-RANGE-FROM-INTERNET
    title: Security group opens a wide port range to the internet
    kind: misconfigured
    lens: security
    category: AUT
    severity: high
    entity: security-group-rule
    why: A rule spanning more than a hundred ports from 0.0.0.0/0 exposes whatever happens to listen in that range, now or later; it is almost always a shortcut, not a need.
    fix: Replace the range with the specific ports the service uses, from the sources that need them.
    refs: [FSBP:EC2.18, NIST-800-53:SC-7, NIST-800-53:AC-4]
    query:
      protocol: aws
      service: ec2
      action: DescribeSecurityGroupRules
      items: "//securityGroupRuleSet/item"
      key: securityGroupRuleId
    each:
      all:
        - { field: isEgress, op: eq, value: false }
        - { field: ipProtocol, op: in, value: [tcp, "6", udp, "17"] }
        - { field: toPort, op: gt, value: { field: fromPort, plus: 100 } }
        - any:
            - { field: cidrIpv4, op: eq, value: "0.0.0.0/0" }
            - { field: cidrIpv6, op: eq, value: "::/0" }
    evidence: "group {groupId} ({_account} {_region}): {ipProtocol} {fromPort}-{toPort} open from {cidrIpv4}{cidrIpv6}"

  - id: AWS-SG-NON-WEB-PORT-FROM-INTERNET
    title: Security group opens a port other than 80/443 to the internet
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: security-group-rule
    why: Anything but web traffic open to the whole internet deserves a recorded reason; this is the catch-all behind the per-service port rules.
    fix: Restrict the source to known networks, or record why the port must be public.
    refs: [FSBP:EC2.18, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: ec2
      action: DescribeSecurityGroupRules
      items: "//securityGroupRuleSet/item"
      key: securityGroupRuleId
    each:
      all:
        - { field: isEgress, op: eq, value: false }
        - { field: ipProtocol, op: ne, value: "-1" }
        - any:
            - { field: cidrIpv4, op: eq, value: "0.0.0.0/0" }
            - { field: cidrIpv6, op: eq, value: "::/0" }
        - not:
            any:
              - all: [ { field: fromPort, op: eq, value: 80 }, { field: toPort, op: eq, value: 80 } ]
              - all: [ { field: fromPort, op: eq, value: 443 }, { field: toPort, op: eq, value: 443 } ]
    evidence: "group {groupId} ({_account} {_region}): {ipProtocol} {fromPort}-{toPort} open from {cidrIpv4}{cidrIpv6}"

  - id: AWS-SG-DEFAULT-HAS-RULES
    title: Default security group has rules
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: security-group
    why: Anything launched without an explicit group lands in the VPC's default group; with rules in it, that resource silently gets network access nobody designed. CIS expects the default group to deny all traffic.
    fix: Remove every inbound and outbound rule from the default security group and give resources purpose-made groups.
    refs: [CIS-AWS:5.4, FSBP:EC2.2, NIST-800-53:SC-7, NIST-800-53:CM-7]
    query:
      protocol: aws
      service: ec2
      action: DescribeSecurityGroups
      params: { "Filter.1.Name": group-name, "Filter.1.Value.1": default }
      items: "//securityGroupInfo/item"
      key: groupId
    each:
      any:
        - { field: ipPermissions.item, op: exists }
        - { field: ipPermissionsEgress.item, op: exists }
    evidence: "default group {groupId} of {vpcId} ({_account} {_region}) has rules"

  - id: AWS-NACL-ADMIN-FROM-INTERNET
    title: Network ACL allows SSH or RDP (or all traffic) in from the internet
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: network-acl
    refresh: 7d
    why: The NACL is the subnet-level backstop for security groups; one that admits administration ports from 0.0.0.0/0 leaves every group in the subnet as the only barrier. The VPC's default allow-all NACL matches too. A lower-numbered deny rule is not taken into account.
    fix: Add explicit deny (or narrow allow) entries for 22 and 3389 from the internet on public subnets' NACLs, ordered before the allow.
    refs: [CIS-AWS:5.1, FSBP:EC2.21, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: ec2
      action: DescribeNetworkAcls
      items: "//networkAclSet/item"
      key: networkAclId
    each:
      element:
        of: entrySet.item
        where:
          all:
            - { field: egress, op: eq, value: false }
            - { field: ruleAction, op: eq, value: allow }
            - any:
                - { field: cidrBlock, op: eq, value: "0.0.0.0/0" }
                - { field: ipv6CidrBlock, op: eq, value: "::/0" }
            - any:
                - { field: protocol, op: eq, value: "-1" }
                - all: [ { field: protocol, op: in, value: ["6", "17"] }, { field: portRange.from, op: le, value: 22 }, { field: portRange.to, op: ge, value: 22 } ]
                - all: [ { field: protocol, op: in, value: ["6", "17"] }, { field: portRange.from, op: le, value: 3389 }, { field: portRange.to, op: ge, value: 3389 } ]
    evidence: "network ACL {networkAclId} of {vpcId} ({_account} {_region}) admits SSH/RDP or all traffic from the internet"

  - id: AWS-NACL-UNUSED
    title: Network ACL is not associated with any subnet
    kind: misconfigured
    lens: maintenance
    category: HYG
    severity: low
    entity: network-acl
    refresh: 7d
    why: An unassociated, non-default NACL protects nothing and confuses reviews of what actually guards a subnet.
    fix: Associate it where it was meant to apply, or delete it.
    refs: [FSBP:EC2.16, NIST-800-53:CM-8]
    query:
      protocol: aws
      service: ec2
      action: DescribeNetworkAcls
      items: "//networkAclSet/item"
      key: networkAclId
    each:
      all:
        - { field: default, op: eq, value: false }
        - { field: associationSet.item, op: absent }
    evidence: "network ACL {networkAclId} of {vpcId} ({_account} {_region}) has no subnet"

  - id: AWS-VPC-DEFAULT-EXISTS
    title: Default VPC exists
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: vpc
    refresh: 7d
    why: The default VPC has public subnets that give every instance a public IP and a route to the internet; anything launched there by default is exposed. It should not exist where it is not used.
    fix: Delete the default VPC in regions where it holds nothing (or prevent its use by SCP), and build workloads in purpose-made VPCs.
    refs: [NIST-800-53:SC-7, NIST-800-53:CM-7]
    query:
      protocol: aws
      service: ec2
      action: DescribeVpcs
      items: "//vpcSet/item"
      key: vpcId
    each: { field: isDefault, op: eq, value: true }
    evidence: "default VPC {vpcId} ({_account} {_region}) {cidrBlock}"

  - id: AWS-VPC-NO-FLOW-LOG
    title: VPC has no flow log
    kind: missing
    lens: security
    category: LOG
    severity: medium
    entity: vpc
    why: Without a flow log there is no record of which addresses talked to the VPC's resources, so an intrusion or exfiltration cannot be traced afterwards. Each VPC is asked for its own flow logs.
    fix: Create a flow log for the VPC (at least rejected traffic, preferably all) delivered to the central log archive.
    refs: [CIS-AWS:3.7, FSBP:EC2.6, NIST-800-53:AU-12, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: ec2
      action: DescribeFlowLogs
      for_each: { service: ec2, action: DescribeVpcs, items: "//vpcSet/item", field: vpcId, max: 2000 }
      params: { "Filter.1.Name": resource-id, "Filter.1.Value.1": "{vpcId}" }
      items: "//DescribeFlowLogsResponse"
      key: "{_account}|{_region}|{parent.vpcId}"
    each: { field: flowLogSet.item, op: absent }
    evidence: "VPC {parent.vpcId} ({_account} {_region}, default {parent.isDefault}) has no flow log"

  - id: AWS-VPC-PEERING-CROSS-ACCOUNT
    title: VPC peering connection with another account
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: vpc-peering
    refresh: 7d
    why: A peering with another account joins two networks' trust; each one should be a known connection to a known account, with routes limited to the subnets that need it.
    fix: Confirm the peer account and purpose; narrow the route tables to the needed CIDRs, or remove the peering.
    refs: [CIS-AWS:5.5, NIST-800-53:SC-7, NIST-800-53:CA-3]
    query:
      protocol: aws
      service: ec2
      action: DescribeVpcPeeringConnections
      items: "//vpcPeeringConnectionSet/item"
      key: vpcPeeringConnectionId
    each:
      all:
        - { field: status.code, op: eq, value: active }
        - { field: accepterVpcInfo.ownerId, op: ne, value: { field: requesterVpcInfo.ownerId } }
    evidence: "peering {vpcPeeringConnectionId}: {requesterVpcInfo.ownerId}/{requesterVpcInfo.vpcId} to {accepterVpcInfo.ownerId}/{accepterVpcInfo.vpcId}"

  - id: AWS-SUBNET-AUTO-PUBLIC-IP
    title: Subnet assigns public IPv4 addresses automatically
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: subnet
    refresh: 7d
    why: Every instance launched in such a subnet gets a public address unless someone remembers to turn it off; exposure should be a decision per resource.
    fix: Turn off auto-assign public IPv4 on the subnet and assign public addresses (or better, a load balancer) only where needed.
    refs: [FSBP:EC2.15, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: ec2
      action: DescribeSubnets
      items: "//subnetSet/item"
      key: subnetId
    each: { field: mapPublicIpOnLaunch, op: eq, value: true }
    evidence: "subnet {subnetId} of {vpcId} ({_account} {_region}, default {defaultForAz}) auto-assigns public IPs"

  - id: AWS-EIP-UNATTACHED
    title: Elastic IP address not attached
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: elastic-ip
    refresh: 7d
    why: An unattached Elastic IP is billed every hour and is a public address someone may later attach without review.
    fix: Release it, or attach it to what it was reserved for.
    refs: [FSBP:EC2.12, NIST-800-53:CM-8]
    query:
      protocol: aws
      service: ec2
      action: DescribeAddresses
      items: "//addressesSet/item"
      key: "{_account}|{_region}|{publicIp}"
    each:
      all:
        - { field: associationId, op: absent }
        - { field: networkInterfaceId, op: absent }
    evidence: "Elastic IP {publicIp} ({_account} {_region}) is not attached"

  - id: AWS-EBS-VOLUME-UNATTACHED
    title: EBS volume not attached to any instance
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: ebs-volume
    refresh: 7d
    why: A detached volume keeps billing and keeps its data, often from a terminated server nobody owns any more.
    fix: Snapshot it if the data may be needed, then delete it.
    refs: [NIST-800-53:CM-8]
    query:
      protocol: aws
      service: ec2
      action: DescribeVolumes
      items: "//volumeSet/item"
      key: volumeId
    each: { field: status, op: eq, value: available }
    evidence: "volume {volumeId} ({_account} {_region}): {size} GiB {volumeType}, created {createTime}, not attached"

  - id: AWS-EBS-VOLUME-GP2
    title: EBS volume still on gp2
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: ebs-volume
    refresh: 7d
    why: gp3 costs about a fifth less than gp2 and gives a performance baseline independent of size; the change is online.
    fix: Modify the volume type to gp3 (set IOPS and throughput to at least what gp2 delivered).
    refs: [NIST-800-53:SA-4]
    query:
      protocol: aws
      service: ec2
      action: DescribeVolumes
      items: "//volumeSet/item"
      key: volumeId
    each: { field: volumeType, op: eq, value: gp2 }
    evidence: "volume {volumeId} ({_account} {_region}): {size} GiB gp2"

  - id: AWS-EBS-SNAPSHOT-PUBLIC
    title: Self-owned EBS snapshot is public
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: ebs-snapshot
    why: A public snapshot can be copied into any AWS account and mounted; whatever was on the disk - data, credentials, keys - is exposed to the world.
    fix: Remove the public create-volume permission, enable the snapshot block-public-access setting, and treat what was on the disk as exposed.
    refs: [FSBP:EC2.1, NIST-800-53:AC-3, MITRE-ATTACK:T1537]
    query:
      protocol: aws
      service: ec2
      action: DescribeSnapshots
      params: { "Owner.1": self, "RestorableBy.1": all }
      items: "//snapshotSet/item"
      key: snapshotId
    each: any
    evidence: "snapshot {snapshotId} ({_account} {_region}) of {volumeId}, {volumeSize} GiB, is public"

  - id: AWS-EBS-SNAPSHOT-UNENCRYPTED
    title: Self-owned EBS snapshot is not encrypted
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: ebs-snapshot
    refresh: 7d
    why: An unencrypted snapshot can be shared or copied without any key permission, and everything on the disk is readable to whoever gets it.
    fix: Copy the snapshot with encryption on and delete the unencrypted original; enable EBS encryption by default.
    refs: [CIS-AWS:2.2.1, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: ec2
      action: DescribeSnapshots
      params: { "Owner.1": self }
      items: "//snapshotSet/item"
      key: snapshotId
    each: { field: encrypted, op: eq, value: false }
    evidence: "snapshot {snapshotId} ({_account} {_region}) of {volumeId} is not encrypted"

  - id: AWS-EBS-SNAPSHOT-OLD
    title: EBS snapshot older than a year
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: ebs-snapshot
    refresh: 7d
    why: Old manual snapshots accumulate cost and data nobody owns; anything kept for retention should be under a lifecycle or backup policy that expires it.
    fix: Delete snapshots no retention rule requires, and move the rest under AWS Backup or DLM with an expiry.
    refs: [NIST-800-53:SI-12, NIST-800-53:CM-8]
    query:
      protocol: aws
      service: ec2
      action: DescribeSnapshots
      params: { "Owner.1": self }
      items: "//snapshotSet/item"
      key: snapshotId
    each: { field: startTime, op: age-gt, value: 365, threshold: aws.ebs.snapshot-max-age-days }
    evidence: "snapshot {snapshotId} ({_account} {_region}) from {startTime}, {volumeSize} GiB: {description}"

  - id: AWS-EBS-SNAPSHOT-BLOCK-PUBLIC-OFF
    title: EBS snapshot block public access is off in a region
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: region
    why: The account-level block stops any snapshot in the region from being made public, whatever a script or a person does later.
    fix: Enable block public access for snapshots (block all sharing) in every region.
    refs: [NIST-800-53:AC-3, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: ec2
      action: GetSnapshotBlockPublicAccessState
      items: "//GetSnapshotBlockPublicAccessStateResponse"
      key: "{_account}|{_region}"
    each: { field: state, op: eq, value: unblocked }
    evidence: "account {_account} {_region}: snapshot block public access {state}"

  - id: AWS-AMI-BLOCK-PUBLIC-OFF
    title: AMI block public access is off in a region
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: region
    why: The account-level block stops new public sharing of AMIs in the region, so an image cannot be exposed by a single mistaken call.
    fix: Enable block public access for AMIs in every region.
    refs: [NIST-800-53:AC-3, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: ec2
      action: GetImageBlockPublicAccessState
      items: "//GetImageBlockPublicAccessStateResponse"
      key: "{_account}|{_region}"
    each: { field: imageBlockPublicAccessState, op: ne, value: block-new-sharing }
    evidence: "account {_account} {_region}: AMI block public access {imageBlockPublicAccessState}"

  - id: AWS-AMI-UNENCRYPTED
    title: Self-owned AMI has an unencrypted volume
    kind: misconfigured
    lens: security
    category: PKI
    severity: low
    entity: ami
    refresh: 7d
    why: An AMI whose snapshots are unencrypted can be shared and copied without key permissions, and everything baked into the image is readable.
    fix: Copy the AMI with encryption on, deregister the unencrypted one and delete its snapshots.
    refs: [NIST-800-53:SC-28]
    query:
      protocol: aws
      service: ec2
      action: DescribeImages
      params: { "Owner.1": self }
      items: "//imagesSet/item"
      key: imageId
      name: name
    each:
      element:
        of: blockDeviceMapping.item
        where: { field: ebs.encrypted, op: eq, value: false }
    evidence: "AMI {imageId} ({_account} {_region}) {name} has an unencrypted volume"

  - id: AWS-EC2-SERIAL-CONSOLE-ON
    title: EC2 serial console access is enabled
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: region
    refresh: 7d
    why: The serial console is an out-of-band root path into every instance in the region that bypasses security groups; it should be on only while someone is recovering a machine.
    fix: Disable serial console access at the account level and enable it temporarily when needed.
    refs: [NIST-800-53:AC-17, NIST-800-53:CM-7]
    query:
      protocol: aws
      service: ec2
      action: GetSerialConsoleAccessStatus
      items: "//GetSerialConsoleAccessStatusResponse"
      key: "{_account}|{_region}"
    each: { field: serialConsoleAccessEnabled, op: eq, value: true }
    evidence: "account {_account} {_region}: serial console access enabled"

  - id: AWS-EC2-IMDS-DEFAULT-NOT-V2
    title: Account default for new instances does not require IMDSv2
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: region
    refresh: 7d
    why: The account-level metadata default decides IMDS for every instance launched without its own setting; requiring tokens there makes IMDSv2 the norm instead of an opt-in.
    fix: Set the instance metadata defaults for the account and region to HttpTokens required and hop limit 1 (2 for container hosts).
    refs: [CIS-AWS:5.6, NIST-800-53:AC-6]
    query:
      protocol: aws
      service: ec2
      action: GetInstanceMetadataDefaults
      items: "//GetInstanceMetadataDefaultsResponse"
      key: "{_account}|{_region}"
    each:
      any:
        - { field: accountLevel.httpTokens, op: absent }
        - { field: accountLevel.httpTokens, op: ne, value: required }
    evidence: "account {_account} {_region}: default httpTokens {accountLevel.httpTokens}"

  - id: AWS-EC2-NO-INSTANCE-PROFILE
    title: Running EC2 instance has no IAM role
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: ec2-instance
    refresh: 7d
    why: An instance without a role cannot be managed by Systems Manager, and whatever runs on it that calls AWS does so with long-lived keys stored on the disk.
    fix: Attach an instance profile (at least AmazonSSMManagedInstanceCore) and move any stored keys to the role.
    refs: [CIS-AWS:1.18, NIST-800-53:IA-5, NIST-800-53:AC-6]
    query:
      protocol: aws
      service: ec2
      action: DescribeInstances
      items: "//instancesSet/item"
      key: instanceId
    each:
      all:
        - { field: instanceState.name, op: eq, value: running }
        - { field: iamInstanceProfile, op: absent }
    evidence: "instance {instanceId} ({_account} {_region}) has no instance profile"

  - id: AWS-EC2-PREVIOUS-GENERATION
    title: EC2 instance on a previous-generation instance type
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: low
    entity: ec2-instance
    refresh: 7d
    why: Previous-generation types cost more per unit of performance, lack Nitro security features and are retired over time, forcing an unplanned move.
    fix: Move the instance to a current-generation type at the next maintenance window.
    refs: [NIST-800-53:SA-22]
    query:
      protocol: aws
      service: ec2
      action: DescribeInstances
      items: "//instancesSet/item"
      key: instanceId
    each: { field: instanceType, op: match, value: '^(t1|m1|m2|m3|c1|c3|cc2|cg1|cr1|g2|hi1|hs1|i2|r3)\.', threshold: aws.ec2.previous-generation-pattern }
    evidence: "instance {instanceId} ({_account} {_region}): type {instanceType}, state {instanceState.name}"

  - id: AWS-EC2-PARAVIRTUAL
    title: EC2 instance uses paravirtual virtualisation
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: low
    entity: ec2-instance
    refresh: 7d
    why: Paravirtual instances run only on old instance types and old kernels; they cannot move to current, more secure hardware without a rebuild.
    fix: Rebuild the workload on an HVM AMI and a current instance type.
    refs: [FSBP:EC2.24, NIST-800-53:SA-22]
    query:
      protocol: aws
      service: ec2
      action: DescribeInstances
      items: "//instancesSet/item"
      key: instanceId
    each: { field: virtualizationType, op: eq, value: paravirtual }
    evidence: "instance {instanceId} ({_account} {_region}): paravirtual, type {instanceType}"

  - id: AWS-EC2-IN-DEFAULT-SG
    title: Running EC2 instance is in the default security group
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: ec2-instance
    refresh: 7d
    why: The default group is shared by everything launched without a choice; an instance in it can reach, and be reached by, every other such resource.
    fix: Give the instance a purpose-made security group and remove the default group from it.
    refs: [CIS-AWS:5.4, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: ec2
      action: DescribeInstances
      items: "//instancesSet/item"
      key: instanceId
    each:
      all:
        - { field: instanceState.name, op: eq, value: running }
        - element: { of: groupSet.item, where: { field: groupName, op: eq, value: default } }
    evidence: "instance {instanceId} ({_account} {_region}) is in the default security group"

  - id: AWS-EC2-IMDS-HOP-LIMIT
    title: Running EC2 instance allows IMDS responses beyond one network hop
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: ec2-instance
    refresh: 7d
    why: A hop limit above 1 lets containers or forwarded traffic on the instance reach the metadata service and its role credentials; container hosts need 2, other servers 1.
    fix: Set the metadata response hop limit to 1 (2 on container hosts that need it).
    refs: [NIST-800-53:AC-6, MITRE-ATTACK:T1552.005]
    query:
      protocol: aws
      service: ec2
      action: DescribeInstances
      items: "//instancesSet/item"
      key: instanceId
    each:
      all:
        - { field: instanceState.name, op: eq, value: running }
        - { field: metadataOptions.httpPutResponseHopLimit, op: gt, value: 1, threshold: aws.ec2.imds-max-hops }
    evidence: "instance {instanceId} ({_account} {_region}): hop limit {metadataOptions.httpPutResponseHopLimit}"

  - id: AWS-EC2-SCHEDULED-EVENT
    title: EC2 instance has a scheduled maintenance, reboot or retirement event
    kind: broken
    lens: maintenance
    category: AVL
    severity: medium
    entity: ec2-instance
    refresh: 6h
    why: AWS stops, reboots or retires the instance on the event's date whether or not the owner is ready; a planned stop of a production server becomes an outage when nobody saw the notice.
    fix: Reschedule the event or stop/start the instance in a window of your choosing before the date; for retirement, move it to new hardware.
    refs: [NIST-800-53:CP-2, NIST-800-53:MA-2]
    query:
      protocol: aws
      service: ec2
      action: DescribeInstanceStatus
      params: { IncludeAllInstances: true }
      items: "//instanceStatusSet/item"
      key: instanceId
    each:
      element:
        of: eventsSet.item
        where: { field: description, op: notmatch, value: '^\[(Completed|Canceled)\]' }
    evidence: "instance {instanceId} ({_account} {_region}): {eventsSet.item.code}{eventsSet.item[].code} from {eventsSet.item.notBefore}{eventsSet.item[].notBefore} - {eventsSet.item.description}{eventsSet.item[].description}"

  - id: AWS-EC2-STATUS-CHECK-FAILED
    title: EC2 instance failing its status checks
    kind: broken
    lens: maintenance
    category: HLT
    severity: high
    entity: ec2-instance
    refresh: 1h
    why: An impaired system or instance status check means the host or the OS is not reachable; whatever runs there is down or degraded.
    fix: For a system check, stop and start the instance (new host); for an instance check, look at the console log, disk and network configuration.
    refs: [NIST-800-53:SI-4, NIST-800-53:CP-2]
    query:
      protocol: aws
      service: ec2
      action: DescribeInstanceStatus
      params: { IncludeAllInstances: true }
      items: "//instanceStatusSet/item"
      key: instanceId
    each:
      any:
        - { field: systemStatus.status, op: eq, value: impaired }
        - { field: instanceStatus.status, op: eq, value: impaired }
    evidence: "instance {instanceId} ({_account} {_region}): system {systemStatus.status}, instance {instanceStatus.status}"

  - id: AWS-EC2-LAUNCH-TEMPLATE-IMDSV1
    title: Launch template does not require IMDSv2
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: launch-template
    refresh: 7d
    why: Every instance launched from the template's default version allows IMDSv1 unless the account default says otherwise, so the credential-theft path comes back with each scale-out.
    fix: Create a new template version with HttpTokens required and make it the default (and the one the Auto Scaling groups use).
    refs: [FSBP:EC2.170, NIST-800-53:AC-6, MITRE-ATTACK:T1552.005]
    query:
      protocol: aws
      service: ec2
      action: DescribeLaunchTemplateVersions
      params: { "LaunchTemplateVersion.1": "$Default" }
      items: "//launchTemplateVersionSet/item"
      key: "{_account}|{_region}|{launchTemplateId}"
      name: launchTemplateName
    each:
      any:
        - { field: launchTemplateData.metadataOptions.httpTokens, op: absent }
        - { field: launchTemplateData.metadataOptions.httpTokens, op: ne, value: required }
    evidence: "launch template {launchTemplateName} v{versionNumber} ({_account} {_region}): httpTokens {launchTemplateData.metadataOptions.httpTokens}"

  - id: AWS-EC2-LAUNCH-TEMPLATE-PUBLIC-IP
    title: Launch template assigns public IP addresses
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: launch-template
    refresh: 7d
    why: Instances launched from the template get a public address on their network interface, exposing each one directly.
    fix: Remove associatePublicIpAddress from the template's network interfaces and front the instances with a load balancer.
    refs: [FSBP:EC2.25, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: ec2
      action: DescribeLaunchTemplateVersions
      params: { "LaunchTemplateVersion.1": "$Default" }
      items: "//launchTemplateVersionSet/item"
      key: "{_account}|{_region}|{launchTemplateId}"
      name: launchTemplateName
    each:
      element:
        of: launchTemplateData.networkInterfaceSet.item
        where: { field: associatePublicIpAddress, op: eq, value: true }
    evidence: "launch template {launchTemplateName} v{versionNumber} ({_account} {_region}) assigns public IPs"

  - id: AWS-TGW-AUTO-ACCEPT-ATTACHMENTS
    title: Transit gateway accepts shared attachments automatically
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: transit-gateway
    refresh: 7d
    why: With auto-accept on, any account the gateway is shared with can attach a VPC and join the routed network with no review.
    fix: Turn off auto-accept of shared attachments and accept each attachment deliberately.
    refs: [FSBP:EC2.23, NIST-800-53:SC-7, NIST-800-53:CA-3]
    query:
      protocol: aws
      service: ec2
      action: DescribeTransitGateways
      items: "//transitGatewaySet/item"
      key: transitGatewayId
    each: { field: options.autoAcceptSharedAttachments, op: eq, value: enable }
    evidence: "transit gateway {transitGatewayId} ({_account} {_region}) auto-accepts shared attachments"

  - id: AWS-VPN-TUNNEL-LOGGING-OFF
    title: Site-to-site VPN tunnel activity logging is off
    kind: missing
    lens: both
    category: LOG
    severity: low
    entity: vpn-connection
    refresh: 7d
    why: Tunnel logs (IKE negotiation, DPD, BGP) are what explains a flapping or failed tunnel; without them each outage starts from guesswork.
    fix: Enable CloudWatch Logs delivery on both tunnels' options.
    refs: [NIST-800-53:AU-12, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: ec2
      action: DescribeVpnConnections
      items: "//vpnConnectionSet/item"
      key: vpnConnectionId
    each:
      all:
        - { field: state, op: eq, value: available }
        - element:
            of: options.tunnelOptionSet.item
            where:
              any:
                - { field: logOptions.cloudWatchLogOptions.logEnabled, op: absent }
                - { field: logOptions.cloudWatchLogOptions.logEnabled, op: eq, value: false }
    evidence: "VPN {vpnConnectionId} ({_account} {_region}): a tunnel has no activity logging"

  - id: AWS-CLIENT-VPN-NO-CONNECTION-LOG
    title: Client VPN endpoint does not log connections
    kind: missing
    lens: security
    category: LOG
    severity: low
    entity: client-vpn-endpoint
    refresh: 7d
    why: Without connection logs there is no record of which user connected from where and when - the first question after a remote-access incident.
    fix: Enable connection logging to a CloudWatch Logs group on the endpoint.
    refs: [FSBP:EC2.51, NIST-800-53:AU-12, NIST-800-53:AC-17]
    query:
      protocol: aws
      service: ec2
      action: DescribeClientVpnEndpoints
      items: "//clientVpnEndpoint/item"
      key: clientVpnEndpointId
    each: { field: connectionLogOptions.enabled, op: eq, value: false }
    evidence: "Client VPN endpoint {clientVpnEndpointId} ({_account} {_region}) does not log connections"

  - id: AWS-EC2-RESERVATION-EXPIRING
    title: EC2 reserved instance expires soon
    kind: broken
    lens: maintenance
    category: CST
    severity: low
    entity: reserved-instance
    refresh: 7d
    why: When a reservation ends the instances it covered fall back to on-demand prices with no notice; renewing or replacing it is a decision to make before the date.
    fix: Decide with the owner whether to renew, move to a Savings Plan, or let it lapse.
    refs: [NIST-800-53:SA-4]
    deadline: end
    query:
      protocol: aws
      service: ec2
      action: DescribeReservedInstances
      items: "//reservedInstancesSet/item"
      key: reservedInstancesId
    each:
      all:
        - { field: state, op: eq, value: active }
        - { field: end, op: until-lt, value: 30, threshold: aws.ec2.reservation-notice-days }
    evidence: "reservation {reservedInstancesId} ({_account} {_region}): {instanceCount} x {instanceType} ends {end}"

  - id: AWS-ENI-UNUSED
    title: Network interface not attached to anything
    kind: misconfigured
    lens: maintenance
    category: HYG
    severity: low
    entity: network-interface
    refresh: 7d
    why: A detached interface keeps its private (and possibly public) address and security groups, and clutters the picture of what is on the network.
    fix: Delete interfaces nothing uses.
    refs: [NIST-800-53:CM-8]
    query:
      protocol: aws
      service: ec2
      action: DescribeNetworkInterfaces
      params: { "Filter.1.Name": status, "Filter.1.Value.1": available }
      items: "//networkInterfaceSet/item"
      key: networkInterfaceId
    each: any
    evidence: "interface {networkInterfaceId} ({_account} {_region}) in {subnetId}: {description}"

  # ---- RDS and Redshift -------------------------------------------------------------------------

  - id: AWS-RDS-PUBLIC
    title: RDS instance is publicly accessible
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: rds-instance
    why: A publicly accessible database gets a public endpoint; with a weak security group or password it is directly reachable from the internet, where databases are scanned constantly.
    fix: Set PubliclyAccessible off (the database moves to private addressing) and reach it from inside the VPC or over private connectivity only.
    refs: [CIS-AWS:2.3.3, FSBP:RDS.2, NIST-800-53:SC-7, NIST-800-53:AC-3]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each: { field: PubliclyAccessible, op: eq, value: true }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): publicly accessible, engine {Engine} {EngineVersion}"

  - id: AWS-RDS-STORAGE-UNENCRYPTED
    title: RDS instance storage not encrypted at rest
    kind: misconfigured
    lens: security
    category: PKI
    severity: high
    entity: rds-instance
    why: An unencrypted database stores its data and its snapshots in the clear; encryption cannot be turned on in place later, so it is a rebuild if missed now.
    fix: Recreate the instance from an encrypted snapshot (encrypt during the copy); set EBS/RDS encryption defaults so new databases are encrypted.
    refs: [CIS-AWS:2.3.1, FSBP:RDS.3, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each:
      all:
        - { field: Engine, op: notmatch, value: '^(aurora|docdb|neptune)' }
        - { field: ReadReplicaSourceDBInstanceIdentifier, op: absent }
        - { field: StorageEncrypted, op: eq, value: false }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): storage encrypted {StorageEncrypted}"

  - id: AWS-RDS-NOT-MULTI-AZ
    title: RDS instance is single-AZ
    kind: misconfigured
    lens: maintenance
    category: AVL
    severity: medium
    entity: rds-instance
    why: A single-AZ database has no standby; an AZ problem or a failed instance is a full outage with recovery only from backup, not a failover of a minute or two.
    fix: Enable Multi-AZ for production databases; record an exception for the ones that are deliberately single-AZ (test, dev).
    refs: [FSBP:RDS.5, NIST-800-53:CP-2, NIST-800-53:SC-36]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each:
      all:
        - { field: Engine, op: notmatch, value: '^(aurora|docdb|neptune)' }
        - { field: ReadReplicaSourceDBInstanceIdentifier, op: absent }
        - { field: MultiAZ, op: eq, value: false }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): Multi-AZ {MultiAZ}, engine {Engine}"

  - id: AWS-RDS-BACKUP-RETENTION-SHORT
    title: RDS automated backup retention is too short
    kind: misconfigured
    lens: both
    category: BCK
    severity: high
    entity: rds-instance
    why: The backup retention period is also the point-in-time recovery window; set to zero it means automated backups are off, and a few days is not enough to recover from a problem found late.
    fix: Set the backup retention to at least a week (longer for production and regulated data) and confirm the backup window.
    refs: [FSBP:RDS.11, NIST-800-53:CP-9]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each:
      all:
        - { field: Engine, op: notmatch, value: '^(aurora|docdb|neptune)' }
        - { field: ReadReplicaSourceDBInstanceIdentifier, op: absent }
        - { field: BackupRetentionPeriod, op: lt, value: 7, threshold: aws.rds.min-backup-retention-days }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): backup retention {BackupRetentionPeriod} day(s)"

  - id: AWS-RDS-AUTO-MINOR-UPGRADE-OFF
    title: RDS auto minor version upgrade disabled
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: low
    entity: rds-instance
    why: Minor engine versions carry security fixes; with auto minor upgrade off, the database stays on an old minor version until someone upgrades it by hand, which rarely happens.
    fix: Turn on auto minor version upgrade and confirm the maintenance window is outside working hours.
    refs: [CIS-AWS:2.3.2, FSBP:RDS.13, NIST-800-53:SI-2]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each: { field: AutoMinorVersionUpgrade, op: eq, value: false }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): auto minor upgrade off, {Engine} {EngineVersion}"

  - id: AWS-REDSHIFT-PUBLIC
    title: Redshift cluster is publicly accessible
    kind: misconfigured
    lens: security
    category: AUT
    severity: high
    entity: redshift-cluster
    why: A publicly accessible Redshift cluster exposes its endpoint to the internet, where a weak security group or credential is directly exploitable against the warehouse's data.
    fix: Set PubliclyAccessible off and reach the cluster from inside the VPC or over private connectivity only.
    refs: [FSBP:Redshift.1, NIST-800-53:SC-7, NIST-800-53:AC-3]
    query:
      protocol: aws
      service: redshift
      action: DescribeClusters
      items: "//Cluster"
      key: "{_account}|{_region}|{ClusterIdentifier}"
    each: { field: PubliclyAccessible, op: eq, value: true }
    evidence: "cluster {ClusterIdentifier} ({_account} {_region}): publicly accessible"

  - id: AWS-RDS-DELETION-PROTECTION-OFF
    title: RDS instance without deletion protection
    kind: misconfigured
    lens: both
    category: AVL
    severity: medium
    entity: rds-instance
    why: Without deletion protection one API call or console click removes the database; with it, deletion needs a deliberate second change.
    fix: Turn on deletion protection for production databases (Aurora members inherit it from their cluster and are skipped here).
    refs: [FSBP:RDS.8, NIST-800-53:CP-9, MITRE-ATTACK:T1485]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each:
      all:
        - { field: Engine, op: notmatch, value: '^(aurora|docdb|neptune)' }
        - { field: DeletionProtection, op: eq, value: false }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): deletion protection off, {Engine}"

  - id: AWS-RDS-IAM-AUTH-OFF
    title: RDS instance does not allow IAM database authentication
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: rds-instance
    refresh: 7d
    why: IAM authentication replaces long-lived database passwords with short-lived tokens tied to an AWS identity, so access follows the identity lifecycle.
    fix: Enable IAM database authentication and move applications and people to IAM-issued tokens where the engine supports it.
    refs: [FSBP:RDS.10, NIST-800-53:IA-2, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each:
      all:
        - { field: Engine, op: match, value: '^(mysql|mariadb|postgres)$' }
        - { field: IAMDatabaseAuthenticationEnabled, op: eq, value: false }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): IAM authentication off, {Engine}"

  - id: AWS-RDS-LOGS-NOT-EXPORTED
    title: RDS instance exports no logs to CloudWatch
    kind: missing
    lens: security
    category: LOG
    severity: medium
    entity: rds-instance
    refresh: 7d
    why: Database error, audit and connection logs that stay on the instance are lost with it and are not searchable centrally; investigations of database access start there.
    fix: Export the engine's error/audit/general (or postgresql) logs to CloudWatch Logs with a retention policy.
    refs: [FSBP:RDS.9, NIST-800-53:AU-12, NIST-800-53:AU-6]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each:
      all:
        - { field: Engine, op: notmatch, value: '^(aurora|docdb|neptune)' }
        - { field: EnabledCloudwatchLogsExports.member, op: absent }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): no log exports, {Engine}"

  - id: AWS-RDS-ENHANCED-MONITORING-OFF
    title: RDS instance without enhanced monitoring
    kind: missing
    lens: maintenance
    category: MON
    severity: low
    entity: rds-instance
    refresh: 7d
    why: Enhanced monitoring shows OS-level CPU, memory and I/O per process; without it a slow database is diagnosed from coarse hypervisor metrics only.
    fix: Enable enhanced monitoring (60 seconds is enough for most) on production databases.
    refs: [FSBP:RDS.6, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each: { field: MonitoringInterval, op: eq, value: 0 }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): enhanced monitoring off"

  - id: AWS-RDS-COPY-TAGS-OFF
    title: RDS instance does not copy tags to snapshots
    kind: misconfigured
    lens: maintenance
    category: HYG
    severity: low
    entity: rds-instance
    refresh: 7d
    why: Snapshots without the instance's tags lose their owner, environment and data-class labels, so retention and access policies keyed on tags miss them.
    fix: Turn on copy tags to snapshots.
    refs: [FSBP:RDS.17, NIST-800-53:CM-8]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each:
      all:
        - { field: Engine, op: notmatch, value: '^(aurora|docdb|neptune)' }
        - { field: CopyTagsToSnapshot, op: eq, value: false }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): copy tags to snapshots off"

  - id: AWS-RDS-DEFAULT-PORT
    title: RDS instance listens on its engine's default port
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: rds-instance
    refresh: 7d
    why: A database on its well-known port is found by the first scan; a non-default port is no defence by itself but removes it from opportunistic sweeps.
    fix: Use a non-default port at the next rebuild, alongside private addressing and tight security groups.
    refs: [FSBP:RDS.23, NIST-800-53:CM-7]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each:
      any:
        - all: [ { field: Engine, op: match, value: '(mysql|mariadb)' }, { field: Endpoint.Port, op: eq, value: 3306 } ]
        - all: [ { field: Engine, op: match, value: 'postgres' }, { field: Endpoint.Port, op: eq, value: 5432 } ]
        - all: [ { field: Engine, op: match, value: '^oracle' }, { field: Endpoint.Port, op: eq, value: 1521 } ]
        - all: [ { field: Engine, op: match, value: '^sqlserver' }, { field: Endpoint.Port, op: eq, value: 1433 } ]
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): {Engine} on port {Endpoint.Port}"

  - id: AWS-RDS-CA-CERT-EXPIRY
    title: RDS instance server certificate (CA) expiring soon
    kind: broken
    lens: both
    category: PKI
    severity:
      daysLeft: CertificateDetails.ValidTill
      ranges: [ { max: 0, value: critical }, { max: 14, value: high }, { max: 30, value: medium } ]
      default: low
    entity: rds-instance
    deadline: CertificateDetails.ValidTill
    why: When the instance's server certificate expires, clients that verify TLS stop connecting; rotating to a new CA needs a restart and client trust stores updated first.
    fix: Move the instance to a current CA (rds-ca-rsa2048-g1 or newer) in a maintenance window after confirming clients trust it.
    refs: [NIST-800-53:SC-12, NIST-800-53:SC-17]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each: { field: CertificateDetails.ValidTill, op: until-lt, value: 60, threshold: aws.rds.ca-notice-days }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): CA {CACertificateIdentifier} valid until {CertificateDetails.ValidTill}"

  - id: AWS-RDS-DEFAULT-ADMIN-USER
    title: RDS instance uses a default administrator name
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: rds-instance
    refresh: 7d
    why: A well-known master user name (admin, postgres, root, sa) halves what a password-guessing attack has to find.
    fix: Use a non-default master user name at the next rebuild, and keep the master password in Secrets Manager with rotation.
    refs: [FSBP:RDS.25, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each:
      all:
        - { field: Engine, op: notmatch, value: '^(aurora|docdb|neptune)' }
        - { field: MasterUsername, op: in, value: [admin, administrator, root, postgres, sa, master, dbadmin] }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): master user {MasterUsername}"

  - id: AWS-RDS-STATUS-PROBLEM
    title: RDS instance in a failed or incompatible state
    kind: broken
    lens: maintenance
    category: HLT
    severity: high
    entity: rds-instance
    refresh: 1h
    why: A database that is failed, out of storage, unable to reach its encryption key or stuck in an incompatible configuration is down or about to be.
    fix: Act on the state - add storage, restore key access, fix the parameter or network setting - and confirm the instance returns to available.
    refs: [NIST-800-53:SI-4, NIST-800-53:CP-2]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each: { field: DBInstanceStatus, op: in, value: [failed, storage-full, incompatible-parameters, incompatible-network, incompatible-restore, incompatible-option-group, incompatible-credentials, inaccessible-encryption-credentials, inaccessible-encryption-credentials-recoverable, restore-error, insufficient-capacity] }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): status {DBInstanceStatus}"

  - id: AWS-RDS-DEFAULT-PARAMETER-GROUP
    title: RDS instance uses a default parameter group
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: rds-instance
    refresh: 7d
    why: Default parameter groups cannot be changed, so TLS enforcement, logging and other hardening parameters cannot be set for the instance until it moves to a custom group.
    fix: Create a custom parameter group with the hardening settings (force SSL, logging) and assign it at the next maintenance window.
    refs: [NIST-800-53:CM-6]
    query:
      protocol: aws
      service: rds
      action: DescribeDBInstances
      items: "//DBInstance"
      key: "{_account}|{_region}|{DBInstanceIdentifier}"
    each: { field: DBParameterGroups.DBParameterGroup.DBParameterGroupName, op: match, value: '^default\.' }
    evidence: "database {DBInstanceIdentifier} ({_account} {_region}): parameter group {DBParameterGroups.DBParameterGroup.DBParameterGroupName}"

  - id: AWS-RDS-MAINTENANCE-FORCED-SOON
    title: RDS resource has maintenance that will be applied automatically soon
    kind: broken
    lens: maintenance
    category: LCM
    severity: medium
    entity: rds-instance
    refresh: 1d
    why: Pending maintenance with a forced or auto-apply date (engine upgrade, CA rotation, OS patch) is applied whether or not the owner is ready, often with a restart.
    fix: Apply the action in a window of your choosing before the date, after testing the change.
    refs: [NIST-800-53:SI-2, NIST-800-53:MA-2]
    query:
      protocol: aws
      service: rds
      action: DescribePendingMaintenanceActions
      items: "//ResourcePendingMaintenanceActions"
      key: ResourceIdentifier
    each:
      element:
        of: PendingMaintenanceActionDetails.PendingMaintenanceActionDetail
        where:
          any:
            - { field: ForcedApplyDate, op: until-lt, value: 30, threshold: aws.rds.maintenance-notice-days }
            - { field: AutoAppliedAfterDate, op: until-lt, value: 30, threshold: aws.rds.maintenance-notice-days }
    evidence: "{ResourceIdentifier}: {PendingMaintenanceActionDetails.PendingMaintenanceActionDetail.Action}{PendingMaintenanceActionDetails.PendingMaintenanceActionDetail[].Action} forced {PendingMaintenanceActionDetails.PendingMaintenanceActionDetail.ForcedApplyDate}{PendingMaintenanceActionDetails.PendingMaintenanceActionDetail[].ForcedApplyDate}"

  - id: AWS-RDS-CLUSTER-UNENCRYPTED
    title: Aurora / DocumentDB / Neptune cluster storage not encrypted
    kind: misconfigured
    lens: security
    category: PKI
    severity: high
    entity: db-cluster
    why: An unencrypted cluster stores its data, logs and snapshots in the clear, and encryption cannot be turned on in place.
    fix: Restore a snapshot into a new cluster with encryption on and cut over; enforce encryption by SCP or Config rule for new clusters.
    refs: [FSBP:RDS.27, FSBP:DocumentDB.1, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: rds
      action: DescribeDBClusters
      items: "//DBCluster"
      key: "{_account}|{_region}|{DBClusterIdentifier}"
    each: { field: StorageEncrypted, op: eq, value: false }
    evidence: "cluster {DBClusterIdentifier} ({_account} {_region}): {Engine}, storage encrypted {StorageEncrypted}"

  - id: AWS-RDS-CLUSTER-DELETION-PROTECTION-OFF
    title: Database cluster without deletion protection
    kind: misconfigured
    lens: both
    category: AVL
    severity: medium
    entity: db-cluster
    why: Without deletion protection a single call deletes the cluster and its instances.
    fix: Turn on deletion protection for production clusters.
    refs: [FSBP:RDS.7, NIST-800-53:CP-9, MITRE-ATTACK:T1485]
    query:
      protocol: aws
      service: rds
      action: DescribeDBClusters
      items: "//DBCluster"
      key: "{_account}|{_region}|{DBClusterIdentifier}"
    each: { field: DeletionProtection, op: eq, value: false }
