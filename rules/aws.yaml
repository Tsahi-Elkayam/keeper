schema: keeper.rules/1
system: aws
name: Amazon Web Services
integration: aws
# Endpoint: the home region; the integration signs SigV4 with an access key id (secret secretAccessKey)
# and, with accounts+roleName, reads each member account through its read-only role. Rules name only a
# service Keeper knows, a read action (Describe/List/Get/Search/Lookup/BatchGet/Select) and params - never
# an API, version, target or an action that hands over a secret, a credential or content. Regional reads
# fan out over every region the integration names (regions: all); global services (iam, organizations,
# cloudfront, ce) are read once at home; the S3 bucket list is read once at home and each bucket's
# settings in its own region. Per-resource reads use for_each (one request per object, in its own account
# and region); only plain ids go into a path or param, so a resource named with '/' or '@' is skipped
# (the read is then partial, never a pass).
#
# Row shapes: the query APIs (iam, ec2, rds, elasticloadbalancing, autoscaling, cloudformation,
# monitoring, redshift) and s3/cloudfront answer XML - items is the XPath of the elements that are rows,
# repeated children become arrays (ec2's <item> wrappers: vgwTelemetry.item[], ipPermissions...). The
# json and rest-json services answer JSON - items is the path to the array. The exact field paths of the
# XML answers (EC2/RDS/ELB especially) and the presence of summary fields (ACM NotAfter in the list) are
# as the current APIs answer them; a renamed field fails the read and the rule reports unknown, never a
# silent pass. Checks the runner cannot express are in docs/backlog/aws.md.
#
# "Not configured" rules (lambda deprecated-runtime pattern, EKS minimum version, KMS foreign-account
# pattern) carry required: true and
# stay n/a until the tenant sets the threshold, never a pass that compared with nothing.
#
# Patterns the rules lean on:
# - Per-place must-exist: a json/rest-json read with no items is the whole answer as one row per account
#   and region (or per object under for_each), so "no detector / recorder / analyzer / flow log here" is
#   judged per place - e.g. GuardDuty ListDetectors with detectorIds empty, EC2 DescribeFlowLogs per VPC
#   selecting the response element.
# - A list of plain strings (ListDetectors, EKS ListClusters, DynamoDB ListTables, ECS families) becomes
#   rows of { value }, so for_each walks it with field: value.
# - IAM policy documents (GetAccountAuthorizationDetails) arrive URL-encoded; the policy patterns accept
#   the encoded and the raw form. Other resource policies (KMS, Lambda, ECR, SNS, Secrets Manager) are
#   JSON text and are matched as text; an S3 bucket policy is parsed and judged statement by statement.
# - A condition on a field only some rows have is guarded with exists inside an all, so rows without it
#   pass instead of reading as unknown.
defaults:
  lens: both
  refresh: 1d
rules:

  # ---- IAM: root, users, keys, password policy, federation --------------------------------------

  - id: AWS-IAM-ROOT-ACCESS-KEYS
    title: Account root user has an access key
    kind: misconfigured
    lens: security
    category: IAM
    severity: critical
    entity: account
    why: A root access key is a long-lived credential with unrestricted power over the whole account and no way to scope or alarm it well; it should never exist.
    fix: Delete the root access keys from each account's security credentials page; use roles and Identity Center for all access.
    refs: [CIS-AWS:1.4, FSBP:IAM.4, NIST-800-53:AC-6, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: iam
      action: GetAccountSummary
      items: "//entry"
      key: "{_account}|{key}"
      min_rows: 1
    each:
      all:
        - { field: key, op: eq, value: AccountAccessKeysPresent }
        - { field: value, op: gt, value: 0 }
    evidence: "account {_account}: {value} root access key(s) present"

  - id: AWS-IAM-ROOT-MFA-DISABLED
    title: Account root user has no MFA
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: account
    why: Without MFA the root user is one leaked or guessed password away from full control of the account; CIS requires it on every account, hardware for the most privileged.
    fix: Enable MFA for the root user of every account (a hardware key or passkey for the payer, LogArchive and Audit).
    refs: [CIS-AWS:1.5, FSBP:IAM.6, NIST-800-53:IA-2]
    query:
      protocol: aws
      service: iam
      action: GetAccountSummary
      items: "//entry"
      key: "{_account}|{key}"
      min_rows: 1
    each:
      all:
        - { field: key, op: eq, value: AccountMFAEnabled }
        - { field: value, op: lt, value: 1 }
    evidence: "account {_account}: root MFA enabled flag {value}"

  - id: AWS-IAM-USER-EXISTS
    title: IAM user with long-lived credentials exists
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: iam-user
    why: An IAM user is a standing credential outside the federated, conditional-access sign-in path; each one should exist only where federation cannot work and have a named owner.
    fix: Move the access to IAM Identity Center (SSO); where an IAM user is truly needed, tag it with an owner and a purpose and review it.
    refs: [NIST-800-53:AC-2, NIST-800-53:IA-2, CIS-AWS:1.21]
    query:
      protocol: aws
      service: iam
      action: ListUsers
      items: "//member"
      key: "{_account}|{UserName}"
      name: UserName
    each: any
    evidence: "account {_account}: IAM user {UserName}, created {CreateDate}, password last used {PasswordLastUsed}"

  - id: AWS-IAM-ACCESS-KEY-OLD
    title: Active IAM access key older than 90 days
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: access-key
    why: An access key that is never rotated stays valid for everyone who has ever held it; the longer it lives the more copies exist and the longer a leak goes unnoticed.
    fix: Rotate the key (create a new one, move the clients, delete the old), or remove the key and move the workload to a role.
    refs: [CIS-AWS:1.14, NIST-800-53:IA-5, FSBP:IAM.3]
    query:
      protocol: aws
      service: iam
      action: ListAccessKeys
      for_each: { service: iam, action: ListUsers, items: "//member", field: UserName, max: 2000 }
      params: { UserName: "{UserName}" }
      items: "//member"
      key: "{parent.UserName}|{AccessKeyId}"
    each:
      all:
        - { field: Status, op: eq, value: Active }
        - { field: CreateDate, op: age-gt, value: 90, threshold: aws.iam.access-key-max-age-days }
    evidence: "account {_account}: key {AccessKeyId} of {parent.UserName} active since {CreateDate}"

  - id: AWS-IAM-PASSWORD-POLICY-WEAK
    title: IAM account password policy weaker than the baseline
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: account
    why: Where IAM users still have console passwords, a short or reusable password policy lets weak passwords through. An account with no password policy at all is not flagged here (the read fails for it and reads as unknown, never a finding); that gap is in the backlog.
    fix: Set an account password policy with a minimum length of 14, reuse prevention and complexity; better still, remove IAM console passwords and use SSO.
    refs: [CIS-AWS:1.8, CIS-AWS:1.9, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: iam
      action: GetAccountPasswordPolicy
      items: "//PasswordPolicy"
      key: _account
      min_rows: 1
    each: { field: MinimumPasswordLength, op: lt, value: 14, threshold: aws.iam.password-min-length }
    evidence: "account {_account}: minimum password length {MinimumPasswordLength}, reuse prevention {PasswordReusePrevention}"

  - id: AWS-IAM-SAML-PROVIDER-REVIEW
    title: IAM SAML identity provider outside Identity Center
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: identity-provider
    refresh: 7d
    why: A SAML trust configured directly in IAM is a federation path that bypasses Identity Center and its conditional access; each one should be a known, current trust.
    fix: Confirm the provider is a current, intended federation and that the roles trusting it are scoped with sub/aud conditions; remove providers that are not.
    refs: [NIST-800-53:AC-2, NIST-800-53:IA-8]
    query:
      protocol: aws
      service: iam
      action: ListSAMLProviders
      items: "//member"
      key: Arn
    each: any
    evidence: "account {_account}: SAML provider {Arn}, valid until {ValidUntil}"

  - id: AWS-IAM-OIDC-PROVIDER-REVIEW
    title: IAM OpenID Connect identity provider configured
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: identity-provider
    refresh: 7d
    why: An OIDC provider (a CI/CD platform, a Kubernetes cluster) lets external workloads assume roles; a stale or over-trusting provider is a quiet way into the account.
    fix: Confirm each OIDC provider and the roles trusting it (audience and subject conditions); remove any that are no longer used.
    refs: [NIST-800-53:AC-2, NIST-800-53:IA-8]
    query:
      protocol: aws
      service: iam
      action: ListOpenIDConnectProviders
      items: "//member"
      key: Arn
    each: any
    evidence: "account {_account}: OIDC provider {Arn}"

  - id: AWS-IAM-SERVER-CERT-EXPIRY
    title: IAM-stored server certificate expiring or expired
    kind: broken
    lens: security
    category: PKI
    severity:
      daysLeft: Expiration
      ranges: [ { max: 14, value: high }, { max: 30, value: medium } ]
      default: low
    entity: certificate
    why: A certificate uploaded to IAM has no managed renewal; when it expires whatever serves it (an old-style ELB listener, a CloudFront origin) fails its TLS handshake.
    fix: Replace it with an ACM-managed certificate where possible, or upload a renewed one and update what references it; delete unused ones.
    refs: [NIST-800-53:SC-12, NIST-800-53:SC-17]
    deadline: Expiration
    query:
      protocol: aws
      service: iam
      action: ListServerCertificates
      items: "//member"
      key: Arn
      name: ServerCertificateName
    each: { field: Expiration, op: until-lt, value: 30, threshold: aws.iam.server-cert-notice-days }
    evidence: "account {_account}: IAM certificate {ServerCertificateName} expires {Expiration}"

  - id: AWS-IAM-ROOT-SIGNING-CERT
    title: Account root user has an X.509 signing certificate
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: account
    why: A signing certificate on the root user is a long-lived root credential for the old SOAP APIs; like a root access key it cannot be scoped and should not exist.
    fix: Delete the root user's signing certificates from the account's security credentials page.
    refs: [CIS-AWS:1.4, NIST-800-53:AC-6, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: iam
      action: GetAccountSummary
      items: "//entry"
      key: "{_account}|{key}"
      min_rows: 1
    each:
      all:
        - { field: key, op: eq, value: AccountSigningCertificatesPresent }
        - { field: value, op: gt, value: 0 }
    evidence: "account {_account}: {value} root signing certificate(s) present"

  - id: AWS-IAM-ROOT-VIRTUAL-MFA
    title: Account root user protected by a virtual (app) MFA device only
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: account
    refresh: 7d
    why: CIS asks for a hardware key on the root user; a virtual MFA lives on a phone that can be lost, cloned or phished, and the root user is the one credential that cannot be locked down by policy.
    fix: Register a hardware security key (FIDO2 or a hardware TOTP token) for the root user and remove the virtual device; store the key in a safe with a documented break-glass procedure.
    refs: [CIS-AWS:1.6, FSBP:IAM.6, NIST-800-53:IA-2]
    query:
      protocol: aws
      service: iam
      action: ListVirtualMFADevices
      params: { AssignmentStatus: Assigned }
      items: "//VirtualMFADevices/member"
      key: SerialNumber
    each: { field: User.Arn, op: match, value: ':root$' }
    evidence: "account {_account}: the root user's MFA is the virtual device {SerialNumber}"

  - id: AWS-IAM-PASSWORD-REUSE-ALLOWED
    title: IAM password policy allows reusing recent passwords
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: account
    why: Without reuse prevention a user forced to change a leaked password can set the same one again, and the change achieves nothing.
    fix: Set the account password policy to remember the last 24 passwords.
    refs: [CIS-AWS:1.9, FSBP:IAM.16, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: iam
      action: GetAccountPasswordPolicy
      items: "//PasswordPolicy"
      key: _account
      min_rows: 1
    each:
      any:
        - { field: PasswordReusePrevention, op: absent }
        - { field: PasswordReusePrevention, op: lt, value: 24, threshold: aws.iam.password-reuse-count }
    evidence: "account {_account}: password reuse prevention {PasswordReusePrevention}"

  - id: AWS-IAM-PASSWORD-COMPLEXITY-OFF
    title: IAM password policy does not require all character classes
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: account
    why: A policy that does not require upper case, lower case, digits and symbols admits passwords from a much smaller space, which a guessing or spraying attack covers quickly.
    fix: Require upper-case, lower-case, numeric and symbol characters in the account password policy (or remove IAM console passwords and use SSO).
    refs: [FSBP:IAM.11, FSBP:IAM.12, FSBP:IAM.13, FSBP:IAM.14, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: iam
      action: GetAccountPasswordPolicy
      items: "//PasswordPolicy"
      key: _account
      min_rows: 1
    each:
      any:
        - { field: RequireUppercaseCharacters, op: ne, value: true }
        - { field: RequireLowercaseCharacters, op: ne, value: true }
        - { field: RequireNumbers, op: ne, value: true }
        - { field: RequireSymbols, op: ne, value: true }
    evidence: "account {_account}: upper {RequireUppercaseCharacters}, lower {RequireLowercaseCharacters}, numbers {RequireNumbers}, symbols {RequireSymbols}"

  - id: AWS-IAM-PASSWORD-NO-EXPIRY
    title: IAM password policy does not expire passwords within 90 days
    kind: misconfigured
    lens: security
    category: AUT
    severity: info
    entity: account
    refresh: 7d
    why: Some frameworks (FSBP, PCI) still ask for 90-day expiry; current NIST guidance prefers no forced expiry with breach checks instead, so this is informational - decide which baseline applies and record it.
    fix: Either set a maximum password age of 90 days, or record the decision to follow NIST 800-63B (no forced expiry) as an exception.
    refs: [FSBP:IAM.17, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: iam
      action: GetAccountPasswordPolicy
      items: "//PasswordPolicy"
      key: _account
      min_rows: 1
    each:
      any:
        - { field: MaxPasswordAge, op: absent }
        - { field: MaxPasswordAge, op: gt, value: 90, threshold: aws.iam.password-max-age-days }
    evidence: "account {_account}: maximum password age {MaxPasswordAge}"

  - id: AWS-IAM-PASSWORD-NO-SELF-CHANGE
    title: IAM users cannot change their own password
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: account
    refresh: 7d
    why: If users cannot change their own password, a password that may have leaked stays in use until an administrator resets it.
    fix: Allow users to change their own password in the account password policy.
    refs: [NIST-800-53:IA-5]
    query:
      protocol: aws
      service: iam
      action: GetAccountPasswordPolicy
      items: "//PasswordPolicy"
      key: _account
      min_rows: 1
    each: { field: AllowUsersToChangePassword, op: ne, value: true }
    evidence: "account {_account}: users may change their password {AllowUsersToChangePassword}"

  - id: AWS-IAM-USER-CONSOLE-PASSWORD
    title: IAM user has a console password
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: iam-user
    why: A console password on an IAM user is a sign-in path outside the organisation's identity provider, its MFA and conditional access, and its joiner/leaver process.
    fix: Move console access to IAM Identity Center and delete the user's login profile; where a console password must stay, require MFA and record an owner.
    refs: [CIS-AWS:1.21, NIST-800-53:IA-2, NIST-800-53:AC-2]
    query:
      protocol: aws
      service: iam
      action: GetLoginProfile
      for_each: { service: iam, action: ListUsers, items: "//member", field: UserName, max: 2000 }
      params: { UserName: "{UserName}" }
      items: "//LoginProfile"
      missing: empty
      key: "{parent.Arn}"
      name: UserName
    each: any
    evidence: "account {_account}: IAM user {parent.UserName} has a console password (created {CreateDate}, reset required {PasswordResetRequired})"

  - id: AWS-IAM-USER-NO-MFA
    title: IAM user has no MFA device
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: iam-user
    why: An IAM user without MFA is one leaked password away from use; where the user has a console password it is the classic account-takeover path.
    fix: Register an MFA device for the user (a security key where possible), or delete the user's console password and move it to Identity Center.
    refs: [CIS-AWS:1.10, FSBP:IAM.5, FSBP:IAM.19, NIST-800-53:IA-2]
    query:
      protocol: aws
      service: iam
      action: ListMFADevices
      for_each: { service: iam, action: ListUsers, items: "//member", field: UserName, max: 2000 }
      params: { UserName: "{UserName}" }
      items: "//ListMFADevicesResult"
      key: "{parent.Arn}"
    each: { field: MFADevices.member, op: absent }
    evidence: "account {_account}: IAM user {parent.UserName} has no MFA device (password last used {parent.PasswordLastUsed})"

  - id: AWS-IAM-USER-PASSWORD-UNUSED
    title: IAM user console password unused for 45 days
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: iam-user
    why: A console password nobody has used for weeks is a standing credential with no owner watching it; CIS asks to disable credentials unused for 45 days.
    fix: Remove the user's console password (or the user); if it is a break-glass user, record that so it is reviewed rather than removed.
    refs: [CIS-AWS:1.12, FSBP:IAM.8, FSBP:IAM.22, NIST-800-53:AC-2]
    query:
      protocol: aws
      service: iam
      action: ListUsers
      items: "//member"
      key: "{_account}|{UserName}"
      name: UserName
    each: { field: PasswordLastUsed, op: age-gt, value: 45, threshold: aws.iam.unused-credential-days }
    evidence: "account {_account}: IAM user {UserName} last used the console password {PasswordLastUsed}"

  - id: AWS-IAM-ACCESS-KEY-INACTIVE
    title: Inactive IAM access key not deleted
    kind: misconfigured
    lens: maintenance
    category: HYG
    severity: low
    entity: access-key
    refresh: 7d
    why: A deactivated key can be reactivated by anyone with iam:UpdateAccessKey; once a key is no longer needed it should be deleted, not parked.
    fix: Confirm nothing still uses the key and delete it.
    refs: [NIST-800-53:IA-5, NIST-800-53:AC-2]
    query:
      protocol: aws
      service: iam
      action: ListAccessKeys
      for_each: { service: iam, action: ListUsers, items: "//member", field: UserName, max: 2000 }
      params: { UserName: "{UserName}" }
      items: "//member"
      key: "{parent.UserName}|{AccessKeyId}"
    each: { field: Status, op: eq, value: Inactive }
    evidence: "account {_account}: key {AccessKeyId} of {parent.UserName} is inactive, created {CreateDate}"

  - id: AWS-IAM-USER-MULTIPLE-ACTIVE-KEYS
    title: IAM user has more than one active access key
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: iam-user
    why: Two active keys usually mean a rotation that was never finished; the old key stays valid in places nobody tracks.
    fix: Finish the rotation - move every client to one key and delete the other.
    refs: [CIS-AWS:1.13, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: iam
      action: ListAccessKeys
      for_each: { service: iam, action: ListUsers, items: "//member", field: UserName, max: 2000 }
      params: { UserName: "{UserName}" }
      items: "//member"
      key: "{parent.UserName}|{AccessKeyId}"
    count:
      op: gt
      value: 1
      by: parent.Arn
      where: { field: Status, op: eq, value: Active }
    evidence: "{count} active access keys"

  - id: AWS-IAM-USER-DIRECT-POLICY
    title: IAM user has a managed policy attached directly
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: iam-user
    refresh: 7d
    why: Permissions attached to individual users drift and are missed in reviews; granting through groups (or roles) keeps who-can-do-what in a few places.
    fix: Move the policy to a group (or to an Identity Center permission set) and detach it from the user.
    refs: [CIS-AWS:1.15, FSBP:IAM.2, NIST-800-53:AC-6]
    query:
      protocol: aws
      service: iam
      action: ListAttachedUserPolicies
      for_each: { service: iam, action: ListUsers, items: "//member", field: UserName, max: 2000 }
      params: { UserName: "{UserName}" }
      items: "//AttachedPolicies/member"
      key: "{parent.Arn}|{PolicyArn}"
    each: any
    evidence: "account {_account}: user {parent.UserName} has {PolicyName} attached directly"

  - id: AWS-IAM-USER-ADMIN-ATTACHED
    title: IAM user has AdministratorAccess attached
    kind: misconfigured
    lens: security
    category: IAM
    severity: high
    entity: iam-user
    why: An IAM user with AdministratorAccess holds full control of the account behind a long-lived password or key, outside federation and its conditional access.
    fix: Remove AdministratorAccess from the user; give administrators a federated role through Identity Center and keep at most a documented break-glass user.
    refs: [CIS-AWS:1.16, NIST-800-53:AC-6, NIST-800-53:AC-2, MITRE-ATTACK:T1078.004]
    query:
      protocol: aws
      service: iam
      action: ListAttachedUserPolicies
      for_each: { service: iam, action: ListUsers, items: "//member", field: UserName, max: 2000 }
      params: { UserName: "{UserName}" }
      items: "//AttachedPolicies/member"
      key: "{parent.Arn}|{PolicyArn}"
    each: { field: PolicyArn, op: match, value: ':policy/AdministratorAccess$' }
    evidence: "account {_account}: user {parent.UserName} has {PolicyArn}"

  - id: AWS-IAM-USER-INLINE-POLICY
    title: IAM user has an inline policy
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: iam-user
    refresh: 7d
    why: An inline policy lives only on that user, is invisible in policy lists and cannot be reused or reviewed centrally; it is where forgotten permissions hide.
    fix: Replace the inline policy with a managed policy attached to a group, then delete it.
    refs: [FSBP:IAM.2, NIST-800-53:AC-6]
    query:
      protocol: aws
      service: iam
      action: ListUserPolicies
      for_each: { service: iam, action: ListUsers, items: "//member", field: UserName, max: 2000 }
      params: { UserName: "{UserName}" }
      items: "//PolicyNames/member"
      key: "{parent.Arn}|{_text}"
    each: any
    evidence: "account {_account}: user {parent.UserName} has the inline policy {_text}"

  - id: AWS-IAM-GROUP-INLINE-POLICY
    title: IAM group has an inline policy
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: iam-group
    refresh: 7d
    why: Inline group policies cannot be reused or reviewed with the managed policies, so their permissions are easy to miss in an access review.
    fix: Replace the inline policy with a customer-managed policy attached to the group.
    refs: [NIST-800-53:AC-6]
    query:
      protocol: aws
      service: iam
      action: GetAccountAuthorizationDetails
      params: { "Filter.member.1": LocalManagedPolicy, "Filter.member.2": User, "Filter.member.3": Group, "Filter.member.4": Role }
      items: "//Policies/member | //UserDetailList/member | //GroupDetailList/member | //RoleDetailList/member"
      key: Arn
    each: { field: GroupPolicyList.member, op: exists }
    evidence: "account {_account}: group {GroupName} has inline policies"

  - id: AWS-IAM-GROUP-ADMIN-ATTACHED
    title: IAM group has AdministratorAccess attached
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: iam-group
    refresh: 7d
    why: Every member of the group is an administrator of the account through long-lived IAM user credentials; the group's membership is the account's admin list and should be tiny.
    fix: Confirm the members; move administrators to a federated role and keep the group for break-glass only, or remove the policy.
    refs: [CIS-AWS:1.16, NIST-800-53:AC-6]
    query:
      protocol: aws
      service: iam
      action: GetAccountAuthorizationDetails
      params: { "Filter.member.1": LocalManagedPolicy, "Filter.member.2": User, "Filter.member.3": Group, "Filter.member.4": Role }
      items: "//Policies/member | //UserDetailList/member | //GroupDetailList/member | //RoleDetailList/member"
      key: Arn
    each:
      all:
        - { field: GroupName, op: exists }
        - { field: AttachedManagedPolicies, op: match, value: ':policy/AdministratorAccess"' }
    evidence: "account {_account}: group {GroupName} has AdministratorAccess"

  - id: AWS-IAM-ROLE-ADMIN-ATTACHED
    title: IAM role has AdministratorAccess attached
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: iam-role
    refresh: 7d
    why: Each role with AdministratorAccess is a path to full control of the account for everyone its trust policy admits; the list should be short, known and reviewed.
    fix: Confirm each admin role is intended (break-glass, platform pipeline, Identity Center admin set) and that its trust policy is narrow; scope the rest down.
    refs: [CIS-AWS:1.16, NIST-800-53:AC-6]
    query:
      protocol: aws
      service: iam
      action: GetAccountAuthorizationDetails
      params: { "Filter.member.1": LocalManagedPolicy, "Filter.member.2": User, "Filter.member.3": Group, "Filter.member.4": Role }
      items: "//Policies/member | //UserDetailList/member | //GroupDetailList/member | //RoleDetailList/member"
      key: Arn
    each:
      all:
        - { field: RoleName, op: exists }
        - { field: AttachedManagedPolicies, op: match, value: ':policy/AdministratorAccess"' }
    evidence: "account {_account}: role {RoleName} ({Path}) has AdministratorAccess"

  - id: AWS-IAM-ROLE-UNUSED
    title: IAM role not used for 90 days
    kind: misconfigured
    lens: security
    category: HYG
    severity: low
    entity: iam-role
    refresh: 7d
    why: A role nobody assumes keeps its permissions and its trust open; unused roles are where stale cross-account and CI/CD trusts survive long after their purpose has gone.
    fix: Confirm with the owner and delete the role (or tighten its trust); service-linked roles are excluded.
    refs: [NIST-800-53:AC-2, NIST-800-53:AC-6]
    query:
      protocol: aws
      service: iam
      action: GetAccountAuthorizationDetails
      params: { "Filter.member.1": LocalManagedPolicy, "Filter.member.2": User, "Filter.member.3": Group, "Filter.member.4": Role }
      items: "//Policies/member | //UserDetailList/member | //GroupDetailList/member | //RoleDetailList/member"
      key: Arn
    each:
      all:
        - { field: RoleName, op: exists }
        - { field: Path, op: notmatch, value: '^/(aws-service-role|aws-reserved)/' }
        - { field: CreateDate, op: age-gt, value: 90 }
        - any:
            - { field: RoleLastUsed.LastUsedDate, op: absent }
            - { field: RoleLastUsed.LastUsedDate, op: age-gt, value: 90, threshold: aws.iam.unused-role-days }
    evidence: "account {_account}: role {RoleName} created {CreateDate}, last used {RoleLastUsed.LastUsedDate}"

  - id: AWS-IAM-ROLE-TRUST-ANY-PRINCIPAL
    title: IAM role can be assumed by any AWS principal
    kind: misconfigured
    lens: security
    category: IAM
    severity: critical
    entity: iam-role
    why: A trust policy with Principal "*" (or AWS "*") and no condition lets any AWS account in the world assume the role and use its permissions.
    fix: Replace the wildcard with the specific accounts or roles that must assume it, and add conditions (aws:PrincipalOrgID, sts:ExternalId).
    refs: [NIST-800-53:AC-3, NIST-800-53:AC-6, MITRE-ATTACK:T1078.004]
    query:
      protocol: aws
      service: iam
      action: GetAccountAuthorizationDetails
      params: { "Filter.member.1": LocalManagedPolicy, "Filter.member.2": User, "Filter.member.3": Group, "Filter.member.4": Role }
      items: "//Policies/member | //UserDetailList/member | //GroupDetailList/member | //RoleDetailList/member"
      key: Arn
    each:
      all:
        - { field: AssumeRolePolicyDocument, op: exists }
        - { field: AssumeRolePolicyDocument, op: match, value: '(?:%22|")Principal(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%7B|\{)(?:(?!%7D|\})[\s\S])*?(?:%22|")AWS(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:%22|")))' }
        - { field: AssumeRolePolicyDocument, op: notmatch, value: '(?:%22|")Condition(?:%22|")' }
    evidence: "account {_account}: role {RoleName} trusts any AWS principal with no condition"

  - id: AWS-IAM-ROLE-TRUST-NO-EXTERNAL-ID
    title: IAM role trusted by an AWS account without an external id or organisation condition
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: iam-role
    refresh: 7d
    why: A role that trusts another account's principals with no sts:ExternalId (or aws:PrincipalOrgID) condition is open to the confused-deputy problem - a third party can be tricked into using it for someone else. Same-account and in-organisation trusts may show here and need only a confirmation.
    fix: For third-party access require sts:ExternalId; for in-organisation access add aws:PrincipalOrgID; otherwise narrow the trust to the specific role ARNs.
    refs: [NIST-800-53:AC-3, NIST-800-53:AC-6, MITRE-ATTACK:T1199]
    query:
      protocol: aws
      service: iam
      action: GetAccountAuthorizationDetails
      params: { "Filter.member.1": LocalManagedPolicy, "Filter.member.2": User, "Filter.member.3": Group, "Filter.member.4": Role }
      items: "//Policies/member | //UserDetailList/member | //GroupDetailList/member | //RoleDetailList/member"
      key: Arn
    each:
      all:
        - { field: AssumeRolePolicyDocument, op: exists }
        - { field: AssumeRolePolicyDocument, op: match, value: '(?:%22|")AWS(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?)?(?:%22|")(?:arn(?:%3A|:)aws[a-z-]*(?:%3A|:)iam(?:%3A|:)(?:%3A|:))?\d{12}' }
        - { field: AssumeRolePolicyDocument, op: notmatch, value: 'ExternalId|PrincipalOrgID|PrincipalOrgPaths|MultiFactorAuthPresent' }
    evidence: "account {_account}: role {RoleName} trusts an account principal with no external id or organisation condition"

  - id: AWS-IAM-ROLE-TRUST-GITHUB-NO-SUB
    title: IAM role trusts GitHub Actions OIDC without a subject condition
    kind: misconfigured
    lens: security
    category: IAM
    severity: critical
    entity: iam-role
    why: A role that trusts the GitHub Actions identity provider without a "sub" condition can be assumed by a workflow in any GitHub repository of any owner - anyone can open a repository and take the role.
    fix: Add a StringEquals/StringLike condition on token.actions.githubusercontent.com:sub naming the exact repository (and branch or environment), plus the aud condition.
    refs: [NIST-800-53:AC-3, NIST-800-53:IA-8, MITRE-ATTACK:T1199]
    query:
      protocol: aws
      service: iam
      action: GetAccountAuthorizationDetails
      params: { "Filter.member.1": LocalManagedPolicy, "Filter.member.2": User, "Filter.member.3": Group, "Filter.member.4": Role }
      items: "//Policies/member | //UserDetailList/member | //GroupDetailList/member | //RoleDetailList/member"
      key: Arn
    each:
      all:
        - { field: AssumeRolePolicyDocument, op: exists }
        - { field: AssumeRolePolicyDocument, op: match, value: 'token\.actions\.githubusercontent\.com' }
        - { field: AssumeRolePolicyDocument, op: notmatch, value: 'token\.actions\.githubusercontent\.com(?:%3A|:)sub' }
    evidence: "account {_account}: role {RoleName} trusts GitHub Actions with no sub condition"

  - id: AWS-IAM-ROLE-TRUST-GITHUB-ANY-REPO
    title: IAM role trusts GitHub Actions for any repository
    kind: misconfigured
    lens: security
    category: IAM
    severity: critical
    entity: iam-role
    why: A sub condition of "*" or "repo:*" admits workflows from every GitHub owner, which is the same as no condition at all.
    fix: Narrow the sub condition to repo:<owner>/<repository>:<ref or environment>.
    refs: [NIST-800-53:AC-3, NIST-800-53:IA-8, MITRE-ATTACK:T1199]
    query:
      protocol: aws
      service: iam
      action: GetAccountAuthorizationDetails
      params: { "Filter.member.1": LocalManagedPolicy, "Filter.member.2": User, "Filter.member.3": Group, "Filter.member.4": Role }
      items: "//Policies/member | //UserDetailList/member | //GroupDetailList/member | //RoleDetailList/member"
      key: Arn
    each:
      all:
        - { field: AssumeRolePolicyDocument, op: exists }
        - { field: AssumeRolePolicyDocument, op: match, value: 'githubusercontent\.com(?:%3A|:)sub(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?)?(?:%22|")(?:repo(?:%3A|:))?(?:%2A|\*)(?:%22|")' }
    evidence: "account {_account}: role {RoleName} trusts GitHub Actions from any repository"

  - id: AWS-IAM-SUPPORT-ROLE-NONE
    title: No principal can open AWS support cases
    kind: missing
    lens: maintenance
    category: IAM
    severity: low
    entity: account
    refresh: 7d
    why: CIS asks for a role with AWSSupportAccess so incidents can be raised with AWS by a scoped role instead of the root user or an administrator.
    fix: Create a support role (or permission set) with the AWSSupportAccess managed policy and give it to the operations team.
    refs: [CIS-AWS:1.17, FSBP:IAM.18, NIST-800-53:IR-7]
    query:
      protocol: aws
      service: iam
      action: ListEntitiesForPolicy
      params: { PolicyArn: "arn:aws:iam::aws:policy/AWSSupportAccess" }
      items: "//ListEntitiesForPolicyResult"
      key: _account
      min_rows: 1
    each:
      all:
        - { field: PolicyRoles.member, op: absent }
        - { field: PolicyUsers.member, op: absent }
        - { field: PolicyGroups.member, op: absent }
    evidence: "account {_account}: AWSSupportAccess is attached to nothing"

  - id: AWS-IAM-CLOUDSHELL-FULL-ACCESS
    title: AWSCloudShellFullAccess attached to a principal
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: iam-principal
    refresh: 7d
    why: CloudShell full access includes uploading and downloading files to a shell with the principal's credentials, an easy exfiltration channel that bypasses network controls.
    fix: Detach AWSCloudShellFullAccess and grant a scoped CloudShell policy without file transfer where CloudShell is needed.
    refs: [CIS-AWS:1.22, FSBP:IAM.27, NIST-800-53:AC-6]
    query:
      protocol: aws
      service: iam
      action: ListEntitiesForPolicy
      params: { PolicyArn: "arn:aws:iam::aws:policy/AWSCloudShellFullAccess" }
      items: "//PolicyRoles/member | //PolicyUsers/member | //PolicyGroups/member"
      key: "{_account}|{RoleName}{UserName}{GroupName}"
    each: any
    evidence: "account {_account}: AWSCloudShellFullAccess on {RoleName}{UserName}{GroupName}"

  - id: AWS-IAM-EC2-ROLE-FOR-SSM
    title: Deprecated AmazonEC2RoleforSSM policy still attached
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: iam-principal
    refresh: 7d
    why: The deprecated AmazonEC2RoleforSSM policy grants far more than Systems Manager needs, including broad S3 access, to every instance carrying it.
    fix: Replace it with AmazonSSMManagedInstanceCore plus any scoped extras the instances really need.
    refs: [NIST-800-53:AC-6]
    query:
      protocol: aws
      service: iam
      action: ListEntitiesForPolicy
      params: { PolicyArn: "arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM" }
      items: "//PolicyRoles/member | //PolicyUsers/member | //PolicyGroups/member"
      key: "{_account}|{RoleName}{UserName}{GroupName}"
    each: any
    evidence: "account {_account}: AmazonEC2RoleforSSM on {RoleName}{UserName}{GroupName}"

  - id: AWS-IAM-GROUP-EMPTY
    title: IAM group has no members
    kind: misconfigured
    lens: maintenance
    category: HYG
    severity: low
    entity: iam-group
    refresh: 7d
    why: An empty group keeps its policies ready for whoever is added next; groups nobody uses should be removed so they cannot be quietly re-populated.
    fix: Delete the group, or record why it is kept empty (a break-glass group, for instance).
    refs: [NIST-800-53:AC-2]
    query:
      protocol: aws
      service: iam
      action: GetGroup
      for_each: { service: iam, action: ListGroups, items: "//Groups/member", field: GroupName, max: 2000 }
      params: { GroupName: "{GroupName}" }
      items: "//GetGroupResult"
      key: "{parent.Arn}"
    each: { field: Users.member, op: absent }
    evidence: "account {_account}: group {parent.GroupName} has no members"

  - id: AWS-IAM-POLICY-UNATTACHED
    title: Customer-managed IAM policy is attached to nothing
    kind: misconfigured
    lens: maintenance
    category: HYG
    severity: low
    entity: iam-policy
    refresh: 7d
    why: Unattached policies are clutter that hides the policies that matter in reviews, and one attach call turns a forgotten broad policy back on.
    fix: Delete policies nobody uses (after confirming they are not kept for a deployment pipeline).
    refs: [NIST-800-53:CM-8, NIST-800-53:AC-6]
    query:
      protocol: aws
      service: iam
      action: ListPolicies
      params: { Scope: Local }
      items: "//Policies/member"
      key: Arn
      name: PolicyName
    each:
      all:
        - { field: AttachmentCount, op: eq, value: 0 }
        - { field: PermissionsBoundaryUsageCount, op: eq, value: 0 }
    evidence: "account {_account}: policy {PolicyName} is attached to nothing (updated {UpdateDate})"

  # ---- IAM policy documents (customer-managed policies - every stored version - and inline policies of
  # users, groups and roles). GetAccountAuthorizationDetails returns each document URL-encoded; the
  # patterns match either form and look inside one statement (Effect, Action and Resource before the
  # statement's first closing brace). Wildcards such as iam:Put* and Resource ARNs ending in * are not
  # matched - see the backlog.

  - id: AWS-IAM-POLICY-ADMIN
    title: IAM policy grants full administrative access (Allow * on *)
    kind: misconfigured
    lens: security
    category: IAM
    severity: high
    entity: iam-principal
    refresh: 1d
    why: 'A statement that allows every action on every resource makes whoever holds it an administrator of the account; administrators should be few, named and reached through a role, not built into customer policies and inline grants.'
    fix: 'Replace the statement with the actions and resources the principal needs; keep full administration on a small set of break-glass and platform roles.'
    refs: [CIS-AWS:1.16, FSBP:IAM.1, NIST-800-53:AC-6, MITRE-ATTACK:T1078.004]
    query:
      protocol: aws
      service: iam
      action: GetAccountAuthorizationDetails
      params: { "Filter.member.1": LocalManagedPolicy, "Filter.member.2": User, "Filter.member.3": Group, "Filter.member.4": Role }
      items: "//Policies/member | //UserDetailList/member | //GroupDetailList/member | //RoleDetailList/member"
      key: Arn
    each:
      any:
        - all: [ { field: PolicyVersionList, op: exists }, { field: PolicyVersionList, op: match, value: '(?:%7B|\{)(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Effect(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%22|")Allow(?:%22|"))(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Action(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:(?:%22|")(?:%2A|\*)(?:(?:%3A|:)(?:%2A|\*))?(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:(?:%3A|:)(?:%2A|\*))?(?:%22|")))(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Resource(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:%22|")))' } ]
        - all: [ { field: UserPolicyList, op: exists }, { field: UserPolicyList, op: match, value: '(?:%7B|\{)(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Effect(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%22|")Allow(?:%22|"))(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Action(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:(?:%22|")(?:%2A|\*)(?:(?:%3A|:)(?:%2A|\*))?(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:(?:%3A|:)(?:%2A|\*))?(?:%22|")))(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Resource(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:%22|")))' } ]
        - all: [ { field: GroupPolicyList, op: exists }, { field: GroupPolicyList, op: match, value: '(?:%7B|\{)(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Effect(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%22|")Allow(?:%22|"))(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Action(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:(?:%22|")(?:%2A|\*)(?:(?:%3A|:)(?:%2A|\*))?(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:(?:%3A|:)(?:%2A|\*))?(?:%22|")))(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Resource(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:%22|")))' } ]
        - all: [ { field: RolePolicyList, op: exists }, { field: RolePolicyList, op: match, value: '(?:%7B|\{)(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Effect(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%22|")Allow(?:%22|"))(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Action(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:(?:%22|")(?:%2A|\*)(?:(?:%3A|:)(?:%2A|\*))?(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:(?:%3A|:)(?:%2A|\*))?(?:%22|")))(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Resource(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:%22|")))' } ]
    evidence: "account {_account}: {Arn} - a managed policy version or an inline policy matches (iam policy grants full administrative access (allow * on *))"

  - id: AWS-IAM-POLICY-NOTACTION-ALLOW
    title: IAM policy allows with NotAction
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: iam-principal
    refresh: 1d
    why: 'Allow with NotAction grants every action except the ones listed - including every action AWS adds later; it is almost always far broader than intended.'
    fix: 'Rewrite the statement as an explicit Action list, or use NotAction only with Deny.'
    refs: [NIST-800-53:AC-6]
    query:
      protocol: aws
      service: iam
      action: GetAccountAuthorizationDetails
      params: { "Filter.member.1": LocalManagedPolicy, "Filter.member.2": User, "Filter.member.3": Group, "Filter.member.4": Role }
      items: "//Policies/member | //UserDetailList/member | //GroupDetailList/member | //RoleDetailList/member"
      key: Arn
    each:
      any:
        - all: [ { field: PolicyVersionList, op: exists }, { field: PolicyVersionList, op: match, value: '(?:%7B|\{)(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Effect(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%22|")Allow(?:%22|"))(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")NotAction(?:%22|"))' } ]
        - all: [ { field: UserPolicyList, op: exists }, { field: UserPolicyList, op: match, value: '(?:%7B|\{)(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Effect(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%22|")Allow(?:%22|"))(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")NotAction(?:%22|"))' } ]
        - all: [ { field: GroupPolicyList, op: exists }, { field: GroupPolicyList, op: match, value: '(?:%7B|\{)(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Effect(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%22|")Allow(?:%22|"))(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")NotAction(?:%22|"))' } ]
        - all: [ { field: RolePolicyList, op: exists }, { field: RolePolicyList, op: match, value: '(?:%7B|\{)(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")Effect(?:%22|")(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\\u002B|\s)*(?:%22|")Allow(?:%22|"))(?=(?:(?!%7D|\})[\s\S])*?(?:%22|")NotAction(?:%22|"))' } ]
    evidence: "account {_account}: {Arn} - a managed policy version or an inline policy matches (iam policy allows with notaction)"

  - id: AWS-IAM-POLICY-SERVICE-WILDCARD
    title: IAM policy allows every action of a service (service:*)
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: iam-principal
    refresh: 1d
    why: 'A service wildcard grants every current and future action of that service, including its administrative and destructive ones; least privilege names the actions needed.'
    fix: 'Replace service:* with the specific actions the workload uses (IAM Access Analyzer can generate a policy from CloudTrail activity).'
    refs: [FSBP:IAM.21, NIST-800-53:AC-6]
    query:
      protocol: aws
      service: iam
      action: GetAccountAuthorizationDetails
      params: { "Filter.member.1": LocalManagedPolicy, "Filter.member.2": User, "Filter.member.3": Group, "Filter.member.4": Role }
      items: "//Policies/member | //UserDetailList/member | //GroupDetailList/member | //RoleDetailList/member"
      key: Arn
