  - id: AWS-RDS-CLUSTER-BACKTRACK-OFF
    title: Aurora MySQL cluster without backtracking
    kind: misconfigured
    lens: maintenance
    category: BCK
    severity: low
    entity: db-cluster
    refresh: 7d
    why: Backtracking rewinds an Aurora MySQL cluster to a point in time in minutes, without a restore; it is the fastest recovery from a bad deploy or a destructive statement. It can only be enabled when the cluster is created or restored.
    fix: Enable backtracking (a target window of hours to a day) on new or restored Aurora MySQL clusters that need fast rewind.
    refs: [FSBP:RDS.14, NIST-800-53:CP-10]
    query:
      protocol: aws
      service: rds
      action: DescribeDBClusters
      items: "//DBCluster"
      key: "{_account}|{_region}|{DBClusterIdentifier}"
    each:
      all:
        - { field: Engine, op: eq, value: aurora-mysql }
        - { field: EngineMode, op: ne, value: serverless }
        - any:
            - { field: BacktrackWindow, op: absent }
            - { field: BacktrackWindow, op: eq, value: 0 }
    evidence: "cluster {DBClusterIdentifier} ({_account} {_region}): backtrack window {BacktrackWindow}"

