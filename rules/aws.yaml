  # ---- ELB (v2) ---------------------------------------------------------------------------------
  # Listener TLS policies and load-balancer attributes need the load balancer's ARN in a param, which
  # for_each cannot pass (an ARN has '/'): see the backlog.

  - id: AWS-ELB-STATE-PROBLEM
    title: Load balancer failed or impaired
    kind: broken
    lens: maintenance
    category: HLT
    severity: high
    entity: load-balancer
    refresh: 1h
    why: A load balancer in failed or active_impaired state is not routing (all or part of) the traffic it fronts.
    fix: Check the load balancer's subnets, capacity and AZ health; open a case with AWS if it does not recover.
    refs: [NIST-800-53:SI-4, NIST-800-53:CP-2]
    query:
      protocol: aws
      service: elasticloadbalancing
      action: DescribeLoadBalancers
      items: "//LoadBalancers/member"
      key: LoadBalancerArn
      name: LoadBalancerName
    each: { field: State.Code, op: in, value: [failed, active_impaired] }
    evidence: "load balancer {LoadBalancerName} ({_account} {_region}): {State.Code} {State.Reason}"

  - id: AWS-ELB-SINGLE-AZ
    title: Load balancer in only one Availability Zone
    kind: misconfigured
    lens: maintenance
    category: AVL
    severity: low
    entity: load-balancer
    refresh: 7d
    why: A load balancer with nodes in one zone stops serving when that zone has a problem.
    fix: Enable at least two Availability Zones (subnets) on the load balancer.
    refs: [FSBP:ELB.13, NIST-800-53:CP-2]
    query:
      protocol: aws
      service: elasticloadbalancing
      action: DescribeLoadBalancers
      items: "//LoadBalancers/member"
      key: LoadBalancerArn
      name: LoadBalancerName
    each:
      all:
        - { field: Type, op: in, value: [application, network] }
        - { field: AvailabilityZones.member, op: size-lt, value: 2 }
    evidence: "load balancer {LoadBalancerName} ({_account} {_region}): one zone ({AvailabilityZones.member.ZoneName})"

  # ---- ECS task definitions (each family's latest active revision) ------------------------------

  - id: AWS-ECS-PRIVILEGED-CONTAINER
    title: ECS task definition runs a privileged container
    kind: misconfigured
    lens: security
    category: AUT
    severity: high
    entity: ecs-task-definition
    why: A privileged container has root on the host - every device, every other container; one exploited process becomes a host compromise.
    fix: Remove privileged from the container definition and grant only the specific Linux capabilities needed.
    refs: [FSBP:ECS.4, NIST-800-53:AC-6, MITRE-ATTACK:T1611]
    query:
      protocol: aws
      service: ecs
      action: DescribeTaskDefinition
      for_each: { service: ecs, action: ListTaskDefinitionFamilies, params: { status: ACTIVE }, items: families, field: value, max: 2000, next: { from: nextToken, to: nextToken } }
      params: { taskDefinition: "{value}" }
      items: taskDefinition
      key: "{_account}|{_region}|{parent.value}"
    each:
      element: { of: containerDefinitions, where: { field: privileged, op: eq, value: true } }
    evidence: "task definition {family}:{revision} ({_account} {_region}) has a privileged container"

  - id: AWS-ECS-HOST-NETWORK
    title: ECS task definition uses the host network mode
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: ecs-task-definition
    refresh: 7d
    why: In host mode the containers share the instance's network stack - they can reach its metadata service and every port bound on the host, and security groups cannot tell tasks apart.
    fix: Use the awsvpc network mode so each task has its own interface and security group.
    refs: [FSBP:ECS.1, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: ecs
      action: DescribeTaskDefinition
      for_each: { service: ecs, action: ListTaskDefinitionFamilies, params: { status: ACTIVE }, items: families, field: value, max: 2000, next: { from: nextToken, to: nextToken } }
      params: { taskDefinition: "{value}" }
      items: taskDefinition
      key: "{_account}|{_region}|{parent.value}"
    each: { field: networkMode, op: eq, value: host }
    evidence: "task definition {family}:{revision} ({_account} {_region}): network mode host"

  - id: AWS-ECS-HOST-PID
    title: ECS task definition shares the host process namespace
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: ecs-task-definition
    refresh: 7d
    why: With pidMode host the containers see (and with enough rights, signal or inspect) every process on the instance, including other tasks.
    fix: Remove pidMode host from the task definition.
    refs: [FSBP:ECS.3, NIST-800-53:SC-39]
    query:
      protocol: aws
      service: ecs
      action: DescribeTaskDefinition
      for_each: { service: ecs, action: ListTaskDefinitionFamilies, params: { status: ACTIVE }, items: families, field: value, max: 2000, next: { from: nextToken, to: nextToken } }
      params: { taskDefinition: "{value}" }
      items: taskDefinition
      key: "{_account}|{_region}|{parent.value}"
    each: { field: pidMode, op: eq, value: host }
    evidence: "task definition {family}:{revision} ({_account} {_region}): pid mode host"

  - id: AWS-ECS-ROOT-FS-WRITABLE
    title: ECS container root filesystem is writable
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: ecs-task-definition
    refresh: 7d
    why: A writable root filesystem lets an attacker in the container drop tools and change binaries; read-only roots with explicit volumes for state make that much harder.
    fix: Set readonlyRootFilesystem true on the containers and mount volumes for the paths that must be written.
    refs: [FSBP:ECS.5, NIST-800-53:CM-7]
    query:
      protocol: aws
      service: ecs
      action: DescribeTaskDefinition
      for_each: { service: ecs, action: ListTaskDefinitionFamilies, params: { status: ACTIVE }, items: families, field: value, max: 2000, next: { from: nextToken, to: nextToken } }
      params: { taskDefinition: "{value}" }
      items: taskDefinition
      key: "{_account}|{_region}|{parent.value}"
    each:
      element:
        of: containerDefinitions
        where:
          any:
            - { field: readonlyRootFilesystem, op: absent }
            - { field: readonlyRootFilesystem, op: eq, value: false }
    evidence: "task definition {family}:{revision} ({_account} {_region}) has a container with a writable root filesystem"

  - id: AWS-ECS-NO-LOGGING
    title: ECS container has no log configuration
    kind: missing
    lens: both
    category: LOG
    severity: low
    entity: ecs-task-definition
    refresh: 7d
    why: Without a log driver the container's output stays on the host (or is lost on Fargate), so failures and intrusions leave no record.
    fix: Configure a log driver (awslogs or FireLens) on every container definition.
    refs: [FSBP:ECS.9, NIST-800-53:AU-12]
    query:
      protocol: aws
      service: ecs
      action: DescribeTaskDefinition
      for_each: { service: ecs, action: ListTaskDefinitionFamilies, params: { status: ACTIVE }, items: families, field: value, max: 2000, next: { from: nextToken, to: nextToken } }
      params: { taskDefinition: "{value}" }
      items: taskDefinition
      key: "{_account}|{_region}|{parent.value}"
    each:
      element: { of: containerDefinitions, where: { field: logConfiguration, op: absent } }
    evidence: "task definition {family}:{revision} ({_account} {_region}) has a container without logging"

  # ---- EKS clusters -----------------------------------------------------------------------------

  - id: AWS-EKS-PUBLIC-ENDPOINT-OPEN
    title: EKS cluster API endpoint is public to the whole internet
    kind: misconfigured
    lens: security
    category: AUT
    severity: high
    entity: eks-cluster
    why: A public endpoint open to 0.0.0.0/0 puts the Kubernetes API in front of every scanner; one leaked kubeconfig token or API flaw is directly exploitable.
    fix: Turn on the private endpoint and either turn off public access or restrict publicAccessCidrs to the administrators' networks.
    refs: [FSBP:EKS.1, NIST-800-53:SC-7, MITRE-ATTACK:T1133]
    query:
      protocol: aws
      service: eks
      action: DescribeCluster
      for_each: { service: eks, action: ListClusters, path: /clusters, items: clusters, field: value, max: 500, next: { from: nextToken, to: nextToken } }
      path: "/clusters/{value}"
      items: cluster
      key: "{_account}|{_region}|{parent.value}"
    each:
      all:
        - { field: resourcesVpcConfig.endpointPublicAccess, op: eq, value: true }
        - { field: resourcesVpcConfig.publicAccessCidrs, op: contains, value: "0.0.0.0/0" }
    evidence: "cluster {name} ({_account} {_region}): public endpoint open to {resourcesVpcConfig.publicAccessCidrs}"

  - id: AWS-EKS-AUDIT-LOGGING-OFF
    title: EKS cluster audit logging is off
    kind: missing
    lens: security
    category: LOG
    severity: medium
    entity: eks-cluster
    why: The Kubernetes audit log is the record of who did what through the API - the first thing needed in any cluster incident.
    fix: Enable the audit (and authenticator) control-plane log types on the cluster.
    refs: [FSBP:EKS.8, NIST-800-53:AU-12]
    query:
      protocol: aws
      service: eks
      action: DescribeCluster
      for_each: { service: eks, action: ListClusters, path: /clusters, items: clusters, field: value, max: 500, next: { from: nextToken, to: nextToken } }
      path: "/clusters/{value}"
      items: cluster
      key: "{_account}|{_region}|{parent.value}"
    each:
      not: { element: { of: logging.clusterLogging, where: { all: [ { field: enabled, op: eq, value: true }, { field: types, op: contains, value: audit } ] } } }
    evidence: "cluster {name} ({_account} {_region}): audit logging off"

  - id: AWS-EKS-SECRETS-NOT-ENCRYPTED
    title: EKS cluster secrets not envelope-encrypted with KMS
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: eks-cluster
    refresh: 7d
    why: Without envelope encryption, Kubernetes secrets in etcd are protected only by the default storage encryption, with no customer key gate.
    fix: Enable secrets encryption with a customer-managed KMS key on the cluster (it can be added to an existing cluster).
    refs: [FSBP:EKS.3, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: eks
      action: DescribeCluster
      for_each: { service: eks, action: ListClusters, path: /clusters, items: clusters, field: value, max: 500, next: { from: nextToken, to: nextToken } }
      path: "/clusters/{value}"
      items: cluster
      key: "{_account}|{_region}|{parent.value}"
    each: { field: encryptionConfig, op: empty }
    evidence: "cluster {name} ({_account} {_region}): no secrets encryption"

  - id: AWS-EKS-VERSION-OLD
    title: EKS cluster on an old Kubernetes version
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: medium
    entity: eks-cluster
    why: Kubernetes versions leave standard support about 14 months after release; after that the cluster pays extended-support fees, then is upgraded by AWS on AWS's schedule. Which versions are old changes over time, so the floor is a tenant setting.
    fix: Upgrade the control plane and node groups one minor version at a time, with the add-ons; keep threshold aws.eks.min-version current.
    refs: [FSBP:EKS.2, NIST-800-53:SI-2, NIST-800-53:SA-22]
    query:
      protocol: aws
      service: eks
      action: DescribeCluster
      for_each: { service: eks, action: ListClusters, path: /clusters, items: clusters, field: value, max: 500, next: { from: nextToken, to: nextToken } }
      path: "/clusters/{value}"
      items: cluster
      key: "{_account}|{_region}|{parent.value}"
    each: { field: version, op: version-lt, value: "1.31", threshold: aws.eks.min-version, required: true }
    evidence: "cluster {name} ({_account} {_region}): Kubernetes {version}, platform {platformVersion}"

  - id: AWS-EKS-EXTENDED-SUPPORT
    title: EKS cluster set to move into paid extended support
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: eks-cluster
    refresh: 7d
    why: With the EXTENDED support policy a cluster past standard support keeps running at several times the control-plane price instead of being upgraded.
    fix: Plan the upgrade; set the upgrade policy to STANDARD where staying on an old version is not intended.
    refs: [NIST-800-53:SA-22]
    query:
      protocol: aws
      service: eks
      action: DescribeCluster
      for_each: { service: eks, action: ListClusters, path: /clusters, items: clusters, field: value, max: 500, next: { from: nextToken, to: nextToken } }
      path: "/clusters/{value}"
      items: cluster
      key: "{_account}|{_region}|{parent.value}"
    each: { field: upgradePolicy.supportType, op: eq, value: EXTENDED }
    evidence: "cluster {name} ({_account} {_region}): support policy {upgradePolicy.supportType}, version {version}"

  - id: AWS-EKS-CLUSTER-FAILED
    title: EKS cluster in a failed state
    kind: broken
    lens: maintenance
    category: HLT
    severity: high
    entity: eks-cluster
    refresh: 1h
    why: A failed cluster's control plane is not serving; workloads cannot be scheduled or changed.
    fix: Read the cluster's health issues and open a case with AWS if it does not recover.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: aws
      service: eks
      action: DescribeCluster
      for_each: { service: eks, action: ListClusters, path: /clusters, items: clusters, field: value, max: 500, next: { from: nextToken, to: nextToken } }
      path: "/clusters/{value}"
      items: cluster
      key: "{_account}|{_region}|{parent.value}"
    each: { field: status, op: eq, value: FAILED }
    evidence: "cluster {name} ({_account} {_region}): status {status}"

  - id: AWS-EKS-CONFIGMAP-AUTH-ONLY
    title: EKS cluster authenticates only through the aws-auth ConfigMap
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: eks-cluster
    refresh: 7d
    why: The aws-auth ConfigMap is edited inside the cluster, is easy to break and is invisible to IAM reviews; access entries manage cluster access through the EKS API instead.
    fix: Switch the authentication mode to API_AND_CONFIG_MAP, migrate the mappings to access entries, then to API.
    refs: [NIST-800-53:AC-2, NIST-800-53:AC-3]
    query:
      protocol: aws
      service: eks
      action: DescribeCluster
      for_each: { service: eks, action: ListClusters, path: /clusters, items: clusters, field: value, max: 500, next: { from: nextToken, to: nextToken } }
      path: "/clusters/{value}"
      items: cluster
      key: "{_account}|{_region}|{parent.value}"
    each: { field: accessConfig.authenticationMode, op: eq, value: CONFIG_MAP }
    evidence: "cluster {name} ({_account} {_region}): authentication mode {accessConfig.authenticationMode}"

  # ---- DynamoDB ---------------------------------------------------------------------------------

  - id: AWS-DYNAMODB-PITR-OFF
    title: DynamoDB table without point-in-time recovery
    kind: misconfigured
    lens: both
    category: BCK
    severity: medium
    entity: dynamodb-table
    why: Without point-in-time recovery a bad write, a bug or a deletion of items can be undone only from an on-demand backup, if one exists.
    fix: Enable point-in-time recovery on tables holding data that is not trivially rebuilt.
    refs: [FSBP:DynamoDB.2, NIST-800-53:CP-9]
    query:
      protocol: aws
      service: dynamodb
      action: DescribeContinuousBackups
      for_each: { service: dynamodb, action: ListTables, items: TableNames, field: value, max: 2000, next: { from: LastEvaluatedTableName, to: ExclusiveStartTableName } }
      params: { TableName: "{value}" }
      key: "{_account}|{_region}|{parent.value}"
    each: { field: ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus, op: ne, value: ENABLED }
    evidence: "table {parent.value} ({_account} {_region}): point-in-time recovery {ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus}"

  - id: AWS-DYNAMODB-DELETION-PROTECTION-OFF
    title: DynamoDB table without deletion protection
    kind: misconfigured
    lens: both
    category: AVL
    severity: low
    entity: dynamodb-table
    refresh: 7d
    why: Without deletion protection a single call deletes the table and, unless backups exist, its data.
    fix: Enable deletion protection on production tables.
    refs: [FSBP:DynamoDB.6, NIST-800-53:CP-9]
    query:
      protocol: aws
      service: dynamodb
      action: DescribeTable
      for_each: { service: dynamodb, action: ListTables, items: TableNames, field: value, max: 2000, next: { from: LastEvaluatedTableName, to: ExclusiveStartTableName } }
      params: { TableName: "{value}" }
      items: Table
      key: "{_account}|{_region}|{parent.value}"
    each:
      any:
        - { field: DeletionProtectionEnabled, op: absent }
        - { field: DeletionProtectionEnabled, op: eq, value: false }
    evidence: "table {parent.value} ({_account} {_region}): deletion protection off"

  - id: AWS-DYNAMODB-AWS-OWNED-KEY
    title: DynamoDB table encrypted with an AWS-owned key
    kind: misconfigured
    lens: security
    category: PKI
    severity: low
    entity: dynamodb-table
    refresh: 7d
    why: With the AWS-owned key there is no key policy, no CloudTrail record of key use and no way to revoke access through the key.
    fix: Switch the table to an AWS-managed or customer-managed KMS key (online change).
    refs: [NIST-800-53:SC-12, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: dynamodb
      action: DescribeTable
      for_each: { service: dynamodb, action: ListTables, items: TableNames, field: value, max: 2000, next: { from: LastEvaluatedTableName, to: ExclusiveStartTableName } }
      params: { TableName: "{value}" }
      items: Table
      key: "{_account}|{_region}|{parent.value}"
    each: { field: SSEDescription, op: absent }
    evidence: "table {parent.value} ({_account} {_region}) uses the AWS-owned key"

  # ---- SNS --------------------------------------------------------------------------------------

  - id: AWS-SNS-TOPIC-NOT-ENCRYPTED
    title: SNS topic not encrypted at rest
    kind: misconfigured
    lens: security
    category: PKI
    severity: low
    entity: sns-topic
    refresh: 7d
    why: Messages waiting for delivery are stored without a KMS key; alerts and events often carry resource names, addresses and personal data.
    fix: Set a KMS key (customer-managed for sensitive topics) on the topic.
    refs: [FSBP:SNS.1, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: sns
      action: GetTopicAttributes
      for_each: { service: sns, action: ListTopics, items: "//Topics/member", field: TopicArn, max: 2000 }
      params: { TopicArn: "{TopicArn}" }
      items: "//GetTopicAttributesResult/Attributes"
      key: "{parent.TopicArn}"
    each:
      not: { element: { of: entry, where: { field: key, op: eq, value: KmsMasterKeyId } } }
    evidence: "topic {parent.TopicArn}: no KMS key"

  - id: AWS-SNS-TOPIC-POLICY-PUBLIC
    title: SNS topic policy admits any principal without a condition
    kind: misconfigured
    lens: security
    category: AUT
    severity: high
    entity: sns-topic
    why: A topic policy statement for Principal "*" with no condition lets any AWS account publish to (or subscribe to) the topic - spoofed alerts, or alerts read by outsiders. The default topic policy carries an owner condition and does not match.
    fix: Restrict the principal to specific accounts or services and add aws:SourceAccount / aws:SourceArn conditions.
    refs: [NIST-800-53:AC-3]
    query:
      protocol: aws
      service: sns
      action: GetTopicAttributes
      for_each: { service: sns, action: ListTopics, items: "//Topics/member", field: TopicArn, max: 2000 }
      params: { TopicArn: "{TopicArn}" }
      items: "//GetTopicAttributesResult/Attributes"
      key: "{parent.TopicArn}"
    each:
      element:
        of: entry
        where:
          all:
            - { field: key, op: eq, value: Policy }
            - { field: value, op: match, value: '(?:%22|")Principal(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%7B|\{)(?:(?!%7D|\})[\s\S])*?(?:%22|")AWS(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:%22|")))' }
            - { field: value, op: notmatch, value: '(?:%22|")Condition(?:%22|")' }
    evidence: "topic {parent.TopicArn}: policy admits any principal with no condition"

  # ---- WAF (regional web ACLs in every region; CloudFront web ACLs live in us-east-1) -----------

  - id: AWS-WAF-WEBACL-NO-RULES
    title: Regional WAF web ACL has no rules
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: waf-web-acl
    refresh: 7d
    why: A web ACL without rules only applies its default action, so whatever it is attached to looks protected while nothing is inspected.
    fix: Add the AWS managed rule groups (common, known bad inputs, IP reputation) and a rate-based rule, or detach the ACL.
    refs: [FSBP:WAF.10, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: wafv2
      action: GetWebACL
      for_each: { service: wafv2, action: ListWebACLs, params: { Scope: REGIONAL }, items: WebACLs, field: Id, max: 500, next: { from: NextMarker, to: NextMarker } }
      params: { Name: "{Name}", Id: "{Id}", Scope: REGIONAL }
      items: WebACL
      key: "{_account}|{_region}|{parent.Id}"
    each: { field: Rules, op: empty }
    evidence: "web ACL {Name} ({_account} {_region}) has no rules"

  - id: AWS-WAF-CLOUDFRONT-WEBACL-NO-RULES
    title: CloudFront WAF web ACL has no rules
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: waf-web-acl
    refresh: 7d
    why: A web ACL without rules only applies its default action, so the distributions it is attached to look protected while nothing is inspected.
    fix: Add the AWS managed rule groups and a rate-based rule, or detach the ACL.
    refs: [FSBP:WAF.10, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: wafv2
      action: GetWebACL
      for_each: { service: wafv2, action: ListWebACLs, regions: [us-east-1], params: { Scope: CLOUDFRONT }, items: WebACLs, field: Id, max: 500, next: { from: NextMarker, to: NextMarker } }
      params: { Name: "{Name}", Id: "{Id}", Scope: CLOUDFRONT }
      items: WebACL
      key: "{_account}|{parent.Id}"
    each: { field: Rules, op: empty }
    evidence: "CloudFront web ACL {Name} ({_account}) has no rules"

  - id: AWS-WAF-RULE-METRICS-OFF
    title: WAF web ACL rule without CloudWatch metrics
    kind: missing
    lens: maintenance
    category: MON
    severity: low
    entity: waf-web-acl
    refresh: 7d
    why: Without metrics nobody sees how often a rule blocks or counts, so a rule that blocks real users or never fires goes unnoticed.
    fix: Enable CloudWatch metrics (and sampled requests) in each rule's visibility configuration.
    refs: [FSBP:WAF.12, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: wafv2
      action: GetWebACL
      for_each: { service: wafv2, action: ListWebACLs, params: { Scope: REGIONAL }, items: WebACLs, field: Id, max: 500, next: { from: NextMarker, to: NextMarker } }
      params: { Name: "{Name}", Id: "{Id}", Scope: REGIONAL }
      items: WebACL
      key: "{_account}|{_region}|{parent.Id}"
    each:
      element: { of: Rules, where: { field: VisibilityConfig.CloudWatchMetricsEnabled, op: eq, value: false } }
    evidence: "web ACL {Name} ({_account} {_region}): a rule has metrics off"

  - id: AWS-WAF-NO-COMMON-RULE-SET
    title: Regional WAF web ACL without the AWS core rule set
    kind: missing
    lens: security
    category: AUT
    severity: low
    entity: waf-web-acl
    refresh: 7d
    why: The AWS managed core rule set covers the common OWASP attack classes; a web ACL without it (or an equivalent vendor set) filters little.
    fix: Add AWSManagedRulesCommonRuleSet (or record the equivalent rule group used).
    refs: [NIST-800-53:SC-7, NIST-800-53:SI-10]
    query:
      protocol: aws
      service: wafv2
      action: GetWebACL
      for_each: { service: wafv2, action: ListWebACLs, params: { Scope: REGIONAL }, items: WebACLs, field: Id, max: 500, next: { from: NextMarker, to: NextMarker } }
      params: { Name: "{Name}", Id: "{Id}", Scope: REGIONAL }
      items: WebACL
      key: "{_account}|{_region}|{parent.Id}"
    each:
      not: { element: { of: Rules, where: { field: Statement.ManagedRuleGroupStatement.Name, op: eq, value: AWSManagedRulesCommonRuleSet } } }
    evidence: "web ACL {Name} ({_account} {_region}): no AWS core rule set"

  - id: AWS-WAF-NO-KNOWN-BAD-INPUTS
    title: Regional WAF web ACL without the known-bad-inputs rule set
    kind: missing
    lens: security
    category: AUT
    severity: low
    entity: waf-web-acl
    refresh: 7d
    why: The known-bad-inputs group blocks request patterns tied to published exploits (Log4j-style lookups, path traversal payloads) that the core set does not.
    fix: Add AWSManagedRulesKnownBadInputsRuleSet to the web ACL.
    refs: [NIST-800-53:SC-7, NIST-800-53:SI-10]
    query:
      protocol: aws
      service: wafv2
      action: GetWebACL
      for_each: { service: wafv2, action: ListWebACLs, params: { Scope: REGIONAL }, items: WebACLs, field: Id, max: 500, next: { from: NextMarker, to: NextMarker } }
      params: { Name: "{Name}", Id: "{Id}", Scope: REGIONAL }
      items: WebACL
      key: "{_account}|{_region}|{parent.Id}"
    each:
      not: { element: { of: Rules, where: { field: Statement.ManagedRuleGroupStatement.Name, op: eq, value: AWSManagedRulesKnownBadInputsRuleSet } } }
    evidence: "web ACL {Name} ({_account} {_region}): no known-bad-inputs rule set"

  # ---- Route 53, CodeBuild ----------------------------------------------------------------------

  - id: AWS-ROUTE53-NO-QUERY-LOGGING
    title: No Route 53 public DNS query logging anywhere
    kind: missing
    lens: security
    category: LOG
    severity: low
    entity: instance
    refresh: 7d
    why: Query logs show who resolves the organisation's public names and help spot reconnaissance and subdomain abuse; with no configuration at all no zone is logged. Per-zone coverage is in the backlog.
    fix: Configure query logging for each public hosted zone to a CloudWatch Logs group in us-east-1.
    refs: [FSBP:Route53.2, NIST-800-53:AU-12]
    query:
      protocol: aws
      service: route53
      action: ListQueryLoggingConfigs
      path: /2013-04-01/queryloggingconfig
