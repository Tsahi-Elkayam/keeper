  - id: AWS-RDS-CLUSTER-LOGS-NOT-EXPORTED
    title: Database cluster exports no logs to CloudWatch
    kind: missing
    lens: security
    category: LOG
    severity: medium
    entity: db-cluster
    refresh: 7d
