  - id: AWS-RDS-SNAPSHOT-UNENCRYPTED
    title: RDS snapshot is not encrypted
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: rds-snapshot
    refresh: 7d
    why: An unencrypted snapshot can be shared or restored without any key permission, and the whole database is readable to whoever gets it.
    fix: Copy the snapshot with encryption on, delete the unencrypted one, and encrypt the source database.
    refs: [FSBP:RDS.4, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: rds
      action: DescribeDBSnapshots
      items: "//DBSnapshot"
      key: "{_account}|{_region}|{DBSnapshotIdentifier}"
    each: { field: Encrypted, op: eq, value: false }
    evidence: "snapshot {DBSnapshotIdentifier} ({_account} {_region}) of {DBInstanceIdentifier}: {SnapshotType}, not encrypted"

  - id: AWS-RDS-CLUSTER-SNAPSHOT-UNENCRYPTED
    title: Database cluster snapshot is not encrypted
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: rds-snapshot
    refresh: 7d
    why: An unencrypted cluster snapshot can be shared or restored without any key permission.
    fix: Copy the snapshot with encryption on and delete the unencrypted one.
    refs: [FSBP:RDS.4, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: rds
      action: DescribeDBClusterSnapshots
      items: "//DBClusterSnapshot"
      key: "{_account}|{_region}|{DBClusterSnapshotIdentifier}"
    each: { field: StorageEncrypted, op: eq, value: false }
    evidence: "cluster snapshot {DBClusterSnapshotIdentifier} ({_account} {_region}) of {DBClusterIdentifier}: not encrypted"

  - id: AWS-RDS-SNAPSHOT-PUBLIC
    title: RDS snapshot is shared publicly
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: rds-snapshot
    why: A public database snapshot can be restored by any AWS account in the world - the whole database, as it was.
    fix: Remove "all" from the snapshot's restore attribute and treat its contents as exposed.
    refs: [FSBP:RDS.1, NIST-800-53:AC-3, MITRE-ATTACK:T1537]
    query:
      protocol: aws
      service: rds
      action: DescribeDBSnapshotAttributes
      for_each: { service: rds, action: DescribeDBSnapshots, params: { SnapshotType: manual }, items: "//DBSnapshot", field: DBSnapshotIdentifier, max: 2000 }
      params: { DBSnapshotIdentifier: "{DBSnapshotIdentifier}" }
      items: "//DBSnapshotAttribute"
      key: "{_account}|{_region}|{parent.DBSnapshotIdentifier}"
    each:
      all:
        - { field: AttributeName, op: eq, value: restore }
        - { field: AttributeValues.AttributeValue, op: eq, value: all }
    evidence: "snapshot {parent.DBSnapshotIdentifier} ({_account} {_region}) is restorable by everyone"

  - id: AWS-RDS-CLUSTER-SNAPSHOT-PUBLIC
    title: Database cluster snapshot is shared publicly
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: rds-snapshot
    why: A public cluster snapshot can be restored by any AWS account in the world.
    fix: Remove "all" from the snapshot's restore attribute and treat its contents as exposed.
    refs: [FSBP:RDS.1, NIST-800-53:AC-3, MITRE-ATTACK:T1537]
    query:
      protocol: aws
      service: rds
      action: DescribeDBClusterSnapshotAttributes
      for_each: { service: rds, action: DescribeDBClusterSnapshots, params: { SnapshotType: manual }, items: "//DBClusterSnapshot", field: DBClusterSnapshotIdentifier, max: 2000 }
      params: { DBClusterSnapshotIdentifier: "{DBClusterSnapshotIdentifier}" }
      items: "//DBClusterSnapshotAttribute"
      key: "{_account}|{_region}|{parent.DBClusterSnapshotIdentifier}"
    each:
      all:
        - { field: AttributeName, op: eq, value: restore }
        - { field: AttributeValues.AttributeValue, op: eq, value: all }
    evidence: "cluster snapshot {parent.DBClusterSnapshotIdentifier} ({_account} {_region}) is restorable by everyone"

  - id: AWS-RDS-PROXY-TLS-OFF
    title: RDS Proxy does not require TLS
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: rds-proxy
    refresh: 7d
    why: Without RequireTLS, clients may connect to the proxy in clear text and send database credentials and data unencrypted.
    fix: Turn on Require Transport Layer Security on the proxy after confirming clients use TLS.
    refs: [NIST-800-53:SC-8]
    query:
      protocol: aws
      service: rds
      action: DescribeDBProxies
      items: "//DBProxies/member"
      key: "{_account}|{_region}|{DBProxyName}"
    each: { field: RequireTLS, op: eq, value: false }
    evidence: "proxy {DBProxyName} ({_account} {_region}): TLS not required"

  - id: AWS-REDSHIFT-UNENCRYPTED
    title: Redshift cluster is not encrypted at rest
    kind: misconfigured
    lens: security
    category: PKI
    severity: high
    entity: redshift-cluster
    why: An unencrypted warehouse stores its data and snapshots in the clear.
    fix: Enable encryption on the cluster (Redshift migrates the data) with a KMS key.
    refs: [FSBP:Redshift.10, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: redshift
      action: DescribeClusters
      items: "//Cluster"
      key: "{_account}|{_region}|{ClusterIdentifier}"
    each: { field: Encrypted, op: eq, value: false }
    evidence: "cluster {ClusterIdentifier} ({_account} {_region}): not encrypted"

  - id: AWS-REDSHIFT-SNAPSHOT-RETENTION-SHORT
    title: Redshift automated snapshot retention too short
    kind: misconfigured
    lens: both
    category: BCK
    severity: medium
    entity: redshift-cluster
    why: Automated snapshots kept for a day or not at all give no room to recover from a problem found late.
    fix: Set automated snapshot retention to at least 7 days.
    refs: [FSBP:Redshift.3, NIST-800-53:CP-9]
    query:
      protocol: aws
      service: redshift
      action: DescribeClusters
      items: "//Cluster"
      key: "{_account}|{_region}|{ClusterIdentifier}"
    each: { field: AutomatedSnapshotRetentionPeriod, op: lt, value: 7, threshold: aws.redshift.min-snapshot-retention-days }
    evidence: "cluster {ClusterIdentifier} ({_account} {_region}): snapshot retention {AutomatedSnapshotRetentionPeriod} day(s)"

  - id: AWS-REDSHIFT-VERSION-UPGRADE-OFF
    title: Redshift cluster does not take version upgrades automatically
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: low
    entity: redshift-cluster
    refresh: 7d
    why: With automatic version upgrades off, the cluster misses engine fixes until someone upgrades it by hand.
    fix: Allow version upgrades during the maintenance window.
    refs: [FSBP:Redshift.6, NIST-800-53:SI-2]
    query:
      protocol: aws
      service: redshift
      action: DescribeClusters
      items: "//Cluster"
      key: "{_account}|{_region}|{ClusterIdentifier}"
    each: { field: AllowVersionUpgrade, op: eq, value: false }
    evidence: "cluster {ClusterIdentifier} ({_account} {_region}): version upgrades off"

  - id: AWS-REDSHIFT-ENHANCED-VPC-ROUTING-OFF
    title: Redshift cluster without enhanced VPC routing
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: redshift-cluster
    refresh: 7d
    why: Without enhanced VPC routing, COPY and UNLOAD traffic goes over the internet path instead of through the VPC, where endpoints, flow logs and policies apply.
    fix: Enable enhanced VPC routing and add the S3 gateway endpoint the cluster needs.
    refs: [FSBP:Redshift.7, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: redshift
      action: DescribeClusters
      items: "//Cluster"
      key: "{_account}|{_region}|{ClusterIdentifier}"
    each: { field: EnhancedVpcRouting, op: eq, value: false }
    evidence: "cluster {ClusterIdentifier} ({_account} {_region}): enhanced VPC routing off"

  - id: AWS-REDSHIFT-DEFAULT-ADMIN-USER
    title: Redshift cluster uses the default administrator name
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: redshift-cluster
    refresh: 7d
    why: The default admin user name awsuser is the first one any guessing attack tries.
    fix: Create the cluster (or a restored copy) with a non-default admin user name.
    refs: [FSBP:Redshift.8, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: redshift
      action: DescribeClusters
      items: "//Cluster"
      key: "{_account}|{_region}|{ClusterIdentifier}"
    each: { field: MasterUsername, op: eq, value: awsuser }
    evidence: "cluster {ClusterIdentifier} ({_account} {_region}): admin user {MasterUsername}"

  - id: AWS-REDSHIFT-DEFAULT-DB-NAME
    title: Redshift cluster uses the default database name
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: redshift-cluster
    refresh: 7d
    why: The default database name dev is known to every attacker and usually marks a cluster built from defaults.
    fix: Use a non-default database name at the next rebuild.
    refs: [FSBP:Redshift.9, NIST-800-53:CM-6]
    query:
      protocol: aws
      service: redshift
      action: DescribeClusters
      items: "//Cluster"
      key: "{_account}|{_region}|{ClusterIdentifier}"
    each: { field: DBName, op: eq, value: dev }
    evidence: "cluster {ClusterIdentifier} ({_account} {_region}): database name {DBName}"

  - id: AWS-REDSHIFT-AUDIT-LOGGING-OFF
    title: Redshift cluster audit logging is off
    kind: missing
    lens: security
    category: LOG
    severity: medium
    entity: redshift-cluster
    refresh: 7d
    why: Without audit logging there is no record of connections and user activity on the warehouse, often the organisation's largest store of data.
    fix: Enable audit logging to S3 or CloudWatch Logs (connection, user and user-activity logs).
    refs: [FSBP:Redshift.4, NIST-800-53:AU-12]
    query:
      protocol: aws
      service: redshift
      action: DescribeLoggingStatus
      for_each: { service: redshift, action: DescribeClusters, items: "//Cluster", field: ClusterIdentifier, max: 500 }
      params: { ClusterIdentifier: "{ClusterIdentifier}" }
      items: "//DescribeLoggingStatusResult"
      key: "{_account}|{_region}|{parent.ClusterIdentifier}"
    each: { field: LoggingEnabled, op: eq, value: false }
    evidence: "cluster {parent.ClusterIdentifier} ({_account} {_region}): audit logging off"

  - id: AWS-REDSHIFT-REQUIRE-SSL-OFF
    title: Redshift cluster does not require SSL
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: redshift-cluster
    refresh: 7d
    why: With require_ssl false in the cluster's parameter group, clients may connect in clear text and send credentials and query results unencrypted.
    fix: Set require_ssl to true in a custom parameter group assigned to the cluster, then reboot in a window.
    refs: [FSBP:Redshift.2, NIST-800-53:SC-8]
    query:
      protocol: aws
      service: redshift
      action: DescribeClusterParameters
      for_each: { service: redshift, action: DescribeClusters, items: "//Cluster", field: ClusterParameterGroups.ClusterParameterGroup.ParameterGroupName, max: 500 }
      params: { ParameterGroupName: "{ClusterParameterGroups.ClusterParameterGroup.ParameterGroupName}" }
      items: "//Parameters/Parameter"
      key: "{_account}|{_region}|{parent.ClusterIdentifier}|{ParameterName}"
    each:
      all:
        - { field: ParameterName, op: eq, value: require_ssl }
        - { field: ParameterValue, op: eq, value: false }
    evidence: "cluster {parent.ClusterIdentifier} ({_account} {_region}): require_ssl {ParameterValue}"

  - id: AWS-ELASTICACHE-AT-REST-UNENCRYPTED
    title: ElastiCache replication group not encrypted at rest
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: elasticache-group
    why: Cache data, snapshots and swap are stored unencrypted; caches often hold session tokens and personal data copied from the database.
    fix: Create an encrypted replication group from a backup and cut over (encryption at rest cannot be added in place on older engines).
    refs: [FSBP:ElastiCache.4, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: elasticache
      action: DescribeReplicationGroups
      items: "//ReplicationGroup"
      key: "{_account}|{_region}|{ReplicationGroupId}"
    each: { field: AtRestEncryptionEnabled, op: eq, value: false }
    evidence: "replication group {ReplicationGroupId} ({_account} {_region}): at-rest encryption off"

  - id: AWS-ELASTICACHE-IN-TRANSIT-UNENCRYPTED
    title: ElastiCache replication group not encrypted in transit
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: elasticache-group
    why: Without TLS, everything clients send to the cache - keys, values, AUTH tokens - crosses the network in clear text.
    fix: Enable in-transit encryption (preferred mode, then required) and move clients to TLS.
    refs: [FSBP:ElastiCache.5, NIST-800-53:SC-8]
    query:
      protocol: aws
      service: elasticache
      action: DescribeReplicationGroups
      items: "//ReplicationGroup"
      key: "{_account}|{_region}|{ReplicationGroupId}"
    each: { field: TransitEncryptionEnabled, op: eq, value: false }
    evidence: "replication group {ReplicationGroupId} ({_account} {_region}): in-transit encryption off"

  - id: AWS-ELASTICACHE-NO-AUTH
    title: ElastiCache replication group has no AUTH token or user group
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: elasticache-group
    why: With neither an AUTH token nor RBAC user groups, anything that can reach the cache's port can read and write it.
    fix: Configure RBAC user groups (or at least an AUTH token) and require TLS.
    refs: [FSBP:ElastiCache.6, NIST-800-53:IA-2, NIST-800-53:AC-3]
    query:
      protocol: aws
      service: elasticache
      action: DescribeReplicationGroups
      items: "//ReplicationGroup"
      key: "{_account}|{_region}|{ReplicationGroupId}"
    each:
      all:
        - { field: AuthTokenEnabled, op: eq, value: false }
        - { field: UserGroupIds.member, op: absent }
    evidence: "replication group {ReplicationGroupId} ({_account} {_region}): no AUTH token and no user group"

  - id: AWS-ELASTICACHE-NO-AUTO-FAILOVER
    title: ElastiCache replication group without automatic failover
    kind: misconfigured
    lens: maintenance
    category: AVL
    severity: low
    entity: elasticache-group
    refresh: 7d
    why: Without automatic failover a primary node failure means the cache is unavailable for writes until someone promotes a replica.
    fix: Enable Multi-AZ with automatic failover (needs at least one replica).
    refs: [FSBP:ElastiCache.3, NIST-800-53:CP-2]
    query:
      protocol: aws
      service: elasticache
      action: DescribeReplicationGroups
      items: "//ReplicationGroup"
      key: "{_account}|{_region}|{ReplicationGroupId}"
    each: { field: AutomaticFailover, op: ne, value: enabled }
    evidence: "replication group {ReplicationGroupId} ({_account} {_region}): automatic failover {AutomaticFailover}"

  - id: AWS-ELASTICACHE-NO-BACKUP
    title: ElastiCache replication group takes no automatic backups
    kind: missing
    lens: both
    category: BCK
    severity: low
    entity: elasticache-group
    refresh: 7d
    why: With a snapshot retention of zero, a cache that holds state (sessions, queues) cannot be restored after loss or corruption.
    fix: Set a snapshot retention limit (a few days) where the cache holds data that is not trivially rebuilt.
    refs: [FSBP:ElastiCache.1, NIST-800-53:CP-9]
    query:
      protocol: aws
      service: elasticache
      action: DescribeReplicationGroups
      items: "//ReplicationGroup"
      key: "{_account}|{_region}|{ReplicationGroupId}"
    each: { field: SnapshotRetentionLimit, op: eq, value: 0 }
    evidence: "replication group {ReplicationGroupId} ({_account} {_region}): snapshot retention 0"

  - id: AWS-ELASTICACHE-AUTO-MINOR-UPGRADE-OFF
    title: ElastiCache cluster auto minor version upgrade disabled
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: low
    entity: elasticache-cluster
    refresh: 7d
    why: Minor engine versions carry security fixes; with automatic upgrades off they wait for someone to remember.
    fix: Turn on auto minor version upgrade.
    refs: [FSBP:ElastiCache.2, NIST-800-53:SI-2]
    query:
      protocol: aws
      service: elasticache
      action: DescribeCacheClusters
      items: "//CacheCluster"
      key: "{_account}|{_region}|{CacheClusterId}"
    each: { field: AutoMinorVersionUpgrade, op: eq, value: false }
    evidence: "cache cluster {CacheClusterId} ({_account} {_region}): auto minor upgrade off, {Engine} {EngineVersion}"

  - id: AWS-ELASTICACHE-DEFAULT-SUBNET-GROUP
    title: ElastiCache cluster in the default subnet group
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: elasticache-cluster
    refresh: 7d
    why: The default subnet group spans the default VPC's subnets, which are usually public; caches belong in private, purpose-made subnets.
    fix: Recreate the cluster in a custom subnet group of private subnets.
    refs: [FSBP:ElastiCache.7, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: elasticache
      action: DescribeCacheClusters
      items: "//CacheCluster"
      key: "{_account}|{_region}|{CacheClusterId}"
    each: { field: CacheSubnetGroupName, op: eq, value: default }
    evidence: "cache cluster {CacheClusterId} ({_account} {_region}) in the default subnet group"

  # ---- ACM --------------------------------------------------------------------------------------

  - id: AWS-ACM-CERT-EXPIRY
    title: ACM certificate expiring soon
    kind: broken
    lens: both
    category: PKI
    severity:
      daysLeft: NotAfter
      ranges: [ { max: 0, value: critical }, { max: 14, value: high }, { max: 30, value: medium } ]
      default: low
    entity: certificate
    why: A certificate that expires takes its endpoint's TLS down with it; managed renewal can fail quietly (lost DNS validation records), and imported certificates never renew at all.
    fix: For managed certificates confirm the DNS validation records are still present; for imported ones renew and re-import before the date. Reach us-east-1 too for CloudFront.
    refs: [NIST-800-53:SC-12, NIST-800-53:SC-17, FSBP:ACM.1]
    deadline: NotAfter
    query:
      protocol: aws
      service: acm
      action: ListCertificates
      params: { Includes: { keyTypes: [RSA_1024, RSA_2048, RSA_3072, RSA_4096, EC_prime256v1, EC_secp384r1, EC_secp521r1] } }
      regions: all
      items: CertificateSummaryList
      key: CertificateArn
      name: DomainName
    each:
      all:
        - { field: Status, op: eq, value: ISSUED }
        - { field: NotAfter, op: until-lt, value: 30, threshold: aws.acm.notice-days }
    evidence: "certificate {DomainName} ({_account} {_region}): expires {NotAfter}, type {Type}, in use {InUse}"

  - id: AWS-ACM-CERT-EXPIRED-IN-USE
    title: Expired ACM certificate is still attached to a resource
    kind: broken
    lens: both
    category: PKI
    severity: critical
    entity: certificate
    why: An expired certificate that a load balancer, CloudFront distribution or API still serves means clients get certificate errors or refuse the connection now. AWS-ACM-CERT-EXPIRY reads issued certificates only, so once the date passes the status becomes EXPIRED and only this rule still sees it.
    fix: Request or import a valid certificate, swap it onto every resource listed in the certificate's InUseBy, then delete the expired one. For managed certificates find out why renewal failed (usually lost DNS validation records).
    refs: [NIST-800-53:SC-12, NIST-800-53:SC-17, FSBP:ACM.1]
    deadline: NotAfter
    query:
      protocol: aws
      service: acm
      action: ListCertificates
      params: { Includes: { keyTypes: [RSA_1024, RSA_2048, RSA_3072, RSA_4096, EC_prime256v1, EC_secp384r1, EC_secp521r1] } }
      regions: all
      items: CertificateSummaryList
      key: CertificateArn
      name: DomainName
    each:
      all:
        - { field: Status, op: eq, value: EXPIRED }
        - { field: InUse, op: eq, value: true }
    evidence: "certificate {DomainName} ({_account} {_region}): EXPIRED {NotAfter}, type {Type}, still in use"

  - id: AWS-ACM-CERT-IMPORTED
    title: Imported ACM certificate has no managed renewal
    kind: misconfigured
    lens: both
    category: PKI
    severity: low
    entity: certificate
    refresh: 7d
    why: An imported certificate is not renewed by ACM; unless someone tracks and re-imports it by hand it will one day expire silently and take its endpoint down.
    fix: Replace imported certificates with ACM-managed ones where the domain can be DNS-validated; otherwise record an owner and a renewal reminder for each.
    refs: [NIST-800-53:SC-12, NIST-800-53:SC-17]
    query:
      protocol: aws
      service: acm
      action: ListCertificates
      params: { Includes: { keyTypes: [RSA_1024, RSA_2048, RSA_3072, RSA_4096, EC_prime256v1, EC_secp384r1, EC_secp521r1] } }
      regions: all
      items: CertificateSummaryList
      key: CertificateArn
      name: DomainName
    each: { field: Type, op: eq, value: IMPORTED }
    evidence: "certificate {DomainName} ({_account} {_region}): imported, expires {NotAfter}, in use {InUse}"

  - id: AWS-ACM-CERT-FAILED
    title: ACM certificate failed, timed out or revoked
    kind: broken
    lens: both
    category: PKI
    severity: low
    entity: certificate
    refresh: 7d
    why: A certificate stuck in failed, validation-timed-out or revoked is not serving traffic and may leave an endpoint without the certificate someone believes is there.
    fix: Re-request and revalidate the certificate (or remove it) and confirm what it was meant to serve is covered.
    refs: [NIST-800-53:SC-12]
    query:
      protocol: aws
      service: acm
      action: ListCertificates
      params: { Includes: { keyTypes: [RSA_1024, RSA_2048, RSA_3072, RSA_4096, EC_prime256v1, EC_secp384r1, EC_secp521r1] } }
      regions: all
      items: CertificateSummaryList
      key: CertificateArn
      name: DomainName
    each: { field: Status, op: in, value: [FAILED, VALIDATION_TIMED_OUT, REVOKED] }
    evidence: "certificate {DomainName} ({_account} {_region}): status {Status}"

  - id: AWS-ACM-CERT-WEAK-KEY
    title: ACM certificate uses a 1024-bit RSA key
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: certificate
    refresh: 7d
    why: A 1024-bit RSA key is below every current baseline and within reach of well-resourced attackers; browsers and many clients already reject it.
    fix: Reissue (or re-import) the certificate with RSA 2048 or an ECDSA P-256/P-384 key and replace it where it is used.
    refs: [FSBP:ACM.2, NIST-800-53:SC-12, NIST-800-53:SC-13]
    query:
      protocol: aws
      service: acm
      action: ListCertificates
      params: { Includes: { keyTypes: [RSA_1024, RSA_2048, RSA_3072, RSA_4096, EC_prime256v1, EC_secp384r1, EC_secp521r1] } }
      regions: all
      items: CertificateSummaryList
      key: CertificateArn
      name: DomainName
    each: { field: KeyAlgorithm, op: match, value: '^RSA[-_]1024$' }
    evidence: "certificate {DomainName} ({_account} {_region}): key {KeyAlgorithm}, in use {InUse}"

  - id: AWS-ACM-CERT-WILDCARD
    title: ACM certificate is a wildcard certificate
    kind: misconfigured
    lens: security
    category: PKI
    severity: low
    entity: certificate
    refresh: 7d
    why: A wildcard certificate's key is valid for every host name under the domain; wherever its key is exposed (imported certificates especially) every subdomain can be impersonated.
    fix: Prefer certificates naming the specific hosts; where a wildcard is needed keep it ACM-managed (non-exportable) and record why.
    refs: [NIST-800-53:SC-12, NIST-800-53:SC-17]
    query:
      protocol: aws
      service: acm
      action: ListCertificates
      params: { Includes: { keyTypes: [RSA_1024, RSA_2048, RSA_3072, RSA_4096, EC_prime256v1, EC_secp384r1, EC_secp521r1] } }
      regions: all
      items: CertificateSummaryList
      key: CertificateArn
      name: DomainName
    each: { field: DomainName, op: match, value: '^\*\.' }
    evidence: "certificate {DomainName} ({_account} {_region}): type {Type}, in use {InUse}"

  - id: AWS-ACM-CERT-UNUSED
    title: Issued ACM certificate not in use
    kind: misconfigured
    lens: maintenance
    category: HYG
    severity: low
    entity: certificate
    refresh: 7d
    why: An issued certificate attached to nothing is clutter at best; an imported one still holds a valid private key for the domain that nobody is using.
    fix: Delete certificates no service uses.
    refs: [NIST-800-53:CM-8, NIST-800-53:SC-12]
    query:
      protocol: aws
      service: acm
      action: ListCertificates
      params: { Includes: { keyTypes: [RSA_1024, RSA_2048, RSA_3072, RSA_4096, EC_prime256v1, EC_secp384r1, EC_secp521r1] } }
      regions: all
      items: CertificateSummaryList
      key: CertificateArn
      name: DomainName
    each:
      all:
        - { field: Status, op: eq, value: ISSUED }
        - { field: InUse, op: eq, value: false }
    evidence: "certificate {DomainName} ({_account} {_region}): {Type}, not in use"

  # ---- Secrets Manager, CloudWatch Logs ---------------------------------------------------------

  - id: AWS-SECRET-ROTATION-DISABLED
    title: Secrets Manager secret has rotation disabled
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: secret
    why: A secret that never rotates stays valid for everyone who has ever read it; rotation bounds the damage of a leak and proves the secret is actually managed.
    fix: Enable rotation with a rotation function and a schedule; confirm the first rotation succeeds.
    refs: [FSBP:SecretsManager.1, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: secretsmanager
      action: ListSecrets
      items: SecretList
      key: ARN
      name: Name
    each:
      any:
        - { field: RotationEnabled, op: absent }
        - { field: RotationEnabled, op: ne, value: true }
    evidence: "secret {Name} ({_account} {_region}): rotation {RotationEnabled}, last rotated {LastRotatedDate}"

  - id: AWS-SECRET-UNUSED
    title: Secrets Manager secret unused for 90 days
    kind: misconfigured
    lens: maintenance
    category: HYG
    severity: low
    entity: secret
    refresh: 7d
    why: A secret nothing has read for months is either dead (and paying monthly) or a credential still live for an app that has gone away; either way it is a standing credential nobody is watching.
    fix: Confirm nothing uses it, then delete it with a recovery window; if it is a break-glass credential, record that so it is not deleted.
    refs: [NIST-800-53:IA-5, NIST-800-53:CM-8]
    query:
      protocol: aws
      service: secretsmanager
      action: ListSecrets
      items: SecretList
      key: ARN
      name: Name
    each:
      any:
        - { field: LastAccessedDate, op: absent }
        - { field: LastAccessedDate, op: age-gt, value: 90, threshold: aws.secrets.unused-days }
    evidence: "secret {Name} ({_account} {_region}): last accessed {LastAccessedDate}"

  - id: AWS-SECRET-NOT-CMK
    title: Secrets Manager secret encrypted with the AWS-managed key
    kind: misconfigured
    lens: security
    category: PKI
    severity: low
    entity: secret
    refresh: 7d
    why: With the default aws/secretsmanager key anyone the secret's policy admits can decrypt it; a customer key adds a second gate and allows cross-account sharing to be controlled.
    fix: Re-encrypt sensitive secrets with a customer-managed KMS key whose policy names the readers.
    refs: [NIST-800-53:SC-12, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: secretsmanager
      action: ListSecrets
      items: SecretList
      key: ARN
      name: Name
    each: { field: KmsKeyId, op: absent }
    evidence: "secret {Name} ({_account} {_region}) uses the AWS-managed key"

  - id: AWS-SECRET-ROTATION-INTERVAL-LONG
    title: Secrets Manager rotation interval longer than 90 days
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: secret
    refresh: 7d
    why: Rotation that runs less often than quarterly leaves a leaked secret usable for months.
    fix: Shorten the rotation schedule to 90 days or less.
    refs: [FSBP:SecretsManager.4, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: secretsmanager
      action: ListSecrets
      items: SecretList
      key: ARN
      name: Name
    each:
      all:
        - { field: RotationEnabled, op: eq, value: true }
        - { field: RotationRules.AutomaticallyAfterDays, op: gt, value: 90, threshold: aws.secrets.max-rotation-days }
    evidence: "secret {Name} ({_account} {_region}): rotates every {RotationRules.AutomaticallyAfterDays} days"

  - id: AWS-SECRET-POLICY-PUBLIC
    title: Secrets Manager resource policy admits any principal without a condition
    kind: misconfigured
    lens: security
    category: AUT
    severity: high
    entity: secret
    why: A resource policy statement for Principal "*" with no condition lets any AWS account read the secret, subject only to the key policy.
    fix: Replace the wildcard with specific principals or add aws:PrincipalOrgID / aws:SourceAccount conditions; turn on block public policy for the secret.
    refs: [NIST-800-53:AC-3, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: secretsmanager
      action: GetResourcePolicy
      for_each: { service: secretsmanager, action: ListSecrets, items: SecretList, field: Name, max: 2000 }
      params: { SecretId: "{Name}" }
      key: "{_account}|{_region}|{parent.Name}"
    each:
      all:
        - { field: ResourcePolicy, op: exists }
        - { field: ResourcePolicy, op: match, value: '(?:%22|")Principal(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%7B|\{)(?:(?!%7D|\})[\s\S])*?(?:%22|")AWS(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:%22|")))' }
        - { field: ResourcePolicy, op: notmatch, value: '(?:%22|")Condition(?:%22|")' }
    evidence: "secret {parent.Name} ({_account} {_region}): resource policy admits any principal"

  - id: AWS-LOG-GROUP-NO-RETENTION
    title: CloudWatch log group has no retention set
    kind: misconfigured
    lens: maintenance
    category: HYG
    severity: low
    entity: log-group
    refresh: 7d
    why: A log group set to never expire grows forever and bills forever; retention should match the policy (operational logs weeks to months, audit logs a year or more).
    fix: Set a retention policy on the log group that matches its class (PutRetentionPolicy).
    refs: [FSBP:CloudWatch.16, NIST-800-53:AU-11]
    query:
      protocol: aws
      service: logs
      action: DescribeLogGroups
      next: { from: nextToken, to: nextToken }
      items: logGroups
      key: "{_account}|{_region}|{logGroupName}"
      name: logGroupName
    each: { field: retentionInDays, op: absent }
    evidence: "log group {logGroupName} ({_account} {_region}): no retention, {storedBytes} bytes stored"

  - id: AWS-LOG-GROUP-NOT-KMS
    title: CloudWatch log group not encrypted with a KMS key
    kind: misconfigured
    lens: security
    category: PKI
    severity: low
    entity: log-group
    refresh: 7d
    why: Logs often hold personal data, tokens and internal addresses; a customer KMS key adds a second permission gate on reading them and lets access be revoked.
    fix: Associate a customer-managed KMS key with log groups holding sensitive or audit logs.
    refs: [NIST-800-53:AU-9, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: logs
      action: DescribeLogGroups
      next: { from: nextToken, to: nextToken }
      items: logGroups
      key: "{_account}|{_region}|{logGroupName}"
      name: logGroupName
    each: { field: kmsKeyId, op: absent }
    evidence: "log group {logGroupName} ({_account} {_region}): no KMS key"

  # ---- SSM agent --------------------------------------------------------------------------------

  - id: AWS-SSM-AGENT-OFFLINE
    title: SSM-managed instance is not connected
    kind: broken
    lens: maintenance
    category: HLT
    severity: medium
    entity: managed-instance
    why: An instance whose SSM agent is offline (connection lost) cannot be patched, inventoried or reached through Session Manager, and it drops out of the patch and OS-support checks that rely on SSM.
    fix: Investigate the agent and its network path to the SSM endpoints (restart the agent, check the VPC endpoints and the instance role).
    refs: [FSBP:SSM.1, NIST-800-53:CM-8, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: ssm
      action: DescribeInstanceInformation
      items: InstanceInformationList
      key: "{_account}|{InstanceId}"
      name: ComputerName
    each: { field: PingStatus, op: eq, value: ConnectionLost }
    evidence: "instance {InstanceId} ({_account} {_region}): ping status {PingStatus}, last ping {LastPingDateTime}"

  - id: AWS-SSM-AGENT-OUTDATED
    title: SSM agent is not the latest version
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: low
    entity: managed-instance
    refresh: 7d
    why: An old SSM agent misses fixes and features and can fail patching or inventory; the fleet should run a current agent.
    fix: Update the agent (the AWS-UpdateSSMAgent document, or Distributor) across the fleet.
    refs: [FSBP:SSM.1, NIST-800-53:SI-2]
    query:
      protocol: aws
      service: ssm
      action: DescribeInstanceInformation
      items: InstanceInformationList
      key: "{_account}|{InstanceId}"
      name: ComputerName
    each: { field: IsLatestVersion, op: eq, value: false }
    evidence: "instance {InstanceId} ({_account} {_region}): agent {AgentVersion}, latest {IsLatestVersion}"

  - id: AWS-SSM-WINDOWS-2012R2-OR-OLDER
    title: Managed instance runs Windows Server 2012 R2 or older
    kind: misconfigured
    lens: both
    category: LCM
    severity: high
    entity: managed-instance
    refresh: 7d
    deadline: 2026-10-13
    why: Windows Server 2012 and 2012 R2 (kernel 6.2/6.3) left extended support in October 2023 and their paid Extended Security Updates end on 2026-10-13; 2008 and 2008 R2 (6.0/6.1) are long past. After that no security fixes ship, and current agents, drivers and AMIs drop support. Only instances the SSM agent reports are seen; instances without the agent are not.
    fix: Migrate the workload to a supported Windows Server release (in-place upgrade, or rebuild on a current AMI) with its owner; until then isolate the instance and record the exception.
    refs: [NIST-800-53:SA-22, NIST-800-53:SI-2]
    query:
      protocol: aws
      service: ssm
      action: DescribeInstanceInformation
      items: InstanceInformationList
      key: "{_account}|{InstanceId}"
      name: ComputerName
    each:
      all:
        - { field: PlatformType, op: eq, value: Windows }
        - { field: PlatformVersion, op: match, value: '^6\.[0-3](\.|$)' }
    evidence: "instance {InstanceId} {ComputerName} ({_account} {_region}): {PlatformName} {PlatformVersion}, ping {PingStatus}"

  - id: AWS-SSM-DOCUMENT-PUBLIC
    title: Self-owned SSM document is shared publicly
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: ssm-document
    why: A public SSM document is readable by every AWS account; documents routinely contain internal host names, paths, scripts and sometimes credentials.
    fix: Remove "all" from the document's share permission and turn on the account setting that blocks public sharing.
    refs: [FSBP:SSM.4, NIST-800-53:AC-3]
    query:
      protocol: aws
      service: ssm
      action: DescribeDocumentPermission
      for_each: { service: ssm, action: ListDocuments, params: { Filters: [ { Key: Owner, Values: [Self] } ] }, items: DocumentIdentifiers, field: Name, max: 2000 }
      params: { Name: "{Name}", PermissionType: Share }
      key: "{_account}|{_region}|{parent.Name}"
    each:
      all:
        - { field: AccountIds, op: exists }
        - { field: AccountIds, op: contains, value: all }
    evidence: "document {parent.Name} ({_account} {_region}) is shared with all accounts"

  - id: AWS-SSM-PUBLIC-SHARING-NOT-BLOCKED
    title: SSM public document sharing is not blocked in a region
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: region
    refresh: 7d
    why: The account-level block stops anyone from making a document public in the region, so one mistaken share cannot expose it.
    fix: Turn on block public sharing for SSM documents in every region.
    refs: [FSBP:SSM.7, NIST-800-53:AC-3]
    query:
      protocol: aws
      service: ssm
      action: GetServiceSetting
      params: { SettingId: /ssm/documents/console/public-sharing-permission }
      items: ServiceSetting
      key: "{_account}|{_region}"
    each: { field: SettingValue, op: eq, value: Enable }
    evidence: "account {_account} {_region}: public document sharing {SettingValue}"

  - id: AWS-SSM-PATCH-NONCOMPLIANT
    title: SSM-managed instance not compliant with its patch baseline
    kind: broken
    lens: both
    category: LCM
    severity: medium
    entity: managed-instance
    why: Patch Manager reports missing approved patches on the instance; each one is a known vulnerability left open.
    fix: Run the patch baseline (install) on the instance in its maintenance window and investigate repeated failures.
    refs: [FSBP:SSM.2, NIST-800-53:SI-2, NIST-800-53:RA-5]
    query:
      protocol: aws
      service: ssm
      action: ListResourceComplianceSummaries
      params: { Filters: [ { Key: ComplianceType, Values: [Patch], Type: EQUAL } ] }
      items: ResourceComplianceSummaryItems
      key: "{_account}|{_region}|{ResourceId}"
    each: { field: Status, op: eq, value: NON_COMPLIANT }
    evidence: "instance {ResourceId} ({_account} {_region}): patch {Status}, severity {OverallSeverity}, {NonCompliantSummary.NonCompliantCount} missing"

  - id: AWS-SSM-ASSOCIATION-NONCOMPLIANT
    title: SSM-managed instance not compliant with an association
    kind: broken
    lens: maintenance
    category: CFG
    severity: low
    entity: managed-instance
    refresh: 1d
    why: A failed State Manager association means a configuration the organisation enforces (agent install, hardening, inventory) did not apply on the instance.
    fix: Read the association's execution output and fix the cause, then re-run it.
    refs: [FSBP:SSM.3, NIST-800-53:CM-6]
    query:
      protocol: aws
      service: ssm
      action: ListResourceComplianceSummaries
      params: { Filters: [ { Key: ComplianceType, Values: [Association], Type: EQUAL } ] }
      items: ResourceComplianceSummaryItems
      key: "{_account}|{_region}|{ResourceId}"
    each: { field: Status, op: eq, value: NON_COMPLIANT }
    evidence: "instance {ResourceId} ({_account} {_region}): association {Status}, {NonCompliantSummary.NonCompliantCount} failing"

  # ---- ECR --------------------------------------------------------------------------------------

  - id: AWS-ECR-SCAN-ON-PUSH-OFF
    title: ECR repository does not scan images on push
    kind: misconfigured
    lens: security
    category: LCM
    severity: low
    entity: ecr-repository
    why: Without scan-on-push a vulnerable image can be pushed and deployed with nobody told; scanning at push time is the cheapest place to catch it.
    fix: Enable scan-on-push (or register the repository with enhanced scanning via Inspector).
    refs: [FSBP:ECR.1, NIST-800-53:RA-5, NIST-800-53:SI-2]
    query:
      protocol: aws
      service: ecr
      action: DescribeRepositories
      next: { from: nextToken, to: nextToken }
      items: repositories
      key: repositoryArn
      name: repositoryName
    each: { field: "imageScanningConfiguration.scanOnPush", op: ne, value: true }
    evidence: "repository {repositoryName} ({_account} {_region}): scan on push {imageScanningConfiguration.scanOnPush}"

  - id: AWS-ECR-TAG-MUTABLE
    title: ECR repository has mutable image tags
    kind: misconfigured
    lens: security
    category: LCM
    severity: low
    entity: ecr-repository
    refresh: 7d
    why: With mutable tags, an image tag such as "prod" can be overwritten after it is scanned and approved, so what runs is not what was reviewed.
    fix: Set the repository's tag mutability to IMMUTABLE and promote images by digest or new tag.
    refs: [FSBP:ECR.2, NIST-800-53:CM-2]
    query:
      protocol: aws
      service: ecr
      action: DescribeRepositories
      next: { from: nextToken, to: nextToken }
      items: repositories
      key: repositoryArn
      name: repositoryName
    each: { field: imageTagMutability, op: eq, value: MUTABLE }
    evidence: "repository {repositoryName} ({_account} {_region}): tag mutability {imageTagMutability}"

  - id: AWS-ECR-REPO-POLICY-PUBLIC
    title: ECR repository policy admits any principal without a condition
    kind: misconfigured
    lens: security
    category: AUT
    severity: high
    entity: ecr-repository
    why: A repository policy for Principal "*" with no condition lets any AWS account pull (or push, if the actions allow it) the images - code, configuration and anything baked in.
    fix: Replace the wildcard with specific accounts or an aws:PrincipalOrgID condition.
    refs: [NIST-800-53:AC-3, MITRE-ATTACK:T1525]
    query:
      protocol: aws
      service: ecr
      action: GetRepositoryPolicy
      for_each: { service: ecr, action: DescribeRepositories, items: repositories, field: repositoryName, max: 2000, next: { from: nextToken, to: nextToken } }
      params: { repositoryName: "{repositoryName}" }
      missing: empty
      key: "{_account}|{_region}|{parent.repositoryName}"
    each:
      all:
        - { field: policyText, op: match, value: '(?:%22|")Principal(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%7B|\{)(?:(?!%7D|\})[\s\S])*?(?:%22|")AWS(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:%22|")))' }
        - { field: policyText, op: notmatch, value: '(?:%22|")Condition(?:%22|")' }
    evidence: "repository {parent.repositoryName} ({_account} {_region}): policy admits any principal"

  - id: AWS-ECR-NOT-KMS
    title: ECR repository not encrypted with a KMS key
    kind: misconfigured
    lens: security
    category: PKI
    severity: low
    entity: ecr-repository
    refresh: 7d
    why: With AES256 (S3-managed) encryption there is no key policy gate on image layers; a KMS key adds one and lets access be revoked.
    fix: Create repositories with KMS encryption (encryption type cannot be changed after creation; recreate and re-push).
    refs: [FSBP:ECR.5, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: ecr
      action: DescribeRepositories
      next: { from: nextToken, to: nextToken }
      items: repositories
      key: repositoryArn
      name: repositoryName
    each: { field: encryptionConfiguration.encryptionType, op: eq, value: AES256 }
    evidence: "repository {repositoryName} ({_account} {_region}): encryption {encryptionConfiguration.encryptionType}"

  # ---- Organizations and Access Analyzer --------------------------------------------------------

  - id: AWS-ORG-ACCOUNTS-NONE
    title: The review identity sees no organisation accounts
    kind: missing
    lens: both
    category: MON
    severity: medium
    entity: instance
    why: With no account visible from the payer, every organisation-wide check reads nothing and the result looks clean; it usually means the identity is not in the management account or lacks the organisations read.
    fix: Run the review from (or with a role into) the management account and grant organizations:ListAccounts, then rerun.
    refs: [NIST-800-53:CA-7]
    query:
      protocol: aws
      service: organizations
      action: ListAccounts
      accounts: own
      items: Accounts
      key: Id
      name: Name
    count: none
    evidence: "no organisation accounts returned"

  - id: AWS-ORG-ACCOUNT-NOT-ACTIVE
    title: Organisation account is not active
    kind: broken
    lens: maintenance
    category: AVL
    severity: medium
    entity: account
    why: A suspended or pending-closure account may still hold resources, backups or a trail that other accounts depend on; its state should be a deliberate, recorded decision.
    fix: Confirm the account's state is intended; reactivate it, or finish decommissioning and move out anything still needed.
    refs: [NIST-800-53:CM-8]
    query:
      protocol: aws
      service: organizations
      action: ListAccounts
      accounts: own
      items: Accounts
      key: Id
      name: Name
    each: { field: Status, op: ne, value: ACTIVE }
    evidence: "account {Name}: status {Status}, joined {JoinedTimestamp}"

  - id: AWS-ORG-NOT-ALL-FEATURES
    title: Organisation is not using all features
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: instance
    refresh: 7d
    why: With only consolidated billing enabled, the organisation cannot apply service control policies or other guardrails; the whole SCP-based control set is unavailable.
    fix: Enable all features for the organisation (every member must confirm), then apply the baseline guardrails.
    refs: [NIST-800-53:AC-3, NIST-800-53:CM-6]
    query:
      protocol: aws
      service: organizations
      action: DescribeOrganization
      accounts: own
      items: Organization
      key: Id
      min_rows: 1
    each: { field: FeatureSet, op: ne, value: ALL }
    evidence: "organisation {Id}: feature set {FeatureSet}"

  - id: AWS-ORG-NO-SCP
    title: No service control policy beyond the default
    kind: missing
    lens: security
    category: CFG
    severity: medium
    entity: instance
    refresh: 7d
    why: Service control policies are the organisation-wide guardrails (deny leaving the org, disabling CloudTrail/Config/GuardDuty, deleting flow logs, using unapproved regions); with only the default FullAWSAccess present there are no guardrails at all.
    fix: Create and attach baseline SCPs (region deny and a deny set for the security services) to the organisation's OUs.
    refs: [NIST-800-53:AC-3, NIST-800-53:CM-6, CIS-AWS:1.1]
    query:
      protocol: aws
      service: organizations
      action: ListPolicies
      accounts: own
      params: { Filter: SERVICE_CONTROL_POLICY }
      items: Policies
      key: Id
      name: Name
    count: { op: lt, value: 2 }
    evidence: "{count} service control polic(y/ies) defined, the default included"

  - id: AWS-ACCESS-ANALYZER-NONE
    title: No IAM Access Analyzer in a region
    kind: missing
    lens: security
    category: IAM
    severity: medium
    entity: instance
    why: IAM Access Analyzer is what surfaces resources shared outside the organisation's zone of trust; with no analyzer, external-access and unused-access findings are simply never produced. This whole-estate check fires only if no analyzer exists anywhere; per-region gaps are in the backlog.
    fix: Create an organisation external-access analyzer (and an unused-access analyzer) in every used region, in the delegated admin account.
    refs: [NIST-800-53:AC-6, NIST-800-53:CA-7]
    query:
      protocol: aws
      service: access-analyzer
      action: ListAnalyzers
      path: /analyzer
      items: analyzers
      key: arn
      name: name
    count: none
    evidence: "no Access Analyzer returned in any read region"

  - id: AWS-ACCESS-ANALYZER-NOT-ACTIVE
    title: IAM Access Analyzer is not active
    kind: broken
    lens: security
    category: IAM
    severity: medium
    entity: access-analyzer
    why: An analyzer that is not active produces no findings, so external or unused access goes unseen while the analyzer appears to exist.
    fix: Investigate why the analyzer is not active (it needs the service-linked role and permissions) and restore it.
    refs: [NIST-800-53:AC-6, NIST-800-53:CA-7]
    query:
      protocol: aws
      service: access-analyzer
      action: ListAnalyzers
      path: /analyzer
      items: analyzers
      key: arn
      name: name
    each: { field: status, op: ne, value: ACTIVE }
    evidence: "analyzer {name} ({_account} {_region}): status {status}, type {type}"

  - id: AWS-ORG-SCP-TYPE-DISABLED
    title: Service control policies are not enabled on the organisation root
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: instance
    refresh: 7d
    why: Until the SCP policy type is enabled on the root, no service control policy can be attached anywhere in the organisation, whatever policies exist.
    fix: Enable the SERVICE_CONTROL_POLICY policy type on the root, then attach the baseline guardrails.
    refs: [NIST-800-53:AC-3, NIST-800-53:CM-6]
    query:
      protocol: aws
      service: organizations
      action: ListRoots
      accounts: own
      items: Roots
      key: Id
      name: Name
    each:
      not: { element: { of: PolicyTypes, where: { all: [ { field: Type, op: eq, value: SERVICE_CONTROL_POLICY }, { field: Status, op: eq, value: ENABLED } ] } } }
    evidence: "organisation root {Id}: SCP policy type not enabled"

  - id: AWS-ORG-RCP-TYPE-DISABLED
    title: Resource control policies are not enabled on the organisation root
    kind: missing
    lens: security
    category: CFG
    severity: medium
    entity: instance
    refresh: 7d
    why: Resource control policies cap what resources in the organisation (S3 buckets, KMS keys, roles, secrets, queues) may grant to principals outside it, whatever each resource's own policy says; until the policy type is enabled on the root none can be attached. Only the management account (or a delegated administrator) can read the root.
    fix: Enable the RESOURCE_CONTROL_POLICY policy type on the root, then attach a data-perimeter RCP that limits access to the organisation's own principals and AWS services, after testing it on a non-production OU.
    refs: [NIST-800-53:AC-3, NIST-800-53:AC-21, NIST-800-53:CM-6]
    query:
      protocol: aws
      service: organizations
      action: ListRoots
      accounts: own
      items: Roots
      key: Id
      name: Name
    each:
      not: { element: { of: PolicyTypes, where: { all: [ { field: Type, op: eq, value: RESOURCE_CONTROL_POLICY }, { field: Status, op: eq, value: ENABLED } ] } } }
    evidence: "organisation root {Id}: RCP policy type not enabled"

  - id: AWS-ORG-BACKUP-TAG-POLICY-TYPE-DISABLED
    title: Backup or tag policies are not enabled on the organisation root
    kind: missing
    lens: both
    category: CFG
    severity: low
    entity: instance
    refresh: 7d
    why: Backup policies let the organisation require backup plans on every account, and tag policies enforce the tags that cost allocation and ownership depend on; with either type disabled on the root, each account is left to its own configuration.
    fix: Enable the BACKUP_POLICY and TAG_POLICY policy types on the root and attach baseline policies (a backup plan for tagged resources, the required tag keys and values).
    refs: [NIST-800-53:CP-9, NIST-800-53:CM-8]
    query:
      protocol: aws
      service: organizations
      action: ListRoots
      accounts: own
      items: Roots
      key: Id
      name: Name
    each:
      any:
        - not: { element: { of: PolicyTypes, where: { all: [ { field: Type, op: eq, value: BACKUP_POLICY }, { field: Status, op: eq, value: ENABLED } ] } } }
        - not: { element: { of: PolicyTypes, where: { all: [ { field: Type, op: eq, value: TAG_POLICY }, { field: Status, op: eq, value: ENABLED } ] } } }
    evidence: "organisation root {Id}: policy types listed {PolicyTypes[].Type} - backup or tag policy not enabled"

  - id: AWS-ACCESS-ANALYZER-REGION-NONE
    title: No active external-access analyzer in an account and region
    kind: missing
    lens: security
    category: IAM
    severity: low
    entity: region
    refresh: 7d
    why: CIS expects IAM Access Analyzer in every region so resources shared outside the zone of trust are reported where they live. One row per account and region read; member accounts covered by an organisation analyzer in the delegated administrator show here too and need only a recorded exception.
    fix: Create an organisation (or account) external-access analyzer in every region in use.
    refs: [CIS-AWS:1.20, NIST-800-53:AC-6, NIST-800-53:CA-7]
    query:
      protocol: aws
      service: access-analyzer
      action: ListAnalyzers
      path: /analyzer
      key: "{_account}|{_region}"
    each:
      not: { element: { of: analyzers, where: { all: [ { field: type, op: in, value: [ACCOUNT, ORGANIZATION] }, { field: status, op: eq, value: ACTIVE } ] } } }
    evidence: "account {_account} {_region}: no active external-access analyzer"

  - id: AWS-ACCESS-ANALYZER-NO-UNUSED-ACCESS
    title: No unused-access analyzer anywhere
    kind: missing
    lens: security
    category: IAM
    severity: low
    entity: instance
    refresh: 7d
    why: The unused-access analyzer lists roles, keys, passwords and permissions nobody has used - the cheapest way to shrink standing access across the organisation.
    fix: Create an organisation unused-access analyzer in the delegated administrator account.
    refs: [NIST-800-53:AC-2, NIST-800-53:AC-6]
    query:
      protocol: aws
      service: access-analyzer
      action: ListAnalyzers
      path: /analyzer
      items: analyzers
      key: arn
      name: name
    count: { op: lt, value: 1, where: { field: type, op: match, value: 'UNUSED_ACCESS' } }
    evidence: "{count} unused-access analyzers of {rows} analyzers"

  # ---- GuardDuty, Security Hub, Inspector ------------------------------------------------------
  # With no items the whole answer is one row per account and region, so "none here" is a finding.

  - id: AWS-GUARDDUTY-NOT-ENABLED
    title: GuardDuty is not enabled in an account and region
    kind: missing
    lens: security
    category: MON
    severity: high
    entity: region
    why: Without a GuardDuty detector there is no managed threat detection on CloudTrail, VPC flow and DNS activity in the region - an attacker working there is not noticed. Unused regions are a favourite place to work.
    fix: Enable GuardDuty organisation-wide from the delegated administrator, with auto-enable for new accounts, in every region.
    refs: [FSBP:GuardDuty.1, NIST-800-53:SI-4, NIST-800-53:IR-4]
    query:
      protocol: aws
      service: guardduty
      action: ListDetectors
      path: /detector
      key: "{_account}|{_region}"
    each: { field: detectorIds, op: empty }
    evidence: "account {_account} {_region}: no GuardDuty detector"

  - id: AWS-GUARDDUTY-DETECTOR-SUSPENDED
    title: GuardDuty detector is suspended
    kind: broken
    lens: security
    category: MON
    severity: high
    entity: guardduty-detector
    why: A suspended detector produces no findings while appearing to exist; suspending GuardDuty is also a step an attacker takes to go dark.
    fix: Re-enable the detector and find out who suspended it and why.
    refs: [FSBP:GuardDuty.1, NIST-800-53:SI-4, MITRE-ATTACK:T1562.001]
    query:
      protocol: aws
      service: guardduty
      action: GetDetector
      for_each: { service: guardduty, action: ListDetectors, path: /detector, items: detectorIds, field: value, max: 500 }
      path: "/detector/{value}"
      key: "{_account}|{_region}|{parent.value}"
    each: { field: status, op: ne, value: ENABLED }
    evidence: "detector {parent.value} ({_account} {_region}): status {status}"

  - id: AWS-GUARDDUTY-S3-PROTECTION-OFF
    title: GuardDuty S3 protection is off
    kind: misconfigured
    lens: security
    category: MON
    severity: medium
    entity: guardduty-detector
    refresh: 7d
    why: S3 protection watches data-plane access to buckets (unusual reads, exfiltration, disabled logging); without it bucket data theft raises no finding.
    fix: Enable the S3 data events protection plan on the detector (organisation-wide auto-enable).
    refs: [FSBP:GuardDuty.10, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: guardduty
      action: GetDetector
      for_each: { service: guardduty, action: ListDetectors, path: /detector, items: detectorIds, field: value, max: 500 }
      path: "/detector/{value}"
      key: "{_account}|{_region}|{parent.value}"
    each:
      element: { of: features, where: { all: [ { field: name, op: eq, value: S3_DATA_EVENTS }, { field: status, op: ne, value: ENABLED } ] } }
    evidence: "detector {parent.value} ({_account} {_region}): S3 protection off"

  - id: AWS-GUARDDUTY-EKS-AUDIT-OFF
    title: GuardDuty EKS audit log monitoring is off
    kind: misconfigured
    lens: security
    category: MON
    severity: low
    entity: guardduty-detector
    refresh: 7d
    why: EKS audit log monitoring detects suspicious Kubernetes API activity (anonymous access, privileged pods, credential access) in the account's clusters.
    fix: Enable EKS protection (audit logs) on the detector where EKS is used.
    refs: [FSBP:GuardDuty.5, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: guardduty
      action: GetDetector
      for_each: { service: guardduty, action: ListDetectors, path: /detector, items: detectorIds, field: value, max: 500 }
      path: "/detector/{value}"
      key: "{_account}|{_region}|{parent.value}"
    each:
      element: { of: features, where: { all: [ { field: name, op: eq, value: EKS_AUDIT_LOGS }, { field: status, op: ne, value: ENABLED } ] } }
    evidence: "detector {parent.value} ({_account} {_region}): EKS audit log monitoring off"

  - id: AWS-GUARDDUTY-MALWARE-PROTECTION-OFF
    title: GuardDuty malware protection for EC2 is off
    kind: misconfigured
    lens: security
    category: MON
    severity: low
    entity: guardduty-detector
    refresh: 7d
    why: Malware protection scans the EBS volumes of instances GuardDuty suspects, confirming whether a finding is a real compromise.
    fix: Enable the EBS malware protection plan on the detector.
    refs: [FSBP:GuardDuty.8, NIST-800-53:SI-3]
    query:
      protocol: aws
      service: guardduty
      action: GetDetector
      for_each: { service: guardduty, action: ListDetectors, path: /detector, items: detectorIds, field: value, max: 500 }
      path: "/detector/{value}"
      key: "{_account}|{_region}|{parent.value}"
    each:
      element: { of: features, where: { all: [ { field: name, op: eq, value: EBS_MALWARE_PROTECTION }, { field: status, op: ne, value: ENABLED } ] } }
    evidence: "detector {parent.value} ({_account} {_region}): EC2 malware protection off"

  - id: AWS-GUARDDUTY-RDS-PROTECTION-OFF
    title: GuardDuty RDS login monitoring is off
    kind: misconfigured
    lens: security
    category: MON
    severity: low
    entity: guardduty-detector
    refresh: 7d
    why: RDS protection profiles Aurora/RDS login activity and flags brute force and anomalous logins to the databases.
    fix: Enable the RDS login events protection plan on the detector where Aurora or RDS is used.
    refs: [FSBP:GuardDuty.9, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: guardduty
      action: GetDetector
      for_each: { service: guardduty, action: ListDetectors, path: /detector, items: detectorIds, field: value, max: 500 }
      path: "/detector/{value}"
      key: "{_account}|{_region}|{parent.value}"
    each:
      element: { of: features, where: { all: [ { field: name, op: eq, value: RDS_LOGIN_EVENTS }, { field: status, op: ne, value: ENABLED } ] } }
    evidence: "detector {parent.value} ({_account} {_region}): RDS login monitoring off"

  - id: AWS-GUARDDUTY-LAMBDA-PROTECTION-OFF
    title: GuardDuty Lambda network monitoring is off
    kind: misconfigured
    lens: security
    category: MON
    severity: low
    entity: guardduty-detector
    refresh: 7d
    why: Lambda protection watches functions' network activity for crypto-mining, command-and-control and exfiltration.
    fix: Enable the Lambda network logs protection plan on the detector.
    refs: [FSBP:GuardDuty.6, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: guardduty
      action: GetDetector
      for_each: { service: guardduty, action: ListDetectors, path: /detector, items: detectorIds, field: value, max: 500 }
      path: "/detector/{value}"
      key: "{_account}|{_region}|{parent.value}"
    each:
      element: { of: features, where: { all: [ { field: name, op: eq, value: LAMBDA_NETWORK_LOGS }, { field: status, op: ne, value: ENABLED } ] } }
    evidence: "detector {parent.value} ({_account} {_region}): Lambda network monitoring off"

  - id: AWS-GUARDDUTY-RUNTIME-MONITORING-OFF
    title: GuardDuty runtime monitoring is off
    kind: misconfigured
    lens: security
    category: MON
    severity: low
    entity: guardduty-detector
    refresh: 7d
    why: Runtime monitoring sees process, file and network events inside EC2, ECS and EKS workloads - the layer where most container and host compromises show.
    fix: Enable runtime monitoring (with automated agent management) on the detector.
    refs: [FSBP:GuardDuty.11, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: guardduty
      action: GetDetector
      for_each: { service: guardduty, action: ListDetectors, path: /detector, items: detectorIds, field: value, max: 500 }
      path: "/detector/{value}"
      key: "{_account}|{_region}|{parent.value}"
    each:
      element: { of: features, where: { all: [ { field: name, op: eq, value: RUNTIME_MONITORING }, { field: status, op: ne, value: ENABLED } ] } }
    evidence: "detector {parent.value} ({_account} {_region}): runtime monitoring off"

  - id: AWS-GUARDDUTY-HIGH-SEVERITY-FINDINGS
    title: Open high-severity GuardDuty finding
    kind: broken
    lens: security
    category: MON
    severity: high
    entity: guardduty-finding
    refresh: 6h
    why: A high-severity GuardDuty finding that is not archived is a likely compromise (credential misuse, malware, exfiltration) nobody has closed.
    fix: Triage the finding in GuardDuty, contain the resource if it is real, and archive it with the outcome; suppress known-benign patterns with a filter.
    refs: [NIST-800-53:IR-4, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: guardduty
      action: ListFindings
      method: post
      for_each: { service: guardduty, action: ListDetectors, path: /detector, items: detectorIds, field: value, max: 500 }
      path: "/detector/{value}/findings"
      params: { findingCriteria: { criterion: { severity: { gte: 7 }, "service.archived": { eq: ["false"] } } }, maxResults: 50 }
      items: findingIds
      next: { from: nextToken, to: nextToken }
      maxPages: 20
      key: "{_account}|{_region}|{value}"
    each: any
    evidence: "GuardDuty finding {value} (severity 7+) open in detector {parent.value} ({_account} {_region})"

  - id: AWS-SECURITYHUB-FSBP-OFF
    title: Security Hub without the AWS Foundational Security Best Practices standard
    kind: missing
    lens: security
    category: MON
    severity: medium
    entity: region
    refresh: 7d
    why: The FSBP standard is AWS's own continuous check of hundreds of controls; without it Security Hub aggregates findings but evaluates no baseline. A region where Security Hub is off answers an error and reads as unknown (see the backlog).
    fix: Enable Security Hub with the FSBP standard organisation-wide (central configuration) in every region.
    refs: [FSBP:SecurityHub.1, NIST-800-53:CA-7, NIST-800-53:CM-6]
    query:
      protocol: aws
      service: securityhub
      action: GetEnabledStandards
      method: post
      path: /standards/get
      key: "{_account}|{_region}"
    each:
      not: { element: { of: StandardsSubscriptions, where: { all: [ { field: StandardsArn, op: match, value: 'aws-foundational-security-best-practices' }, { field: StandardsStatus, op: eq, value: READY } ] } } }
    evidence: "account {_account} {_region}: FSBP standard not enabled and ready"

  - id: AWS-SECURITYHUB-CIS-OFF
    title: Security Hub without a CIS AWS Foundations standard
    kind: missing
    lens: security
    category: MON
    severity: low
    entity: region
    refresh: 7d
    why: The CIS standard maps findings to the CIS AWS Foundations Benchmark that auditors and insurers ask about.
    fix: Enable a current CIS AWS Foundations Benchmark standard in Security Hub.
    refs: [NIST-800-53:CA-7]
    query:
      protocol: aws
      service: securityhub
      action: GetEnabledStandards
      method: post
      path: /standards/get
      key: "{_account}|{_region}"
    each:
      not: { element: { of: StandardsSubscriptions, where: { all: [ { field: StandardsArn, op: match, value: 'cis-aws-foundations-benchmark' }, { field: StandardsStatus, op: eq, value: READY } ] } } }
    evidence: "account {_account} {_region}: CIS standard not enabled and ready"

  - id: AWS-SECURITYHUB-STANDARD-FAILED
    title: Security Hub standard subscription failed or incomplete
    kind: broken
    lens: security
    category: MON
    severity: low
    entity: securityhub-standard
    refresh: 1d
    why: A standard in FAILED or INCOMPLETE state is not evaluating its controls, though it appears enabled.
    fix: Read the status reason, fix the cause (usually AWS Config not recording the needed types) and re-enable the standard.
    refs: [NIST-800-53:CA-7]
    query:
      protocol: aws
      service: securityhub
      action: GetEnabledStandards
      method: post
      path: /standards/get
      items: StandardsSubscriptions
      key: StandardsSubscriptionArn
    each: { field: StandardsStatus, op: in, value: [FAILED, INCOMPLETE] }
    evidence: "{StandardsArn} ({_account} {_region}): {StandardsStatus} {StandardsStatusReason.StatusReasonCode}"

  - id: AWS-SECURITYHUB-CRITICAL-FINDINGS
    title: Open critical Security Hub finding
    kind: broken
    lens: security
    category: MON
    severity: high
    entity: securityhub-finding
    refresh: 6h
    why: A critical, active finding in NEW or NOTIFIED workflow state has not been triaged - from a failed control or an integrated detector.
    fix: Triage the finding, fix or suppress it with a reason, and set its workflow status.
    refs: [NIST-800-53:IR-4, NIST-800-53:CA-7]
    query:
      protocol: aws
      service: securityhub
      action: GetFindings
      method: post
      path: /findings
      params: { Filters: { SeverityLabel: [ { Value: CRITICAL, Comparison: EQUALS } ], RecordState: [ { Value: ACTIVE, Comparison: EQUALS } ], WorkflowStatus: [ { Value: NEW, Comparison: EQUALS }, { Value: NOTIFIED, Comparison: EQUALS } ] }, MaxResults: 100 }
      items: Findings
      next: { from: NextToken, to: NextToken }
      maxPages: 20
      key: Id
    each: any
    evidence: "{ProductName}: {Title} on {Resources[].Id} ({_account} {_region})"

  - id: AWS-INSPECTOR-EC2-SCAN-OFF
    title: Inspector EC2 scanning is not enabled
    kind: missing
    lens: security
    category: LCM
    severity: medium
    entity: region
    refresh: 7d
    why: Without Inspector EC2 scanning, known vulnerabilities in the instances' packages are not reported in the region.
    fix: Enable Amazon Inspector EC2 scanning organisation-wide (agent-based through SSM or agentless).
    refs: [FSBP:Inspector.1, NIST-800-53:RA-5, NIST-800-53:SI-2]
    query:
      protocol: aws
      service: inspector2
      action: BatchGetAccountStatus
      method: post
      path: /status/batch/get
      items: accounts
      key: "{_account}|{_region}|{accountId}"
    each: { field: resourceState.ec2.status, op: ne, value: ENABLED }
    evidence: "account {accountId} {_region}: Inspector EC2 scanning {resourceState.ec2.status}"

  - id: AWS-INSPECTOR-ECR-SCAN-OFF
    title: Inspector ECR scanning is not enabled
    kind: missing
    lens: security
    category: LCM
    severity: medium
    entity: region
    refresh: 7d
    why: Without Inspector ECR scanning, container images are checked only by basic scan-on-push (if at all) and never re-checked as new vulnerabilities are published.
    fix: Enable Inspector ECR enhanced scanning with continuous re-scanning.
    refs: [FSBP:Inspector.2, NIST-800-53:RA-5]
    query:
      protocol: aws
      service: inspector2
      action: BatchGetAccountStatus
      method: post
      path: /status/batch/get
      items: accounts
      key: "{_account}|{_region}|{accountId}"
    each: { field: resourceState.ecr.status, op: ne, value: ENABLED }
    evidence: "account {accountId} {_region}: Inspector ECR scanning {resourceState.ecr.status}"

  - id: AWS-INSPECTOR-LAMBDA-SCAN-OFF
    title: Inspector Lambda scanning is not enabled
    kind: missing
    lens: security
    category: LCM
    severity: low
    entity: region
    refresh: 7d
    why: Without Lambda scanning, vulnerable dependencies packaged into functions are not reported.
    fix: Enable Inspector Lambda standard scanning.
    refs: [FSBP:Inspector.4, NIST-800-53:RA-5]
    query:
      protocol: aws
      service: inspector2
      action: BatchGetAccountStatus
      method: post
      path: /status/batch/get
      items: accounts
      key: "{_account}|{_region}|{accountId}"
    each: { field: resourceState.lambda.status, op: ne, value: ENABLED }
    evidence: "account {accountId} {_region}: Inspector Lambda scanning {resourceState.lambda.status}"

  - id: AWS-INSPECTOR-LAMBDA-CODE-SCAN-OFF
    title: Inspector Lambda code scanning is not enabled
    kind: missing
    lens: security
    category: LCM
    severity: low
    entity: region
    refresh: 7d
    why: Code scanning finds injection flaws and hard-coded secrets in the functions' own code, not only in their dependencies.
    fix: Enable Inspector Lambda code scanning.
    refs: [FSBP:Inspector.3, NIST-800-53:RA-5, NIST-800-53:SA-11]
    query:
      protocol: aws
      service: inspector2
      action: BatchGetAccountStatus
      method: post
      path: /status/batch/get
      items: accounts
      key: "{_account}|{_region}|{accountId}"
    each: { field: resourceState.lambdaCode.status, op: ne, value: ENABLED }
    evidence: "account {accountId} {_region}: Inspector Lambda code scanning {resourceState.lambdaCode.status}"

  - id: AWS-INSPECTOR-CRITICAL-FINDINGS
    title: Open critical Inspector vulnerability finding
    kind: broken
    lens: security
    category: LCM
    severity: high
    entity: inspector-finding
    refresh: 1d
    why: A critical, active vulnerability on an instance, image or function is a known, usually exploitable hole that has not been patched.
    fix: Patch or rebuild the affected resource; suppress only with a recorded compensating control.
    refs: [NIST-800-53:RA-5, NIST-800-53:SI-2]
    query:
      protocol: aws
      service: inspector2
      action: ListFindings
      method: post
      path: /findings/list
      params: { filterCriteria: { severity: [ { comparison: EQUALS, value: CRITICAL } ], findingStatus: [ { comparison: EQUALS, value: ACTIVE } ] }, maxResults: 100 }
      items: findings
      next: { from: nextToken, to: nextToken }
      maxPages: 20
      key: findingArn
    each: any
    evidence: "{title} on {resources[].id} ({_account} {_region})"

  - id: AWS-INSPECTOR-COVERAGE-INACTIVE
    title: Resource not being scanned by Inspector
    kind: broken
    lens: security
    category: LCM
    severity: low
    entity: inspector-coverage
    refresh: 1d
    why: Inspector lists the resource but cannot scan it (no SSM agent, unsupported OS, stopped, image too old), so its vulnerabilities are unknown while scanning looks enabled.
    fix: Act on the reason - install or repair the SSM agent, update the OS, or exclude the resource deliberately.
    refs: [NIST-800-53:RA-5, NIST-800-53:CM-8]
    query:
      protocol: aws
      service: inspector2
      action: ListCoverage
      method: post
      path: /coverage/list
      items: coveredResources
      next: { from: nextToken, to: nextToken }
      key: "{_account}|{_region}|{resourceId}"
    each: { field: scanStatus.statusCode, op: eq, value: INACTIVE }
    evidence: "{resourceType} {resourceId} ({_account} {_region}): not scanned - {scanStatus.reason}"

  # ---- Backup -----------------------------------------------------------------------------------

  - id: AWS-BACKUP-VAULT-NOT-LOCKED
    title: Backup vault holding recovery points is not locked
    kind: misconfigured
    lens: both
    category: BCK
    severity: medium
    entity: backup-vault
    why: Without Vault Lock (compliance mode) an attacker or a mistake with enough rights can delete the recovery points before they are needed; immutability is what makes a backup survive a ransomware event.
    fix: Apply Vault Lock in compliance mode with a minimum retention to vaults holding important recovery points; for the most critical, use a logically air-gapped vault with cross-account copy.
    refs: [NIST-800-53:CP-9, NIST-800-53:CP-6, MITRE-ATTACK:T1485]
    query:
      protocol: aws
      service: backup
      action: DescribeBackupVault
      for_each: { service: backup, action: ListBackupVaults, path: /backup-vaults/, items: BackupVaultList, field: BackupVaultName, max: 500, next: { from: NextToken, to: nextToken } }
      path: "/backup-vaults/{BackupVaultName}"
      key: "{_account}|{_region}|{parent.BackupVaultName}"
    each:
      all:
        - { field: NumberOfRecoveryPoints, op: gt, value: 0 }
        - { field: Locked, op: ne, value: true }
    evidence: "vault {parent.BackupVaultName} ({_account} {_region}): {NumberOfRecoveryPoints} recovery points, locked {Locked}"

  - id: AWS-BACKUP-JOB-FAILED
    title: Recent AWS Backup job failed
    kind: broken
    lens: both
    category: BCK
    severity: high
    entity: backup-job
    refresh: 6h
    why: A failed backup job means a resource that should have a recent recovery point does not; a run of failures is a backup design that is quietly not protecting what it lists.
    fix: Read the job's status message, fix the cause (permissions, resource state, window), and confirm the next run succeeds.
    refs: [NIST-800-53:CP-9, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: backup
      action: ListBackupJobs
      path: /backup-jobs/
      next: { from: NextToken, to: nextToken }
      params: { state: FAILED }
      items: BackupJobs
      key: BackupJobId
    each: any
    evidence: "backup job {BackupJobId} ({_account} {_region}): {State} on {ResourceType}, {StatusMessage}"

  - id: AWS-BACKUP-NO-PLAN
    title: No AWS Backup plan anywhere
    kind: missing
    lens: both
    category: BCK
    severity: medium
    entity: instance
    refresh: 7d
    why: With no backup plan in any account or region read, nothing is backed up centrally; recovery depends on each service's own snapshots, if anyone set them.
    fix: Create backup plans (organisation backup policies where possible) covering the resources that need recovery, with cross-account copies of the critical ones.
    refs: [NIST-800-53:CP-9]
    query:
      protocol: aws
      service: backup
      action: ListBackupPlans
      path: /backup/plans/
      next: { from: NextToken, to: nextToken }
      items: BackupPlansList
      key: BackupPlanArn
      name: BackupPlanName
    count: none
    evidence: "no backup plan returned in any account or region read"

  - id: AWS-BACKUP-PLAN-NO-SELECTION
    title: AWS Backup plan protects nothing
    kind: broken
    lens: both
    category: BCK
    severity: medium
    entity: backup-plan
    why: A plan with no resource selection runs no jobs; it looks like protection in the console while backing up nothing.
    fix: Add a resource assignment (by tag or ARN) to the plan, or delete it.
    refs: [NIST-800-53:CP-9]
    query:
      protocol: aws
      service: backup
      action: ListBackupSelections
      for_each: { service: backup, action: ListBackupPlans, path: /backup/plans/, items: BackupPlansList, field: BackupPlanId, max: 500, next: { from: NextToken, to: nextToken } }
      path: "/backup/plans/{BackupPlanId}/selections/"
      key: "{_account}|{_region}|{parent.BackupPlanId}"
    each: { field: BackupSelectionsList, op: empty }
    evidence: "plan {parent.BackupPlanName} ({_account} {_region}) has no resource selection"

  - id: AWS-BACKUP-PLAN-SHORT-RETENTION
    title: AWS Backup plan rule keeps recovery points less than a week
    kind: misconfigured
    lens: both
    category: BCK
    severity: low
    entity: backup-plan
    refresh: 7d
    why: Recovery points deleted after a few days leave no room to recover from corruption or ransomware discovered a week later.
    fix: Keep at least 7 days (35 for production is common) and add a longer-lived weekly or monthly rule.
    refs: [NIST-800-53:CP-9]
    query:
      protocol: aws
      service: backup
      action: GetBackupPlan
      for_each: { service: backup, action: ListBackupPlans, path: /backup/plans/, items: BackupPlansList, field: BackupPlanId, max: 500, next: { from: NextToken, to: nextToken } }
      path: "/backup/plans/{BackupPlanId}/"
      items: BackupPlan
      key: "{_account}|{_region}|{parent.BackupPlanId}"
    each:
      element: { of: Rules, where: { field: Lifecycle.DeleteAfterDays, op: lt, value: 7, threshold: aws.backup.min-retention-days } }
    evidence: "plan {BackupPlanName} ({_account} {_region}): a rule keeps recovery points {Rules[].Lifecycle.DeleteAfterDays} day(s)"

  - id: AWS-BACKUP-PLAN-NO-COPY
    title: AWS Backup plan keeps every copy in one account and region
    kind: misconfigured
    lens: both
    category: BCK
    severity: low
    entity: backup-plan
    refresh: 7d
    why: Backups that stay in the source account and region are lost with it - a compromised account, a deleted vault or a regional outage takes the copies too.
    fix: Add a copy action to another account (a logically air-gapped or vault-locked vault) and, for critical data, another region.
    refs: [NIST-800-53:CP-6, NIST-800-53:CP-9]
    query:
      protocol: aws
      service: backup
      action: GetBackupPlan
      for_each: { service: backup, action: ListBackupPlans, path: /backup/plans/, items: BackupPlansList, field: BackupPlanId, max: 500, next: { from: NextToken, to: nextToken } }
      path: "/backup/plans/{BackupPlanId}/"
      items: BackupPlan
      key: "{_account}|{_region}|{parent.BackupPlanId}"
    each:
      not: { element: { of: Rules, where: { field: CopyActions, op: notempty } } }
    evidence: "plan {BackupPlanName} ({_account} {_region}): no rule copies recovery points elsewhere"

  - id: AWS-BACKUP-RECOVERY-POINT-UNENCRYPTED
    title: AWS Backup recovery point is not encrypted
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: recovery-point
    refresh: 7d
    why: An unencrypted recovery point (from an unencrypted source with no vault-level encryption) can be read by anyone who can restore or copy it.
    fix: Encrypt the source and let new recovery points inherit it; for supported types the vault key encrypts them - delete the unencrypted ones when their retention allows.
    refs: [FSBP:Backup.1, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: backup
      action: ListRecoveryPointsByBackupVault
      for_each: { service: backup, action: ListBackupVaults, path: /backup-vaults/, items: BackupVaultList, field: BackupVaultName, max: 500, next: { from: NextToken, to: nextToken } }
      path: "/backup-vaults/{BackupVaultName}/recovery-points/"
      items: RecoveryPoints
      next: { from: NextToken, to: nextToken }
      key: RecoveryPointArn
    each: { field: IsEncrypted, op: eq, value: false }
    evidence: "recovery point of {ResourceArn} in {parent.BackupVaultName} ({_account} {_region}) is not encrypted"

  # ---- Lambda -----------------------------------------------------------------------------------

  - id: AWS-LAMBDA-RUNTIME-DEPRECATED
    title: Lambda function on a deprecated runtime
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: medium
    entity: lambda-function
    why: A deprecated runtime stops getting security patches and then blocks function creation and updates. The default pattern covers runtimes AWS deprecated by October 2026 - among them Node.js 16, 18 and 20, Python 3.8, 3.9 and 3.10, Ruby 3.2, .NET 6/7, Java 8 (both images), go1.x and the provided/provided.al2 OS-only runtimes. Other runtimes built on Amazon Linux 2 (java11, java17, python3.11) are not in the default - check them against AWS's table; which runtimes count changes over time, so the pattern is a tenant setting.
    fix: Upgrade the function to a supported runtime with its owner (Node.js 22+, Python 3.12+, Java 21, .NET 8, provided.al2023); keep the deprecated-runtime pattern current against AWS's runtime deprecation table.
    refs: [FSBP:Lambda.2, NIST-800-53:SI-2, NIST-800-53:SA-22]
    query:
      protocol: aws
      service: lambda
      action: ListFunctions
      path: /2015-03-31/functions/
      next: { from: NextMarker, to: Marker }
      items: Functions
      key: FunctionArn
      name: FunctionName
    each: { field: Runtime, op: match, value: '^(python2\.7|python3\.([0-9]|10)|nodejs(4\.3(-edge)?|6\.10|8\.10)?|nodejs(10|12|14|16|18|20)\.x|ruby2\.[0-7]|ruby3\.2|dotnetcore[0-9.]+|dotnet[567](\.0)?|go1\.x|java8(\.al2)?|provided(\.al2)?)$', threshold: aws.lambda.deprecated-runtime-pattern, required: true }
    evidence: "function {FunctionName} ({_account} {_region}): runtime {Runtime}, last modified {LastModified}"

  - id: AWS-LAMBDA-URL-NO-AUTH
    title: Lambda function URL has no authorisation
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: lambda-function
    why: A function URL with AuthType NONE is a public HTTPS endpoint that runs the function for anyone on the internet, with no IAM check in front of it.
    fix: Set the function URL AuthType to AWS_IAM (and put it behind an authorizer or CloudFront/WAF), or remove the URL if it is not needed.
    refs: [NIST-800-53:AC-3, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: lambda
      action: GetFunctionUrlConfig
      for_each: { service: lambda, action: ListFunctions, path: /2015-03-31/functions/, items: Functions, field: FunctionName, max: 2000, next: { from: NextMarker, to: Marker } }
      path: "/2021-10-31/functions/{FunctionName}/url"
      missing: empty
      key: "{_account}|{_region}|{parent.FunctionName}"
    each: { field: AuthType, op: eq, value: NONE }
    evidence: "function {parent.FunctionName} ({_account} {_region}): function URL AuthType {AuthType}"

  - id: AWS-LAMBDA-POLICY-PUBLIC
    title: Lambda function policy lets anyone invoke it
    kind: misconfigured
    lens: security
    category: AUT
    severity: high
    entity: lambda-function
    why: A resource policy statement for Principal "*" with no condition lets any AWS account (or anyone, through a public URL) invoke the function and act with its role.
    fix: Replace the wildcard with the specific service principal and add aws:SourceArn / aws:SourceAccount conditions.
    refs: [FSBP:Lambda.1, NIST-800-53:AC-3]
    query:
      protocol: aws
      service: lambda
      action: GetPolicy
      for_each: { service: lambda, action: ListFunctions, path: /2015-03-31/functions/, items: Functions, field: FunctionName, max: 2000, next: { from: NextMarker, to: Marker } }
      path: "/2015-03-31/functions/{FunctionName}/policy"
      missing: empty
      key: "{_account}|{_region}|{parent.FunctionName}"
    each:
      all:
        - { field: Policy, op: match, value: '(?:%22|")Principal(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%7B|\{)(?:(?!%7D|\})[\s\S])*?(?:%22|")AWS(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:%22|")))' }
        - { field: Policy, op: notmatch, value: '(?:%22|")Condition(?:%22|")' }
    evidence: "function {parent.FunctionName} ({_account} {_region}): resource policy admits any principal with no condition"

  - id: AWS-LAMBDA-ENV-NO-CMK
    title: Lambda environment variables not encrypted with a customer key
    kind: misconfigured
    lens: security
    category: PKI
    severity: low
    entity: lambda-function
    refresh: 7d
    why: Environment variables often carry connection strings and tokens; with the default key anyone who can read the function's configuration sees them, while a customer key adds a decrypt gate.
    fix: Move secrets to Secrets Manager or Parameter Store; for what stays in the environment, set a customer-managed KMS key on the function.
    refs: [NIST-800-53:SC-28, NIST-800-53:IA-5]
    query:
      protocol: aws
      service: lambda
      action: ListFunctions
      path: /2015-03-31/functions/
      next: { from: NextMarker, to: Marker }
      items: Functions
      key: FunctionArn
      name: FunctionName
    each:
      all:
        - { field: Environment, op: notempty }
        - { field: KMSKeyArn, op: empty }
    evidence: "function {FunctionName} ({_account} {_region}): environment variables set, no customer KMS key"

  - id: AWS-LAMBDA-NOT-IN-VPC
    title: Lambda function not attached to a VPC
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: lambda-function
    refresh: 7d
    why: A function outside a VPC reaches the internet directly and cannot be limited by security groups, endpoints or flow logs; functions touching internal data belong in the VPC.
    fix: Attach functions that reach internal resources to private subnets in at least two Availability Zones; leave purely public-API functions out by decision.
    refs: [FSBP:Lambda.3, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: lambda
      action: ListFunctions
      path: /2015-03-31/functions/
      next: { from: NextMarker, to: Marker }
      items: Functions
      key: FunctionArn
      name: FunctionName
    each: { field: VpcConfig.VpcId, op: empty }
    evidence: "function {FunctionName} ({_account} {_region}) is not in a VPC"

  - id: AWS-LAMBDA-VPC-SINGLE-AZ
    title: VPC-attached Lambda function uses subnets in one Availability Zone
    kind: misconfigured
    lens: maintenance
    category: AVL
    severity: low
    entity: lambda-function
    refresh: 7d
    why: With a single subnet the function cannot run when that zone has a problem.
    fix: Attach the function to subnets in at least two Availability Zones.
    refs: [FSBP:Lambda.5, NIST-800-53:CP-2]
    query:
      protocol: aws
      service: lambda
      action: ListFunctions
      path: /2015-03-31/functions/
      next: { from: NextMarker, to: Marker }
      items: Functions
      key: FunctionArn
      name: FunctionName
    each:
      all:
        - { field: VpcConfig.VpcId, op: notempty }
        - { field: VpcConfig.SubnetIds, op: size-lt, value: 2 }
    evidence: "function {FunctionName} ({_account} {_region}): subnets {VpcConfig.SubnetIds}"

  - id: AWS-LAMBDA-TRACING-OFF
    title: Lambda function without active tracing
    kind: missing
    lens: maintenance
    category: MON
    severity: info
    entity: lambda-function
    refresh: 7d
    why: X-Ray tracing shows where a request spends its time and fails across functions and services; without it distributed failures are diagnosed from logs alone.
    fix: Enable active tracing on functions in request paths that matter.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: aws
      service: lambda
      action: ListFunctions
      path: /2015-03-31/functions/
      next: { from: NextMarker, to: Marker }
      items: Functions
      key: FunctionArn
      name: FunctionName
    each: { field: TracingConfig.Mode, op: ne, value: Active }
    evidence: "function {FunctionName} ({_account} {_region}): tracing {TracingConfig.Mode}"

  - id: AWS-LAMBDA-NO-DEAD-LETTER
    title: Lambda function has no dead-letter queue
    kind: missing
    lens: maintenance
    category: AVL
    severity: info
    entity: lambda-function
    refresh: 7d
    why: For asynchronously invoked functions, events that fail every retry are dropped without a dead-letter queue (or an on-failure destination), and nobody knows they were lost.
    fix: Configure a dead-letter queue or an on-failure destination on functions invoked asynchronously.
    refs: [NIST-800-53:SI-4, NIST-800-53:CP-10]
    query:
      protocol: aws
      service: lambda
      action: ListFunctions
      path: /2015-03-31/functions/
      next: { from: NextMarker, to: Marker }
      items: Functions
      key: FunctionArn
      name: FunctionName
    each: { field: DeadLetterConfig.TargetArn, op: empty }
    evidence: "function {FunctionName} ({_account} {_region}): no dead-letter queue"

  - id: AWS-LAMBDA-URL-CORS-ANY-ORIGIN
    title: Lambda function URL CORS allows any origin
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: lambda-function
    refresh: 7d
    why: CORS with origin "*" lets any web page call the function from a visitor's browser.
    fix: List the specific origins that need cross-origin access.
    refs: [NIST-800-53:AC-4]
    query:
      protocol: aws
      service: lambda
      action: GetFunctionUrlConfig
      for_each: { service: lambda, action: ListFunctions, path: /2015-03-31/functions/, items: Functions, field: FunctionName, max: 2000, next: { from: NextMarker, to: Marker } }
      path: "/2021-10-31/functions/{FunctionName}/url"
      missing: empty
      key: "{_account}|{_region}|{parent.FunctionName}"
    each: { field: Cors.AllowOrigins, op: contains, value: "*" }
    evidence: "function {parent.FunctionName} ({_account} {_region}): function URL CORS origins {Cors.AllowOrigins}"

  # ---- CloudFront -------------------------------------------------------------------------------

  - id: AWS-CLOUDFRONT-WEAK-TLS
    title: CloudFront distribution allows an old TLS version
    kind: misconfigured
    lens: security
    category: LCM
    severity: medium
    entity: cloudfront-distribution
    why: A minimum protocol version of TLS 1.0/1.1 (or SSLv3) lets clients negotiate down to a protocol with known weaknesses on a public-facing endpoint.
    fix: Set the viewer certificate minimum protocol version to TLSv1.2_2021 or stricter.
    refs: [FSBP:CloudFront.10, NIST-800-53:SC-8]
    query:
      protocol: aws
      service: cloudfront
      action: ListDistributions
      path: /2020-05-31/distribution
      next: { from: //NextMarker, to: Marker }
      items: "//DistributionSummary"
      key: Id
      name: DomainName
    each:
      all:
        - { field: "ViewerCertificate.CloudFrontDefaultCertificate", op: ne, value: true }
        - { field: "ViewerCertificate.MinimumProtocolVersion", op: match, value: '^(SSLv3|TLSv1|TLSv1_2016|TLSv1\.1_2016)$', threshold: aws.cloudfront.weak-tls-pattern }
    evidence: "distribution {Id} ({DomainName}): minimum protocol {ViewerCertificate.MinimumProtocolVersion}"

  - id: AWS-CLOUDFRONT-NO-WAF
    title: CloudFront distribution has no WAF web ACL
    kind: missing
    lens: security
    category: AUT
    severity: low
    entity: cloudfront-distribution
    why: An internet-facing distribution without a WAF has no managed rule groups in front of it (common exploits, bad inputs, IP reputation, rate limiting), so application-layer attacks reach the origin unfiltered.
    fix: Associate a WAF web ACL with the distribution, with the AWS managed rule groups and a rate-based rule.
    refs: [FSBP:CloudFront.6, NIST-800-53:SC-7, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: cloudfront
      action: ListDistributions
      path: /2020-05-31/distribution
      next: { from: //NextMarker, to: Marker }
      items: "//DistributionSummary"
      key: Id
      name: DomainName
    each: { field: WebACLId, op: empty }
    evidence: "distribution {Id} ({DomainName}): no WAF web ACL"

  - id: AWS-CLOUDFRONT-VIEWER-HTTP-ALLOWED
    title: CloudFront distribution serves viewers over plain HTTP
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: cloudfront-distribution
    why: A cache behaviour with viewer protocol policy allow-all serves content and accepts requests (cookies, form posts) over unencrypted HTTP.
    fix: Set the viewer protocol policy to redirect-to-https or https-only on every cache behaviour.
    refs: [FSBP:CloudFront.3, NIST-800-53:SC-8]
    query:
      protocol: aws
      service: cloudfront
      action: ListDistributions
      path: /2020-05-31/distribution
      next: { from: //NextMarker, to: Marker }
      items: "//DistributionSummary"
      key: Id
      name: DomainName
    each:
      any:
        - { field: DefaultCacheBehavior.ViewerProtocolPolicy, op: eq, value: allow-all }
        - all:
            - { field: CacheBehaviors.Items.CacheBehavior, op: exists }
            - element: { of: CacheBehaviors.Items.CacheBehavior, where: { field: ViewerProtocolPolicy, op: eq, value: allow-all } }
    evidence: "distribution {Id} ({DomainName}): a cache behaviour allows HTTP"

  - id: AWS-CLOUDFRONT-ORIGIN-HTTP
    title: CloudFront fetches from a custom origin over plain HTTP
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: cloudfront-distribution
    why: With origin protocol http-only or match-viewer, traffic between CloudFront and the origin crosses the internet unencrypted.
    fix: Set the origin protocol policy to https-only and give the origin a valid certificate.
    refs: [FSBP:CloudFront.9, NIST-800-53:SC-8]
    query:
      protocol: aws
      service: cloudfront
      action: ListDistributions
      path: /2020-05-31/distribution
      next: { from: //NextMarker, to: Marker }
      items: "//DistributionSummary"
      key: Id
      name: DomainName
    each:
      element:
        of: Origins.Items.Origin
        where:
          all:
            - { field: CustomOriginConfig, op: exists }
            - { field: CustomOriginConfig.OriginProtocolPolicy, op: in, value: [http-only, match-viewer] }
    evidence: "distribution {Id} ({DomainName}): a custom origin is fetched over HTTP"

  - id: AWS-CLOUDFRONT-ORIGIN-WEAK-SSL
    title: CloudFront allows a deprecated SSL/TLS version to a custom origin
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: cloudfront-distribution
    why: Allowing SSLv3, TLS 1.0 or 1.1 towards the origin lets the connection be negotiated down to a protocol with known weaknesses.
    fix: Allow only TLSv1.2 in the origin's SSL protocols (upgrade the origin if it cannot do TLS 1.2).
    refs: [FSBP:CloudFront.10, NIST-800-53:SC-8]
    query:
      protocol: aws
      service: cloudfront
      action: ListDistributions
      path: /2020-05-31/distribution
      next: { from: //NextMarker, to: Marker }
      items: "//DistributionSummary"
      key: Id
      name: DomainName
    each:
      element:
        of: Origins.Items.Origin
        where:
          all:
            - { field: CustomOriginConfig, op: exists }
            - { field: CustomOriginConfig.OriginSslProtocols.Items.SslProtocol, op: in, value: [SSLv3, TLSv1, TLSv1.1] }
    evidence: "distribution {Id} ({DomainName}): origin SSL protocols include a deprecated version"

  - id: AWS-CLOUDFRONT-S3-ORIGIN-NO-OAC
    title: CloudFront S3 origin without origin access control
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: cloudfront-distribution
    why: An S3 origin with neither origin access control nor an origin access identity can only work if the bucket is public, so the content is reachable around CloudFront and its WAF.
    fix: Add an origin access control to the origin, grant it in the bucket policy, and remove the bucket's public access.
    refs: [FSBP:CloudFront.13, NIST-800-53:AC-3]
    query:
      protocol: aws
      service: cloudfront
      action: ListDistributions
      path: /2020-05-31/distribution
      next: { from: //NextMarker, to: Marker }
      items: "//DistributionSummary"
      key: Id
      name: DomainName
    each:
      element:
        of: Origins.Items.Origin
        where:
          all:
            - { field: S3OriginConfig, op: exists }
            - { field: OriginAccessControlId, op: empty }
            - { field: S3OriginConfig.OriginAccessIdentity, op: empty }
    evidence: "distribution {Id} ({DomainName}): an S3 origin has no origin access control"

  - id: AWS-CLOUDFRONT-S3-ORIGIN-LEGACY-OAI
    title: CloudFront S3 origin still uses a legacy origin access identity
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: cloudfront-distribution
    refresh: 7d
    why: Origin access identities do not support SSE-KMS buckets, all regions or dynamic requests; AWS recommends origin access control instead.
    fix: Migrate the origin to an origin access control and update the bucket policy.
    refs: [NIST-800-53:AC-3]
    query:
      protocol: aws
      service: cloudfront
      action: ListDistributions
      path: /2020-05-31/distribution
      next: { from: //NextMarker, to: Marker }
      items: "//DistributionSummary"
      key: Id
      name: DomainName
    each:
      element: { of: Origins.Items.Origin, where: { field: S3OriginConfig.OriginAccessIdentity, op: notempty } }
    evidence: "distribution {Id} ({DomainName}): an S3 origin uses an origin access identity"

  - id: AWS-CLOUDFRONT-DEDICATED-IP-SSL
    title: CloudFront distribution uses dedicated-IP SSL instead of SNI
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: cloudfront-distribution
    refresh: 7d
    why: Dedicated-IP custom SSL costs a monthly fee per distribution and is only needed for very old clients without SNI.
    fix: Switch the viewer certificate's SSL support method to sni-only.
    refs: [FSBP:CloudFront.8]
    query:
      protocol: aws
      service: cloudfront
      action: ListDistributions
      path: /2020-05-31/distribution
      next: { from: //NextMarker, to: Marker }
      items: "//DistributionSummary"
      key: Id
      name: DomainName
    each: { field: ViewerCertificate.SSLSupportMethod, op: eq, value: vip }
    evidence: "distribution {Id} ({DomainName}): SSL support method vip"

  - id: AWS-CLOUDFRONT-DEFAULT-CERTIFICATE
    title: CloudFront distribution uses the default cloudfront.net certificate
    kind: misconfigured
    lens: security
    category: PKI
    severity: info
    entity: cloudfront-distribution
    refresh: 7d
    why: With the default certificate the distribution is reachable only on its cloudfront.net name and its minimum TLS version cannot be raised; production sites normally use their own domain and certificate.
    fix: Add the site's domain as an alternate name with an ACM certificate (us-east-1) and a TLSv1.2_2021 security policy.
    refs: [FSBP:CloudFront.7, NIST-800-53:SC-8]
    query:
      protocol: aws
      service: cloudfront
      action: ListDistributions
      path: /2020-05-31/distribution
      next: { from: //NextMarker, to: Marker }
      items: "//DistributionSummary"
      key: Id
      name: DomainName
    each: { field: ViewerCertificate.CloudFrontDefaultCertificate, op: eq, value: true }
    evidence: "distribution {Id} ({DomainName}) uses the default certificate"

  - id: AWS-CLOUDFRONT-LOGGING-OFF
    title: CloudFront standard (legacy) access logging is off
    kind: missing
    lens: security
    category: LOG
    severity: low
    entity: cloudfront-distribution
    refresh: 7d
    why: Without access logs there is no record of who requested what from the edge. Distributions that log through the newer CloudWatch-delivered standard logging (v2) show here too and need only a confirmation.
    fix: Enable standard logging (legacy to S3, or v2 log delivery) for the distribution.
    refs: [FSBP:CloudFront.5, NIST-800-53:AU-12]
    query:
      protocol: aws
      service: cloudfront
      action: GetDistributionConfig
      for_each: { service: cloudfront, action: ListDistributions, path: /2020-05-31/distribution, next: { from: //NextMarker, to: Marker }, items: "//DistributionSummary", field: Id, max: 2000 }
      path: "/2020-05-31/distribution/{Id}/config"
      items: "//DistributionConfig"
      key: "{parent.Id}"
    each: { field: Logging.Enabled, op: eq, value: false }
    evidence: "distribution {parent.Id} ({parent.DomainName}): legacy access logging off"

  - id: AWS-CLOUDFRONT-NO-DEFAULT-ROOT-OBJECT
    title: CloudFront distribution has no default root object
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: cloudfront-distribution
    refresh: 7d
    why: Without a default root object a request for the bare domain is passed to the origin as is, which for an S3 origin can list or expose content not meant to be served.
    fix: Set a default root object (index.html) on distributions in front of S3 or static content.
    refs: [FSBP:CloudFront.1, NIST-800-53:CM-7]
    query:
      protocol: aws
      service: cloudfront
      action: GetDistributionConfig
      for_each: { service: cloudfront, action: ListDistributions, path: /2020-05-31/distribution, next: { from: //NextMarker, to: Marker }, items: "//DistributionSummary", field: Id, max: 2000 }
      path: "/2020-05-31/distribution/{Id}/config"
      items: "//DistributionConfig"
      key: "{parent.Id}"
    each: { field: DefaultRootObject, op: empty }
    evidence: "distribution {parent.Id} ({parent.DomainName}): no default root object"

  # ---- CloudWatch alarms, Auto Scaling, CloudFormation ------------------------------------------

  - id: AWS-CLOUDWATCH-ALARM-INSUFFICIENT-DATA
    title: CloudWatch alarm stuck with insufficient data
    kind: broken
    lens: maintenance
    category: MON
    severity: low
    entity: cloudwatch-alarm
    refresh: 7d
    why: An alarm in INSUFFICIENT_DATA is not watching anything - its metric stopped reporting or never did - so the thing it was meant to catch would pass unnoticed.
    fix: Fix the metric source or the alarm's dimensions, or delete the alarm if what it watched is gone.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: aws
      service: monitoring
      action: DescribeAlarms
      items: "//MetricAlarms/member"
      key: AlarmArn
      name: AlarmName
    each: { field: StateValue, op: eq, value: INSUFFICIENT_DATA }
    evidence: "alarm {AlarmName} ({_account} {_region}): {StateValue} since {StateUpdatedTimestamp}"

  - id: AWS-ASG-LAUNCH-CONFIG
    title: Auto Scaling group still uses a launch configuration
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: low
    entity: autoscaling-group
    refresh: 7d
    why: Launch configurations are the old, frozen way to define instances; they cannot require IMDSv2 cleanly and do not get new instance features, and AWS is moving groups to launch templates.
    fix: Migrate the group to a launch template (which also lets it require IMDSv2 and mix instance types).
    refs: [FSBP:AutoScaling.9, NIST-800-53:CM-2]
    query:
      protocol: aws
      service: autoscaling
      action: DescribeAutoScalingGroups
      items: "//AutoScalingGroups/member"
      key: AutoScalingGroupARN
      name: AutoScalingGroupName
    each: { field: LaunchConfigurationName, op: exists }
    evidence: "group {AutoScalingGroupName} ({_account} {_region}): launch configuration {LaunchConfigurationName}"

  - id: AWS-CFN-STACK-FAILED
    title: CloudFormation stack in a failed or rolled-back state
    kind: broken
    lens: maintenance
    category: LCM
    severity: low
    entity: cfn-stack
    why: A stack in a failed or rollback-complete state cannot be updated safely and often means a deploy left resources half-created; it blocks the next change to that stack.
    fix: Reconcile the stack (with its owner, or the team that built it) - continue the rollback, recreate, or import the resources - until it reaches a healthy state.
    refs: [NIST-800-53:CM-2, NIST-800-53:CM-3]
    query:
      protocol: aws
      service: cloudformation
      action: ListStacks
      items: "//StackSummaries/member"
      key: StackId
      name: StackName
    each: { field: StackStatus, op: match, value: '^(ROLLBACK_COMPLETE|.*_FAILED)$' }
    evidence: "stack {StackName} ({_account} {_region}): {StackStatus} {StackStatusReason}"

  - id: AWS-CFN-STACK-DRIFTED
    title: CloudFormation stack has drifted from its template
    kind: misconfigured
    lens: maintenance
    category: CFG
    severity: low
    entity: cfn-stack
    refresh: 7d
    why: A drifted stack's resources were changed outside the template; the next deploy may silently revert a fix or fail, and the template no longer documents what runs. Only stacks on which drift detection has run report a status.
    fix: Review the drift, then fold the change into the template or revert it; run drift detection on a schedule.
    refs: [NIST-800-53:CM-2, NIST-800-53:CM-3]
    query:
      protocol: aws
      service: cloudformation
      action: DescribeStacks
      items: "//Stacks/member"
      key: StackId
      name: StackName
    each: { field: DriftInformation.StackDriftStatus, op: eq, value: DRIFTED }
    evidence: "stack {StackName} ({_account} {_region}): drifted, checked {DriftInformation.LastCheckTimestamp}"

  - id: AWS-CFN-TERMINATION-PROTECTION-OFF
    title: CloudFormation stack without termination protection
    kind: misconfigured
    lens: maintenance
    category: AVL
    severity: low
    entity: cfn-stack
    refresh: 7d
    why: Deleting a stack deletes everything it created; termination protection makes that a deliberate two-step act. Nested stacks inherit it from their root and are skipped.
    fix: Enable termination protection on production root stacks.
    refs: [NIST-800-53:CM-3, NIST-800-53:CP-9]
    query:
      protocol: aws
      service: cloudformation
      action: DescribeStacks
      items: "//Stacks/member"
      key: StackId
      name: StackName
    each:
      all:
        - { field: ParentId, op: absent }
        - { field: EnableTerminationProtection, op: eq, value: false }
    evidence: "stack {StackName} ({_account} {_region}): termination protection off"

  - id: AWS-ASG-SINGLE-AZ
    title: Auto Scaling group spans only one Availability Zone
    kind: misconfigured
    lens: maintenance
    category: AVL
    severity: low
    entity: autoscaling-group
    refresh: 7d
    why: A group confined to one zone loses all its capacity when that zone has a problem, defeating the point of the group.
    fix: Add subnets in at least two Availability Zones to the group.
    refs: [FSBP:AutoScaling.2, NIST-800-53:CP-2]
    query:
      protocol: aws
      service: autoscaling
      action: DescribeAutoScalingGroups
      items: "//AutoScalingGroups/member"
      key: AutoScalingGroupARN
      name: AutoScalingGroupName
    each: { field: AvailabilityZones.member, op: size-lt, value: 2 }
    evidence: "group {AutoScalingGroupName} ({_account} {_region}): zones {AvailabilityZones.member}"

  - id: AWS-ASG-NO-ELB-HEALTH-CHECK
    title: Auto Scaling group behind a load balancer uses EC2 health checks only
    kind: misconfigured
    lens: maintenance
    category: AVL
    severity: low
    entity: autoscaling-group
    refresh: 7d
    why: With EC2 checks only, an instance whose application is failing (but whose VM is up) stays in service, and the load balancer keeps sending it traffic.
    fix: Set the group's health check type to ELB with a sensible grace period.
    refs: [FSBP:AutoScaling.1, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: autoscaling
      action: DescribeAutoScalingGroups
      items: "//AutoScalingGroups/member"
      key: AutoScalingGroupARN
      name: AutoScalingGroupName
    each:
      all:
        - any:
            - { field: TargetGroupARNs.member, op: exists }
            - { field: LoadBalancerNames.member, op: exists }
        - { field: HealthCheckType, op: eq, value: EC2 }
    evidence: "group {AutoScalingGroupName} ({_account} {_region}): health check {HealthCheckType}"

  - id: AWS-ASG-LAUNCH-CONFIG-IMDSV1
    title: Launch configuration does not require IMDSv2
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: launch-configuration
    refresh: 7d
    why: Every instance launched from it allows IMDSv1, so the metadata credential-theft path returns with each scale-out.
    fix: Move the group to a launch template that requires IMDSv2 (launch configurations cannot be edited).
    refs: [FSBP:AutoScaling.3, NIST-800-53:AC-6, MITRE-ATTACK:T1552.005]
    query:
      protocol: aws
      service: autoscaling
      action: DescribeLaunchConfigurations
      items: "//LaunchConfigurations/member"
      key: LaunchConfigurationARN
      name: LaunchConfigurationName
    each:
      any:
        - { field: MetadataOptions.HttpTokens, op: absent }
        - { field: MetadataOptions.HttpTokens, op: ne, value: required }
    evidence: "launch configuration {LaunchConfigurationName} ({_account} {_region}): httpTokens {MetadataOptions.HttpTokens}"

  - id: AWS-ASG-LAUNCH-CONFIG-PUBLIC-IP
    title: Launch configuration assigns public IP addresses
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: launch-configuration
    refresh: 7d
    why: Instances launched from it get a public address and are exposed directly.
    fix: Move the group to a launch template without public addresses and front it with a load balancer.
    refs: [FSBP:AutoScaling.5, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: autoscaling
      action: DescribeLaunchConfigurations
      items: "//LaunchConfigurations/member"
      key: LaunchConfigurationARN
      name: LaunchConfigurationName
    each: { field: AssociatePublicIpAddress, op: eq, value: true }
    evidence: "launch configuration {LaunchConfigurationName} ({_account} {_region}) assigns public IPs"

  - id: AWS-CLOUDWATCH-ALARM-ACTIONS-DISABLED
    title: CloudWatch alarm actions are disabled
    kind: broken
    lens: maintenance
    category: MON
    severity: low
    entity: cloudwatch-alarm
    refresh: 7d
    why: An alarm with actions disabled changes state but notifies nobody and triggers nothing.
    fix: Re-enable the alarm's actions, or delete the alarm if it is no longer wanted.
    refs: [FSBP:CloudWatch.17, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: monitoring
      action: DescribeAlarms
      items: "//MetricAlarms/member"
      key: AlarmArn
      name: AlarmName
    each: { field: ActionsEnabled, op: eq, value: false }
    evidence: "alarm {AlarmName} ({_account} {_region}): actions disabled"

  - id: AWS-CLOUDWATCH-ALARM-NO-ACTION
    title: CloudWatch alarm has no action for the alarm state
    kind: misconfigured
    lens: maintenance
    category: MON
    severity: low
    entity: cloudwatch-alarm
    refresh: 7d
    why: An alarm with no alarm action only changes colour in the console; nobody is told when it fires.
