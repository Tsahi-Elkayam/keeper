  - id: AWS-SG-NETBIOS-RPC-FROM-INTERNET
    title: Security group allows NetBIOS / RPC (135, 137-139) from the internet
    kind: misconfigured
    lens: security
    category: AUT
    severity: high
    entity: security-group-rule
    why: 'NetBIOS / RPC (135, 137-139) is a service that should never face the whole internet: it is scanned continuously, its authentication is often weak or absent, and exposed instances are a routine way in.'
    fix: 'Remove the 0.0.0.0/0 or ::/0 source; reach the service from inside the VPC, over private connectivity, or from a specific administrative CIDR only.'
    refs: [FSBP:EC2.19, NIST-800-53:SC-7, NIST-800-53:AC-4, MITRE-ATTACK:T1021]
    query:
      protocol: aws
      service: ec2
      action: DescribeSecurityGroupRules
      items: "//securityGroupRuleSet/item"
      key: securityGroupRuleId
    each:
      all:
        - { field: isEgress, op: eq, value: false }
        - { field: ipProtocol, op: in, value: [tcp, "6", udp, "17"] }
