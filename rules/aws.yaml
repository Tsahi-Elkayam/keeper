  - id: AWS-RDS-CLUSTER-BACKUP-RETENTION-SHORT
    title: Database cluster backup retention is too short
    kind: misconfigured
    lens: both
    category: BCK
    severity: medium
    entity: db-cluster
    why: The retention period is the point-in-time recovery window; a day or two is not enough to recover from corruption or deletion found late.
    fix: Set backup retention to at least a week (longer for production and regulated data).
    refs: [FSBP:RDS.11, FSBP:DocumentDB.2, NIST-800-53:CP-9]
    query:
      protocol: aws
      service: rds
      action: DescribeDBClusters
      items: "//DBCluster"
      key: "{_account}|{_region}|{DBClusterIdentifier}"
    each: { field: BackupRetentionPeriod, op: lt, value: 7, threshold: aws.rds.min-backup-retention-days }
    evidence: "cluster {DBClusterIdentifier} ({_account} {_region}): backup retention {BackupRetentionPeriod} day(s)"

  - id: AWS-RDS-CLUSTER-SINGLE-AZ
    title: Database cluster has instances in only one Availability Zone
    kind: misconfigured
    lens: maintenance
    category: AVL
    severity: medium
    entity: db-cluster
    why: A cluster whose instances all sit in one AZ has nothing to fail over to when that zone has a problem.
    fix: Add a reader in another Availability Zone (or use a Multi-AZ deployment) for production clusters.
    refs: [FSBP:RDS.15, NIST-800-53:CP-2, NIST-800-53:SC-36]
    query:
      protocol: aws
      service: rds
      action: DescribeDBClusters
      items: "//DBCluster"
      key: "{_account}|{_region}|{DBClusterIdentifier}"
    each: { field: MultiAZ, op: eq, value: false }
    evidence: "cluster {DBClusterIdentifier} ({_account} {_region}): Multi-AZ {MultiAZ}, {Engine}"

