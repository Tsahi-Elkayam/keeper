    why: Each of the four public-access-block flags stops a different way a bucket becomes public; with any one off (a block that is present but weak), an ACL or a policy (set by mistake or by a tool) can expose the objects to the internet. A bucket with no public-access-block at all returns no row here and so is not caught - that gap is in the backlog.
    fix: Turn on all four public-access-block flags on the bucket (and at the account level); serve public content through CloudFront with an origin access control instead.
    refs: [CIS-AWS:2.1.5, FSBP:S3.8, FSBP:S3.1, NIST-800-53:AC-3, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: s3
      action: GetPublicAccessBlock
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { publicAccessBlock: "" }
      items: "//PublicAccessBlockConfiguration"
      missing: empty
      key: "{parent.Name}"
    each:
      any:
        - { field: BlockPublicAcls, op: ne, value: true }
        - { field: IgnorePublicAcls, op: ne, value: true }
        - { field: BlockPublicPolicy, op: ne, value: true }
        - { field: RestrictPublicBuckets, op: ne, value: true }
    evidence: "bucket {parent.Name}: BlockPublicAcls {BlockPublicAcls}, IgnorePublicAcls {IgnorePublicAcls}, BlockPublicPolicy {BlockPublicPolicy}, RestrictPublicBuckets {RestrictPublicBuckets}"

  - id: AWS-S3-VERSIONING-OFF
    title: S3 bucket versioning is not enabled
    kind: misconfigured
    lens: both
    category: BCK
    severity: medium
    entity: s3-bucket
    why: Without versioning an overwrite or a delete (ransomware, a bad script, a mistake) is unrecoverable; versioning is also the base for replication and object-lock protection.
    fix: Enable versioning on data buckets and add a lifecycle rule to expire noncurrent versions; add MFA-delete or object lock where the data is evidence or backups.
    refs: [FSBP:S3.14, NIST-800-53:CP-9, NIST-800-53:SI-12]
    query:
      protocol: aws
      service: s3
      action: GetBucketVersioning
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { versioning: "" }
      items: "//VersioningConfiguration"
      key: "{parent.Name}"
    each:
      any:
        - { field: Status, op: absent }
        - { field: Status, op: ne, value: Enabled }
    evidence: "bucket {parent.Name}: versioning status {Status}"

  - id: AWS-S3-SSE-NOT-KMS
    title: S3 bucket default encryption is not a KMS key
    kind: misconfigured
    lens: security
    category: PKI
    severity: low
    entity: s3-bucket
    refresh: 7d
    why: S3 encrypts at rest by default, but SSE-S3 has no separate permission gate; a bucket holding sensitive data gains a second access control (kms:Decrypt) and key custody when it uses SSE-KMS.
    fix: Set default encryption to SSE-KMS with a customer-managed key on buckets holding sensitive data, and enable the bucket key to cut KMS cost.
    refs: [CIS-AWS:2.1.1, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: s3
      action: GetBucketEncryption
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { encryption: "" }
      items: "//ServerSideEncryptionConfiguration"
      missing: empty
      key: "{parent.Name}"
    each:
      element:
        of: Rule
        match: any
        where: { field: "ApplyServerSideEncryptionByDefault.SSEAlgorithm", op: notmatch, value: '^aws:kms' }
    evidence: "bucket {parent.Name}: default encryption {Rule.ApplyServerSideEncryptionByDefault.SSEAlgorithm}"

  - id: AWS-S3-BUCKET-POLICY-PUBLIC
    title: S3 bucket policy makes the bucket public
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: s3-bucket
    why: S3's own policy evaluation says the bucket policy grants access to anyone - objects can be read (or written) from the internet without credentials. A bucket with no policy answers "no policy" and is not a row here.
    fix: Remove the public statement (or add conditions that restrict it to the organisation or to a CloudFront origin access control) and turn on the bucket's public access block.
    refs: [FSBP:S3.2, FSBP:S3.3, CIS-AWS:2.1.4, NIST-800-53:AC-3, MITRE-ATTACK:T1530]
    query:
      protocol: aws
      service: s3
      action: GetBucketPolicyStatus
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { policyStatus: "" }
      items: "//PolicyStatus"
      missing: empty
      key: "{parent.Name}"
    each: { field: IsPublic, op: eq, value: true }
    evidence: "bucket {parent.Name} ({parent.BucketRegion}): the bucket policy is public"

  - id: AWS-S3-ACL-PUBLIC
    title: S3 bucket ACL grants access to everyone or to any AWS user
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: s3-bucket
    why: A grant to the AllUsers or AuthenticatedUsers group opens the bucket to the internet or to every AWS account in the world; it is the oldest and still a common way buckets leak.
    fix: Remove the grant, set object ownership to bucket-owner-enforced (which disables ACLs) and turn on the public access block.
    refs: [FSBP:S3.2, FSBP:S3.3, NIST-800-53:AC-3, MITRE-ATTACK:T1530]
    query:
      protocol: aws
      service: s3
      action: GetBucketAcl
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { acl: "" }
      items: "//Grant"
      key: "{parent.Name}|{Grantee.URI}|{Permission}"
    each: { field: Grantee.URI, op: match, value: '/global/(AllUsers|AuthenticatedUsers)$' }
    evidence: "bucket {parent.Name}: ACL grants {Permission} to {Grantee.URI}"

  - id: AWS-S3-NO-TLS-ENFORCEMENT
    title: S3 bucket policy does not deny requests without TLS
    kind: missing
    lens: security
    category: PKI
    severity: medium
    entity: s3-bucket
    refresh: 7d
    why: Without a Deny on aws:SecureTransport false, clients can read and write the bucket over plain HTTP, exposing data and signatures in transit. Only buckets that have a policy are judged; a bucket with no policy at all is in the backlog.
    fix: Add a bucket-policy statement that denies s3:* to every principal when aws:SecureTransport is false.
    refs: [CIS-AWS:2.1.1, FSBP:S3.5, NIST-800-53:SC-8]
    query:
      protocol: aws
      service: s3
      action: GetBucketPolicy
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { policy: "" }
      items: "//Policy"
      missing: empty
      key: "{parent.Name}"
    each:
      not:
        element:
          of: Policy.Statement
          where:
            all:
              - { field: Effect, op: eq, value: Deny }
              - any:
                  - { field: 'Condition.Bool.["aws:SecureTransport"]', op: eq, value: false }
                  - { field: 'Condition.BoolIfExists.["aws:SecureTransport"]', op: eq, value: false }
    evidence: "bucket {parent.Name}: the bucket policy has no Deny for aws:SecureTransport false"

  - id: AWS-S3-ACLS-ENABLED
    title: S3 bucket still honours ACLs (object ownership not enforced)
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: s3-bucket
    refresh: 7d
    why: While ACLs are enabled, objects can be shared through per-object grants that bucket policies and reviews do not show; bucket-owner-enforced turns ACLs off and makes the policy the only gate. Buckets with no ownership setting at all are not rows here.
    fix: Set object ownership to BucketOwnerEnforced after confirming no workload relies on ACLs (S3 server access log delivery uses the bucket policy instead).
    refs: [FSBP:S3.12, NIST-800-53:AC-3]
    query:
      protocol: aws
      service: s3
      action: GetBucketOwnershipControls
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { ownershipControls: "" }
      items: "//OwnershipControls/Rule"
      missing: empty
      key: "{parent.Name}"
    each: { field: ObjectOwnership, op: ne, value: BucketOwnerEnforced }
    evidence: "bucket {parent.Name}: object ownership {ObjectOwnership}"

  - id: AWS-S3-ACCESS-LOGGING-OFF
    title: S3 bucket server access logging is off
    kind: missing
    lens: security
    category: LOG
    severity: low
    entity: s3-bucket
    refresh: 7d
    why: Without access logs (or CloudTrail data events) there is no record of who read or changed which objects, so a leak cannot be scoped after the fact.
    fix: Enable server access logging to a central log bucket, or record that CloudTrail S3 data events cover the bucket.
    refs: [FSBP:S3.9, NIST-800-53:AU-2, NIST-800-53:AU-12]
    query:
      protocol: aws
      service: s3
      action: GetBucketLogging
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { logging: "" }
      items: "//BucketLoggingStatus"
      key: "{parent.Name}"
    each: { field: LoggingEnabled, op: absent }
    evidence: "bucket {parent.Name}: server access logging off"

  - id: AWS-S3-MFA-DELETE-OFF
    title: Versioned S3 bucket without MFA delete
    kind: misconfigured
    lens: security
    category: BCK
    severity: low
    entity: s3-bucket
    refresh: 7d
    why: MFA delete makes permanently deleting a version (or turning versioning off) require the root user's MFA, which stops a stolen key from destroying the history; it matters for evidence and backup buckets.
    fix: Enable MFA delete on buckets holding evidence or backups (root user with MFA), or use S3 Object Lock instead.
    refs: [CIS-AWS:2.1.2, FSBP:S3.20, NIST-800-53:CP-9]
    query:
      protocol: aws
      service: s3
      action: GetBucketVersioning
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { versioning: "" }
      items: "//VersioningConfiguration"
      key: "{parent.Name}"
    each:
      all:
        - { field: Status, op: eq, value: Enabled }
        - any:
            - { field: MfaDelete, op: absent }
            - { field: MfaDelete, op: ne, value: Enabled }
    evidence: "bucket {parent.Name}: versioning {Status}, MFA delete {MfaDelete}"

  - id: AWS-S3-WEBSITE-ENABLED
    title: S3 bucket serves a static website
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: s3-bucket
    refresh: 7d
    why: The S3 website endpoint is plain HTTP and needs the bucket to be public; a site should be served through CloudFront with an origin access control and the bucket kept private.
    fix: Front the content with CloudFront (HTTPS, origin access control) and remove the website configuration and the public access.
    refs: [NIST-800-53:SC-7, NIST-800-53:SC-8]
    query:
      protocol: aws
      service: s3
      action: GetBucketWebsite
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { website: "" }
      items: "//WebsiteConfiguration"
      missing: empty
      key: "{parent.Name}"
    each: any
    evidence: "bucket {parent.Name}: static website hosting configured (index {IndexDocument.Suffix}, redirect {RedirectAllRequestsTo.HostName})"

  - id: AWS-S3-CORS-ANY-ORIGIN
    title: S3 bucket CORS allows any origin
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: s3-bucket
    refresh: 7d
    why: A CORS rule with origin "*" lets any web page make browser requests to the bucket with the visitor's context; for anything but public assets it should name the origins.
    fix: Replace "*" with the specific origins that need cross-origin access.
    refs: [NIST-800-53:AC-4]
    query:
      protocol: aws
      service: s3
      action: GetBucketCors
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { cors: "" }
      items: "//CORSRule"
      missing: empty
      key: "{parent.Name}|{AllowedOrigin}|{AllowedMethod}"
    each: { field: AllowedOrigin, op: eq, value: "*" }
    evidence: "bucket {parent.Name}: CORS allows origin {AllowedOrigin} for {AllowedMethod}"

  - id: AWS-S3-KMS-BUCKET-KEY-OFF
    title: S3 bucket uses SSE-KMS without a bucket key
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: s3-bucket
    refresh: 7d
    why: Without an S3 bucket key every object operation calls KMS, which costs more and can hit KMS request quotas on busy buckets.
    fix: Enable the bucket key in the bucket's default encryption settings.
    refs: [NIST-800-53:SC-28]
    query:
      protocol: aws
      service: s3
      action: GetBucketEncryption
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { encryption: "" }
      items: "//ServerSideEncryptionConfiguration"
      missing: empty
      key: "{parent.Name}"
    each:
      element:
        of: Rule
        where:
          all:
            - { field: "ApplyServerSideEncryptionByDefault.SSEAlgorithm", op: match, value: '^aws:kms$' }
            - any:
                - { field: BucketKeyEnabled, op: absent }
                - { field: BucketKeyEnabled, op: ne, value: true }
    evidence: "bucket {parent.Name}: SSE-KMS with bucket key {Rule.BucketKeyEnabled}"

  - id: AWS-S3-NO-EVENT-NOTIFICATIONS
    title: S3 bucket has no event notifications
    kind: missing
    lens: maintenance
    category: MON
    severity: info
    entity: s3-bucket
    refresh: 7d
    why: FSBP asks for event notifications so that deletions and changes on important buckets reach someone; most buckets do not need them, so this is informational.
    fix: For buckets holding important data, send object-removed and similar events to SNS, SQS, Lambda or EventBridge.
    refs: [FSBP:S3.11, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: s3
      action: GetBucketNotificationConfiguration
      for_each: { service: s3, action: ListBuckets, path: "/", items: "//Bucket", field: Name, max: 2000, params: { max-buckets: 1000 } }
      path: "/{Name}"
      params: { notification: "" }
      items: "//NotificationConfiguration"
      key: "{parent.Name}"
    each:
      all:
        - { field: TopicConfiguration, op: absent }
        - { field: QueueConfiguration, op: absent }
        - { field: CloudFunctionConfiguration, op: absent }
        - { field: EventBridgeConfiguration, op: absent }
    evidence: "bucket {parent.Name}: no event notifications"

  # ---- CloudTrail -------------------------------------------------------------------------------
  # DescribeTrails is read once at home: a multi-region trail shows in every region, so home sees them
  # all and avoids one row per region.

  - id: AWS-CLOUDTRAIL-NO-MULTI-REGION
    title: No multi-region CloudTrail trail
    kind: missing
    lens: security
    category: LOG
    severity: critical
    entity: instance
    why: Without a multi-region trail, API activity in any region the trail does not cover is never recorded, so an attacker can act in an unused region and leave no audit record. This whole-estate check passes if any account has one; per-account gaps are in the backlog.
    fix: Create one organisation trail that is multi-region, logging management read and write events, delivered to the central log archive.
    refs: [CIS-AWS:3.1, FSBP:CloudTrail.1, NIST-800-53:AU-2, NIST-800-53:AU-12]
    query:
      protocol: aws
      service: cloudtrail
      action: DescribeTrails
      regions: home
      items: trailList
      key: TrailARN
      name: Name
    count:
      op: lt
      value: 1
      where: { field: IsMultiRegionTrail, op: eq, value: true }
    evidence: "{count} multi-region of {rows} trails visible"

  - id: AWS-CLOUDTRAIL-LOG-VALIDATION-OFF
    title: CloudTrail trail without log-file validation
    kind: misconfigured
    lens: security
    category: LOG
    severity: medium
    entity: trail
    why: Log-file validation writes signed digests; without them nobody can prove the audit trail was not edited after an incident.
    fix: Enable log-file validation on the trail (UpdateTrail EnableLogFileValidation).
    refs: [CIS-AWS:3.2, FSBP:CloudTrail.4, NIST-800-53:AU-9]
    query:
      protocol: aws
      service: cloudtrail
      action: DescribeTrails
      regions: home
      items: trailList
      key: TrailARN
      name: Name
    each: { field: LogFileValidationEnabled, op: ne, value: true }
    evidence: "trail {Name}: log file validation {LogFileValidationEnabled}"

  - id: AWS-CLOUDTRAIL-NOT-KMS-ENCRYPTED
    title: CloudTrail trail not encrypted with a KMS key
    kind: misconfigured
    lens: security
    category: LOG
    severity: low
    entity: trail
    why: SSE-KMS on the trail adds a second permission gate (kms:Decrypt) on reading audit logs, so a reader also needs key access.
    fix: Set a customer-managed KMS key on the trail (UpdateTrail KmsKeyId) after granting CloudTrail use of the key in its policy.
    refs: [CIS-AWS:3.7, FSBP:CloudTrail.2, NIST-800-53:AU-9, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: cloudtrail
      action: DescribeTrails
      regions: home
      items: trailList
      key: TrailARN
      name: Name
    each: { field: KmsKeyId, op: absent }
    evidence: "trail {Name}: no KMS key (bucket {S3BucketName})"

  - id: AWS-CLOUDTRAIL-NO-CLOUDWATCH-LOGS
    title: CloudTrail trail not integrated with CloudWatch Logs
    kind: missing
    lens: security
    category: LOG
    severity: medium
    entity: trail
    why: The CIS metric-filter alarms (root use, console sign-in without MFA, policy changes) can only fire if the trail delivers to CloudWatch Logs or an equivalent SIEM feed.
    fix: Configure delivery to a CloudWatch Logs group (or document the SIEM feed and its own freshness check) with retention of a year or more.
    refs: [CIS-AWS:3.4, FSBP:CloudTrail.5, NIST-800-53:AU-6, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: cloudtrail
      action: DescribeTrails
      regions: home
      items: trailList
      key: TrailARN
      name: Name
    each: { field: CloudWatchLogsLogGroupArn, op: absent }
    evidence: "trail {Name}: no CloudWatch Logs group"

  - id: AWS-CLOUDTRAIL-NOT-LOGGING
    title: CloudTrail trail is not logging
    kind: broken
    lens: security
    category: LOG
    severity: high
    entity: trail
    why: A trail that exists but has logging stopped records nothing; stopping logging is also a classic step an attacker takes to go dark. Only trails homed in the read (home) region are covered - a trail homed elsewhere answers TrailNotFound and is skipped (see the backlog).
    fix: Start logging on the trail and investigate why it stopped; alarm on StopLogging.
    refs: [CIS-AWS:3.1, FSBP:CloudTrail.1, NIST-800-53:AU-12, MITRE-ATTACK:T1562.008]
    query:
      protocol: aws
      service: cloudtrail
      action: GetTrailStatus
      for_each: { service: cloudtrail, action: DescribeTrails, regions: home, items: trailList, field: Name, max: 200 }
      params: { Name: "{Name}" }
      missing: empty
      key: "{_account}|{_region}|{parent.Name}"
    each: { field: IsLogging, op: ne, value: true }
    evidence: "trail {parent.Name}: IsLogging {IsLogging}, last delivery error {LatestDeliveryError}"

  - id: AWS-CLOUDTRAIL-ACCOUNT-NO-MULTI-REGION
    title: Account has no multi-region CloudTrail trail
    kind: missing
    lens: security
    category: LOG
    severity: high
    entity: account
    why: An account whose own trails and organisation shadow trails include no multi-region trail records nothing in the regions its trails do not cover - one row per account, so a single unprotected member account is caught.
    fix: Cover the account with the organisation trail (multi-region, management events read and write) or create a multi-region trail in it.
    refs: [CIS-AWS:3.1, FSBP:CloudTrail.1, NIST-800-53:AU-2, NIST-800-53:AU-12]
    query:
      protocol: aws
      service: cloudtrail
      action: DescribeTrails
      regions: home
      key: _account
      min_rows: 1
    each:
      not: { element: { of: trailList, where: { field: IsMultiRegionTrail, op: eq, value: true } } }
    evidence: "account {_account}: no multi-region trail among {trailList[].Name}"

  - id: AWS-CLOUDTRAIL-NO-S3-DATA-EVENTS
    title: No CloudTrail trail in the account records S3 object-level events
    kind: missing
    lens: security
    category: LOG
    severity: medium
    entity: account
    refresh: 7d
    why: Management events do not show who read or changed which objects; without S3 data events a data theft from a bucket leaves no trail. Any S3 data-event selector counts here, whatever buckets it names.
    fix: Add S3 data events (read and write) for all buckets, or at least the buckets holding sensitive data, to a trail - basic or advanced event selectors.
    refs: [CIS-AWS:3.8, CIS-AWS:3.9, NIST-800-53:AU-2, NIST-800-53:AU-12]
    query:
      protocol: aws
      service: cloudtrail
      action: GetEventSelectors
      for_each: { service: cloudtrail, action: DescribeTrails, regions: home, items: trailList, field: Name, max: 200 }
      params: { TrailName: "{Name}" }
      missing: empty
      key: "{_account}|{parent.Name}"
    count:
      op: lt
      value: 1
      by: _account
      where:
        any:
          - all:
              - { field: EventSelectors, op: exists }
              - element: { of: EventSelectors, where: { element: { of: DataResources, where: { field: Type, op: eq, value: "AWS::S3::Object" } } } }
          - all:
              - { field: AdvancedEventSelectors, op: exists }
              - element:
                  of: AdvancedEventSelectors
                  where:
                    element:
                      of: FieldSelectors
                      where:
                        all:
                          - { field: Field, op: eq, value: resources.type }
                          - { field: Equals, op: contains, value: "AWS::S3::Object" }
    evidence: "{count} trail(s) in the account record S3 data events"

  # ---- AWS Config -------------------------------------------------------------------------------

  - id: AWS-CONFIG-RECORDER-OFF
    title: AWS Config recorder off or not delivering
    kind: broken
    lens: both
    category: MON
    severity: high
    entity: config-recorder
    why: AWS Config is the record of how every resource is configured over time and the engine behind conformance packs; a recorder that is stopped or failing to deliver leaves a region with no configuration history. This catches a recorder that is present but off or not delivering; a region or account with no recorder at all needs a per-place must-exist (see the backlog).
    fix: Start the recorder, fix the delivery channel's S3/SNS permissions, and record all supported resource types with global types in one region.
    refs: [CIS-AWS:3.3, FSBP:Config.1, NIST-800-53:CM-8, NIST-800-53:AU-6]
    query:
      protocol: aws
      service: config
      action: DescribeConfigurationRecorderStatus
      items: ConfigurationRecordersStatus
      key: "{_account}|{_region}|{name}"
      name: name
    each:
      any:
        - { field: recording, op: ne, value: true }
        - { field: lastStatus, op: ne, value: SUCCESS }
    evidence: "account {_account} {_region}: recorder {name} recording {recording}, last status {lastStatus}"

  - id: AWS-CONFIG-NO-RECORDER
    title: No AWS Config recorder in an account and region
    kind: missing
    lens: both
    category: MON
    severity: high
    entity: region
    why: A region with no Config recorder keeps no configuration history and evaluates no Config rules, so changes there are invisible to audits and to every conformance pack. One row per account and region read.
    fix: Enable AWS Config in every account and region (organisation-wide through a delegated administrator or Control Tower), recording all resource types.
    refs: [CIS-AWS:3.3, FSBP:Config.1, NIST-800-53:CM-8]
    query:
      protocol: aws
      service: config
      action: DescribeConfigurationRecorders
      key: "{_account}|{_region}"
    each: { field: ConfigurationRecorders, op: empty }
    evidence: "account {_account} {_region}: no Config recorder"

  - id: AWS-CONFIG-NOT-ALL-RESOURCES
    title: AWS Config recorder does not record all resource types
    kind: misconfigured
    lens: both
    category: MON
    severity: low
    entity: config-recorder
    refresh: 7d
    why: A recorder limited to chosen types leaves every other type without history or rule evaluation; new services are missed by default.
    fix: Set the recording group to all supported resource types (exclude only what cost demands, explicitly).
    refs: [CIS-AWS:3.3, FSBP:Config.1, NIST-800-53:CM-8]
    query:
      protocol: aws
      service: config
      action: DescribeConfigurationRecorders
      items: ConfigurationRecorders
      key: "{_account}|{_region}|{name}"
      name: name
    each: { field: recordingGroup.allSupported, op: ne, value: true }
    evidence: "account {_account} {_region}: recorder {name} allSupported {recordingGroup.allSupported}"

  - id: AWS-CONFIG-RULE-NONCOMPLIANT
    title: AWS Config rule has non-compliant resources
    kind: misconfigured
    lens: both
    category: CFG
    severity: low
    entity: config-rule
    why: A Config rule reporting non-compliance is a control the organisation chose to enforce that is currently failing; it is the native AWS view of drift from the baseline.
    fix: Review the non-compliant resources of the rule in AWS Config and remediate, or adjust the rule if the baseline changed.
    refs: [NIST-800-53:CM-6, NIST-800-53:CA-7]
    query:
      protocol: aws
      service: config
      action: DescribeComplianceByConfigRule
      params: { ComplianceTypes: [NON_COMPLIANT] }
      items: ComplianceByConfigRules
      key: "{_account}|{_region}|{ConfigRuleName}"
      name: ConfigRuleName
    each: any
    evidence: "account {_account} {_region}: Config rule {ConfigRuleName} is {Compliance.ComplianceType} ({Compliance.ComplianceContributorCount.CappedCount} resources)"

  - id: AWS-CONFIG-NO-AGGREGATOR
    title: No AWS Config aggregator anywhere
    kind: missing
    lens: both
    category: MON
    severity: low
    entity: instance
    refresh: 7d
    why: Without an aggregator, configuration and compliance are seen one account and region at a time; nobody has the organisation-wide view.
    fix: Create an organisation aggregator in the delegated administrator (or audit) account.
    refs: [NIST-800-53:CA-7, NIST-800-53:CM-8]
    query:
      protocol: aws
      service: config
      action: DescribeConfigurationAggregators
      items: ConfigurationAggregators
      key: ConfigurationAggregatorArn
      name: ConfigurationAggregatorName
    count: none
    evidence: "no Config aggregator returned in any account or region read"

  # ---- KMS --------------------------------------------------------------------------------------

  - id: AWS-KMS-KEY-PENDING-DELETION
    title: Customer KMS key disabled or pending deletion
    kind: broken
    lens: both
    category: PKI
    severity:
      field: KeyMetadata.KeyState
      map: { PendingDeletion: critical, PendingReplicaDeletion: high, Disabled: high }
      default: medium
    entity: kms-key
    why: A key that is disabled or scheduled for deletion cannot decrypt what it encrypted; anything still referencing it (a volume, a database, a bucket, the audit trail) becomes unreadable on the deletion date.
    fix: Confirm nothing references the key before deletion; cancel the deletion or re-enable the key if anything still depends on it.
    refs: [NIST-800-53:SC-12, NIST-800-53:SC-28, MITRE-ATTACK:T1485]
    query:
      protocol: aws
      service: kms
      action: DescribeKey
      for_each: { service: kms, action: ListKeys, items: Keys, field: KeyId, max: 2000, next: { from: NextMarker, to: Marker } }
      params: { KeyId: "{KeyId}" }
      key: "{_account}|{_region}|{parent.KeyId}"
    each:
      all:
        - { field: KeyMetadata.KeyManager, op: eq, value: CUSTOMER }
        - { field: KeyMetadata.KeyState, op: in, value: [Disabled, PendingDeletion, PendingReplicaDeletion] }
    evidence: "key {parent.KeyId} ({_region}): state {KeyMetadata.KeyState}, deletion {KeyMetadata.DeletionDate}"

  - id: AWS-KMS-ROTATION-DISABLED
    title: Customer KMS key without automatic rotation
    kind: misconfigured
    lens: security
    category: PKI
    severity: low
    entity: kms-key
    refresh: 7d
    why: Automatic rotation limits how much data one key version protects and how long a leaked key version is useful; a symmetric customer key should have it on. Asymmetric keys cannot rotate and may show here as a false positive.
    fix: Enable automatic key rotation on customer-managed symmetric keys (kms:EnableKeyRotation).
    refs: [CIS-AWS:3.8, FSBP:KMS.4, NIST-800-53:SC-12]
    query:
      protocol: aws
      service: kms
      action: GetKeyRotationStatus
      for_each: { service: kms, action: ListKeys, items: Keys, field: KeyId, max: 2000, next: { from: NextMarker, to: Marker } }
      params: { KeyId: "{KeyId}" }
      key: "{_account}|{_region}|{parent.KeyId}"
    each: { field: KeyRotationEnabled, op: eq, value: false }
    evidence: "key {parent.KeyId} ({_region}): rotation {KeyRotationEnabled}"

  - id: AWS-KMS-ROTATION-PERIOD-LONG
    title: KMS key rotates less often than yearly
    kind: misconfigured
    lens: security
    category: PKI
    severity: low
    entity: kms-key
    refresh: 7d
    why: A custom rotation period longer than a year lets one key version protect more data for longer than the baseline expects.
    fix: Set the rotation period to 365 days or less.
    refs: [NIST-800-53:SC-12]
    query:
      protocol: aws
      service: kms
      action: GetKeyRotationStatus
      for_each: { service: kms, action: ListKeys, items: Keys, field: KeyId, max: 2000, next: { from: NextMarker, to: Marker } }
      params: { KeyId: "{KeyId}" }
      key: "{_account}|{_region}|{parent.KeyId}"
    each:
      all:
        - { field: KeyRotationEnabled, op: eq, value: true }
        - { field: RotationPeriodInDays, op: gt, value: 365, threshold: aws.kms.max-rotation-days }
    evidence: "key {parent.KeyId} ({_region}): rotates every {RotationPeriodInDays} days"

  - id: AWS-KMS-KEY-POLICY-PUBLIC
    title: KMS key policy allows any principal without a condition
    kind: misconfigured
    lens: security
    category: PKI
    severity: high
    entity: kms-key
    why: A key policy statement for Principal "*" with no condition lets any AWS account use the key - to decrypt whatever it protects, or to encrypt data with it. AWS-managed keys carry caller-account conditions and do not match.
    fix: Replace the wildcard principal with the account root or specific roles, or add conditions (kms:CallerAccount, aws:PrincipalOrgID, kms:ViaService).
    refs: [FSBP:KMS.5, NIST-800-53:AC-3, NIST-800-53:SC-12]
    query:
      protocol: aws
      service: kms
      action: GetKeyPolicy
      for_each: { service: kms, action: ListKeys, items: Keys, field: KeyId, max: 2000, next: { from: NextMarker, to: Marker } }
      params: { KeyId: "{KeyId}", PolicyName: default }
      key: "{_account}|{_region}|{parent.KeyId}"
    each:
      all:
        - { field: Policy, op: match, value: '(?:%22|")Principal(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%7B|\{)(?:(?!%7D|\})[\s\S])*?(?:%22|")AWS(?:%22|")(?:%20|%0A|%0D|%09|\+|\s)*(?:%3A|:)(?:%20|%0A|%0D|%09|\+|\s)*(?:(?:%22|")(?:%2A|\*)(?:%22|")|(?:%5B|\[)(?:(?!%5D|\])[\s\S])*?(?:%22|")(?:%2A|\*)(?:%22|")))' }
        - { field: Policy, op: notmatch, value: '(?:%22|")Condition(?:%22|")' }
    evidence: "key {parent.KeyId} ({_account} {_region}): the key policy admits any principal with no condition"

  - id: AWS-KMS-KEY-POLICY-FOREIGN-ACCOUNT
    title: KMS key policy names an account outside the organisation
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: kms-key
    why: "A key policy that names another AWS account (its root or one of its roles) lets that account use the key - to decrypt what it protects - under that account's own access controls, not yours. Sharing with a vendor or a former account is easy to forget. The policy is JSON text, so the rule cannot compare each principal with a list; the setting is a pattern that matches an account ARN whose 12-digit id is not one of the organisation's - for example arn:aws:iam::(?!(?:111111111111|222222222222):)[0-9]{12}: with your account ids in place of the examples. Until it is set the rule is not configured. Account ids inside conditions written as ARNs match too."
    fix: Confirm each foreign account with the key's owner; remove statements for accounts that no longer need the key, and limit the rest to specific roles and actions (kms:Decrypt via a named service, with kms:ViaService or aws:PrincipalOrgID conditions).
    refs: [NIST-800-53:AC-3, NIST-800-53:SC-12, NIST-800-53:AC-21]
    query:
      protocol: aws
      service: kms
      action: GetKeyPolicy
      for_each: { service: kms, action: ListKeys, items: Keys, field: KeyId, max: 2000, next: { from: NextMarker, to: Marker } }
      params: { KeyId: "{KeyId}", PolicyName: default }
      key: "{_account}|{_region}|{parent.KeyId}"
    each: { field: Policy, op: match, value: 'arn:aws:iam::[0-9]{12}:', threshold: aws.kms.foreign-account-pattern, required: true }
    evidence: "key {parent.KeyId} ({_account} {_region}): the key policy names an account outside the organisation's list"

  # ---- EC2, EBS, VPC ----------------------------------------------------------------------------

  - id: AWS-EC2-IMDSV2-NOT-REQUIRED
    title: Running EC2 instance does not require IMDSv2
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: ec2-instance
    why: With IMDSv1 allowed, a server-side request forgery in any app on the instance can read the instance role's credentials from the metadata service; IMDSv2 (session tokens) closes that path.
    fix: Set the instance metadata options to require tokens (HttpTokens required) and set the hop limit to 1; bake it into launch templates and the account default.
    refs: [CIS-AWS:5.6, FSBP:EC2.8, NIST-800-53:AC-6, MITRE-ATTACK:T1552.005]
    query:
      protocol: aws
      service: ec2
      action: DescribeInstances
      items: "//instancesSet/item"
      key: instanceId
    each:
      all:
        - { field: instanceState.name, op: eq, value: running }
        - { field: metadataOptions.httpTokens, op: ne, value: required }
    evidence: "instance {instanceId} ({_account} {_region}): httpTokens {metadataOptions.httpTokens}"

  - id: AWS-EC2-PUBLIC-IP
    title: Running EC2 instance has a public IPv4 address
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: ec2-instance
    why: A public IP puts the instance directly on the internet, reachable by anyone its security groups allow; servers should sit behind a load balancer, NAT or private connectivity, not expose their own address.
    fix: Remove the public IP (move the instance to a private subnet, front it with an ALB/NLB), or confirm and document why it must be public and tighten its security groups.
    refs: [NIST-800-53:SC-7, FSBP:EC2.9]
    query:
      protocol: aws
      service: ec2
      action: DescribeInstances
      items: "//instancesSet/item"
      key: instanceId
    each:
      all:
        - { field: instanceState.name, op: eq, value: running }
        - { field: ipAddress, op: exists }
    evidence: "instance {instanceId} ({_account} {_region}): public IP {ipAddress}"

  - id: AWS-EBS-VOLUME-UNENCRYPTED
    title: EBS volume not encrypted at rest
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: ebs-volume
    why: An unencrypted volume's data is readable by anyone who can reach the underlying storage or a snapshot of it; encryption at rest is cheap and expected for every volume.
    fix: Recreate the volume from an encrypted snapshot, or encrypt at the next rebuild; turn on EBS encryption by default so new volumes are always encrypted.
    refs: [CIS-AWS:2.2.1, FSBP:EC2.3, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: ec2
      action: DescribeVolumes
      items: "//volumeSet/item"
      key: volumeId
    each: { field: encrypted, op: eq, value: false }
    evidence: "volume {volumeId} ({_account} {_region}): {size} GiB {volumeType}, encrypted {encrypted}"

  - id: AWS-EBS-ENCRYPTION-BY-DEFAULT-OFF
    title: EBS encryption by default is off in an account and region
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: account
    why: With encryption-by-default off, any new volume or snapshot created without an explicit setting is unencrypted; turning it on makes every future volume encrypted with no per-request effort.
    fix: Enable EBS encryption by default in every account and region (ec2 EnableEbsEncryptionByDefault), with a customer-managed default key where key custody matters.
    refs: [CIS-AWS:2.2.1, FSBP:EC2.7, NIST-800-53:SC-28]
    query:
      protocol: aws
      service: ec2
      action: GetEbsEncryptionByDefault
      items: "//GetEbsEncryptionByDefaultResponse"
      key: "{_account}|{_region}"
    each: { field: ebsEncryptionByDefault, op: eq, value: false }
    evidence: "account {_account} {_region}: EBS encryption by default {ebsEncryptionByDefault}"

  - id: AWS-AMI-PUBLIC
    title: Self-owned AMI is shared publicly
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: ami
    why: A public AMI exposes whatever is baked into the image - configuration, embedded credentials, resident data - to every AWS account in the world.
    fix: Make the AMI private (remove the "all" launch permission) and enable the account-level block on public AMIs; rotate anything the image may have exposed.
    refs: [FSBP:EC2.33, NIST-800-53:AC-3, NIST-800-53:SC-7]
    query:
      protocol: aws
      service: ec2
      action: DescribeImages
      params: { "Owner.1": self }
      items: "//imagesSet/item"
      key: imageId
      name: name
    each: { field: isPublic, op: eq, value: true }
    evidence: "AMI {imageId} ({_account} {_region}): {name} is public"

  - id: AWS-SG-ALL-TRAFFIC-FROM-INTERNET
    title: Security group allows all traffic from the internet
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: security-group-rule
    why: An ingress rule for all protocols from 0.0.0.0/0 or ::/0 opens every port on whatever the group is attached to; it is the widest possible exposure.
    fix: Replace the rule with the specific ports and sources actually needed; never leave all-traffic open to the internet.
    refs: [CIS-AWS:5.2, FSBP:EC2.18, NIST-800-53:SC-7, NIST-800-53:AC-4]
    query:
      protocol: aws
      service: ec2
      action: DescribeSecurityGroupRules
      items: "//securityGroupRuleSet/item"
      key: securityGroupRuleId
    each:
      all:
        - { field: isEgress, op: eq, value: false }
        - { field: ipProtocol, op: eq, value: "-1" }
        - any:
            - { field: cidrIpv4, op: eq, value: "0.0.0.0/0" }
            - { field: cidrIpv6, op: eq, value: "::/0" }
    evidence: "group {groupId} ({_account} {_region}): all traffic from {cidrIpv4}{cidrIpv6}"

  - id: AWS-SG-RDP-FROM-INTERNET
    title: Security group allows RDP (3389) from the internet
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: security-group-rule
    why: RDP open to 0.0.0.0/0 is scanned and brute-forced continuously; it is one of the most common ways a Windows server is compromised.
    fix: Remove the internet source; reach RDP through Session Manager, a bastion, or a specific admin CIDR only.
    refs: [CIS-AWS:5.2, FSBP:EC2.13, NIST-800-53:SC-7, MITRE-ATTACK:T1021.001]
    query:
      protocol: aws
      service: ec2
      action: DescribeSecurityGroupRules
      items: "//securityGroupRuleSet/item"
      key: securityGroupRuleId
    each:
      all:
        - { field: isEgress, op: eq, value: false }
        - { field: ipProtocol, op: in, value: [tcp, "6", "-1"] }
        - { field: fromPort, op: le, value: 3389 }
        - { field: toPort, op: ge, value: 3389 }
        - any:
            - { field: cidrIpv4, op: eq, value: "0.0.0.0/0" }
            - { field: cidrIpv6, op: eq, value: "::/0" }
    evidence: "group {groupId} ({_account} {_region}): RDP open from {cidrIpv4}{cidrIpv6} ({fromPort}-{toPort})"

  - id: AWS-SG-SSH-FROM-INTERNET
    title: Security group allows SSH (22) from the internet
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: security-group-rule
    why: SSH open to 0.0.0.0/0 is scanned and brute-forced continuously; administration ports should never be reachable from the whole internet.
    fix: Remove the internet source; reach SSH through Session Manager, a bastion, or a specific admin CIDR only.
    refs: [CIS-AWS:5.2, FSBP:EC2.13, NIST-800-53:SC-7, MITRE-ATTACK:T1021.004]
    query:
      protocol: aws
      service: ec2
      action: DescribeSecurityGroupRules
      items: "//securityGroupRuleSet/item"
      key: securityGroupRuleId
    each:
      all:
        - { field: isEgress, op: eq, value: false }
        - { field: ipProtocol, op: in, value: [tcp, "6", "-1"] }
        - { field: fromPort, op: le, value: 22 }
        - { field: toPort, op: ge, value: 22 }
        - any:
            - { field: cidrIpv4, op: eq, value: "0.0.0.0/0" }
            - { field: cidrIpv6, op: eq, value: "::/0" }
    evidence: "group {groupId} ({_account} {_region}): SSH open from {cidrIpv4}{cidrIpv6} ({fromPort}-{toPort})"

  - id: AWS-VPC-FLOW-LOG-INACTIVE
    title: VPC flow log is not active
    kind: broken
    lens: both
    category: LOG
    severity: medium
    entity: flow-log
    why: A flow log that is not delivering leaves the VPC's network traffic unrecorded, so attribution of a traffic source or a leak after the fact is impossible. A VPC with no flow log at all is a separate gap (see the backlog).
    fix: Fix the flow log's delivery role or destination permissions so its status returns to ACTIVE; deliver to the central log archive.
    refs: [CIS-AWS:3.9, FSBP:EC2.6, NIST-800-53:AU-12, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: ec2
      action: DescribeFlowLogs
      items: "//flowLogSet/item"
      key: flowLogId
    each: { field: flowLogStatus, op: ne, value: ACTIVE }
    evidence: "flow log {flowLogId} on {resourceId} ({_account} {_region}): status {flowLogStatus}, {deliverLogsErrorMessage}"

  - id: AWS-VPN-TUNNEL-DOWN
    title: Site-to-site VPN tunnel is down
    kind: broken
    lens: maintenance
    category: AVL
    severity: high
    entity: vpn-connection
    refresh: 1h
    why: A VPN connection has two tunnels for redundancy; one down removes the redundancy and often goes unnoticed for weeks, and both down is an outage of whatever runs over it.
    fix: Investigate the tunnel (peer device, routing, BGP) and restore it; alarm on TunnelState so the next one is caught in minutes, not at the morning check.
    refs: [NIST-800-53:SC-7, NIST-800-53:CP-8]
    query:
      protocol: aws
      service: ec2
      action: DescribeVpnConnections
      items: "//vpnConnectionSet/item"
      key: vpnConnectionId
    each:
      all:
        - { field: state, op: eq, value: available }
        - { field: "vgwTelemetry.item[].status", op: eq, value: DOWN }
    evidence: "VPN {vpnConnectionId} ({_account} {_region}): a tunnel is DOWN ({vgwTelemetry.item[].statusMessage})"

  # ---- Security-group ports open to the internet (DescribeSecurityGroupRules; protocol -1 is
  # AWS-SG-ALL-TRAFFIC-FROM-INTERNET). A range that contains the port counts.

  - id: AWS-SG-TELNET-FROM-INTERNET
    title: Security group allows Telnet from the internet
    kind: misconfigured
    lens: security
    category: AUT
    severity: high
    entity: security-group-rule
    why: 'Telnet is a service that should never face the whole internet: it is scanned continuously, its authentication is often weak or absent, and exposed instances are a routine way in.'
    fix: 'Remove the 0.0.0.0/0 or ::/0 source; reach the service from inside the VPC, over private connectivity, or from a specific administrative CIDR only.'
    refs: [FSBP:EC2.19, NIST-800-53:SC-7, NIST-800-53:AC-4, MITRE-ATTACK:T1021]
    query:
      protocol: aws
      service: ec2
      action: DescribeSecurityGroupRules
      items: "//securityGroupRuleSet/item"
      key: securityGroupRuleId
    each:
      all:
        - { field: isEgress, op: eq, value: false }
        - { field: ipProtocol, op: in, value: [tcp, "6"] }
        - { field: fromPort, op: le, value: 23 }
        - { field: toPort, op: ge, value: 23 }
        - any:
            - { field: cidrIpv4, op: eq, value: "0.0.0.0/0" }
            - { field: cidrIpv6, op: eq, value: "::/0" }
    evidence: "group {groupId} ({_account} {_region}): Telnet reachable from {cidrIpv4}{cidrIpv6} ({ipProtocol} {fromPort}-{toPort})"

  - id: AWS-SG-FTP-FROM-INTERNET
    title: Security group allows FTP (20-21) from the internet
    kind: misconfigured
    lens: security
    category: AUT
    severity: high
    entity: security-group-rule
    why: 'FTP (20-21) is a service that should never face the whole internet: it is scanned continuously, its authentication is often weak or absent, and exposed instances are a routine way in.'
    fix: 'Remove the 0.0.0.0/0 or ::/0 source; reach the service from inside the VPC, over private connectivity, or from a specific administrative CIDR only.'
    refs: [FSBP:EC2.19, NIST-800-53:SC-7, NIST-800-53:AC-4, MITRE-ATTACK:T1071.002]
    query:
      protocol: aws
      service: ec2
      action: DescribeSecurityGroupRules
      items: "//securityGroupRuleSet/item"
      key: securityGroupRuleId
    each:
