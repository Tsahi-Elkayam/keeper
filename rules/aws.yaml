            - all: [ { field: fromPort, op: le, value: 21 }, { field: toPort, op: ge, value: 21 } ]
        - any:
            - { field: cidrIpv4, op: eq, value: "0.0.0.0/0" }
            - { field: cidrIpv6, op: eq, value: "::/0" }
    evidence: "group {groupId} ({_account} {_region}): FTP (20-21) reachable from {cidrIpv4}{cidrIpv6} ({ipProtocol} {fromPort}-{toPort})"

  - id: AWS-SG-SMB-FROM-INTERNET
    title: Security group allows SMB (445) from the internet
    kind: misconfigured
    lens: security
    category: AUT
    severity: critical
    entity: security-group-rule
