      items: "//MetricAlarms/member"
      key: AlarmArn
      name: AlarmName
    each: { field: AlarmActions.member, op: absent }
    evidence: "alarm {AlarmName} ({_account} {_region}): no alarm action"

  # ---- CIS log metric filters: one row per account at home (no items: the whole answer), so an account
  # with no filter at all is a finding. Whether an alarm with a subscriber sits on the filter is in the
  # backlog (a join with CloudWatch alarms).

  - id: AWS-CW-METRIC-FILTER-UNAUTHORIZED-API-MISSING
    title: No log metric filter for unauthorised API calls
    kind: missing
    lens: security
    category: MON
    severity: low
    entity: account
    refresh: 7d
    why: 'Without a metric filter (and an alarm on it) over the CloudTrail log group, unauthorised API calls happen with nobody told; CIS expects each such event family to raise an alert.'
    fix: 'Add a metric filter for the event family on the log group CloudTrail delivers to, with a CloudWatch alarm and an SNS subscriber (or route the same events from the SIEM and record that).'
    refs: [CIS-AWS:4.1, NIST-800-53:AU-6, NIST-800-53:SI-4]
    query:
      protocol: aws
      service: logs
      action: DescribeMetricFilters
      regions: home
      params: { limit: 50 }
      next: { from: nextToken, to: nextToken }
      key: "{_account}|{_region}"
    each:
      not: { element: { of: metricFilters, where: { field: filterPattern, op: match, value: 'UnauthorizedOperation|AccessDenied' } } }
    evidence: "account {_account} {_region}: no metric filter for unauthorised API calls"

