schema: keeper.rules/1
system: active-directory
name: Active Directory
integration: ldap

# Generic Active Directory checks, read over LDAP only (one domain per integration).
# Thresholds (threshold.<name>) let a tenant tune every number; the value here is the default.
# Rules that name a domain group by its DN (Domain Admins, Enterprise Admins, Schema Admins,
# Protected Users, DnsAdmins) assume the English default names; builtin groups are found by SID.

defaults:
  kind: misconfigured
  lens: security
  refresh: 1d

rules:

  # ---------------------------------------------------------------- population (coverage sanity)

  - id: AD-POP-USERS-NONE
    title: No user accounts are visible to the reader
    kind: broken
    lens: maintenance
    category: MON
    severity: high
    entity: user
    why: Every user rule, and the hybrid identity pack that joins these rows to the cloud directory, reads this inventory. An empty answer from a working query means the integration's identity cannot see the users, so every user rule would pass without having looked.
    fix: Check the integration's account and its read rights on the domain partition, then rescan.
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    count: none
    evidence: "The user inventory query returned {count} rows"

  - id: AD-POP-COMPUTERS-NONE
    title: No enabled computer accounts are visible to the reader
    kind: broken
    lens: maintenance
    category: MON
    severity: high
    entity: computer
    why: Computer rules, and other rule packs that scan hosts found here, depend on this list. An empty answer means the reader cannot see the computer objects.
    fix: Check the integration's account and its read rights on the computer OUs, then rescan.
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    count: none
    evidence: "The enabled-computer query returned {count} rows"

  - id: AD-POP-PROTECTED-GROUPS-NONE
    title: No protected groups are visible to the reader
    kind: broken
    lens: maintenance
    category: MON
    severity: high
    entity: group
    why: Every domain has groups marked adminCount=1 (the administrator and operator groups at least). An empty answer means the reader cannot see group objects or their adminCount, so the protected-group rules would pass without having looked.
    fix: Check the integration's read rights on group objects in the Users and Builtin containers, then rescan.
    refs: [NIST-800-53:CA-7]
    query:
      protocol: ldap
      filter: '(&(objectClass=group)(adminCount=1))'
      attributes: [cn, member, memberOf, groupType, isCriticalSystemObject, whenChanged]
      key: distinguishedName
      name: cn
    count: none
    evidence: "The protected-group query returned {count} rows"

  - id: AD-POP-GPOS-NONE
    title: No Group Policy objects are visible to the reader
    kind: broken
    lens: maintenance
    category: MON
    severity: high
    entity: gpo
    why: The two default policies always exist, so an empty Policies container means the reader cannot list policy objects and every GPO rule would pass without having looked.
    fix: Check the integration's read rights on CN=Policies,CN=System, then rescan.
    refs: [NIST-800-53:CA-7]
    query:
      protocol: ldap
      base: 'CN=Policies,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=groupPolicyContainer)'
      attributes: [cn, displayName, flags, versionNumber, gPCFileSysPath, gPCMachineExtensionNames, gPCUserExtensionNames, whenChanged]
      key: cn
      name: displayName
    count: none
    evidence: "The policy-container query returned {count} rows"

  # ---------------------------------------------------------------- user accounts

  # One user inventory query (all user objects except trust accounts) feeds every rule that carries
  # the filter (&{USER}(!{UAC:2048})), plus AD-POP-USERS-NONE, and the cross-system packs, which join
  # these rows from row_seen (on objectSid, adminCount, memberOf). Keep the filter, attribute list and
  # key identical so the rules share one fetch; add attributes, never remove them.
  #
  # The stale-user rules partition the enabled accounts so a breakdown adds up: expired accounts,
  # shared/room/equipment mailbox objects (AD-USER-RESOURCE-MAILBOX-ENABLED), accounts in a
  # leavers/disabled OU (AD-USER-ENABLED-IN-DISABLED-OU, AD-USER-DISABLED-OU-STILL-USED) and
  # well-known service and system accounts (ad.service-account-pattern) are left out of
  # AD-USER-NO-DC-LOGON, AD-USER-NO-DC-LOGON-1Y and AD-USER-NEVER-LOGGED-ON. The built-in
  # Administrator (RID 500) is never excluded by the pattern.

  - id: AD-USER-NO-DC-LOGON
    title: Enabled user with no domain controller logon for 90 days to a year
    lens: both
    category: HYG
    severity: info
    entity: user
    why: lastLogonTimestamp records only authentication against a domain controller and ignores cloud sign-ins - users who work only in cloud services (password hash sync, no contact with a DC) look stale here while active. This is a list to reconcile with cloud sign-in data, not the authority for disabling accounts. Accounts idle for more than the long-idle threshold are reported by AD-USER-NO-DC-LOGON-1Y instead.
    fix: Join the list with cloud sign-in activity (the hybrid identity rules do this) and disable only accounts that are idle in both places, after owner confirmation.
    refs: [NIST-800-53:AC-2(3), CIS-CONTROLS-8:5.3, PINGCASTLE:S-Inactive]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - any:
            - { field: accountExpires, op: absent }
            - { field: accountExpires, op: eq, value: 0 }
            - not: { field: accountExpires, op: until-lt, value: 0 }
        - any:
            - { field: msExchRecipientTypeDetails, op: absent }
            - { field: msExchRecipientTypeDetails, op: notin, value: [4, 16, 32, 8589934592, 17179869184, 34359738368] }
        - { field: distinguishedName, op: notmatch, value: '(?i)OU=[^,]*(disable|leaver|terminat|former|departed|deprovision)', threshold: ad.disabled-ou-pattern }
        - any:
            - { field: objectSid, op: match, value: '-500$' }
            - { field: sAMAccountName, op: notmatch, value: '^(krbtgt|Guest|DefaultAccount|WDAGUtilityAccount|MSOL_[0-9a-f]+|AAD_[0-9a-f]+|Sync_.*|HealthMailbox.*|SM_[0-9a-f]+|.*\$)$', threshold: ad.service-account-pattern }
        - { field: lastLogonTimestamp, op: age-gt, value: 90, threshold: ad.stale-user-days }
        - { field: lastLogonTimestamp, op: age-lt, value: 365, threshold: ad.long-idle-user-days }
    evidence: "{sAMAccountName} - last domain logon {lastLogonTimestamp}"

  - id: AD-USER-NO-DC-LOGON-1Y
    title: Enabled user with no domain controller logon for more than a year
    lens: both
    category: HYG
    severity: low
    entity: user
    why: A year without authenticating to a domain controller usually means the account is abandoned, but lastLogonTimestamp still ignores cloud sign-ins - users who work only in cloud services (password hash sync) appear here while active. Confirm against cloud sign-in data before disabling.
    fix: Join the list with cloud sign-in activity (the hybrid identity rules do this); disable accounts idle in both places after owner confirmation and delete them after the retention period.
    refs: [NIST-800-53:AC-2(3), CIS-CONTROLS-8:5.3, PINGCASTLE:S-Inactive]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - any:
            - { field: accountExpires, op: absent }
            - { field: accountExpires, op: eq, value: 0 }
            - not: { field: accountExpires, op: until-lt, value: 0 }
        - any:
            - { field: msExchRecipientTypeDetails, op: absent }
            - { field: msExchRecipientTypeDetails, op: notin, value: [4, 16, 32, 8589934592, 17179869184, 34359738368] }
        - { field: distinguishedName, op: notmatch, value: '(?i)OU=[^,]*(disable|leaver|terminat|former|departed|deprovision)', threshold: ad.disabled-ou-pattern }
        - any:
            - { field: objectSid, op: match, value: '-500$' }
            - { field: sAMAccountName, op: notmatch, value: '^(krbtgt|Guest|DefaultAccount|WDAGUtilityAccount|MSOL_[0-9a-f]+|AAD_[0-9a-f]+|Sync_.*|HealthMailbox.*|SM_[0-9a-f]+|.*\$)$', threshold: ad.service-account-pattern }
        - { field: lastLogonTimestamp, op: age-gt, value: 365, threshold: ad.long-idle-user-days }
    evidence: "{sAMAccountName} - last domain logon {lastLogonTimestamp}"

  - id: AD-USER-NEVER-LOGGED-ON
    title: Enabled user account created long ago and never used
    lens: both
    category: HYG
    severity: low
    entity: user
    why: An account created long ago with no logon on record is usually a provisioning leftover that may still hold the initial password someone set or shared. Cloud-only use also leaves no domain logon, so confirm against cloud sign-ins.
    fix: Confirm the account is still needed; otherwise disable and delete it. Give new accounts an expiry date so unclaimed ones lapse.
    refs: [NIST-800-53:AC-2(3), CIS-CONTROLS-8:5.3]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - any:
            - { field: accountExpires, op: absent }
            - { field: accountExpires, op: eq, value: 0 }
            - not: { field: accountExpires, op: until-lt, value: 0 }
        - any:
            - { field: msExchRecipientTypeDetails, op: absent }
            - { field: msExchRecipientTypeDetails, op: notin, value: [4, 16, 32, 8589934592, 17179869184, 34359738368] }
        - { field: distinguishedName, op: notmatch, value: '(?i)OU=[^,]*(disable|leaver|terminat|former|departed|deprovision)', threshold: ad.disabled-ou-pattern }
        - any:
            - { field: objectSid, op: match, value: '-500$' }
            - { field: sAMAccountName, op: notmatch, value: '^(krbtgt|Guest|DefaultAccount|WDAGUtilityAccount|MSOL_[0-9a-f]+|AAD_[0-9a-f]+|Sync_.*|HealthMailbox.*|SM_[0-9a-f]+|.*\$)$', threshold: ad.service-account-pattern }
        - { field: lastLogonTimestamp, op: absent }
        - { field: whenCreated, op: age-gt, value: 30, threshold: ad.never-logged-on-days }
    evidence: "{sAMAccountName} - created {whenCreated}, no domain logon recorded"

  - id: AD-USER-ENABLED-IN-DISABLED-OU
    title: Enabled user in a leavers or disabled-accounts OU
    category: IAM
    severity: high
    entity: user
    why: Moving an account into a leavers OU is not disabling it - the password still works everywhere, and reviews skip the OU because everyone assumes its accounts are off. Accounts there that signed in recently are reported by AD-USER-DISABLED-OU-STILL-USED instead.
    fix: Disable the account (and remove its group memberships) as part of the leaver process; set ad.disabled-ou-pattern to the estate's own leavers OU names.
    refs: [NIST-800-53:AC-2(3), NIST-800-53:PS-4, CIS-CONTROLS-8:5.3]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - { field: distinguishedName, op: match, value: '(?i)OU=[^,]*(disable|leaver|terminat|former|departed|deprovision)', threshold: ad.disabled-ou-pattern }
        - any:
            - { field: lastLogonTimestamp, op: absent }
            - not: { field: lastLogonTimestamp, op: age-lt, value: 90, threshold: ad.stale-user-days }
    evidence: "{sAMAccountName} - enabled in {distinguishedName}, last domain logon '{lastLogonTimestamp}'"

  - id: AD-USER-DISABLED-OU-STILL-USED
    title: Account in a leavers or disabled-accounts OU is still signing in
    category: IAM
    severity: critical
    entity: user
    why: Someone authenticates with an account the organisation believes it removed - a leaver who kept access, a shared credential, or an attacker using an account nobody watches.
    fix: Disable the account now, find out who used it and from where, and review what it accessed since the move.
    refs: [NIST-800-53:AC-2(3), NIST-800-53:PS-4, MITRE-ATTACK:T1078.002]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - { field: distinguishedName, op: match, value: '(?i)OU=[^,]*(disable|leaver|terminat|former|departed|deprovision)', threshold: ad.disabled-ou-pattern }
        - { field: lastLogonTimestamp, op: age-lt, value: 90, threshold: ad.stale-user-days }
    evidence: "{sAMAccountName} - enabled in {distinguishedName}, last domain logon {lastLogonTimestamp}"

  - id: AD-USER-SERVICE-LOOKS-LIKE-PERSON
    title: Service account with a person's first and last name
    lens: both
    category: HYG
    severity: low
    entity: user
    why: An account with a service principal name, or named like a service account, that also carries givenName and sn is counted as a person by every headcount, licence and leaver process, and its owner is unclear.
    fix: Clear givenName and sn (or move the service to a group managed service account) and record the owner in managedBy or description; add the estate's own service-account prefixes to ad.service-account-pattern.
    refs: [NIST-800-53:AC-2, CIS-CONTROLS-8:5.5]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - { field: givenName, op: exists }
        - { field: sn, op: exists }
        - any:
            - { field: servicePrincipalName, op: notempty }
            - { field: sAMAccountName, op: match, value: '^(krbtgt|Guest|DefaultAccount|WDAGUtilityAccount|MSOL_[0-9a-f]+|AAD_[0-9a-f]+|Sync_.*|HealthMailbox.*|SM_[0-9a-f]+|.*\$)$', threshold: ad.service-account-pattern }
    evidence: "{sAMAccountName} - named {givenName} {sn}, SPN '{servicePrincipalName}'"

  - id: AD-USER-RESOURCE-MAILBOX-ENABLED
    title: Enabled user object behind a shared, room or equipment mailbox
    category: IAM
    severity: medium
    entity: user
    why: Shared, room and equipment mailboxes are opened through delegated permissions, not by signing in as the mailbox; an enabled account with a password behind one is a shared credential nobody owns.
    fix: Disable the user object. Accounts that must sign in themselves (for example meeting-room devices) go into the threshold list ad.enabled-resource-accounts with a documented owner.
    refs: [NIST-800-53:AC-2, NIST-800-53:IA-2]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - { field: msExchRecipientTypeDetails, op: in, value: [4, 16, 32, 8589934592, 17179869184, 34359738368] }
        - { field: sAMAccountName, op: notin, value: [], threshold: ad.enabled-resource-accounts }
    evidence: "{sAMAccountName} - enabled, msExchRecipientTypeDetails {msExchRecipientTypeDetails}, last domain logon '{lastLogonTimestamp}'"

  - id: AD-USER-DISABLED-RECENT-PASSWORD
    title: Disabled account whose password was set recently
    category: IAM
    severity: medium
    entity: user
    why: A fresh password on an account that has been disabled for a while means someone is preparing to reuse it, a reset reached the wrong account, or an attacker is staging it; each needs an explanation.
    fix: Find who reset the password and why; if the account is not being reinstated, set a random password and leave it disabled.
    refs: [NIST-800-53:AC-2(4), NIST-800-53:IA-5]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: flag, value: 2 }
        - { field: pwdLastSet, op: age-lt, value: 30, threshold: ad.disabled-password-reset-days }
        - { field: whenCreated, op: age-gt, value: 30, threshold: ad.disabled-password-reset-days }
    evidence: "{sAMAccountName} - disabled, password set {pwdLastSet}, created {whenCreated}"

  - id: AD-USER-PASSWORD-OLD
    title: Enabled user whose password has not changed for a long time
    lens: both
    category: IAM
    severity: medium
    entity: user
    why: A password that stays the same for years survives every leak, phishing campaign and staff change in that period. Smart-card-only accounts have no password the user knows and are reported by AD-USER-SMARTCARD-STATIC-HASH instead.
    fix: Ask the owner to change it, or expire it. For service accounts, move to a group managed service account.
    refs: [NIST-800-53:IA-5(1)]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - { field: userAccountControl, op: noflag, value: 262144 }
        - { field: pwdLastSet, op: ne, value: 0 }
        - { field: pwdLastSet, op: age-gt, value: 365, threshold: ad.user-password-max-age-days }
    evidence: "{sAMAccountName} - password last set {pwdLastSet}"

  - id: AD-USER-GUEST-ENABLED
    title: Built-in Guest account is enabled
    category: IAM
    severity: high
    entity: user
    why: The built-in Guest account (RID 501) gives unauthenticated-grade access a name and a session; it should never be usable in a domain.
    fix: Disable the Guest account and find what depended on it.
    refs: [NIST-800-53:AC-2, CIS-CONTROLS-8:4.7, MITRE-ATTACK:T1078.001]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - { field: objectSid, op: match, value: '-501$' }
    evidence: "{sAMAccountName} ({objectSid}) is enabled"

  # The rules below ride the same inventory. Lifecycle rules leave out what the partition above
  # already reports elsewhere: leavers OUs (AD-USER-ENABLED-IN-DISABLED-OU), resource mailbox
  # objects (AD-USER-RESOURCE-MAILBOX-ENABLED), expired accounts (AD-USER-EXPIRED-STILL-ENABLED)
  # and never-used accounts (AD-USER-NEVER-LOGGED-ON).

  - id: AD-USER-PASSWORD-CHANGE-PENDING
    title: Enabled account that has waited weeks on a forced password change
    category: IAM
    severity: medium
    entity: user
    why: pwdLastSet 0 means the next logon must set a new password, so the current one is usually a temporary value a helpdesk or script chose. Whoever knows it can sign in once, choose a new password and hold the account. When the owner has not logged on for weeks the temporary password stays valid that whole time. The reset date itself is not recorded; the age shown is that of the last logon.
    fix: Confirm the owner still needs the account. If so, hand over a fresh one-time password directly and have it changed now; otherwise disable the account.
    refs: [NIST-800-53:IA-5(1), CIS-Controls-v8:5.2]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - { field: pwdLastSet, op: eq, value: 0 }
        - { field: lastLogonTimestamp, op: exists }
        - { field: lastLogonTimestamp, op: age-gt, value: 30, threshold: ad.password-change-pending-days }
        - { field: objectSid, op: notmatch, value: '-501$' }
        - any:
            - { field: accountExpires, op: absent }
            - { field: accountExpires, op: eq, value: 0 }
            - not: { field: accountExpires, op: until-lt, value: 0 }
        - any:
            - { field: msExchRecipientTypeDetails, op: absent }
            - { field: msExchRecipientTypeDetails, op: notin, value: [4, 16, 32, 8589934592, 17179869184, 34359738368] }
        - { field: distinguishedName, op: notmatch, value: '(?i)OU=[^,]*(disable|leaver|terminat|former|departed|deprovision)', threshold: ad.disabled-ou-pattern }
    evidence: "{sAMAccountName} - must change password at next logon, last domain logon {lastLogonTimestamp}"

  - id: AD-USER-SMARTCARD-STATIC-HASH
    title: Smart-card-only account whose password hash has not changed for a year
    category: AUT
    severity: medium
    entity: user
    why: Requiring a smart card gives the account a random password nobody knows, but its NT hash still authenticates over NTLM and stays the same until the domain rolls it - which happens only when rolling of expiring NTLM secrets is on and the password reaches its maximum age. A hash taken from one compromised machine keeps working for as long as it does not change.
    fix: Turn on rolling of expiring NTLM secrets for smart-card-only accounts (domain functional level 2016 or higher) so the hash follows the password policy; to replace one hash now, clear and set the smart-card requirement again.
    refs: [MITRE-ATTACK:T1550.002, NIST-800-53:IA-5(1), PingCastle:A-SmartCardRequired]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - { field: userAccountControl, op: flag, value: 262144 }
        - { field: pwdLastSet, op: ne, value: 0 }
        - { field: pwdLastSet, op: age-gt, value: 365, threshold: ad.smartcard-hash-max-age-days }
    evidence: "{sAMAccountName} - smart card required, hash last changed {pwdLastSet}"

  - id: AD-USER-UPN-MISSING
    title: Enabled account without a user principal name
    lens: both
    category: HYG
    severity: low
    entity: user
    why: Cloud synchronisation, modern sign-in and many applications identify an account by its UPN; one without it syncs under a generated name or not at all and cannot sign in by UPN. Built-in accounts, accounts matching ad.service-account-pattern and accounts in leavers OUs are left out.
    fix: Set userPrincipalName to the routable sign-in name the person uses for cloud services.
    refs: [NIST-800-53:IA-4]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - { field: userPrincipalName, op: absent }
        - { field: objectSid, op: notmatch, value: '-50[0-3]$' }
        - { field: sAMAccountName, op: notmatch, value: '^(krbtgt|Guest|DefaultAccount|WDAGUtilityAccount|MSOL_[0-9a-f]+|AAD_[0-9a-f]+|Sync_.*|HealthMailbox.*|SM_[0-9a-f]+|.*\$)$', threshold: ad.service-account-pattern }
        - { field: distinguishedName, op: notmatch, value: '(?i)OU=[^,]*(disable|leaver|terminat|former|departed|deprovision)', threshold: ad.disabled-ou-pattern }
    evidence: "{sAMAccountName} - no userPrincipalName"

  - id: AD-USER-EXPIRED-STILL-ENABLED
    title: Enabled account that expired more than a month ago
    lens: both
    category: HYG
    severity: low
    entity: user
    why: An expired account cannot log on, but it keeps its groups, mailbox and licences, and the stale-account rules leave it out because it is expired - so the leaver steps never finish and extending the date restores every access at once. Accounts in leavers OUs and resource mailbox objects are reported by their own rules.
    fix: Disable the account, remove its memberships and licences, and delete it after the retention period - or extend the date if the contract was renewed.
    refs: [NIST-800-53:AC-2(3), CIS-Controls-v8:5.3]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - { field: accountExpires, op: ne, value: 0 }
        - { field: accountExpires, op: age-gt, value: 30, threshold: ad.expired-account-days }
        - any:
            - { field: msExchRecipientTypeDetails, op: absent }
            - { field: msExchRecipientTypeDetails, op: notin, value: [4, 16, 32, 8589934592, 17179869184, 34359738368] }
        - { field: distinguishedName, op: notmatch, value: '(?i)OU=[^,]*(disable|leaver|terminat|former|departed|deprovision)', threshold: ad.disabled-ou-pattern }
    evidence: "{sAMAccountName} - expired {accountExpires}, still enabled"

  - id: AD-USER-EXPIRES-SOON
    title: Enabled account that expires within two weeks
    kind: broken
    lens: maintenance
    category: LCM
    severity:
      daysLeft: accountExpires
      ranges: [ { max: 3, value: medium }, { max: 14, value: low } ]
      default: info
    deadline: accountExpires
    entity: user
    why: Contractor and temporary accounts stop working on their expiry date; a renewal nobody arranged becomes an outage for the person, or for the service quietly running under the account. Accounts in leavers OUs and resource mailbox objects are left out.
    fix: Ask the owner whether to extend; otherwise let it lapse and run the leaver steps on the day.
    refs: [NIST-800-53:AC-2(2)]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - { field: accountExpires, op: ne, value: 0 }
        - not: { field: accountExpires, op: until-lt, value: 0 }
        - { field: accountExpires, op: until-lt, value: 14, threshold: ad.account-expiry-notice-days }
        - any:
            - { field: msExchRecipientTypeDetails, op: absent }
            - { field: msExchRecipientTypeDetails, op: notin, value: [4, 16, 32, 8589934592, 17179869184, 34359738368] }
        - { field: distinguishedName, op: notmatch, value: '(?i)OU=[^,]*(disable|leaver|terminat|former|departed|deprovision)', threshold: ad.disabled-ou-pattern }
    evidence: "{sAMAccountName} - expires {accountExpires}"

  - id: AD-USER-DISABLED-WITH-GROUPS
    title: Disabled accounts that still hold group memberships
    lens: both
    category: IAM
    severity: low
    entity: user
    why: Disabling keeps every membership, so re-enabling an account restores all its access in one step, and each group's review counts people who left. Built-in accounts, RODC krbtgt accounts and resource mailbox objects (disabled by design and often in distribution lists) are not counted; administrative groups are reported per account by AD-USER-DISABLED-IN-ADMIN-GROUP.
    fix: Make "remove all memberships" part of the leaver step and strip memberships from the accounts listed.
    refs: [NIST-800-53:AC-2(3), CIS-Controls-v8:5.3]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    count:
      op: gt
      value: 0
      threshold: ad.disabled-users-with-groups-max
      where:
        all:
          - { field: userAccountControl, op: flag, value: 2 }
          - { field: memberOf, op: notempty }
          - { field: objectSid, op: notmatch, value: '-50[1-3]$' }
          - { field: sAMAccountName, op: notmatch, value: '^krbtgt' }
          - any:
              - { field: msExchRecipientTypeDetails, op: absent }
              - { field: msExchRecipientTypeDetails, op: notin, value: [4, 16, 32, 8589934592, 17179869184, 34359738368] }
    evidence: "{count} disabled accounts still hold group memberships, for example {sample}"

  - id: AD-USER-DISABLED-LONG
    title: Disabled accounts untouched for more than a year
    lens: maintenance
    category: LCM
    severity: low
    entity: user
    why: An account disabled and left alone for over a year is past any normal retention period, yet it is still counted, still holds its memberships and can still be re-enabled. Built-in accounts, RODC krbtgt accounts and resource mailbox objects are not counted.
    fix: Delete the accounts once the retention period has passed (with the Recycle Bin on they stay restorable for the deleted-object lifetime).
    refs: [NIST-800-53:AC-2(3), CIS-Controls-v8:5.3]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    count:
      op: gt
      value: 0
      threshold: ad.disabled-users-retained-max
      where:
        all:
          - { field: userAccountControl, op: flag, value: 2 }
          - { field: whenChanged, op: age-gt, value: 365, threshold: ad.disabled-user-retention-days }
          - { field: objectSid, op: notmatch, value: '-50[1-3]$' }
          - { field: sAMAccountName, op: notmatch, value: '^krbtgt' }
          - any:
              - { field: msExchRecipientTypeDetails, op: absent }
              - { field: msExchRecipientTypeDetails, op: notin, value: [4, 16, 32, 8589934592, 17179869184, 34359738368] }
    evidence: "{count} disabled accounts unchanged for over a year, for example {sample}"

  - id: AD-USER-DEFAULT-CONTAINER
    title: Enabled user accounts in the default Users container
    lens: maintenance
    category: CFG
    severity: low
    entity: user
    why: CN=Users is a container, not an OU, so no GPO can be linked to it and OU-based delegation does not reach it; accounts there miss the baselines their peers get. The built-in Administrator and accounts matching ad.service-account-pattern are not counted.
    fix: Move the accounts to their OUs and redirect new user objects there (AD-DOM-USERS-CONTAINER-NOT-REDIRECTED).
    refs: [NIST-800-53:CM-6]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    count:
      op: gt
      value: 0
      threshold: ad.default-container-users-max
      where:
        all:
          - { field: userAccountControl, op: noflag, value: 2 }
          - { field: distinguishedName, op: match, value: '^CN=(?:\\.|[^,\\])+,CN=Users,DC=' }
          - { field: objectSid, op: notmatch, value: '-500$' }
          - { field: sAMAccountName, op: notmatch, value: '^(krbtgt|Guest|DefaultAccount|WDAGUtilityAccount|MSOL_[0-9a-f]+|AAD_[0-9a-f]+|Sync_.*|HealthMailbox.*|SM_[0-9a-f]+|.*\$)$', threshold: ad.service-account-pattern }
    evidence: "{count} enabled users directly in CN=Users, for example {sample}"

  - id: AD-USER-LOCKOUT-WAVE
    title: Many accounts locked out within a day
    kind: broken
    category: MON
    severity: medium
    entity: user
    why: A burst of lockouts across many accounts is what password spraying leaves behind, or a service with an old stored credential hammering the domain controllers. Either needs a look the same day.
    fix: Read the lockout events (4740) on the PDC emulator for the caller computer; block the source if it is hostile, or fix the stored credential if it is a service.
    refs: [MITRE-ATTACK:T1110.003, NIST-800-53:AC-7, NIST-800-53:SI-4]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(lockoutTime>={FT:7}))'
      attributes: [sAMAccountName, displayName, lockoutTime]
      key: sAMAccountName
      name: displayName
    count:
      op: gt
      value: 10
      threshold: ad.lockouts-per-day-max
      where: { field: lockoutTime, op: age-lt, value: 1, threshold: ad.lockout-window-days }
    evidence: "{count} enabled accounts locked out in the window, for example {sample}"

  - id: AD-USER-LOGON-SCRIPT
    title: Enabled users still assigned a logon script
    lens: both
    category: CFG
    severity: low
    entity: user
    why: Logon scripts named in scriptPath run at every sign-in with the user's rights; they are a common, unreviewed way to change local group membership or map shares on servers that no longer exist, and their content is not visible over LDAP.
    fix: Review the scripts in NETLOGON, move what is still needed to Group Policy preferences, and clear scriptPath.
    refs: [NIST-800-53:CM-7]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(scriptPath=*))'
      attributes: [sAMAccountName, scriptPath]
      key: sAMAccountName
    count: { op: gt, value: 0, threshold: ad.logon-script-users-max }
    evidence: "{count} enabled users run a logon script, for example {sample}"

  - id: AD-USER-PASSWORD-NEVER-EXPIRES
    title: Enabled user whose password never expires
    category: IAM
    severity: medium
    entity: user
    why: The flag exempts the account from the password policy, so a leaked password stays valid indefinitely.
    fix: Clear "password never expires". Move service accounts to group managed service accounts, which rotate their own passwords.
    refs: [NIST-800-53:IA-5(1), PINGCASTLE:S-PwdNeverExpires]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}{UAC:65536})'
      attributes: [sAMAccountName, displayName, pwdLastSet]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - password never expires, last set {pwdLastSet}"

  - id: AD-USER-PASSWORD-NOT-REQUIRED
    title: Enabled user allowed to have an empty password
    category: IAM
    severity: high
    entity: user
    why: PASSWD_NOTREQD lets the account be given an empty password regardless of policy, so it may already have none.
    fix: Clear the flag and set a strong password on the account.
    refs: [NIST-800-53:IA-5, PINGCASTLE:S-PwdNotRequired]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}{UAC:32})'
      attributes: [sAMAccountName, displayName, pwdLastSet]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - PASSWD_NOTREQD set"

  - id: AD-USER-REVERSIBLE-ENCRYPTION
    title: Enabled user whose password is stored with reversible encryption
    category: IAM
    severity: critical
    entity: user
    why: The password is kept in a form that can be decrypted, so anyone who reads the directory database or a backup gets it in clear text.
    fix: Clear "store password using reversible encryption" and reset the password so the reversible copy is discarded.
    refs: [NIST-800-53:IA-5(1), PINGCASTLE:S-Reversible]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}{UAC:128})'
      attributes: [sAMAccountName, displayName, pwdLastSet]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - reversible encryption allowed"

  - id: AD-USER-DES-ONLY
    title: Enabled user limited to DES Kerberos keys
    category: AUT
    severity: high
    entity: user
    why: DES is broken and disabled on current Windows; an account restricted to it either fails to authenticate or forces the weakest tickets.
    fix: Clear USE_DES_KEY_ONLY, enable AES on the account and reset its password so AES keys exist.
    refs: [NIST-800-53:SC-13, PINGCASTLE:S-DesEnabled]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}{UAC:2097152})'
      attributes: [sAMAccountName, displayName]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - USE_DES_KEY_ONLY set"

  - id: AD-USER-ASREP-ROASTABLE
    title: Enabled user without Kerberos pre-authentication (AS-REP roastable)
    category: AUT
    severity: critical
    entity: user
    why: Without pre-authentication anyone on the network can ask the domain controller for data encrypted with the account's key and crack the password offline.
    fix: Clear "do not require Kerberos preauthentication"; fix or replace whatever application needed it.
    refs: [MITRE-ATTACK:T1558.004, NIST-800-53:IA-2, PINGCASTLE:S-NoPreAuth]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}{UAC:4194304})'
      attributes: [sAMAccountName, displayName]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - DONT_REQ_PREAUTH set"

  - id: AD-USER-KERBEROASTABLE
    title: Enabled user account with a service principal name (Kerberoastable)
    category: AUT
    severity: high
    entity: user
    why: Any domain user can request a service ticket for an account with an SPN and try to crack its password offline; human-set service passwords are the usual target.
    fix: Move the service to a group managed service account; otherwise give the account a long random password and AES-only encryption.
    refs: [MITRE-ATTACK:T1558.003, PINGCASTLE:P-Kerberoasting]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(servicePrincipalName=*)(!(sAMAccountName=krbtgt)))'
      attributes: [sAMAccountName, displayName, pwdLastSet, msDS-SupportedEncryptionTypes, servicePrincipalName]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - SPN {servicePrincipalName}"

  - id: AD-USER-KERBEROASTABLE-OLD-PASSWORD
    title: Kerberoastable account whose password is old
    category: AUT
    severity: critical
    entity: user
    why: The older a service account password, the more likely it was set by hand, is short, and has already been captured; old ones are the first to crack.
    fix: Rotate the password now with a long random value, then move the service to a group managed service account.
    refs: [MITRE-ATTACK:T1558.003, NIST-800-53:IA-5(1), PINGCASTLE:P-Kerberoasting]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(servicePrincipalName=*)(!(sAMAccountName=krbtgt)))'
      attributes: [sAMAccountName, displayName, pwdLastSet, msDS-SupportedEncryptionTypes, servicePrincipalName]
      key: sAMAccountName
      name: displayName
    each: { field: pwdLastSet, op: age-gt, value: 365, threshold: ad.service-password-max-age-days }
    evidence: "{sAMAccountName} - SPN account, password last set {pwdLastSet}"

  - id: AD-USER-KERBEROASTABLE-RC4
    title: Kerberoastable account that still accepts RC4 tickets
    category: AUT
    severity: medium
    entity: user
    why: When RC4 is allowed (or the encryption types are unset, which falls back to RC4) an attacker can request an RC4 ticket, which cracks far faster than AES.
    fix: Set msDS-SupportedEncryptionTypes to AES only (24) and reset the password so AES keys exist; check the service still works.
    refs: [MITRE-ATTACK:T1558.003, NIST-800-53:SC-13, MS-KB:5021131]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(servicePrincipalName=*)(!(sAMAccountName=krbtgt)))'
      attributes: [sAMAccountName, displayName, pwdLastSet, msDS-SupportedEncryptionTypes, servicePrincipalName]
      key: sAMAccountName
      name: displayName
    each:
      any:
        - { field: msDS-SupportedEncryptionTypes, op: absent }
        - { field: msDS-SupportedEncryptionTypes, op: eq, value: 0 }
        - { field: msDS-SupportedEncryptionTypes, op: flag, value: 4 }
    evidence: "{sAMAccountName} - msDS-SupportedEncryptionTypes '{msDS-SupportedEncryptionTypes}' (empty means the RC4 default)"

  - id: AD-USER-UNCONSTRAINED-DELEGATION
    title: User account trusted for unconstrained delegation
    category: AUT
    severity: critical
    entity: user
    why: Every user who authenticates to a service running as this account hands it a reusable ticket, so whoever controls the account can impersonate them anywhere.
    fix: Remove TRUSTED_FOR_DELEGATION; use constrained or resource-based delegation to named services instead.
    refs: [MITRE-ATTACK:T1558, NIST-800-53:AC-6, PINGCASTLE:P-UnconstrainedDelegation]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}{UAC:524288})'
      attributes: [sAMAccountName, displayName]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - TRUSTED_FOR_DELEGATION set"

  - id: AD-USER-PROTOCOL-TRANSITION
    title: User account allowed to delegate with protocol transition
    category: AUT
    severity: high
    entity: user
    why: TRUSTED_TO_AUTH_FOR_DELEGATION lets the account obtain tickets as any user to its delegation targets without that user ever authenticating.
    fix: Remove protocol transition unless the design needs it, and keep the target list as small as possible.
    refs: [MITRE-ATTACK:T1558, NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}{UAC:16777216})'
      attributes: [sAMAccountName, displayName, msDS-AllowedToDelegateTo]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - protocol transition to {msDS-AllowedToDelegateTo}"

  - id: AD-USER-DELEGATION-SENSITIVE-SPN
    title: User account delegates to a directory or Kerberos service
    category: AUT
    severity: high
    entity: user
    why: Delegation to ldap, gc or krbtgt services lets the account act as any user against the directory itself, which on a domain controller amounts to domain control.
    fix: Remove ldap/, gc/ and krbtgt/ targets from msDS-AllowedToDelegateTo unless a documented design needs them.
    refs: [MITRE-ATTACK:T1558, NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(msDS-AllowedToDelegateTo=*))'
      attributes: [sAMAccountName, displayName, msDS-AllowedToDelegateTo]
      key: sAMAccountName
      name: displayName
    each: { field: msDS-AllowedToDelegateTo, op: match, value: '^(ldap|gc|krbtgt)/' }
    evidence: "{sAMAccountName} - delegates to {msDS-AllowedToDelegateTo}"

  - id: AD-USER-RBCD
    title: User account carries resource-based delegation rights
    category: AUT
    severity: high
    entity: user
    why: Resource-based delegation on a user object (krbtgt above all) is unusual and is a known persistence and escalation artefact.
    fix: Review who is listed in msDS-AllowedToActOnBehalfOfOtherIdentity and clear it unless a design needs it.
    refs: [MITRE-ATTACK:T1558, NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&{USER}(msDS-AllowedToActOnBehalfOfOtherIdentity=*))'
      attributes: [sAMAccountName, displayName]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - msDS-AllowedToActOnBehalfOfOtherIdentity is set"

  - id: AD-USER-SIDHISTORY
    title: Enabled user carries SID history
    category: IAM
    severity: medium
    entity: user
    why: SID history grants the rights of another identity silently; group reviews do not show it.
    fix: Clear sIDHistory once a migration is finished and resources are re-permissioned.
    refs: [MITRE-ATTACK:T1134.005, PINGCASTLE:S-SIDHistory]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(sIDHistory=*))'
      attributes: [sAMAccountName, displayName, sIDHistory]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - sIDHistory {sIDHistory}"

  - id: AD-USER-SIDHISTORY-PRIVILEGED
    title: SID history holds a privileged group or account SID
    category: IAM
    severity: critical
    entity: user
    why: A privileged well-known SID in sIDHistory makes the account an administrator without any group membership - a classic persistence technique.
    fix: Treat as an incident; clear sIDHistory and find out how it was written.
    refs: [MITRE-ATTACK:T1134.005, NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(sIDHistory=*))'
      attributes: [sAMAccountName, displayName, sIDHistory]
      key: sAMAccountName
      name: displayName
    each: { field: sIDHistory, op: match, value: '-(498|500|512|516|518|519|520|521)$|^S-1-5-32-5(44|48|49|50|51)$' }
    evidence: "{sAMAccountName} - sIDHistory {sIDHistory}"

  - id: AD-USER-PRIMARY-GROUP
    title: Enabled user with a non-default primary group
    lens: both
    category: IAM
    severity: low
    entity: user
    why: Primary group membership is not listed in the group's member attribute, so it hides from most membership reviews.
    fix: Set the primary group back to Domain Users (RID 513) and grant the group by normal membership.
    refs: [PINGCASTLE:S-PrimaryGroup]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(!{UAC:2048})(!(primaryGroupID=513)))'
      attributes: [sAMAccountName, displayName, primaryGroupID]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - primaryGroupID {primaryGroupID}"

  - id: AD-USER-CLEARTEXT-PASSWORD-ATTRIBUTE
    title: User carries a legacy password attribute
    category: IAM
    severity: high
    entity: user
    why: userPassword, unixUserPassword and similar legacy attributes often hold a password in clear or weakly hashed form that ordinary users can read.
    fix: Clear the attribute, reset the account password, and find the tool that wrote it.
    refs: [NIST-800-53:IA-5(1)]
    query:
      protocol: ldap
      filter: '(&{USER}(|(userPassword=*){IFATTR:unixUserPassword|(unixUserPassword=*)}{IFATTR:msSFU30Password|(msSFU30Password=*)}{IFATTR:orclCommonAttribute|(orclCommonAttribute=*)}))'
      attributes: [sAMAccountName, displayName]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - a legacy password attribute is populated (value not read)"

  - id: AD-USER-NO-AES
    title: User with Kerberos encryption types that exclude AES
    category: AUT
    severity: medium
    entity: user
    why: An explicit encryption-type value without AES pins the account to RC4 or DES, both weak and being removed from Windows.
    fix: Add AES128 and AES256 to msDS-SupportedEncryptionTypes (or set 24) and reset the password.
    refs: [NIST-800-53:SC-13, MS-KB:5021131]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(msDS-SupportedEncryptionTypes=*))'
      attributes: [sAMAccountName, displayName, msDS-SupportedEncryptionTypes]
      key: sAMAccountName
      name: displayName
    each:
      all:
        - { field: msDS-SupportedEncryptionTypes, op: gt, value: 0 }
        - { field: msDS-SupportedEncryptionTypes, op: noflag, value: 8 }
        - { field: msDS-SupportedEncryptionTypes, op: noflag, value: 16 }
    evidence: "{sAMAccountName} - msDS-SupportedEncryptionTypes {msDS-SupportedEncryptionTypes}"

  - id: AD-USER-DISABLED-IN-ADMIN-GROUP
    title: Disabled account still a member of an administrative group
    lens: both
    category: IAM
    severity: medium
    entity: user
    why: Membership survives the disable; re-enabling the account restores full administrative rights in one step, and nobody reviews disabled objects.
    fix: Remove disabled accounts from Administrators, Domain Admins, Enterprise Admins and Schema Admins.
    refs: [NIST-800-53:AC-2, NIST-800-53:AC-6(7)]
    query:
      protocol: ldap
      filter: '(&{USER}{UAC:2}(|(memberOf:1.2.840.113556.1.4.1941:=CN=Administrators,CN=Builtin,{DOMAINDN})(memberOf:1.2.840.113556.1.4.1941:=CN=Domain Admins,CN=Users,{DOMAINDN})(memberOf:1.2.840.113556.1.4.1941:=CN=Enterprise Admins,CN=Users,{ROOTDN})(memberOf:1.2.840.113556.1.4.1941:=CN=Schema Admins,CN=Users,{ROOTDN})))'
      attributes: [sAMAccountName, displayName, memberOf]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - disabled, member of {memberOf}"

  # ---------------------------------------------------------------- privileged accounts (adminCount=1)

  - id: AD-PRIV-COUNT
    title: Too many enabled privileged accounts
    category: IAM
    severity: medium
    entity: user
    why: adminCount=1 marks accounts that are, or were, in a protected group; every one of them is a path to the domain, so the number should be small and known.
    fix: Review the list, remove standing membership that is not needed, and clean up orphaned adminCount marks.
    refs: [NIST-800-53:AC-6(5), CIS-CONTROLS-8:5.4]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(adminCount=1))'
      attributes: [sAMAccountName, displayName, objectSid, userAccountControl, pwdLastSet, lastLogonTimestamp, servicePrincipalName, mail]
      key: sAMAccountName
      name: displayName
    count: { op: gt, value: 20, threshold: ad.privileged-accounts-max }
    evidence: "{count} enabled accounts with adminCount=1: {sample}"

  - id: AD-PRIV-NOT-PROTECTED-USERS
    title: Privileged account outside the Protected Users group
    category: IAM
    severity: high
    entity: user
    why: Protected Users stops NTLM, DES/RC4, delegation and long-lived cached credentials for its members - the cheapest control against credential theft for administrators.
    fix: Add human administrator accounts to Protected Users after checking they do not rely on NTLM or delegation. Service accounts are excluded from this rule.
    refs: [NIST-800-53:IA-2, PINGCASTLE:P-ProtectedUsers]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(adminCount=1)(!(servicePrincipalName=*))(!(memberOf:1.2.840.113556.1.4.1941:=CN=Protected Users,CN=Users,{DOMAINDN})))'
      attributes: [sAMAccountName, displayName]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - privileged, not in Protected Users"

  - id: AD-PRIV-DELEGABLE
    title: Privileged account that can be delegated
    category: IAM
    severity: high
    entity: user
    why: Without "account is sensitive and cannot be delegated" a compromised delegating service can impersonate the administrator to any other service.
    fix: Set NOT_DELEGATED ("account is sensitive and cannot be delegated") on every privileged account.
    refs: [MITRE-ATTACK:T1558, PINGCASTLE:P-Delegated]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(adminCount=1))'
      attributes: [sAMAccountName, displayName, objectSid, userAccountControl, pwdLastSet, lastLogonTimestamp, servicePrincipalName, mail]
      key: sAMAccountName
      name: displayName
    each: { field: userAccountControl, op: noflag, value: 1048576 }
    evidence: "{sAMAccountName} - userAccountControl {userAccountControl} lacks NOT_DELEGATED"

  - id: AD-PRIV-PASSWORD-NEVER-EXPIRES
    title: Privileged account whose password never expires
    category: IAM
    severity: high
    entity: user
    why: An administrator password exempt from the policy stays valid after any leak and after the person leaves.
    fix: Clear "password never expires" and rotate the password; vault break-glass accounts and rotate them on a schedule.
    refs: [NIST-800-53:IA-5(1)]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(adminCount=1))'
      attributes: [sAMAccountName, displayName, objectSid, userAccountControl, pwdLastSet, lastLogonTimestamp, servicePrincipalName, mail]
      key: sAMAccountName
      name: displayName
    each: { field: userAccountControl, op: flag, value: 65536 }
    evidence: "{sAMAccountName} - password never expires, last set {pwdLastSet}"

  - id: AD-PRIV-STALE
    title: Privileged account not used recently
    lens: both
    category: IAM
    severity: high
    entity: user
    why: Standing administrative rights on an account nobody uses are risk with no benefit; such accounts are rarely noticed when an attacker starts using them.
    fix: Remove the account from privileged groups or disable it; keep break-glass accounts documented and monitored.
    refs: [NIST-800-53:AC-2(3), CIS-CONTROLS-8:5.3, PINGCASTLE:P-Inactive]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(adminCount=1))'
      attributes: [sAMAccountName, displayName, objectSid, userAccountControl, pwdLastSet, lastLogonTimestamp, servicePrincipalName, mail]
      key: sAMAccountName
      name: displayName
    each:
      any:
        - { field: lastLogonTimestamp, op: age-gt, value: 90, threshold: ad.stale-privileged-days }
        - { field: lastLogonTimestamp, op: absent }
    evidence: "{sAMAccountName} - last logon '{lastLogonTimestamp}'"

  - id: AD-PRIV-PASSWORD-OLD
    title: Privileged account whose password is old
    category: IAM
    severity: high
    entity: user
    why: An old administrator password has outlived every leak, every departure and every incident since it was set.
    fix: Rotate the password; for shared or break-glass accounts, rotate on a schedule from a vault.
    refs: [NIST-800-53:IA-5(1)]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(adminCount=1))'
      attributes: [sAMAccountName, displayName, objectSid, userAccountControl, pwdLastSet, lastLogonTimestamp, servicePrincipalName, mail]
      key: sAMAccountName
      name: displayName
    each:
      all:
        - { field: pwdLastSet, op: ne, value: 0 }
        - { field: pwdLastSet, op: age-gt, value: 365, threshold: ad.privileged-password-max-age-days }
    evidence: "{sAMAccountName} - password last set {pwdLastSet}"

  - id: AD-PRIV-SPN
    title: Privileged account with a service principal name
    category: AUT
    severity: critical
    entity: user
    why: Any domain user can request a ticket for this account and crack it offline; if it cracks, the attacker holds administrative rights.
    fix: Take the service out of privileged groups (grant only the rights it needs) or move it to a group managed service account.
    refs: [MITRE-ATTACK:T1558.003, NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(adminCount=1))'
      attributes: [sAMAccountName, displayName, objectSid, userAccountControl, pwdLastSet, lastLogonTimestamp, servicePrincipalName, mail]
      key: sAMAccountName
      name: displayName
    each: { field: servicePrincipalName, op: notempty }
    evidence: "{sAMAccountName} - privileged with SPN {servicePrincipalName}"

  - id: AD-PRIV-MAIL
    title: Privileged account has a mail address
    category: IAM
    severity: low
    entity: user
    why: An administrator account that receives mail can be phished directly; administrative and daily-use identities should be separate.
    fix: Use a separate, mail-less account for administration and keep mail on the daily account.
    refs: [NIST-800-53:AC-6(2), CIS-CONTROLS-8:5.4]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(adminCount=1))'
      attributes: [sAMAccountName, displayName, objectSid, userAccountControl, pwdLastSet, lastLogonTimestamp, servicePrincipalName, mail]
      key: sAMAccountName
      name: displayName
    each: { field: mail, op: exists }
    evidence: "{sAMAccountName} - mail {mail}"

  - id: AD-PRIV-ORPHAN-ADMINCOUNT
    title: Account marked adminCount=1 but no longer in a protected group
    lens: both
    category: IAM
    severity: low
    entity: user
    why: The mark is left behind when an account leaves a protected group; inheritance stays blocked, so delegated permissions do not apply and the old administrative ACL lingers.
    fix: Clear adminCount and re-enable permission inheritance on the object.
    refs: [NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&{USER}(adminCount=1)(!(sAMAccountName=krbtgt*))(!(memberOf:1.2.840.113556.1.4.1941:=CN=Administrators,CN=Builtin,{DOMAINDN}))(!(memberOf:1.2.840.113556.1.4.1941:=CN=Domain Admins,CN=Users,{DOMAINDN}))(!(memberOf:1.2.840.113556.1.4.1941:=CN=Enterprise Admins,CN=Users,{ROOTDN}))(!(memberOf:1.2.840.113556.1.4.1941:=CN=Schema Admins,CN=Users,{ROOTDN}))(!(memberOf:1.2.840.113556.1.4.1941:=CN=Account Operators,CN=Builtin,{DOMAINDN}))(!(memberOf:1.2.840.113556.1.4.1941:=CN=Server Operators,CN=Builtin,{DOMAINDN}))(!(memberOf:1.2.840.113556.1.4.1941:=CN=Print Operators,CN=Builtin,{DOMAINDN}))(!(memberOf:1.2.840.113556.1.4.1941:=CN=Backup Operators,CN=Builtin,{DOMAINDN}))(!(memberOf:1.2.840.113556.1.4.1941:=CN=Replicator,CN=Builtin,{DOMAINDN}))(!(memberOf:1.2.840.113556.1.4.1941:=CN=Key Admins,CN=Users,{DOMAINDN}))(!(memberOf:1.2.840.113556.1.4.1941:=CN=Enterprise Key Admins,CN=Users,{ROOTDN})))'
      attributes: [sAMAccountName, displayName, userAccountControl]
      key: sAMAccountName
      name: displayName
    each: any
    evidence: "{sAMAccountName} - adminCount=1 without protected-group membership"

  - id: AD-PRIV-BUILTIN-ADMIN-IN-USE
    title: Built-in Administrator account used recently
    category: IAM
    severity: medium
    entity: user
    why: The RID-500 account cannot be locked out and is shared by nature; regular use means work that cannot be attributed to a person.
    fix: Use personal administrator accounts; keep RID 500 as a vaulted break-glass account with a long password and alert on its use.
    refs: [NIST-800-53:AC-2, CIS-CONTROLS-8:5.4]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(adminCount=1))'
      attributes: [sAMAccountName, displayName, objectSid, userAccountControl, pwdLastSet, lastLogonTimestamp, servicePrincipalName, mail]
      key: sAMAccountName
      name: displayName
    each:
      all:
        - { field: objectSid, op: match, value: '-500$' }
        - { field: lastLogonTimestamp, op: age-lt, value: 30, threshold: ad.builtin-admin-quiet-days }
    evidence: "{sAMAccountName} (RID 500) - last logon {lastLogonTimestamp}"

  - id: AD-PRIV-RECENTLY-CREATED
    title: Privileged account created in the last month
    category: MON
    severity: medium
    entity: user
    why: adminCount=1 on an account created this month means a new administrator - or an account an attacker created and placed in a protected group. Either one should match an approved request.
    fix: Match the account to an approved request with a named owner; if there is none, disable it, take it out of the protected groups and find who created it (account-creation and group-change events on the domain controllers).
    refs: [NIST-800-53:AC-2(4), NIST-800-53:AC-6(5), MITRE-ATTACK:T1136.002, CIS-Controls-v8:5.1]
    query:
      protocol: ldap
      filter: '(&{USER}(!{UAC:2048}))'
      attributes: [sAMAccountName, userPrincipalName, objectSid, userAccountControl, lastLogonTimestamp, pwdLastSet, whenCreated, accountExpires, msExchRecipientTypeDetails, servicePrincipalName, givenName, sn, adminCount, memberOf, whenChanged]
      key: sAMAccountName
      name: userPrincipalName
    each:
      all:
        - { field: adminCount, op: eq, value: 1 }
        - { field: whenCreated, op: age-lt, value: 30, threshold: ad.new-privileged-days }
    evidence: "{sAMAccountName} - adminCount=1, created {whenCreated}, member of {memberOf}"

  - id: AD-ADMINSDHOLDER-RECENTLY-CHANGED
    title: AdminSDHolder was modified recently
    category: MON
    severity: high
    entity: domain
    why: The permissions on CN=AdminSDHolder are copied every hour onto every protected account and group, so one added entry there is a lasting backdoor on all administrators that survives their own permission resets. The copy process writes the protected objects, not AdminSDHolder itself, so a recent change date means someone edited it - a schema or product upgrade, or an intruder.
    fix: Compare the object's permissions with the documented default and remove any entry nobody can account for; the directory-service change events on the domain controllers name the writer. Record legitimate upgrades as accepted.
    refs: [NIST-800-53:AC-6, NIST-800-53:AU-12, MITRE-ATTACK:T1098]
    query:
      protocol: ldap
      base: 'CN=AdminSDHolder,CN=System,{DOMAINDN}'
      scope: base
      filter: '(objectClass=container)'
      attributes: [cn, whenChanged, whenCreated]
      key: distinguishedName
    each: { field: whenChanged, op: age-lt, value: 30, threshold: ad.adminsdholder-change-days }
    evidence: "AdminSDHolder changed {whenChanged}"

  # ---------------------------------------------------------------- groups

  - id: AD-GROUP-DOMAIN-ADMINS-SIZE
    title: Domain Admins has more enabled members than expected
    category: IAM
    severity: high
    entity: group
    why: Every Domain Admin is full control of the domain behind one password; the group should hold a handful of named, monitored accounts.
    fix: Remove members who do not need standing domain-wide rights and delegate narrower permissions instead. Nested members are counted.
    refs: [NIST-800-53:AC-6(5), CIS-CONTROLS-8:5.4]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(memberOf:1.2.840.113556.1.4.1941:=CN=Domain Admins,CN=Users,{DOMAINDN}))'
      attributes: [sAMAccountName, displayName]
      key: sAMAccountName
      name: displayName
    count: { op: gt, value: 5, threshold: ad.domain-admins-max }
    evidence: "{count} enabled members (nested included): {sample}"

  - id: AD-GROUP-ENTERPRISE-ADMINS-SIZE
    title: Enterprise Admins has standing members
    category: IAM
    severity: high
    entity: group
    why: Enterprise Admins controls every domain in the forest and is needed only for forest-level changes.
    fix: Keep at most a break-glass account in the group and add others just in time. Nested members are counted.
    refs: [NIST-800-53:AC-6(5), CIS-CONTROLS-8:5.4]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(memberOf:1.2.840.113556.1.4.1941:=CN=Enterprise Admins,CN=Users,{ROOTDN}))'
      attributes: [sAMAccountName, displayName]
      key: sAMAccountName
      name: displayName
    count: { op: gt, value: 1, threshold: ad.enterprise-admins-max }
    evidence: "{count} enabled members (nested included): {sample}"

  - id: AD-GROUP-SCHEMA-ADMINS-SIZE
    title: Schema Admins is not empty
    category: IAM
    severity: medium
    entity: group
    why: Schema Admins can change the forest schema irreversibly; membership is needed only during a planned schema update.
    fix: Empty the group, including the built-in Administrator, and add a member only for the duration of a schema change.
    refs: [NIST-800-53:AC-6(5), PINGCASTLE:P-SchemaAdmin]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(memberOf:1.2.840.113556.1.4.1941:=CN=Schema Admins,CN=Users,{ROOTDN}))'
      attributes: [sAMAccountName, displayName]
      key: sAMAccountName
      name: displayName
    count: { op: gt, value: 0, threshold: ad.schema-admins-max }
    evidence: "{count} enabled members (nested included): {sample}"

  - id: AD-GROUP-ADMINISTRATORS-DIRECT-MEMBERS
    title: Builtin Administrators has direct members beyond the defaults
    category: IAM
    severity: high
    entity: group
    why: Direct members of the domain's Administrators group are administrators on every domain controller and bypass reviews that look only at Domain Admins.
    fix: Keep only Domain Admins, Enterprise Admins and the built-in Administrator as direct members; grant other needs through narrower delegation.
    refs: [NIST-800-53:AC-6(5), CIS-CONTROLS-8:5.4]
    query:
      protocol: ldap
      filter: '(objectSid=S-1-5-32-544)'
      attributes: [cn, member]
      key: cn
    each: { field: member, op: notmatch, value: '^CN=(Domain Admins|Enterprise Admins|Administrator),CN=Users,DC=' }
    evidence: "{cn} direct members - {member}"

  - id: AD-GROUP-DNSADMINS-SIZE
    title: DnsAdmins has enabled members
    category: IAM
    severity: medium
    entity: group
    why: DnsAdmins members can make the DNS service on a domain controller load a DLL of their choice as SYSTEM, so the group is administrative in practice.
    fix: Empty the group or limit it to tier-0 administrators; delegate DNS record management through zone permissions instead.
    refs: [NIST-800-53:AC-6(5), MITRE-ATTACK:T1574.002]
    query:
      protocol: ldap
      filter: '(&{USER}{ENABLED}(memberOf:1.2.840.113556.1.4.1941:=CN=DnsAdmins,CN=Users,{DOMAINDN}))'
      attributes: [sAMAccountName, displayName]
      key: sAMAccountName
      name: displayName
    count: { op: gt, value: 0, threshold: ad.dnsadmins-max }
    evidence: "{count} enabled members (nested included): {sample}"

  - id: AD-GROUP-OPERATORS-NOT-EMPTY
    title: Built-in operator group has members
    category: IAM
    severity: high
    entity: group
    why: Account, Server, Print and Backup Operators can each reach domain-controller level control (backup rights read the directory database, server operators run code on DCs); they should be empty.
    fix: Remove the members and delegate the specific tasks they performed through OU-level permissions.
    refs: [NIST-800-53:AC-6(5), CIS-CONTROLS-8:5.4]
    query:
      protocol: ldap
      filter: '(|(objectSid=S-1-5-32-548)(objectSid=S-1-5-32-549)(objectSid=S-1-5-32-550)(objectSid=S-1-5-32-551))'
      attributes: [cn, member]
      key: cn
    each: { field: member, op: notempty }
    evidence: "{cn} members - {member}"

  - id: AD-GROUP-PRE2000-ANONYMOUS
    title: Pre-Windows 2000 Compatible Access contains Everyone or Anonymous
    category: IAM
    severity: high
    entity: group
    why: These members let unauthenticated callers read user and group data across the domain - the first step of most reconnaissance.
    fix: Remove Everyone and Anonymous Logon from the group after checking no legacy system still needs anonymous reads.
    refs: [NIST-800-53:AC-14, MITRE-ATTACK:T1087.002]
    query:
      protocol: ldap
      filter: '(objectSid=S-1-5-32-554)'
      attributes: [cn, member]
      key: cn
    each: { field: member, op: match, value: '^CN=(S-1-1-0|S-1-5-7),CN=ForeignSecurityPrincipals,' }
    evidence: "{cn} members - {member}"

  - id: AD-GROUP-PRE2000-AUTHENTICATED-USERS
    title: Pre-Windows 2000 Compatible Access contains Authenticated Users
    category: IAM
    severity: medium
    entity: group
    why: The membership gives every authenticated principal, computers included, broad read access to user and group attributes that newer permissions would otherwise restrict.
    fix: Remove Authenticated Users once no legacy application depends on it; test on a pilot first.
    refs: [NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(objectSid=S-1-5-32-554)'
      attributes: [cn, member]
      key: cn
    each: { field: member, op: match, value: '^CN=S-1-5-11,CN=ForeignSecurityPrincipals,' }
    evidence: "{cn} members - {member}"

  - id: AD-GROUP-BUILTIN-BROAD-MEMBER
    title: Builtin group grants rights to a broad principal
    category: IAM
    severity: high
    entity: group
    why: Everyone, Authenticated Users, Domain Users or Domain Computers inside a builtin group such as Remote Desktop Users or Administrators hands that right to the whole domain on every domain controller.
    fix: Remove the broad principal and grant the right to a specific group.
    refs: [NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(|(objectSid=S-1-5-32-544)(objectSid=S-1-5-32-548)(objectSid=S-1-5-32-549)(objectSid=S-1-5-32-550)(objectSid=S-1-5-32-551)(objectSid=S-1-5-32-552)(objectSid=S-1-5-32-555)(objectSid=S-1-5-32-556)(objectSid=S-1-5-32-558)(objectSid=S-1-5-32-559)(objectSid=S-1-5-32-562)(objectSid=S-1-5-32-569)(objectSid=S-1-5-32-573)(objectSid=S-1-5-32-578)(objectSid=S-1-5-32-579)(objectSid=S-1-5-32-580)(objectSid=S-1-5-32-582))'
      attributes: [cn, member]
      key: cn
    each: { field: member, op: match, value: '^CN=(S-1-1-0|S-1-5-7|S-1-5-11|S-1-5-2|S-1-5-4),CN=ForeignSecurityPrincipals,|^CN=(Domain Users|Domain Computers|Domain Guests),CN=Users,' }
    evidence: "{cn} members - {member}"

  - id: AD-GROUP-EMPTY
    title: Empty security groups
    lens: maintenance
    category: HYG
    severity: low
    entity: group
    why: Groups with no members clutter the access model and are easy to re-use by mistake for something they were never reviewed for.
    fix: Confirm with the owner and delete, or document why the group must exist empty.
    query:
      protocol: ldap
      filter: '(&(objectClass=group)(!(member=*))(!(isCriticalSystemObject=TRUE))(groupType:1.2.840.113556.1.4.803:=2147483648))'
      attributes: [cn, whenCreated]
      key: distinguishedName
      name: cn
    count: { op: gt, value: 0, threshold: ad.empty-groups-max }
    evidence: "{count} empty security groups, for example {sample}"

  # Protected groups are found by adminCount=1 (set by the hourly protection process on every
  # protected group and on groups nested inside them), not by name, so the query works in any
  # language. AD-POP-PROTECTED-GROUPS-NONE guards it.

  - id: AD-GROUP-PROTECTED-BROAD-MEMBER
    title: Protected group has Everyone, Authenticated Users or a domain-wide group as a member
    category: IAM
    severity: critical
    entity: group
    why: Every user (or every computer) in the domain then holds that group's administrative rights. Builtin groups are reported by AD-GROUP-BUILTIN-BROAD-MEMBER; this covers domain groups such as Domain Admins, Key Admins and custom groups nested in them. Well-known principals are matched by SID; Domain Users, Domain Computers and Domain Guests by their default names, which ad.broad-group-member-pattern can replace on a localised domain.
    fix: Remove the broad member and add the specific accounts that need the right; treat it as an incident if nobody recognises the change.
    refs: [NIST-800-53:AC-6(5), CIS-Controls-v8:5.4, MITRE-ATTACK:T1078.002]
    query:
      protocol: ldap
      filter: '(&(objectClass=group)(adminCount=1))'
      attributes: [cn, member, memberOf, groupType, isCriticalSystemObject, whenChanged]
      key: distinguishedName
      name: cn
    each:
      all:
        - { field: groupType, op: noflag, value: 1 }
        - any:
            - { field: member, op: match, value: '^CN=(S-1-1-0|S-1-5-7|S-1-5-11|S-1-5-2|S-1-5-4),CN=ForeignSecurityPrincipals,' }
            - { field: member, op: match, value: '^CN=(Domain Users|Domain Computers|Domain Guests),CN=Users,', threshold: ad.broad-group-member-pattern }
    evidence: "{cn} - members {member}"

  - id: AD-GROUP-PROTECTED-FOREIGN-MEMBER
    title: Protected group has a member from another domain or forest
    category: IAM
    severity: high
    entity: group
    why: A foreign security principal in an administrative group makes this domain's control depend on the other directory's accounts and hygiene, and the member never appears in this domain's user reviews.
    fix: Replace it with an account of this domain, or document the cross-trust administrator and review it together with the trust (AD-TRUST-REVIEW).
    refs: [NIST-800-53:AC-20, NIST-800-53:AC-6(5), MITRE-ATTACK:T1078.002]
    query:
      protocol: ldap
      filter: '(&(objectClass=group)(adminCount=1))'
      attributes: [cn, member, memberOf, groupType, isCriticalSystemObject, whenChanged]
      key: distinguishedName
      name: cn
    each: { field: member, op: match, value: '^CN=S-1-5-21-[0-9-]+,CN=ForeignSecurityPrincipals,' }
    evidence: "{cn} - members {member}"

  - id: AD-GROUP-CUSTOM-NESTED-IN-PROTECTED
    title: Organisation-created group nested inside a protected group
    lens: both
    category: IAM
    severity: medium
    entity: group
    why: A group the organisation created carries adminCount=1 and is itself a member of other groups, so it sits inside a protected group. Whoever manages its membership is an administrator in practice, and reviews of the protected group show the group's name instead of the people in it. If none of the groups it belongs to is protected any more, the mark is a leftover and AD-GROUP-ORPHAN-ADMINCOUNT's fix applies.
    fix: Put the accounts directly into the protected group, or manage the nested group with the same controls (named owner, review, no delegated writers).
    refs: [NIST-800-53:AC-6(5), NIST-800-53:AC-6(7), CIS-Controls-v8:5.4]
    query:
      protocol: ldap
      filter: '(&(objectClass=group)(adminCount=1))'
      attributes: [cn, member, memberOf, groupType, isCriticalSystemObject, whenChanged]
      key: distinguishedName
      name: cn
    each:
      all:
        - any:
            - { field: isCriticalSystemObject, op: absent }
            - { field: isCriticalSystemObject, op: ne, value: 'TRUE' }
        - { field: memberOf, op: notempty }
    evidence: "{cn} - member of {memberOf}"

  - id: AD-GROUP-ORPHAN-ADMINCOUNT
    title: Organisation-created group marked adminCount=1 but a member of no group
    lens: both
    category: IAM
    severity: low
    entity: group
    why: The group left the protected set, but the mark stays and its permission inheritance stays blocked, so delegated permissions on its OU never reach it and the old administrator-only ACL lingers. The user-side twin is AD-PRIV-ORPHAN-ADMINCOUNT.
    fix: Clear adminCount on the group and re-enable permission inheritance.
    refs: [NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&(objectClass=group)(adminCount=1))'
      attributes: [cn, member, memberOf, groupType, isCriticalSystemObject, whenChanged]
      key: distinguishedName
      name: cn
    each:
      all:
        - any:
            - { field: isCriticalSystemObject, op: absent }
            - { field: isCriticalSystemObject, op: ne, value: 'TRUE' }
        - { field: memberOf, op: empty }
    evidence: "{cn} - adminCount=1, member of no group"

  - id: AD-GROUP-PROTECTED-RECENTLY-CHANGED
    title: Protected group changed in the last week
    category: MON
    severity: medium
    entity: group
    why: A membership change updates the group's change date, so this is the cheapest "an administrative group changed - was it approved?" signal. Which member changed is not visible here.
    fix: Match the change against the change records; the group-membership events on the domain controllers name the member and who made the change.
    refs: [NIST-800-53:AC-2(4), NIST-800-53:AU-12, CIS-Controls-v8:5.1, MITRE-ATTACK:T1098]
    query:
      protocol: ldap
      filter: '(&(objectClass=group)(adminCount=1))'
      attributes: [cn, member, memberOf, groupType, isCriticalSystemObject, whenChanged]
      key: distinguishedName
      name: cn
    each: { field: whenChanged, op: age-lt, value: 7, threshold: ad.protected-group-change-days }
    evidence: "{cn} - changed {whenChanged}"

  - id: AD-GROUP-NO-OWNER
    title: Security groups with members and no owner
    lens: both
    category: HYG
    severity: low
    entity: group
    why: An access review needs someone to ask; a group without managedBy is never reviewed, never cleaned and never deleted. Critical system groups are not counted.
    fix: Set managedBy to a person (allow the owner to update membership only where that is wanted) and run a first review with them.
    refs: [NIST-800-53:AC-2(7), NIST-800-53:AC-6(7), CIS-Controls-v8:6.8]
    query:
      protocol: ldap
      filter: '(&(objectClass=group)(groupType:1.2.840.113556.1.4.803:=2147483648)(!(managedBy=*))(!(isCriticalSystemObject=TRUE))(member=*))'
      attributes: [cn, whenCreated, whenChanged]
      key: distinguishedName
      name: cn
    count: { op: gt, value: 0, threshold: ad.unowned-groups-max }
    evidence: "{count} security groups with members have no owner, for example {sample}"

  # ---------------------------------------------------------------- Kerberos

  - id: AD-KRB-KRBTGT-PASSWORD-AGE
    title: krbtgt account password not rotated recently
    category: AUT
    severity: high
    entity: user
    why: Forged tickets signed with the krbtgt key stay valid until the key is changed twice; an old key means any past compromise still works.
    fix: Reset the krbtgt password twice with full replication in between, on a regular schedule and after any suspected compromise. Read-only DC and cloud Kerberos krbtgt accounts are included; ones whose read-only DC is gone are reported by AD-KRB-RODC-KRBTGT-ORPHAN instead.
    refs: [MITRE-ATTACK:T1558.001, NIST-800-53:IA-5, PINGCASTLE:A-Krbtgt]
    query:
      protocol: ldap
      filter: '(&{USER}(sAMAccountName=krbtgt*))'
      attributes: [sAMAccountName, pwdLastSet, msDS-KrbTgtLinkBl]
      key: sAMAccountName
    each:
      all:
        - { field: pwdLastSet, op: age-gt, value: 180, threshold: ad.krbtgt-max-age-days }
        - any:
            - { field: sAMAccountName, op: notmatch, value: '^krbtgt_' }
            - { field: msDS-KrbTgtLinkBl, op: exists }
    evidence: "{sAMAccountName} - password last set {pwdLastSet}"

  - id: AD-KRB-RODC-KRBTGT-ORPHAN
    title: Read-only DC krbtgt account whose domain controller is gone
    lens: maintenance
    category: HYG
    severity: low
    entity: user
    why: Each read-only DC gets its own krbtgt_<number> account, linked back to the DC object. Without that link the DC was removed but its key account stayed - a Kerberos credential nothing uses, which still has to be rotated and reviewed.
    fix: Confirm no read-only DC object references the account (msDS-KrbTgtLink), then delete it.
    refs: [NIST-800-53:CM-8, NIST-800-53:IA-5, PingCastle:P-RODCKrbtgtOrphan]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(&{USER}(sAMAccountName=krbtgt*))'
      attributes: [sAMAccountName, pwdLastSet, msDS-KrbTgtLinkBl]
      key: sAMAccountName
    each:
      all:
        - { field: sAMAccountName, op: match, value: '^krbtgt_' }
        - { field: msDS-KrbTgtLinkBl, op: absent }
    evidence: "{sAMAccountName} - no read-only DC links to it, password last set {pwdLastSet}"

  # ---------------------------------------------------------------- domain policy (domain head)

  - id: AD-DOM-MACHINE-ACCOUNT-QUOTA
    title: Ordinary users may add computers to the domain
    category: CFG
    severity: medium
    entity: domain
    why: A machine account quota above zero lets any user create computer accounts, a common first step in delegation and relay attacks.
    fix: Set ms-DS-MachineAccountQuota to 0 and delegate domain join to a named group on the target OUs.
    refs: [MITRE-ATTACK:T1136.002, NIST-800-53:AC-6, PINGCASTLE:S-ADRegistration]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each: { field: ms-DS-MachineAccountQuota, op: gt, value: 0, threshold: ad.machine-account-quota-max }
    evidence: "{name} - ms-DS-MachineAccountQuota {ms-DS-MachineAccountQuota}"

  - id: AD-DOM-MIN-PASSWORD-LENGTH
    title: Domain password policy allows short passwords
    category: IAM
    severity: high
    entity: domain
    why: The default domain policy is the floor for every account without a fine-grained policy; short passwords fall to guessing and offline cracking quickly.
    fix: Raise the minimum length in the policy linked at the domain root (or use fine-grained policies for the accounts that need longer ones).
    refs: [NIST-800-53:IA-5(1), CIS-CONTROLS-8:5.2]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each: { field: minPwdLength, op: lt, value: 14, threshold: ad.min-password-length }
    evidence: "{name} - minPwdLength {minPwdLength}"

  - id: AD-DOM-PASSWORD-HISTORY
    title: Domain password policy keeps a short password history
    category: IAM
    severity: medium
    entity: domain
    why: With a short history users can cycle back to a password that has already leaked.
    fix: Set the password history to the threshold value (24 by default) in the root-linked password policy.
    refs: [NIST-800-53:IA-5(1)]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each: { field: pwdHistoryLength, op: lt, value: 24, threshold: ad.password-history-min }
    evidence: "{name} - pwdHistoryLength {pwdHistoryLength}"

  - id: AD-DOM-NO-LOCKOUT
    title: Domain policy has no account lockout threshold
    category: IAM
    severity: medium
    entity: domain
    why: Without a lockout threshold an attacker can guess passwords against every account without limit.
    fix: Set a lockout threshold (for example 10) with a short lockout duration so spraying is slowed without easy denial of service.
    refs: [MITRE-ATTACK:T1110.003, NIST-800-53:AC-7]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each: { field: lockoutThreshold, op: eq, value: 0 }
    evidence: "{name} - lockoutThreshold {lockoutThreshold}"

  - id: AD-DOM-COMPLEXITY-OFF
    title: Domain policy has complexity off without long passphrases
    category: IAM
    severity: medium
    entity: domain
    why: Complexity can be dropped when long passphrases are required; with neither, the policy accepts short dictionary words.
    fix: Turn complexity on, or raise the minimum length to passphrase level.
    refs: [NIST-800-53:IA-5(1)]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each:
      all:
        - { field: pwdProperties, op: noflag, value: 1 }
        - { field: minPwdLength, op: lt, value: 15, threshold: ad.passphrase-min-length }
    evidence: "{name} - pwdProperties {pwdProperties}, minPwdLength {minPwdLength}"

  - id: AD-DOM-REVERSIBLE-ENCRYPTION
    title: Domain policy stores every password with reversible encryption
    category: IAM
    severity: critical
    entity: domain
    why: With the domain-wide setting on, each password changed afterwards is kept in a decryptable form for every account.
    fix: Turn off "store passwords using reversible encryption" in the root-linked policy, then force password changes.
    refs: [NIST-800-53:IA-5(1)]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each: { field: pwdProperties, op: flag, value: 16 }
    evidence: "{name} - pwdProperties {pwdProperties}"

  - id: AD-DOM-FUNCTIONAL-LEVEL
    title: Domain functional level below the target
    lens: both
    category: LCM
    severity: medium
    entity: domain
    why: Older functional levels keep newer protections off (for example rolling of expiring NTLM secrets and current Kerberos defaults) and signal old domain controllers.
    fix: Retire the old domain controllers and raise the domain functional level (7 = Windows Server 2016).
    refs: [NIST-800-53:CM-2]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each: { field: msDS-Behavior-Version, op: lt, value: 7, threshold: ad.min-functional-level }
    evidence: "{name} - domain functional level {msDS-Behavior-Version}"

  - id: AD-DOM-ROOT-NO-GPO
    title: No Group Policy linked at the domain root
    category: CFG
    severity: medium
    entity: domain
    why: Domain password, lockout and Kerberos policy come only from GPOs linked at the domain root; with none linked the domain runs on built-in defaults nobody chose.
    fix: Link the Default Domain Policy (or the domain's password policy GPO) at the domain root.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each:
      any:
        - { field: gPLink, op: absent }
        - { field: gPLink, op: notmatch, value: 'LDAP://' }
    evidence: "{name} - gPLink '{gPLink}'"

  - id: AD-DOM-DC-OU-NO-GPO
    title: No Group Policy linked to the Domain Controllers OU
    category: CFG
    severity: medium
    entity: domain
    why: User rights and audit settings for domain controllers normally come from a GPO on this OU; without one they fall back to local defaults.
    fix: Link the Default Domain Controllers Policy, or the domain controller baseline GPO, to the Domain Controllers OU.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      base: 'OU=Domain Controllers,{DOMAINDN}'
      scope: base
      filter: '(objectClass=organizationalUnit)'
      attributes: [ou, gPLink]
      key: distinguishedName
    each:
      any:
        - { field: gPLink, op: absent }
        - { field: gPLink, op: notmatch, value: 'LDAP://' }
    evidence: "{distinguishedName} - gPLink '{gPLink}'"

  - id: AD-DOM-MAX-PASSWORD-AGE
    title: Domain passwords never expire or last longer than a year
    category: IAM
    severity: low
    entity: domain
    why: With no maximum age, or one above a year, a password that leaked keeps working until its owner happens to change it. Dropping expiry is defensible only together with banned-password screening and MFA on every sign-in; this rule records that decision.
    fix: Set a maximum password age in the root-linked password policy, or, where the organisation deliberately follows no-expiry guidance with screening and MFA in place, accept the finding with that reason.
    refs: [NIST-800-53:IA-5(1), CIS-Controls-v8:5.2]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each:
      any:
        - { field: maxPwdAge, op: eq, value: never }
        - { field: maxPwdAge, op: gt, value: 365, threshold: ad.domain-password-max-age-days }
    evidence: "{name} - maximum password age {maxPwdAge} days"

  - id: AD-DOM-MIN-PASSWORD-AGE-ZERO
    title: Domain policy lets passwords be changed again immediately
    category: IAM
    severity: low
    entity: domain
    why: With a minimum age below one day a user can change the password over and over within minutes and land back on the old one, which makes the history setting meaningless. The reader sees whole days, so any value under one day shows as 0.
    fix: Set the minimum password age to at least one day in the root-linked password policy.
    refs: [NIST-800-53:IA-5(1)]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each: { field: minPwdAge, op: eq, value: 0 }
    evidence: "{name} - minimum password age {minPwdAge} days"

  - id: AD-DOM-LOCKOUT-THRESHOLD-HIGH
    title: Domain lockout threshold allows many bad attempts
    category: IAM
    severity: low
    entity: domain
    why: A high threshold lets spraying tools try several passwords against every account in each observation window without locking anyone out. A threshold of 0 (no lockout) is reported by AD-DOM-NO-LOCKOUT.
    fix: Lower the threshold to the threshold value or below, with a short lockout duration so legitimate users recover on their own.
    refs: [NIST-800-53:AC-7, MITRE-ATTACK:T1110.003]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each: { field: lockoutThreshold, op: gt, value: 10, threshold: ad.lockout-threshold-max }
    evidence: "{name} - lockoutThreshold {lockoutThreshold}"

  - id: AD-DOM-COMPUTERS-CONTAINER-NOT-REDIRECTED
    title: New computer accounts still default to CN=Computers
    lens: both
    category: CFG
    severity: low
    entity: domain
    why: Every machine joined without naming an OU lands in a container no GPO, LAPS policy or delegation reaches. AD-COMP-DEFAULT-CONTAINER counts the machines already there; this is the cause.
    fix: Redirect the default computer location to a managed staging OU with redircmp, then move the existing objects.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each: { field: wellKnownObjects, op: match, value: '^B:32:AA312825768811D1ADED00C04FD8D5CD:CN=Computers,' }
    evidence: "{name} - default computer location is CN=Computers"

  - id: AD-DOM-USERS-CONTAINER-NOT-REDIRECTED
    title: New user accounts still default to CN=Users
    lens: both
    category: CFG
    severity: low
    entity: domain
    why: Tools and scripts that create users without naming an OU put them where no OU policy or delegation applies. AD-USER-DEFAULT-CONTAINER counts the accounts already there.
    fix: Redirect the default user location to a managed OU with redirusr, then move the existing accounts.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each: { field: wellKnownObjects, op: match, value: '^B:32:A9D1CA15768811D1ADED00C04FD8D5CD:CN=Users,' }
    evidence: "{name} - default user location is CN=Users"

  # ---------------------------------------------------------------- forest settings (configuration partition)

  - id: AD-FOREST-FUNCTIONAL-LEVEL
    title: Forest functional level below the target
    lens: both
    category: LCM
    severity: medium
    entity: domain
    why: Forest-wide features such as current trust and Kerberos behaviour depend on the forest level, and a low level means old domain controllers somewhere in the forest.
    fix: Raise every domain first, then the forest functional level (7 = Windows Server 2016).
    refs: [NIST-800-53:CM-2]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Partitions,{CONFIGDN}'
      scope: base
      filter: '(objectClass=crossRefContainer)'
      attributes: [cn, msDS-Behavior-Version, msDS-EnabledFeature]
      key: distinguishedName
    each: { field: msDS-Behavior-Version, op: lt, value: 7, threshold: ad.min-functional-level }
    evidence: "Forest functional level {msDS-Behavior-Version}"

  - id: AD-FOREST-RECYCLE-BIN-OFF
    title: Active Directory Recycle Bin is not enabled
    kind: missing
    lens: both
    category: BCK
    severity: medium
    entity: domain
    why: Without the Recycle Bin a deleted user, group or OU comes back only through an authoritative restore from backup, and its links are lost.
    fix: Enable the Recycle Bin optional feature (forest functional level 2008 R2 or higher); note it cannot be turned off again.
    refs: [NIST-800-53:CP-9, NIST-800-53:CP-10, PINGCASTLE:P-RecycleBin]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Partitions,{CONFIGDN}'
      scope: base
      filter: '(objectClass=crossRefContainer)'
      attributes: [cn, msDS-Behavior-Version, msDS-EnabledFeature]
      key: distinguishedName
    each:
      any:
        - { field: msDS-EnabledFeature, op: absent }
        - not: { field: msDS-EnabledFeature, op: match, value: '^CN=Recycle Bin Feature,' }
    evidence: "Enabled optional features - '{msDS-EnabledFeature}'"

  - id: AD-FOREST-PAM-FEATURE-OFF
    title: Privileged Access Management feature is not enabled
    kind: missing
    category: IAM
    severity: info
    entity: domain
    why: Without the optional feature group memberships cannot expire on their own, so every administrative membership is standing until someone removes it. A pointer to an option, not a fault - it needs forest functional level 2016 and cannot be turned off once enabled.
    fix: Enable the Privileged Access Management optional feature at forest level 2016, then grant administrative memberships with a time to live instead of permanently.
    refs: [NIST-800-53:AC-6(5), NIST-800-53:AC-2(2), CIS-Controls-v8:5.4]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Partitions,{CONFIGDN}'
      scope: base
      filter: '(objectClass=crossRefContainer)'
      attributes: [cn, msDS-Behavior-Version, msDS-EnabledFeature]
      key: distinguishedName
    each:
      any:
        - { field: msDS-EnabledFeature, op: absent }
        - not: { field: msDS-EnabledFeature, op: match, value: '^CN=Privileged Access Management Feature,' }
    evidence: "Enabled optional features - '{msDS-EnabledFeature}'"

  - id: AD-FOREST-TOMBSTONE-LIFETIME
    title: Tombstone lifetime is short or unset
    lens: maintenance
    category: BCK
    severity: low
    entity: domain
    why: The tombstone lifetime bounds how old a usable backup can be and how long a domain controller may stay offline; unset means the old 60-day default.
    fix: Set tombstoneLifetime to at least 180 days.
    refs: [NIST-800-53:CP-9]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Directory Service,CN=Windows NT,CN=Services,{CONFIGDN}'
      scope: base
      filter: '(objectClass=nTDSService)'
      attributes: [cn, tombstoneLifetime, dSHeuristics]
      key: distinguishedName
    each:
      any:
        - { field: tombstoneLifetime, op: absent }
        - { field: tombstoneLifetime, op: lt, value: 180, threshold: ad.min-tombstone-days }
    evidence: "tombstoneLifetime '{tombstoneLifetime}'"

  - id: AD-FOREST-DSH-ANONYMOUS-LDAP
    title: dSHeuristics allows anonymous LDAP operations
    category: CFG
    severity: high
    entity: domain
    why: The seventh dSHeuristics character set to 2 lets unauthenticated clients search the directory wherever permissions allow anonymous reads.
    fix: Set the seventh character back to 0 after finding the clients that bind anonymously.
    refs: [NIST-800-53:AC-14, MITRE-ATTACK:T1087.002, PINGCASTLE:A-DsHeuristicsAnonymous]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Directory Service,CN=Windows NT,CN=Services,{CONFIGDN}'
      scope: base
      filter: '(objectClass=nTDSService)'
      attributes: [cn, tombstoneLifetime, dSHeuristics]
      key: distinguishedName
    each:
      all:
        - { field: dSHeuristics, op: exists }
        - { field: dSHeuristics, op: match, value: '^.{6}2' }
    evidence: "dSHeuristics {dSHeuristics}"

  - id: AD-FOREST-DSH-ADMINSDEXMASK
    title: dSHeuristics removes operator groups from AdminSDHolder protection
    category: CFG
    severity: medium
    entity: domain
    why: A non-zero sixteenth character excludes operator groups from AdminSDHolder, so changed permissions on them are no longer reset - often a leftover or a persistence trick.
    fix: Set the sixteenth character to 0 unless a documented design needs the exclusion.
    refs: [NIST-800-53:AC-6, PINGCASTLE:A-DsHeuristicsAdminSDExMask]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Directory Service,CN=Windows NT,CN=Services,{CONFIGDN}'
      scope: base
      filter: '(objectClass=nTDSService)'
      attributes: [cn, tombstoneLifetime, dSHeuristics]
      key: distinguishedName
    each:
      all:
        - { field: dSHeuristics, op: exists }
        - { field: dSHeuristics, op: match, value: '^.{15}[1-9a-fA-F]' }
    evidence: "dSHeuristics {dSHeuristics}"

  - id: AD-FOREST-DSH-ANONYMOUS-NSPI
    title: dSHeuristics allows anonymous NSPI (address book) access
    category: CFG
    severity: medium
    entity: domain
    why: A non-zero eighth character lets anonymous callers use the address-book RPC interface to enumerate directory objects.
    fix: Set the eighth character to 0.
    refs: [NIST-800-53:AC-14, PINGCASTLE:A-DsHeuristicsAllowAnonNSPI]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Directory Service,CN=Windows NT,CN=Services,{CONFIGDN}'
      scope: base
      filter: '(objectClass=nTDSService)'
      attributes: [cn, tombstoneLifetime, dSHeuristics]
      key: distinguishedName
    each:
      all:
        - { field: dSHeuristics, op: exists }
        - { field: dSHeuristics, op: match, value: '^.{7}[^0]' }
    evidence: "dSHeuristics {dSHeuristics}"

  - id: AD-FOREST-DSH-AUTHZ-CHECKS-OFF
    title: dSHeuristics turns off the LDAP add and owner-rights hardening
    category: CFG
    severity: medium
    entity: domain
    why: A 2 in the 28th or 29th character disables the checks that stop non-administrators from setting dangerous attributes or abusing implicit owner rights on computer objects.
    fix: Set both characters to 1 (enforce) after reviewing the audit events the hardening logs.
    refs: [CVE-2021-42291, MS-KB:5008383]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Directory Service,CN=Windows NT,CN=Services,{CONFIGDN}'
      scope: base
      filter: '(objectClass=nTDSService)'
      attributes: [cn, tombstoneLifetime, dSHeuristics]
      key: distinguishedName
    each:
      all:
        - { field: dSHeuristics, op: exists }
        - { field: dSHeuristics, op: match, value: '^.{27}2|^.{28}2' }
    evidence: "dSHeuristics {dSHeuristics}"

  # ---------------------------------------------------------------- trusts

  - id: AD-TRUST-REVIEW
    title: Domain trust to review
    category: IAM
    severity: info
    entity: trust
    why: Every trust is an authentication path into or out of the domain and should have an owner and a reason.
    fix: Confirm the trust is still needed, who owns the other side, and that its direction and filtering match the design; remove trusts nobody owns.
    refs: [NIST-800-53:AC-20, MITRE-ATTACK:T1482]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(objectClass=trustedDomain)'
      attributes: [cn, trustPartner, flatName, trustDirection, trustType, trustAttributes, msDS-SupportedEncryptionTypes, whenCreated, whenChanged]
      key: cn
      name: trustPartner
    each: any
    evidence: "{trustPartner} - direction {trustDirection}, type {trustType}, attributes {trustAttributes}, created {whenCreated}"

  - id: AD-TRUST-SID-FILTERING-OFF
    title: External trust without SID filtering
    category: IAM
    severity: high
    entity: trust
    why: Without quarantine (SID filtering) the trusted domain can present any SID, including this domain's administrator SIDs, through SID history.
    fix: Enable SID filtering (quarantine) on the trust once migrations that relied on SID history are complete.
    refs: [MITRE-ATTACK:T1134.005, NIST-800-53:AC-20]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(objectClass=trustedDomain)'
      attributes: [cn, trustPartner, flatName, trustDirection, trustType, trustAttributes, msDS-SupportedEncryptionTypes, whenCreated, whenChanged]
      key: cn
      name: trustPartner
    each:
      all:
        - { field: trustDirection, op: in, value: [2, 3] }
        - { field: trustType, op: in, value: [1, 2] }
        - { field: trustAttributes, op: noflag, value: 4 }
        - { field: trustAttributes, op: noflag, value: 8 }
        - { field: trustAttributes, op: noflag, value: 32 }
    evidence: "{trustPartner} - trustAttributes {trustAttributes} (no quarantine bit)"

  - id: AD-TRUST-FOREST-SIDHISTORY
    title: Forest trust accepts SID history
    category: IAM
    severity: high
    entity: trust
    why: Treating a forest trust as external relaxes SID filtering, so SIDs from the other forest's history are honoured here.
    fix: Clear TRUST_ATTRIBUTE_TREAT_AS_EXTERNAL on the trust unless a migration currently needs it.
    refs: [MITRE-ATTACK:T1134.005, NIST-800-53:AC-20]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(objectClass=trustedDomain)'
      attributes: [cn, trustPartner, flatName, trustDirection, trustType, trustAttributes, msDS-SupportedEncryptionTypes, whenCreated, whenChanged]
      key: cn
      name: trustPartner
    each:
      all:
        - { field: trustAttributes, op: flag, value: 8 }
        - { field: trustAttributes, op: flag, value: 64 }
        - { field: trustAttributes, op: noflag, value: 1024 }
    evidence: "{trustPartner} - trustAttributes {trustAttributes}"

  - id: AD-TRUST-TGT-DELEGATION
    title: Forest trust allows TGT delegation
    category: AUT
    severity: high
    entity: trust
    why: With TGT delegation enabled, services with unconstrained delegation in the other forest receive reusable tickets of this forest's users.
    fix: Clear TRUST_ATTRIBUTE_CROSS_ORGANIZATION_ENABLE_TGT_DELEGATION on the trust.
    refs: [MITRE-ATTACK:T1558, NIST-800-53:AC-20]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(objectClass=trustedDomain)'
      attributes: [cn, trustPartner, flatName, trustDirection, trustType, trustAttributes, msDS-SupportedEncryptionTypes, whenCreated, whenChanged]
      key: cn
      name: trustPartner
    each:
      all:
        - { field: trustAttributes, op: flag, value: 8 }
        - { field: trustAttributes, op: flag, value: 2048 }
    evidence: "{trustPartner} - trustAttributes {trustAttributes}"

  - id: AD-TRUST-NO-AES
    title: Trust does not use AES for Kerberos
    category: AUT
    severity: medium
    entity: trust
    why: A trust with no AES encryption types falls back to RC4 for referral tickets, which is weak and is being removed from Windows.
    fix: Enable "the other domain supports Kerberos AES encryption" on both sides of the trust.
    refs: [NIST-800-53:SC-13]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(objectClass=trustedDomain)'
      attributes: [cn, trustPartner, flatName, trustDirection, trustType, trustAttributes, msDS-SupportedEncryptionTypes, whenCreated, whenChanged]
      key: cn
      name: trustPartner
    each:
      all:
        - { field: trustType, op: eq, value: 2 }
        - { field: trustAttributes, op: noflag, value: 256 }
        - any:
            - { field: msDS-SupportedEncryptionTypes, op: absent }
            - all:
                - { field: msDS-SupportedEncryptionTypes, op: noflag, value: 8 }
                - { field: msDS-SupportedEncryptionTypes, op: noflag, value: 16 }
    evidence: "{trustPartner} - msDS-SupportedEncryptionTypes '{msDS-SupportedEncryptionTypes}'"

  - id: AD-TRUST-SELECTIVE-AUTH-OFF
    title: Trust lets every user of the other domain authenticate here
    category: IAM
    severity: low
    entity: trust
    why: Without selective authentication every account of the trusted domain or forest counts as an authenticated user here and can read most of the directory and reach any resource open to Authenticated Users. Whole-forest trusts between parts of one organisation may be designed this way; trusts to other organisations rarely should be.
    fix: Switch the trust to selective authentication and grant "Allowed to authenticate" on the specific servers the other side's users need, or record the design decision as accepted.
    refs: [NIST-800-53:AC-20, NIST-800-53:AC-3, MITRE-ATTACK:T1482]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(objectClass=trustedDomain)'
      attributes: [cn, trustPartner, flatName, trustDirection, trustType, trustAttributes, msDS-SupportedEncryptionTypes, whenCreated, whenChanged]
      key: cn
      name: trustPartner
    each:
      all:
        - { field: trustDirection, op: in, value: [2, 3] }
        - { field: trustType, op: in, value: [1, 2] }
        - { field: trustAttributes, op: noflag, value: 32 }
        - { field: trustAttributes, op: noflag, value: 16 }
    evidence: "{trustPartner} - direction {trustDirection}, trustAttributes {trustAttributes} (no selective authentication)"

  - id: AD-TRUST-ACCOUNT-PASSWORD-OLD
    title: Trust account password has not rotated
    kind: broken
    lens: maintenance
    category: AVL
    severity: medium
    entity: trust
    why: The domain-named account behind an incoming or two-way trust has its password renewed about every 30 days by the other side. An old one means the partner domain has been unreachable for weeks, or was retired without removing the trust.
    fix: Verify the trust from both sides (netdom trust /verify); reset it, or remove the trust - and with it this account and the trustedDomain object - if the partner domain no longer exists.
    refs: [NIST-800-53:AC-20, NIST-800-53:CP-10, PingCastle:T-Inactive]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(&{USER}{UAC:2048})'
      attributes: [sAMAccountName, pwdLastSet, whenCreated, userAccountControl]
      key: sAMAccountName
    each:
      all:
        - { field: pwdLastSet, op: ne, value: 0 }
        - { field: pwdLastSet, op: age-gt, value: 60, threshold: ad.trust-password-max-age-days }
    evidence: "{sAMAccountName} - trust password last set {pwdLastSet}"

  # ---------------------------------------------------------------- computers (servers and workstations)

  - id: AD-COMP-STALE
    title: Enabled computer account not seen for a long time
    lens: maintenance
    category: HYG
    severity: medium
    entity: computer
    why: Stale computer objects hide real assets, skew every count and keep DNS records, delegations and LAPS passwords alive for machines that are gone.
    fix: Disable the object, move it to a quarantine OU, and delete it after the retention period.
    refs: [NIST-800-53:CM-8, PINGCASTLE:S-C-Inactive]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: sAMAccountName, op: ne, value: 'AZUREADSSOACC$' }
        - any:
            - { field: servicePrincipalName, op: absent }
            - not: { field: servicePrincipalName, op: match, value: '^MSClusterVirtualServer/' }
        - any:
            - { field: lastLogonTimestamp, op: age-gt, value: 180, threshold: ad.stale-computer-days }
            - all:
                - { field: lastLogonTimestamp, op: absent }
                - { field: whenCreated, op: age-gt, value: 180, threshold: ad.stale-computer-days }
    evidence: "{dNSHostName} ({sAMAccountName}) - last logon '{lastLogonTimestamp}', created {whenCreated}"

  - id: AD-COMP-OS-SERVER-2012
    title: Active server on Windows Server 2012 or 2012 R2 (extended security updates ended October 2026)
    lens: both
    category: LCM
    severity: critical
    entity: computer
    why: Extended support for Windows Server 2012 and 2012 R2 ended in October 2023 and the last paid extended-security-update year ended on 13 October 2026, so these servers get no security fixes at all from now on.
    fix: Migrate or upgrade each server to a supported Windows Server release; until then isolate it and restrict who can reach it.
    refs: [NIST-800-53:SA-22, NIST-800-53:SI-2, CIS-CONTROLS-8:2.2]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: lastLogonTimestamp, op: age-lt, value: 180, threshold: ad.active-computer-days }
        - { field: operatingSystem, op: match, value: '^(Windows|Hyper-V|Microsoft).*\b2012\b' }
    evidence: "{dNSHostName} - {operatingSystem} {operatingSystemVersion}, last logon {lastLogonTimestamp}"

  - id: AD-COMP-OS-LEGACY
    title: Active computer on a long-unsupported Windows version
    lens: both
    category: LCM
    severity: critical
    entity: computer
    why: Windows XP to 8.1, Server 2000 to 2008 R2 (and Small Business Server 2011) and the old semi-annual server releases have had no security updates for years; each one is an unpatched host holding a domain account.
    fix: Replace or upgrade the host, or isolate it on a restricted network until it is gone.
    refs: [NIST-800-53:SA-22, NIST-800-53:SI-2, CIS-CONTROLS-8:2.2]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: lastLogonTimestamp, op: age-lt, value: 180, threshold: ad.active-computer-days }
        - any:
            - { field: operatingSystem, op: match, value: '^Windows (NT|2000 Professional|XP|Vista|7|8)\b' }
            - { field: operatingSystem, op: match, value: '^(Windows|Hyper-V|Microsoft).*\b(2000|2003|2008|2011)\b' }
            - all:
                - { field: operatingSystem, op: match, value: '^Windows Server (Standard|Datacenter)' }
                - { field: operatingSystem, op: notmatch, value: '\b20\d\d\b' }
    evidence: "{dNSHostName} - {operatingSystem} {operatingSystemVersion}, last logon {lastLogonTimestamp}"

  - id: AD-COMP-OS-WIN10
    title: Active computer on Windows 10 past end of support
    lens: both
    category: LCM
    severity: high
    entity: computer
    why: Windows 10 outside the long-term servicing editions left support on 14 October 2025 (and the 2015 and 2016 long-term editions have ended too); without paid extended security updates it gets no fixes.
    fix: Upgrade to a supported Windows 11 release, or record the extended-security-update coverage for the device as an exception.
    refs: [NIST-800-53:SI-2, CIS-CONTROLS-8:2.2]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: lastLogonTimestamp, op: age-lt, value: 180, threshold: ad.active-computer-days }
        - { field: operatingSystem, op: match, value: '^Windows 10\b' }
        - any:
            - { field: operatingSystem, op: notmatch, value: 'LTS[BC]' }
            - { field: operatingSystemVersion, op: match, value: '\((10240|14393)\)' }
    evidence: "{dNSHostName} - {operatingSystem} {operatingSystemVersion}"

  - id: AD-COMP-OS-WIN11
    title: Active computer on a Windows 11 release past its servicing end
    lens: both
    category: LCM
    severity: high
    entity: computer
    why: Windows 11 21H2 and 22H2 no longer get updates, 23H2 Home and Pro ended in 2025 (Enterprise and Education in November 2026), and 24H2 Home and Pro ended in October 2026.
    fix: Apply the current Windows 11 feature update.
    refs: [NIST-800-53:SI-2, CIS-CONTROLS-8:2.2]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: lastLogonTimestamp, op: age-lt, value: 180, threshold: ad.active-computer-days }
        - { field: operatingSystem, op: match, value: '^Windows 11\b' }
        - any:
            - { field: operatingSystemVersion, op: match, value: '\((22000|22621|22631)\)' }
            - all:
                - { field: operatingSystemVersion, op: match, value: '\(26100\)' }
                - { field: operatingSystem, op: notmatch, value: 'Enterprise|Education' }
    evidence: "{dNSHostName} - {operatingSystem} {operatingSystemVersion}"

  - id: AD-COMP-OS-SERVER-2016
    title: Active server on Windows Server 2016 (support ends January 2027)
    lens: maintenance
    category: LCM
    severity: medium
    entity: computer
    why: Extended support for Windows Server 2016 ends in January 2027; an upgrade or migration takes longer than the time left.
    fix: Plan and schedule the upgrade or migration of each server now.
    refs: [NIST-800-53:SA-22, CIS-CONTROLS-8:2.2]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: lastLogonTimestamp, op: age-lt, value: 180, threshold: ad.active-computer-days }
        - { field: operatingSystem, op: match, value: 'Server 2016' }
    evidence: "{dNSHostName} - {operatingSystem} {operatingSystemVersion}"

  - id: AD-COMP-UNCONSTRAINED-DELEGATION
    title: Computer other than a domain controller trusted for unconstrained delegation
    category: AUT
    severity: critical
    entity: computer
    why: Anyone who controls the host captures reusable tickets of every user who connects to it, and can coerce a domain controller into connecting.
    fix: Remove TRUSTED_FOR_DELEGATION; use constrained or resource-based delegation to named services.
    refs: [MITRE-ATTACK:T1558, MITRE-ATTACK:T1187, PINGCASTLE:P-UnconstrainedDelegation]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: userAccountControl, op: flag, value: 524288 }
        - { field: userAccountControl, op: noflag, value: 8192 }
    evidence: "{dNSHostName} - userAccountControl {userAccountControl}"

  - id: AD-COMP-PROTOCOL-TRANSITION
    title: Computer allowed to delegate with protocol transition
    category: AUT
    severity: high
    entity: computer
    why: The host can obtain tickets as any user to its delegation targets without that user authenticating; control of the host gives that impersonation.
    fix: Remove protocol transition unless required and keep the delegation targets minimal. Read-only domain controllers are excluded.
    refs: [MITRE-ATTACK:T1558, NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: userAccountControl, op: flag, value: 16777216 }
        - { field: userAccountControl, op: noflag, value: 67108864 }
    evidence: "{dNSHostName} - protocol transition to '{msDS-AllowedToDelegateTo}'"

  - id: AD-COMP-DELEGATION-SENSITIVE-SPN
    title: Computer delegates to a directory or Kerberos service
    category: AUT
    severity: high
    entity: computer
    why: Delegation to ldap, gc or krbtgt services lets the host act as any user against the directory, which against a domain controller amounts to domain control.
    fix: Remove ldap/, gc/ and krbtgt/ entries from msDS-AllowedToDelegateTo unless a documented design needs them.
    refs: [MITRE-ATTACK:T1558, NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each: { field: msDS-AllowedToDelegateTo, op: match, value: '^(ldap|gc|krbtgt)/' }
    evidence: "{dNSHostName} - delegates to {msDS-AllowedToDelegateTo}"

  - id: AD-COMP-LAPS-MISSING
    title: Active Windows computer without a LAPS-managed local administrator password
    category: IAM
    severity: high
    entity: computer
    why: Without LAPS the local Administrator password is usually the same on many machines, so one compromised computer opens the rest.
    fix: Deploy Windows LAPS by policy to every computer OU. Devices that back up to Entra ID only show here too - record them as exceptions.
    refs: [MITRE-ATTACK:T1078.003, NIST-800-53:IA-5, PINGCASTLE:A-LAPS-Not-Installed]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 8192 }
        - { field: userAccountControl, op: noflag, value: 67108864 }
        - { field: operatingSystem, op: match, value: '^Windows' }
        - { field: lastLogonTimestamp, op: age-lt, value: 180, threshold: ad.active-computer-days }
        - { field: ms-Mcs-AdmPwdExpirationTime, op: absent }
        - { field: msLAPS-PasswordExpirationTime, op: absent }
    evidence: "{dNSHostName} - {operatingSystem}, no LAPS expiry attribute"

  - id: AD-COMP-LAPS-OVERDUE
    title: LAPS password on an active computer is overdue for rotation
    kind: broken
    category: IAM
    severity: medium
    entity: computer
    why: The computer is in use but its LAPS password expired long ago, so the LAPS client or policy is not working and the password has stopped rotating.
    fix: Check the LAPS policy and client events on the host and its permission to write the password attribute.
    refs: [NIST-800-53:IA-5(1)]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: lastLogonTimestamp, op: age-lt, value: 30, threshold: ad.machine-active-days }
        - any:
            - all:
                - { field: msLAPS-PasswordExpirationTime, op: exists }
                - { field: msLAPS-PasswordExpirationTime, op: age-gt, value: 14, threshold: ad.laps-overdue-days }
            - all:
                - { field: msLAPS-PasswordExpirationTime, op: absent }
                - { field: ms-Mcs-AdmPwdExpirationTime, op: age-gt, value: 14, threshold: ad.laps-overdue-days }
    evidence: "{dNSHostName} - LAPS expiry '{msLAPS-PasswordExpirationTime}{ms-Mcs-AdmPwdExpirationTime}', last logon {lastLogonTimestamp}"

  - id: AD-COMP-NO-OS
    title: Enabled computer object with no operating system recorded
    lens: maintenance
    category: HYG
    severity: low
    entity: computer
    why: A computer object that never recorded an operating system is usually pre-staged and never joined, a non-Windows device, or a broken object - none of them managed.
    fix: Identify the owner; delete objects that were never joined.
    refs: [NIST-800-53:CM-8]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: operatingSystem, op: absent }
        - { field: sAMAccountName, op: ne, value: 'AZUREADSSOACC$' }
        - any:
            - { field: servicePrincipalName, op: absent }
            - not: { field: servicePrincipalName, op: match, value: '^MSClusterVirtualServer/' }
    evidence: "{sAMAccountName} - created {whenCreated}, last logon '{lastLogonTimestamp}'"

  - id: AD-COMP-MACHINE-PASSWORD-STUCK
    title: Active computer whose machine password stopped rotating
    kind: broken
    lens: both
    category: AUT
    severity: medium
    entity: computer
    why: Windows changes its machine password every 30 days by default; an active computer with an old one has a broken secure channel or rotation disabled by policy.
    fix: Check the secure channel on the host and the "disable machine account password changes" and maximum-age policies.
    refs: [NIST-800-53:IA-5(1)]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 8192 }
        - { field: operatingSystem, op: match, value: '^Windows' }
        - { field: lastLogonTimestamp, op: age-lt, value: 30, threshold: ad.machine-active-days }
        - { field: pwdLastSet, op: ne, value: 0 }
        - { field: pwdLastSet, op: age-gt, value: 90, threshold: ad.machine-password-max-age-days }
    evidence: "{dNSHostName} - machine password set {pwdLastSet}, last logon {lastLogonTimestamp}"

  - id: AD-COMP-NO-AES
    title: Computer with Kerberos encryption types that exclude AES
    category: AUT
    severity: medium
    entity: computer
    why: An explicit encryption-type value without AES forces RC4 or DES tickets for the host, both weak and being removed from Windows.
    fix: Allow AES128 and AES256 for the computer (by policy or msDS-SupportedEncryptionTypes) and let the machine password rotate.
    refs: [NIST-800-53:SC-13, MS-KB:5021131]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: msDS-SupportedEncryptionTypes, op: gt, value: 0 }
        - { field: msDS-SupportedEncryptionTypes, op: noflag, value: 8 }
        - { field: msDS-SupportedEncryptionTypes, op: noflag, value: 16 }
    evidence: "{dNSHostName} - msDS-SupportedEncryptionTypes {msDS-SupportedEncryptionTypes}"

  - id: AD-COMP-ADMINCOUNT
    title: Computer other than a domain controller in a protected group
    category: IAM
    severity: high
    entity: computer
    why: adminCount=1 on a member computer means it is, or was, in a protected group such as Administrators; whoever controls that host holds those rights.
    fix: Remove the computer from protected groups and grant the specific rights it needs; then clear adminCount.
    refs: [NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: adminCount, op: eq, value: 1 }
        - { field: userAccountControl, op: noflag, value: 8192 }
        - { field: userAccountControl, op: noflag, value: 67108864 }
    evidence: "{dNSHostName} ({sAMAccountName}) - adminCount=1"

  - id: AD-COMP-SEAMLESS-SSO-KEY-AGE
    title: Seamless single sign-on computer account key not rotated
    category: AUT
    severity: medium
    entity: computer
    why: The AZUREADSSOACC$ account key decrypts the Kerberos tickets the cloud accepts for seamless sign-on; anyone holding it can forge sign-ins, so the key should roll regularly.
    fix: Roll the seamless single sign-on Kerberos decryption key from the sync server, on a schedule.
    refs: [NIST-800-53:IA-5, MITRE-ATTACK:T1558]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: sAMAccountName, op: eq, value: 'AZUREADSSOACC$' }
        - { field: pwdLastSet, op: age-gt, value: 30, threshold: ad.seamless-sso-key-max-age-days }
    evidence: "{sAMAccountName} - key last set {pwdLastSet}"

  - id: AD-COMP-DEFAULT-CONTAINER
    title: Enabled computers in the default Computers container
    lens: maintenance
    category: CFG
    severity: low
    entity: computer
    why: CN=Computers is a container, not an OU, so no GPO can be linked to it; computers there miss LAPS, baselines and delegated administration.
    fix: Move the computers to managed OUs and redirect new computer objects there (redircmp).
    refs: [NIST-800-53:CM-6]
    query:
      protocol: ldap
      base: 'CN=Computers,{DOMAINDN}'
      scope: onelevel
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl]
      key: sAMAccountName
      name: dNSHostName
    count: { op: gt, value: 0, threshold: ad.default-container-computers-max }
    evidence: "{count} enabled computers in CN=Computers: {sample}"

  - id: AD-COMP-CREATED-BY-USER
    title: Computers joined by ordinary users through the machine account quota
    category: IAM
    severity: low
    entity: computer
    why: mS-DS-CreatorSID marks computers created through the quota; their creator keeps write rights on the object, which is enough for resource-based delegation abuse.
    fix: Review the creators, reset ownership to an administrative group, and set the machine account quota to 0.
    refs: [MITRE-ATTACK:T1136.002, NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED}(mS-DS-CreatorSID=*))'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl]
      key: sAMAccountName
      name: dNSHostName
    count: { op: gt, value: 0, threshold: ad.user-created-computers-max }
    evidence: "{count} computers created through the quota, for example {sample}"

  - id: AD-COMP-RBCD-BROAD-TRUSTEE
    title: Computer lets everyone, or every computer, delegate to it
    category: AUT
    severity: critical
    entity: computer
    why: The computer's resource-based delegation list names a principal that every user or every computer belongs to (Everyone, Authenticated Users, Anonymous, Users, Domain Users, Domain Guests or Domain Computers). Anyone holding such an identity - any user, or a computer account made through the machine account quota - can get a service ticket to this host as any user, administrators included, and so controls it. Domain controllers are reported by AD-DC-RBCD.
    fix: Treat it as an incident - clear msDS-AllowedToActOnBehalfOfOtherIdentity or reduce it to the one front-end service account that must delegate, and find who wrote it (the object's owner or creator can).
    refs: [MITRE-ATTACK:T1558, NIST-800-53:AC-6, NIST-800-53:AC-3]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 8192 }
        - { field: userAccountControl, op: noflag, value: 67108864 }
        - { field: msDS-AllowedToActOnBehalfOfOtherIdentity, op: match, value: '^(S-1-1-0|S-1-5-7|S-1-5-11|S-1-5-32-545)$|^S-1-5-21-[0-9-]+-(513|514|515)$' }
    evidence: "{dNSHostName} - delegation allowed to {msDS-AllowedToActOnBehalfOfOtherIdentity}"

  - id: AD-COMP-RBCD-SET
    title: Computer accepts resource-based delegation from named accounts
    category: AUT
    severity: info
    entity: computer
    why: Each SID in msDS-AllowedToActOnBehalfOfOtherIdentity may impersonate any user to this host; the list should hold only the front-end services that need it. Broad principals are reported by AD-COMP-RBCD-BROAD-TRUSTEE, domain controllers by AD-DC-RBCD. SIDs are shown as they are - names are not resolved.
    fix: Confirm each SID is the intended service account (Get-ADObject by SID) and clear any entry nobody owns.
    refs: [MITRE-ATTACK:T1558, NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 8192 }
        - { field: userAccountControl, op: noflag, value: 67108864 }
        - { field: msDS-AllowedToActOnBehalfOfOtherIdentity, op: exists }
        - not: { field: msDS-AllowedToActOnBehalfOfOtherIdentity, op: match, value: '^(S-1-1-0|S-1-5-7|S-1-5-11|S-1-5-32-545)$|^S-1-5-21-[0-9-]+-(513|514|515)$' }
    evidence: "{dNSHostName} - delegation allowed to {msDS-AllowedToActOnBehalfOfOtherIdentity}"

  - id: AD-COMP-PASSWORD-NOT-REQUIRED
    title: Enabled computer account allowed to have an empty password
    category: IAM
    severity: high
    entity: computer
    why: PASSWD_NOTREQD lets the account carry an empty password regardless of policy; a computer account pre-created that way and never joined may have none, and a computer identity is enough for resource-based delegation and for many service permissions. AD-USER-PASSWORD-NOT-REQUIRED covers user accounts.
    fix: Clear the flag and reset the machine password (on the host, or by rejoining); find the provisioning tool or script that creates accounts this way.
    refs: [NIST-800-53:IA-5, MITRE-ATTACK:T1078.002]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each: { field: userAccountControl, op: flag, value: 32 }
    evidence: "{dNSHostName} ({sAMAccountName}) - PASSWD_NOTREQD set, password last set {pwdLastSet}"

  - id: AD-COMP-LAPS-LEGACY
    title: Active Windows computer still on legacy LAPS only
    lens: both
    category: LCM
    severity: low
    entity: computer
    why: Legacy LAPS is out of support and keeps the local administrator password unencrypted in the directory, readable by anyone granted the attribute; Windows LAPS is built into current Windows and can encrypt it.
    fix: Deploy the Windows LAPS policy with password encryption and retire the legacy client-side extension; keep the legacy attributes readable until every computer has moved.
    refs: [NIST-800-53:SA-22, NIST-800-53:IA-5(1), MITRE-ATTACK:T1078.003]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 8192 }
        - { field: userAccountControl, op: noflag, value: 67108864 }
        - { field: operatingSystem, op: match, value: '^Windows' }
        - { field: lastLogonTimestamp, op: age-lt, value: 180, threshold: ad.active-computer-days }
        - { field: ms-Mcs-AdmPwdExpirationTime, op: exists }
        - { field: msLAPS-PasswordExpirationTime, op: absent }
    evidence: "{dNSHostName} - {operatingSystem}, legacy LAPS expiry {ms-Mcs-AdmPwdExpirationTime}, no Windows LAPS"

  - id: AD-COMP-DISABLED-LONG
    title: Disabled computer accounts untouched for half a year
    lens: maintenance
    category: LCM
    severity: low
    entity: computer
    why: Disabled computer objects past any retention period still count as assets, keep their DNS records and delegations, and can be re-enabled.
    fix: Delete them together with their DNS records.
    refs: [NIST-800-53:CM-8]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{UAC:2})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, whenChanged]
      key: sAMAccountName
      name: dNSHostName
    count:
      op: gt
      value: 0
      threshold: ad.disabled-computers-retained-max
      where: { field: whenChanged, op: age-gt, value: 180, threshold: ad.disabled-computer-retention-days }
    evidence: "{count} disabled computers unchanged for over half a year, for example {sample}"

  # ---------------------------------------------------------------- managed service accounts

  # Group and standalone managed service accounts are neither persons nor computers by category, so
  # the user and computer inventories do not see them; one query feeds the three rules below.

  - id: AD-GMSA-UNUSED
    title: Managed service account that has not authenticated for months
    lens: maintenance
    category: HYG
    severity: low
    entity: user
    why: A managed service account created months ago with no recent logon was provisioned for a service that was never deployed or has been removed; the hosts allowed to retrieve its password still can.
    fix: Remove it from the hosts that use it (Uninstall-ADServiceAccount), then delete it.
    refs: [NIST-800-53:AC-2(3)]
    query:
      protocol: ldap
      filter: '(|(objectClass=msDS-GroupManagedServiceAccount)(objectClass=msDS-ManagedServiceAccount))'
      attributes: [sAMAccountName, lastLogonTimestamp, whenCreated, userAccountControl, msDS-ManagedPasswordInterval, servicePrincipalName]
      key: sAMAccountName
    each:
      all:
        - { field: userAccountControl, op: noflag, value: 2 }
        - { field: whenCreated, op: age-gt, value: 90, threshold: ad.gmsa-unused-days }
        - any:
            - { field: lastLogonTimestamp, op: absent }
            - { field: lastLogonTimestamp, op: age-gt, value: 90, threshold: ad.gmsa-unused-days }
    evidence: "{sAMAccountName} - created {whenCreated}, last logon '{lastLogonTimestamp}'"

  - id: AD-GMSA-LONG-INTERVAL
    title: Group managed service account rotates its password rarely
    category: IAM
    severity: low
    entity: user
    why: The password change interval is fixed when the account is created; a long one leaves the same password valid for that whole period. No value means the 30-day default and is not reported.
    fix: Recreate the account with the default interval and move the service to it.
    refs: [NIST-800-53:IA-5(1)]
    query:
      protocol: ldap
      filter: '(|(objectClass=msDS-GroupManagedServiceAccount)(objectClass=msDS-ManagedServiceAccount))'
      attributes: [sAMAccountName, lastLogonTimestamp, whenCreated, userAccountControl, msDS-ManagedPasswordInterval, servicePrincipalName]
      key: sAMAccountName
    each: { field: msDS-ManagedPasswordInterval, op: gt, value: 30, threshold: ad.gmsa-max-interval-days }
    evidence: "{sAMAccountName} - password interval {msDS-ManagedPasswordInterval} days"

  - id: AD-GMSA-NONE
    title: No managed service accounts exist
    kind: missing
    lens: both
    category: IAM
    severity: info
    entity: domain
    why: Without managed service accounts every service runs on a password a person set, which is what the Kerberoasting rules find. A pointer to the fix, not a fault; an empty answer can also mean the reader cannot see the Managed Service Accounts container.
    fix: Create the KDS root key and start moving services with SPNs to group managed service accounts.
    refs: [NIST-800-53:IA-5(1), MITRE-ATTACK:T1558.003]
    query:
      protocol: ldap
      filter: '(|(objectClass=msDS-GroupManagedServiceAccount)(objectClass=msDS-ManagedServiceAccount))'
      attributes: [sAMAccountName, lastLogonTimestamp, whenCreated, userAccountControl, msDS-ManagedPasswordInterval, servicePrincipalName]
      key: sAMAccountName
    count: none
    evidence: "{count} managed service accounts found"

  # ---------------------------------------------------------------- domain controllers (computer objects)

  - id: AD-DC-NOT-IN-DC-OU
    title: Domain controller account outside the Domain Controllers OU
    lens: both
    category: CFG
    severity: high
    entity: computer
    why: A DC object moved out of the Domain Controllers OU stops receiving the DC policy (user rights, audit) and may receive policies meant for member servers.
    fix: Move the account back into OU=Domain Controllers.
    refs: [NIST-800-53:CM-6]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - any:
            - { field: userAccountControl, op: flag, value: 8192 }
            - { field: userAccountControl, op: flag, value: 67108864 }
        - { field: distinguishedName, op: notmatch, value: '^CN=[^,]+,OU=Domain Controllers,DC=' }
    evidence: "{dNSHostName} - {distinguishedName}"

  - id: AD-DC-STALE
    title: Domain controller account not seen recently
    kind: broken
    lens: maintenance
    category: AVL
    severity: high
    entity: computer
    why: A domain controller that has not authenticated for weeks is offline or was removed without metadata cleanup; clients and replication partners still try to use it.
    fix: Bring the DC back or remove it properly (demote, or metadata cleanup and DNS record removal).
    refs: [NIST-800-53:CP-10, NIST-800-53:CM-8]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - any:
            - { field: userAccountControl, op: flag, value: 8192 }
            - { field: userAccountControl, op: flag, value: 67108864 }
        - any:
            - { field: lastLogonTimestamp, op: age-gt, value: 30, threshold: ad.stale-dc-days }
            - { field: lastLogonTimestamp, op: absent }
    evidence: "{dNSHostName} - last logon '{lastLogonTimestamp}'"

  - id: AD-DC-RBCD
    title: Domain controller account carries resource-based delegation rights
    category: AUT
    severity: critical
    entity: computer
    why: Whoever is listed in msDS-AllowedToActOnBehalfOfOtherIdentity on a DC can obtain tickets to that DC as any user, including domain administrators.
    fix: Treat as an incident - clear the attribute and find out who wrote it.
    refs: [MITRE-ATTACK:T1558, NIST-800-53:AC-6]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - any:
            - { field: userAccountControl, op: flag, value: 8192 }
            - { field: userAccountControl, op: flag, value: 67108864 }
        - { field: msDS-AllowedToActOnBehalfOfOtherIdentity, op: exists }
    evidence: "{dNSHostName} - msDS-AllowedToActOnBehalfOfOtherIdentity is set"

  - id: AD-DC-COUNT
    title: Fewer writable domain controllers than required
    kind: missing
    lens: maintenance
    category: AVL
    severity: high
    entity: computer
    why: With a single writable domain controller its failure stops authentication and directory changes, and recovery depends entirely on backups.
    fix: Add domain controllers so the domain survives the loss of any one of them.
    refs: [NIST-800-53:CP-7, NIST-800-53:SC-36]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED}{UAC:8192})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl]
      key: sAMAccountName
      name: dNSHostName
    count: { op: lt, value: 2, threshold: ad.min-dcs }
    evidence: "{count} writable domain controllers: {sample}"

  - id: AD-DC-MACHINE-PASSWORD-OLD
    title: Active domain controller whose own machine password stopped rotating
    kind: broken
    lens: both
    category: AUT
    severity: medium
    entity: computer
    why: A domain controller changes its machine password about every 30 days. One that is online but has not changed it for weeks usually has a broken secure channel to its partners, or "refuse machine account password changes" set by policy. AD-COMP-MACHINE-PASSWORD-STUCK leaves domain controllers out.
    fix: Check the secure channel and the Netlogon log on the DC, and the DC policy settings that refuse or disable machine password changes.
    refs: [NIST-800-53:IA-5(1), PingCastle:S-PwdLastSet-DC]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - any:
            - { field: userAccountControl, op: flag, value: 8192 }
            - { field: userAccountControl, op: flag, value: 67108864 }
        - { field: lastLogonTimestamp, op: age-lt, value: 30, threshold: ad.machine-active-days }
        - { field: pwdLastSet, op: ne, value: 0 }
        - { field: pwdLastSet, op: age-gt, value: 45, threshold: ad.dc-password-max-age-days }
    evidence: "{dNSHostName} - machine password set {pwdLastSet}, last logon {lastLogonTimestamp}"

  - id: AD-DC-DSRM-NOT-MANAGED
    title: Writable domain controller without a LAPS-managed DSRM password
    kind: missing
    category: IAM
    severity: low
    entity: computer
    why: Windows LAPS can rotate and back up the Directory Services Restore Mode administrator password of each domain controller. Without it the DSRM password is usually the one typed at promotion, known to whoever promoted the DC and the same for years.
    fix: Enable DSRM password backup with Windows LAPS by policy on the Domain Controllers OU (domain functional level 2016 for encrypted storage).
    refs: [NIST-800-53:IA-5(1), CIS-Controls-v8:5.2]
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED})'
      attributes: [sAMAccountName, dNSHostName, operatingSystem, operatingSystemVersion, lastLogonTimestamp, userAccountControl, pwdLastSet, whenCreated, adminCount, servicePrincipalName, msDS-SupportedEncryptionTypes, msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity, ms-Mcs-AdmPwdExpirationTime, msLAPS-PasswordExpirationTime, objectSid]
      key: sAMAccountName
      name: dNSHostName
    each:
      all:
        - { field: userAccountControl, op: flag, value: 8192 }
        - { field: lastLogonTimestamp, op: age-lt, value: 30, threshold: ad.machine-active-days }
        - { field: msLAPS-PasswordExpirationTime, op: absent }
    evidence: "{dNSHostName} - no Windows LAPS expiry attribute"

  - id: AD-RODC-REVEAL-BROAD
    title: Read-only DC may cache passwords of a broad or administrative group
    category: IAM
    severity: medium
    entity: computer
    why: Read-only DCs sit where physical security is weak, and a stolen one gives up every password it was allowed to cache. Builtin groups and Everyone, Authenticated Users or Anonymous are matched by container and SID; the domain-wide and administrative groups by their default names, which ad.rodc-reveal-broad-pattern can replace on a localised domain.
    fix: Allow only a site-specific group holding the users and computers that actually log on at that location.
    refs: [NIST-800-53:AC-6, NIST-800-53:PE-3, MITRE-ATTACK:T1003, PingCastle:P-RODCRevealOnDemand]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED}{UAC:67108864})'
      attributes: [sAMAccountName, dNSHostName, msDS-RevealOnDemandGroup, msDS-NeverRevealGroup, managedBy]
      key: sAMAccountName
      name: dNSHostName
    each:
      any:
        - { field: msDS-RevealOnDemandGroup, op: match, value: ',CN=Builtin,DC=' }
        - { field: msDS-RevealOnDemandGroup, op: match, value: '^CN=(S-1-1-0|S-1-5-7|S-1-5-11),CN=ForeignSecurityPrincipals,' }
        - { field: msDS-RevealOnDemandGroup, op: match, value: '^CN=(Domain Users|Domain Computers|Domain Admins|Enterprise Admins|Schema Admins|Domain Controllers),CN=Users,', threshold: ad.rodc-reveal-broad-pattern }
    evidence: "{dNSHostName} - may cache {msDS-RevealOnDemandGroup}"

  - id: AD-RODC-NEVER-REVEAL-MISSING
    title: Read-only DC deny list lost its default protection
    category: IAM
    severity: medium
    entity: computer
    why: By default each read-only DC is denied the passwords of the builtin administrative and operator groups and of the Denied RODC Password Replication Group. An empty deny list, or one without any builtin group, means administrator secrets may be cached on it. The check is name-free; a removed Denied RODC Password Replication Group alone is not detected.
    fix: Restore the default denied groups (Denied RODC Password Replication Group, Administrators, Account, Server and Backup Operators).
    refs: [NIST-800-53:AC-6, MITRE-ATTACK:T1003, PingCastle:P-RODCNeverReveal]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(&{COMPUTER}{ENABLED}{UAC:67108864})'
      attributes: [sAMAccountName, dNSHostName, msDS-RevealOnDemandGroup, msDS-NeverRevealGroup, managedBy]
      key: sAMAccountName
      name: dNSHostName
    each:
      any:
        - { field: msDS-NeverRevealGroup, op: absent }
        - not: { field: msDS-NeverRevealGroup, op: match, value: ',CN=Builtin,DC=' }
    evidence: "{dNSHostName} - denied list '{msDS-NeverRevealGroup}'"

  # ---------------------------------------------------------------- fine-grained password policies

  - id: AD-PSO-MIN-LENGTH
    title: Fine-grained password policy allows short passwords
    category: IAM
    severity: medium
    entity: policy
    why: Fine-grained policies usually cover administrators and service accounts, which need longer passwords than the domain floor, not shorter. The container is readable by administrators only by default.
    fix: Raise msDS-MinimumPasswordLength on the policy.
    refs: [NIST-800-53:IA-5(1)]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Password Settings Container,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=msDS-PasswordSettings)'
      attributes: [cn, msDS-PasswordSettingsPrecedence, msDS-MinimumPasswordLength, msDS-PasswordHistoryLength, msDS-PasswordComplexityEnabled, msDS-PasswordReversibleEncryptionEnabled, msDS-LockoutThreshold, msDS-PSOAppliesTo, msDS-MaximumPasswordAge, msDS-MinimumPasswordAge]
      key: cn
    each: { field: msDS-MinimumPasswordLength, op: lt, value: 14, threshold: ad.pso-min-password-length }
    evidence: "{cn} - minimum length {msDS-MinimumPasswordLength}, applies to {msDS-PSOAppliesTo}"

  - id: AD-PSO-REVERSIBLE-ENCRYPTION
    title: Fine-grained password policy stores passwords with reversible encryption
    category: IAM
    severity: critical
    entity: policy
    why: Every account the policy applies to gets its password stored in decryptable form.
    fix: Set msDS-PasswordReversibleEncryptionEnabled to FALSE and force password changes for the covered accounts.
    refs: [NIST-800-53:IA-5(1)]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Password Settings Container,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=msDS-PasswordSettings)'
      attributes: [cn, msDS-PasswordSettingsPrecedence, msDS-MinimumPasswordLength, msDS-PasswordHistoryLength, msDS-PasswordComplexityEnabled, msDS-PasswordReversibleEncryptionEnabled, msDS-LockoutThreshold, msDS-PSOAppliesTo, msDS-MaximumPasswordAge, msDS-MinimumPasswordAge]
      key: cn
    each: { field: msDS-PasswordReversibleEncryptionEnabled, op: eq, value: 'TRUE' }
    evidence: "{cn} - reversible encryption on, applies to {msDS-PSOAppliesTo}"

  - id: AD-PSO-COMPLEXITY-OFF
    title: Fine-grained password policy has complexity off without long passphrases
    category: IAM
    severity: medium
    entity: policy
    why: Without complexity and without a passphrase-length minimum, the policy accepts short dictionary words for the accounts it covers.
    fix: Turn complexity on or raise the minimum length to passphrase level.
    refs: [NIST-800-53:IA-5(1)]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Password Settings Container,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=msDS-PasswordSettings)'
      attributes: [cn, msDS-PasswordSettingsPrecedence, msDS-MinimumPasswordLength, msDS-PasswordHistoryLength, msDS-PasswordComplexityEnabled, msDS-PasswordReversibleEncryptionEnabled, msDS-LockoutThreshold, msDS-PSOAppliesTo, msDS-MaximumPasswordAge, msDS-MinimumPasswordAge]
      key: cn
    each:
      all:
        - { field: msDS-PasswordComplexityEnabled, op: eq, value: 'FALSE' }
        - { field: msDS-MinimumPasswordLength, op: lt, value: 15, threshold: ad.passphrase-min-length }
    evidence: "{cn} - complexity off, minimum length {msDS-MinimumPasswordLength}"

  # The fine-grained ages below are raw 100-nanosecond ticks (negative; one day is -864000000000 and
  # "never" is the most negative value): the runner converts only the domain-head durations to days.

  - id: AD-PSO-NO-LOCKOUT
    title: Fine-grained password policy never locks accounts out
    category: IAM
    severity: medium
    entity: policy
    why: With a lockout threshold of 0 the accounts the policy covers - usually administrators or services - can be guessed against without limit while the domain policy locks everyone else.
    fix: Set a lockout threshold on the policy, or accept it only for service accounts with long random passwords and record why.
    refs: [MITRE-ATTACK:T1110.003, NIST-800-53:AC-7]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Password Settings Container,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=msDS-PasswordSettings)'
      attributes: [cn, msDS-PasswordSettingsPrecedence, msDS-MinimumPasswordLength, msDS-PasswordHistoryLength, msDS-PasswordComplexityEnabled, msDS-PasswordReversibleEncryptionEnabled, msDS-LockoutThreshold, msDS-PSOAppliesTo, msDS-MaximumPasswordAge, msDS-MinimumPasswordAge]
      key: cn
    each: { field: msDS-LockoutThreshold, op: eq, value: 0 }
    evidence: "{cn} - no lockout, applies to {msDS-PSOAppliesTo}"

  - id: AD-PSO-HISTORY-SHORT
    title: Fine-grained password policy keeps a short password history
    category: IAM
    severity: low
    entity: policy
    why: With a short history the covered accounts can cycle back to a password that has already leaked.
    fix: Raise msDS-PasswordHistoryLength on the policy to the threshold value (24 by default).
    refs: [NIST-800-53:IA-5(1)]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Password Settings Container,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=msDS-PasswordSettings)'
      attributes: [cn, msDS-PasswordSettingsPrecedence, msDS-MinimumPasswordLength, msDS-PasswordHistoryLength, msDS-PasswordComplexityEnabled, msDS-PasswordReversibleEncryptionEnabled, msDS-LockoutThreshold, msDS-PSOAppliesTo, msDS-MaximumPasswordAge, msDS-MinimumPasswordAge]
      key: cn
    each: { field: msDS-PasswordHistoryLength, op: lt, value: 24, threshold: ad.password-history-min }
    evidence: "{cn} - history {msDS-PasswordHistoryLength}, applies to {msDS-PSOAppliesTo}"

  - id: AD-PSO-MAX-AGE
    title: Fine-grained password policy never expires passwords, or keeps them over a year
    category: IAM
    severity: medium
    entity: policy
    why: Fine-grained policies usually cover service and administrator accounts - exactly the passwords that should change. The value is compared in ticks; anything more negative than -315360000000000 (365 days), including "never", fires.
    fix: Set a maximum password age on the policy and move service accounts to group managed service accounts.
    refs: [NIST-800-53:IA-5(1)]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Password Settings Container,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=msDS-PasswordSettings)'
      attributes: [cn, msDS-PasswordSettingsPrecedence, msDS-MinimumPasswordLength, msDS-PasswordHistoryLength, msDS-PasswordComplexityEnabled, msDS-PasswordReversibleEncryptionEnabled, msDS-LockoutThreshold, msDS-PSOAppliesTo, msDS-MaximumPasswordAge, msDS-MinimumPasswordAge]
      key: cn
    each: { field: msDS-MaximumPasswordAge, op: lt, value: -315360000000000 }
    evidence: "{cn} - maximum age {msDS-MaximumPasswordAge} ticks, applies to {msDS-PSOAppliesTo}"

  - id: AD-PSO-MIN-AGE-ZERO
    title: Fine-grained password policy lets passwords be changed again immediately
    category: IAM
    severity: low
    entity: policy
    why: A minimum age of 0 lets a covered account change its password repeatedly and return to the old one, defeating the history setting.
    fix: Set the minimum password age on the policy to at least one day.
    refs: [NIST-800-53:IA-5(1)]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Password Settings Container,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=msDS-PasswordSettings)'
      attributes: [cn, msDS-PasswordSettingsPrecedence, msDS-MinimumPasswordLength, msDS-PasswordHistoryLength, msDS-PasswordComplexityEnabled, msDS-PasswordReversibleEncryptionEnabled, msDS-LockoutThreshold, msDS-PSOAppliesTo, msDS-MaximumPasswordAge, msDS-MinimumPasswordAge]
      key: cn
    each: { field: msDS-MinimumPasswordAge, op: eq, value: 0 }
    evidence: "{cn} - minimum age 0, applies to {msDS-PSOAppliesTo}"

  - id: AD-PSO-NOT-APPLIED
    title: Fine-grained password policy applies to nobody
    lens: maintenance
    category: CFG
    severity: low
    entity: policy
    why: A policy with no target was never finished, or its group was deleted; the accounts it was meant for run on the domain policy while everyone believes they are covered.
    fix: Assign the policy to its group, or delete it.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Password Settings Container,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=msDS-PasswordSettings)'
      attributes: [cn, msDS-PasswordSettingsPrecedence, msDS-MinimumPasswordLength, msDS-PasswordHistoryLength, msDS-PasswordComplexityEnabled, msDS-PasswordReversibleEncryptionEnabled, msDS-LockoutThreshold, msDS-PSOAppliesTo, msDS-MaximumPasswordAge, msDS-MinimumPasswordAge]
      key: cn
    each: { field: msDS-PSOAppliesTo, op: absent }
    evidence: "{cn} - msDS-PSOAppliesTo is empty"

  # ---------------------------------------------------------------- sites, replication and FSMO

  - id: AD-SITE-SUBNET-NO-SITE
    title: Subnet object not associated with a site
    lens: maintenance
    category: CFG
    severity: low
    entity: domain
    why: Clients in a subnet with no site find no local domain controller and may authenticate across slow links.
    fix: Assign the subnet to the site that serves it, or delete it.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Subnets,CN=Sites,{CONFIGDN}'
      scope: onelevel
      filter: '(&(objectClass=subnet)(!(siteObject=*)))'
      attributes: [cn, description]
      key: cn
    each: any
    evidence: "Subnet {cn} has no site"

  - id: AD-SITE-NO-SUBNET
    title: Site with no subnet
    lens: maintenance
    category: CFG
    severity: low
    entity: domain
    why: No client can be placed in a site without subnets, so its domain controllers serve nobody locally - or the site is a leftover of a closed location.
    fix: Associate the site's subnets with it, or move its domain controllers and delete the site.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Sites,{CONFIGDN}'
      scope: onelevel
      filter: '(objectClass=site)'
      attributes: [cn, siteObjectBL, gPLink]
      key: cn
    each: { field: siteObjectBL, op: absent }
    evidence: "Site {cn} has no subnet"

  - id: AD-SITE-GPO-LINK
    title: Group Policy linked to a site
    lens: both
    category: CFG
    severity: low
    entity: domain
    why: A site link applies the GPO to every computer in that site, from every domain of the forest, and almost nobody reviews site links.
    fix: Move the settings to domain or OU links unless site scope is the intent, and document the ones that stay.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Sites,{CONFIGDN}'
      scope: onelevel
      filter: '(objectClass=site)'
      attributes: [cn, siteObjectBL, gPLink]
      key: cn
    each: { field: gPLink, op: match, value: 'LDAP://' }
    evidence: "Site {cn} - gPLink {gPLink}"

  - id: AD-SITE-SERVER-ORPHAN
    title: Site server object without a live domain controller account
    kind: broken
    lens: maintenance
    category: AVL
    severity: medium
    entity: domain
    why: A server object under Sites points at its DC's computer account; with the reference gone (the link drops when the account is deleted) or pointing at a deleted object, the DC was removed without metadata cleanup or the object was made by hand. If it still holds NTDS Settings, partners keep trying to replicate with it.
    fix: Run metadata cleanup for the missing DC (or delete the server object in Sites and Services when it has no NTDS Settings child), then remove its DNS records.
    refs: [NIST-800-53:CP-10, NIST-800-53:CM-8]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Sites,{CONFIGDN}'
      filter: '(objectClass=server)'
      attributes: [cn, serverReference, dNSHostName, bridgeheadTransportList, whenChanged]
      key: distinguishedName
      name: cn
    each:
      any:
        - { field: serverReference, op: absent }
        - { field: serverReference, op: match, value: '(\\0A|\n)DEL:' }
    evidence: "{distinguishedName} - serverReference '{serverReference}', changed {whenChanged}"

  - id: AD-SITE-BRIDGEHEAD-PREFERRED
    title: Domain controller set as a preferred bridgehead
    lens: maintenance
    category: AVL
    severity: low
    entity: domain
    why: Once a site has preferred bridgeheads the topology generator uses only them; if they are all down, replication into and out of the site stops instead of failing over. Usually a forgotten design choice.
    fix: Remove the preferred-bridgehead setting unless the site's firewall design needs it; if it does, name at least two per transport.
    refs: [NIST-800-53:CP-10]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Sites,{CONFIGDN}'
      filter: '(objectClass=server)'
      attributes: [cn, serverReference, dNSHostName, bridgeheadTransportList, whenChanged]
      key: distinguishedName
      name: cn
    each: { field: bridgeheadTransportList, op: exists }
    evidence: "{dNSHostName} - preferred bridgehead for {bridgeheadTransportList}"

  - id: AD-SITELINK-SINGLE-SITE
    title: Site link that links fewer than two sites
    lens: maintenance
    category: HYG
    severity: low
    entity: domain
    why: A site link with one site connects nothing - usually what is left after a site was removed - and confuses anyone reading the replication costs. The default link is left out because a single-site forest has only that one.
    fix: Delete the link, or add the site it is meant to reach.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Inter-Site Transports,CN=Sites,{CONFIGDN}'
      filter: '(objectClass=siteLink)'
      attributes: [cn, siteList, replInterval, cost, options]
      key: distinguishedName
      name: cn
    each:
      all:
        - { field: cn, op: ne, value: DEFAULTIPSITELINK }
        - any:
            - { field: siteList, op: absent }
            - { field: siteList, op: size-lt, value: 2 }
    evidence: "Site link {cn} - sites '{siteList}'"

  - id: AD-SITELINK-SLOW
    title: Site link replicates less often than every three hours
    lens: maintenance
    category: AVL
    severity: low
    entity: domain
    why: Password resets, disabled accounts and group changes take hours to reach the sites behind a slow link - a leaver can keep working there in the meantime.
    fix: Lower the replication interval (15 minutes is common on current links) or enable change notification on the link.
    refs: [NIST-800-53:CP-10]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Inter-Site Transports,CN=Sites,{CONFIGDN}'
      filter: '(objectClass=siteLink)'
      attributes: [cn, siteList, replInterval, cost, options]
      key: distinguishedName
      name: cn
    each: { field: replInterval, op: gt, value: 180, threshold: ad.sitelink-max-interval-minutes }
    evidence: "Site link {cn} - every {replInterval} minutes"

  - id: AD-DC-NOT-GC
    title: Domain controller that is not a global catalog
    lens: maintenance
    category: AVL
    severity: low
    entity: domain
    why: In a single-domain forest every DC should be a global catalog; without one nearby, UPN logons and universal group lookups fail or cross slow links when the GC is down. Multi-domain forests may leave some DCs out by design - accept those findings.
    fix: Enable "Global Catalog" on the DC's NTDS Settings object and let the partial replicas build.
    refs: [NIST-800-53:CP-10, NIST-800-53:SC-36]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Sites,{CONFIGDN}'
      filter: '(objectClass=nTDSDSA)'
      attributes: [cn, options, msDS-HasDomainNCs]
      key: distinguishedName
    each:
      any:
        - { field: options, op: absent }
        - { field: options, op: noflag, value: 1 }
    evidence: "{distinguishedName} - options '{options}'"

  - id: AD-REPL-CONNECTION-UNMANAGED
    title: Replication connection that is manual or disabled
    lens: maintenance
    category: AVL
    severity: low
    entity: domain
    why: Hand-made connections are not maintained by the topology generator and outlive the design they were made for; disabled ones silently cut a replication path.
    fix: Delete manual connections so the KCC manages topology, or document why one must stay; re-enable or remove disabled ones. Read-only DC connections are excluded, and connections from deleted servers are reported by AD-REPL-CONNECTION-FROM-DELETED.
    refs: [NIST-800-53:CP-10]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Sites,{CONFIGDN}'
      filter: '(&(objectClass=nTDSConnection)(!(options:1.2.840.113556.1.4.803:=64))(|(!(options:1.2.840.113556.1.4.803:=1))(enabledConnection=FALSE)))'
      attributes: [cn, fromServer, options, enabledConnection]
      key: distinguishedName
    each:
      not: { field: fromServer, op: match, value: '(\\0A|\n)DEL:' }
    evidence: "{distinguishedName} - from {fromServer}, options '{options}', enabled '{enabledConnection}'"

  - id: AD-REPL-CONNECTION-FROM-DELETED
    title: Replication connection from a domain controller that no longer exists
    kind: broken
    lens: maintenance
    category: AVL
    severity: high
    entity: domain
    why: The connection's source is a deleted NTDS Settings object - a DC removed without cleanup. The destination keeps logging inbound replication failures and the topology still routes around a server that is gone. The topology generator removes its own such connections; the ones left are manual or disabled, which is the set this query reads.
    fix: Delete the connection object, let the KCC rebuild the topology, and finish the metadata cleanup of the missing DC.
    refs: [NIST-800-53:CP-10, NIST-800-53:CM-8]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Sites,{CONFIGDN}'
      filter: '(&(objectClass=nTDSConnection)(!(options:1.2.840.113556.1.4.803:=64))(|(!(options:1.2.840.113556.1.4.803:=1))(enabledConnection=FALSE)))'
      attributes: [cn, fromServer, options, enabledConnection]
      key: distinguishedName
    each: { field: fromServer, op: match, value: '(\\0A|\n)DEL:' }
    evidence: "{distinguishedName} - from {fromServer}"

  - id: AD-FSMO-DELETED-OWNER-DOMAIN
    title: Domain operations master role held by a deleted domain controller
    kind: broken
    lens: maintenance
    category: AVL
    severity: critical
    entity: domain
    why: The PDC emulator, RID master or infrastructure master role points at a removed DC, so password changes, RID allocation or cross-domain reference updates stop.
    fix: Seize the role onto a live domain controller.
    refs: [NIST-800-53:CP-10]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(fSMORoleOwner=*)'
      attributes: [fSMORoleOwner]
      key: distinguishedName
    each: { field: fSMORoleOwner, op: match, value: '(\\0A|\n)DEL:' }
    evidence: "{distinguishedName} - role owner {fSMORoleOwner}"

  - id: AD-FSMO-DELETED-OWNER-CONFIG
    title: Domain naming master role held by a deleted domain controller
    kind: broken
    lens: maintenance
    category: AVL
    severity: high
    entity: domain
    why: With the domain naming master on a removed DC no domain or application partition can be added or removed in the forest.
    fix: Seize the role onto a live domain controller in the forest root domain.
    refs: [NIST-800-53:CP-10]
    refresh: 7d
    query:
      protocol: ldap
      base: config
      filter: '(fSMORoleOwner=*)'
      attributes: [fSMORoleOwner]
      key: distinguishedName
    each: { field: fSMORoleOwner, op: match, value: '(\\0A|\n)DEL:' }
    evidence: "{distinguishedName} - role owner {fSMORoleOwner}"

  - id: AD-FSMO-DELETED-OWNER-SCHEMA
    title: Schema master role held by a deleted domain controller
    kind: broken
    lens: maintenance
    category: AVL
    severity: high
    entity: domain
    why: With the schema master on a removed DC the schema cannot be extended, which blocks adding newer domain controllers.
    fix: Seize the schema master role onto a live domain controller.
    refs: [NIST-800-53:CP-10]
    refresh: 7d
    query:
      protocol: ldap
      base: schema
      scope: base
      filter: '(objectClass=dMD)'
      attributes: [fSMORoleOwner, objectVersion]
      key: distinguishedName
    each: { field: fSMORoleOwner, op: match, value: '(\\0A|\n)DEL:' }
    evidence: "Schema master {fSMORoleOwner}"

  # ---------------------------------------------------------------- object hygiene

  - id: AD-HYG-CONFLICT-OBJECTS
    title: Replication conflict objects in the domain partition
    lens: maintenance
    category: HYG
    severity: low
    entity: domain
    why: CNF objects are duplicates created when two DCs wrote the same name; they can carry permissions and memberships that reviews miss.
    fix: Compare each conflict object with its original, keep the right one, and delete the other.
    refs: [NIST-800-53:CM-8]
    query:
      protocol: ldap
      filter: '(name=*\0ACNF:*)'
      attributes: [name, objectClass, whenCreated]
      key: distinguishedName
    each: any
    evidence: "{distinguishedName} - created {whenCreated}"

  - id: AD-HYG-LOSTANDFOUND
    title: Objects in the LostAndFound container
    lens: maintenance
    category: HYG
    severity: low
    entity: domain
    why: Objects land here when their parent was deleted on another DC during replication; they are outside every OU, policy and delegation.
    fix: Move each object to its proper OU or delete it.
    refs: [NIST-800-53:CM-8]
    query:
      protocol: ldap
      base: 'CN=LostAndFound,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=*)'
      attributes: [name, objectClass, whenCreated]
      key: distinguishedName
    each: any
    evidence: "{distinguishedName} - created {whenCreated}"

  - id: AD-HYG-FSP-UNUSED
    title: Foreign security principals that are members of nothing
    lens: maintenance
    category: HYG
    severity: low
    entity: domain
    why: A foreign security principal exists only to put an account from another domain into a group here. One that belongs to no group outlived that use, and some come from domains that no longer exist - resolving them is not done here.
    fix: Delete the unused foreign security principal objects; any that no longer resolve to a name are certainly dead.
    refs: [NIST-800-53:CM-8, NIST-800-53:AC-2(3)]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=ForeignSecurityPrincipals,{DOMAINDN}'
      scope: onelevel
      filter: '(&(objectClass=foreignSecurityPrincipal)(!(memberOf=*)))'
      attributes: [cn, whenCreated]
      key: cn
    count:
      op: gt
      value: 0
      threshold: ad.unused-fsp-max
      where: { field: cn, op: match, value: '^S-1-5-21-' }
    evidence: "{count} unused foreign security principals, for example {sample}"

  # ---------------------------------------------------------------- group policy objects

  - id: AD-GPO-ALL-DISABLED
    title: GPO with both user and computer settings disabled
    lens: maintenance
    category: HYG
    severity: low
    entity: gpo
    why: A fully disabled GPO does nothing but still costs processing where it is linked and confuses reviews.
    fix: Back it up and delete it, or re-enable the half that is meant to apply.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Policies,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=groupPolicyContainer)'
      attributes: [cn, displayName, flags, versionNumber, gPCFileSysPath, gPCMachineExtensionNames, gPCUserExtensionNames, whenChanged]
      key: cn
      name: displayName
    each: { field: flags, op: eq, value: 3 }
    evidence: "{displayName} ({cn}) - flags {flags}"

  - id: AD-GPO-PATH-OUTSIDE-SYSVOL
    title: GPO file path points outside SYSVOL
    category: CFG
    severity: high
    entity: gpo
    why: Clients load the policy files from gPCFileSysPath; a path to another share lets whoever controls that share push settings and scripts to every computer the GPO applies to.
    fix: Point gPCFileSysPath back to the domain's SYSVOL Policies folder and find out who changed it.
    refs: [MITRE-ATTACK:T1484.001, NIST-800-53:CM-5]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Policies,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=groupPolicyContainer)'
      attributes: [cn, displayName, flags, versionNumber, gPCFileSysPath, gPCMachineExtensionNames, gPCUserExtensionNames, whenChanged]
      key: cn
      name: displayName
    each: { field: gPCFileSysPath, op: notmatch, value: '^\\\\[^\\]+\\sysvol\\' }
    evidence: "{displayName} ({cn}) - {gPCFileSysPath}"

  - id: AD-GPO-EMPTY
    title: GPO that has never been edited (version 0)
    lens: maintenance
    category: HYG
    severity: low
    entity: gpo
    why: A GPO at version 0 has never held a setting; where it is linked it still costs a lookup at every refresh and it misleads anyone reading the policy map.
    fix: Delete the GPO, or finish configuring it if it was created for a purpose.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Policies,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=groupPolicyContainer)'
      attributes: [cn, displayName, flags, versionNumber, gPCFileSysPath, gPCMachineExtensionNames, gPCUserExtensionNames, whenChanged]
      key: cn
      name: displayName
    each: { field: versionNumber, op: eq, value: 0 }
    evidence: "{displayName} ({cn}) - versionNumber {versionNumber}"

  - id: AD-GPO-DDCP-LINKED-OUTSIDE-DC-OU
    title: Default Domain Controllers Policy linked outside the Domain Controllers OU
    category: CFG
    severity: high
    entity: domain
    why: The domain controller policy carries DC user rights; linked at the domain root or on member OUs it replaces those rights on ordinary servers and workstations, removing privileges services need and granting DC-grade rights where they do not belong.
    fix: Remove every link of the Default Domain Controllers Policy except the one on OU=Domain Controllers, after checking what the affected computers will lose.
    refs: [NIST-800-53:CM-6, NIST-800-53:AC-6]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(&(|(objectClass=organizationalUnit)(objectClass=domainDNS))(gPLink=*6AC1786C-016F-11D2-945F-00C04FB984F9*))'
      attributes: [name, gPLink]
      key: distinguishedName
    each: { field: distinguishedName, op: notmatch, value: '^OU=Domain Controllers,DC=' }
    evidence: "{distinguishedName} links the Default Domain Controllers Policy"

  - id: AD-GPO-ENFORCED-AT-ROOT
    title: GPO link enforced at the domain root
    lens: both
    category: CFG
    severity: low
    entity: domain
    why: An enforced link at the domain root wins over every OU-level GPO, including the Domain Controllers OU and server baselines, so settings such as time source, screen lock or firewall cannot be set differently where they must be.
    fix: Review each enforced root link; drop the enforcement unless the setting truly must win everywhere, and check its effect on the Domain Controllers OU.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      scope: base
      filter: '(objectClass=domainDNS)'
      attributes: [name, minPwdLength, pwdHistoryLength, pwdProperties, lockoutThreshold, ms-DS-MachineAccountQuota, msDS-Behavior-Version, gPLink, maxPwdAge, minPwdAge, wellKnownObjects]
      key: distinguishedName
      name: name
    each: { field: gPLink, op: match, value: ';[23]\]' }
    evidence: "{name} - gPLink {gPLink}"

  - id: AD-GPO-DEFAULT-POLICY-COMPUTER-DISABLED
    title: Default domain or domain controller policy has its computer settings disabled
    category: CFG
    severity: high
    entity: gpo
    why: Password, lockout and Kerberos policy come from the computer half of the root-linked policy, and domain controller user rights and audit from the computer half of the DC policy. With that half disabled the domain silently runs on built-in defaults. The two policies are found by their fixed GUIDs.
    fix: Re-enable the computer settings, or confirm that another root-linked GPO carries the password policy and the DC OU has its own baseline, and record why the default is disabled.
    refs: [NIST-800-53:CM-6, NIST-800-53:AC-7, CIS-Controls-v8:4.1]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Policies,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=groupPolicyContainer)'
      attributes: [cn, displayName, flags, versionNumber, gPCFileSysPath, gPCMachineExtensionNames, gPCUserExtensionNames, whenChanged]
      key: cn
      name: displayName
    each:
      all:
        - { field: cn, op: in, value: ['{31B2F340-016F-11D2-945F-00C04FB984F9}', '{6AC1786C-016F-11D2-945F-00C04FB984F9}'] }
        - { field: flags, op: flag, value: 2 }
    evidence: "{displayName} ({cn}) - flags {flags}"

  # One query over the policy containers (with their client-side extension lists) feeds every GPO
  # rule and AD-POP-GPOS-NONE. The lists name the extensions a GPO uses; the settings themselves
  # are in SYSVOL, which LDAP does not read, so the rules below say which GPOs to open.

  - id: AD-GPO-GPP-CPASSWORD-CAPABLE
    title: GPO uses a preference extension that can hold a stored password
    category: IAM
    severity: info
    entity: gpo
    why: Local Users and Groups, Drive Maps, Scheduled Tasks, Services and Data Sources preference items could store a password (cpassword) that every domain user can read from SYSVOL and decrypt with a published key. New passwords cannot be saved since the 2014 fix, but items written before it stay until someone removes them. Most GPOs listed here hold none - this is the list to open once.
    fix: Search the GPO's SYSVOL folder for cpassword; remove any item that has one, rotate the password it held, and use LAPS or a group managed service account instead. Accept the finding once the GPO is confirmed clean.
    refs: [MITRE-ATTACK:T1552.006, NIST-800-53:IA-5(7), MS-KB:2962486, PingCastle:A-PwdGPO]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Policies,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=groupPolicyContainer)'
      attributes: [cn, displayName, flags, versionNumber, gPCFileSysPath, gPCMachineExtensionNames, gPCUserExtensionNames, whenChanged]
      key: cn
      name: displayName
    each:
      any:
        - { field: gPCMachineExtensionNames, op: match, value: '17D89FEC-5C44-4972-B12D-241CAEF74509|5794DAFD-BE60-433F-88A2-1A31939AC01F|AADCED64-746C-4633-A97C-D61349046527|91FBB303-0CD5-4055-BF42-E512A681B325|728EE579-943C-4519-9EF7-AB56765798ED' }
        - { field: gPCUserExtensionNames, op: match, value: '17D89FEC-5C44-4972-B12D-241CAEF74509|5794DAFD-BE60-433F-88A2-1A31939AC01F|AADCED64-746C-4633-A97C-D61349046527|91FBB303-0CD5-4055-BF42-E512A681B325|728EE579-943C-4519-9EF7-AB56765798ED' }
    evidence: "{displayName} ({cn}) - uses a password-capable preference extension, changed {whenChanged}"

  - id: AD-GPO-GPP-LOCAL-GROUPS
    title: GPO changes local groups through preferences
    lens: both
    category: IAM
    severity: info
    entity: gpo
    why: Local Users and Groups preference items add accounts and groups - sometimes Domain Users - to local Administrators on every computer in the GPO's scope. The content is only in SYSVOL; this lists the GPOs that do it so their members can be checked.
    fix: Open Groups.xml in the GPO's Machine\Preferences\Groups folder and remove broad principals from local Administrators; prefer explicit, reviewed membership or LAPS with no standing local administrators.
    refs: [NIST-800-53:AC-6(1), CIS-Controls-v8:5.4, MITRE-ATTACK:T1098]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Policies,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=groupPolicyContainer)'
      attributes: [cn, displayName, flags, versionNumber, gPCFileSysPath, gPCMachineExtensionNames, gPCUserExtensionNames, whenChanged]
      key: cn
      name: displayName
    each:
      any:
        - { field: gPCMachineExtensionNames, op: match, value: '17D89FEC-5C44-4972-B12D-241CAEF74509' }
        - { field: gPCUserExtensionNames, op: match, value: '17D89FEC-5C44-4972-B12D-241CAEF74509' }
    evidence: "{displayName} ({cn}) - Local Users and Groups preferences"

  - id: AD-GPO-SCRIPTS
    title: GPO runs startup, shutdown, logon or logoff scripts
    lens: both
    category: CFG
    severity: info
    entity: gpo
    why: Script contents are not visible over LDAP; startup scripts run as SYSTEM on every computer in scope, and old ones are a favourite place for leftovers that map dead servers or change local groups.
    fix: Review scripts.ini and the script files in the GPO's folder, and move what is still needed to preferences or management tooling.
    refs: [NIST-800-53:CM-7, MITRE-ATTACK:T1037]
    refresh: 7d
    query:
      protocol: ldap
      base: 'CN=Policies,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=groupPolicyContainer)'
      attributes: [cn, displayName, flags, versionNumber, gPCFileSysPath, gPCMachineExtensionNames, gPCUserExtensionNames, whenChanged]
      key: cn
      name: displayName
    each:
      any:
        - { field: gPCMachineExtensionNames, op: match, value: '42B5FAAE-6536-11D2-AE5A-0000F87571E3' }
        - { field: gPCUserExtensionNames, op: match, value: '42B5FAAE-6536-11D2-AE5A-0000F87571E3' }
    evidence: "{displayName} ({cn}) - Scripts extension registered"

  - id: AD-GPO-RECENTLY-CHANGED
    title: GPO changed in the last week
    lens: both
    category: MON
    severity: info
    entity: gpo
    why: The "what changed this week" list for the policy map, and the first place to look when a wave of workstation or server problems starts.
    fix: Match each change against the change records, and back up the GPO before and after edits.
    refs: [NIST-800-53:CM-3, MITRE-ATTACK:T1484.001]
    query:
      protocol: ldap
      base: 'CN=Policies,CN=System,{DOMAINDN}'
      scope: onelevel
      filter: '(objectClass=groupPolicyContainer)'
      attributes: [cn, displayName, flags, versionNumber, gPCFileSysPath, gPCMachineExtensionNames, gPCUserExtensionNames, whenChanged]
      key: cn
      name: displayName
    each: { field: whenChanged, op: age-lt, value: 7, threshold: ad.gpo-change-days }
    evidence: "{displayName} ({cn}) - changed {whenChanged}"

  - id: AD-OU-BLOCK-INHERITANCE
    title: OU blocks policy inheritance
    lens: both
    category: CFG
    severity: low
    entity: domain
    why: Blocking inheritance stops every domain-level GPO, security baselines included, at that OU unless the link is enforced; the OU's objects get only what is linked below it.
    fix: Remove the block, or enforce the baselines that must reach the OU and document the rest.
    refs: [NIST-800-53:CM-6, CIS-Controls-v8:4.1]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(&(|(objectClass=organizationalUnit)(objectClass=domainDNS))(|(gPLink=*)(gPOptions=1)))'
      attributes: [name, gPLink, gPOptions]
      key: distinguishedName
      name: name
    each: { field: gPOptions, op: eq, value: 1 }
    evidence: "{distinguishedName} blocks inheritance"

  - id: AD-OU-DISABLED-GPO-LINK
    title: GPO link that is disabled
    lens: maintenance
    category: HYG
    severity: low
    entity: domain
    why: A disabled link looks linked in every tool but applies nothing; later someone enables it to fix something else and deploys years-old settings.
    fix: Remove the link (and the GPO if it is linked nowhere else), or enable it on purpose after reviewing the settings.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(&(|(objectClass=organizationalUnit)(objectClass=domainDNS))(|(gPLink=*)(gPOptions=1)))'
      attributes: [name, gPLink, gPOptions]
      key: distinguishedName
      name: name
    each: { field: gPLink, op: match, value: ';[13]\]' }
    evidence: "{distinguishedName} - gPLink {gPLink}"

  # ---------------------------------------------------------------- schema and SYSVOL replication

  - id: AD-SCHEMA-NO-LAPS
    title: No LAPS schema in the forest
    kind: missing
    category: IAM
    severity: high
    entity: domain
    why: Neither Windows LAPS nor legacy LAPS attributes exist, so no computer can have a managed local administrator password.
    fix: Extend the schema for Windows LAPS and deploy the LAPS policy.
    refs: [MITRE-ATTACK:T1078.003, NIST-800-53:IA-5]
    refresh: 7d
    query:
      protocol: ldap
      base: schema
      scope: onelevel
      filter: '(|(lDAPDisplayName=ms-Mcs-AdmPwdExpirationTime)(lDAPDisplayName=msLAPS-PasswordExpirationTime))'
      attributes: [lDAPDisplayName]
      key: lDAPDisplayName
    count: none
    evidence: "LAPS schema attributes found - {count}"

  - id: AD-SCHEMA-VERSION-OLD
    title: Forest schema is older than the floor
    lens: maintenance
    category: LCM
    severity: low
    entity: domain
    why: A domain controller of a newer Windows Server release cannot be promoted until the schema is extended, and the attributes newer features need are missing. 88 is the Windows Server 2019 and 2022 schema; 91 is 2025.
    fix: Extend the schema from the newest Windows Server media (adprep /forestprep, or let the promotion wizard do it as a schema administrator) during a planned change.
    refs: [NIST-800-53:CM-2]
    refresh: 7d
    query:
      protocol: ldap
      base: schema
      scope: base
      filter: '(objectClass=dMD)'
      attributes: [fSMORoleOwner, objectVersion]
      key: distinguishedName
    each: { field: objectVersion, op: lt, value: 88, threshold: ad.min-schema-version }
    evidence: "Schema objectVersion {objectVersion}"

  - id: AD-SCHEMA-RECENT-EXTENSION
    title: Schema definitions added in the last month
    category: MON
    severity: info
    entity: domain
    why: Schema extensions are rare, cannot be undone and need Schema Admins; an unplanned one is an undocumented product install or a misuse of that group. A schema upgrade adds many definitions at once - one finding lists a sample. The query looks back 90 days at most, so ad.schema-change-days above 90 has no effect.
    fix: Match the additions to the change record of the product or upgrade that made them, and empty Schema Admins again (AD-GROUP-SCHEMA-ADMINS-SIZE).
    refs: [NIST-800-53:CM-3, NIST-800-53:AC-6(5)]
    query:
      protocol: ldap
      base: schema
      scope: onelevel
      filter: '(&(|(objectClass=attributeSchema)(objectClass=classSchema))(whenCreated>={GT:90}))'
      attributes: [lDAPDisplayName, whenCreated]
      key: lDAPDisplayName
    count:
      op: gt
      value: 0
      where: { field: whenCreated, op: age-lt, value: 30, threshold: ad.schema-change-days }
    evidence: "{count} schema definitions added recently, for example {sample}"

  - id: AD-DNS-ZONE-LEGACY-STORAGE
    title: DNS zone stored in the domain partition
    lens: maintenance
    category: CFG
    severity: low
    entity: domain
    why: Zones under CN=MicrosoftDNS,CN=System use the pre-2003 storage that replicates them to every domain controller of the domain, DNS server or not, and cannot be scoped to the forest. A subtree search of the domain partition does not enter the DNS application partitions, so only legacy-stored zones answer.
    fix: Change the zone's replication scope to all DNS servers in the domain (or the forest) in DNS Manager.
    refs: [NIST-800-53:CM-6]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(&(objectClass=dnsZone)(!(dc=RootDNSServers))(!(dc=..TrustAnchors)))'
      attributes: [dc, whenCreated]
      key: distinguishedName
      name: dc
    each: any
    evidence: "Zone {dc} - {distinguishedName}"

  - id: AD-SYSVOL-FRS
    title: SYSVOL still replicated by FRS
    lens: both
    category: LCM
    severity: high
    entity: domain
    why: FRS is deprecated, unreliable under load, and blocks promotion of newer domain controllers.
    fix: Migrate SYSVOL replication to DFSR (dfsrmig) through to the eliminated state.
    refs: [NIST-800-53:SA-22]
    refresh: 7d
    query:
      protocol: ldap
      filter: '(objectClass=nTFRSSubscriber)'
      attributes: [cn]
      key: distinguishedName
    count: some
    evidence: "{count} FRS subscriber objects, for example {sample}"
