schema: keeper.rules/1
system: dynatrace
name: Dynatrace environment
integration: dynatrace
# Endpoint: the environment URL (https://<environment-id>.live.dynatrace.com, or an ActiveGate's
# https://<activegate>:9999/e/<environment-id>). The integration adds "Authorization: Api-Token ...";
# the token needs problems.read, oneAgents.read, activeGates.read, apiTokens.read and settings.read.
# Rules added later read a few more scopes: securityProblems.read (runtime vulnerabilities),
# syntheticLocations.read (private locations), ReadSyntheticData (the classic synthetic-monitor list)
# and credentialVault.read (the credential vault's metadata). A token without a scope makes that rule's
# read fail, which is unknown, never a pass.
# The API token list documents the flag as "enabled" while the vendor's sample shows "disabled"; the
# token rules accept either spelling.
# Dynatrace pages with nextPageKey, which the runner does not follow, so each query asks for the
# largest page the API allows. Timestamps in these APIs are epoch milliseconds, which the engine does
# not read as dates; no rule here depends on one.
defaults:
  lens: maintenance
  refresh: 1h
rules:

  # ---- open problems (environment API v2) ---------------------------------------------------
  # The problems API only returns problems that started or ended inside the timeframe (default the
  # last two hours), so "from" is widened; an open problem that started before it is not returned.

  - id: DT-PROBLEM-AVAILABILITY
    title: Open availability problem
    kind: broken
    category: AVL
    severity: critical
    entity: problem
    why: Dynatrace has detected that something is down or unreachable for its users.
    fix: Work the problem from its root-cause entity; close the loop in the incident record.
    refs: [NIST-800-53:IR-4]
    query:
      protocol: http
      path: /api/v2/problems
      params: { problemSelector: 'status("open")', from: now-90d, pageSize: "500" }
      paging: none
      items: problems
      key: problemId
      name: title
    each: { field: severityLevel, op: eq, value: AVAILABILITY }
    evidence: "{displayId} {title} ({impactLevel}) on {affectedEntities[].name}"

  - id: DT-PROBLEM-ERROR
    title: Open error problem
    kind: broken
    category: AVL
    severity: high
    entity: problem
    why: An error problem means failing requests or crashing processes that users or dependent services feel.
    fix: Work the problem from its root-cause entity.
    refs: [NIST-800-53:IR-4]
    query:
      protocol: http
      path: /api/v2/problems
      params: { problemSelector: 'status("open")', from: now-90d, pageSize: "500" }
      paging: none
      items: problems
      key: problemId
      name: title
    each: { field: severityLevel, op: eq, value: ERROR }
    evidence: "{displayId} {title} ({impactLevel}) on {affectedEntities[].name}"

  - id: DT-PROBLEM-SLOWDOWN
    title: Open performance or resource-contention problem
    kind: broken
    category: HLT
    severity: medium
    entity: problem
    why: Slowdowns and resource saturation are the problems users report as "the system is slow" long before anything is down.
    fix: Check the saturated resource or slow service named in the problem and its recent changes.
    query:
      protocol: http
      path: /api/v2/problems
      params: { problemSelector: 'status("open")', from: now-90d, pageSize: "500" }
      paging: none
      items: problems
      key: problemId
      name: title
    each: { field: severityLevel, op: in, value: [PERFORMANCE, RESOURCE_CONTENTION] }
    evidence: "{displayId} {title} ({severityLevel}) on {affectedEntities[].name}"

  - id: DT-PROBLEM-CUSTOM-ALERT
    title: Open custom-alert problem
    kind: broken
    category: HLT
    severity: medium
    entity: problem
    why: A custom alert fires on a condition someone defined as important for this environment.
    fix: Act on the alert or retune its threshold with a reason.
    query:
      protocol: http
      path: /api/v2/problems
      params: { problemSelector: 'status("open")', from: now-90d, pageSize: "500" }
      paging: none
      items: problems
      key: problemId
      name: title
    each: { field: severityLevel, op: eq, value: CUSTOM_ALERT }
    evidence: "{displayId} {title} on {affectedEntities[].name}"

  - id: DT-PROBLEM-MONITORING-UNAVAILABLE
    title: Dynatrace reports that it cannot monitor an entity
    kind: broken
    category: MON
    severity: high
    entity: problem
    why: Monitoring-unavailable is the tool saying it went blind; everything behind it is unwatched while no other problem can open.
    fix: Restore the OneAgent, ActiveGate or extension that lost contact.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/v2/problems
      params: { problemSelector: 'status("open")', from: now-90d, pageSize: "500" }
      paging: none
      items: problems
      key: problemId
      name: title
    each: { field: severityLevel, op: eq, value: MONITORING_UNAVAILABLE }
    evidence: "{displayId} {title} on {affectedEntities[].name}"

  - id: DT-PROBLEM-LIST-TRUNCATED
    title: Open-problem list reached the page limit
    kind: broken
    category: MON
    severity: medium
    entity: instance
    why: The API returns at most 500 problems per page and the engine reads one page; at the limit the problem rules judge only part of what is open.
    fix: Close or merge stale problems, or split the review with a tenant rule per management zone.
    query:
      protocol: http
      path: /api/v2/problems
      params: { problemSelector: 'status("open")', from: now-90d, pageSize: "500" }
      paging: none
      items: problems
      key: problemId
      name: title
    count: { op: ge, value: 500 }
    evidence: "{count} open problems returned - the list is probably cut off"

  - id: DT-PROBLEM-OPEN-LONG
    title: Problem has been open for more than a week
    kind: broken
    category: HYG
    severity: medium
    entity: problem
    refresh: 1d
    why: A problem open for a week is either worked by nobody or a permanent condition that belongs in a maintenance window or a tuned threshold - both teach people to ignore red. The API returns a problem when its start or end lies in the timeframe, and an open problem has no end, so a timeframe that stops seven days ago returns exactly the open problems older than that.
    fix: Fix it and let it close, or replace it with a maintenance window or an adjusted threshold, with a comment on the problem.
    refs: [NIST-800-53:IR-4, NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/v2/problems
      params: { problemSelector: 'status("open")', from: now-90d, to: now-7d, pageSize: "500" }
      paging: none
      items: problems
      key: problemId
      name: title
    each: any
    evidence: "{displayId} {title} ({severityLevel}) open more than 7 days on {affectedEntities[].name}"

  # ---- alerting configuration (settings 2.0) -------------------------------------------------

  - id: DT-NOTIFICATION-MISSING
    title: No enabled problem notification exists
    kind: missing
    category: MON
    severity: high
    entity: instance
    why: Without an enabled notification integration (e-mail, ticketing, chat, webhook) problems are seen only by whoever happens to open the web interface.
    fix: Add an e-mail or ticketing notification bound to the default alerting profile, and test it.
    refs: [NIST-800-53:IR-6, NIST-800-53:SI-4, CIS-Controls-v8:13.1]
    query:
      protocol: http
      path: /api/v2/settings/objects
      params: { schemaIds: "builtin:problem.notifications", scopes: environment, fields: "objectId,value", pageSize: "500" }
      paging: none
      items: items
      key: objectId
      name: value.displayName
    count:
      op: lt
      value: 1
      where: { field: value.enabled, op: eq, value: true }
    evidence: "{count} enabled of {rows} problem notifications"

  - id: DT-HOST-CONNECTION-LOST-DETECTION-OFF
    title: Host connection-lost detection is switched off for the environment
    kind: misconfigured
    category: MON
    severity: high
    entity: setting
    why: With connection-lost detection off, a host that goes down raises no problem at all; the agent rules see it only on their next run. An environment that never changed the setting returns no object and keeps the vendor default (on), which is a pass here.
    fix: Turn the detection back on; for hosts that reboot on purpose, choose not to alert on graceful shutdowns instead.
    refs: [NIST-800-53:SI-4, CIS-Controls-v8:13.1]
    query:
      protocol: http
      path: /api/v2/settings/objects
      params: { schemaIds: "builtin:anomaly-detection.infrastructure-hosts", fields: "objectId,scope,value", pageSize: "500" }
      paging: none
      items: items
      key: objectId
      name: scope
    each:
      all:
        - { field: scope, op: eq, value: environment }
        - { field: value.host.connectionLostDetection.enabled, op: eq, value: false }
    evidence: "connection-lost detection disabled at {scope}"

  - id: DT-HOST-CONNECTION-LOST-DETECTION-OVERRIDE
    title: Host connection-lost detection is switched off for a host or host group
    kind: misconfigured
    category: MON
    severity: low
    entity: setting
    refresh: 1d
    why: A host or host-group override that disables connection-lost detection makes that host's outage silent while the environment setting looks right.
    fix: Remove the override, or replace it with "do not alert on graceful shutdowns" for hosts that restart on schedule.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/v2/settings/objects
      params: { schemaIds: "builtin:anomaly-detection.infrastructure-hosts", fields: "objectId,scope,value", pageSize: "500" }
      paging: none
      items: items
      key: objectId
      name: scope
    each:
      all:
        - { field: scope, op: ne, value: environment }
        - { field: value.host.connectionLostDetection.enabled, op: eq, value: false }
    evidence: "connection-lost detection disabled for {scope}"

  # ---- OneAgent on hosts (environment API v1) ------------------------------------------------

  - id: DT-AGENT-NOT-MONITORING
    title: OneAgent host is crashed, lost or unmonitored
    kind: broken
    category: MON
    severity:
      field: availabilityState
      map: { CRASHED: high, LOST: high, UNMONITORED: high, UNEXPECTED_SHUTDOWN: medium, UNKNOWN: medium }
      default: medium
    entity: host
    why: The host still appears in the host list, so it looks covered, while nothing is being collected from it.
    fix: Check the OneAgent service on the host and its connection to the cluster or ActiveGate; reinstall the agent if it keeps crashing.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/v1/oneagents
      params: { relativeTime: week }
      paging: none
      items: hosts
      key: hostInfo.entityId
      name: hostInfo.displayName
    each: { field: availabilityState, op: in, value: [CRASHED, LOST, UNEXPECTED_SHUTDOWN, UNMONITORED, UNKNOWN] }
    evidence: "{hostInfo.displayName}: {availabilityState} ({detailedAvailabilityState}), agent {agentVersion}"

  - id: DT-AGENT-MONITORING-DISABLED
    title: Monitoring is switched off for a host
    kind: misconfigured
    category: MON
    severity: medium
    entity: host
    why: A host with monitoring disabled in its settings keeps its agent installed and looks enrolled, but sends nothing.
    fix: Re-enable monitoring for the host, or uninstall the agent and record why the host is excluded.
    query:
      protocol: http
      path: /api/v1/oneagents
      params: { relativeTime: week }
      paging: none
      items: hosts
      key: hostInfo.entityId
      name: hostInfo.displayName
    each: { field: configuredMonitoringEnabled, op: eq, value: false }
    evidence: "{hostInfo.displayName}: monitoring disabled, mode {configuredMonitoringMode}"

  - id: DT-AGENT-UNLICENSED
    title: Host is not monitored for lack of licence
    kind: missing
    category: MON
    severity: high
    entity: host
    why: When the licence (host units or platform subscription) runs out, new hosts are silently left unmonitored - nothing turns red.
    fix: Free licence capacity from retired hosts or extend the licence, then confirm the host reports data.
    query:
      protocol: http
      path: /api/v1/oneagents
      params: { relativeTime: week }
      paging: none
      items: hosts
      key: hostInfo.entityId
      name: hostInfo.displayName
    each: { field: unlicensed, op: eq, value: true }
    evidence: "{hostInfo.displayName}: unlicensed"

  - id: DT-AGENT-FAULTY-VERSION
    title: OneAgent runs a version flagged as faulty
    kind: broken
    lens: both
    category: LCM
    severity: high
    entity: host
    why: The vendor flags versions with known defects; a faulty agent can crash the processes it instruments or report wrong data.
    fix: Update the agent to a version the environment offers as current.
    refs: [NIST-800-53:SI-2]
    query:
      protocol: http
      path: /api/v1/oneagents
      params: { relativeTime: week }
      paging: none
      items: hosts
      key: hostInfo.entityId
      name: hostInfo.displayName
    each: { field: faultyVersion, op: eq, value: true }
    evidence: "{hostInfo.displayName}: agent {agentVersion} is flagged faulty"

  - id: DT-AGENT-UPDATE-PROBLEM
    title: OneAgent update failed or the version is incompatible
    kind: broken
    category: LCM
    severity: medium
    entity: host
    why: An agent whose update fails stays behind indefinitely while auto-update looks switched on.
    fix: Read the update error on the host, fix disk space or permissions, and update the agent manually.
    refs: [NIST-800-53:SI-2]
    query:
      protocol: http
      path: /api/v1/oneagents
      params: { relativeTime: week }
      paging: none
      items: hosts
      key: hostInfo.entityId
      name: hostInfo.displayName
    each: { field: updateStatus, op: in, value: [UPDATE_PROBLEM, INCOMPATIBLE] }
    evidence: "{hostInfo.displayName}: update status {updateStatus}, agent {agentVersion}"

  - id: DT-AGENT-OUTDATED
    title: OneAgent is outdated
    kind: broken
    category: LCM
    severity: low
    entity: host
    refresh: 1d
    why: Old agents miss fixes and newer technology support; the environment reports them as outdated against its own update policy.
    fix: Update the agent, or let auto-update do it inside a maintenance window.
    refs: [NIST-800-53:SI-2]
    query:
      protocol: http
      path: /api/v1/oneagents
      params: { relativeTime: week }
      paging: none
      items: hosts
      key: hostInfo.entityId
      name: hostInfo.displayName
    each: { field: updateStatus, op: eq, value: OUTDATED }
    evidence: "{hostInfo.displayName}: agent {agentVersion} is outdated"

  - id: DT-AGENT-AUTO-UPDATE-OFF
    title: OneAgent auto-update is disabled
    kind: misconfigured
    category: LCM
    severity: low
    entity: host
    refresh: 1d
    why: With auto-update off, every agent upgrade is manual work that tends not to happen.
    fix: Enable auto-update with a maintenance window, or document the manual update process for these hosts.
    query:
      protocol: http
      path: /api/v1/oneagents
      params: { relativeTime: week }
      paging: none
      items: hosts
      key: hostInfo.entityId
      name: hostInfo.displayName
    each: { field: autoUpdateSetting, op: eq, value: DISABLED }
    evidence: "{hostInfo.displayName}: auto-update disabled"

  - id: DT-AGENT-DISCOVERY-ONLY
    title: Host is monitored in discovery mode only
    kind: misconfigured
    category: MON
    severity: low
    entity: host
    refresh: 1d
    why: Discovery mode sees processes but not their health or performance; a host in it is counted as covered while its problems cannot open.
    fix: Move the host to infrastructure or full-stack monitoring if it runs anything that matters.
    query:
      protocol: http
      path: /api/v1/oneagents
      params: { relativeTime: week }
      paging: none
      items: hosts
      key: hostInfo.entityId
      name: hostInfo.displayName
    each: { field: monitoringType, op: eq, value: DISCOVERY }
    evidence: "{hostInfo.displayName}: monitoring type {monitoringType}"

  - id: DT-AGENT-NONE
    title: Dynatrace returned no OneAgent hosts
    kind: missing
    category: MON
    severity: medium
    entity: instance
    why: An empty host list means either the token cannot read OneAgents or nothing reports - from outside both look like a quiet environment.
    fix: Check the token's oneAgents.read scope and the environment's host list.
    query:
      protocol: http
      path: /api/v1/oneagents
      params: { relativeTime: week }
      paging: none
      items: hosts
      key: hostInfo.entityId
      name: hostInfo.displayName
    count: none
    evidence: "no OneAgent hosts seen in the last week"

  # ---- ActiveGates (environment API v2) ------------------------------------------------------

  - id: DT-ACTIVEGATE-OFFLINE
    title: ActiveGate is offline
    kind: broken
    category: MON
    severity: high
    entity: activegate
    why: Every agent, extension and synthetic monitor routed through an offline ActiveGate stops reporting at once.
    fix: Restore the ActiveGate service and its network path; add a second ActiveGate to the group for redundancy.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/v2/activeGates
      paging: none
      items: activeGates
      key: id
      name: hostname
    each: { field: offlineSince, op: exists }
    evidence: "{hostname} ({type}, group {group}) offline since {offlineSince}"

  - id: DT-ACTIVEGATE-UPDATE
    title: ActiveGate is outdated or its update failed
    kind: broken
    category: LCM
    severity: medium
    entity: activegate
    refresh: 1d
    why: An ActiveGate left behind blocks agent updates that route through it and misses fixes.
    fix: Update the ActiveGate, and fix whatever made the automatic update fail.
    refs: [NIST-800-53:SI-2]
    query:
      protocol: http
      path: /api/v2/activeGates
      paging: none
      items: activeGates
      key: id
      name: hostname
    each: { field: autoUpdateStatus, op: in, value: [OUTDATED, UPDATE_PROBLEM, INCOMPATIBLE] }
    evidence: "{hostname}: version {version}, update status {autoUpdateStatus}"

  - id: DT-ACTIVEGATE-TOKEN
    title: ActiveGate token is expiring or invalid
    kind: broken
    lens: both
    category: AUT
    severity: high
    entity: activegate
    refresh: 1d
    why: When an ActiveGate token expires the gate stops connecting, taking its agents and extensions with it.
    fix: Rotate the ActiveGate token before it expires and set a reminder for the next rotation.
    refs: [NIST-800-53:IA-5]
    query:
      protocol: http
      path: /api/v2/activeGates
      paging: none
      items: activeGates
      key: id
      name: hostname
    each: { field: "activeGateTokens[].state", op: in, value: [EXPIRING, INVALID] }
    evidence: "{hostname}: token state {activeGateTokens[].state}"

  - id: DT-ACTIVEGATE-MODULE-MISCONFIGURED
    title: ActiveGate module is misconfigured
    kind: misconfigured
    category: MON
    severity: medium
    entity: activegate
    refresh: 1d
    why: A misconfigured module (logs, synthetic, Kubernetes, extensions) silently stops the data it was meant to bring in.
    fix: Check the module configuration on the ActiveGate and restart it.
    query:
      protocol: http
      path: /api/v2/activeGates
      paging: none
      items: activeGates
      key: id
      name: hostname
    each: { field: "modules[].misconfigured", op: eq, value: true }
    evidence: "{hostname}: misconfigured module among {modules[].type}"

  # ---- API tokens (environment API v2) -------------------------------------------------------
  # One page of up to 10,000 tokens; dates are ISO 8601. An unset expirationDate means the token
  # never expires. The list includes personal access tokens.

  - id: DT-TOKEN-NO-EXPIRY
    title: Enabled API token never expires
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: api-token
    why: Tokens are copied into scripts and pipelines and outlive the people who made them; one without an expiry stays valid until someone remembers to revoke it.
    fix: Issue a replacement token with an expiry (it can only be set at creation), move the consumer to it and disable the old one.
    refs: [NIST-800-53:IA-5, NIST-800-53:AC-2, CIS-Controls-v8:5.3]
    query:
      protocol: http
      path: /api/v2/apiTokens
      params: { pageSize: "10000", fields: "+expirationDate,+lastUsedDate,+scopes,+personalAccessToken" }
      paging: none
      items: apiTokens
      key: id
      name: name
    each:
      all:
        - any:
            - { field: enabled, op: eq, value: true }
            - { field: disabled, op: eq, value: false }
        - { field: expirationDate, op: absent }
    evidence: "{name} (owner {owner}, created {creationDate}, last used {lastUsedDate}) has no expiry"

  - id: DT-TOKEN-UNUSED
    title: Enabled API token has not been used for months
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: api-token
    refresh: 7d
    why: A token nobody uses still works for whoever finds it; unused credentials are pure risk.
    fix: Disable the token, and delete it after a quiet period if nothing breaks.
    refs: [NIST-800-53:AC-2, CIS-Controls-v8:5.3]
    query:
      protocol: http
      path: /api/v2/apiTokens
      params: { pageSize: "10000", fields: "+expirationDate,+lastUsedDate,+scopes,+personalAccessToken" }
      paging: none
      items: apiTokens
      key: id
      name: name
    each:
      all:
        - any:
            - { field: enabled, op: eq, value: true }
            - { field: disabled, op: eq, value: false }
        - any:
            - { field: lastUsedDate, op: age-gt, value: 90, threshold: dynatrace.token-unused-days }
            - all:
                - { field: lastUsedDate, op: absent }
                - { field: creationDate, op: age-gt, value: 90, threshold: dynatrace.token-unused-days }
    evidence: "{name} (owner {owner}, created {creationDate}): last used {lastUsedDate}"

  - id: DT-TOKEN-EXPIRING
    title: Enabled API token expires soon
    kind: broken
    category: AUT
    severity:
      daysLeft: expirationDate
      ranges: [ { max: 7, value: high } ]
      default: medium
    entity: api-token
    why: When a token expires, the integration behind it (ticketing, inventory sync, this review) stops without any Dynatrace problem opening.
    fix: Issue the replacement token and update its consumer before the expiry date.
    refs: [NIST-800-53:IA-5]
    deadline: expirationDate
    query:
      protocol: http
      path: /api/v2/apiTokens
      params: { pageSize: "10000", fields: "+expirationDate,+lastUsedDate,+scopes,+personalAccessToken" }
      paging: none
      items: apiTokens
      key: id
      name: name
    each:
      all:
        - any:
            - { field: enabled, op: eq, value: true }
            - { field: disabled, op: eq, value: false }
        - { field: expirationDate, op: until-lt, value: 14, threshold: dynatrace.token-notice-days }
    evidence: "{name} (owner {owner}) expires {expirationDate}, last used {lastUsedDate}"

  - id: DT-TOKEN-CAN-MINT-TOKENS
    title: Enabled API token can create other tokens
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: api-token
    why: A token with the token-write scope can create new tokens with the scopes it holds, so a leaked automation token becomes a way to mint fresh, unexpiring credentials.
    fix: Reissue automation tokens without the token-write scope; keep token management with named administrators.
    refs: [NIST-800-53:AC-6, CIS-Controls-v8:5.4, MITRE-ATTACK:T1098]
    query:
      protocol: http
      path: /api/v2/apiTokens
      params: { pageSize: "10000", fields: "+expirationDate,+lastUsedDate,+scopes,+personalAccessToken" }
      paging: none
      items: apiTokens
      key: id
      name: name
    each:
      all:
        - any:
            - { field: enabled, op: eq, value: true }
            - { field: disabled, op: eq, value: false }
        - { field: scopes, op: contains, value: apiTokens.write }
    evidence: "{name} (owner {owner}) holds apiTokens.write among {scopes}"

  - id: DT-TOKEN-WRITE-SCOPE
    title: Enabled API token holds a configuration-write scope
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: api-token
    why: A read token for a review or a sync cannot change anything; one that also carries a write scope (settings, entities, extensions, the credential vault) can reconfigure monitoring or read secrets if it leaks, so write scopes belong only on the few tokens that genuinely automate changes.
    fix: Reissue the token with only the read scopes its consumer uses; keep write scopes on named, expiring automation tokens.
    refs: [NIST-800-53:AC-6, CIS-Controls-v8:5.4, MITRE-ATTACK:T1098]
    query:
      protocol: http
      path: /api/v2/apiTokens
      params: { pageSize: "10000", fields: "+expirationDate,+lastUsedDate,+scopes,+personalAccessToken" }
      paging: none
      items: apiTokens
      key: id
      name: name
    each:
      all:
        - any:
            - { field: enabled, op: eq, value: true }
            - { field: disabled, op: eq, value: false }
        - any:
            - { field: scopes, op: contains, value: settings.write }
            - { field: scopes, op: contains, value: entities.write }
            - { field: scopes, op: contains, value: credentialVault.write }
            - { field: scopes, op: contains, value: extensions.write }
            - { field: scopes, op: contains, value: WriteConfig }
    evidence: "{name} (owner {owner}) holds a configuration-write scope among {scopes}"

  - id: DT-TOKEN-PERSONAL-ACCESS-OLD
    title: Personal access token is old
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: api-token
    refresh: 7d
    why: A personal access token is tied to one person and inherits their permissions; left in a pipeline it keeps working after they change role or leave, and an old one has usually outlived whatever it was made for.
    fix: Replace personal access tokens used by automation with a dedicated service token with an expiry, and have people re-create their own when they need them.
    refs: [NIST-800-53:IA-5, NIST-800-53:AC-2, CIS-Controls-v8:5.3]
    query:
      protocol: http
      path: /api/v2/apiTokens
      params: { pageSize: "10000", fields: "+expirationDate,+lastUsedDate,+scopes,+personalAccessToken" }
      paging: none
      items: apiTokens
      key: id
      name: name
    each:
      all:
        - any:
            - { field: enabled, op: eq, value: true }
            - { field: disabled, op: eq, value: false }
        - { field: personalAccessToken, op: eq, value: true }
        - { field: creationDate, op: age-gt, value: 365, threshold: dynatrace.token-max-age-days }
    evidence: "{name} (owner {owner}) is a personal access token created {creationDate}, last used {lastUsedDate}"

  # ---- credential vault (environment API v2) -------------------------------------------------
  # Metadata only (credentialVault.read); the values are never returned.

  - id: DT-CREDENTIAL-CONTEXTLESS
    title: Credential-vault entry can be used by any configuration
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: credential
    why: A vault entry that allows contextless requests can be referenced by any synthetic monitor or extension in the tenant, not only the ones it was meant for, so a municipal account or certificate stored for one job is reachable by every job.
    fix: Turn off contextless use on the entry and scope it to the monitors or extensions that need it.
    refs: [NIST-800-53:IA-5, NIST-800-53:AC-6, CIS-Controls-v8:5.4]
    query:
      protocol: http
      path: /api/v2/credentials
      paging: none
      items: credentials
      key: id
      name: name
    each: { field: allowContextlessRequests, op: eq, value: true }
    evidence: "{name} ({type}, owner {owner}) allows contextless use by any configuration"

  # ---- runtime vulnerabilities (environment API v2) ------------------------------------------
  # securityProblems.read; only returned when Application Security is licensed.

  - id: DT-SECURITY-PROBLEM-OPEN
    title: Open runtime vulnerability of high or critical risk
    kind: broken
    lens: both
    category: LCM
    severity:
      field: riskLevel
      map: { CRITICAL: critical, HIGH: high }
      default: high
    entity: security-problem
    why: Dynatrace sees the libraries actually loaded by monitored processes, so a critical or high finding here is a vulnerable component running in production right now, not a theoretical one on disk.
    fix: Patch or remove the affected component with the application owner; if it cannot be reached, mitigate the exposure and record the risk acceptance.
    refs: [NIST-800-53:RA-5, NIST-800-53:SI-2, CIS-Controls-v8:7.5]
    query:
      protocol: http
      path: /api/v2/securityProblems
      params: { securityProblemSelector: 'status("OPEN")', fields: "+riskAssessment", pageSize: "500" }
      paging: none
      items: securityProblems
      key: securityProblemId
      name: title
    each: { field: riskLevel, op: in, value: [CRITICAL, HIGH] }
    evidence: "{displayId} {title} ({riskLevel}) in {technology} on {affectedEntities[].name}"

  - id: DT-SECURITY-PROBLEM-LIST-TRUNCATED
    title: Open runtime-vulnerability list reached the page limit
    kind: broken
    category: MON
    severity: medium
    entity: instance
    why: The API returns at most 500 security problems per page and the engine reads one page; at the limit the vulnerability rule judges only part of what is open.
    fix: Work the open vulnerabilities down, or split the review with a selector per management zone.
    query:
      protocol: http
      path: /api/v2/securityProblems
      params: { securityProblemSelector: 'status("OPEN")', fields: "+riskAssessment", pageSize: "500" }
      paging: none
      items: securityProblems
      key: securityProblemId
      name: title
    count: { op: ge, value: 500 }
    evidence: "{count} open security problems returned - the list is probably cut off"

  # ---- synthetic monitoring (environment API v1/v2) ------------------------------------------

  - id: DT-SYNTHETIC-LOCATION-DISABLED
    title: Private synthetic location is disabled
    kind: broken
    category: AVL
    severity: medium
    entity: synthetic-location
    why: Every browser and HTTP monitor assigned to a private location stops executing when that location is disabled, so the availability tests look configured while nothing runs them.
    fix: Re-enable the location and check its node, or move its monitors to a healthy location.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/v2/synthetic/locations
      paging: none
      items: locations
      key: entityId
      name: name
    each:
      all:
        - { field: type, op: eq, value: PRIVATE }
        - { field: status, op: eq, value: DISABLED }
    evidence: "{name}: private synthetic location is {status}"

  - id: DT-SYNTHETIC-MONITOR-DISABLED
    title: Synthetic monitor is disabled
    kind: misconfigured
    category: AVL
    severity: low
    entity: synthetic-monitor
    refresh: 1d
    why: A disabled synthetic monitor is an outside-in availability test that someone switched off; the baseline that depends on it then passes while nothing is actually checking the application from the user's side.
    fix: Re-enable the monitor, or record why the test is no longer needed and remove it.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/v1/synthetic/monitors
      paging: none
      items: monitors
      key: entityId
      name: name
    each: { field: enabled, op: eq, value: false }
    evidence: "{name} ({type}): synthetic monitor is disabled"

  # ---- monitoring configuration (settings 2.0) ----------------------------------------------

  - id: DT-MANAGEMENT-ZONE-NONE
    title: No management zones are defined
    kind: missing
    category: CFG
    severity: low
    entity: instance
    refresh: 1d
    why: Without management zones, anomaly and alerting settings cannot differ per system and problems cannot be scoped or routed to the team that owns the affected hosts; everything shares one global configuration.
    fix: Define a management zone per system or environment, with rules that place hosts and services into it.
    refs: [NIST-800-53:CM-8]
    query:
      protocol: http
      path: /api/v2/settings/objects
      params: { schemaIds: "builtin:management-zones", scopes: environment, fields: "objectId,value", pageSize: "500" }
      paging: none
      items: items
      key: objectId
      name: value.name
    count: none
    evidence: "no management zones defined"

  - id: DT-AUTO-TAG-NONE
    title: No automatic tagging rules are defined
    kind: missing
    category: CFG
    severity: low
    entity: instance
    refresh: 1d
    why: Auto-tags are how entities become grouped by system, environment and owner; with none, problems cannot be filtered to a system and dashboards cannot be built per service, so routing and ownership rest on host names alone.
    fix: Add auto-tagging rules that attach system, environment and owner tags from host-group names or metadata.
    refs: [NIST-800-53:CM-8]
    query:
      protocol: http
      path: /api/v2/settings/objects
      params: { schemaIds: "builtin:tags.auto-tagging", scopes: environment, fields: "objectId,value", pageSize: "500" }
      paging: none
      items: items
      key: objectId
      name: value.name
    count: none
    evidence: "no automatic tagging rules defined"

  - id: DT-ALERTING-PROFILE-NONE
    title: No alerting profile is defined
    kind: missing
    category: MON
    severity: low
    entity: instance
    refresh: 1d
    why: An alerting profile decides which problems reach which notification with what delay; with only the implicit default, every slowdown and every real outage go to the same place with the same urgency, which trains people to ignore them.
    fix: Create an alerting profile per critical system or zone, with severity and delay rules, and bind notifications to it.
    refs: [NIST-800-53:IR-6, NIST-800-53:SI-4, CIS-Controls-v8:13.1]
    query:
      protocol: http
      path: /api/v2/settings/objects
      params: { schemaIds: "builtin:alerting.profile", scopes: environment, fields: "objectId,value", pageSize: "500" }
      paging: none
      items: items
      key: objectId
      name: value.name
    count: none
    evidence: "no alerting profile defined"

  - id: DT-NOTIFICATION-WEBHOOK-CLEARTEXT
    title: Problem notification posts over cleartext HTTP
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: setting
    why: A webhook or integration notification whose URL is plain http sends the problem payload - host names, topology, sometimes a token in a header - across the network in clear, where anything on the path can read or alter it.
    fix: Change the notification target to https, and rotate any shared secret that was sent in clear.
    refs: [NIST-800-53:SC-8, NIST-800-53:IR-6]
    query:
      protocol: http
      path: /api/v2/settings/objects
      params: { schemaIds: "builtin:problem.notifications", scopes: environment, fields: "objectId,value", pageSize: "500" }
      paging: none
      items: items
      key: objectId
      name: value.displayName
    each:
      all:
        - { field: value.enabled, op: eq, value: true }
        - { field: value.url, op: match, value: '^http://' }
    evidence: "{value.displayName}: notification posts to {value.url} over cleartext HTTP"

  - id: DT-MAINTENANCE-WINDOW-DETECTION-OFF
    title: Maintenance window stops problem detection
    kind: misconfigured
    category: MON
    severity: medium
    entity: maintenance-window
    refresh: 1d
    why: A maintenance window set to disable problem detection (not merely to mute alerting) means Dynatrace opens no problem at all for the entities it scopes while it is active; a window left recurring or without an end then hides real faults indefinitely.
    fix: Change the window to detect problems but not alert, or narrow its schedule and scope to the actual change and let it end.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/v2/settings/objects
      params: { schemaIds: "builtin:alerting.maintenance-window", scopes: environment, fields: "objectId,value", pageSize: "500" }
      paging: none
      items: items
      key: objectId
      name: value.generalProperties.name
    each: { field: value.generalProperties.suppression, op: eq, value: DONT_DETECT_PROBLEMS }
    evidence: "{value.generalProperties.name}: maintenance window disables problem detection (suppression {value.generalProperties.suppression})"

  - id: DT-DISK-LOW-SPACE-DETECTION-OFF
    title: Low-disk-space detection is switched off for the environment
    kind: misconfigured
    category: MON
    severity: medium
    entity: setting
    refresh: 1d
    why: With low-disk-space detection off at the environment level, a disk filling up on any monitored host raises no problem, and a full disk is one of the most common ways a service stops. An environment that never changed the setting returns no object and keeps the vendor default (on), which is a pass here.
    fix: Turn low-disk-space anomaly detection back on for the environment; override it per host group only with a documented reason.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/v2/settings/objects
      params: { schemaIds: "builtin:anomaly-detection.infrastructure-disks", fields: "objectId,scope,value", pageSize: "500" }
      paging: none
      items: items
      key: objectId
      name: scope
    each:
      all:
        - { field: scope, op: eq, value: environment }
        - { field: value.diskLowSpace.enabled, op: eq, value: false }
    evidence: "low-disk-space detection disabled at {scope}"
