        - { field: values, op: match, value: '^(S-1-1-0|S-1-5-7|S-1-5-11|S-1-5-2|S-1-5-4|S-1-5-32-545|S-1-5-32-546|S-1-5-21-\d+-\d+-\d+-(501|513|514|515)|(.*\\)?(Everyone|Authenticated Users|Domain Users|Users|Domain Computers|Guests|Domain Guests|Guest|ANONYMOUS LOGON|INTERACTIVE|NETWORK))$' }
