    evidence: '{gpo}: {key} = {value}'

  - id: GPO-URA-LOCAL-LOGON-BROAD
    title: Log on locally right granted to a broad group
    category: IAM
    severity: high
    entity: gpo-setting
    why: '"Allow log on locally" also governs console and some remote-tool sign-ins. In a GPO for domain controllers or servers, granting it to Everyone, Authenticated Users, Domain Users or Users lets any account sign in interactively there - on a domain controller that is a step from any user to the domain''s most sensitive host. Workstation GPOs normally grant Users this right (the Windows default there), so a finding on a GPO that only applies to workstations can be accepted.'
    fix: Limit "Allow log on locally" on domain controllers and servers to Administrators (plus Backup Operators where used); on workstations keep Users only if the GPO applies to workstations alone.
