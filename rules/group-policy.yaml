        - { field: key, op: eq, value: SeInteractiveLogonRight }
        - { field: values, op: notempty }
        - { field: values, op: match, value: '^(S-1-1-0|S-1-5-11|S-1-5-32-545|S-1-5-21-\d+-\d+-\d+-513|(.*\\)?(Everyone|Authenticated Users|Domain Users|Users))$' }
    evidence: '{gpo}: {key} = {value}'

