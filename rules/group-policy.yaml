  - id: GPO-URA-MACHINE-ACCOUNT-BROAD
    title: Add workstations to domain right granted to a broad group
    category: IAM
    severity: medium
    entity: gpo-setting
    why: Granted to Everyone, Domain Users or another broad group, any of those accounts can create computer accounts in the domain. Authenticated Users, the domain controller default, is not flagged here; the machine account quota is judged in active-directory.yaml.
    fix: Grant "Add workstations to domain" to a dedicated join group only, and set the domain's machine account quota to 0.
