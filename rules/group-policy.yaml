schema: keeper.rules/1
system: group-policy
name: Group Policy (SYSVOL content)
integration: ldap

# What Group Policy objects configure, read from the domain's SYSVOL by the gpo runner: Registry.pol,
# GptTmpl.inf, audit.csv, Group Policy Preferences XML and GPT.INI. The directory side of each GPO
# (flags, links, ACLs, extension lists) is in rules/active-directory.yaml (AD-GPO-*); host state is in
# windows-baseline.yaml. A finding says a GPO SETS something; where it is linked is not known here
# (docs/backlog/group-policy.md). Findings name the GPO by GUID; AD-GPO-* rows give its display name.
#
# Conditions first match the setting (_file / key / section, present on every row) so rows about other
# settings pass cleanly; optional fields are guarded with exists. Principals are matched as text
# (well-known SIDs and English names) so a member written by name is still judged.

defaults:
  kind: misconfigured
  lens: security
  refresh: 1d
  entity: gpo-preference

rules:

  # ================================================================ 1. stored credentials in preferences

  - id: GPO-GPP-CPASSWORD-LOCAL-USER
    title: Local user preference stores a password
    category: IAM
    severity: critical
    why: A preference password (cpassword) is readable by every domain user and protected only by a publicly known key, so the local account it sets is effectively disclosed on every computer in scope.
    fix: Remove the password from the item, change that account's password on the affected computers, and manage local administrator passwords with Windows LAPS.
    refs: [MITRE-ATTACK:T1552.006, MS-KB:2962486, NIST-800-53:IA-5(7)]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\Groups\\' }
        - { field: Properties.cpassword, op: exists }
        - { field: Properties.cpassword, op: eq, value: set }
    evidence: '{gpo} {_file}: item "{name}" (account {Properties.userName}) has a stored password'

  - id: GPO-GPP-CPASSWORD-DRIVE-MAP
    title: Drive map preference stores a password
    category: IAM
    severity: critical
    why: The drive map's account password is stored in SYSVOL where every domain user can read it.
    fix: Remove the account and password from the item, change the password, and grant users access to the share directly.
    refs: [MITRE-ATTACK:T1552.006, MS-KB:2962486, NIST-800-53:IA-5(7)]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\Drives\\' }
        - { field: Properties.cpassword, op: exists }
        - { field: Properties.cpassword, op: eq, value: set }
    evidence: '{gpo} {_file}: drive "{name}" connects as {Properties.userName} with a stored password'

  - id: GPO-GPP-CPASSWORD-SCHEDULED-TASK
    title: Scheduled task preference stores a password
    category: IAM
    severity: critical
    why: The task account's password is stored in SYSVOL where every domain user can read it; such accounts often hold more rights than the task needs.
    fix: Remove the password from the item, change it, and run the task as SYSTEM or a group managed service account.
    refs: [MITRE-ATTACK:T1552.006, MS-KB:2962486, NIST-800-53:IA-5(7)]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\ScheduledTasks\\' }
        - { field: Properties.cpassword, op: exists }
        - { field: Properties.cpassword, op: eq, value: set }
    evidence: '{gpo} {_file}: task "{name}" runs as {Properties.runAs} with a stored password'

  - id: GPO-GPP-CPASSWORD-SERVICE
    title: Service preference stores a password
    category: IAM
    severity: critical
    why: The service logon account's password is stored in SYSVOL where every domain user can read it.
    fix: Remove the password from the item, change it, and move the service to a group managed service account or a virtual account.
    refs: [MITRE-ATTACK:T1552.006, MS-KB:2962486, NIST-800-53:IA-5(7)]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\Services\\' }
        - { field: Properties.cpassword, op: exists }
        - { field: Properties.cpassword, op: eq, value: set }
    evidence: '{gpo} {_file}: service "{name}" logs on as {Properties.accountName} with a stored password'

  - id: GPO-GPP-CPASSWORD-DATA-SOURCE
    title: Data source preference stores a password
    category: IAM
    severity: critical
    why: The database login's password is stored in SYSVOL where every domain user can read it.
    fix: Remove the login from the item, change the database password, and use integrated authentication.
    refs: [MITRE-ATTACK:T1552.006, MS-KB:2962486, NIST-800-53:IA-5(7)]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\DataSources\\' }
        - { field: Properties.cpassword, op: exists }
        - { field: Properties.cpassword, op: eq, value: set }
    evidence: '{gpo} {_file}: data source "{name}" logs in as {Properties.username} with a stored password'

  - id: GPO-GPP-CPASSWORD-PRINTER
    title: Printer preference stores a password
    category: IAM
    severity: critical
    why: The printer connection account's password is stored in SYSVOL where every domain user can read it.
    fix: Remove the account and password from the item, change the password, and let users connect as themselves.
    refs: [MITRE-ATTACK:T1552.006, MS-KB:2962486, NIST-800-53:IA-5(7)]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\Printers\\' }
        - { field: Properties.cpassword, op: exists }
        - { field: Properties.cpassword, op: eq, value: set }
    evidence: '{gpo} {_file}: printer "{name}" connects as {Properties.username} with a stored password'

  - id: GPO-GPP-CPASSWORD-OTHER
    title: Other preference item stores a password
    category: IAM
    severity: critical
    why: A stored preference password in any other file (network options, a copied or hand-edited XML) is just as readable by every domain user.
    fix: Remove the password from the item, change it, and delete stray XML copies from the GPO folder.
    refs: [MITRE-ATTACK:T1552.006, MS-KB:2962486, NIST-800-53:IA-5(7)]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: notmatch, value: '\\Preferences\\(Groups|Drives|ScheduledTasks|Services|DataSources|Printers)\\' }
        - { field: Properties.cpassword, op: exists }
        - { field: Properties.cpassword, op: eq, value: set }
    evidence: '{gpo} {_file}: item "{name}" has a stored password'

  - id: GPO-GPP-REGISTRY-SECRET-VALUE
    title: Registry preference writes a secret-named text value
    category: IAM
    severity: high
    why: Text written under a name such as DefaultPassword or a shared secret is stored in clear in SYSVOL, readable by every domain user. Keeper keeps only "set".
    fix: Remove the item, change the secret it carried, and deliver it through a protected store instead of Group Policy.
    refs: [MITRE-ATTACK:T1552.006, NIST-800-53:IA-5(7)]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\Registry\\' }
        - { field: Properties.value, op: exists }
        - { field: Properties.value, op: eq, value: set }
    evidence: '{gpo} {_file}: {Properties.hive}\{Properties.key}\{Properties.name} is written with a secret value'

  - id: GPO-GPP-REGISTRY-AUTOLOGON
    title: Registry preference turns on automatic logon
    category: IAM
    severity: high
    why: Automatic logon keeps an account's password on the computer and opens a session for anyone at the console.
    fix: Remove the item; use assigned access or a kiosk profile for unattended devices.
    refs: [MITRE-ATTACK:T1552.002, CIS-Microsoft-Windows:18.5.1]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\Registry\\' }
        - { field: Properties.key, op: match, value: '\\Windows NT\\CurrentVersion\\Winlogon$' }
        - { field: Properties.name, op: eq, value: AutoAdminLogon }
        - { field: Properties.value, op: match, value: '^0*1$' }
    evidence: '{gpo} {_file}: Winlogon AutoAdminLogon = {Properties.value}'

  - id: GPO-GPP-ENV-SECRET-VALUE
    title: Environment variable preference carries a secret
    category: IAM
    severity: high
    why: A secret-named environment variable is stored in clear in SYSVOL and exposed to every process on the computers in scope.
    fix: Remove the variable, change the secret, and give the application its credential through a protected store.
    refs: [MITRE-ATTACK:T1552.001, NIST-800-53:IA-5(7)]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\EnvironmentVariables\\' }
        - { field: Properties.value, op: exists }
        - { field: Properties.value, op: eq, value: set }
    evidence: '{gpo} {_file}: variable {Properties.name} carries a secret value'

  - id: GPO-GPP-INI-SECRET-VALUE
    title: INI file preference writes a secret
    category: IAM
    severity: high
    why: A password-like INI property is stored in clear in SYSVOL and in a file on every computer in scope.
    fix: Remove the item, change the secret, and let the application read it from a protected store.
    refs: [MITRE-ATTACK:T1552.001, NIST-800-53:IA-5(7)]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\IniFiles\\' }
        - { field: Properties.value, op: exists }
        - { field: Properties.value, op: eq, value: set }
    evidence: '{gpo} {_file}: {Properties.path} [{Properties.section}] {Properties.property} carries a secret value'

  - id: GPO-GPP-TASK-ARGS-CREDENTIAL
    title: Scheduled task arguments may carry a credential
    category: IAM
    severity: medium
    why: The task's arguments look like they contain a password, token or secret (Keeper masks them as "set"; the pattern is broad, so some are false matches). A real credential there is stored in clear in SYSVOL and shows in process lists and logs.
    fix: Review the arguments; if they hold a credential, remove it, change it, and let the task authenticate as its own identity.
    refs: [MITRE-ATTACK:T1552.006, NIST-800-53:IA-5(7)]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\ScheduledTasks\\' }
        - any:
            - all: [ { field: Properties.args, op: exists }, { field: Properties.args, op: eq, value: set } ]
            - all: [ { field: Properties.Task.Actions.Exec.Arguments, op: exists }, { field: Properties.Task.Actions.Exec.Arguments, op: eq, value: set } ]
            - all: [ { field: 'Properties.Task.Actions.Exec[].Arguments', op: exists }, { field: 'Properties.Task.Actions.Exec[].Arguments', op: eq, value: set } ]
    evidence: '{gpo} {_file}: task "{name}" arguments may carry a credential'

  - id: GPO-GPP-DRIVE-FIXED-ACCOUNT
    title: Drive map preference connects as a fixed account
    category: IAM
    severity: low
    why: A shared connection account means access to the share is not tied to the person using it.
    fix: Clear the user name and grant the users or their group rights on the share.
    refs: [NIST-800-53:AC-2, NIST-800-53:IA-2]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\Drives\\' }
        - { field: Properties.userName, op: notempty }
        - any:
            - { field: Properties.cpassword, op: absent }
            - { field: Properties.cpassword, op: ne, value: set }
    evidence: '{gpo} {_file}: drive "{name}" connects as {Properties.userName}'

  # ================================================================ 2. local group membership pushed by GPO

  - id: GPO-GPP-ADMINS-BROAD-MEMBER
    title: Preference adds a broad group to local Administrators
    category: IAM
    severity: critical
    why: Every account in Everyone, Authenticated Users, Domain Users, Users or a similar group becomes an administrator of every computer in scope.
    fix: Remove the member and grant local administration to a small, reviewed admin group; use LAPS for break-glass access.
    refs: [MITRE-ATTACK:T1098, NIST-800-53:AC-6(5), CIS-Controls-v8:5.4]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\Groups\\' }
        - any:
            - all: [ { field: Properties.groupSid, op: exists }, { field: Properties.groupSid, op: eq, value: S-1-5-32-544 } ]
            - { field: name, op: match, value: '^(BUILTIN\\)?Administrators( \(built-in\))?$' }
            - all: [ { field: Properties.groupName, op: exists }, { field: Properties.groupName, op: match, value: '^(BUILTIN\\)?Administrators( \(built-in\))?$' } ]
        - { field: Properties.Members.Member, op: exists }
        - element:
            of: Properties.Members.Member
            where:
              all:
                - { field: action, op: eq, value: ADD }
                - any:
                    - all: [ { field: sid, op: exists }, { field: sid, op: match, value: '^(S-1-1-0|S-1-5-11|S-1-5-4|S-1-5-32-545|S-1-5-21-\d+-\d+-\d+-(513|515))$' } ]
                    - { field: name, op: match, value: '^(.*\\)?(Everyone|Authenticated Users|Domain Users|Users|Domain Computers|INTERACTIVE)$' }
    evidence: '{gpo} {_file}: "{name}" adds {Properties.Members.Member.name}{Properties.Members.Member[].name}'

  - id: GPO-GPP-ADMINS-LOGON-USER
    title: Preference adds the logged-on user to local Administrators
    category: IAM
    severity: high
    why: A member written as %LogonUser% makes every user who signs in an administrator of that computer.
    fix: Remove the member; grant administration only to named support groups and provide elevation on request.
    refs: [MITRE-ATTACK:T1098, NIST-800-53:AC-6(5), CIS-Controls-v8:5.4]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\Groups\\' }
        - any:
            - all: [ { field: Properties.groupSid, op: exists }, { field: Properties.groupSid, op: eq, value: S-1-5-32-544 } ]
            - { field: name, op: match, value: '^(BUILTIN\\)?Administrators( \(built-in\))?$' }
            - all: [ { field: Properties.groupName, op: exists }, { field: Properties.groupName, op: match, value: '^(BUILTIN\\)?Administrators( \(built-in\))?$' } ]
        - { field: Properties.Members.Member, op: exists }
        - element:
            of: Properties.Members.Member
            where:
              all:
                - { field: action, op: eq, value: ADD }
                - { field: name, op: match, value: '%LogonUser%|%USERNAME%' }
    evidence: '{gpo} {_file}: "{name}" adds the logged-on user'

  - id: GPO-GPP-REMOTE-GROUP-BROAD-MEMBER
    title: Preference adds a broad group to Remote Desktop or Remote Management Users
    category: IAM
    severity: high
    why: Every account in the broad group can then sign in remotely to the computers in scope.
    fix: Remove the member and grant remote access to a reviewed group per server role.
    refs: [MITRE-ATTACK:T1021.001, MITRE-ATTACK:T1021.006, NIST-800-53:AC-17]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\Groups\\' }
        - any:
            - all: [ { field: Properties.groupSid, op: exists }, { field: Properties.groupSid, op: in, value: [S-1-5-32-555, S-1-5-32-580] } ]
            - { field: name, op: match, value: '^(BUILTIN\\)?(Remote Desktop Users|Remote Management Users)( \(built-in\))?$' }
            - all: [ { field: Properties.groupName, op: exists }, { field: Properties.groupName, op: match, value: '^(BUILTIN\\)?(Remote Desktop Users|Remote Management Users)( \(built-in\))?$' } ]
        - { field: Properties.Members.Member, op: exists }
        - element:
            of: Properties.Members.Member
            where:
              all:
                - { field: action, op: eq, value: ADD }
                - any:
                    - all: [ { field: sid, op: exists }, { field: sid, op: match, value: '^(S-1-1-0|S-1-5-11|S-1-5-4|S-1-5-32-545|S-1-5-21-\d+-\d+-\d+-(513|515))$' } ]
                    - { field: name, op: match, value: '^(.*\\)?(Everyone|Authenticated Users|Domain Users|Users|Domain Computers|INTERACTIVE)$' }
    evidence: '{gpo} {_file}: "{name}" adds {Properties.Members.Member.name}{Properties.Members.Member[].name}'

  - id: GPO-GPP-BACKUP-OPS-BROAD-MEMBER
    title: Preference adds a broad group to Backup Operators
    category: IAM
    severity: high
    why: Backup Operators can read every file on the computer regardless of permissions, so a broad member gives that to every user.
    fix: Remove the member; keep Backup Operators empty or limited to the backup service identity.
    refs: [MITRE-ATTACK:T1098, NIST-800-53:AC-6]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\Groups\\' }
        - any:
            - all: [ { field: Properties.groupSid, op: exists }, { field: Properties.groupSid, op: eq, value: S-1-5-32-551 } ]
            - { field: name, op: match, value: '^(BUILTIN\\)?Backup Operators( \(built-in\))?$' }
            - all: [ { field: Properties.groupName, op: exists }, { field: Properties.groupName, op: match, value: '^(BUILTIN\\)?Backup Operators( \(built-in\))?$' } ]
        - { field: Properties.Members.Member, op: exists }
        - element:
            of: Properties.Members.Member
            where:
              all:
                - { field: action, op: eq, value: ADD }
                - any:
                    - all: [ { field: sid, op: exists }, { field: sid, op: match, value: '^(S-1-1-0|S-1-5-11|S-1-5-4|S-1-5-32-545|S-1-5-21-\d+-\d+-\d+-(513|515))$' } ]
                    - { field: name, op: match, value: '^(.*\\)?(Everyone|Authenticated Users|Domain Users|Users|Domain Computers|INTERACTIVE)$' }
    evidence: '{gpo} {_file}: "{name}" adds {Properties.Members.Member.name}{Properties.Members.Member[].name}'

  - id: GPO-GPP-LOCAL-USER-CREATED
    title: Preference creates a local user account
    category: IAM
    severity: medium
    why: A policy-created local account exists with the same name on every computer in scope and is rarely reviewed.
    fix: Delete the item and the account unless there is a documented need; manage any required local account with LAPS.
    refs: [MITRE-ATTACK:T1136.001, NIST-800-53:AC-2]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: _file, op: match, value: '\\Preferences\\Groups\\' }
        - { field: Properties.userName, op: exists }
        - { field: Properties.action, op: in, value: [C, R] }
    evidence: '{gpo} {_file}: creates local user {Properties.userName} (action {Properties.action})'

  - id: GPO-GPP-GROUPS-IN-USER-SCOPE
    title: Local group membership changed from the User half of a GPO
    lens: both
    category: IAM
    severity: medium
    why: User-scope group items apply on whatever computer the user signs in to, so the membership follows the user and is easy to miss in computer policy reviews.
    fix: Move the item to Computer Configuration in a GPO scoped to the computers that need it, or remove it.
    refs: [NIST-800-53:AC-6, NIST-800-53:CM-6]
    query: { protocol: gpo, part: preferences, scope: both, key: '{gpo}|{_file}|{uid}|{name}', name: gpo }
    each:
      all:
        - { field: scope, op: eq, value: user }
        - { field: _file, op: match, value: '\\Preferences\\Groups\\' }
        - { field: Properties.groupName, op: exists }
    evidence: '{gpo} {_file}: user-scope item changes local group "{name}"'

  - id: GPO-RESTRICTED-ADMINS-BROAD-MEMBER
    title: Restricted Groups puts a broad group in Administrators
    category: IAM
    severity: critical
    entity: gpo-setting
    why: Every account in the broad group becomes an administrator wherever this GPO applies; on a domain controller policy that means the domain.
    fix: Remove the broad group from the restricted membership and list only reviewed admin groups.
    refs: [MITRE-ATTACK:T1098, NIST-800-53:AC-6(5), CIS-Controls-v8:5.4]
    query: { protocol: gpo, part: security, scope: machine, key: '{gpo}|{section}|{key}', name: gpo, min_rows: 1 }
    each:
      all:
        - { field: section, op: eq, value: Group Membership }
        - { field: key, op: match, value: '^\*?(S-1-5-32-544|Administrators|S-1-5-21-\d+-\d+-\d+-(512|518|519)|Domain Admins|Enterprise Admins|Schema Admins)__Members$' }
        - { field: values, op: notempty }
        - { field: values, op: match, value: '^(S-1-1-0|S-1-5-11|S-1-5-4|S-1-5-32-545|S-1-5-21-\d+-\d+-\d+-(513|515)|(.*\\)?(Everyone|Authenticated Users|Domain Users|Users|Domain Computers|INTERACTIVE))$' }
    evidence: '{gpo}: {key} = {value}'

  - id: GPO-RESTRICTED-REMOTE-GROUP-BROAD-MEMBER
    title: Restricted Groups puts a broad group in Remote Desktop or Remote Management Users
    category: IAM
    severity: high
    entity: gpo-setting
    why: Every account in the broad group can then sign in remotely wherever this GPO applies.
    fix: Remove the broad group and list only reviewed groups per server role.
    refs: [MITRE-ATTACK:T1021.001, MITRE-ATTACK:T1021.006, NIST-800-53:AC-17]
    query: { protocol: gpo, part: security, scope: machine, key: '{gpo}|{section}|{key}', name: gpo, min_rows: 1 }
    each:
      all:
        - { field: section, op: eq, value: Group Membership }
        - { field: key, op: match, value: '^\*?(S-1-5-32-555|S-1-5-32-580|Remote Desktop Users|Remote Management Users)__Members$' }
        - { field: values, op: notempty }
        - { field: values, op: match, value: '^(S-1-1-0|S-1-5-11|S-1-5-4|S-1-5-32-545|S-1-5-21-\d+-\d+-\d+-(513|515)|(.*\\)?(Everyone|Authenticated Users|Domain Users|Users|Domain Computers|INTERACTIVE))$' }
    evidence: '{gpo}: {key} = {value}'

  - id: GPO-RESTRICTED-BACKUP-OPS-BROAD-MEMBER
    title: Restricted Groups puts a broad group in Backup Operators
    category: IAM
    severity: high
    entity: gpo-setting
    why: Backup Operators can read every file regardless of permissions, so a broad member gives that to every user.
    fix: Remove the broad group; keep Backup Operators empty or limited to the backup service identity.
    refs: [MITRE-ATTACK:T1098, NIST-800-53:AC-6]
    query: { protocol: gpo, part: security, scope: machine, key: '{gpo}|{section}|{key}', name: gpo, min_rows: 1 }
    each:
      all:
        - { field: section, op: eq, value: Group Membership }
        - { field: key, op: match, value: '^\*?(S-1-5-32-551|Backup Operators)__Members$' }
        - { field: values, op: notempty }
        - { field: values, op: match, value: '^(S-1-1-0|S-1-5-11|S-1-5-4|S-1-5-32-545|S-1-5-21-\d+-\d+-\d+-(513|515)|(.*\\)?(Everyone|Authenticated Users|Domain Users|Users|Domain Computers|INTERACTIVE))$' }
    evidence: '{gpo}: {key} = {value}'

  - id: GPO-RESTRICTED-BROAD-MEMBEROF-PRIVILEGED
    title: Restricted Groups makes a broad group a member of a privileged group
    category: IAM
    severity: critical
    entity: gpo-setting
    why: A "member of" entry for Everyone, Authenticated Users, Domain Users or Users places all those accounts in an admin or remote-access group wherever the GPO applies.
    fix: Remove the entry and grant the privileged group to reviewed admin groups only.
    refs: [MITRE-ATTACK:T1098, NIST-800-53:AC-6(5)]
    query: { protocol: gpo, part: security, scope: machine, key: '{gpo}|{section}|{key}', name: gpo, min_rows: 1 }
    each:
      all:
        - { field: section, op: eq, value: Group Membership }
        - { field: key, op: match, value: '^\*?(S-1-1-0|S-1-5-11|S-1-5-4|S-1-5-32-545|S-1-5-21-\d+-\d+-\d+-(513|515)|Everyone|Authenticated Users|Domain Users|Users|Domain Computers|INTERACTIVE)__Memberof$' }
        - { field: values, op: notempty }
        - { field: values, op: match, value: '^(S-1-5-32-(544|551|555|580)|S-1-5-21-\d+-\d+-\d+-(512|518|519)|(.*\\)?(Administrators|Backup Operators|Remote Desktop Users|Remote Management Users|Domain Admins|Enterprise Admins|Schema Admins))$' }
    evidence: '{gpo}: {key} = {value}'

  - id: GPO-RESTRICTED-ADMINS-EMPTIED
    title: Restricted Groups sets local Administrators to no members
    kind: broken
    lens: both
    category: IAM
    severity: medium
    entity: gpo-setting
    why: An empty restricted membership removes every member, including the domain admin groups, from local Administrators wherever the GPO applies, which can cut off central administration.
    fix: List the intended admin groups in the restricted membership, or remove the entry if it was not meant to clear the group.
    refs: [NIST-800-53:AC-6, NIST-800-53:CM-6]
    query: { protocol: gpo, part: security, scope: machine, key: '{gpo}|{section}|{key}', name: gpo, min_rows: 1 }
    each:
      all:
        - { field: section, op: eq, value: Group Membership }
        - { field: key, op: match, value: '^\*?(S-1-5-32-544|Administrators)__Members$' }
        - { field: value, op: eq, value: '' }
    evidence: '{gpo}: {key} is empty'

  # ================================================================ 3. user rights assignments (GptTmpl.inf [Privilege Rights])

  - id: GPO-URA-DEBUG-BROAD
    title: Debug programs right granted to a broad group
    category: IAM
    severity: critical
    entity: gpo-setting
    why: The debug right gives access to the memory of any process, including the one that holds signed-in users' credentials. Only Administrators should have it.
    fix: Limit "Debug programs" to Administrators, or leave it undefined.
    refs: [MITRE-ATTACK:T1134, NIST-800-53:AC-6(10)]
    query: { protocol: gpo, part: security, scope: machine, key: '{gpo}|{section}|{key}', name: gpo, min_rows: 1 }
    each:
      all:
        - { field: section, op: eq, value: Privilege Rights }
        - { field: key, op: eq, value: SeDebugPrivilege }
        - { field: values, op: notempty }
        - { field: values, op: match, value: '^(S-1-1-0|S-1-5-7|S-1-5-11|S-1-5-2|S-1-5-4|S-1-5-32-545|S-1-5-32-546|S-1-5-21-\d+-\d+-\d+-(501|513|514|515)|(.*\\)?(Everyone|Authenticated Users|Domain Users|Users|Domain Computers|Guests|Domain Guests|Guest|ANONYMOUS LOGON|INTERACTIVE|NETWORK))$' }
    evidence: '{gpo}: {key} = {value}'

  - id: GPO-URA-BACKUP-RESTORE-BROAD
    title: Back up or restore files right granted to a broad group
    category: IAM
    severity: critical
    entity: gpo-setting
    why: These rights read or replace any file regardless of its permissions, including system and directory database files.
    fix: Limit "Back up files and directories" and "Restore files and directories" to Administrators and Backup Operators (or the backup service identity).
    refs: [MITRE-ATTACK:T1003.003, NIST-800-53:AC-6(10)]
    query: { protocol: gpo, part: security, scope: machine, key: '{gpo}|{section}|{key}', name: gpo, min_rows: 1 }
    each:
      all:
        - { field: section, op: eq, value: Privilege Rights }
        - { field: key, op: in, value: [SeBackupPrivilege, SeRestorePrivilege] }
        - { field: values, op: notempty }
        - { field: values, op: match, value: '^(S-1-1-0|S-1-5-7|S-1-5-11|S-1-5-2|S-1-5-4|S-1-5-32-545|S-1-5-32-546|S-1-5-21-\d+-\d+-\d+-(501|513|514|515)|(.*\\)?(Everyone|Authenticated Users|Domain Users|Users|Domain Computers|Guests|Domain Guests|Guest|ANONYMOUS LOGON|INTERACTIVE|NETWORK))$' }
    evidence: '{gpo}: {key} = {value}'

  # The two rules below flag any holder outside the defaults - a named service account or user, an extra
  # group. The broad groups are left to the -BROAD rules above (no double finding). The threshold is the
  # whole pattern of allowed holders, so a tenant that adds its own SIDs keeps the defaults in it.

  - id: GPO-URA-DEBUG-UNEXPECTED-HOLDER
    title: Debug programs right granted to an account other than Administrators
    category: IAM
    severity: high
    entity: gpo-setting
    why: Whoever holds the debug right can read and change the memory of any process, including the one that holds signed-in users' credentials, so a service account or user with it is as powerful as a local administrator and is rarely watched as one. Software that genuinely needs it is uncommon; most grants are left over from troubleshooting.
    fix: Remove the extra holders from "Debug programs" so only Administrators remain (or leave the right undefined). If a product truly needs it, record the account in the threshold gpo.debug-allowed-pattern (a pattern that still includes S-1-5-32-544) and treat the account as privileged.
    refs: [MITRE-ATTACK:T1134, MITRE-ATTACK:T1003.001, NIST-800-53:AC-6(10)]
    query: { protocol: gpo, part: security, scope: machine, key: '{gpo}|{section}|{key}', name: gpo, min_rows: 1 }
    each:
      all:
        - { field: section, op: eq, value: Privilege Rights }
        - { field: key, op: eq, value: SeDebugPrivilege }
        - { field: values, op: notempty }
        - { field: values, op: notmatch, value: '^S-1-5-32-544$', threshold: gpo.debug-allowed-pattern }
        - not: { field: values, op: match, value: '^(S-1-1-0|S-1-5-7|S-1-5-11|S-1-5-2|S-1-5-4|S-1-5-32-545|S-1-5-32-546|S-1-5-21-\d+-\d+-\d+-(501|513|514|515)|(.*\\)?(Everyone|Authenticated Users|Domain Users|Users|Domain Computers|Guests|Domain Guests|Guest|ANONYMOUS LOGON|INTERACTIVE|NETWORK))$' }
    evidence: '{gpo}: {key} = {value}'

  - id: GPO-URA-BACKUP-RESTORE-UNEXPECTED-HOLDER
    title: Back up or restore files right granted to an account outside the expected groups
    category: IAM
    severity: medium
    entity: gpo-setting
    why: The backup and restore rights read or replace any file whatever its permissions - on a domain controller that includes the directory database and its secrets - so a named service account or user holding them is effectively an administrator of every computer in scope. Administrators, Backup Operators and, on domain controllers, Server Operators are the defaults and are not flagged.
    fix: Remove the extra holders. If a backup product's service account needs the rights, keep them to the servers it backs up, record the account in the threshold gpo.backup-allowed-pattern (a pattern that still includes the default SIDs) and protect the account as tier 0 where it covers domain controllers.
    refs: [MITRE-ATTACK:T1003.003, NIST-800-53:AC-6(10)]
    query: { protocol: gpo, part: security, scope: machine, key: '{gpo}|{section}|{key}', name: gpo, min_rows: 1 }
    each:
      all:
        - { field: section, op: eq, value: Privilege Rights }
        - { field: key, op: in, value: [SeBackupPrivilege, SeRestorePrivilege] }
        - { field: values, op: notempty }
        - { field: values, op: notmatch, value: '^S-1-5-32-(544|549|551)$', threshold: gpo.backup-allowed-pattern }
        - not: { field: values, op: match, value: '^(S-1-1-0|S-1-5-7|S-1-5-11|S-1-5-2|S-1-5-4|S-1-5-32-545|S-1-5-32-546|S-1-5-21-\d+-\d+-\d+-(501|513|514|515)|(.*\\)?(Everyone|Authenticated Users|Domain Users|Users|Domain Computers|Guests|Domain Guests|Guest|ANONYMOUS LOGON|INTERACTIVE|NETWORK))$' }
    evidence: '{gpo}: {key} = {value}'

  - id: GPO-URA-TAKE-OWNERSHIP-BROAD
    title: Take ownership right granted to a broad group
    category: IAM
    severity: critical
