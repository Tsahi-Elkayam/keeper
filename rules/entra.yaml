    fix: "Add session controls to the admin-role policy: sign-in frequency 4 hours or less, persistent browser session Never."
    refs: [CIS-M365-5.2.2.4, "NIST-800-53:AC-12", "NIST-800-53:IA-11"]
    query:
      protocol: graph
