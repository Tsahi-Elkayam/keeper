    why: "Legacy protocols (POP, IMAP, SMTP AUTH, old ActiveSync clients) cannot do MFA and carry most password-spray traffic. A policy counts if it targets all users and all resources, selects both Exchange ActiveSync and Other clients, and grants Block."
    fix: "Create (or switch on) a policy: users All (exclude emergency access), resources All, client apps Exchange ActiveSync + Other clients, grant Block."
    refs: [CIS-M365-5.2.2.3, "NIST-800-53:IA-2(1)", "NIST-800-53:CM-7"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: state, op: eq, value: enabled }
          - { field: conditions.users.includeUsers, op: contains, value: All }
          - { field: conditions.applications.includeApplications, op: contains, value: All }
          - { field: conditions.clientAppTypes, op: contains, value: exchangeActiveSync }
          - { field: conditions.clientAppTypes, op: contains, value: other }
          - { field: grantControls.builtInControls, op: contains, value: block }
          - { field: conditions.signInRiskLevels, op: empty }
          - { field: conditions.userRiskLevels, op: empty }
    evidence: "{count} enforced legacy-authentication block policies among {rows} policies"

