  #   243333ab-4d21-40cb-a475-36241daa0842 DeviceManagementManagedDevices.ReadWrite.All
  #   9241abd9-d0e6-425a-bd4f-47ba86e767a4 DeviceManagementConfiguration.ReadWrite.All
  - id: ENTRA-APPPERM-TIER0
    title: Application holds a tenant-takeover Microsoft Graph permission
    kind: misconfigured
    category: IAM
    severity: high
    entity: app-permission-grant
    why: "These application permissions act without a signed-in user and can grant roles, add credentials to any app, change Conditional Access or reset authentication methods; whoever holds the app's credential effectively owns the tenant."
    fix: "Confirm the owner and the need; replace with the narrowest permission that works, keep the app's credentials in a vault and its owners few; remove grants of apps no longer used."
    refs: ["NIST-800-53:AC-6", "NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /servicePrincipals(appId='00000003-0000-0000-c000-000000000000')/appRoleAssignedTo
      top: 999
      key: id
      name: principalDisplayName
    each:
      all:
        - { field: principalType, op: eq, value: ServicePrincipal }
        - field: appRoleId
          op: in
          threshold: entra.graph-tier0-app-role-ids
          value: [9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8, 06b708a9-e830-4db3-a914-8e69da51d44f, 1bfefb4e-e0b5-418b-a88f-73c46d2cc8e9, 19dbc75e-c2e2-444c-a770-ec69d8559fc7, 01c0a623-fc9b-48e9-b794-0756f8e8f067, 29c18626-4985-4dcd-85c0-193eef327366, a402ca1c-2696-4531-972d-6e5ee4aa11ea, 50483e42-d915-4231-9639-7fdb7fd190e5, 8e8e4742-1d95-4f68-9d56-6ee75648c72a, 7e05723c-0bb0-42da-be95-ae9f08a6e53c, 292d869f-3427-49a8-9dab-8c70152b74e9, e330c4f0-4170-414e-a55a-2f022ec2b57b]
    evidence: "{principalDisplayName} holds Graph application permission {appRoleId} (granted {createdDateTime})"

  - id: ENTRA-APPPERM-DATA
    title: Application holds a tenant-wide data access Microsoft Graph permission
    kind: misconfigured
    category: IAM
    severity: medium
    entity: app-permission-grant
    why: "These application permissions read or change every mailbox, file, site, user, group or managed device in the tenant without a signed-in user; a leaked credential of the app is a tenant-wide data breach."
    fix: "Scope the access (Sites.Selected, Exchange application RBAC, resource-specific consent) or justify it in writing; remove grants of apps no longer used."
    refs: ["NIST-800-53:AC-6", "NIST-800-53:AC-3"]
    query:
      protocol: graph
      path: /servicePrincipals(appId='00000003-0000-0000-c000-000000000000')/appRoleAssignedTo
      top: 999
      key: id
      name: principalDisplayName
    each:
      all:
        - { field: principalType, op: eq, value: ServicePrincipal }
        - field: appRoleId
          op: in
          threshold: entra.graph-data-app-role-ids
          value: [62a82d76-70ea-41e2-9197-370581804d09, dbaae8cf-10b5-4b86-a4a1-f871c94c6695, 741f803b-c850-494e-b5df-cde7c675a1ca, e2a3a72e-5f79-4c64-b1b1-878b674786c9, 810c84a8-4a9e-49e6-bf7d-12d183f40d01, b633e1c5-b582-4048-a93e-9f11b44c7e96, 6931bccd-447a-43d1-b442-00a195474933, 75359482-378d-4052-8f01-80520e7db3cd, 01d4889c-1287-42c6-ac1f-5d1e02578ef6, 9492366f-7969-46a4-8d15-ed1a20078fff, a82116e5-55eb-4c41-a434-62fe8a61c773, 243333ab-4d21-40cb-a475-36241daa0842, 9241abd9-d0e6-425a-bd4f-47ba86e767a4]
    evidence: "{principalDisplayName} holds Graph application permission {appRoleId} (granted {createdDateTime})"

  # Exchange Online (00000002-0000-0ff1-ce00-000000000000) and SharePoint Online
  # (00000003-0000-0ff1-ce00-000000000000) application permission ids, Microsoft constants:
  #   dc890d15-9560-4a4c-9b7f-a736ec74ec40 full_access_as_app (Exchange: every mailbox through EWS)
  #   dc50a0fb-09a3-484d-be87-e023b12c6440 Exchange.ManageAsApp (Exchange admin PowerShell as the app)
  #   678536fe-1083-478a-9c59-b99265e6b0d3 Sites.FullControl.All (SharePoint)
  #   fbcd29d2-fcca-4405-aded-518d457caae4 Sites.ReadWrite.All (SharePoint)
  - id: ENTRA-APPPERM-EXCHANGE-APP-ACCESS
    title: Application holds tenant-wide Exchange Online application access
    kind: misconfigured
    category: IAM
    severity: high
    entity: app-permission-grant
    why: "These Exchange Online application permissions open every mailbox (full_access_as_app through EWS) or run Exchange administration as the app, without a signed-in user. The Graph permission rules do not see them because they sit on the Exchange resource, which is the other door to all mail."
    fix: "Replace full mailbox access with Exchange application RBAC scoped to the mailboxes the app needs, or document the app and lock its owners and credentials down; remove grants of apps no longer used."
    refs: ["MITRE-ATTACK:T1114.002", "MITRE-ATTACK:T1528", "NIST-800-53:AC-6", "NIST-800-53:AC-3"]
    query:
      protocol: graph
      path: /servicePrincipals(appId='00000002-0000-0ff1-ce00-000000000000')/appRoleAssignedTo
      top: 999
      key: id
      name: principalDisplayName
    each:
      all:
        - { field: principalType, op: eq, value: ServicePrincipal }
        - field: appRoleId
          op: in
          threshold: entra.exchange-app-role-ids
          value: [dc890d15-9560-4a4c-9b7f-a736ec74ec40, dc50a0fb-09a3-484d-be87-e023b12c6440]
    evidence: "{principalDisplayName} holds Exchange application permission {appRoleId} (granted {createdDateTime})"

  - id: ENTRA-APPPERM-SHAREPOINT-FULL-CONTROL
    title: Application holds tenant-wide SharePoint Online application access
    kind: misconfigured
    category: IAM
    severity: high
    entity: app-permission-grant
    why: "Full control or read-write over every site, granted on the SharePoint resource rather than on Graph, lets the app read and change all document libraries and OneDrives without a signed-in user; the Graph permission rules do not see it."
    fix: "Move the app to Sites.Selected with per-site grants; remove the grants of apps no longer used."
    refs: ["MITRE-ATTACK:T1530", "NIST-800-53:AC-6", "NIST-800-53:AC-3"]
    query:
      protocol: graph
      path: /servicePrincipals(appId='00000003-0000-0ff1-ce00-000000000000')/appRoleAssignedTo
      top: 999
      key: id
      name: principalDisplayName
    each:
      all:
        - { field: principalType, op: eq, value: ServicePrincipal }
        - field: appRoleId
          op: in
          threshold: entra.sharepoint-app-role-ids
          value: [678536fe-1083-478a-9c59-b99265e6b0d3, fbcd29d2-fcca-4405-aded-518d457caae4]
    evidence: "{principalDisplayName} holds SharePoint application permission {appRoleId} (granted {createdDateTime})"

  # WindowsDefenderATP (fc780465-2017-40d4-a0c5-307022471b92) is the Defender for Endpoint API resource,
  # a Microsoft first-party application id. Tenants where Defender for Endpoint was never provisioned
  # have no such service principal and the query fails (the rule records unknown).
  - id: DEFENDER-APPPERM-MDE-API
    title: Application holds application permissions on the Defender for Endpoint API
    kind: misconfigured
    category: IAM
    severity: medium
    entity: app-permission-grant
    why: "Depending on the role, an application with Defender for Endpoint API permissions reads every device and alert, isolates devices, runs live response or allow-lists files through indicators; its credential is as valuable as a security administrator's password. The grants sit on the Defender for Endpoint resource, so the Graph permission rules do not see them. A review list: accept each documented integration (SIEM, SOAR) with its owner."
    fix: "Keep only the integrations that need the access, read-only roles where possible; remove unknown grants and rotate the credentials of apps that held more than they needed."
    refs: ["MITRE-ATTACK:T1098.001", "NIST-800-53:AC-6", "NIST-800-53:IA-9", "CIS-Controls-v8:6.8"]
    query:
      protocol: graph
      path: /servicePrincipals(appId='fc780465-2017-40d4-a0c5-307022471b92')/appRoleAssignedTo
      top: 999
      key: id
      name: principalDisplayName
    each: { field: principalType, op: eq, value: ServicePrincipal }
    evidence: "{principalDisplayName} holds Defender for Endpoint application role {appRoleId} (granted {createdDateTime})"

  - id: ENTRA-CONSENT-TENANT-WIDE-BROAD
    title: Tenant-wide delegated consent with broad write or mail scopes
    kind: misconfigured
    category: IAM
    severity: medium
    entity: consent-grant
    why: "An admin (all-principals) consent lets the app act as any user who signs in to it, within these scopes; broad write and mail scopes make the app a data-exfiltration path."
    fix: "Review the grant: remove it for apps no longer used and reduce the scopes to what the app needs; route future requests through the admin consent workflow."
    refs: ["NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /oauth2PermissionGrants
      filter: "consentType eq 'AllPrincipals'"
      key: id
      name: clientId
    each: { field: scope, op: match, value: '(\.ReadWrite\.All|Mail\.ReadWrite|Mail\.Send|Files\.ReadWrite|Sites\.FullControl|Directory\.AccessAsUser\.All|full_access_as_user|RoleManagement\.ReadWrite|Application\.ReadWrite)', threshold: entra.consent-broad-scope-pattern }
    evidence: "client {clientId} -> resource {resourceId}: {scope}"

  - id: ENTRA-CONSENT-USER-HIGH-RISK
    title: User-consented app reads or sends mail or files
    kind: misconfigured
    category: IAM
    severity: medium
    entity: consent-grant
    why: "A user consent to mail or file scopes is how illicit-consent phishing persists: the app keeps reading the mailbox after the password is reset."
    fix: "Check the app's publisher and use; revoke the grant if the app is not sanctioned and restrict user consent (ENTRA-AUTHZ-USER-CONSENT)."
    refs: ["NIST-800-53:AC-6", "NIST-800-53:IR-4"]
    query:
      protocol: graph
      path: /oauth2PermissionGrants
      filter: "consentType eq 'Principal'"
      key: id
      name: clientId
    each: { field: scope, op: match, value: '(Mail\.ReadWrite|Mail\.Send|Mail\.Read(\s|$)|MailboxSettings\.ReadWrite|Files\.ReadWrite\.All|Files\.Read\.All|Sites\.ReadWrite\.All|Directory\.AccessAsUser\.All|full_access_as_user|EWS\.AccessAsUser\.All)', threshold: entra.consent-user-risky-scope-pattern }
    evidence: "user {principalId}: client {clientId} -> resource {resourceId}: {scope}"

  # ================================================================ tenant app policies ===
  - id: ENTRA-CONSENT-WORKFLOW-OFF
    title: Admin consent request workflow is off
    kind: missing
    category: IAM
    severity: medium
    entity: policy
    why: "With user consent restricted and no request workflow, users either give up or ask an admin to grant consent ad hoc, without a record or a second look."
    fix: "Enable the admin consent workflow with named reviewers and notifications."
    refs: [CIS-M365-5.1.5.2, "NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /policies/adminConsentRequestPolicy
      key: id
    each: { field: isEnabled, op: eq, value: false }
    evidence: "adminConsentRequestPolicy isEnabled = {isEnabled}"

  - id: ENTRA-APPPOLICY-OFF
    title: Tenant-wide app credential restrictions are off
    kind: missing
    category: PKI
    severity: medium
    entity: policy
    why: "The default app management policy is what caps secret lifetimes and blocks caller-chosen passwords on every app; switched off, any owner can add a ten-year secret. Some restrictions need Workload ID Premium."
    fix: "Enable the default app management policy with password lifetime, custom password and certificate lifetime restrictions."
    refs: [CIS-M365-5.1.5.4, "NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /policies/defaultAppManagementPolicy
      key: id
    each: { field: isEnabled, op: eq, value: false }
    evidence: "defaultAppManagementPolicy isEnabled = {isEnabled}"

  - id: ENTRA-APPPOLICY-NO-SECRET-LIFETIME
    title: No tenant-wide cap on client secret lifetime
    kind: missing
    category: PKI
    severity: medium
    entity: policy
    why: "Without a password-lifetime restriction new secrets can be created with lifetimes of years; long-lived secrets leak and are never rotated. Whether the configured maximum is short enough is not checked here (see backlog)."
    fix: "Add a passwordLifetime restriction (for example 180 days) for both applications and service principals."
    refs: [CIS-M365-5.1.5.4, "NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /policies/defaultAppManagementPolicy
      key: id
    each:
      any:
        - { field: applicationRestrictions.passwordCredentials, op: empty }
        - { field: 'applicationRestrictions.passwordCredentials[].restrictionType', op: notcontains, value: passwordLifetime }
        - { field: servicePrincipalRestrictions.passwordCredentials, op: empty }
        - { field: 'servicePrincipalRestrictions.passwordCredentials[].restrictionType', op: notcontains, value: passwordLifetime }
    evidence: "application restrictions {applicationRestrictions.passwordCredentials[].restrictionType}; service principal restrictions {servicePrincipalRestrictions.passwordCredentials[].restrictionType}"

  - id: ENTRA-APPPOLICY-CUSTOM-PASSWORD-ALLOWED
    title: Caller-chosen client secrets are not blocked
    kind: missing
    category: PKI
    severity: low
    entity: policy
    why: "A secret chosen by the caller can be weak or reused; letting Entra generate secrets removes that risk."
    fix: "Add a customPasswordAddition restriction for applications and service principals."
    refs: [CIS-M365-5.1.5.5, "NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /policies/defaultAppManagementPolicy
      key: id
    each:
      any:
        - { field: applicationRestrictions.passwordCredentials, op: empty }
        - { field: 'applicationRestrictions.passwordCredentials[].restrictionType', op: notcontains, value: customPasswordAddition }
        - { field: servicePrincipalRestrictions.passwordCredentials, op: empty }
        - { field: 'servicePrincipalRestrictions.passwordCredentials[].restrictionType', op: notcontains, value: customPasswordAddition }
    evidence: "application restrictions {applicationRestrictions.passwordCredentials[].restrictionType}; service principal restrictions {servicePrincipalRestrictions.passwordCredentials[].restrictionType}"

  - id: ENTRA-APPPOLICY-NO-CERT-LIFETIME
    title: No tenant-wide cap on certificate credential lifetime
    kind: missing
    category: PKI
    severity: low
    entity: policy
    why: "Without an asymmetric-key lifetime restriction app certificates can be uploaded with very long validity and are never rotated."
    fix: "Add an asymmetricKeyLifetime restriction for applications and service principals."
    refs: [CIS-M365-5.1.5.6, "NIST-800-53:IA-5(2)"]
    query:
      protocol: graph
      path: /policies/defaultAppManagementPolicy
      key: id
    each:
      any:
        - { field: applicationRestrictions.keyCredentials, op: empty }
        - { field: 'applicationRestrictions.keyCredentials[].restrictionType', op: notcontains, value: asymmetricKeyLifetime }
        - { field: servicePrincipalRestrictions.keyCredentials, op: empty }
        - { field: 'servicePrincipalRestrictions.keyCredentials[].restrictionType', op: notcontains, value: asymmetricKeyLifetime }
    evidence: "application key restrictions {applicationRestrictions.keyCredentials[].restrictionType}; service principal key restrictions {servicePrincipalRestrictions.keyCredentials[].restrictionType}"

  - id: ENTRA-PERMISSION-GRANT-POLICY-CUSTOM
    title: Custom permission grant policy exists
    kind: misconfigured
    category: IAM
    severity: low
    entity: permission-grant-policy
    why: "Custom permission grant policies widen what users or group owners may consent to; each one should match a documented consent decision."
    fix: "Review the policy's include and exclude conditions; delete it if no consent setting uses it."
    refs: ["NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /policies/permissionGrantPolicies
      key: id
      name: displayName
    each: { field: id, op: notmatch, value: '^microsoft-' }
    evidence: "custom permission grant policy {displayName} ({id})"

  - id: ENTRA-TOKEN-LIFETIME-CUSTOM
    title: Custom token lifetime policy exists
    kind: misconfigured
    category: AUT
    severity: medium
    entity: token-lifetime-policy
    why: "Custom token lifetimes are a legacy mechanism; extended tokens survive password resets and account disablement for their whole lifetime."
    fix: "Delete the custom policy and use Conditional Access sign-in frequency instead."
    refs: ["NIST-800-53:AC-12", "NIST-800-53:SC-23"]
    query:
      protocol: graph
      path: /policies/tokenLifetimePolicies
      key: id
      name: displayName
    count: some
    evidence: "{count} custom token lifetime policies: {sample}"

  - id: ENTRA-SELF-SERVICE-SIGNUP-ON
    title: Self-service sign-up for external users is enabled
    kind: misconfigured
    category: IAM
    severity: low
    entity: policy
    why: "Self-service sign-up user flows let external people create their own guest accounts in the tenant; unless an External ID flow is in deliberate use, it is an unwatched door."
    fix: "Disable self-service sign-up unless a user flow needs it."
    refs: ["NIST-800-53:AC-2(9)"]
    query:
      protocol: graph
      path: /policies/authenticationFlowsPolicy
      key: id
    each: { field: selfServiceSignUp.isEnabled, op: eq, value: true }
    evidence: "selfServiceSignUp.isEnabled = {selfServiceSignUp.isEnabled}"

  - id: ENTRA-XTAP-TRUST-MFA-ANY-TENANT
    title: MFA claims from any other tenant are trusted
    kind: misconfigured
    category: AUT
    severity: low
    entity: policy
    why: "Trusting inbound MFA by default means a guest's MFA, done under another organisation's (possibly weak) policy, satisfies your MFA requirement."
    fix: "Trust inbound MFA only in the cross-tenant settings of named partner organisations."
    refs: ["NIST-800-53:AC-20", "NIST-800-53:IA-8"]
    query:
      protocol: graph
      path: /policies/crossTenantAccessPolicy/default
      key: id
    each: { field: inboundTrust.isMfaAccepted, op: eq, value: true }
    evidence: "default inbound trust isMfaAccepted = {inboundTrust.isMfaAccepted}"

  - id: ENTRA-XTAP-TRUST-DEVICE-ANY-TENANT
    title: Device compliance claims from any other tenant are trusted
    kind: misconfigured
    category: AUT
    severity: medium
    entity: policy
    why: "With default device trust, a device that another organisation calls compliant or hybrid-joined satisfies your device-based Conditional Access."
    fix: "Trust compliant and hybrid-joined device claims only for named partner organisations."
    refs: ["NIST-800-53:AC-20", "NIST-800-53:AC-19"]
    query:
      protocol: graph
      path: /policies/crossTenantAccessPolicy/default
      key: id
    each:
      any:
        - { field: inboundTrust.isCompliantDeviceAccepted, op: eq, value: true }
        - { field: inboundTrust.isHybridAzureADJoinedDeviceAccepted, op: eq, value: true }
    evidence: "default inbound trust: compliant {inboundTrust.isCompliantDeviceAccepted}, hybrid-joined {inboundTrust.isHybridAzureADJoinedDeviceAccepted}"

  - id: ENTRA-XTAP-DIRECT-CONNECT-INBOUND-OPEN
    title: B2B direct connect is open inbound to every organisation
    kind: misconfigured
    category: IAM
    severity: medium
    entity: policy
    why: "Microsoft's default blocks B2B direct connect (Teams shared channels with users who stay in their own tenant). When the default settings allow both users and applications inbound, any organisation's users can be added to shared channels without a guest account you can review."
    fix: "Block direct connect inbound in the default cross-tenant settings and allow it per named partner organisation."
    refs: ["NIST-800-53:AC-20", "NIST-800-53:AC-21", "MITRE-ATTACK:T1199"]
    query:
      protocol: graph
      path: /policies/crossTenantAccessPolicy/default
      key: id
    each:
      all:
        - { field: b2bDirectConnectInbound.usersAndGroups.accessType, op: eq, value: allowed }
        - { field: b2bDirectConnectInbound.applications.accessType, op: eq, value: allowed }
    evidence: "default B2B direct connect inbound: users {b2bDirectConnectInbound.usersAndGroups.accessType}, applications {b2bDirectConnectInbound.applications.accessType}"

  - id: ENTRA-XTAP-B2B-COLLABORATION-OPEN
    title: B2B collaboration is open in both directions with every organisation
    kind: misconfigured
    category: IAM
    severity: low
    entity: policy
    why: "Microsoft's default cross-tenant settings allow every user to collaborate with every other organisation, inbound and outbound, for all applications. That is a decision the tenant should make on purpose; left at the default nobody decided which partners may bring guests in or which tenants staff may join. Low, and accepted by override once decided."
    fix: "Decide the default: restrict inbound and outbound B2B collaboration in the default settings and open it per partner organisation where needed, or record the decision to stay open."
    refs: ["NIST-800-53:AC-20", "NIST-800-53:AC-21"]
    query:
      protocol: graph
      path: /policies/crossTenantAccessPolicy/default
      key: id
    each:
      all:
        - { field: b2bCollaborationInbound.usersAndGroups.accessType, op: eq, value: allowed }
        - { field: 'b2bCollaborationInbound.usersAndGroups.targets[].target', op: eq, value: AllUsers }
        - { field: b2bCollaborationInbound.applications.accessType, op: eq, value: allowed }
        - { field: 'b2bCollaborationInbound.applications.targets[].target', op: eq, value: AllApplications }
        - { field: b2bCollaborationOutbound.usersAndGroups.accessType, op: eq, value: allowed }
        - { field: b2bCollaborationOutbound.applications.accessType, op: eq, value: allowed }
    evidence: "default B2B collaboration: inbound users {b2bCollaborationInbound.usersAndGroups.accessType} ({b2bCollaborationInbound.usersAndGroups.targets[].target}), inbound apps {b2bCollaborationInbound.applications.accessType}, outbound users {b2bCollaborationOutbound.usersAndGroups.accessType}, outbound apps {b2bCollaborationOutbound.applications.accessType}"

  - id: ENTRA-XTAP-PARTNER-PRESENT
    title: Partner-specific cross-tenant access settings exist
    kind: misconfigured
    category: IAM
    severity:
      field: inboundTrust.isMfaAccepted
      map: { 'true': medium }
      default: info
    entity: xtap-partner
    why: "Each partner configuration was added for one project and is rarely removed; one that trusts the partner's MFA (medium) lets the partner's own, possibly weaker, MFA satisfy this tenant's policies. A review list: remove stale partners and accept the rest with their owner recorded. Settings left to inherit the default show as empty."
    fix: "Remove partner configurations nobody can explain; for the rest record the owner and purpose, and trust partner MFA or devices only where the partner's controls are known."
    refs: ["NIST-800-53:AC-20", "NIST-800-53:IA-8", "MITRE-ATTACK:T1199"]
    query:
      protocol: graph
      path: /policies/crossTenantAccessPolicy/partners
      key: tenantId
    each: any
    evidence: "partner tenant {tenantId}: service provider {isServiceProvider}, trusts MFA {inboundTrust.isMfaAccepted}, compliant devices {inboundTrust.isCompliantDeviceAccepted}, B2B inbound users {b2bCollaborationInbound.usersAndGroups.accessType}, direct connect inbound users {b2bDirectConnectInbound.usersAndGroups.accessType}"

  # ================================================================= device registration ===
  - id: ENTRA-DEVREG-QUOTA-HIGH
    title: Users may register too many devices
    kind: misconfigured
    category: CFG
    severity: low
    entity: policy
    why: "A high per-user device quota lets one compromised account register many devices and obtain device-bound tokens on each."
    fix: "Set the maximum number of devices per user to 10 or fewer."
    refs: [CIS-M365-5.1.4.2, "NIST-800-53:AC-19"]
    query:
      protocol: graph
      path: /policies/deviceRegistrationPolicy
      key: id
    each: { field: userDeviceQuota, op: gt, value: 10, threshold: entra.device-quota-max }
    evidence: "userDeviceQuota = {userDeviceQuota}"

  - id: ENTRA-DEVREG-GA-LOCAL-ADMIN
    title: Global Administrators become local admins on every joined device
    kind: misconfigured
    category: IAM
    severity: medium
    entity: policy
    why: "Every Entra-joined PC then has Global Administrator credentials usable for local admin, so harvesting credentials on one PC reaches the top of the tenant."
    fix: "Turn off 'Global administrator role is added as local administrator' and use a dedicated device-admin role or Entra LAPS."
    refs: [CIS-M365-5.1.4.3, "NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /policies/deviceRegistrationPolicy
      key: id
    each: { field: azureADJoin.localAdmins.enableGlobalAdmins, op: eq, value: true }
    evidence: "azureADJoin.localAdmins.enableGlobalAdmins = {azureADJoin.localAdmins.enableGlobalAdmins}"

  - id: ENTRA-DEVREG-JOINER-LOCAL-ADMIN
    title: Whoever joins a device becomes its local administrator
    kind: misconfigured
    category: IAM
    severity: medium
    entity: policy
    why: "With 'registering user is added as local administrator' set to All, every user who joins a PC can install software, disable protections and dump credentials on it."
    fix: "Set the registering-user local admin setting to None (or Selected) and grant local admin only through a managed group or Entra LAPS."
    refs: [CIS-M365-5.1.4.4, "NIST-800-53:AC-6(1)"]
    query:
      protocol: graph
      path: /policies/deviceRegistrationPolicy
      key: id
    each: { field: azureADJoin.localAdmins.registeringUsers, op: match, value: 'allDeviceRegistrationMembership' }
    evidence: "registering users added as local admin: {azureADJoin.localAdmins.registeringUsers}"

  - id: ENTRA-DEVREG-LAPS-OFF
    title: Microsoft Entra LAPS is not enabled
    kind: missing
    category: IAM
    severity: medium
    entity: policy
    why: "Without LAPS the built-in local administrator password is the same (or never rotated) across devices, so one cracked device opens the rest."
    fix: "Enable Microsoft Entra LAPS in device settings and deploy a Windows LAPS policy that backs up to Entra."
    refs: [CIS-M365-5.1.4.5, "NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /policies/deviceRegistrationPolicy
      key: id
    each: { field: localAdminPassword.isEnabled, op: eq, value: false }
    evidence: "localAdminPassword.isEnabled = {localAdminPassword.isEnabled}"

  # ======================================================================= groups ===
  - id: ENTRA-GROUP-DYNAMIC-PAUSED
    title: Dynamic group membership processing is paused
    kind: broken
    category: HLT
    severity: medium
    entity: group
    lens: both
    why: "A paused dynamic group stops adding joiners and removing leavers, so everything assigned to it drifts from the rule."
    fix: "Fix the rule if it was paused for an error, then resume processing."
    refs: ["NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, groupTypes, membershipRule, membershipRuleProcessingState, visibility, securityEnabled, mailEnabled, isAssignableToRole, onPremisesSyncEnabled]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: groupTypes, op: contains, value: DynamicMembership }
        - { field: membershipRuleProcessingState, op: ne, value: On }
    evidence: "{displayName}: processing {membershipRuleProcessingState}, rule {membershipRule}"

  - id: ENTRA-GROUP-M365-PUBLIC
    title: Microsoft 365 group is public
    kind: misconfigured
    category: IAM
    severity: low
    entity: group
    why: "Anyone in the tenant can join a public Microsoft 365 group and read its mailbox, files and Teams channels."
    fix: "Make the group private unless its content is meant for everyone."
    refs: ["NIST-800-53:AC-3"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, groupTypes, membershipRule, membershipRuleProcessingState, visibility, securityEnabled, mailEnabled, isAssignableToRole, onPremisesSyncEnabled]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: groupTypes, op: contains, value: Unified }
        - { field: visibility, op: eq, value: Public }
    evidence: "{displayName}: visibility {visibility}"

  - id: ENTRA-GROUP-M365-NO-OWNER
    title: Microsoft 365 group has no owner
    kind: missing
    category: HYG
    severity: low
    entity: group
    lens: both
    why: "Without an owner nobody approves joins, renews the group or decides when its content can go."
    fix: "Assign two owners, or let the group expiration policy retire it."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:CM-8(4)"]
    query:
      protocol: graph
      path: /groups
      filter: "groupTypes/any(c:c eq 'Unified')"
      select: [id, displayName]
      expand: owners($select=id)
      key: id
      name: displayName
    each: { field: owners, op: empty }
    evidence: "{displayName}: no owner"

  - id: ENTRA-ROLEGROUP-HAS-OWNERS
    title: Role-assignable group has owners
    kind: misconfigured
    category: IAM
    severity: high
    entity: group
    why: "An owner of a role-assignable group can add members, and every member gets the roles assigned to the group."
    fix: "Remove the owners; manage the group's membership through PIM for Groups or Privileged Role Administrators only."
    refs: ["NIST-800-53:AC-6(5)", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /groups
      filter: "isAssignableToRole eq true"
      select: [id, displayName]
      expand: owners($select=id)
      key: id
      name: displayName
    each: { field: owners, op: notempty }
    evidence: "{displayName}: owners {owners[].id}"

  - id: ENTRA-ROLEGROUP-LARGE
    title: Role-assignable group has many members
    kind: misconfigured
    category: IAM
    severity: medium
    entity: group
    why: "A big group holding a directory role spreads the role to people who were added for another reason; role groups should be small and reviewed."
    fix: "Shrink the group to the people who need the role, or split the role across smaller groups. (The expanded member list is capped at 20 by Graph, so keep the threshold below 20.)"
    refs: ["NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /groups
      filter: "isAssignableToRole eq true"
      select: [id, displayName]
      expand: members($select=id)
      key: id
      name: displayName
    each: { field: members, op: size-gt, value: 10, threshold: entra.rolegroup-max-members }
    evidence: "{displayName}: more members than allowed ({members[].id})"

  - id: ENTRA-GROUP-LIFECYCLE-NONE
    title: No Microsoft 365 group expiration policy
    kind: missing
    category: HYG
    severity: low
    entity: tenant
    lens: maintenance
    why: "Without an expiration policy unused Microsoft 365 groups and Teams live forever with their data and members."
    fix: "Create a group lifecycle policy (for example 365 days) so owners must renew active groups."
    refs: ["NIST-800-53:AC-2(3)"]
    query:
      protocol: graph
      path: /groupLifecyclePolicies
      key: id
    count: none
    evidence: "no group lifecycle policy"

  - id: ENTRA-GROUP-DYNAMIC-GUEST-CONTROLLED-ATTRIBUTE
    title: Dynamic group rule keys on attributes a guest's home tenant controls
    kind: misconfigured
    category: IAM
    severity: low
    entity: group
    why: "Mail, other mails, proxy addresses, display name, given name, surname and company name of a guest come from the guest's own organisation. A dynamic rule on them that does not exclude guests lets a partner place their account in the group, and in whatever the group grants."
    fix: "Add (user.userType -eq \"Member\") to the rule, or key it on an attribute only your admins or HR set (employeeId, extension attributes, department from the HR feed). Tune both patterns with the thresholds."
    refs: ["NIST-800-53:AC-2(9)", "NIST-800-53:AC-3", "MITRE-ATTACK:T1199"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, groupTypes, membershipRule, membershipRuleProcessingState, visibility, securityEnabled, mailEnabled, isAssignableToRole, onPremisesSyncEnabled]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: groupTypes, op: contains, value: DynamicMembership }
        - { field: membershipRule, op: match, value: 'user\.(mail|otherMails|proxyAddresses|displayName|givenName|surname|companyName)\b', threshold: entra.dynamic-rule-external-attribute-pattern }
        - { field: membershipRule, op: notmatch, value: 'user\.userType\s+-eq\s+"?Member"?', threshold: entra.dynamic-rule-member-guard-pattern }
    evidence: "{displayName}: rule {membershipRule}"

  - id: ENTRA-GROUP-ONBOARDING-NOT-ASSIGNED
    title: Group that onboarding fills is assigned to no application
    kind: broken
    category: IAM
    severity: high
    entity: group
    lens: both
    why: "When the group that the joiner process fills is no longer assigned to the application it was meant to grant, every new hire lands in it and silently never reaches the app (or its provisioning). The groups are tenant-specific: list their object ids in the threshold; with the list empty the rule checks nothing."
    fix: "Assign the group to the application again, or point the onboarding step at the group that is assigned and retire this one."
    refs: ["NIST-800-53:AC-2(1)", "CIS-Controls-v8:6.1"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName]
      expand: appRoleAssignments($select=id,resourceDisplayName)
      key: id
      name: displayName
    each:
      all:
        - field: id
          op: in
          threshold: entra.onboarding-group-ids
          value: []
        - { field: appRoleAssignments, op: empty }
    evidence: "{displayName}: onboarding group with no application assignment"

  # ------------------------------------------------------------ group inventory with owners ---
  # One fetch of every group with its owners (the expand returns at most 20 owners per group).
  # "Cloud group" = onPremisesSyncEnabled absent or false; synchronised groups are judged in AD.
  - id: ENTRA-GROUP-NO-OWNER
    title: Cloud group has no owner
    kind: missing
    category: HYG
    severity: low
    entity: group
    lens: both
    why: "A group with no owner cannot be reviewed by anyone who knows why it exists, and its members drift. Microsoft 365 groups have their own rule (ENTRA-GROUP-M365-NO-OWNER); role-assignable groups are meant to have no owner and are left out."
    fix: "Assign two owners who answer for the group's purpose and members, or delete the group if nobody claims it."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:CM-8(4)", "CIS-Controls-v8:5.1"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, description, groupTypes, securityEnabled, mailEnabled, mail, onPremisesSyncEnabled, isAssignableToRole, createdDateTime, expirationDateTime, renewedDateTime, assignedLabels, serviceProvisioningErrors]
      expand: owners($select=id,userPrincipalName,accountEnabled)
      key: id
      name: displayName
    each:
      all:
        - any:
            - { field: onPremisesSyncEnabled, op: absent }
            - { field: onPremisesSyncEnabled, op: eq, value: false }
        - { field: groupTypes, op: notcontains, value: Unified }
        - any:
            - { field: isAssignableToRole, op: absent }
            - { field: isAssignableToRole, op: eq, value: false }
        - { field: owners, op: size-eq, value: 0 }
    evidence: "{displayName} (security {securityEnabled}, mail {mailEnabled}, created {createdDateTime}): no owner"

  - id: ENTRA-GROUP-OWNER-DISABLED
    title: Cloud group is owned by a disabled account
    kind: misconfigured
    category: HYG
    severity: low
    entity: group
    lens: both
    why: "Ownership looks healthy while nobody can act on it, and a re-enabled leaver regains control of the group and of whatever it grants. Fires on any disabled owner; groups whose only owners are disabled are effectively ownerless."
    fix: "Remove the disabled owner and add a current one; make owner hand-over part of the leaver process."
    refs: ["NIST-800-53:AC-2(3)", "NIST-800-53:PS-4"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, description, groupTypes, securityEnabled, mailEnabled, mail, onPremisesSyncEnabled, isAssignableToRole, createdDateTime, expirationDateTime, renewedDateTime, assignedLabels, serviceProvisioningErrors]
      expand: owners($select=id,userPrincipalName,accountEnabled)
      key: id
      name: displayName
    each:
      all:
        - any:
            - { field: onPremisesSyncEnabled, op: absent }
            - { field: onPremisesSyncEnabled, op: eq, value: false }
        - { field: 'owners[].accountEnabled', op: eq, value: false }
    evidence: "{displayName}: owners {owners[].userPrincipalName}, enabled {owners[].accountEnabled}"

  - id: ENTRA-GROUP-NO-DESCRIPTION
    title: Cloud groups without a description
    kind: missing
    category: HYG
    severity: low
    entity: tenant
    lens: maintenance
    why: "A group without a description leaves every reviewer, approver and new owner guessing what it grants. Counted once for the tenant (most tenants have many) with a sample; the per-group detail is in the scan rows."
    fix: "Make a description part of group creation; describe the groups that grant access to applications, sites or roles first."
    refs: ["NIST-800-53:CM-8", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, description, groupTypes, securityEnabled, mailEnabled, mail, onPremisesSyncEnabled, isAssignableToRole, createdDateTime, expirationDateTime, renewedDateTime, assignedLabels, serviceProvisioningErrors]
      expand: owners($select=id,userPrincipalName,accountEnabled)
      key: id
      name: displayName
    count:
      op: gt
      value: 0
      threshold: entra.groups-without-description-max
      where:
        all:
          - any:
              - { field: onPremisesSyncEnabled, op: absent }
              - { field: onPremisesSyncEnabled, op: eq, value: false }
          - { field: description, op: empty }
    evidence: "{count} of {rows} groups are cloud groups without a description (ids {sample})"

  - id: ENTRA-GROUP-MAIL-ENABLED-SECURITY
    title: Mail-enabled security group
    kind: misconfigured
    category: IAM
    severity: info
    entity: group
    why: "A mail-enabled security group serves two purposes at once: whoever manages the distribution list (often in Exchange, outside the access process) changes who has the access it grants. A review list."
    fix: "Split the group into a distribution list and a security group, or record why one object serves both."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:CM-8"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, description, groupTypes, securityEnabled, mailEnabled, mail, onPremisesSyncEnabled, isAssignableToRole, createdDateTime, expirationDateTime, renewedDateTime, assignedLabels, serviceProvisioningErrors]
      expand: owners($select=id,userPrincipalName,accountEnabled)
      key: id
      name: displayName
    each:
      all:
        - { field: securityEnabled, op: eq, value: true }
        - { field: mailEnabled, op: eq, value: true }
        - { field: groupTypes, op: notcontains, value: Unified }
    evidence: "{displayName} ({mail}): mail-enabled security group, synchronised {onPremisesSyncEnabled}"

  - id: M365-GROUP-NAME-OR-DESCRIPTION-POOR
    title: Cloud group has a throwaway name
    kind: misconfigured
    category: HYG
    severity: low
    entity: group
    lens: maintenance
    why: "Groups called test, tmp, temp, new team or demo were made for a moment and kept; nobody can tell what they grant or whether they are still needed. Missing descriptions are counted by ENTRA-GROUP-NO-DESCRIPTION. Tune the name pattern with the threshold."
    fix: "Rename and describe the group with its owner, or delete it; adopt a naming policy for new groups."
    refs: ["NIST-800-53:CM-8"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, description, groupTypes, securityEnabled, mailEnabled, mail, onPremisesSyncEnabled, isAssignableToRole, createdDateTime, expirationDateTime, renewedDateTime, assignedLabels, serviceProvisioningErrors]
      expand: owners($select=id,userPrincipalName,accountEnabled)
      key: id
      name: displayName
    each:
      all:
        - any:
            - { field: onPremisesSyncEnabled, op: absent }
            - { field: onPremisesSyncEnabled, op: eq, value: false }
        - { field: displayName, op: match, value: '^(test|tmp|temp|new team|new group|demo|copy of)\b', threshold: m365.group-name-junk-pattern }
    evidence: "{displayName}: created {createdDateTime}, owners {owners[].userPrincipalName}"

  - id: M365-GROUP-EXPIRING-SOON
    title: Microsoft 365 group will be deleted by the expiration policy soon
    kind: broken
    category: AVL
    severity:
      field: owners
      map: { '[]': high }
      default: medium
    deadline: expirationDateTime
    entity: group
    lens: both
    why: "On its expiration date the group is deleted with its mailbox, team and site unless an owner renews it; a group with no owner (high) never gets the renewal mail. It can be restored for 30 days, but the team is disrupted on the day."
    fix: "Renew the group or give it an owner before the date; set the expiration policy's alternate notification address to a monitored mailbox."
    refs: ["NIST-800-53:CP-2", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, description, groupTypes, securityEnabled, mailEnabled, mail, onPremisesSyncEnabled, isAssignableToRole, createdDateTime, expirationDateTime, renewedDateTime, assignedLabels, serviceProvisioningErrors]
      expand: owners($select=id,userPrincipalName,accountEnabled)
      key: id
      name: displayName
    each:
      all:
        - { field: groupTypes, op: contains, value: Unified }
        - { field: expirationDateTime, op: until-lt, value: 30, threshold: m365.group-expiry-notice-days }
    evidence: "{displayName}: expires {expirationDateTime} (renewed {renewedDateTime}), owners {owners[].userPrincipalName}"

  - id: M365-GROUP-SINGLE-OWNER
    title: Microsoft 365 group or team has a single owner
    kind: misconfigured
    category: HYG
    severity: low
    entity: group
    lens: maintenance
    why: "One owner is one leaver away from an ownerless group: nobody approves members, renews it or answers for its content."
    fix: "Ask the owner to add a co-owner; enable the ownerless-group policy so members are asked to take over."
    refs: ["NIST-800-53:AC-2", "CIS-Controls-v8:5.1"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, description, groupTypes, securityEnabled, mailEnabled, mail, onPremisesSyncEnabled, isAssignableToRole, createdDateTime, expirationDateTime, renewedDateTime, assignedLabels, serviceProvisioningErrors]
      expand: owners($select=id,userPrincipalName,accountEnabled)
      key: id
      name: displayName
    each:
      all:
        - { field: groupTypes, op: contains, value: Unified }
        - { field: owners, op: size-eq, value: 1 }
    evidence: "{displayName}: single owner {owners[].userPrincipalName}"

  - id: M365-GROUP-NO-SENSITIVITY-LABEL
    title: Microsoft 365 groups without a sensitivity label
    kind: missing
    category: IAM
    severity: low
    entity: tenant
    why: "Without a container label no classification governs a group's privacy, guest access and the sharing of its site and team. Counted once for the tenant with a sample; a tenant that has not enabled labels for groups (AIP-CONTAINER-LABELS-OFF) sees every group here and accepts the finding until it does."
    fix: "Publish a default container label and label the existing groups with their owners, most sensitive first."
    refs: ["NIST-800-53:AC-16", "CIS-Controls-v8:3.7"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, description, groupTypes, securityEnabled, mailEnabled, mail, onPremisesSyncEnabled, isAssignableToRole, createdDateTime, expirationDateTime, renewedDateTime, assignedLabels, serviceProvisioningErrors]
      expand: owners($select=id,userPrincipalName,accountEnabled)
      key: id
      name: displayName
    count:
      op: gt
      value: 0
      where:
        all:
          - { field: groupTypes, op: contains, value: Unified }
          - { field: assignedLabels, op: empty }
    evidence: "{count} Microsoft 365 groups carry no sensitivity label (ids {sample})"

  - id: M365-GROUP-SERVICE-PROVISIONING-ERROR
    title: Group has an unresolved service provisioning error
    kind: broken
    category: HLT
    severity: medium
    entity: group
    lens: maintenance
    why: "A workload such as Exchange Online could not provision the group (a duplicate proxy address, an invalid alias); its mailbox or address does not work as configured until the attribute is fixed."
    fix: "Correct the attribute named in the error at its source (AD for synchronised groups) and wait one sync cycle."
    refs: ["NIST-800-53:CM-8", "NIST-800-53:SI-10"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, description, groupTypes, securityEnabled, mailEnabled, mail, onPremisesSyncEnabled, isAssignableToRole, createdDateTime, expirationDateTime, renewedDateTime, assignedLabels, serviceProvisioningErrors]
      expand: owners($select=id,userPrincipalName,accountEnabled)
      key: id
      name: displayName
    each: { field: 'serviceProvisioningErrors[].isResolved', op: eq, value: false }
    evidence: "{displayName} ({mail}): {serviceProvisioningErrors[].serviceInstance} error since {serviceProvisioningErrors[].createdDateTime}"

  # ----------------------------------------------------------- group inventory with members ---
  # Members are expanded (at most 20 per group, which is enough for empty, single and mixed checks).
  # The member objects carry their type only as @odata.type, so the type tests match the JSON text of
  # each member element. Graph v1.0 does not return service principals among group members.
  - id: ENTRA-GROUP-EMPTY
    title: Cloud group has no members
    kind: misconfigured
    category: HYG
    severity: low
    entity: group
    lens: maintenance
    why: "An empty group is dead configuration: assignments, policies and exclusions that point at it do nothing, and someone may fill it later without knowing what it grants. Groups younger than a week and dynamic groups (their own rule) are left out."
    fix: "Delete the group, or fill it if it is meant to grant something; first check what is assigned to it."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:CM-6"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, groupTypes, securityEnabled, mailEnabled, onPremisesSyncEnabled, membershipRule, membershipRuleProcessingState, createdDateTime]
      expand: members($select=id)
      key: id
      name: displayName
    each:
      all:
        - any:
            - { field: onPremisesSyncEnabled, op: absent }
            - { field: onPremisesSyncEnabled, op: eq, value: false }
        - { field: groupTypes, op: notcontains, value: DynamicMembership }
        - any:
            - { field: createdDateTime, op: absent }
            - { field: createdDateTime, op: age-gt, value: 7 }
        - { field: members, op: size-eq, value: 0 }
    evidence: "{displayName} (created {createdDateTime}): no members"

  - id: ENTRA-GROUP-DYNAMIC-EMPTY
    title: Dynamic group matches nobody
    kind: broken
    category: IAM
    severity: medium
    entity: group
    lens: both
    why: "A dynamic group with no members usually tests an attribute value that no longer exists (a renamed department, a changed company name); joiners are then silently never added to whatever the group grants."
    fix: "Check the membership rule against the current attribute values and correct it; delete the group if it is no longer needed."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:CM-6"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, groupTypes, securityEnabled, mailEnabled, onPremisesSyncEnabled, membershipRule, membershipRuleProcessingState, createdDateTime]
      expand: members($select=id)
      key: id
      name: displayName
    each:
      all:
        - { field: groupTypes, op: contains, value: DynamicMembership }
        - any:
            - { field: createdDateTime, op: absent }
            - { field: createdDateTime, op: age-gt, value: 1 }
        - { field: members, op: size-eq, value: 0 }
    evidence: "{displayName}: no members for rule {membershipRule} (processing {membershipRuleProcessingState})"

  - id: ENTRA-GROUP-SINGLE-MEMBER
    title: Cloud group has exactly one member
    kind: misconfigured
    category: HYG
    severity: info
    entity: group
    lens: maintenance
    why: "A group with one member is often a permission given to one person in disguise, outside the review that would see a direct assignment. A review hint, not a verdict."
    fix: "Assign the access directly if it really is for one person, or fill the group as intended; delete it if it is a leftover."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, groupTypes, securityEnabled, mailEnabled, onPremisesSyncEnabled, membershipRule, membershipRuleProcessingState, createdDateTime]
      expand: members($select=id)
      key: id
      name: displayName
    each:
      all:
        - any:
            - { field: onPremisesSyncEnabled, op: absent }
            - { field: onPremisesSyncEnabled, op: eq, value: false }
        - { field: groupTypes, op: notcontains, value: DynamicMembership }
        - { field: members, op: size-eq, value: 1 }
    evidence: "{displayName}: one member {members[].id}"

  - id: ENTRA-GROUP-NONUSER-MEMBER
    title: Group mixes user accounts with devices or contacts
    kind: misconfigured
    category: IAM
    severity: low
    entity: group
    why: "A group meant for people that also holds devices or mail contacts (or the reverse) is usually a mistake: policies and app assignments meant for one kind land on the other, and exclusions miss. Pure device groups are normal and not flagged; only groups holding both kinds are."
    fix: "Split the group into a user group and a device group, or remove the members of the wrong kind."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:CM-6"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, groupTypes, securityEnabled, mailEnabled, onPremisesSyncEnabled, membershipRule, membershipRuleProcessingState, createdDateTime]
      expand: members($select=id)
      key: id
      name: displayName
    each:
      all:
        - { field: members, op: match, value: '"@odata\.type":"#microsoft\.graph\.user"' }
        - { field: members, op: match, value: '"@odata\.type":"#microsoft\.graph\.(device|orgContact)"' }
    evidence: "{displayName}: holds users and devices or contacts"

  # --------------------------------------------- directory settings (Group.Unified template) ---
  # /groupSettings returns the tenant-level settings objects (no $filter); each carries its template
  # id and its settings as a values[] array of name/value pairs. A pair is tested by matching the JSON
  # text of one element: (?=.*"name":"X")(?=.*"value":"Y"). Without a Group.Unified object the
  # Microsoft defaults apply (group creation open, no naming policy, labels for groups off).
  - id: ENTRA-GROUP-NAMING-POLICY-NONE
    title: No naming policy applies to Microsoft 365 groups
    kind: missing
    category: CFG
    severity: low
    entity: tenant
    lens: maintenance
    why: "Without a prefix or suffix requirement and a blocked-words list, user-created groups (and their teams, sites and mail addresses) look exactly like official ones and can take names such as 'HR' or 'Payroll'."
    fix: "Set a prefix or suffix naming requirement and a blocked-words list in the Group.Unified directory settings."
    refs: ["NIST-800-53:CM-6"]
    query:
      protocol: graph
      path: /groupSettings
      select: [id, displayName, templateId, values]
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: templateId, op: eq, value: 62375ab9-6b52-47ed-826b-58e47e0e304b }
          - any:
              - { field: values, op: match, value: '(?=.*"name":"PrefixSuffixNamingRequirement")(?=.*"value":"[^"])' }
              - { field: values, op: match, value: '(?=.*"name":"CustomBlockedWordsList")(?=.*"value":"[^"])' }
    evidence: "{count} Group.Unified settings objects carry a naming policy, among {rows} settings objects"

  - id: M365-GROUP-CREATION-UNRESTRICTED
    title: Any user can create Microsoft 365 groups
    kind: misconfigured
    category: IAM
    severity: low
    entity: tenant
    lens: both
    why: "When group creation is open (Microsoft's default, or EnableGroupCreation left true) every user can create groups, and with them teams, SharePoint sites and mailboxes, each with its own sharing and guest settings. Companion of M365-SPO-USER-SITE-CREATION."
    fix: "Instantiate the Group.Unified settings, set EnableGroupCreation to false and name the group allowed to create groups (GroupCreationAllowedGroupId); publish a request path."
    refs: ["NIST-800-53:AC-6", "NIST-800-53:CM-11", "CIS-Controls-v8:6.8"]
    query:
      protocol: graph
      path: /groupSettings
      select: [id, displayName, templateId, values]
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: templateId, op: eq, value: 62375ab9-6b52-47ed-826b-58e47e0e304b }
          - { field: values, op: match, value: '(?=.*"name":"EnableGroupCreation")(?=.*"value":"false")' }
    evidence: "{count} Group.Unified settings objects restrict group creation, among {rows} settings objects"

  # ------------------------------------------------------------------ deleted groups, guests ---
  - id: M365-GROUP-DELETED-RECENT
    title: Group deleted in the last week
    kind: misconfigured
    category: BCK
    severity: info
    entity: group
    lens: maintenance
    why: "A deleted Microsoft 365 group takes its team, site and mailbox with it, and the mistake is often noticed weeks later; for 30 days it can be restored whole."
    fix: "Confirm each deletion with the admin or owner who made it; restore the group if it was a mistake."
    refs: ["NIST-800-53:CP-9", "NIST-800-53:AU-6"]
    query:
      protocol: graph
      path: /directory/deletedItems/microsoft.graph.group
      select: [id, displayName, mail, groupTypes, deletedDateTime]
      key: id
      name: displayName
    each: { field: deletedDateTime, op: age-lt, value: 7, threshold: m365.deleted-group-review-days }
    evidence: "{displayName} ({mail}, {groupTypes}) deleted {deletedDateTime}; restorable for 30 days"

  - id: M365-GROUP-HAS-GUESTS
    title: Microsoft 365 group or team contains a guest
    kind: misconfigured
    category: IAM
    severity: low
    entity: group-member
    why: "A guest in a team sees every standard channel and file; project guests are rarely removed when the project ends. One finding per guest membership, as a review list for the group owners. One request per Microsoft 365 group (at most 2000)."
    fix: "Owners confirm or remove each guest; put groups with guests under a recurring access review."
    refs: ["NIST-800-53:AC-2(13)", "NIST-800-53:AC-21", "CIS-Controls-v8:6.2"]
    refresh: 7d
    query:
      protocol: graph
      path: /groups/{id}/members/microsoft.graph.user
      filter: "userType eq 'Guest'"
      consistency: eventual
      select: [id, userPrincipalName, userType, accountEnabled]
      for_each:
        path: /groups
        filter: "groupTypes/any(c:c eq 'Unified')"
        select: [id, displayName]
        field: id
        max: 2000
      key: "{parent.id}|{id}"
      name: parent.displayName
    each: { field: userType, op: eq, value: Guest }
    evidence: "{parent.displayName}: guest {userPrincipalName} (enabled {accountEnabled})"

  # ======================================================================= devices ===
  - id: ENTRA-DEVICE-STALE
    title: Enabled device object with no sign-in for a long time
    kind: misconfigured
    category: HYG
    severity: low
    entity: device
    lens: both
    why: "Stale device objects keep their compliance state, certificates and BitLocker keys and make device-based Conditional Access and inventories unreliable."
    fix: "Disable devices with no sign-in in the window, delete them after a further grace period (hybrid-joined: clean up in AD and let sync remove them)."
    refs: ["NIST-800-53:CM-8(3)"]
    query:
      protocol: graph
      path: /devices
      select: [id, displayName, accountEnabled, operatingSystem, operatingSystemVersion, trustType, isManaged, isCompliant, approximateLastSignInDateTime, registrationDateTime]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - any:
            - { field: approximateLastSignInDateTime, op: age-gt, value: 90, threshold: entra.device-stale-days }
            - all:
                - { field: approximateLastSignInDateTime, op: absent }
                - { field: registrationDateTime, op: age-gt, value: 90, threshold: entra.device-stale-days }
    evidence: "{displayName} ({trustType}, {operatingSystem}): last sign-in {approximateLastSignInDateTime}"

  - id: ENTRA-DEVICE-JOINED-UNMANAGED
    title: Active Entra-joined or hybrid-joined Windows device is not managed
    kind: missing
    category: CFG
    severity: medium
    entity: device
    why: "A joined Windows device outside MDM gets no compliance evaluation, so device-based Conditional Access cannot tell it apart from a healthy one."
    fix: "Enrol the device in Intune (or co-management) and investigate why automatic enrolment did not happen."
    refs: ["NIST-800-53:CM-2", "NIST-800-53:CM-8"]
    query:
      protocol: graph
      path: /devices
      select: [id, displayName, accountEnabled, operatingSystem, operatingSystemVersion, trustType, isManaged, isCompliant, approximateLastSignInDateTime, registrationDateTime]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: operatingSystem, op: match, value: '^Windows' }
        - { field: trustType, op: in, value: [AzureAd, ServerAd] }
        - { field: approximateLastSignInDateTime, op: age-lt, value: 30, threshold: entra.device-active-days }
        - any:
            - { field: isManaged, op: absent }
            - { field: isManaged, op: eq, value: false }
    evidence: "{displayName} ({trustType}): last sign-in {approximateLastSignInDateTime}, isManaged {isManaged}"

  - id: ENTRA-DEVICE-WINDOWS-UNSUPPORTED
    title: Active Windows device runs a release past end of servicing
    kind: misconfigured
    category: LCM
    severity: medium
    entity: device
    lens: both
    why: "A Windows build out of servicing gets no security updates. The default pattern marks builds below Windows 11 23H2 (22631) as unsupported, which includes all Windows 10 builds unless they are on Extended Security Updates; tune it with the threshold."
    fix: "Upgrade the device to a serviced Windows 11 release, or record it as covered by Extended Security Updates."
    refs: ["NIST-800-53:SI-2", "NIST-800-53:SA-22"]
    query:
      protocol: graph
      path: /devices
      select: [id, displayName, accountEnabled, operatingSystem, operatingSystemVersion, trustType, isManaged, isCompliant, approximateLastSignInDateTime, registrationDateTime]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: operatingSystem, op: match, value: '^Windows' }
        - { field: approximateLastSignInDateTime, op: age-lt, value: 30, threshold: entra.device-active-days }
        - { field: operatingSystemVersion, op: match, value: '^10\.0\.(\d{1,4}|1\d{4}|2[01]\d{3}|22[0-5]\d{2}|226[0-2]\d|22630)(\.|$)', threshold: entra.windows-unsupported-build-pattern }
    evidence: "{displayName}: Windows {operatingSystemVersion}, last sign-in {approximateLastSignInDateTime}"

  - id: ENTRA-DEVICE-DISABLED-STALE
    title: Disabled device object kept long after its last sign-in
    kind: misconfigured
    category: HYG
    severity: low
    entity: device
    lens: maintenance
    why: "Disabling is the first half of device clean-up; a disabled object that is never deleted keeps its BitLocker keys, certificates and group memberships and clutters every device report."
    fix: "Delete disabled device objects after the grace period (hybrid-joined ones in AD, so sync removes them); keep the BitLocker keys you still need first."
    refs: ["NIST-800-53:CM-8(3)"]
    query:
      protocol: graph
      path: /devices
      select: [id, displayName, accountEnabled, operatingSystem, operatingSystemVersion, trustType, isManaged, isCompliant, approximateLastSignInDateTime, registrationDateTime]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: accountEnabled, op: eq, value: false }
        - any:
            - { field: approximateLastSignInDateTime, op: age-gt, value: 30, threshold: entra.disabled-device-keep-days }
            - all:
                - { field: approximateLastSignInDateTime, op: absent }
                - { field: registrationDateTime, op: age-gt, value: 30, threshold: entra.disabled-device-keep-days }
    evidence: "{displayName} ({trustType}, {operatingSystem}): disabled, last sign-in {approximateLastSignInDateTime}"

  - id: ENTRA-DEVICE-REGISTERED-PERSONAL
    title: Personally registered device gets tokens without management
    kind: misconfigured
    category: IAM
    severity: info
    entity: device
    why: "A registered (workplace-joined) device is a personal device that holds the user's tokens for corporate apps; unless app protection or a compliance requirement covers it, nothing controls what it keeps. A review list of what is registered."
    fix: "Require app protection or a compliant device for access from registered devices; remove registrations of devices the user no longer has."
    refs: ["NIST-800-53:AC-19", "NIST-800-53:CM-8"]
    query:
      protocol: graph
      path: /devices
      select: [id, displayName, accountEnabled, operatingSystem, operatingSystemVersion, trustType, isManaged, isCompliant, approximateLastSignInDateTime, registrationDateTime]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: trustType, op: eq, value: Workplace }
    evidence: "{displayName} ({operatingSystem} {operatingSystemVersion}): registered {registrationDateTime}, managed {isManaged}, compliant {isCompliant}, last sign-in {approximateLastSignInDateTime}"

  # BitLocker recovery keys: the list returns key metadata only (the key itself needs a separate read
  # with another permission, which no rule makes).
  - id: ENTRA-BITLOCKER-KEY-OLD
    title: BitLocker recovery key in Entra is years old
    kind: misconfigured
    category: PKI
    severity: low
    entity: bitlocker-key
    lens: both
    why: "A recovery key that was never rotated in years has typically been shown to someone (help desk, user) at least once and is still valid; the key inventory is also what a missing-escrow join needs. Tune the age with the threshold."
    fix: "Rotate the recovery password on the device (manage-bde or the Intune rotate action) and require rotation after each use in the disk-encryption policy."
    refs: ["NIST-800-53:SC-28", "NIST-800-53:CP-9", "CIS-Controls-v8:3.6"]
    query:
      protocol: graph
      path: /informationProtection/bitlocker/recoveryKeys
      key: id
      name: deviceId
    each: { field: createdDateTime, op: age-gt, value: 1095, threshold: entra.bitlocker-key-max-age-days }
    evidence: "recovery key {id} for device {deviceId} (volume type {volumeType}) created {createdDateTime}"

  # ========================================================== tenant, sync and contacts ===
  - id: ENTRA-SYNC-STALE
    title: Directory synchronisation has not run recently
    kind: broken
    category: HLT
    severity: high
    entity: organization
    lens: both
    why: "Entra Connect syncs every 30 minutes; a sync older than a few hours means it is stopped or failing, and leavers disabled in AD stay active in the cloud until it is fixed."
    fix: "Check the Entra Connect (or Cloud Sync) server, its service and its connector accounts; read Connect Health alerts."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:SI-4"]
    refresh: 1h
    query:
      protocol: graph
      path: /organization
      select: [id, displayName, onPremisesSyncEnabled, onPremisesLastSyncDateTime, technicalNotificationMails, securityComplianceNotificationMails, privacyProfile]
      key: id
      name: displayName
    each:
      all:
        - { field: onPremisesSyncEnabled, op: eq, value: true }
        - { field: onPremisesLastSyncDateTime, op: age-gt, value: 0.125, threshold: entra.sync-max-age-days }
    evidence: "last directory sync {onPremisesLastSyncDateTime}"

  - id: ENTRA-SYNC-PASSWORD-HASH-STALE
    title: Password hash synchronisation heartbeat is old
    kind: broken
    category: HLT
    severity: medium
    entity: organization
    lens: both
    why: "When password hash sync stops, password changes stop reaching the cloud and leaked-credential detection works on old hashes. The heartbeat is only exposed in the beta API."
    fix: "Check the password hash sync agent on the Entra Connect server and its AD connector account permissions."
    refs: [CIS-M365-5.1.8.1, "NIST-800-53:IA-5"]
    refresh: 1h
    query:
      protocol: graph
      version: beta
      path: /organization
      select: [id, displayName, onPremisesSyncEnabled, onPremisesLastSyncDateTime, onPremisesLastPasswordSyncDateTime]
      key: id
      name: displayName
    each:
      all:
        - { field: onPremisesSyncEnabled, op: eq, value: true }
        - any:
            - { field: onPremisesLastPasswordSyncDateTime, op: absent }
            - { field: onPremisesLastPasswordSyncDateTime, op: age-gt, value: 0.125, threshold: entra.password-sync-max-age-days }
    evidence: "last password hash sync {onPremisesLastPasswordSyncDateTime} (last directory sync {onPremisesLastSyncDateTime})"

  - id: ENTRA-SYNC-PASSWORD-HASH-OFF
    title: Password hash synchronisation is disabled
    kind: missing
    category: AUT
    severity: medium
    entity: sync-configuration
    why: "Without password hash sync Entra cannot detect leaked credentials and there is no cloud fallback when federation or pass-through agents fail. Not applicable to cloud-only tenants."
    fix: "Enable password hash synchronisation in Entra Connect (it can run alongside federation or pass-through authentication)."
    refs: [CIS-M365-5.1.8.1, "NIST-800-53:SI-4"]
    query:
      protocol: graph
      path: /directory/onPremisesSynchronization
      key: id
    each: { field: features.passwordSyncEnabled, op: eq, value: false }
    evidence: "features.passwordSyncEnabled = {features.passwordSyncEnabled}"

  - id: ENTRA-SYNC-HARD-MATCH-TAKEOVER-OPEN
    title: Cloud accounts can be taken over by hard-matching from AD
    kind: misconfigured
    category: IAM
    severity: medium
    entity: sync-configuration
    why: "If hard-match takeover is not blocked, an on-premises object with a crafted source anchor can take over an existing cloud-only account, including an administrator."
    fix: "Block cloud object takeover through hard match (and soft match) in the directory synchronisation features."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:IA-4"]
    query:
      protocol: graph
      path: /directory/onPremisesSynchronization
      key: id
    each: { field: features.blockCloudObjectTakeoverThroughHardMatchEnabled, op: eq, value: false }
    evidence: "blockCloudObjectTakeoverThroughHardMatchEnabled = {features.blockCloudObjectTakeoverThroughHardMatchEnabled}, blockSoftMatchEnabled = {features.blockSoftMatchEnabled}"

  - id: ENTRA-SYNC-SOFT-MATCH-OPEN
    title: Soft matching from AD is still allowed
    kind: misconfigured
    category: IAM
    severity: medium
    entity: sync-configuration
    why: "With soft match open, an on-premises object whose UPN or primary SMTP address matches an existing cloud-only account takes that account over at the next sync, administrators included. Soft match is needed only during a planned migration of cloud accounts to synchronised ones. Not applicable to cloud-only tenants."
    fix: "Enable blockSoftMatch once the last planned match is done; open it only for a dated migration window."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:IA-4", "MITRE-ATTACK:T1098"]
    query:
      protocol: graph
      path: /directory/onPremisesSynchronization
      key: id
    each: { field: features.blockSoftMatchEnabled, op: eq, value: false }
    evidence: "blockSoftMatchEnabled = {features.blockSoftMatchEnabled}"

  - id: ENTRA-SYNC-ACCIDENTAL-DELETE-PREVENTION-WEAK
    title: Accidental-deletion prevention for directory sync is off or too loose
    kind: misconfigured
    category: BCK
    severity:
      field: configuration.accidentalDeletionPrevention.synchronizationPreventionType
      map: { disabled: high }
      default: medium
    entity: sync-configuration
    lens: both
    why: "One filtering mistake or a moved OU deletes every out-of-scope user in the cloud in a single cycle, with their mailboxes, files and licences. Prevention stops the export above a threshold; disabled (high) nothing stops it, and a threshold above 500 objects or 5 percent lets a large share through first."
    fix: "Enable prevention for a count of 500 or less (or 5 percent); lift it only for one reviewed export."
    refs: ["NIST-800-53:CM-3", "NIST-800-53:CP-9"]
    query:
      protocol: graph
      path: /directory/onPremisesSynchronization
      key: id
    each:
      any:
        - { field: configuration.accidentalDeletionPrevention.synchronizationPreventionType, op: eq, value: disabled }
        - all:
            - { field: configuration.accidentalDeletionPrevention.synchronizationPreventionType, op: eq, value: enabledForCount }
            - { field: configuration.accidentalDeletionPrevention.alertThreshold, op: gt, value: 500, threshold: entra.sync-delete-threshold-max }
        - all:
            - { field: configuration.accidentalDeletionPrevention.synchronizationPreventionType, op: eq, value: enabledForPercentage }
            - { field: configuration.accidentalDeletionPrevention.alertThreshold, op: gt, value: 5, threshold: entra.sync-delete-percent-max }
    evidence: "accidental deletion prevention {configuration.accidentalDeletionPrevention.synchronizationPreventionType}, threshold {configuration.accidentalDeletionPrevention.alertThreshold}"

  - id: ENTRA-SYNC-RETIRED-FEATURE-ON
    title: Retired group writeback (v2) is still switched on
    kind: misconfigured
    category: LCM
    severity: medium
    entity: sync-configuration
    why: "Object-level group writeback for additional group types (group writeback v2) is decommissioned in Entra Connect Sync; a tenant that still has it on depends on a feature that stops working without a visible error and complicates the next engine upgrade. Microsoft 365 group writeback (v1) still works and is not flagged here."
    fix: "Move the group types that need writeback to Cloud Sync group provisioning to AD, then disable writeback v2 (irreversible: afterwards all Microsoft 365 groups are written back, so plan it)."
    refs: ["NIST-800-53:SA-22", "NIST-800-53:CM-2"]
    query:
      protocol: graph
      path: /directory/onPremisesSynchronization
      key: id
    each: { field: features.groupWriteBackEnabled, op: eq, value: true }
    evidence: "groupWriteBackEnabled = {features.groupWriteBackEnabled}, unifiedGroupWritebackEnabled = {features.unifiedGroupWritebackEnabled}"

  - id: ENTRA-SYNC-WRITEBACK-ENABLED
    title: Cloud-to-AD writeback is switched on
    kind: misconfigured
    category: IAM
    severity: low
    entity: sync-configuration
    why: "Each writeback (devices, users, Microsoft 365 groups) lets the cloud change on-premises AD - a path from the tenant into tier 0. A writeback nobody uses is that path with no benefit. A review list: accept each with the feature it serves. (Password writeback is not visible through this resource.)"
    fix: "Disable the writebacks that serve nothing in the Entra Connect wizard; accept the rest with their purpose recorded."
    refs: ["NIST-800-53:AC-6", "NIST-800-53:CM-7"]
    query:
      protocol: graph
      path: /directory/onPremisesSynchronization
      key: id
    each:
      any:
        - { field: features.deviceWritebackEnabled, op: eq, value: true }
        - { field: features.userWritebackEnabled, op: eq, value: true }
        - { field: features.unifiedGroupWritebackEnabled, op: eq, value: true }
    evidence: "writeback: devices {features.deviceWritebackEnabled}, users {features.userWritebackEnabled}, Microsoft 365 groups {features.unifiedGroupWritebackEnabled}"

  - id: ENTRA-SYNC-CLOUD-PASSWORD-POLICY-OFF
    title: Expired and must-change AD passwords keep working in the cloud
    kind: misconfigured
    category: AUT
    severity: low
    entity: sync-configuration
    why: "With password hash sync, a synchronised user's cloud password never expires and 'must change password at next logon' is ignored unless two features are on: an expired or reset-flagged AD account keeps signing in to cloud services with the old password. The behaviour may be wanted; review it."
    fix: "Enable cloudPasswordPolicyForPasswordSyncedUsersEnabled and userForcePasswordChangeOnLogonEnabled after reading the caveats on temporary passwords and service accounts."
    refs: ["NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /directory/onPremisesSynchronization
      key: id
    each:
      all:
        - { field: features.passwordSyncEnabled, op: eq, value: true }
        - any:
            - { field: features.cloudPasswordPolicyForPasswordSyncedUsersEnabled, op: eq, value: false }
            - { field: features.userForcePasswordChangeOnLogonEnabled, op: eq, value: false }
    evidence: "cloud password policy {features.cloudPasswordPolicyForPasswordSyncedUsersEnabled}, force change on logon {features.userForcePasswordChangeOnLogonEnabled}"

  - id: ENTRA-SYNC-INTERVAL-LONG
    title: Directory sync runs less often than every 30 minutes
    kind: misconfigured
    category: CFG
    severity: low
    entity: sync-configuration
    lens: both
    why: "Leaver disablements and licence changes arrive one cycle late; a customised interval is usually a troubleshooting step nobody undid. The intervals are ISO 8601 durations, accepted by pattern (30 minutes or less; tune it with the threshold). Only exposed in the beta API."
    fix: "Clear the customised interval on the sync server (Set-ADSyncScheduler -CustomizedSyncCycleInterval) back to the default."
    refs: ["NIST-800-53:AC-2"]
    query:
      protocol: graph
      version: beta
      path: /directory/onPremisesSynchronization
      key: id
    each:
      any:
        - { field: configuration.synchronizationInterval, op: notmatch, value: '^(PT0S|PT([1-9]|[12][0-9]|30)M)$', threshold: entra.sync-interval-ok-pattern }
        - { field: configuration.customerRequestedSynchronizationInterval, op: notmatch, value: '^(PT0S|PT([1-9]|[12][0-9]|30)M)$', threshold: entra.sync-interval-ok-pattern }
    evidence: "sync interval {configuration.synchronizationInterval}, customer-requested {configuration.customerRequestedSynchronizationInterval}"

  - id: ENTRA-SYNC-DIRECTORY-EXTENSION-SENSITIVE
    title: Synchronised directory extension looks like personal data
    kind: misconfigured
    category: IAM
    severity: medium
    entity: extension-property
    why: "Directory extensions that Entra Connect syncs are stored on the 'Tenant Schema Extension App' and readable by every application with directory read access. An extension named like a national identifier, salary, health or birth data puts that data in front of all of them. Tune the name pattern with the threshold."
    fix: "Remove the attribute from the directory extension list in the Entra Connect wizard and clear it in the cloud; involve the data-protection owner."
    refs: ["NIST-800-53:PT-2", "NIST-800-53:SC-28", "NIST-800-53:AC-3"]
    query:
      protocol: graph
      path: /applications/{id}/extensionProperties
      for_each:
        path: /applications
        filter: "startswith(displayName,'Tenant Schema Extension')"
        select: [id, appId, displayName]
        field: id
        max: 20
      key: "{parent.id}|{name}"
      name: name
    each: { field: name, op: match, value: '(ssn|social.?security|national.?id|passport|salary|wage|health|medical|birth|religio|ethnic)', threshold: entra-connect.sensitive-extension-pattern }
    evidence: "{name} ({dataType}) on {targetObjects}, defined on {parent.displayName}"

  - id: ENTRA-SYNC-NO-PREMIUM-ENTITLEMENT
    title: No enabled subscription carries Entra ID P1
    kind: missing
    category: LCM
    severity: low
    entity: tenant
    lens: both
    why: "Conditional Access, sign-in activity, Connect Health for sync and several hybrid features need an Entra ID P1 service plan; a licence clean-up that removes the last SKU carrying it switches them off quietly (and many rules in this pack then report unknown). A plan counts if its SKU is enabled and the plan name starts with AAD_PREMIUM."
    fix: "Keep at least one enabled SKU with the Entra ID P1 (or P2) plan in the licence plan before removing overlapping suites."
    refs: ["NIST-800-53:SA-4", "NIST-800-53:PM-3"]
    query:
      protocol: graph
      path: /subscribedSkus
      select: [id, skuId, skuPartNumber, capabilityStatus, servicePlans]
      key: skuId
      name: skuPartNumber
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: capabilityStatus, op: eq, value: Enabled }
          - { field: 'servicePlans[].servicePlanName', op: match, value: '^AAD_PREMIUM' }
    evidence: "{count} enabled SKUs carry an Entra ID P1 or P2 plan, among {rows} SKUs"

  - id: ENTRA-TENANT-NO-TECH-CONTACT
    title: No technical notification contact is set
    kind: missing
    category: MON
    severity: low
    entity: organization
    lens: maintenance
    why: "Microsoft sends service, security and expiry notices to the technical contact; with none set (or a person who left), those notices go nowhere."
    fix: "Set a monitored team mailbox as the technical notification contact."
    refs: ["NIST-800-53:IR-6", "NIST-800-53:SI-5"]
    query:
      protocol: graph
      path: /organization
      select: [id, displayName, onPremisesSyncEnabled, onPremisesLastSyncDateTime, technicalNotificationMails, securityComplianceNotificationMails, privacyProfile]
      key: id
      name: displayName
    each: { field: technicalNotificationMails, op: empty }
    evidence: "technicalNotificationMails is empty"

  - id: ENTRA-TENANT-NO-SECURITY-CONTACT
    title: No security and compliance notification contact is set
    kind: missing
    category: MON
    severity: low
    entity: organization
    why: "Security and compliance notices from Microsoft have nowhere to go."
    fix: "Set a monitored security team mailbox as the security and compliance notification contact."
    refs: ["NIST-800-53:IR-6"]
    query:
      protocol: graph
      path: /organization
      select: [id, displayName, onPremisesSyncEnabled, onPremisesLastSyncDateTime, technicalNotificationMails, securityComplianceNotificationMails, privacyProfile]
      key: id
      name: displayName
    each: { field: securityComplianceNotificationMails, op: empty }
    evidence: "securityComplianceNotificationMails is empty"

  - id: ENTRA-TENANT-PRIVACY-PROFILE-UNSET
    title: Tenant has no privacy statement or privacy contact
    kind: missing
    category: CFG
    severity: low
    entity: organization
    lens: maintenance
    why: "Guests and users who consent to apps are shown the organisation's privacy statement and contact; with neither set they see nothing, and the data-protection paperwork has a gap."
    fix: "Set the privacy statement URL and a monitored privacy contact address in the tenant properties."
    refs: ["NIST-800-53:PT-5"]
    query:
      protocol: graph
      path: /organization
      select: [id, displayName, onPremisesSyncEnabled, onPremisesLastSyncDateTime, technicalNotificationMails, securityComplianceNotificationMails, privacyProfile]
      key: id
      name: displayName
    each:
      any:
        - { field: privacyProfile.statementUrl, op: empty }
        - { field: privacyProfile.contactEmail, op: empty }
    evidence: "privacy statement '{privacyProfile.statementUrl}', privacy contact '{privacyProfile.contactEmail}'"

  # Activity-based timeout policies sign idle browser sessions out of the applications they name
  # (definition: {"ActivityBasedTimeoutPolicy":{...,"ApplicationPolicies":[{"ApplicationId":"default",
  # "WebSessionIdleTimeout":"01:00:00"}]}}, format [d.]hh:mm:ss).
  - id: ENTRA-IDLE-SESSION-TIMEOUT-NONE
    title: No organisation-wide idle session timeout policy
    kind: missing
    category: AUT
    severity: low
    entity: tenant
    why: "Without an activity-based timeout policy an unattended browser session in a supported Microsoft portal stays signed in, including on a shared or home computer. A policy counts if it is the organisation default and sets a web session idle timeout."
    fix: "Create an organisation-default activity-based timeout policy (for example one to three hours); turn on the Microsoft 365 idle session timeout for the web apps as well."
    refs: [CIS-M365:1.3.2, "NIST-800-53:AC-11", "NIST-800-53:AC-12"]
    query:
      protocol: graph
      path: /policies/activityBasedTimeoutPolicies
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: isOrganizationDefault, op: eq, value: true }
          - { field: definition, op: match, value: 'WebSessionIdleTimeout' }
    evidence: "{count} organisation-default idle timeout policies among {rows} activity-based timeout policies"

  - id: ENTRA-IDLE-SESSION-TIMEOUT-LONG
    title: Idle session timeout lets sessions sit idle for more than three hours
    kind: misconfigured
    category: AUT
    severity: low
    entity: policy
    why: "A timeout of half a day or a day still leaves a session open long after its user walked away. The default pattern flags anything of four hours or more (or with a day part); tune it with the threshold."
    fix: "Set WebSessionIdleTimeout to three hours or less in the organisation-default policy."
    refs: [CIS-M365:1.3.2, "NIST-800-53:AC-11"]
    query:
      protocol: graph
      path: /policies/activityBasedTimeoutPolicies
      key: id
      name: displayName
    each:
      all:
        - { field: isOrganizationDefault, op: eq, value: true }
        - { field: definition, op: match, value: '"WebSessionIdleTimeout"\s*:\s*"(\d+\.|0?[4-9]:|1\d:|2[0-3]:)', threshold: entra.idle-timeout-long-pattern }
    evidence: "{displayName}: {definition}"

  - id: ENTRA-ACCESS-REVIEWS-NONE
    title: No access reviews are defined
    kind: missing
    category: IAM
    severity: medium
    entity: tenant
    why: "Without access reviews guest accounts and privileged role holders accumulate; nobody re-confirms them. Needs Entra ID P2 or Governance."
    fix: "Create recurring access reviews for guests and for privileged directory roles at least."
    refs: [CIS-M365-5.3.2, CIS-M365-5.3.3, "NIST-800-53:AC-2(3)"]
    query:
      protocol: graph
      path: /identityGovernance/accessReviews/definitions
      key: id
      name: displayName
    count: none
    evidence: "no access review definitions"

  - id: ENTRA-ACCESS-REVIEW-SETTINGS-WEAK
    title: Access review is set up so that it cannot remove access
    kind: misconfigured
    category: IAM
    severity: low
    entity: access-review
    why: "A review that does not recur, does not apply its decisions, runs for weeks, or (for guest reviews) keeps access when nobody answers, leaves everything as it was while looking like governance. ENTRA-ACCESS-REVIEWS-NONE sees that reviews exist; this sees whether they bite. Needs Entra ID P2 or Governance."
    fix: "Make the review recur, auto-apply decisions, keep each instance to two weeks or less, and for guest reviews deny access when the reviewer does not respond."
    refs: [CIS-M365:5.3.2, CIS-M365:5.3.3, "NIST-800-53:AC-2(3)", "NIST-800-53:AC-6(7)"]
    query:
      protocol: graph
      path: /identityGovernance/accessReviews/definitions
      key: id
      name: displayName
    each:
      all:
        - { field: status, op: ne, value: Completed }
        - any:
            - { field: settings.autoApplyDecisionsEnabled, op: eq, value: false }
            - { field: settings.recurrence.pattern.type, op: empty }
            - { field: settings.instanceDurationInDays, op: gt, value: 14, threshold: entra.access-review-max-days }
            - all:
                - { field: scope, op: match, value: 'userType eq .{0,6}Guest' }
                - { field: settings.defaultDecision, op: ne, value: Deny }
    evidence: "{displayName} ({status}): auto-apply {settings.autoApplyDecisionsEnabled}, recurrence {settings.recurrence.pattern.type} every {settings.recurrence.pattern.interval}, duration {settings.instanceDurationInDays} days, no-response decision {settings.defaultDecision} (enabled {settings.defaultDecisionEnabled})"

  - id: ENTRA-RECOMMENDATION-ACTIVE
    title: Open Microsoft Entra recommendation
    kind: misconfigured
    category: CFG
    severity:
      field: priority
      map: { high: high, medium: medium, low: low }
      default: low
    entity: recommendation
    why: "Entra recommendations are Microsoft's own checks of this tenant (stale apps, expiring credentials, legacy auth use, MFA gaps); an active one is a gap Microsoft already sees. Beta API only."
    fix: "Work the recommendation in the Entra admin centre; dismiss or postpone it with a reason when it is accepted risk."
    refs: ["NIST-800-53:CA-7"]
    query:
      protocol: graph
      version: beta
      path: /directory/recommendations
      key: id
      name: displayName
    each: { field: status, op: eq, value: active }
    evidence: "{displayName} ({recommendationType}, priority {priority})"

  - id: ENTRA-DOMAIN-FEDERATED
    title: Verified domain signs in through federation
    kind: misconfigured
    category: AUT
    severity: medium
    entity: domain
    why: "For a federated domain the federation server's token-signing key can mint a sign-in for any user of the domain (golden SAML), and its MFA claims decide whether Entra asks for MFA at all. Not wrong in itself, but each federated domain must be a known, reviewed fact. Uses the same domain query as m365.yaml."
    fix: "Record the federation server's owner, patch level and signing-certificate rotation date, check federatedIdpMfaBehavior (see backlog), and plan the move to password hash sync with cloud MFA."
    refs: ["MITRE-ATTACK:T1606.002", "MITRE-ATTACK:T1484.002", "NIST-800-53:IA-5(2)", "NIST-800-53:SC-12"]
    query:
      protocol: graph
      path: /domains
      select: [id, authenticationType, isVerified, isDefault, isInitial, passwordValidityPeriodInDays, supportedServices]
      key: id
    each:
      all:
        - { field: isVerified, op: eq, value: true }
        - { field: authenticationType, op: eq, value: Federated }
    evidence: "{id}: authenticationType {authenticationType}"

  - id: ENTRA-CUSTOM-AUTH-EXTENSION-PRESENT
    title: Custom authentication extension calls out to an external endpoint
    kind: misconfigured
    category: AUT
    severity: medium
    entity: auth-extension
    why: "A custom authentication extension (token issuance start, attribute collection, OTP send) makes Entra call an HTTP endpoint during sign-in and can put claims from it into every token issued to the apps that use it. Legitimate but rare; an extension nobody can explain is persistence."
    fix: "Confirm the owner, the target URL and the apps that use it; delete extensions no app uses. Accept the documented ones."
    refs: ["MITRE-ATTACK:T1556", "NIST-800-53:CM-6", "NIST-800-53:IA-5"]
    query:
      protocol: graph
      path: /identity/customAuthenticationExtensions
      key: id
      name: displayName
    each: any
    evidence: "{displayName}: calls {endpointConfiguration.targetUrl} ({description})"

  - id: ENTRA-AU-NO-RESTRICTED-MANAGEMENT
    title: No restricted-management administrative unit exists
    kind: missing
    category: IAM
    severity: low
    entity: tenant
    why: "Without a restricted-management administrative unit any User, Helpdesk or Authentication Administrator can reset the password and MFA methods of the emergency-access and other sensitive accounts. Restricted management is the Entra-native way to fence them off."
    fix: "Create a restricted-management administrative unit holding the emergency-access and tier-0 admin accounts and assign the roles that may manage them at that scope only."
    refs: ["NIST-800-53:AC-6(5)", "NIST-800-53:AC-2(7)", "MITRE-ATTACK:T1098"]
    query:
      protocol: graph
      path: /directory/administrativeUnits
      select: [id, displayName, isMemberManagementRestricted, visibility, membershipType]
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where: { field: isMemberManagementRestricted, op: eq, value: true }
    evidence: "{count} restricted-management administrative units among {rows}"

  - id: ENTRA-LIFECYCLE-NO-LEAVER-WORKFLOW
    title: No enabled Lifecycle Workflow handles leavers
    kind: missing
    category: IAM
    severity: low
    entity: tenant
    lens: both
    why: "Without a leaver workflow offboarding is a manual checklist; the 'disabled account still has ...' findings elsewhere in this pack are what a skipped checklist leaves behind. Needs Microsoft Entra ID Governance; without it the query fails and the rule reports unknown."
    fix: "Enable the leaver templates (real-time employee termination, post-offboarding) and scope them to the HR-driven employee population."
    refs: ["NIST-800-53:PS-4", "NIST-800-53:AC-2(3)", "CIS-Controls-v8:6.2"]
    query:
      protocol: graph
      path: /identityGovernance/lifecycleWorkflows/workflows
      select: [id, displayName, category, isEnabled, isSchedulingEnabled]
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: category, op: eq, value: leaver }
          - { field: isEnabled, op: eq, value: true }
    evidence: "{count} enabled leaver workflows among {rows} workflows"

  # ============================================================ sign-in and audit logs ===
  # Bounded with relative dates ({DAYS_AGO:n}). The sign-in log returns interactive sign-ins only, keeps
  # 30 days (7 without Entra ID P1) and does not support $select. Each rule keys its rows so that one
  # finding stands for one account and protocol (or one event); the row count per key is not exposed.
  - id: ENTRA-SIGNIN-LEGACY-AUTH-SUCCESS-RECENT
    title: Successful sign-in over a legacy protocol in the last week
    kind: broken
    category: AUT
    severity: high
    entity: sign-in
    why: "A successful IMAP, POP, SMTP AUTH, ActiveSync basic, EWS or other legacy sign-in is proof that the legacy-authentication block is missing, excluded or bypassed for this account - the protocol carries no MFA, so a sprayed password is enough. One finding per account and protocol."
    fix: "Find the client from the IP and app (often a printer, scanner, script or old mail app), move it to modern authentication or a scoped exception, then confirm the block policy covers the account."
    refs: [CIS-M365:5.2.2.3, "MITRE-ATTACK:T1078.004", "MITRE-ATTACK:T1110.003", "NIST-800-53:IA-2(1)"]
    query:
      protocol: graph
      path: /auditLogs/signIns
      filter: "createdDateTime ge {DAYS_AGO:7} and status/errorCode eq 0 and (clientAppUsed eq 'Exchange ActiveSync' or clientAppUsed eq 'IMAP4' or clientAppUsed eq 'POP3' or clientAppUsed eq 'Authenticated SMTP' or clientAppUsed eq 'Exchange Web Services' or clientAppUsed eq 'MAPI Over HTTP' or clientAppUsed eq 'Offline Address Book' or clientAppUsed eq 'Outlook Anywhere (RPC over HTTP)' or clientAppUsed eq 'Exchange Online PowerShell' or clientAppUsed eq 'AutoDiscover' or clientAppUsed eq 'Reporting Web Services' or clientAppUsed eq 'Other clients')"
      maxPages: 20
      key: "{userId}|{clientAppUsed}"
      name: userPrincipalName
    each: any
    evidence: "{userPrincipalName}: {clientAppUsed} sign-in to {appDisplayName} from {ipAddress} ({location.countryOrRegion}) at {createdDateTime}, Conditional Access {conditionalAccessStatus}"

  - id: ENTRA-SIGNIN-RISKY-SUCCESS-RECENT
    title: Risky sign-in succeeded and nobody remediated it
    kind: broken
    category: AUT
    severity:
      field: riskLevelDuringSignIn
      map: { high: high, medium: medium }
      default: medium
    entity: sign-in
    why: "A successful sign-in that Identity Protection scored medium or high, and that is still at risk (not remediated by MFA, dismissed or confirmed safe), means the risk-based policy did not act. Each one is an account to look at today. Real risk levels need Entra ID P2 (others see 'hidden')."
    fix: "Review the sign-in; if it was not the user, reset the password, revoke sessions and review the MFA methods; then make sure an enforced sign-in risk policy covers the account (ENTRA-CA-BASELINE-SIGNIN-RISK)."
    refs: [CIS-M365:5.2.2.7, "MITRE-ATTACK:T1078.004", "NIST-800-53:SI-4", "NIST-800-53:IR-4"]
    query:
      protocol: graph
      path: /auditLogs/signIns
      filter: "createdDateTime ge {DAYS_AGO:7} and status/errorCode eq 0 and (riskLevelDuringSignIn eq 'high' or riskLevelDuringSignIn eq 'medium')"
      maxPages: 20
      key: "{userId}|{riskLevelDuringSignIn}"
      name: userPrincipalName
    each: { field: riskState, op: in, value: [atRisk, confirmedCompromised] }
    evidence: "{userPrincipalName}: {riskLevelDuringSignIn} risk ({riskEventTypes_v2}), {riskState}, to {appDisplayName} from {ipAddress} ({location.countryOrRegion}) at {createdDateTime}"

  - id: ENTRA-RISK-DETECTION-OPEN-RECENT
    title: Identity Protection risk detection of the last week is still open
    kind: broken
    category: AUT
    severity:
      field: riskEventType
      map: { leakedCredentials: critical, passwordSpray: critical }
      default: high
    entity: risk-detection
    why: "A risk detection names the attack technique behind a risky user - leaked credentials, password spray, anonymous IP, impossible travel, token anomaly - so the response can match it. One finding per user and detection type still at risk; leaked credentials and password spray are critical because the password is known to someone else. Premium detection types need Entra ID P2 (others show as generic)."
    fix: "Leaked credential or spray: reset the password and revoke sessions. Anonymous IP or atypical travel: confirm with the user. Token anomaly: revoke refresh tokens. Then confirm compromised or dismiss the risk so the next detection stands out."
    refs: ["NIST-800-53:SI-4", "NIST-800-53:IR-4", "MITRE-ATTACK:T1110.003", "MITRE-ATTACK:T1078.004"]
    query:
      protocol: graph
      path: /identityProtection/riskDetections
      filter: "detectedDateTime ge {DAYS_AGO:7}"
      top: 500
      maxPages: 20
      key: "{userId}|{riskEventType}"
      name: userPrincipalName
    each: { field: riskState, op: eq, value: atRisk }
    evidence: "{userPrincipalName}: {riskEventType} ({riskLevel}) detected {detectedDateTime} from {ipAddress} ({location.countryOrRegion}), {riskState}"

  - id: ENTRA-SIGNIN-FOREIGN-SUCCESS-RECENT
    title: Successful sign-in from outside the organisation's home countries
    kind: broken
    category: AUT
    severity: medium
    entity: sign-in
    why: "For an organisation that works from known countries, a successful interactive sign-in from anywhere else is either travel to confirm or a stolen session. The home countries are tenant-specific: put a pattern of two-letter country codes in the threshold (for example ^(GB|IE)$); until then the rule checks nothing. One finding per user and country over the last two days; Graph does not filter on location, so the window is read in full (capped) and judged here."
    fix: "Confirm each user and country; for unexplained ones reset the password, revoke sessions and check the MFA methods; add a location-based Conditional Access policy for the countries the organisation never works from."
    refs: ["NIST-800-53:AC-2(12)", "NIST-800-53:SI-4", "MITRE-ATTACK:T1078.004"]
    query:
      protocol: graph
      path: /auditLogs/signIns
      filter: "createdDateTime ge {DAYS_AGO:2} and status/errorCode eq 0"
      maxPages: 50
      key: "{userId}|{location.countryOrRegion}"
      name: userPrincipalName
    each:
      all:
        - { field: location.countryOrRegion, op: notempty }
        - { field: location.countryOrRegion, op: notmatch, value: '.*', threshold: entra.home-country-pattern }
    evidence: "{userPrincipalName}: signed in to {appDisplayName} from {location.city}, {location.countryOrRegion} ({ipAddress}) at {createdDateTime}, Conditional Access {conditionalAccessStatus}"

  - id: ENTRA-SIGNIN-BLOCKED-DEVICE-COMPLIANCE-RECENT
    title: Sign-ins blocked because the device was not compliant or not managed
    kind: broken
    category: AUT
    severity: low
    entity: sign-in
    lens: both
    why: "After a compliance or device-based policy goes live, these are the users who are cut off and the devices whose compliance data is wrong (errors 53000 not compliant, 53001 not domain-joined, 530003 not managed). One finding per user and device over the last week."
    fix: "Fix the device's enrolment or compliance state (or the policy's scope); if a whole group is blocked, move it back a rollout ring until its devices are ready."
    refs: ["NIST-800-53:AC-19", "NIST-800-53:AU-6", CIS-M365:5.2.2.9]
    query:
      protocol: graph
      path: /auditLogs/signIns
      filter: "createdDateTime ge {DAYS_AGO:7} and conditionalAccessStatus eq 'failure'"
      maxPages: 20
      key: "{userId}|{deviceDetail.deviceId}"
      name: userPrincipalName
    each: { field: status.errorCode, op: in, value: [53000, 53001, 530003] }
    evidence: "{userPrincipalName}: error {status.errorCode} on {deviceDetail.displayName} ({deviceDetail.operatingSystem}, managed {deviceDetail.isManaged}, compliant {deviceDetail.isCompliant}) to {appDisplayName} at {createdDateTime}"

  # Role grants: activityDisplayName covers direct assignments, scoped assignments and PIM assignments
  # (eligible and active); PIM requests and routine activations are left out by the pattern. The tier-0
  # test matches the role template ids anywhere in the JSON text of targetResources (the role's id for
  # PIM events, its Role.TemplateId modified property for direct ones).
  - id: ENTRA-AUDIT-ROLE-ASSIGNMENT-RECENT
    title: Directory role granted in the last two days
    kind: misconfigured
    category: IAM
    severity: low
    entity: audit-event
    why: "Granting a role is the step every tenant takeover ends with. A daily list of new grants, checked against change records, catches the one nobody asked for while it is still fresh. Tier-0 roles have their own rule."
    fix: "Confirm each grant against a request or change record; remove the ones nobody can explain and find out who made them."
    refs: ["MITRE-ATTACK:T1098.003", "NIST-800-53:AC-2(4)", "NIST-800-53:AU-6", "CIS-Controls-v8:8.11"]
    query:
      protocol: graph
      path: /auditLogs/directoryAudits
      filter: "activityDateTime ge {DAYS_AGO:2} and category eq 'RoleManagement' and result eq 'success'"
      maxPages: 20
      key: id
      name: activityDisplayName
    each:
      all:
        - { field: activityDisplayName, op: match, value: '^Add (eligible |scoped )?member to role(?!.*(request|activat))', threshold: entra.audit-role-activity-pattern }
        - { field: targetResources, op: notmatch, value: '(62e90394-69f5-4237-9190-012177145e10|e8611ab8-c189-46e8-94e1-60213ab1f814|7be44c8a-adaf-4e2a-84d6-ab2649e08a13|194ae4cb-b126-40b2-bd5b-6091b380977d|8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2|b1be1c3e-b65d-4f19-8427-f6fa0d97feb9|9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3|158c047a-c907-4556-b7ef-446551a6b5f7|be2f45a1-457d-42af-a067-6ec1fa63bc45|8329153b-31d0-4727-b945-745eb3bc5f31|3a2c62db-5318-420d-8d74-23affee5d9d5)', threshold: entra.tier0-role-id-pattern }
    evidence: "{activityDateTime}: {activityDisplayName} by {initiatedBy.user.userPrincipalName}{initiatedBy.app.displayName} - {targetResources[].displayName} {targetResources[].userPrincipalName}"

  - id: ENTRA-AUDIT-TIER0-ROLE-ASSIGNMENT-RECENT
    title: Tier-0 directory role granted in the last two days
    kind: misconfigured
    category: IAM
    severity: high
    entity: audit-event
    why: "A new holder of Global, Privileged Role, Privileged Authentication, Security, Hybrid Identity, Conditional Access, Application, Cloud Application, External Identity Provider, Domain Name or Intune Administrator can take over the tenant. Every such grant needs a named request behind it, checked the next morning."
    fix: "Confirm the grant against a change record today; if nobody asked for it, remove it, revoke the account's sessions and investigate who granted it."
    refs: ["MITRE-ATTACK:T1098.003", "NIST-800-53:AC-2(4)", "NIST-800-53:AC-6(5)", "CIS-Controls-v8:8.11"]
    query:
      protocol: graph
      path: /auditLogs/directoryAudits
      filter: "activityDateTime ge {DAYS_AGO:2} and category eq 'RoleManagement' and result eq 'success'"
      maxPages: 20
      key: id
      name: activityDisplayName
    each:
      all:
        - { field: activityDisplayName, op: match, value: '^Add (eligible |scoped )?member to role(?!.*(request|activat))', threshold: entra.audit-role-activity-pattern }
        - { field: targetResources, op: match, value: '(62e90394-69f5-4237-9190-012177145e10|e8611ab8-c189-46e8-94e1-60213ab1f814|7be44c8a-adaf-4e2a-84d6-ab2649e08a13|194ae4cb-b126-40b2-bd5b-6091b380977d|8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2|b1be1c3e-b65d-4f19-8427-f6fa0d97feb9|9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3|158c047a-c907-4556-b7ef-446551a6b5f7|be2f45a1-457d-42af-a067-6ec1fa63bc45|8329153b-31d0-4727-b945-745eb3bc5f31|3a2c62db-5318-420d-8d74-23affee5d9d5)', threshold: entra.tier0-role-id-pattern }
    evidence: "{activityDateTime}: {activityDisplayName} by {initiatedBy.user.userPrincipalName}{initiatedBy.app.displayName} - {targetResources[].displayName} {targetResources[].userPrincipalName}"

  # Tenant-level directory changes of the last week (category DirectoryManagement). The two rules share
  # one query; activity names are the ones of the Entra audit activity reference.
  - id: M365-AUDIT-TENANT-CHANGE-RECENT
    title: Tenant-level domain, federation, partner or company setting changed this week
    kind: misconfigured
    category: IAM
    severity:
      field: activityDisplayName
      map: { 'Set domain authentication': high, 'Set federation settings on domain': high }
      default: medium
    entity: audit-event
    why: "Adding or verifying a domain, switching a domain to federation, changing federation settings, adding or removing a partner, or changing the company information and password policy are rare, tenant-wide changes - and the first steps of several tenant takeover techniques (a rogue federated domain mints sign-ins for any user). Federation and domain-authentication changes are high. The audit log keeps 30 days."
    fix: "Match each event to a change record; revert the ones nobody asked for, and treat a federation or domain-authentication change without a ticket as an incident."
    refs: ["MITRE-ATTACK:T1484.002", "NIST-800-53:AU-6", "NIST-800-53:CM-3", "CIS-Controls-v8:8.11"]
    query:
      protocol: graph
      path: /auditLogs/directoryAudits
      filter: "activityDateTime ge {DAYS_AGO:7} and category eq 'DirectoryManagement' and result eq 'success'"
      maxPages: 20
      key: id
      name: activityDisplayName
    each: { field: activityDisplayName, op: match, value: '^(Set domain authentication|Set federation settings on domain|Verify (email verified )?domain|Add (un)?verified domain|Update domain|Add partner to company|Remove partner from company|Set Company Information|Set password policy)$', threshold: entra.audit-tenant-activity-pattern }
    evidence: "{activityDateTime}: {activityDisplayName} by {initiatedBy.user.userPrincipalName}{initiatedBy.app.displayName} - {targetResources[].displayName}"

  - id: ENTRA-SYNC-AUDIT-SETTINGS-CHANGED-RECENT
    title: Directory synchronisation settings changed this week
    kind: misconfigured
    category: CFG
    severity: medium
    entity: audit-event
    lens: both
    why: "Turning directory synchronisation on or off, changing its features (soft and hard match, writeback, password policies) or the accidental-deletion threshold changes how on-premises AD can rewrite the cloud directory; the audit log is the only place these land, and it keeps 30 days."
    fix: "Match each event to a change record; revert unexplained changes and review the actor's other activity."
    refs: ["NIST-800-53:AU-6", "NIST-800-53:CM-3", "MITRE-ATTACK:T1484"]
    query:
      protocol: graph
      path: /auditLogs/directoryAudits
      filter: "activityDateTime ge {DAYS_AGO:7} and category eq 'DirectoryManagement' and result eq 'success'"
      maxPages: 20
      key: id
      name: activityDisplayName
    each: { field: activityDisplayName, op: match, value: '^(Set DirSync feature|Set DirSyncEnabled flag|Set directory feature on tenant|Set accidental deletion threshold)$', threshold: entra.audit-sync-activity-pattern }
    evidence: "{activityDateTime}: {activityDisplayName} by {initiatedBy.user.userPrincipalName}{initiatedBy.app.displayName} - {targetResources[].modifiedProperties[].displayName}"

  - id: M365-GROUP-GUEST-ADDED-RECENT
    title: External account added to a group this week
    kind: misconfigured
    category: IAM
    severity: low
    entity: audit-event
    why: "A guest added to a group gets whatever the group grants - for a team, every standard channel and file. The weekly list is what group owners should confirm while the reason is still remembered."
    fix: "The group owner confirms or removes the guest; put groups that take guests under a recurring access review."
    refs: ["NIST-800-53:AC-2(13)", "NIST-800-53:AU-6", "CIS-Controls-v8:6.2"]
    query:
      protocol: graph
      path: /auditLogs/directoryAudits
      filter: "activityDateTime ge {DAYS_AGO:7} and activityDisplayName eq 'Add member to group' and result eq 'success'"
      maxPages: 20
      key: id
      name: activityDisplayName
    each: { field: 'targetResources[].userPrincipalName', op: contains, value: '#EXT#' }
    evidence: "{activityDateTime}: {initiatedBy.user.userPrincipalName}{initiatedBy.app.displayName} added {targetResources[].userPrincipalName} to {targetResources[].displayName}"

  # ================================================= SaaS provisioning (SCIM) jobs and logs ===
  # The job rules share one per-object query: every enterprise app (service principals tagged
  # WindowsAzureActiveDirectoryIntegratedApp, gallery and non-gallery, at most 1000) is asked for its
  # provisioning jobs; apps without provisioning return an empty list. Row shape (entity
  # provisioning-job): the synchronizationJob (id, templateId, schedule.{interval,state,expiration},
  # status.{code, countSuccessiveCompleteFailures, quarantine.*, lastExecution.*,
  # lastSuccessfulExecution.*, lastSuccessfulExecutionWithExports.*, steadyStateLastAchievedTime,
  # troubleshootingUrl}, synchronizationJobSettings) plus parent.{id, appId, displayName,
  # accountEnabled} = the service principal; key "{parent.id}|{id}". The job id is the jobId that the
  # provisioning log rows below carry, so the two can be joined in the store.
  - id: ENTRA-PROVISIONING-JOB-QUARANTINE
    title: Provisioning job to a SaaS app is in quarantine
    kind: broken
    category: HLT
    severity: high
    entity: provisioning-job
    lens: both
    why: "In quarantine Entra retries at most once a day and stops creating, updating and disabling users in the app: joiners never arrive and leavers keep their access there. The warning mail goes to the job's notification address, often a person who has left."
    fix: "Open the job's provisioning logs, fix the cause (expired or revoked credential, a mapping the target rejects, a burst of target errors), then restart the job to clear the quarantine; set a monitored mailbox as the notification address."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:SI-4", "CIS-Controls-v8:6.1", "CIS-Controls-v8:6.2"]
    query:
      protocol: graph
      path: /servicePrincipals/{id}/synchronization/jobs
      for_each:
        path: /servicePrincipals
        filter: "tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
        select: [id, appId, displayName, accountEnabled]
        field: id
        max: 1000
      key: "{parent.id}|{id}"
      name: parent.displayName
    each: { field: status.code, op: eq, value: Quarantine }
    evidence: "{parent.displayName}: job {id} ({templateId}) in quarantine since {status.quarantine.seriesBegan}, reason {status.quarantine.reason}, re-evaluated {status.quarantine.seriesCount} times, next attempt {status.quarantine.nextAttempt}; error {status.quarantine.error.code} {status.quarantine.error.message}; {status.troubleshootingUrl}"

  - id: ENTRA-PROVISIONING-JOB-FAILING
    title: Provisioning job keeps failing (the step before quarantine)
    kind: broken
    category: HLT
    severity:
      field: status.countSuccessiveCompleteFailures
      ranges: [ { min: 3, value: high } ]
      default: medium
    entity: provisioning-job
    lens: both
    why: "A job whose last run failed, or that failed several runs in a row, is about to be quarantined; fixing it now keeps joiners and leavers flowing to the app."
    fix: "Read status.lastExecution.error and the provisioning log of the last cycle; fix the credential, the mapping or the target before the quarantine threshold is reached."
    refs: ["NIST-800-53:SI-4", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /servicePrincipals/{id}/synchronization/jobs
      for_each:
        path: /servicePrincipals
        filter: "tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
        select: [id, appId, displayName, accountEnabled]
        field: id
        max: 1000
      key: "{parent.id}|{id}"
      name: parent.displayName
    each:
      all:
        - { field: status.code, op: eq, value: Active }
        - any:
            - { field: status.countSuccessiveCompleteFailures, op: gt, value: 0, threshold: entra.provisioning-max-successive-failures }
            - { field: status.lastExecution.state, op: eq, value: Failed }
            - { field: status.lastExecution.error.code, op: notempty }
    evidence: "{parent.displayName}: job {id} last run {status.lastExecution.state} at {status.lastExecution.timeEnded}, {status.countSuccessiveCompleteFailures} successive failures; error {status.lastExecution.error.code} {status.lastExecution.error.message}"

  - id: ENTRA-PROVISIONING-JOB-STALE-EXPORT
    title: Active provisioning job has exported nothing for weeks
    kind: broken
    category: HLT
    severity: medium
    entity: provisioning-job
    lens: both
    why: "A job can look healthy while it skips every object: nobody new is in scope, or onboarding fills a group that is not the one assigned to the app. No export for weeks in an organisation that hires people is that symptom seen from the job. Tenants with no joiners for long periods raise the threshold."
    fix: "Compare the app's assigned groups with the group onboarding fills; provision one recent hire on demand to prove the path; check the scoping filters."
    refs: ["NIST-800-53:AC-2", "CIS-Controls-v8:6.1"]
    query:
      protocol: graph
      path: /servicePrincipals/{id}/synchronization/jobs
      for_each:
        path: /servicePrincipals
        filter: "tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
        select: [id, appId, displayName, accountEnabled]
        field: id
        max: 1000
      key: "{parent.id}|{id}"
      name: parent.displayName
    each:
      all:
        - { field: status.code, op: eq, value: Active }
        - any:
            - { field: status.lastSuccessfulExecutionWithExports.timeEnded, op: absent }
            - { field: status.lastSuccessfulExecutionWithExports.timeEnded, op: age-gt, value: 14, threshold: entra.provisioning-export-max-age-days }
    evidence: "{parent.displayName}: job {id} last exported {status.lastSuccessfulExecutionWithExports.timeEnded} ({status.lastSuccessfulExecutionWithExports.countExported} objects); last run {status.lastExecution.timeEnded}"

  - id: ENTRA-PROVISIONING-JOB-PAUSED
    title: Provisioning job to an enabled app is paused, never run or not configured
    kind: misconfigured
    category: CFG
    severity:
      field: status.code
      map: { NotConfigured: low }
      default: medium
    entity: provisioning-job
    lens: both
    why: "Provisioning was set up and then stopped, or never started, while the app is still in use: its users are being created and removed by hand, or not at all, without anyone deciding that."
    fix: "Start the job (and fix whatever made someone pause it), or delete it and record that the app is provisioned manually with an owner for joiners and leavers."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:CM-3"]
    query:
      protocol: graph
      path: /servicePrincipals/{id}/synchronization/jobs
      for_each:
        path: /servicePrincipals
        filter: "tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
        select: [id, appId, displayName, accountEnabled]
        field: id
        max: 1000
      key: "{parent.id}|{id}"
      name: parent.displayName
    each:
      all:
        - { field: parent.accountEnabled, op: eq, value: true }
        - { field: status.code, op: ne, value: Quarantine }
        - any:
            - { field: status.code, op: in, value: [Paused, NotRun, NotConfigured] }
            - { field: schedule.state, op: in, value: [Paused, Disabled] }
    evidence: "{parent.displayName}: job {id} ({templateId}) status {status.code}, schedule {schedule.state}"

  - id: ENTRA-PROVISIONING-JOB-REDUCED-SCHEDULE
    title: Provisioning job runs less often than the normal cycle
    kind: misconfigured
    category: CFG
    severity: low
    entity: provisioning-job
    lens: maintenance
    why: "The normal cycle is about every 40 minutes; a job on a schedule of hours or days delivers joiners, changes and leavers to the app late. The rule accepts any interval of 40 minutes or less (tune the pattern with the threshold); quarantined jobs are left to their own rule."
    fix: "Reset the job's schedule to the default interval, or record why the app needs a slower one."
    refs: ["NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /servicePrincipals/{id}/synchronization/jobs
      for_each:
        path: /servicePrincipals
        filter: "tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
        select: [id, appId, displayName, accountEnabled]
        field: id
        max: 1000
      key: "{parent.id}|{id}"
      name: parent.displayName
    each:
      all:
        - { field: status.code, op: eq, value: Active }
        - { field: schedule.state, op: eq, value: Active }
        - { field: schedule.interval, op: notmatch, value: '^PT([1-9]|[1-3][0-9]|40)M$', threshold: entra.provisioning-interval-ok-pattern }
    evidence: "{parent.displayName}: job {id} runs every {schedule.interval}"

  # Provisioning log (last 7 days). Filters support eq, contains, gt and lt only, are case-sensitive and
  # $select is not supported. Failures are keyed per job and error code, skips per job and source object.
  # The failure patterns match the JSON text of errorInformation (errorCode and reason together).
  - id: ENTRA-PROVISIONING-PAYLOAD-REJECTED-RECENT
    title: SaaS app rejects what provisioning sends (attribute mapping)
    kind: broken
    category: HLT
    severity: high
    entity: provisioning-event
    lens: both
    why: "The target answered with a bad-request or invalid-payload error: one attribute mapping sends a value or an operation the app does not accept, and every object that carries it fails - often thousands at once, until the job is quarantined."
    fix: "Open a failed event's steps to find the attribute; remove or correct that mapping (or its expression), test with provision on demand on one user, then restart the job."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:SI-4", "CIS-Controls-v8:6.1"]
    query:
      protocol: graph
      path: /auditLogs/provisioning
      filter: "activityDateTime gt {DAYS_AGO:7} and provisioningStatusInfo/status eq 'failure'"
      maxPages: 100
      key: "{jobId}|{provisioningStatusInfo.errorInformation.errorCode}"
      name: servicePrincipal.displayName
    each: { field: provisioningStatusInfo.errorInformation, op: match, value: '(BadRequest|InvalidPayload|InvalidPatch|invalid.{0,30}(patch|payload|request|value)|status code 400\b)', threshold: entra.provisioning-payload-error-pattern }
    evidence: "{servicePrincipal.displayName}{servicePrincipal[].displayName} (job {jobId}): {provisioningStatusInfo.errorInformation.errorCode} on {provisioningAction} of {sourceIdentity.identityType} {sourceIdentity.displayName} at {activityDateTime}: {provisioningStatusInfo.errorInformation.reason}"

  - id: ENTRA-PROVISIONING-MATCH-CONFLICT-RECENT
    title: SaaS app already holds the object under another identity (matching conflict)
    kind: broken
    category: HLT
    severity: medium
    entity: provisioning-event
    lens: both
    why: "The target reports that a user or group with the same email or name already exists: the app holds the person under another username, and the job matches on an attribute that differs (UPN against email, for example), so it tries to create a duplicate and fails."
    fix: "Add the target's key attribute (often email) as a matching attribute with the right precedence, or clean the duplicate in the app; then restart the job."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:IA-4", "CIS-Controls-v8:6.1"]
    query:
      protocol: graph
      path: /auditLogs/provisioning
      filter: "activityDateTime gt {DAYS_AGO:7} and provisioningStatusInfo/status eq 'failure'"
      maxPages: 100
      key: "{jobId}|{provisioningStatusInfo.errorInformation.errorCode}"
      name: servicePrincipal.displayName
    each: { field: provisioningStatusInfo.errorInformation, op: match, value: '(EntryConflict|Duplicate|AlreadyExists|already exists|status code 409\b)', threshold: entra.provisioning-conflict-error-pattern }
    evidence: "{servicePrincipal.displayName}{servicePrincipal[].displayName} (job {jobId}): {provisioningStatusInfo.errorInformation.errorCode} on {provisioningAction} of {sourceIdentity.identityType} {sourceIdentity.displayName} at {activityDateTime}: {provisioningStatusInfo.errorInformation.reason}"

  - id: ENTRA-PROVISIONING-FAILURES-RECENT
    title: Provisioning to a SaaS app failed in the last week
    kind: broken
    category: HLT
    severity: medium
    entity: provisioning-event
    lens: both
    why: "Any other failure of the provisioning service to create, update or disable an object in the app (rejected mappings and matching conflicts have their own rules). One finding per app and error code; the latest event is the sample."
    fix: "Read the reason and the event's steps, fix the cause in the app, the mapping or the source object, then retry with provision on demand."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:SI-4", "CIS-Controls-v8:6.1"]
    query:
      protocol: graph
      path: /auditLogs/provisioning
      filter: "activityDateTime gt {DAYS_AGO:7} and provisioningStatusInfo/status eq 'failure'"
      maxPages: 100
      key: "{jobId}|{provisioningStatusInfo.errorInformation.errorCode}"
      name: servicePrincipal.displayName
    each:
      any:
        - { field: provisioningStatusInfo.errorInformation, op: absent }
        - all:
            - { field: provisioningStatusInfo.errorInformation, op: notmatch, value: '(BadRequest|InvalidPayload|InvalidPatch|invalid.{0,30}(patch|payload|request|value)|status code 400\b)', threshold: entra.provisioning-payload-error-pattern }
            - { field: provisioningStatusInfo.errorInformation, op: notmatch, value: '(EntryConflict|Duplicate|AlreadyExists|already exists|status code 409\b)', threshold: entra.provisioning-conflict-error-pattern }
    evidence: "{servicePrincipal.displayName}{servicePrincipal[].displayName} (job {jobId}): {provisioningStatusInfo.errorInformation.errorCode} on {provisioningAction} of {sourceIdentity.identityType} {sourceIdentity.displayName} at {activityDateTime}: {provisioningStatusInfo.errorInformation.reason}"

  - id: ENTRA-PROVISIONING-SKIPPED-NOT-ENTITLED-RECENT
    title: Assigned user skipped by provisioning as "not effectively entitled"
    kind: broken
    category: IAM
    severity: medium
    entity: provisioning-event
    lens: both
    why: "Entra skips an object as not effectively entitled when its assignment to the app is broken or only carries the default-access role: the person was given the app, the job runs, and they still never arrive in it. Unassigned users are skipped for other reasons and are not matched by the default pattern."
    fix: "Remove and re-add the user's (or group's) assignment with a real app role; if the app has only the default-access role, assign the role the provisioning mapping expects."
    refs: ["NIST-800-53:AC-2", "CIS-Controls-v8:6.1"]
    query:
      protocol: graph
      path: /auditLogs/provisioning
      filter: "activityDateTime gt {DAYS_AGO:7} and provisioningStatusInfo/status eq 'skipped'"
      maxPages: 100
      key: "{jobId}|{sourceIdentity.id}"
      name: sourceIdentity.displayName
    each:
      any:
        - { field: 'provisioningSteps[].description', op: match, value: '(NotEffectivelyEntitled|not effectively entitled)', threshold: entra.provisioning-skip-not-entitled-pattern }
        - { field: 'provisioningSteps[].details', op: match, value: '(NotEffectivelyEntitled|not effectively entitled)', threshold: entra.provisioning-skip-not-entitled-pattern }
    evidence: "{servicePrincipal.displayName}{servicePrincipal[].displayName} (job {jobId}): {sourceIdentity.identityType} {sourceIdentity.displayName} skipped at {activityDateTime}: {provisioningSteps[].description}"
