      name: displayName
    each:
      all:
        - { field: state, op: eq, value: enabled }
        - { field: conditions.users.includeUsers, op: contains, value: All }
        - any:
            - { field: grantControls.builtInControls, op: contains, value: mfa }
            - { field: grantControls.authenticationStrength.id, op: exists }
        - { field: conditions.applications.excludeApplications, op: notempty }
    evidence: "{displayName}: MFA not required for applications {conditions.applications.excludeApplications}"

  - id: ENTRA-CA-BASELINE-MFA-AZURE-MANAGEMENT
    title: No enforced policy requires MFA for Azure management
    kind: missing
    category: AUT
    severity: medium
    entity: tenant
    why: "The Azure portal, Azure CLI, PowerShell and ARM templates all sign in through the Windows Azure Service Management API (797f4846-ba00-4fd7-ba43-dac1f8f63013); whoever reaches it with a password alone can change subscriptions. A policy counts if it targets all users, includes that application or all resources without excluding it, grants MFA or an authentication strength, and is not limited to risky sign-ins."
    fix: "Create a policy: users All (exclude emergency access), target resource Windows Azure Service Management API, grant Require MFA; require the phishing-resistant strength for subscription owners."
    refs: ["NIST-800-53:IA-2(1)", "NIST-800-53:AC-17", "MITRE-ATTACK:T1078.004"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: state, op: eq, value: enabled }
          - { field: conditions.users.includeUsers, op: contains, value: All }
          - any:
              - { field: conditions.applications.includeApplications, op: contains, value: 797f4846-ba00-4fd7-ba43-dac1f8f63013 }
              - { field: conditions.applications.includeApplications, op: contains, value: All }
          - { field: conditions.applications.excludeApplications, op: notcontains, value: 797f4846-ba00-4fd7-ba43-dac1f8f63013 }
          - { field: conditions.signInRiskLevels, op: empty }
          - { field: conditions.userRiskLevels, op: empty }
          - any:
              - { field: grantControls.builtInControls, op: contains, value: mfa }
              - { field: grantControls.authenticationStrength.id, op: exists }
    evidence: "{count} enforced MFA policies cover Azure management, among {rows} policies"

  - id: ENTRA-CA-BASELINE-WORKLOAD-IDENTITY-BLOCK
    title: No enforced policy limits where service principals may sign in from
    kind: missing
    category: AUT
    severity: low
    entity: tenant
    why: "A leaked client secret works from anywhere unless a workload-identity policy limits the tenant's own service principals to known networks. A policy counts if it targets the service principals of this tenant, grants Block and excludes at least one named location. Needs Workload Identities Premium."
    fix: "Create a workload-identity policy: include all service principals of the tenant, block access from all locations except the trusted egress named locations; exclude only the identities that must roam."
    refs: ["NIST-800-53:AC-17", "NIST-800-53:SC-7", "MITRE-ATTACK:T1078.004"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: state, op: eq, value: enabled }
          - { field: conditions.clientApplications, op: exists }
          - { field: conditions.clientApplications.includeServicePrincipals, op: contains, value: ServicePrincipalsInMyTenant }
          - { field: grantControls.builtInControls, op: contains, value: block }
          - { field: conditions.locations.excludeLocations, op: notempty }
    evidence: "{count} enforced workload-identity location policies among {rows} policies"

  - id: ENTRA-CA-BASELINE-UNKNOWN-PLATFORMS-BLOCKED
    title: No enforced policy blocks device platforms the organisation does not support
    kind: missing
    category: AUT
    severity: low
    entity: tenant
    why: "Sign-ins from platforms nobody manages (Linux, unrecognised user agents) otherwise get the weakest treatment of all. A policy counts if it targets all users and all resources, includes all platforms, excludes the supported ones and grants Block."
    fix: "Create the policy in report-only mode first (users All, resources All, platforms All except the supported ones, grant Block), read its impact, then enforce it."
    refs: ["NIST-800-53:AC-19", "NIST-800-53:CM-7"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: state, op: eq, value: enabled }
          - { field: conditions.platforms, op: exists }
          - { field: conditions.users.includeUsers, op: contains, value: All }
          - { field: conditions.applications.includeApplications, op: contains, value: All }
          - { field: conditions.platforms.includePlatforms, op: contains, value: all }
          - { field: conditions.platforms.excludePlatforms, op: notempty }
          - { field: grantControls.builtInControls, op: contains, value: block }
    evidence: "{count} enforced unknown-platform block policies among {rows} policies"

  - id: ENTRA-CA-TARGETS-NOBODY
    title: Enabled Conditional Access policy applies to nobody
    kind: misconfigured
    category: HYG
    severity: low
    entity: conditional-access-policy
    lens: both
    why: "A policy with no included user, group, role, external user or service principal (or users set to None) protects nothing but shows as an enabled control in every review."
    fix: "Scope the policy to the users it was written for, or delete it."
    refs: ["NIST-800-53:CM-3"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    each:
      all:
        - { field: state, op: eq, value: enabled }
        - any:
            - { field: conditions.users.includeUsers, op: empty }
            - all:
                - { field: conditions.users.includeUsers, op: contains, value: None }
                - { field: conditions.users.includeUsers, op: size-eq, value: 1 }
        - { field: conditions.users.includeGroups, op: empty }
        - { field: conditions.users.includeRoles, op: empty }
        - { field: conditions.users.includeGuestsOrExternalUsers, op: absent }
        - { field: conditions.clientApplications.includeServicePrincipals, op: empty }
    evidence: "{displayName}: enabled, includes users {conditions.users.includeUsers} and no group, role or external user"

  - id: ENTRA-CA-RESILIENCE-DEFAULTS-OFF
    title: Conditional Access policy disables resilience defaults
    kind: misconfigured
    category: AVL
    severity: low
    entity: conditional-access-policy
    lens: both
    why: "During an Entra outage the backup authentication service keeps existing sessions working; a policy with resilience defaults disabled blocks its users instead."
    fix: "Re-enable resilience defaults unless the policy depends on real-time evaluation that the backup service cannot do, and record that decision."
    refs: ["NIST-800-53:CP-2", "NIST-800-53:CP-10"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    each:
      all:
        - { field: state, op: eq, value: enabled }
        - { field: sessionControls.disableResilienceDefaults, op: eq, value: true }
    evidence: "{displayName}: disableResilienceDefaults = {sessionControls.disableResilienceDefaults}"

  - id: ENTRA-NAMEDLOC-WIDE-TRUSTED-RANGE
    title: Trusted named location contains a very wide IP range
    kind: misconfigured
    category: AUT
    severity: high
    entity: named-location
    why: "A trusted location is usually an MFA or block exception. A range of /15 or wider covers large parts of the internet, so the exception applies to almost anyone."
    fix: "Replace the range with the organisation's exact egress addresses, or mark the location untrusted."
    refs: ["NIST-800-53:AC-3", "NIST-800-53:SC-7"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/namedLocations
      key: id
      name: displayName
    each:
      all:
        - { field: ipRanges, op: notempty }
        - { field: isTrusted, op: eq, value: true }
        - { field: 'ipRanges[].cidrAddress', op: match, value: '^\d+\.\d+\.\d+\.\d+/([0-9]|1[0-5])$', threshold: entra.wide-cidr-pattern }
    evidence: "{displayName}: trusted ranges {ipRanges[].cidrAddress}"

  - id: ENTRA-NAMEDLOC-TRUSTED-REVIEW
    title: Named location is marked trusted
    kind: misconfigured
    category: AUT
    severity: info
    entity: named-location
    why: "A trusted location is usually an exception somewhere (MFA skipped, risk lowered, a block lifted). ENTRA-NAMEDLOC-WIDE-TRUSTED-RANGE judges how wide it is; this lists every one so each stays a known, owned egress range. Accept each documented location."
    fix: "Keep trusted locations to the organisation's documented egress addresses; remove the ones nobody can explain and never trust whole countries."
    refs: ["NIST-800-53:AC-3", "NIST-800-53:SC-7"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/namedLocations
      key: id
      name: displayName
    each: { field: isTrusted, op: eq, value: true }
    evidence: "{displayName}: trusted, ranges {ipRanges[].cidrAddress}"

  - id: ENTRA-CA-BASELINE-APP-ENFORCED-RESTRICTIONS
    title: No enforced policy limits Exchange and SharePoint on unmanaged devices
    kind: missing
    category: AUT
    severity: medium
    entity: tenant
    why: "The Exchange web mailbox policy and SharePoint's unmanaged-device access (read-only browser, no downloads) only take effect when a Conditional Access policy passes app-enforced restrictions to the service; without one, a home or kiosk browser downloads every attachment and file. A policy counts if it is enabled, uses the app-enforced restrictions session control and targets Office 365, Exchange Online, SharePoint Online or all resources."
    fix: "Create a policy for unmanaged devices (device filter, or exclude compliant and hybrid-joined devices) targeting Office 365 with the 'use app enforced restrictions' session control; then set the web mailbox policy and SharePoint unmanaged-device access to limited."
    refs: ["NIST-800-53:AC-19", "NIST-800-53:AC-20", "CIS-Controls-v8:4.1"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: state, op: eq, value: enabled }
          - { field: sessionControls.applicationEnforcedRestrictions.isEnabled, op: eq, value: true }
          - any:
              - { field: conditions.applications.includeApplications, op: contains, value: Office365 }
              - { field: conditions.applications.includeApplications, op: contains, value: 00000002-0000-0ff1-ce00-000000000000 }
              - { field: conditions.applications.includeApplications, op: contains, value: 00000003-0000-0ff1-ce00-000000000000 }
              - { field: conditions.applications.includeApplications, op: contains, value: All }
    evidence: "{count} enforced app-enforced-restriction policies among {rows} policies"

  - id: ENTRA-CA-BASELINE-APP-PROTECTION
    title: No enforced policy requires app protection for Office 365 on iOS and Android
    kind: missing
    category: AUT
    severity: medium
    entity: tenant
    why: "Without it, users outside device management read mail and files on phones in apps with no protection at all, and native mail apps keep a copy of the mailbox outside any control. A policy counts if it is enabled, covers iOS and Android (or all platforms), targets Office 365, Exchange Online or all resources and grants 'require app protection policy'. The older 'require approved client app' grant also counts while it stays enabled (Microsoft made it read-only in 2026)."
    fix: "Create the policy (all users, platforms iOS and Android, target Office 365, grant require app protection policy) in report-only first, then enforce; replace approved-client-app policies with it."
    refs: ["NIST-800-53:AC-19", "NIST-800-53:AC-20(3)", "CIS-Controls-v8:4.1"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: state, op: eq, value: enabled }
          - any:
              - { field: conditions.platforms.includePlatforms, op: contains, value: all }
              - all:
                  - { field: conditions.platforms.includePlatforms, op: contains, value: iOS }
                  - { field: conditions.platforms.includePlatforms, op: contains, value: android }
          - any:
              - { field: conditions.applications.includeApplications, op: contains, value: Office365 }
              - { field: conditions.applications.includeApplications, op: contains, value: 00000002-0000-0ff1-ce00-000000000000 }
              - { field: conditions.applications.includeApplications, op: contains, value: All }
          - any:
              - { field: grantControls.builtInControls, op: contains, value: compliantApplication }
              - { field: grantControls.builtInControls, op: contains, value: approvedApplication }
    evidence: "{count} enforced mobile app-protection policies among {rows} policies"

  - id: ENTRA-SYNC-ACCOUNT-NO-LOCATION-POLICY
    title: No enforced policy limits the directory-sync role to known locations
    kind: missing
    category: AUT
    severity: medium
    entity: tenant
    why: "The account the sync engine signs in with holds the Directory Synchronization Accounts role (d29b2b05-8046-44ba-8758-1e26182fcf32, a Microsoft constant) and must be left out of MFA; without a location policy its password is a from-anywhere path to directory writes. A policy counts if it is enabled, includes that role, includes all locations, excludes at least one named location and grants Block. Tenants without directory synchronisation accept the finding."
    fix: "Create a policy: directory role Directory Synchronization Accounts, locations All except the sync servers' egress, grant Block; or move the sync engine to application-based authentication with a certificate."
    refs: ["NIST-800-53:AC-17", "NIST-800-53:AC-2(12)", "MITRE-ATTACK:T1078.004"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: state, op: eq, value: enabled }
          - { field: conditions.users.includeRoles, op: contains, value: d29b2b05-8046-44ba-8758-1e26182fcf32 }
          - { field: conditions.locations.includeLocations, op: contains, value: All }
          - { field: conditions.locations.excludeLocations, op: notempty }
          - { field: grantControls.builtInControls, op: contains, value: block }
    evidence: "{count} enforced location policies cover the directory-sync role, among {rows} policies"

  # ===================================================================== security defaults ===
  - id: ENTRA-SECURITY-DEFAULTS-OFF
    title: Security defaults are off
    kind: misconfigured
    category: AUT
    severity: low
    entity: policy
    why: "With security defaults off, MFA and the legacy-authentication block depend entirely on Conditional Access. That is right for tenants with Entra ID P1, but only if those policies exist and are enforced (see the ENTRA-CA rules)."
    fix: "Tenants without P1: turn security defaults on. Tenants with P1: keep them off and confirm the Conditional Access baseline; record this finding as accepted."
    refs: ["NIST-800-53:IA-2(1)"]
    query:
      protocol: graph
      path: /policies/identitySecurityDefaultsEnforcementPolicy
      key: id
    each: { field: isEnabled, op: eq, value: false }
    evidence: "security defaults isEnabled = {isEnabled}"

  # ================================================================== authorization policy ===
  - id: ENTRA-AUTHZ-USERS-REGISTER-APPS
    title: Any user can register applications
    kind: misconfigured
    category: IAM
    severity: medium
    entity: policy
    why: "User-registered apps become unmanaged identities with credentials nobody rotates, and are a common way to persist after a phished account."
    fix: "Set 'Users can register applications' to No; grant Application Developer to the people who need it."
    refs: [CIS-M365-5.1.2.2, "NIST-800-53:CM-11"]
    query:
      protocol: graph
      path: /policies/authorizationPolicy
      key: id
    each: { field: defaultUserRolePermissions.allowedToCreateApps, op: eq, value: true }
    evidence: "allowedToCreateApps = {defaultUserRolePermissions.allowedToCreateApps}"

  - id: ENTRA-AUTHZ-USERS-CREATE-TENANTS
    title: Non-admin users can create new Entra tenants
    kind: misconfigured
    category: IAM
    severity: low
    entity: policy
    why: "Tenants created by users sit outside your governance yet carry the organisation's name and the creator becomes their administrator."
    fix: "Set 'Restrict non-admin users from creating tenants' to Yes."
    refs: [CIS-M365-5.1.2.3, "NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /policies/authorizationPolicy
      key: id
    each: { field: defaultUserRolePermissions.allowedToCreateTenants, op: eq, value: true }
    evidence: "allowedToCreateTenants = {defaultUserRolePermissions.allowedToCreateTenants}"

  - id: ENTRA-AUTHZ-USERS-CREATE-SECURITY-GROUPS
    title: Any user can create security groups
    kind: misconfigured
    category: IAM
    severity: low
    entity: policy
    why: "User-made security groups end up granting access to apps and sites without an owner or review."
    fix: "Set 'Users can create security groups' to No and delegate group creation to named roles."
    refs: [CIS-M365-5.1.3.1, "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /policies/authorizationPolicy
      key: id
    each: { field: defaultUserRolePermissions.allowedToCreateSecurityGroups, op: eq, value: true }
    evidence: "allowedToCreateSecurityGroups = {defaultUserRolePermissions.allowedToCreateSecurityGroups}"

  - id: ENTRA-AUTHZ-USERS-READ-BITLOCKER
    title: Users can read the BitLocker keys of their own devices
    kind: misconfigured
    category: IAM
    severity: low
    entity: policy
    why: "A user (or whoever took over the account) who reads the recovery key can unlock the disk and bypass the protections on a corporate device."
    fix: "Restrict non-admin users from recovering BitLocker keys of their owned devices; route recovery through the help desk."
    refs: ["NIST-800-53:SC-28"]
    query:
      protocol: graph
      path: /policies/authorizationPolicy
      key: id
    each: { field: defaultUserRolePermissions.allowedToReadBitlockerKeysForOwnedDevice, op: eq, value: true }
    evidence: "allowedToReadBitlockerKeysForOwnedDevice = {defaultUserRolePermissions.allowedToReadBitlockerKeysForOwnedDevice}"

  - id: ENTRA-AUTHZ-GUEST-INVITE-OPEN
    title: Members (or everyone) can invite guests
    kind: misconfigured
    category: IAM
    severity: medium
    entity: policy
    why: "When any member can invite, external accounts arrive without a sponsor or an expiry and nobody knows why they are there."
    fix: "Limit invitations to admins and the Guest Inviter role (allowInvitesFrom = adminsAndGuestInviters) and run guest access reviews."
    refs: ["NIST-800-53:AC-2(9)", "NIST-800-53:AC-20"]
    query:
      protocol: graph
      path: /policies/authorizationPolicy
      key: id
    each: { field: allowInvitesFrom, op: in, value: [everyone, adminsGuestInvitersAndAllMembers] }
    evidence: "allowInvitesFrom = {allowInvitesFrom}"

  - id: ENTRA-AUTHZ-GUESTS-AS-MEMBERS
    title: Guests have the same directory access as members
    kind: misconfigured
    category: IAM
    severity: high
    entity: policy
    why: "With member-level access every guest can enumerate all users, groups and their memberships, which is reconnaissance gift-wrapped for an attacker in a partner tenant."
    fix: "Set guest user access to limited (10dae51f-b6af-4016-8d66-8c2a99b929b3) or restricted (2af84b1e-32c8-42b7-82bc-daa82404023b)."
    refs: [CIS-M365-5.1.6.2, "NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /policies/authorizationPolicy
      key: id
    each: { field: guestUserRoleId, op: eq, value: a0b1b346-4d3e-4e8b-98f8-753987be4970 }
    evidence: "guestUserRoleId = {guestUserRoleId} (same access as members)"

  - id: ENTRA-AUTHZ-USER-CONSENT
    title: Users can consent to applications on their own
    kind: misconfigured
    category: IAM
    severity: medium
    entity: policy
    why: "Illicit-consent phishing needs nothing but a user clicking Accept; an app then reads mail and files with a token that survives a password reset."
    fix: "Turn off user consent and route requests through the admin consent workflow (ENTRA-CONSENT-WORKFLOW-OFF)."
    refs: [CIS-M365-5.1.5.1, "NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /policies/authorizationPolicy
      key: id
    each:
      all:
        - { field: defaultUserRolePermissions.permissionGrantPoliciesAssigned, op: notempty }
        - { field: defaultUserRolePermissions.permissionGrantPoliciesAssigned, op: match, value: '^ManagePermissionGrantsForSelf\.' }
    evidence: "user consent policies {defaultUserRolePermissions.permissionGrantPoliciesAssigned}"

  - id: ENTRA-AUTHZ-USER-CONSENT-ANY-APP
    title: Users can consent to any application, verified or not
    kind: misconfigured
    category: IAM
    severity: high
    entity: policy
    why: "The legacy consent setting lets users grant any app (any publisher, any permission they can delegate) access to their data."
    fix: "Remove the legacy user-consent policy; at most allow consent to verified publishers for low-impact permissions."
    refs: [CIS-M365-5.1.5.1, "NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /policies/authorizationPolicy
      key: id
    each: { field: defaultUserRolePermissions.permissionGrantPoliciesAssigned, op: contains, value: ManagePermissionGrantsForSelf.microsoft-user-default-legacy }
    evidence: "user consent policies {defaultUserRolePermissions.permissionGrantPoliciesAssigned}"

  - id: ENTRA-AUTHZ-RISKY-APP-CONSENT
    title: Users can consent to applications flagged as risky
    kind: misconfigured
    category: IAM
    severity: high
    entity: policy
    why: "Microsoft flags apps with suspicious consent patterns; allowing user consent to them removes the last automatic brake on consent phishing."
    fix: "Set allowUserConsentForRiskyApps to false."
    refs: ["NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /policies/authorizationPolicy
      key: id
    each: { field: allowUserConsentForRiskyApps, op: eq, value: true }
    evidence: "allowUserConsentForRiskyApps = {allowUserConsentForRiskyApps}"

  - id: ENTRA-AUTHZ-EMAIL-VERIFIED-JOIN
    title: Email-verified self-service users can join the tenant
    kind: misconfigured
    category: IAM
    severity: medium
    entity: policy
    why: "Anyone with a mailbox on one of the tenant's domains can create an unmanaged ('viral') account without an administrator."
    fix: "Set allowEmailVerifiedUsersToJoinOrganization to false."
    refs: ["NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /policies/authorizationPolicy
      key: id
    each: { field: allowEmailVerifiedUsersToJoinOrganization, op: eq, value: true }
    evidence: "allowEmailVerifiedUsersToJoinOrganization = {allowEmailVerifiedUsersToJoinOrganization}"

  - id: ENTRA-AUTHZ-SELF-SERVICE-SUBSCRIPTIONS
    title: Users can sign up for email-based self-service subscriptions
    kind: misconfigured
    category: CST
    severity: low
    entity: policy
    lens: both
    why: "Self-service sign-ups create services, data and later costs nobody approved."
    fix: "Set allowedToSignUpEmailBasedSubscriptions to false."
    refs: ["NIST-800-53:CM-7"]
    query:
      protocol: graph
      path: /policies/authorizationPolicy
      key: id
    each: { field: allowedToSignUpEmailBasedSubscriptions, op: eq, value: true }
    evidence: "allowedToSignUpEmailBasedSubscriptions = {allowedToSignUpEmailBasedSubscriptions}"

  # ============================================================ authentication methods ===
  - id: ENTRA-AUTHM-PHONE-METHODS-ENABLED
    title: SMS or voice-call authentication is enabled
    kind: misconfigured
    category: AUT
    severity: medium
    entity: authentication-method
    why: "Telephony codes can be phished in real time and redirected by SIM swap or number porting; they are the weakest MFA method."
    fix: "Run a registration campaign for the Authenticator app or passkeys, then disable SMS and Voice (or target them only at a time-boxed migration group)."
    refs: [CIS-M365-5.2.3.5, "NIST-800-53:IA-2(1)"]
    query:
      protocol: graph
      path: /policies/authenticationMethodsPolicy
      items: authenticationMethodConfigurations
      key: id
    each:
      all:
        - { field: id, op: in, value: [Sms, Voice] }
        - { field: state, op: eq, value: enabled }
    evidence: "{id} enabled for {includeTargets[].id}"

  - id: ENTRA-AUTHM-SMS-SIGN-IN
    title: SMS can be used as a primary sign-in method
    kind: misconfigured
    category: AUT
    severity: medium
    entity: authentication-method
    why: "SMS sign-in replaces the password with a code sent to a phone number, so whoever controls the number controls the account."
    fix: "Turn off 'use for sign-in' on the SMS method targets."
    refs: ["NIST-800-53:IA-2", "NIST-800-53:IA-5"]
    query:
      protocol: graph
      path: /policies/authenticationMethodsPolicy
      items: authenticationMethodConfigurations
      key: id
    each:
      all:
        - { field: id, op: eq, value: Sms }
        - { field: state, op: eq, value: enabled }
        - { field: 'includeTargets[].isUsableForSignIn', op: eq, value: true }
    evidence: "SMS sign-in usable for {includeTargets[].id}"

  - id: ENTRA-AUTHM-EMAIL-OTP-ALL-USERS
    title: Email one-time passcode is enabled for all users
    kind: misconfigured
    category: AUT
    severity: medium
    entity: authentication-method
    why: "For members, an email code turns a mailbox compromise (or a personal mailbox registered for recovery) into an account takeover path."
    fix: "Target the Email method only at guests (external ID one-time passcode) and exclude members."
    refs: [CIS-M365-5.2.3.5, "NIST-800-53:IA-5"]
    query:
      protocol: graph
      path: /policies/authenticationMethodsPolicy
      items: authenticationMethodConfigurations
      key: id
    each:
      all:
        - { field: id, op: eq, value: Email }
        - { field: state, op: eq, value: enabled }
        - { field: 'includeTargets[].id', op: eq, value: all_users }
    evidence: "Email OTP enabled for {includeTargets[].id}"

  - id: ENTRA-AUTHM-FIDO2-OFF
    title: Passkeys (FIDO2) are not enabled
    kind: missing
    category: AUT
    severity: medium
    entity: authentication-method
    why: "Without passkeys no phishing-resistant method is available, so administrators cannot be held to phishing-resistant MFA."
    fix: "Enable the Passkey (FIDO2) method, at least for administrators, with attestation enforced."
    refs: ["NIST-800-53:IA-2(6)", "NIST-800-53:IA-2(8)"]
    query:
      protocol: graph
      path: /policies/authenticationMethodsPolicy
      items: authenticationMethodConfigurations
      key: id
    each:
      all:
        - { field: id, op: eq, value: Fido2 }
        - { field: state, op: ne, value: enabled }
    evidence: "Fido2 method state = {state}"

  - id: ENTRA-AUTHM-FIDO2-NO-ATTESTATION
    title: Passkeys are enabled without attestation
    kind: misconfigured
    category: AUT
    severity: low
    entity: authentication-method
    why: "Without attestation any authenticator, including software or cloned ones, can register as a passkey."
    fix: "Enforce attestation and, where practical, restrict to approved authenticator models (AAGUIDs)."
    refs: ["NIST-800-53:IA-2(6)"]
    query:
      protocol: graph
      path: /policies/authenticationMethodsPolicy
      items: authenticationMethodConfigurations
      key: id
    each:
      all:
        - { field: id, op: eq, value: Fido2 }
        - { field: state, op: eq, value: enabled }
        - { field: isAttestationEnforced, op: eq, value: false }
    evidence: "Fido2: isAttestationEnforced = {isAttestationEnforced}, key restrictions enforced = {keyRestrictions.isEnforced}"

  - id: ENTRA-AUTHM-TAP-REUSABLE
    title: Temporary Access Pass can be used more than once
    kind: misconfigured
    category: AUT
    severity: medium
    entity: authentication-method
    why: "A Temporary Access Pass satisfies MFA on its own; a reusable one is a second password that bypasses MFA for its whole lifetime."
    fix: "Make passes one-time (isUsableOnce = true)."
    refs: ["NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /policies/authenticationMethodsPolicy
      items: authenticationMethodConfigurations
      key: id
    each:
      all:
        - { field: id, op: eq, value: TemporaryAccessPass }
        - { field: state, op: eq, value: enabled }
        - { field: isUsableOnce, op: eq, value: false }
    evidence: "TemporaryAccessPass isUsableOnce = {isUsableOnce}"

  - id: ENTRA-AUTHM-TAP-LONG-LIFETIME
    title: Temporary Access Pass may live too long
    kind: misconfigured
    category: AUT
    severity: low
    entity: authentication-method
    why: "A long-lived pass sent by mail or chat stays valid long after the onboarding moment it was meant for."
    fix: "Cap the maximum lifetime at a few hours (480 minutes or less)."
    refs: ["NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /policies/authenticationMethodsPolicy
      items: authenticationMethodConfigurations
      key: id
    each:
      all:
        - { field: id, op: eq, value: TemporaryAccessPass }
        - { field: state, op: eq, value: enabled }
        - { field: maximumLifetimeInMinutes, op: gt, value: 480, threshold: entra.tap-max-lifetime-minutes }
    evidence: "TemporaryAccessPass maximum lifetime {maximumLifetimeInMinutes} minutes"

  - id: ENTRA-AUTHM-AUTHENTICATOR-NO-CONTEXT
    title: Authenticator push does not show the app name or location
    kind: misconfigured
    category: AUT
    severity: medium
    entity: authentication-method
    why: "Without the requesting app and the sign-in location on the prompt, users approve attacker pushes (MFA fatigue) because they cannot tell them apart."
    fix: "Enable 'show application name' and 'show geographic location' in the Microsoft Authenticator settings for all users."
    refs: [CIS-M365-5.2.3.1, "NIST-800-53:IA-2(1)"]
    query:
      protocol: graph
      path: /policies/authenticationMethodsPolicy
      items: authenticationMethodConfigurations
      key: id
    each:
      all:
        - { field: id, op: eq, value: MicrosoftAuthenticator }
        - { field: state, op: eq, value: enabled }
        - any:
            - { field: featureSettings.displayAppInformationRequiredState.state, op: eq, value: disabled }
            - { field: featureSettings.displayLocationInformationRequiredState.state, op: eq, value: disabled }
    evidence: "app name {featureSettings.displayAppInformationRequiredState.state}, location {featureSettings.displayLocationInformationRequiredState.state}"

  - id: ENTRA-AUTHM-COMPANION-APP-ALLOWED
    title: Authenticator Lite (MFA inside Outlook) is allowed
    kind: misconfigured
    category: AUT
    severity: low
    entity: authentication-method
    why: "Authenticator Lite puts the second factor inside the same app that reads the mail, weakening the separation between the factors. The setting is only exposed in the beta API."
    fix: "Disable the companion-app (Authenticator Lite) feature."
    refs: [CIS-M365-5.2.3.10]
    query:
      protocol: graph
      version: beta
      path: /policies/authenticationMethodsPolicy
      items: authenticationMethodConfigurations
      key: id
    each:
      all:
        - { field: id, op: eq, value: MicrosoftAuthenticator }
        - { field: state, op: eq, value: enabled }
        - { field: featureSettings.companionAppAllowedState.state, op: ne, value: disabled }
    evidence: "companionAppAllowedState = {featureSettings.companionAppAllowedState.state}"

  - id: ENTRA-AUTHM-SYSTEM-PREFERRED-OFF
    title: System-preferred MFA is disabled
    kind: misconfigured
    category: AUT
    severity: medium
    entity: policy
    why: "Without system-preferred MFA users are prompted with whatever method they chose as default, often SMS, even when they also have a stronger method. The setting is only exposed in the beta API."
    fix: "Enable system-preferred authentication for all users."
    refs: [CIS-M365-5.2.3.6, "NIST-800-53:IA-2(1)"]
    query:
      protocol: graph
      version: beta
      path: /policies/authenticationMethodsPolicy
      key: id
    each: { field: systemCredentialPreferences.state, op: eq, value: disabled }
    evidence: "systemCredentialPreferences.state = {systemCredentialPreferences.state}"

  - id: ENTRA-AUTHM-MIGRATION-INCOMPLETE
    title: Legacy MFA and SSPR method settings are still in use
    kind: misconfigured
    category: CFG
    severity: low
    entity: policy
    lens: both
    why: "Until migration is complete the legacy per-user MFA and SSPR settings still decide some methods, so the authentication methods policy is not the whole truth; Microsoft has retired the legacy settings."
    fix: "Finish the migration to the authentication methods policy (policyMigrationState = migrationComplete)."
    refs: ["NIST-800-53:CM-6"]
    query:
      protocol: graph
      path: /policies/authenticationMethodsPolicy
      key: id
    each: { field: policyMigrationState, op: ne, value: migrationComplete }
    evidence: "policyMigrationState = {policyMigrationState}"

  - id: ENTRA-AUTHM-CAMPAIGN-OFF
    title: No registration campaign nudges users to a strong method
    kind: missing
    category: AUT
    severity: low
    entity: policy
    why: "Without a campaign, users who registered only phone methods are never asked to move to the Authenticator app or a passkey."
    fix: "Enable the registration campaign for all users (excluding emergency-access accounts)."
    refs: ["NIST-800-53:IA-2(1)"]
    query:
      protocol: graph
      path: /policies/authenticationMethodsPolicy
      key: id
    each: { field: registrationEnforcement.authenticationMethodsRegistrationCampaign.state, op: eq, value: disabled }
    evidence: "registration campaign state = {registrationEnforcement.authenticationMethodsRegistrationCampaign.state}"

  - id: ENTRA-AUTHM-REPORT-SUSPICIOUS-OFF
    title: Users cannot report an MFA prompt they did not start
    kind: missing
    category: AUT
    severity: low
    entity: policy
    why: "With 'report suspicious activity' on for everyone, a user who receives an unexpected MFA prompt can report it, which raises the account to high user risk so the user-risk policy blocks it. Without it the only choices are approve or ignore. The setting is only exposed in the beta API."
    fix: "Enable report suspicious activity for all users and make sure an enforced user-risk policy acts on high risk (ENTRA-CA-BASELINE-USER-RISK)."
    refs: ["NIST-800-53:IR-6", "NIST-800-53:IA-2(1)", "MITRE-ATTACK:T1621"]
    query:
      protocol: graph
      version: beta
      path: /policies/authenticationMethodsPolicy
      key: id
    each:
      any:
        - { field: reportSuspiciousActivitySettings.state, op: ne, value: enabled }
        - { field: reportSuspiciousActivitySettings.includeTarget.id, op: ne, value: all_users }
    evidence: "report suspicious activity: state {reportSuspiciousActivitySettings.state}, target {reportSuspiciousActivitySettings.includeTarget.id}"

  - id: ENTRA-AUTHSTRENGTH-CUSTOM-WEAK
    title: Custom authentication strength accepts phone or email factors
    kind: misconfigured
    category: AUT
    severity: medium
    entity: authentication-strength
    why: "A policy that requires an authentication strength looks strong in every review, but a custom strength that admits SMS, voice or email combinations accepts the factors that SIM swap and mailbox takeover defeat."
    fix: "Remove the SMS, voice and email combinations from the custom strength, or replace it with a built-in strength (Multifactor or Phishing-resistant)."
    refs: ["NIST-800-53:IA-2(1)", "NIST-800-53:IA-2(6)", "MITRE-ATTACK:T1621"]
    query:
      protocol: graph
      path: /policies/authenticationStrengthPolicies
      filter: "policyType eq 'custom'"
      key: id
      name: displayName
    each:
      all:
        - { field: policyType, op: eq, value: custom }
        - { field: allowedCombinations, op: match, value: '(^|,)(sms|voice|email)(,|$)', threshold: entra.authstrength-weak-combination-pattern }
    evidence: "{displayName}: allows {allowedCombinations}"

  # ===================================================================== MFA registration ===
  - id: ENTRA-MFA-MEMBER-NOT-CAPABLE
    title: Member account has no usable MFA method
    kind: missing
    category: AUT
    severity: medium
    entity: user
    why: "An account without a registered, policy-allowed MFA method signs in with a password alone wherever MFA is not forced; at the first forced prompt whoever knows the password can register their own method. The report includes disabled accounts (it does not carry accountEnabled). Needs Entra ID P1."
    fix: "Force registration (registration campaign or a Conditional Access policy for registering security info), oldest passwords first; disable accounts nobody uses."
    refs: [CIS-M365-5.2.3.4, "NIST-800-53:IA-2(1)"]
    query:
      protocol: graph
      path: /reports/authenticationMethods/userRegistrationDetails
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: userType, op: eq, value: member }
        - { field: isMfaCapable, op: eq, value: false }
    evidence: "{userPrincipalName}: methods {methodsRegistered}"

  - id: ENTRA-MFA-ADMIN-NOT-CAPABLE
    title: Administrator has no usable MFA method
    kind: missing
    category: AUT
    severity: critical
    entity: user
    why: "An administrator who cannot do MFA either signs in with a password alone or is excluded from MFA policies; either way the tenant's most powerful account is its weakest."
    fix: "Register a phishing-resistant method for the administrator now and require it for admin roles."
    refs: [CIS-M365-5.2.2.1, "NIST-800-53:IA-2(1)"]
    query:
      protocol: graph
      path: /reports/authenticationMethods/userRegistrationDetails
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: isAdmin, op: eq, value: true }
        - { field: isMfaCapable, op: eq, value: false }
    evidence: "admin {userPrincipalName}: methods {methodsRegistered}"

  - id: ENTRA-MFA-ADMIN-NO-PHISHING-RESISTANT
    title: Administrator has no phishing-resistant method
    kind: missing
    category: AUT
    severity: medium
    entity: user
    why: "Push, codes and phone methods can all be relayed by an adversary-in-the-middle phishing kit; only passkeys, Windows Hello and certificates resist it."
    fix: "Register a passkey (FIDO2 key or Authenticator passkey) or Windows Hello for every administrator, then require the phishing-resistant authentication strength for admin roles."
    refs: ["NIST-800-53:IA-2(6)", "NIST-800-53:IA-2(8)"]
    query:
      protocol: graph
      path: /reports/authenticationMethods/userRegistrationDetails
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: isAdmin, op: eq, value: true }
        - any:
            - { field: methodsRegistered, op: empty }
            - not: { field: methodsRegistered, op: match, value: '^(fido2|windowsHelloForBusiness|passKey.*|macOsSecureEnclaveKey|x509CertificateMultiFactor)$' }
    evidence: "admin {userPrincipalName}: methods {methodsRegistered}"

  - id: ENTRA-MFA-PHONE-ONLY
    title: Member relies only on phone or email methods
    kind: misconfigured
    category: AUT
    severity: medium
    entity: user
    why: "A user whose only second factors are SMS, voice or email can be taken over by SIM swap or by a compromised mailbox."
    fix: "Have the user register the Authenticator app or a passkey (registration campaign), then remove the telephony methods."
    refs: [CIS-M365-5.2.3.5, "NIST-800-53:IA-2(1)"]
    query:
      protocol: graph
      path: /reports/authenticationMethods/userRegistrationDetails
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: userType, op: eq, value: member }
        - { field: isMfaRegistered, op: eq, value: true }
        - { field: methodsRegistered, op: notempty }
        - not: { field: methodsRegistered, op: match, value: '^(microsoftAuthenticatorPush|microsoftAuthenticatorPasswordless|softwareOneTimePasscode|hardwareOneTimePasscode|fido2|windowsHelloForBusiness|passKey.*|macOsSecureEnclaveKey|x509Certificate.*|externalAuthenticationMethod)$' }
    evidence: "{userPrincipalName}: methods {methodsRegistered}"

  - id: ENTRA-BREAKGLASS-WEAK-METHODS
    title: Emergency-access account can be reached through a weak method or has no passkey
    kind: misconfigured
    category: AUT
    severity: high
    entity: user
    why: "The most powerful accounts in the tenant must not be reachable through the weakest factors: a phone, e-mail, software code or Temporary Access Pass registered on an emergency-access account can be redirected, phished or issued by a help desk, and without a passkey (FIDO2 key) the account cannot pass a phishing-resistant policy. List the account ids in entra.breakglass-user-ids; with the list empty the rule checks nothing. The registration report is refreshed by Microsoft a few times a day."
    fix: "Register two FIDO2 security keys per emergency-access account, keep them offline in separate places, remove every phone, e-mail and code method, and leave the accounts out of registration campaigns."
    refs: ["NIST-800-53:IA-2(1)", "NIST-800-53:IA-2(6)", "NIST-800-53:CP-2", "MITRE-ATTACK:T1621"]
    query:
      protocol: graph
      path: /reports/authenticationMethods/userRegistrationDetails
      key: id
      name: userPrincipalName
    each:
      all:
        - field: id
          op: in
          threshold: entra.breakglass-user-ids
          value: []
        - any:
            - { field: methodsRegistered, op: empty }
            - { field: methodsRegistered, op: match, value: '^(mobilePhone|alternateMobilePhone|officePhone|email|softwareOneTimePasscode|temporaryAccessPass)$', threshold: entra.breakglass-weak-method-pattern }
            - not: { field: methodsRegistered, op: match, value: '^(passKey.*|fido2.*)$' }
    evidence: "{userPrincipalName}: methods {methodsRegistered}"

  - id: ENTRA-SSPR-MEMBER-NOT-REGISTERED
    title: Member in scope for self-service password reset has not registered for it
    kind: missing
    category: AUT
    severity: low
    entity: user
    lens: both
    why: "A user who may reset their password but registered no reset method calls the help desk when locked out, and the help desk resets passwords over the phone - the step social engineering aims for. Measures what 'require registration at sign-in' and registration campaigns achieve. Needs Entra ID P1."
    fix: "Turn on registration enforcement at sign-in for self-service password reset, or run a registration campaign; check the remaining users individually."
    refs: [CIS-M365:5.2.4.3, "NIST-800-53:IA-5"]
    query:
      protocol: graph
      path: /reports/authenticationMethods/userRegistrationDetails
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: userType, op: eq, value: member }
        - { field: isSsprEnabled, op: eq, value: true }
        - { field: isSsprRegistered, op: eq, value: false }
    evidence: "{userPrincipalName}: SSPR enabled, not registered (methods {methodsRegistered})"

  # ============================================================ users (shared inventory) ===
  # The user inventory query below is the one reusable Entra user query (entity user). It is
  # repeated verbatim in every rule that uses it, so the engine fetches it once.
  - id: ENTRA-USER-INACTIVE
    title: Enabled member account with no successful sign-in for a long time
    kind: misconfigured
    category: HYG
    severity: medium
    entity: user
    lens: both
    why: "Dormant accounts are a favourite foothold: nobody notices their sign-ins or MFA prompts. Staleness is judged by the last SUCCESSFUL sign-in (interactive or not), so failed attempts such as a password spray do not make a dormant account look active. Needs Entra ID P1."
    fix: "Confirm with the owner or HR, then disable (at the source for synchronised accounts) and remove licences; service accounts move to managed identities."
    refs: ["NIST-800-53:AC-2(3)"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: userType, op: eq, value: Member }
        - any:
            - { field: createdDateTime, op: absent }
            - { field: createdDateTime, op: age-gt, value: 90, threshold: entra.user-inactive-days }
        - any:
            - { field: signInActivity.lastSuccessfulSignInDateTime, op: absent }
            - { field: signInActivity.lastSuccessfulSignInDateTime, op: age-gt, value: 90, threshold: entra.user-inactive-days }
    evidence: "{userPrincipalName}: last successful sign-in {signInActivity.lastSuccessfulSignInDateTime} (created {createdDateTime}, synced {onPremisesSyncEnabled})"

  - id: ENTRA-GUEST-INACTIVE
    title: Guest account with no successful sign-in for a long time
    kind: misconfigured
    category: HYG
    severity: medium
    entity: user
    lens: both
    why: "A guest who stopped working with the organisation keeps access to whatever was shared with them, governed by someone else's identity hygiene."
    fix: "Remove guests with no successful sign-in in the window; run a recurring guest access review."
    refs: [CIS-M365-5.3.2, "NIST-800-53:AC-2(3)"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: userType, op: eq, value: Guest }
        - any:
            - { field: createdDateTime, op: absent }
            - { field: createdDateTime, op: age-gt, value: 90, threshold: entra.guest-inactive-days }
        - any:
            - { field: signInActivity.lastSuccessfulSignInDateTime, op: absent }
            - { field: signInActivity.lastSuccessfulSignInDateTime, op: age-gt, value: 90, threshold: entra.guest-inactive-days }
    evidence: "{userPrincipalName}: last successful sign-in {signInActivity.lastSuccessfulSignInDateTime} (created {createdDateTime})"

  - id: ENTRA-USER-STALE-SIGNIN-ATTEMPTS
    title: Recent sign-in attempts against a dormant account
    kind: broken
    category: AUT
    severity: high
    entity: user
    why: "An account nobody has used successfully for months but that keeps receiving sign-in attempts is being guessed at (password spray, credential stuffing) or used by a forgotten tool with a stale password."
    fix: "Disable the account if it is not needed; otherwise reset its password, check its MFA methods and look up the source of the attempts in the sign-in logs or SIEM."
    refs: ["NIST-800-53:AC-7", "NIST-800-53:SI-4"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - any:
            - { field: createdDateTime, op: absent }
            - { field: createdDateTime, op: age-gt, value: 90, threshold: entra.user-inactive-days }
        - any:
            - { field: signInActivity.lastSuccessfulSignInDateTime, op: absent }
            - { field: signInActivity.lastSuccessfulSignInDateTime, op: age-gt, value: 90, threshold: entra.user-inactive-days }
        - any:
            - { field: signInActivity.lastSignInDateTime, op: age-lt, value: 14, threshold: entra.signin-attempt-window-days }
            - { field: signInActivity.lastNonInteractiveSignInDateTime, op: age-lt, value: 14, threshold: entra.signin-attempt-window-days }
    evidence: "{userPrincipalName}: last successful sign-in {signInActivity.lastSuccessfulSignInDateTime}, last attempt {signInActivity.lastSignInDateTime} (non-interactive {signInActivity.lastNonInteractiveSignInDateTime})"

  - id: ENTRA-USER-DISABLED-SIGNIN-ATTEMPTS
    title: Recent sign-in attempts against a disabled account
    kind: broken
    category: AUT
    severity: medium
    entity: user
    why: "Attempts on a disabled account are either a device or service still configured with it (which will break) or someone guessing; both need an owner."
    fix: "Find the source in the sign-in logs; remove the account from the device or service, or treat the attempts as an attack indicator."
    refs: ["NIST-800-53:SI-4", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: false }
        - any:
            - { field: signInActivity.lastSignInDateTime, op: age-lt, value: 14, threshold: entra.signin-attempt-window-days }
            - { field: signInActivity.lastNonInteractiveSignInDateTime, op: age-lt, value: 14, threshold: entra.signin-attempt-window-days }
    evidence: "disabled {userPrincipalName}: last attempt {signInActivity.lastSignInDateTime} (non-interactive {signInActivity.lastNonInteractiveSignInDateTime})"

  - id: ENTRA-USER-SYNCED-NO-SID
    title: Synchronised user without an on-premises security identifier
    kind: broken
    category: HYG
    severity: low
    entity: user
    lens: maintenance
    why: "Without onPremisesSecurityIdentifier the cloud account cannot be matched back to its AD account, so AD-to-Entra hygiene checks (and hybrid joins in reports) miss it."
    fix: "Check the object's sync rules and source anchor in Entra Connect; re-sync or hard-match the account to its AD object."
    refs: ["NIST-800-53:CM-8"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: onPremisesSyncEnabled, op: eq, value: true }
        - { field: onPremisesSecurityIdentifier, op: absent }
    evidence: "{userPrincipalName}: synchronised, no onPremisesSecurityIdentifier"

  - id: ENTRA-GUEST-INVITE-PENDING
    title: Guest invitation never accepted
    kind: misconfigured
    category: HYG
    severity: low
    entity: user
    lens: both
    why: "An unredeemed invitation is an account waiting for whoever gets the invitation mail first; most are simply abandoned."
    fix: "Delete guests whose invitation has been pending past the window, or resend it if the collaboration is still current."
    refs: ["NIST-800-53:AC-2(9)"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, assignedLicenses, licenseAssignmentStates, onPremisesSyncEnabled, onPremisesDistinguishedName, onPremisesProvisioningErrors, passwordPolicies, lastPasswordChangeDateTime, externalUserState, externalUserStateChangeDateTime, serviceProvisioningErrors]
      top: 999
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: userType, op: eq, value: Guest }
        - { field: externalUserState, op: eq, value: PendingAcceptance }
        - any:
            - { field: externalUserStateChangeDateTime, op: age-gt, value: 30, threshold: entra.guest-invite-max-days }
            - all:
                - { field: externalUserStateChangeDateTime, op: absent }
                - { field: createdDateTime, op: age-gt, value: 30, threshold: entra.guest-invite-max-days }
    evidence: "{userPrincipalName}: invitation pending since {externalUserStateChangeDateTime} (created {createdDateTime})"

  - id: ENTRA-USER-WEAK-PASSWORD-ALLOWED
    title: Account is exempt from password complexity
    kind: misconfigured
    category: AUT
    severity: medium
    entity: user
    why: "DisableStrongPassword lets the account use short, simple passwords that fall to the first guessing attempt."
    fix: "Remove DisableStrongPassword from passwordPolicies; move the account to passwordless or a managed identity if it is a service."
    refs: ["NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, assignedLicenses, licenseAssignmentStates, onPremisesSyncEnabled, onPremisesDistinguishedName, onPremisesProvisioningErrors, passwordPolicies, lastPasswordChangeDateTime, externalUserState, externalUserStateChangeDateTime, serviceProvisioningErrors]
      top: 999
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: passwordPolicies, op: contains, value: DisableStrongPassword }
    evidence: "{userPrincipalName}: passwordPolicies = {passwordPolicies}"

  - id: ENTRA-USER-CLOUD-PASSWORD-OLD
    title: Cloud-only account password older than the expiry window
    kind: broken
    category: AUT
    severity: low
    entity: user
    lens: both
    why: "Where a domain still expires passwords, a cloud-only room, shared-device or service account silently stops signing in when its password ages out; where it does not, a very old password on an account nobody watches is a guessing target. The default window is a year; set the threshold to the domain's password validity period where passwords expire."
    fix: "For device and room accounts set a managed password rotation (or DisablePasswordExpiration with MFA-free sign-in restricted by Conditional Access); for people, move to passwordless or rotate."
    refs: ["NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, assignedLicenses, licenseAssignmentStates, onPremisesSyncEnabled, onPremisesDistinguishedName, onPremisesProvisioningErrors, passwordPolicies, lastPasswordChangeDateTime, externalUserState, externalUserStateChangeDateTime, serviceProvisioningErrors]
      top: 999
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: userType, op: eq, value: Member }
        - any:
            - { field: onPremisesSyncEnabled, op: absent }
            - { field: onPremisesSyncEnabled, op: eq, value: false }
        - { field: lastPasswordChangeDateTime, op: age-gt, value: 365, threshold: entra.password-max-age-days }
        - any:
            - { field: passwordPolicies, op: absent }
            - { field: passwordPolicies, op: notcontains, value: DisablePasswordExpiration }
    evidence: "{userPrincipalName}: password last changed {lastPasswordChangeDateTime}, passwordPolicies {passwordPolicies}"

  - id: ENTRA-USER-DISABLED-PASSWORD-RESET
    title: Password of a disabled account was changed recently
    kind: misconfigured
    category: IAM
    severity: medium
    entity: user
    why: "Resetting the password of a long-disabled account usually means someone is about to re-enable it (often by mistake, or a social-engineered help-desk call); the reset alone leaves any attacker-registered MFA methods in place."
    fix: "Confirm who asked for the reset and why; if the account is re-enabled, review and reset its MFA methods and revoke sessions."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:IA-5"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, assignedLicenses, licenseAssignmentStates, onPremisesSyncEnabled, onPremisesDistinguishedName, onPremisesProvisioningErrors, passwordPolicies, lastPasswordChangeDateTime, externalUserState, externalUserStateChangeDateTime, serviceProvisioningErrors]
      top: 999
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: false }
        - { field: lastPasswordChangeDateTime, op: age-lt, value: 30, threshold: entra.disabled-reset-window-days }
    evidence: "disabled {userPrincipalName}: password changed {lastPasswordChangeDateTime}"

  - id: ENTRA-USER-ENABLED-IN-LEAVER-OU
    title: Enabled synchronised account sits in a leavers or disabled OU
    kind: broken
    category: IAM
    severity: high
    entity: user
    why: "Moving a leaver to a 'disabled' OU without disabling the AD account leaves the cloud account enabled; it keeps its access, licences and app assignments."
    fix: "Disable the account in AD (sync then disables it in Entra) and find out why the OU move did not disable it. Tune the OU pattern with the threshold."
    refs: ["NIST-800-53:AC-2(3)", "NIST-800-53:PS-4"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, assignedLicenses, licenseAssignmentStates, onPremisesSyncEnabled, onPremisesDistinguishedName, onPremisesProvisioningErrors, passwordPolicies, lastPasswordChangeDateTime, externalUserState, externalUserStateChangeDateTime, serviceProvisioningErrors]
      top: 999
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: onPremisesSyncEnabled, op: eq, value: true }
        - { field: onPremisesDistinguishedName, op: match, value: 'OU=[^,]*(disabl|leaver|terminat|deprovision|former)', threshold: entra.leaver-ou-pattern }
    evidence: "{userPrincipalName}: enabled, in {onPremisesDistinguishedName}"

  - id: ENTRA-SYNC-PROVISIONING-ERROR
    title: Synchronised user has a provisioning error
    kind: broken
    category: HLT
    severity: medium
    entity: user
    lens: maintenance
    why: "An object stuck on a sync conflict (duplicate UPN or proxy address) stops receiving updates from AD, including being disabled."
    fix: "Resolve the conflicting attribute in AD, then let the next sync clear the error."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:CM-8"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, assignedLicenses, licenseAssignmentStates, onPremisesSyncEnabled, onPremisesDistinguishedName, onPremisesProvisioningErrors, passwordPolicies, lastPasswordChangeDateTime, externalUserState, externalUserStateChangeDateTime, serviceProvisioningErrors]
      top: 999
      key: id
      name: userPrincipalName
    each: { field: onPremisesProvisioningErrors, op: notempty }
    evidence: "{userPrincipalName}: {onPremisesProvisioningErrors[].category} on {onPremisesProvisioningErrors[].propertyCausingError} ({onPremisesProvisioningErrors[].value})"

  - id: ENTRA-USER-DISABLED-APP-ASSIGNED
    title: Disabled user still assigned to enterprise applications
    kind: misconfigured
    category: HYG
    severity: low
    entity: user
    lens: both
    why: "Direct app assignments of disabled users keep provisioning them into SaaS apps (and holding seats there) and come back if the account is re-enabled. Covers direct assignments only; assignments through groups are in the backlog."
    fix: "Remove the app assignments as part of the leaver process, or exclude disabled users from the assignment."
    refs: ["NIST-800-53:AC-2(3)"]
    query:
      protocol: graph
      path: /users
      filter: "accountEnabled eq false"
      select: [id, userPrincipalName, accountEnabled]
      expand: appRoleAssignments($select=id,resourceDisplayName,createdDateTime)
      key: id
      name: userPrincipalName
    each: { field: appRoleAssignments, op: size-gt, value: 0 }
    evidence: "disabled {userPrincipalName}: assigned to {appRoleAssignments[].resourceDisplayName}"

  - id: ENTRA-USER-EXTERNAL-MEMBER
    title: External account has member-level access
    kind: misconfigured
    category: IAM
    severity: medium
    entity: user
    why: "An account invited from another tenant (UPN with #EXT#) whose userType is Member gets member directory access, can create groups and falls into every 'all members' policy and group, while its credentials and lifecycle stay with the other organisation."
    fix: "Convert the account back to Guest, or give the person a real member account in this tenant if they work here."
    refs: ["NIST-800-53:AC-2(9)", "NIST-800-53:AC-6", "MITRE-ATTACK:T1078.004"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: userType, op: eq, value: Member }
        - { field: userPrincipalName, op: contains, value: '#EXT#' }
    evidence: "{userPrincipalName}: external account with userType Member (created {createdDateTime})"

  - id: ENTRA-GUEST-CONSUMER-DOMAIN
    title: Guest invited from a consumer mail service
    kind: misconfigured
    category: IAM
    severity: low
    entity: user
    why: "A guest on a consumer mailbox has no organisation behind it: nobody else enforces its MFA, nobody offboards it, and it is often a former employee's or contractor's personal address. Extend the domain pattern with the threshold."
    fix: "Replace it with a guest from the partner's own tenant, or record the exception and put the guest in a recurring access review."
    refs: ["NIST-800-53:AC-2(9)", "NIST-800-53:AC-20", "CIS-Controls-v8:6.2"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: userType, op: eq, value: Guest }
        - { field: userPrincipalName, op: match, value: '_(gmail\.com|googlemail\.com|outlook\.com|hotmail\.com|hotmail\.co\.uk|live\.com|msn\.com|yahoo\.com|yahoo\.co\.uk|icloud\.com|me\.com|aol\.com|gmx\.(de|net|com)|proton\.me|protonmail\.com)#EXT#@', threshold: entra.consumer-mail-pattern }
    evidence: "guest {userPrincipalName} (created {createdDateTime}, last successful sign-in {signInActivity.lastSuccessfulSignInDateTime})"

  - id: ENTRA-GUEST-NO-SPONSOR
    title: Enabled guest has no sponsor
    kind: missing
    category: HYG
    severity: low
    entity: user
    lens: both
    why: "Without a sponsor nobody inside the organisation answers for the guest: nobody renews, reviews or removes it when the collaboration ends."
    fix: "Set the inviter or the owning team as sponsor, and make sponsors part of the invitation flow (entitlement management or the invite form)."
    refs: ["NIST-800-53:AC-2(9)", "CIS-Controls-v8:6.2"]
    query:
      protocol: graph
      path: /users
      filter: "userType eq 'Guest'"
      select: [id, userPrincipalName, accountEnabled, createdDateTime]
      expand: sponsors($select=id)
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: sponsors, op: empty }
    evidence: "guest {userPrincipalName} (created {createdDateTime}) has no sponsor"

  - id: ENTRA-RISKY-USER-OPEN
    title: Risky user left unremediated
    kind: broken
    category: AUT
    severity:
      field: riskLevel
      map: { high: high, medium: medium }
      default: medium
    entity: user
    why: "Identity Protection marks users whose credentials leaked or whose sign-ins look compromised; left at risk for days, the account is likely still in an attacker's hands. Full detail needs Entra ID P2."
    fix: "Reset the password securely, revoke sessions, review MFA methods and recent activity, then confirm compromised or dismiss."
    refs: ["NIST-800-53:IR-4", "NIST-800-53:SI-4"]
    query:
      protocol: graph
      path: /identityProtection/riskyUsers
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: riskState, op: in, value: [atRisk, confirmedCompromised] }
        - { field: riskLevel, op: in, value: [high, medium] }
        - { field: riskLastUpdatedDateTime, op: age-gt, value: 7, threshold: entra.risky-user-max-days }
    evidence: "{userPrincipalName}: {riskLevel} risk, {riskState} since {riskLastUpdatedDateTime} ({riskDetail})"

  # ------------------------------------------------ users: emergency access, hygiene, attributes ---
  # These rules read the shared user inventory query (identical select in every rule, see the note
  # above ENTRA-USER-INACTIVE). Tenant lists (emergency-access ids, naming patterns) are thresholds;
  # with a list threshold empty the rule checks nothing, with a pattern threshold unset the default
  # given here applies.
  - id: ENTRA-BREAKGLASS-UNTESTED
    title: Emergency-access account has not signed in for a quarter
    kind: misconfigured
    category: AVL
    severity: medium
    entity: user
    lens: both
    why: "An emergency-access account nobody has tested this quarter may be blocked by a newer policy, carry an expired key or a lost password exactly on the day it is needed. The accounts are tenant-specific: list their object ids in the threshold entra.breakglass-user-ids; with the list empty the rule checks nothing. Needs Entra ID P1 for signInActivity."
    fix: "Run the scheduled test sign-in with each emergency-access account, confirm the sign-in alert fires, and record the test."
    refs: ["NIST-800-53:CP-2", "NIST-800-53:CP-4", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - field: id
          op: in
          threshold: entra.breakglass-user-ids
          value: []
        - any:
            - { field: signInActivity.lastSuccessfulSignInDateTime, op: absent }
            - { field: signInActivity.lastSuccessfulSignInDateTime, op: age-gt, value: 90, threshold: entra.breakglass-test-days }
    evidence: "{userPrincipalName}: last successful sign-in {signInActivity.lastSuccessfulSignInDateTime}, enabled {accountEnabled}"

  - id: ENTRA-USER-NAME-PATTERN-SUSPECT
    title: Enabled account named like a test, temporary or old account
    kind: misconfigured
    category: HYG
    severity: low
    entity: user
    lens: both
    why: "Test, temporary, demo and 'old' accounts are created for a day and live for years, often with a shared or simple password and nobody watching their sign-ins. Tune the word list with the threshold."
    fix: "Delete or disable the account; turn the ones still in use into named accounts with an owner."
    refs: ["NIST-800-53:AC-2", "CIS-Controls-v8:5.1"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - any:
            - { field: displayName, op: match, value: '(^|[^a-z])(test|temp|tmp|demo|old|copy|backup)([^a-z]|$)', threshold: entra.suspect-name-pattern }
            - { field: userPrincipalName, op: match, value: '(^|[^a-z])(test|temp|tmp|demo|old|copy|backup)([^a-z]|$)', threshold: entra.suspect-name-pattern }
    evidence: "{userPrincipalName} ({displayName}): created {createdDateTime}, last successful sign-in {signInActivity.lastSuccessfulSignInDateTime}"

  - id: ENTRA-USER-SYNC-UNEXPECTED-DOMAIN
    title: Synchronised user comes from an unexpected on-premises domain
    kind: misconfigured
    category: IAM
    severity: low
    entity: user
    why: "A synchronised object whose on-premises domain is not one the organisation expects points at an old sync rule, a second sync server or a forest nobody documented - each one a path into the cloud directory outside the known one. The expected domains are tenant-specific: set the pattern in the threshold; until then the rule checks nothing."
    fix: "Find the sync source of the domain; remove it from the sync scope or document it."
    refs: ["NIST-800-53:CM-8", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: onPremisesSyncEnabled, op: eq, value: true }
        - { field: onPremisesDomainName, op: notmatch, value: '.*', threshold: entra.expected-onprem-domain-pattern }
    evidence: "{userPrincipalName}: synchronised from {onPremisesDomainName}"

  - id: ENTRA-USER-ATTR-MISSING
    title: Enabled member account is missing core directory attributes
    kind: missing
    category: HYG
    severity: low
    entity: user
    lens: maintenance
    why: "Department, job title, given name and surname drive dynamic groups, approvals, address books and HR joins; a usage location is what licensing and country-bound services read. An account without them falls through every rule that keys on them. Accounts younger than the grace period and accounts matching the service-account pattern are left out. One finding per account, the evidence lists what is empty; tenants that never fill one of these attributes accept the rule by override."
    fix: "Fill the attributes at the source (the HR feed, or AD for synchronised accounts), never by hand in the cloud."
    refs: ["NIST-800-53:CM-8", "NIST-800-53:AC-2", "CIS-Controls-v8:5.1"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: userType, op: eq, value: Member }
        - any:
            - { field: createdDateTime, op: absent }
            - { field: createdDateTime, op: age-gt, value: 30, threshold: entra.attr-grace-days }
        - { field: userPrincipalName, op: notmatch, value: '^(svc|srv|sa|mbx|room|shared|sync)[-_.]', threshold: entra.service-account-upn-pattern }
        - any:
            - { field: department, op: empty }
            - { field: jobTitle, op: empty }
            - { field: givenName, op: empty }
            - { field: surname, op: empty }
            - all:
                - { field: assignedLicenses, op: notempty }
                - { field: usageLocation, op: empty }
    evidence: "{userPrincipalName}: department '{department}', job title '{jobTitle}', given name '{givenName}', surname '{surname}', usage location '{usageLocation}'"

  - id: ENTRA-USER-ATTR-FORMAT
    title: Directory attribute of an enabled member is badly formatted
    kind: misconfigured
    category: HYG
    severity: low
    entity: user
    lens: maintenance
    why: "Leading, trailing or doubled spaces in names, departments and titles, digits in given names or surnames, characters outside letters, digits, dot, dash and underscore in the UPN, or a space in the mail address break dynamic group rules, sorting, HR joins and SaaS sign-in names. Each pattern is its own threshold; set one to (?!) to switch that check off."
    fix: "Correct the value at the source (HR feed or AD) so the next sync carries it."
    refs: ["NIST-800-53:CM-8", "NIST-800-53:IA-4"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: userType, op: eq, value: Member }
        - any:
            - { field: displayName, op: match, value: '^\s|\s$|\s{2,}', threshold: entra.attr-space-pattern }
            - { field: department, op: match, value: '^\s|\s$|\s{2,}', threshold: entra.attr-space-pattern }
            - { field: jobTitle, op: match, value: '^\s|\s$|\s{2,}', threshold: entra.attr-space-pattern }
            - { field: givenName, op: match, value: '\d', threshold: entra.attr-name-digit-pattern }
            - { field: surname, op: match, value: '\d', threshold: entra.attr-name-digit-pattern }
            - { field: userPrincipalName, op: match, value: '^[^@]*[^a-z0-9._@-][^@]*@', threshold: entra.upn-local-char-pattern }
            - { field: mail, op: match, value: '\s', threshold: entra.mail-format-pattern }
    evidence: "{userPrincipalName}: display name '{displayName}', given '{givenName}', surname '{surname}', department '{department}', title '{jobTitle}', mail '{mail}'"

  - id: ENTRA-USER-UPN-ONMICROSOFT
    title: Synchronised or licensed member signs in with the onmicrosoft.com domain
    kind: misconfigured
    category: IAM
    severity:
      field: onPremisesSyncEnabled
      map: { 'true': medium }
      default: low
    entity: user
    why: "A person whose UPN sits on the tenant's initial onmicrosoft.com domain signs in under a name nobody uses, mail and UPN differ, and SSO to apps that key on the UPN breaks. For a synchronised account (medium) it means the on-premises UPN suffix is not a verified domain. Unlicensed cloud-only accounts (dedicated admin and emergency-access accounts are often deliberately on onmicrosoft.com) are left out, as are the listed emergency-access ids."
    fix: "Verify the organisation's domain and change the UPN suffix (in AD for synchronised users, adding the suffix there first)."
    refs: ["NIST-800-53:IA-4", "NIST-800-53:IA-2"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: userType, op: eq, value: Member }
        - { field: userPrincipalName, op: match, value: '@[^@]+\.onmicrosoft\.com$' }
        - { field: userPrincipalName, op: notmatch, value: '^Sync_', threshold: entra-connect.sync-account-pattern }
        - field: id
          op: notin
          threshold: entra.breakglass-user-ids
          value: []
        - any:
            - { field: onPremisesSyncEnabled, op: eq, value: true }
            - { field: assignedLicenses, op: notempty }
    evidence: "{userPrincipalName}: synchronised {onPremisesSyncEnabled}, on-premises UPN {onPremisesUserPrincipalName}, mail {mail}"

  - id: ENTRA-USER-MAIL-UPN-MISMATCH
    title: Member's primary mail address differs from the UPN
    kind: misconfigured
    category: IAM
    severity: low
    entity: user
    why: "SaaS apps match a person on mail or on UPN; when the two differ the same person becomes two identities in an app that keys on one and is provisioned on the other - double seats, broken SSO and a leaver who keeps the second account. Tenants that use different UPNs by design accept the rule by override."
    fix: "Align the UPN with the primary mail address at the source, or make the provisioning target match on the same attribute it signs in with."
    refs: ["NIST-800-53:IA-4", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: userType, op: eq, value: Member }
        - { field: mail, op: ne, value: { field: userPrincipalName } }
    evidence: "{userPrincipalName}: mail {mail}"

  - id: ENTRA-USER-UPN-ONPREM-MISMATCH
    title: Synchronised user's cloud UPN differs from its on-premises UPN
    kind: misconfigured
    category: IAM
    severity: medium
    entity: user
    why: "When the cloud UPN of a synchronised account differs from the AD one, the on-premises suffix was not verified (Entra fell back to onmicrosoft.com) or the cloud value was edited; the person signs in under one name on-premises and another in the cloud, and apps that match on either see two people."
    fix: "Verify the UPN suffix used in AD as a domain in the tenant (or change the AD suffix to a verified one) and let the next sync align the cloud UPN."
    refs: ["NIST-800-53:IA-4", "NIST-800-53:IA-2"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: onPremisesSyncEnabled, op: eq, value: true }
        - { field: onPremisesUserPrincipalName, op: ne, value: { field: userPrincipalName } }
    evidence: "{userPrincipalName}: on-premises UPN {onPremisesUserPrincipalName} (domain {onPremisesDomainName})"

  - id: ENTRA-USER-PRIMARY-ADDRESS-ONMICROSOFT
    title: Member's primary SMTP address is on the onmicrosoft.com domain
    kind: misconfigured
    category: CFG
    severity: low
    entity: user
    why: "Mail sent from a primary address on the tenant's onmicrosoft.com domain fails the organisation's DMARC alignment and looks like phishing to recipients; it is usually an account created before the domain was set as default. The primary address is the proxy address with an upper-case SMTP: prefix (matched case-sensitively). Service accounts that must keep it are listed in entra.onmicrosoft-primary-allow-ids."
    fix: "Set the primary SMTP address on the organisation's domain (in AD for synchronised accounts) and keep onmicrosoft.com as a secondary alias."
    refs: ["NIST-800-53:CM-6", "NIST-800-53:SI-8", "CIS-Controls-v8:9.5"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: userType, op: eq, value: Member }
        - { field: proxyAddresses, op: match, value: '(?-i)^SMTP:(?i)[^@]+@[^@]*\.onmicrosoft\.com$' }
        - field: id
          op: notin
          threshold: entra.onmicrosoft-primary-allow-ids
          value: []
    evidence: "{userPrincipalName}: addresses {proxyAddresses}"

  # Directory-sync identities in the cloud: user accounts whose UPN matches the threshold pattern
  # entra-connect.sync-account-pattern (the installer names them Sync_<server>_<id>; MSOL_ and AAD_
  # accounts are on-premises AD accounts, not cloud ones). From version 2.5.76.0 the engine signs in
  # with an application (ConnectSyncProvisioning_<server>_<id>) instead, and the legacy account is
  # left behind until someone removes it.
  - id: ENTRA-SYNC-ACCOUNT-MULTIPLE
    title: More directory-sync accounts than sync servers
    kind: misconfigured
    category: IAM
    severity: medium
    entity: tenant
    why: "Each installation of the sync engine creates its own cloud sync account with directory-write rights, and uninstalling a server does not delete it. More enabled sync accounts than the active and staging servers is a directory-write credential nobody watches. Set the expected number (active plus staging servers) in the threshold."
    fix: "Match each account to a running server (its name carries the server name); delete the accounts of servers that no longer exist after confirming them in the role's member list."
    refs: ["NIST-800-53:AC-2(3)", "CIS-Controls-v8:5.3"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    count:
      op: gt
      value: 2
      threshold: entra-connect.expected-sync-accounts
      where:
        all:
          - { field: accountEnabled, op: eq, value: true }
          - { field: userPrincipalName, op: match, value: '^Sync_', threshold: entra-connect.sync-account-pattern }
    evidence: "{count} enabled directory-sync accounts (ids {sample})"

  - id: ENTRA-SYNC-ACCOUNT-IDLE
    title: Directory-sync account is disabled or has not signed in for weeks
    kind: misconfigured
    category: HYG
    severity: medium
    entity: user
    lens: both
    why: "The live sync account signs in every cycle; one that is disabled or idle for weeks belongs to a server that was removed or rebuilt, or to an engine that moved to application-based authentication - a leftover account with directory-write rights."
    fix: "Confirm no running server uses the account (the account name carries the server name); on a server that moved to application-based authentication remove it with Remove-ADSyncAADServiceAccount, otherwise delete it."
    refs: ["NIST-800-53:AC-2(3)", "CIS-Controls-v8:5.3"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, onPremisesSyncEnabled, onPremisesSecurityIdentifier, signInActivity, assignedLicenses, mail, onPremisesSamAccountName, displayName, givenName, surname, department, jobTitle, usageLocation, onPremisesDomainName, onPremisesUserPrincipalName, proxyAddresses, passwordPolicies]
      top: 500
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: userPrincipalName, op: match, value: '^Sync_', threshold: entra-connect.sync-account-pattern }
        - any:
            - { field: accountEnabled, op: eq, value: false }
            - { field: signInActivity.lastSuccessfulSignInDateTime, op: absent }
            - { field: signInActivity.lastSuccessfulSignInDateTime, op: age-gt, value: 30, threshold: entra-connect.sync-account-idle-days }
    evidence: "{userPrincipalName}: enabled {accountEnabled}, last successful sign-in {signInActivity.lastSuccessfulSignInDateTime} (created {createdDateTime})"

  # ---------------------------------------------------------------- managers (own user query) ---
  - id: M365-USER-NO-MANAGER
    title: Enabled member account has no manager
    kind: missing
    category: HYG
    severity: low
    entity: user
    lens: maintenance
    why: "OneDrive hand-over at leaving, access-review routing, approval flows and lifecycle workflows all key on the manager attribute; an account without one is skipped by all of them. Accounts matching the service-account pattern are left out."
    fix: "Populate the manager in the source directory (HR feed or AD); exclude service and resource accounts by naming them to the pattern."
    refs: ["NIST-800-53:PS-4", "NIST-800-53:AC-2(1)"]
    query:
      protocol: graph
      path: /users
      filter: "accountEnabled eq true and userType eq 'Member'"
      select: [id, userPrincipalName, displayName, accountEnabled, createdDateTime, onPremisesSyncEnabled]
      expand: manager
      key: id
      name: userPrincipalName
    each:
      all:
        - { field: manager, op: absent }
        - any:
            - { field: createdDateTime, op: absent }
            - { field: createdDateTime, op: age-gt, value: 30, threshold: entra.attr-grace-days }
        - { field: userPrincipalName, op: notmatch, value: '^(svc|srv|sa|mbx|room|shared|sync)[-_.]', threshold: entra.service-account-upn-pattern }
        - { field: userPrincipalName, op: notmatch, value: '^Sync_', threshold: entra-connect.sync-account-pattern }
    evidence: "{userPrincipalName}: no manager (created {createdDateTime})"

  # ----------------------------------------------------------- deleted users (restore window) ---
  - id: ENTRA-USER-DELETED-RECENT
    title: User deleted in the last week
    kind: misconfigured
    category: BCK
    severity: info
    entity: user
    lens: maintenance
    why: "A deleted user can be restored with its licences, group memberships and app assignments for 30 days; a daily look at recent deletions catches a mistaken one while it is still cheap to undo."
    fix: "Confirm each deletion with whoever made it; restore the ones that were mistakes."
    refs: ["NIST-800-53:CP-9", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /directory/deletedItems/microsoft.graph.user
      select: [id, userPrincipalName, displayName, deletedDateTime, assignedLicenses]
      key: id
      name: userPrincipalName
    each: { field: deletedDateTime, op: age-lt, value: 7, threshold: entra.deleted-review-days }
    evidence: "{userPrincipalName} ({displayName}) deleted {deletedDateTime}, licences at deletion {assignedLicenses[].skuId}"

  - id: ENTRA-USER-DELETED-PURGE-SOON
    title: Deleted user is about to be purged for good
    kind: broken
    category: BCK
    severity:
      daysLeft: deletedDateTime
      ranges: [ { max: -27, value: high } ]
      default: medium
    entity: user
    lens: maintenance
    why: "Thirty days after deletion the account is purged, and with it the mailbox (unless held) and, after its own retention, the OneDrive. This is the last moment to restore a leaver whose deletion was a mistake or whose mail and files were never preserved. The rule fires from day 23 (threshold) and turns high from day 27; the purge date is 30 days after the deletion date shown."
    fix: "Restore the user if the mailbox or OneDrive must be kept, convert or hold the mailbox and hand the OneDrive over, then delete again; otherwise record the decision."
    refs: ["NIST-800-53:CP-9", "NIST-800-53:AU-11", "NIST-800-53:PS-4", "CIS-Controls-v8:11.2"]
    query:
      protocol: graph
      path: /directory/deletedItems/microsoft.graph.user
      select: [id, userPrincipalName, displayName, deletedDateTime, assignedLicenses]
      key: id
      name: userPrincipalName
    each: { field: deletedDateTime, op: age-gt, value: 23, threshold: entra.deleted-user-warn-after-days }
    evidence: "{userPrincipalName} ({displayName}) deleted {deletedDateTime}, purged 30 days later; licences at deletion {assignedLicenses[].skuId}"

  - id: ENTRA-USER-PER-USER-MFA-ENABLED
    title: Member account still uses legacy per-user MFA
    kind: misconfigured
    category: AUT
    severity: low
    entity: user
    why: "Per-user MFA (enabled or enforced) is the legacy mechanism: it prompts outside Conditional Access logic, cannot use authentication strengths and keeps app passwords alive; the benchmark wants it off for everyone once Conditional Access enforces MFA. One request per enabled member (at most 2000 per scan, weekly; larger tenants get a partial result); beta API."
    fix: "Once Conditional Access requires MFA, set the per-user MFA state of every account to disabled, in batches, and remove app passwords."
    refs: [CIS-M365:5.1.2.1, "NIST-800-53:IA-2(1)"]
    refresh: 7d
    query:
      protocol: graph
      version: beta
      path: /users/{id}/authentication/requirements
      for_each:
        path: /users
        filter: "accountEnabled eq true and userType eq 'Member'"
        select: [id, userPrincipalName]
        field: id
        max: 2000
      key: "{parent.id}"
      name: parent.userPrincipalName
    each: { field: perUserMfaState, op: in, value: [enabled, enforced] }
    evidence: "{parent.userPrincipalName}: per-user MFA {perUserMfaState}"

  - id: M365-USER-SERVICE-PROVISIONING-ERROR
    title: User has an unresolved service provisioning error
    kind: broken
    category: HLT
    severity: medium
    entity: user
    lens: maintenance
    why: "A workload such as Exchange Online reported that it could not provision the user (a duplicate proxy address, an invalid attribute); until the source attribute is fixed the mailbox is not created or not updated. ENTRA-SYNC-PROVISIONING-ERROR sees directory-sync errors only, not these."
    fix: "Correct the attribute named in the error at its source (on-premises AD for synchronised users, Entra for cloud users) and wait one sync cycle."
    refs: ["NIST-800-53:CM-8", "NIST-800-53:SI-10"]
    query:
      protocol: graph
      path: /users
      select: [id, userPrincipalName, accountEnabled, userType, createdDateTime, assignedLicenses, licenseAssignmentStates, onPremisesSyncEnabled, onPremisesDistinguishedName, onPremisesProvisioningErrors, passwordPolicies, lastPasswordChangeDateTime, externalUserState, externalUserStateChangeDateTime, serviceProvisioningErrors]
      top: 999
      key: id
      name: userPrincipalName
    each: { field: 'serviceProvisioningErrors[].isResolved', op: eq, value: false }
    evidence: "{userPrincipalName}: {serviceProvisioningErrors[].serviceInstance} error since {serviceProvisioningErrors[].createdDateTime}"

  # ============================================================ applications and secrets ===
  - id: ENTRA-APP-SECRET-EXPIRY
    title: App registration client secret expires soon or has expired
    kind: broken
    category: PKI
    severity:
      daysLeft: passwordCredentials[].endDateTime
      ranges: [ { max: 0, value: critical }, { max: 14, value: high }, { max: 30, value: medium } ]
      default: low
    deadline: passwordCredentials[].endDateTime
    entity: application
    lens: both
    why: "When a client secret expires, every integration that uses it stops authenticating, usually silently and at night. Severity and deadline follow the first secret listed; the evidence lists every secret's end date."
    fix: "Add the new secret (or better, a certificate or federated credential), update the consuming system, then delete the old secret - including expired ones still listed."
    refs: ["NIST-800-53:IA-5", "NIST-800-53:CP-2"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, signInAudience, createdDateTime, passwordCredentials, keyCredentials, web, spa, isFallbackPublicClient, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: passwordCredentials, op: notempty }
        - { field: 'passwordCredentials[].endDateTime', op: until-lt, value: 45, threshold: entra.app-credential-notice-days }
    evidence: "{displayName} (appId {appId}): client secret end dates {passwordCredentials[].endDateTime}"

  - id: ENTRA-APP-CERT-EXPIRY
    title: App registration certificate expires soon or has expired
    kind: broken
    category: PKI
    severity:
      daysLeft: keyCredentials[].endDateTime
      ranges: [ { max: 0, value: critical }, { max: 14, value: high }, { max: 30, value: medium } ]
      default: low
    deadline: keyCredentials[].endDateTime
    entity: application
    lens: both
    why: "An expired certificate credential breaks the app's sign-in exactly like an expired secret. Severity and deadline follow the first certificate listed; the evidence lists every end date."
    fix: "Upload the renewed certificate, switch the consuming system to it, then remove the old one."
    refs: ["NIST-800-53:IA-5(2)", "NIST-800-53:SC-17"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, signInAudience, createdDateTime, passwordCredentials, keyCredentials, web, spa, isFallbackPublicClient, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: keyCredentials, op: notempty }
        - { field: 'keyCredentials[].endDateTime', op: until-lt, value: 45, threshold: entra.app-credential-notice-days }
    evidence: "{displayName} (appId {appId}): certificate end dates {keyCredentials[].endDateTime}"

  - id: ENTRA-APP-CREDENTIALS-ALL-EXPIRED
    title: Every credential of an app registration has expired
    kind: broken
    category: PKI
    severity: high
    entity: application
    lens: both
    why: "An app whose secrets and certificates are all past their end date can no longer authenticate: whatever depends on it is already broken, or the app is unused and should go."
    fix: "Confirm with the owner whether the app is still used; renew the credential or delete the app registration."
    refs: ["NIST-800-53:IA-5", "NIST-800-53:CM-8"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, signInAudience, createdDateTime, passwordCredentials, keyCredentials, web, spa, isFallbackPublicClient, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - any:
            - { field: passwordCredentials, op: notempty }
            - { field: keyCredentials, op: notempty }
        - any:
            - { field: passwordCredentials, op: empty }
            - not: { field: 'passwordCredentials[].endDateTime', op: age-lt, value: 0 }
        - any:
            - { field: keyCredentials, op: empty }
            - not: { field: 'keyCredentials[].endDateTime', op: age-lt, value: 0 }
    evidence: "{displayName} (appId {appId}): secrets end {passwordCredentials[].endDateTime}; certificates end {keyCredentials[].endDateTime}"

  - id: ENTRA-APP-NO-OWNER
    title: App registration has no owner
    kind: missing
    category: HYG
    severity: low
    entity: application
    lens: both
    why: "Without an owner nobody rotates the credentials, answers when it breaks, or retires the app when it is no longer used."
    fix: "Assign at least two owners (a person and a team account) who are responsible for the app."
    refs: ["NIST-800-53:CM-8(4)", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /applications
      filter: "owners/$count eq 0"
      consistency: eventual
      select: [id, appId, displayName, createdDateTime]
      key: id
      name: displayName
    each: any
    evidence: "{displayName} (appId {appId}, created {createdDateTime}) has no owner"

  - id: ENTRA-APP-MULTITENANT
    title: App registration accepts sign-ins from other tenants or personal accounts
    kind: misconfigured
    category: IAM
    severity:
      field: signInAudience
      map: { AzureADMultipleOrgs: low, AzureADandPersonalMicrosoftAccount: medium, PersonalMicrosoftAccount: medium }
      default: low
    entity: application
    why: "A multi-tenant or personal-account app can be consented into other tenants and used by identities you do not govern; for an internal app that is rarely intended."
    fix: "Set signInAudience to AzureADMyOrg unless the app is deliberately published to other organisations; record the ones that are."
    refs: ["NIST-800-53:AC-3", "NIST-800-53:CM-7"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, signInAudience, createdDateTime, passwordCredentials, keyCredentials, web, spa, isFallbackPublicClient, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each: { field: signInAudience, op: ne, value: AzureADMyOrg }
    evidence: "{displayName} (appId {appId}): signInAudience {signInAudience}"

  - id: ENTRA-APP-IMPLICIT-GRANT
    title: App registration issues access tokens through the implicit flow
    kind: misconfigured
    category: AUT
    severity: medium
    entity: application
    why: "The implicit flow returns tokens in the browser URL, where history, logs and referrers can leak them."
    fix: "Move the app to the authorization-code flow with PKCE and clear implicit access-token issuance."
    refs: ["NIST-800-53:SC-8", "NIST-800-53:SC-23"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, signInAudience, createdDateTime, passwordCredentials, keyCredentials, web, spa, isFallbackPublicClient, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each: { field: web.implicitGrantSettings.enableAccessTokenIssuance, op: eq, value: true }
    evidence: "{displayName} (appId {appId}): implicit access-token issuance on"

  - id: ENTRA-APP-PUBLIC-CLIENT-FLOWS
    title: App registration allows public-client flows
    kind: misconfigured
    category: AUT
    severity: low
    entity: application
    why: "Public-client flows allow password (ROPC) and device-code sign-in for the app, both of which bypass phishing-resistant MFA; they are needed only by native or headless clients."
    fix: "Turn off 'Allow public client flows' unless the app is a native client by design."
    refs: ["NIST-800-53:IA-2"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, signInAudience, createdDateTime, passwordCredentials, keyCredentials, web, spa, isFallbackPublicClient, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each: { field: isFallbackPublicClient, op: eq, value: true }
    evidence: "{displayName} (appId {appId}): public client flows allowed"

  - id: ENTRA-APP-REDIRECT-INSECURE-WEB
    title: Web redirect URI uses plain HTTP or a wildcard
    kind: misconfigured
    category: AUT
    severity: medium
    entity: application
    why: "Authorization codes and tokens sent to an http:// or wildcard redirect URI can be intercepted or steered to an attacker's host."
    fix: "Use exact https:// redirect URIs (plain http only for localhost during development)."
    refs: ["NIST-800-53:SC-8", "NIST-800-53:SC-23"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, signInAudience, createdDateTime, passwordCredentials, keyCredentials, web, spa, isFallbackPublicClient, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each: { field: web.redirectUris, op: match, value: '^http://(?!(localhost|127\.0\.0\.1|\[::1\])([:/]|$))|\*' }
    evidence: "{displayName} (appId {appId}): web redirect URIs {web.redirectUris}"

  - id: ENTRA-APP-REDIRECT-INSECURE-SPA
    title: Single-page-app redirect URI uses plain HTTP or a wildcard
    kind: misconfigured
    category: AUT
    severity: medium
    entity: application
    why: "Same exposure as for web redirects: codes delivered to an insecure or wildcard URI can be captured."
    fix: "Use exact https:// redirect URIs for the single-page app."
    refs: ["NIST-800-53:SC-8", "NIST-800-53:SC-23"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, signInAudience, createdDateTime, passwordCredentials, keyCredentials, web, spa, isFallbackPublicClient, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each: { field: spa.redirectUris, op: match, value: '^http://(?!(localhost|127\.0\.0\.1|\[::1\])([:/]|$))|\*' }
    evidence: "{displayName} (appId {appId}): SPA redirect URIs {spa.redirectUris}"

  - id: ENTRA-APP-DISABLED-BY-MICROSOFT
    title: App registration disabled by Microsoft for a terms violation
    kind: broken
    category: IAM
    severity: high
    entity: application
    why: "Microsoft disables apps it sees used for abuse (phishing, spam, malicious consent); an app of yours in that state is either compromised or was created by an attacker in your tenant."
    fix: "Investigate who created and used the app, review its sign-ins and grants, then delete it."
    refs: ["NIST-800-53:IR-4"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, signInAudience, createdDateTime, passwordCredentials, keyCredentials, web, spa, isFallbackPublicClient, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each: { field: disabledByMicrosoftStatus, op: eq, value: DisabledDueToViolationOfServicesAgreement }
    evidence: "{displayName} (appId {appId}): {disabledByMicrosoftStatus}"

  - id: ENTRA-APP-SECRET-LONG-LIVED
    title: App registration holds a client secret valid for more than two years
    kind: misconfigured
    category: PKI
    severity: medium
    entity: application
    why: "A secret whose end date is years away will not be rotated: it outlives the project, its owner and the people who know where it is stored. The rule fires when any secret ends more than 730 days from today (or never). The threshold is an age in days and therefore negative: -730 means 'ends more than 730 days ahead'."
    fix: "Replace the secret with a certificate or a federated credential; otherwise recreate it with a lifetime of 180 days or less, update the consumer, delete the old one, and cap lifetimes with the app management policy (ENTRA-APPPOLICY-NO-SECRET-LIFETIME)."
    refs: [CIS-M365:5.1.5.4, "NIST-800-53:IA-5(1)", "MITRE-ATTACK:T1098.001"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, signInAudience, createdDateTime, passwordCredentials, keyCredentials, web, spa, isFallbackPublicClient, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: passwordCredentials, op: notempty }
        - { field: 'passwordCredentials[].endDateTime', op: age-lt, value: -730, threshold: entra.secret-long-lived-age-days }
    evidence: "{displayName} (appId {appId}): client secret end dates {passwordCredentials[].endDateTime}"

  - id: ENTRA-APP-MANY-SECRETS
    title: App registration carries more client secrets than rotation needs
    kind: misconfigured
    category: HYG
    severity: low
    entity: application
    lens: both
    why: "Two secrets cover a rotation (current and next). More means nobody knows which system uses which, and an extra secret is exactly what an attacker adds to keep access. Expired secrets count too: they should have been deleted."
    fix: "Find the consumer of each secret, keep at most two, and delete the rest (expired ones first)."
    refs: ["MITRE-ATTACK:T1098.001", "NIST-800-53:IA-5"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, signInAudience, createdDateTime, passwordCredentials, keyCredentials, web, spa, isFallbackPublicClient, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each: { field: passwordCredentials, op: size-gt, value: 2, threshold: entra.app-max-secrets }
    evidence: "{displayName} (appId {appId}): secrets {passwordCredentials[].displayName} ending {passwordCredentials[].endDateTime}"

  - id: ENTRA-APP-TIER0-REQUESTED-WITH-OWNERS
    title: App registration that requests a tenant-takeover permission has owners
    kind: misconfigured
    category: IAM
    severity: high
    entity: application
    why: "An owner of an app registration can add a credential and then act with everything the app has been granted. When the app requests a takeover-capable Microsoft Graph application permission, each owner is in effect a tier-0 administrator who appears in no admin role review. Requested is not granted: ENTRA-APPPERM-TIER0 shows the grants."
    fix: "Remove human owners from tier-0 apps and manage them through a PIM-held Application Administrator role, or keep owners few, named, on admin accounts and reviewed."
    refs: ["MITRE-ATTACK:T1098.001", "NIST-800-53:AC-6(5)", "CIS-Controls-v8:6.8"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, requiredResourceAccess]
      expand: owners($select=id,userPrincipalName,accountEnabled,userType)
      key: id
      name: displayName
    each:
      all:
        - { field: owners, op: notempty }
        - field: 'requiredResourceAccess[].resourceAccess[].id'
          op: in
          threshold: entra.graph-tier0-app-role-ids
          value: [9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8, 06b708a9-e830-4db3-a914-8e69da51d44f, 1bfefb4e-e0b5-418b-a88f-73c46d2cc8e9, 19dbc75e-c2e2-444c-a770-ec69d8559fc7, 01c0a623-fc9b-48e9-b794-0756f8e8f067, 29c18626-4985-4dcd-85c0-193eef327366, a402ca1c-2696-4531-972d-6e5ee4aa11ea, 50483e42-d915-4231-9639-7fdb7fd190e5, 8e8e4742-1d95-4f68-9d56-6ee75648c72a, 7e05723c-0bb0-42da-be95-ae9f08a6e53c, 292d869f-3427-49a8-9dab-8c70152b74e9, e330c4f0-4170-414e-a55a-2f022ec2b57b]
    evidence: "{displayName} (appId {appId}): owners {owners[].userPrincipalName} {owners[].id}"

  - id: ENTRA-APP-OWNER-DISABLED-OR-GUEST
    title: App registration is owned by a disabled account or a guest
    kind: misconfigured
    category: IAM
    severity: medium
    entity: application
    why: "Owning an app registration is the right to add credentials to it. A disabled owner is a leaver who keeps that right the moment the account is re-enabled; a guest owner is an outsider who keeps it. Inactive owners need the sign-in join (backlog)."
    fix: "Replace the owner with a current member account (two owners per app), and make owner removal part of the leaver process."
    refs: ["NIST-800-53:AC-2(3)", "NIST-800-53:AC-2(9)", "MITRE-ATTACK:T1098.001"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, requiredResourceAccess]
      expand: owners($select=id,userPrincipalName,accountEnabled,userType)
      key: id
      name: displayName
    each:
      any:
        - { field: 'owners[].accountEnabled', op: eq, value: false }
        - { field: 'owners[].userType', op: eq, value: Guest }
    evidence: "{displayName} (appId {appId}): owners {owners[].userPrincipalName}, enabled {owners[].accountEnabled}, type {owners[].userType}"

  - id: ENTRA-APP-FEDERATED-CREDENTIAL-EXTERNAL
    title: App registration trusts tokens from an external identity provider
    kind: misconfigured
    category: PKI
    severity: medium
    entity: application
    why: "A federated identity credential lets an outside issuer (a CI/CD platform, another cloud, any OIDC provider) sign in as the app without a secret. It never expires and the app management policy does not cap it, so each one must be a known, exact trust. Entra's own issuers are allowed by the default pattern."
    fix: "Keep the issuer, subject and audience exact (one repository and one branch or environment); delete credentials of pipelines no longer in use and record the owner of the rest."
    refs: ["MITRE-ATTACK:T1098.001", "NIST-800-53:IA-5", "NIST-800-53:AC-20"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName]
      expand: federatedIdentityCredentials
      key: id
      name: displayName
    each:
      all:
        - { field: federatedIdentityCredentials, op: notempty }
        - { field: 'federatedIdentityCredentials[].issuer', op: notmatch, value: '^https://(login\.microsoftonline\.com|sts\.windows\.net)/', threshold: entra.federated-issuer-allow-pattern }
    evidence: "{displayName} (appId {appId}): trusts issuers {federatedIdentityCredentials[].issuer} for subjects {federatedIdentityCredentials[].subject}"

  - id: ENTRA-APP-FEDERATED-CREDENTIAL-BROAD-SUBJECT
    title: Federated credential trusts a broad subject such as any pull request
    kind: misconfigured
    category: PKI
    severity: high
    entity: application
    why: "A subject that ends in pull_request (GitHub Actions) or carries a wildcard lets every pull-request run of the repository, or every matching workload, sign in as the app - without anyone reviewing the code first."
    fix: "Bind the credential to a protected branch, tag or deployment environment with required reviewers instead of pull requests; remove wildcard subjects."
    refs: ["MITRE-ATTACK:T1195.002", "MITRE-ATTACK:T1098.001", "NIST-800-53:IA-5"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName]
      expand: federatedIdentityCredentials
      key: id
      name: displayName
    each:
      all:
        - { field: federatedIdentityCredentials, op: notempty }
        - { field: 'federatedIdentityCredentials[].subject', op: match, value: '(\*|:pull_request$)', threshold: entra.federated-subject-broad-pattern }
    evidence: "{displayName} (appId {appId}): subjects {federatedIdentityCredentials[].subject} from {federatedIdentityCredentials[].issuer}"

  - id: ENTRA-APP-USES-CLIENT-SECRET
    title: App registration authenticates with a client secret
    kind: misconfigured
    category: PKI
    severity: low
    entity: application
    why: "Client secrets get copied into config files, scripts and pipelines and leak with them; certificates, managed identities and federated credentials do not. A hygiene list, below the long-lived and many-secrets rules in priority: every app on it is a candidate to move off secrets."
    fix: "Replace the secret with a certificate, a managed identity or a federated credential, then delete the secret."
    refs: ["NIST-800-53:IA-5", "CIS-Controls-v8:4.1", "MITRE-ATTACK:T1552.001"]
    query:
      protocol: graph
      path: /applications
      select: [id, appId, displayName, signInAudience, createdDateTime, passwordCredentials, keyCredentials, web, spa, isFallbackPublicClient, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each: { field: passwordCredentials, op: notempty }
    evidence: "{displayName} (appId {appId}): secrets {passwordCredentials[].displayName} ending {passwordCredentials[].endDateTime}"

  # ===================================================== enterprise apps (service principals) ===
  - id: ENTRA-SP-SAML-CERT-EXPIRY
    title: SAML signing certificate of an enterprise app expires soon
    kind: broken
    category: PKI
    severity:
      daysLeft: keyCredentials[].endDateTime
      ranges: [ { max: 0, value: critical }, { max: 14, value: high }, { max: 30, value: medium } ]
      default: low
    deadline: keyCredentials[].endDateTime
    entity: service-principal
    lens: both
    why: "When the token-signing certificate of a SAML app expires, single sign-on to that app stops for everyone; the vendor side usually needs the new certificate in advance. Severity and deadline follow the first certificate listed."
    fix: "Create the new signing certificate, send the metadata to the vendor, activate it before the old one ends, then remove the old one."
    refs: ["NIST-800-53:SC-17", "NIST-800-53:CP-2"]
    query:
      protocol: graph
      path: /servicePrincipals
      select: [id, appId, displayName, accountEnabled, servicePrincipalType, appOwnerOrganizationId, preferredSingleSignOnMode, passwordCredentials, keyCredentials, appRoleAssignmentRequired, notificationEmailAddresses, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: preferredSingleSignOnMode, op: eq, value: saml }
        - { field: accountEnabled, op: eq, value: true }
        - { field: keyCredentials, op: notempty }
        - { field: 'keyCredentials[].endDateTime', op: until-lt, value: 60, threshold: entra.saml-cert-notice-days }
    evidence: "{displayName}: signing certificate end dates {keyCredentials[].endDateTime}"

  - id: ENTRA-SP-SAML-CERT-ALL-EXPIRED
    title: Every SAML signing certificate of an enterprise app has expired
    kind: broken
    category: PKI
    severity: high
    entity: service-principal
    lens: both
    why: "With no valid signing certificate the app's single sign-on is already failing, or the app is not used any more."
    fix: "Renew the certificate with the vendor, or disable and delete the enterprise app if it is no longer used."
    refs: ["NIST-800-53:SC-17"]
    query:
      protocol: graph
      path: /servicePrincipals
      select: [id, appId, displayName, accountEnabled, servicePrincipalType, appOwnerOrganizationId, preferredSingleSignOnMode, passwordCredentials, keyCredentials, appRoleAssignmentRequired, notificationEmailAddresses, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: preferredSingleSignOnMode, op: eq, value: saml }
        - { field: accountEnabled, op: eq, value: true }
        - { field: keyCredentials, op: notempty }
        - not: { field: 'keyCredentials[].endDateTime', op: age-lt, value: 0 }
    evidence: "{displayName}: all signing certificates ended ({keyCredentials[].endDateTime})"

  - id: ENTRA-SP-SAML-NO-NOTIFICATION
    title: SAML enterprise app sends certificate expiry mail to nobody
    kind: missing
    category: MON
    severity: low
    entity: service-principal
    lens: maintenance
    why: "Entra mails a warning before a SAML signing certificate expires, but only to the addresses configured on the app."
    fix: "Add a monitored team mailbox to the app's certificate notification addresses."
    refs: ["NIST-800-53:SI-5"]
    query:
      protocol: graph
      path: /servicePrincipals
      select: [id, appId, displayName, accountEnabled, servicePrincipalType, appOwnerOrganizationId, preferredSingleSignOnMode, passwordCredentials, keyCredentials, appRoleAssignmentRequired, notificationEmailAddresses, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: preferredSingleSignOnMode, op: eq, value: saml }
        - { field: accountEnabled, op: eq, value: true }
        - { field: notificationEmailAddresses, op: empty }
    evidence: "{displayName}: no certificate notification address"

  - id: ENTRA-SP-SECRET-EXPIRY
    title: Enterprise app (service principal) secret expires soon or has expired
    kind: broken
    category: PKI
    severity:
      daysLeft: passwordCredentials[].endDateTime
      ranges: [ { max: 0, value: critical }, { max: 14, value: high }, { max: 30, value: medium } ]
      default: low
    deadline: passwordCredentials[].endDateTime
    entity: service-principal
    lens: both
    why: "Secrets added directly to a service principal do not show in the app registration blade and are easily forgotten until the integration breaks. Severity and deadline follow the first secret listed."
    fix: "Rotate the secret on the consuming system before the end date (or move to a certificate), then remove the old secret."
    refs: ["NIST-800-53:IA-5", "NIST-800-53:CP-2"]
    query:
      protocol: graph
      path: /servicePrincipals
      select: [id, appId, displayName, accountEnabled, servicePrincipalType, appOwnerOrganizationId, preferredSingleSignOnMode, passwordCredentials, keyCredentials, appRoleAssignmentRequired, notificationEmailAddresses, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - any:
            - { field: preferredSingleSignOnMode, op: absent }
            - { field: preferredSingleSignOnMode, op: ne, value: saml }
        - { field: passwordCredentials, op: notempty }
        - { field: 'passwordCredentials[].endDateTime', op: until-lt, value: 45, threshold: entra.app-credential-notice-days }
    evidence: "{displayName} (appId {appId}): secret end dates {passwordCredentials[].endDateTime}"

  - id: ENTRA-SP-SSO-NO-ASSIGNMENT
    title: Single-sign-on enterprise app does not require assignment
    kind: misconfigured
    category: IAM
    severity: medium
    entity: service-principal
    why: "Without 'assignment required' every account in the tenant, guests included, can sign in to the app and is provisioned into it on first use."
    fix: "Turn on assignment required and assign the groups that should have the app."
    refs: ["NIST-800-53:AC-3", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /servicePrincipals
      select: [id, appId, displayName, accountEnabled, servicePrincipalType, appOwnerOrganizationId, preferredSingleSignOnMode, passwordCredentials, keyCredentials, appRoleAssignmentRequired, notificationEmailAddresses, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: preferredSingleSignOnMode, op: in, value: [saml, password, oidc] }
        - { field: accountEnabled, op: eq, value: true }
        - { field: appRoleAssignmentRequired, op: eq, value: false }
    evidence: "{displayName}: {preferredSingleSignOnMode} SSO, assignment not required"

  - id: ENTRA-SP-DISABLED-BY-MICROSOFT
    title: Enterprise app disabled by Microsoft for a terms violation
    kind: broken
    category: IAM
    severity: high
    entity: service-principal
    why: "A service principal whose application Microsoft disabled for abuse still sits in the tenant with whatever permissions it was granted."
    fix: "Review what the app was granted and who consented, revoke the grants and delete the service principal."
    refs: ["NIST-800-53:IR-4"]
    query:
      protocol: graph
      path: /servicePrincipals
      select: [id, appId, displayName, accountEnabled, servicePrincipalType, appOwnerOrganizationId, preferredSingleSignOnMode, passwordCredentials, keyCredentials, appRoleAssignmentRequired, notificationEmailAddresses, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each: { field: disabledByMicrosoftStatus, op: eq, value: DisabledDueToViolationOfServicesAgreement }
    evidence: "{displayName} (appId {appId}): {disabledByMicrosoftStatus}"

  # Microsoft's own tenants (appOwnerOrganizationId of first-party apps), Microsoft constants:
  #   f8cdef31-a31e-4b4a-93e4-5f571e91255a Microsoft Services
  #   72f988bf-86f1-41af-91ab-2d7cd011db47 Microsoft
  - id: ENTRA-SP-FIRST-PARTY-CREDENTIAL
    title: Credential added to the service principal of a Microsoft application
    kind: misconfigured
    category: IAM
    severity: critical
    entity: service-principal
    why: "Microsoft's first-party applications authenticate with Microsoft's own keys; a secret or certificate added in this tenant to one of their service principals lets whoever holds it sign in as that Microsoft app, with every permission the tenant already granted it, under a trusted name. It is a known persistence technique after a breach. Exchange hybrid's classic OAuth adds a certificate to the Exchange Online service principal: confirm such a case against the hybrid setup and move to the dedicated Exchange hybrid app."
    fix: "Treat it as an incident until explained: find who added it (directory audit 'Update service principal' / 'Add service principal credentials'), remove the credential, revoke the app's sessions, and review that app's sign-ins and the data it reached."
    refs: ["MITRE-ATTACK:T1098.001", "NIST-800-53:IA-5", "NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /servicePrincipals
      select: [id, appId, displayName, accountEnabled, servicePrincipalType, appOwnerOrganizationId, preferredSingleSignOnMode, passwordCredentials, keyCredentials, appRoleAssignmentRequired, notificationEmailAddresses, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - field: appOwnerOrganizationId
          op: in
          threshold: entra.first-party-tenant-ids
          value: [f8cdef31-a31e-4b4a-93e4-5f571e91255a, 72f988bf-86f1-41af-91ab-2d7cd011db47]
        - any:
            - { field: passwordCredentials, op: notempty }
            - { field: keyCredentials, op: notempty }
    evidence: "{displayName} (appId {appId}): secrets ending {passwordCredentials[].endDateTime}; certificates ending {keyCredentials[].endDateTime}"

  - id: ENTRA-SP-SECRET-LONG-LIVED
    title: Enterprise app (service principal) secret valid for more than two years
    kind: misconfigured
    category: PKI
    severity: medium
    entity: service-principal
    why: "Secrets added straight to a service principal do not show on the app registration and are rotated even less often. The rule fires when any secret ends more than 730 days from today (or never); SAML apps are left out because their signing keys carry a paired password entry. The threshold is a negative age in days."
    fix: "Move the consumer to a certificate or federated credential, or recreate the secret with a short lifetime and delete the old one."
    refs: [CIS-M365:5.1.5.4, "NIST-800-53:IA-5(1)", "MITRE-ATTACK:T1098.001"]
    query:
      protocol: graph
      path: /servicePrincipals
      select: [id, appId, displayName, accountEnabled, servicePrincipalType, appOwnerOrganizationId, preferredSingleSignOnMode, passwordCredentials, keyCredentials, appRoleAssignmentRequired, notificationEmailAddresses, disabledByMicrosoftStatus]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - any:
            - { field: preferredSingleSignOnMode, op: absent }
            - { field: preferredSingleSignOnMode, op: ne, value: saml }
        - { field: passwordCredentials, op: notempty }
        - { field: 'passwordCredentials[].endDateTime', op: age-lt, value: -730, threshold: entra.secret-long-lived-age-days }
    evidence: "{displayName} (appId {appId}): secret end dates {passwordCredentials[].endDateTime}"

  - id: ENTRA-SP-RISKY
    title: Workload identity flagged as risky and left unremediated
    kind: broken
    category: IAM
    severity:
      field: riskLevel
      map: { high: high, medium: medium }
      default: medium
    entity: service-principal
    why: "Identity Protection flags service principals with leaked credentials, anomalous sign-ins or suspicious changes. A risky workload identity has no MFA prompt to stop the attacker; until someone confirms or dismisses the risk, assume the credential is in use by someone else. Needs Workload Identities Premium."
    fix: "Rotate every credential of the app, review its recent sign-ins, grants and changes, then confirm compromised or dismiss the risk in Identity Protection."
    refs: ["MITRE-ATTACK:T1078.004", "NIST-800-53:IR-4", "NIST-800-53:SI-4"]
    query:
      protocol: graph
      path: /identityProtection/riskyServicePrincipals
      select: [id, appId, displayName, servicePrincipalType, isEnabled, riskState, riskLevel, riskDetail, riskLastUpdatedDateTime]
      key: id
      name: displayName
    each:
      all:
        - { field: riskState, op: in, value: [atRisk, confirmedCompromised] }
        - { field: riskLevel, op: in, value: [high, medium] }
    evidence: "{displayName} (appId {appId}): {riskLevel} risk, {riskState} since {riskLastUpdatedDateTime} ({riskDetail})"

  # Microsoft Graph application permission (app role) ids, Microsoft constants:
  #   9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8 RoleManagement.ReadWrite.Directory
  #   06b708a9-e830-4db3-a914-8e69da51d44f AppRoleAssignment.ReadWrite.All
  #   1bfefb4e-e0b5-418b-a88f-73c46d2cc8e9 Application.ReadWrite.All
  #   19dbc75e-c2e2-444c-a770-ec69d8559fc7 Directory.ReadWrite.All
  #   01c0a623-fc9b-48e9-b794-0756f8e8f067 Policy.ReadWrite.ConditionalAccess
  #   29c18626-4985-4dcd-85c0-193eef327366 Policy.ReadWrite.AuthenticationMethod
  #   a402ca1c-2696-4531-972d-6e5ee4aa11ea Policy.ReadWrite.PermissionGrant
  #   50483e42-d915-4231-9639-7fdb7fd190e5 UserAuthenticationMethod.ReadWrite.All
  #   8e8e4742-1d95-4f68-9d56-6ee75648c72a DelegatedPermissionGrant.ReadWrite.All
