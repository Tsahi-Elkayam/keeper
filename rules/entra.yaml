    fix: "Create (or switch on) a sign-in risk policy: users All, resources All, sign-in risk High and Medium, grant Require MFA (or Block), sign-in frequency every time."
    refs: [CIS-M365-5.2.2.7, "NIST-800-53:SI-4", "NIST-800-53:IA-2(1)"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    count:
