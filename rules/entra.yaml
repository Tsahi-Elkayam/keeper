  #   62a82d76-70ea-41e2-9197-370581804d09 Group.ReadWrite.All
  #   dbaae8cf-10b5-4b86-a4a1-f871c94c6695 GroupMember.ReadWrite.All
  #   741f803b-c850-494e-b5df-cde7c675a1ca User.ReadWrite.All
  #   e2a3a72e-5f79-4c64-b1b1-878b674786c9 Mail.ReadWrite
  #   810c84a8-4a9e-49e6-bf7d-12d183f40d01 Mail.Read
  #   b633e1c5-b582-4048-a93e-9f11b44c7e96 Mail.Send
  #   6931bccd-447a-43d1-b442-00a195474933 MailboxSettings.ReadWrite
  #   75359482-378d-4052-8f01-80520e7db3cd Files.ReadWrite.All
  #   01d4889c-1287-42c6-ac1f-5d1e02578ef6 Files.Read.All
  #   9492366f-7969-46a4-8d15-ed1a20078fff Sites.ReadWrite.All
  #   a82116e5-55eb-4c41-a434-62fe8a61c773 Sites.FullControl.All
  #   243333ab-4d21-40cb-a475-36241daa0842 DeviceManagementManagedDevices.ReadWrite.All
  #   9241abd9-d0e6-425a-bd4f-47ba86e767a4 DeviceManagementConfiguration.ReadWrite.All
  - id: ENTRA-APPPERM-TIER0
    title: Application holds a tenant-takeover Microsoft Graph permission
    kind: misconfigured
    category: IAM
    severity: high
    entity: app-permission-grant
    why: "These application permissions act without a signed-in user and can grant roles, add credentials to any app, change Conditional Access or reset authentication methods; whoever holds the app's credential effectively owns the tenant."
    fix: "Confirm the owner and the need; replace with the narrowest permission that works, keep the app's credentials in a vault and its owners few; remove grants of apps no longer used."
    refs: ["NIST-800-53:AC-6", "NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /servicePrincipals(appId='00000003-0000-0000-c000-000000000000')/appRoleAssignedTo
      top: 999
      key: id
      name: principalDisplayName
    each:
      all:
        - { field: principalType, op: eq, value: ServicePrincipal }
        - field: appRoleId
          op: in
          threshold: entra.graph-tier0-app-role-ids
          value: [9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8, 06b708a9-e830-4db3-a914-8e69da51d44f, 1bfefb4e-e0b5-418b-a88f-73c46d2cc8e9, 19dbc75e-c2e2-444c-a770-ec69d8559fc7, 01c0a623-fc9b-48e9-b794-0756f8e8f067, 29c18626-4985-4dcd-85c0-193eef327366, a402ca1c-2696-4531-972d-6e5ee4aa11ea, 50483e42-d915-4231-9639-7fdb7fd190e5, 8e8e4742-1d95-4f68-9d56-6ee75648c72a, 7e05723c-0bb0-42da-be95-ae9f08a6e53c, 292d869f-3427-49a8-9dab-8c70152b74e9, e330c4f0-4170-414e-a55a-2f022ec2b57b]
    evidence: "{principalDisplayName} holds Graph application permission {appRoleId} (granted {createdDateTime})"

  - id: ENTRA-APPPERM-DATA
    title: Application holds a tenant-wide data access Microsoft Graph permission
    kind: misconfigured
    category: IAM
    severity: medium
    entity: app-permission-grant
    why: "These application permissions read or change every mailbox, file, site, user, group or managed device in the tenant without a signed-in user; a leaked credential of the app is a tenant-wide data breach."
    fix: "Scope the access (Sites.Selected, Exchange application RBAC, resource-specific consent) or justify it in writing; remove grants of apps no longer used."
    refs: ["NIST-800-53:AC-6", "NIST-800-53:AC-3"]
    query:
      protocol: graph
      path: /servicePrincipals(appId='00000003-0000-0000-c000-000000000000')/appRoleAssignedTo
      top: 999
      key: id
      name: principalDisplayName
    each:
      all:
        - { field: principalType, op: eq, value: ServicePrincipal }
        - field: appRoleId
          op: in
          threshold: entra.graph-data-app-role-ids
          value: [62a82d76-70ea-41e2-9197-370581804d09, dbaae8cf-10b5-4b86-a4a1-f871c94c6695, 741f803b-c850-494e-b5df-cde7c675a1ca, e2a3a72e-5f79-4c64-b1b1-878b674786c9, 810c84a8-4a9e-49e6-bf7d-12d183f40d01, b633e1c5-b582-4048-a93e-9f11b44c7e96, 6931bccd-447a-43d1-b442-00a195474933, 75359482-378d-4052-8f01-80520e7db3cd, 01d4889c-1287-42c6-ac1f-5d1e02578ef6, 9492366f-7969-46a4-8d15-ed1a20078fff, a82116e5-55eb-4c41-a434-62fe8a61c773, 243333ab-4d21-40cb-a475-36241daa0842, 9241abd9-d0e6-425a-bd4f-47ba86e767a4]
    evidence: "{principalDisplayName} holds Graph application permission {appRoleId} (granted {createdDateTime})"

  # Exchange Online (00000002-0000-0ff1-ce00-000000000000) and SharePoint Online
  # (00000003-0000-0ff1-ce00-000000000000) application permission ids, Microsoft constants:
  #   dc890d15-9560-4a4c-9b7f-a736ec74ec40 full_access_as_app (Exchange: every mailbox through EWS)
  #   dc50a0fb-09a3-484d-be87-e023b12c6440 Exchange.ManageAsApp (Exchange admin PowerShell as the app)
  #   678536fe-1083-478a-9c59-b99265e6b0d3 Sites.FullControl.All (SharePoint)
  #   fbcd29d2-fcca-4405-aded-518d457caae4 Sites.ReadWrite.All (SharePoint)
  - id: ENTRA-APPPERM-EXCHANGE-APP-ACCESS
    title: Application holds tenant-wide Exchange Online application access
    kind: misconfigured
    category: IAM
    severity: high
    entity: app-permission-grant
    why: "These Exchange Online application permissions open every mailbox (full_access_as_app through EWS) or run Exchange administration as the app, without a signed-in user. The Graph permission rules do not see them because they sit on the Exchange resource, which is the other door to all mail."
    fix: "Replace full mailbox access with Exchange application RBAC scoped to the mailboxes the app needs, or document the app and lock its owners and credentials down; remove grants of apps no longer used."
    refs: ["MITRE-ATTACK:T1114.002", "MITRE-ATTACK:T1528", "NIST-800-53:AC-6", "NIST-800-53:AC-3"]
    query:
      protocol: graph
      path: /servicePrincipals(appId='00000002-0000-0ff1-ce00-000000000000')/appRoleAssignedTo
      top: 999
      key: id
      name: principalDisplayName
    each:
      all:
        - { field: principalType, op: eq, value: ServicePrincipal }
        - field: appRoleId
          op: in
          threshold: entra.exchange-app-role-ids
          value: [dc890d15-9560-4a4c-9b7f-a736ec74ec40, dc50a0fb-09a3-484d-be87-e023b12c6440]
    evidence: "{principalDisplayName} holds Exchange application permission {appRoleId} (granted {createdDateTime})"

  - id: ENTRA-APPPERM-SHAREPOINT-FULL-CONTROL
    title: Application holds tenant-wide SharePoint Online application access
    kind: misconfigured
    category: IAM
    severity: high
    entity: app-permission-grant
    why: "Full control or read-write over every site, granted on the SharePoint resource rather than on Graph, lets the app read and change all document libraries and OneDrives without a signed-in user; the Graph permission rules do not see it."
    fix: "Move the app to Sites.Selected with per-site grants; remove the grants of apps no longer used."
    refs: ["MITRE-ATTACK:T1530", "NIST-800-53:AC-6", "NIST-800-53:AC-3"]
    query:
      protocol: graph
      path: /servicePrincipals(appId='00000003-0000-0ff1-ce00-000000000000')/appRoleAssignedTo
      top: 999
      key: id
      name: principalDisplayName
    each:
      all:
        - { field: principalType, op: eq, value: ServicePrincipal }
        - field: appRoleId
          op: in
          threshold: entra.sharepoint-app-role-ids
          value: [678536fe-1083-478a-9c59-b99265e6b0d3, fbcd29d2-fcca-4405-aded-518d457caae4]
    evidence: "{principalDisplayName} holds SharePoint application permission {appRoleId} (granted {createdDateTime})"

  - id: ENTRA-CONSENT-TENANT-WIDE-BROAD
    title: Tenant-wide delegated consent with broad write or mail scopes
    kind: misconfigured
    category: IAM
    severity: medium
    entity: consent-grant
    why: "An admin (all-principals) consent lets the app act as any user who signs in to it, within these scopes; broad write and mail scopes make the app a data-exfiltration path."
    fix: "Review the grant: remove it for apps no longer used and reduce the scopes to what the app needs; route future requests through the admin consent workflow."
    refs: ["NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /oauth2PermissionGrants
      filter: "consentType eq 'AllPrincipals'"
      key: id
      name: clientId
    each: { field: scope, op: match, value: '(\.ReadWrite\.All|Mail\.ReadWrite|Mail\.Send|Files\.ReadWrite|Sites\.FullControl|Directory\.AccessAsUser\.All|full_access_as_user|RoleManagement\.ReadWrite|Application\.ReadWrite)', threshold: entra.consent-broad-scope-pattern }
    evidence: "client {clientId} -> resource {resourceId}: {scope}"

  - id: ENTRA-CONSENT-USER-HIGH-RISK
    title: User-consented app reads or sends mail or files
    kind: misconfigured
    category: IAM
    severity: medium
    entity: consent-grant
    why: "A user consent to mail or file scopes is how illicit-consent phishing persists: the app keeps reading the mailbox after the password is reset."
    fix: "Check the app's publisher and use; revoke the grant if the app is not sanctioned and restrict user consent (ENTRA-AUTHZ-USER-CONSENT)."
    refs: ["NIST-800-53:AC-6", "NIST-800-53:IR-4"]
    query:
      protocol: graph
      path: /oauth2PermissionGrants
      filter: "consentType eq 'Principal'"
      key: id
      name: clientId
    each: { field: scope, op: match, value: '(Mail\.ReadWrite|Mail\.Send|Mail\.Read(\s|$)|MailboxSettings\.ReadWrite|Files\.ReadWrite\.All|Files\.Read\.All|Sites\.ReadWrite\.All|Directory\.AccessAsUser\.All|full_access_as_user|EWS\.AccessAsUser\.All)', threshold: entra.consent-user-risky-scope-pattern }
    evidence: "user {principalId}: client {clientId} -> resource {resourceId}: {scope}"

  # ================================================================ tenant app policies ===
  - id: ENTRA-CONSENT-WORKFLOW-OFF
    title: Admin consent request workflow is off
    kind: missing
    category: IAM
    severity: medium
    entity: policy
    why: "With user consent restricted and no request workflow, users either give up or ask an admin to grant consent ad hoc, without a record or a second look."
    fix: "Enable the admin consent workflow with named reviewers and notifications."
    refs: [CIS-M365-5.1.5.2, "NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /policies/adminConsentRequestPolicy
      key: id
    each: { field: isEnabled, op: eq, value: false }
    evidence: "adminConsentRequestPolicy isEnabled = {isEnabled}"

  - id: ENTRA-APPPOLICY-OFF
    title: Tenant-wide app credential restrictions are off
    kind: missing
    category: PKI
    severity: medium
    entity: policy
    why: "The default app management policy is what caps secret lifetimes and blocks caller-chosen passwords on every app; switched off, any owner can add a ten-year secret. Some restrictions need Workload ID Premium."
    fix: "Enable the default app management policy with password lifetime, custom password and certificate lifetime restrictions."
    refs: [CIS-M365-5.1.5.4, "NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /policies/defaultAppManagementPolicy
      key: id
    each: { field: isEnabled, op: eq, value: false }
    evidence: "defaultAppManagementPolicy isEnabled = {isEnabled}"

  - id: ENTRA-APPPOLICY-NO-SECRET-LIFETIME
    title: No tenant-wide cap on client secret lifetime
    kind: missing
    category: PKI
    severity: medium
    entity: policy
    why: "Without a password-lifetime restriction new secrets can be created with lifetimes of years; long-lived secrets leak and are never rotated. Whether the configured maximum is short enough is not checked here (see backlog)."
    fix: "Add a passwordLifetime restriction (for example 180 days) for both applications and service principals."
    refs: [CIS-M365-5.1.5.4, "NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /policies/defaultAppManagementPolicy
      key: id
    each:
      any:
        - { field: applicationRestrictions.passwordCredentials, op: empty }
        - { field: 'applicationRestrictions.passwordCredentials[].restrictionType', op: notcontains, value: passwordLifetime }
        - { field: servicePrincipalRestrictions.passwordCredentials, op: empty }
        - { field: 'servicePrincipalRestrictions.passwordCredentials[].restrictionType', op: notcontains, value: passwordLifetime }
    evidence: "application restrictions {applicationRestrictions.passwordCredentials[].restrictionType}; service principal restrictions {servicePrincipalRestrictions.passwordCredentials[].restrictionType}"

  - id: ENTRA-APPPOLICY-CUSTOM-PASSWORD-ALLOWED
    title: Caller-chosen client secrets are not blocked
    kind: missing
    category: PKI
    severity: low
    entity: policy
    why: "A secret chosen by the caller can be weak or reused; letting Entra generate secrets removes that risk."
    fix: "Add a customPasswordAddition restriction for applications and service principals."
    refs: [CIS-M365-5.1.5.5, "NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /policies/defaultAppManagementPolicy
      key: id
    each:
      any:
        - { field: applicationRestrictions.passwordCredentials, op: empty }
        - { field: 'applicationRestrictions.passwordCredentials[].restrictionType', op: notcontains, value: customPasswordAddition }
        - { field: servicePrincipalRestrictions.passwordCredentials, op: empty }
        - { field: 'servicePrincipalRestrictions.passwordCredentials[].restrictionType', op: notcontains, value: customPasswordAddition }
    evidence: "application restrictions {applicationRestrictions.passwordCredentials[].restrictionType}; service principal restrictions {servicePrincipalRestrictions.passwordCredentials[].restrictionType}"

  - id: ENTRA-APPPOLICY-NO-CERT-LIFETIME
    title: No tenant-wide cap on certificate credential lifetime
    kind: missing
    category: PKI
    severity: low
    entity: policy
    why: "Without an asymmetric-key lifetime restriction app certificates can be uploaded with very long validity and are never rotated."
    fix: "Add an asymmetricKeyLifetime restriction for applications and service principals."
    refs: [CIS-M365-5.1.5.6, "NIST-800-53:IA-5(2)"]
    query:
      protocol: graph
      path: /policies/defaultAppManagementPolicy
      key: id
    each:
      any:
        - { field: applicationRestrictions.keyCredentials, op: empty }
        - { field: 'applicationRestrictions.keyCredentials[].restrictionType', op: notcontains, value: asymmetricKeyLifetime }
        - { field: servicePrincipalRestrictions.keyCredentials, op: empty }
        - { field: 'servicePrincipalRestrictions.keyCredentials[].restrictionType', op: notcontains, value: asymmetricKeyLifetime }
    evidence: "application key restrictions {applicationRestrictions.keyCredentials[].restrictionType}; service principal key restrictions {servicePrincipalRestrictions.keyCredentials[].restrictionType}"

  - id: ENTRA-PERMISSION-GRANT-POLICY-CUSTOM
    title: Custom permission grant policy exists
    kind: misconfigured
    category: IAM
    severity: low
    entity: permission-grant-policy
    why: "Custom permission grant policies widen what users or group owners may consent to; each one should match a documented consent decision."
    fix: "Review the policy's include and exclude conditions; delete it if no consent setting uses it."
    refs: ["NIST-800-53:AC-6"]
    query:
      protocol: graph
      path: /policies/permissionGrantPolicies
      key: id
      name: displayName
    each: { field: id, op: notmatch, value: '^microsoft-' }
    evidence: "custom permission grant policy {displayName} ({id})"

  - id: ENTRA-TOKEN-LIFETIME-CUSTOM
    title: Custom token lifetime policy exists
    kind: misconfigured
    category: AUT
    severity: medium
    entity: token-lifetime-policy
    why: "Custom token lifetimes are a legacy mechanism; extended tokens survive password resets and account disablement for their whole lifetime."
    fix: "Delete the custom policy and use Conditional Access sign-in frequency instead."
    refs: ["NIST-800-53:AC-12", "NIST-800-53:SC-23"]
    query:
      protocol: graph
      path: /policies/tokenLifetimePolicies
      key: id
      name: displayName
    count: some
    evidence: "{count} custom token lifetime policies: {sample}"

  - id: ENTRA-SELF-SERVICE-SIGNUP-ON
    title: Self-service sign-up for external users is enabled
    kind: misconfigured
    category: IAM
    severity: low
    entity: policy
    why: "Self-service sign-up user flows let external people create their own guest accounts in the tenant; unless an External ID flow is in deliberate use, it is an unwatched door."
    fix: "Disable self-service sign-up unless a user flow needs it."
    refs: ["NIST-800-53:AC-2(9)"]
    query:
      protocol: graph
      path: /policies/authenticationFlowsPolicy
      key: id
    each: { field: selfServiceSignUp.isEnabled, op: eq, value: true }
    evidence: "selfServiceSignUp.isEnabled = {selfServiceSignUp.isEnabled}"

  - id: ENTRA-XTAP-TRUST-MFA-ANY-TENANT
    title: MFA claims from any other tenant are trusted
    kind: misconfigured
    category: AUT
    severity: low
    entity: policy
    why: "Trusting inbound MFA by default means a guest's MFA, done under another organisation's (possibly weak) policy, satisfies your MFA requirement."
    fix: "Trust inbound MFA only in the cross-tenant settings of named partner organisations."
    refs: ["NIST-800-53:AC-20", "NIST-800-53:IA-8"]
    query:
      protocol: graph
      path: /policies/crossTenantAccessPolicy/default
      key: id
    each: { field: inboundTrust.isMfaAccepted, op: eq, value: true }
    evidence: "default inbound trust isMfaAccepted = {inboundTrust.isMfaAccepted}"

  - id: ENTRA-XTAP-TRUST-DEVICE-ANY-TENANT
    title: Device compliance claims from any other tenant are trusted
    kind: misconfigured
    category: AUT
    severity: medium
    entity: policy
    why: "With default device trust, a device that another organisation calls compliant or hybrid-joined satisfies your device-based Conditional Access."
    fix: "Trust compliant and hybrid-joined device claims only for named partner organisations."
    refs: ["NIST-800-53:AC-20", "NIST-800-53:AC-19"]
    query:
      protocol: graph
      path: /policies/crossTenantAccessPolicy/default
      key: id
    each:
      any:
        - { field: inboundTrust.isCompliantDeviceAccepted, op: eq, value: true }
        - { field: inboundTrust.isHybridAzureADJoinedDeviceAccepted, op: eq, value: true }
    evidence: "default inbound trust: compliant {inboundTrust.isCompliantDeviceAccepted}, hybrid-joined {inboundTrust.isHybridAzureADJoinedDeviceAccepted}"

  - id: ENTRA-XTAP-DIRECT-CONNECT-INBOUND-OPEN
    title: B2B direct connect is open inbound to every organisation
    kind: misconfigured
    category: IAM
    severity: medium
    entity: policy
    why: "Microsoft's default blocks B2B direct connect (Teams shared channels with users who stay in their own tenant). When the default settings allow both users and applications inbound, any organisation's users can be added to shared channels without a guest account you can review."
    fix: "Block direct connect inbound in the default cross-tenant settings and allow it per named partner organisation."
    refs: ["NIST-800-53:AC-20", "NIST-800-53:AC-21", "MITRE-ATTACK:T1199"]
    query:
      protocol: graph
      path: /policies/crossTenantAccessPolicy/default
      key: id
    each:
      all:
        - { field: b2bDirectConnectInbound.usersAndGroups.accessType, op: eq, value: allowed }
        - { field: b2bDirectConnectInbound.applications.accessType, op: eq, value: allowed }
    evidence: "default B2B direct connect inbound: users {b2bDirectConnectInbound.usersAndGroups.accessType}, applications {b2bDirectConnectInbound.applications.accessType}"

  # ================================================================= device registration ===
  - id: ENTRA-DEVREG-QUOTA-HIGH
    title: Users may register too many devices
    kind: misconfigured
    category: CFG
    severity: low
    entity: policy
    why: "A high per-user device quota lets one compromised account register many devices and obtain device-bound tokens on each."
    fix: "Set the maximum number of devices per user to 10 or fewer."
    refs: [CIS-M365-5.1.4.2, "NIST-800-53:AC-19"]
    query:
      protocol: graph
      path: /policies/deviceRegistrationPolicy
      key: id
    each: { field: userDeviceQuota, op: gt, value: 10, threshold: entra.device-quota-max }
    evidence: "userDeviceQuota = {userDeviceQuota}"

  - id: ENTRA-DEVREG-GA-LOCAL-ADMIN
    title: Global Administrators become local admins on every joined device
    kind: misconfigured
    category: IAM
    severity: medium
    entity: policy
    why: "Every Entra-joined PC then has Global Administrator credentials usable for local admin, so harvesting credentials on one PC reaches the top of the tenant."
    fix: "Turn off 'Global administrator role is added as local administrator' and use a dedicated device-admin role or Entra LAPS."
    refs: [CIS-M365-5.1.4.3, "NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /policies/deviceRegistrationPolicy
      key: id
    each: { field: azureADJoin.localAdmins.enableGlobalAdmins, op: eq, value: true }
    evidence: "azureADJoin.localAdmins.enableGlobalAdmins = {azureADJoin.localAdmins.enableGlobalAdmins}"

  - id: ENTRA-DEVREG-JOINER-LOCAL-ADMIN
    title: Whoever joins a device becomes its local administrator
    kind: misconfigured
    category: IAM
    severity: medium
    entity: policy
    why: "With 'registering user is added as local administrator' set to All, every user who joins a PC can install software, disable protections and dump credentials on it."
    fix: "Set the registering-user local admin setting to None (or Selected) and grant local admin only through a managed group or Entra LAPS."
    refs: [CIS-M365-5.1.4.4, "NIST-800-53:AC-6(1)"]
    query:
      protocol: graph
      path: /policies/deviceRegistrationPolicy
      key: id
    each: { field: azureADJoin.localAdmins.registeringUsers, op: match, value: 'allDeviceRegistrationMembership' }
    evidence: "registering users added as local admin: {azureADJoin.localAdmins.registeringUsers}"

  - id: ENTRA-DEVREG-LAPS-OFF
    title: Microsoft Entra LAPS is not enabled
    kind: missing
    category: IAM
    severity: medium
    entity: policy
    why: "Without LAPS the built-in local administrator password is the same (or never rotated) across devices, so one cracked device opens the rest."
    fix: "Enable Microsoft Entra LAPS in device settings and deploy a Windows LAPS policy that backs up to Entra."
    refs: [CIS-M365-5.1.4.5, "NIST-800-53:IA-5(1)"]
    query:
      protocol: graph
      path: /policies/deviceRegistrationPolicy
      key: id
    each: { field: localAdminPassword.isEnabled, op: eq, value: false }
    evidence: "localAdminPassword.isEnabled = {localAdminPassword.isEnabled}"

  # ======================================================================= groups ===
  - id: ENTRA-GROUP-DYNAMIC-PAUSED
    title: Dynamic group membership processing is paused
    kind: broken
    category: HLT
    severity: medium
    entity: group
    lens: both
    why: "A paused dynamic group stops adding joiners and removing leavers, so everything assigned to it drifts from the rule."
    fix: "Fix the rule if it was paused for an error, then resume processing."
    refs: ["NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, groupTypes, membershipRule, membershipRuleProcessingState, visibility, securityEnabled, mailEnabled, isAssignableToRole, onPremisesSyncEnabled]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: groupTypes, op: contains, value: DynamicMembership }
        - { field: membershipRuleProcessingState, op: ne, value: On }
    evidence: "{displayName}: processing {membershipRuleProcessingState}, rule {membershipRule}"

  - id: ENTRA-GROUP-M365-PUBLIC
    title: Microsoft 365 group is public
    kind: misconfigured
    category: IAM
    severity: low
    entity: group
    why: "Anyone in the tenant can join a public Microsoft 365 group and read its mailbox, files and Teams channels."
    fix: "Make the group private unless its content is meant for everyone."
    refs: ["NIST-800-53:AC-3"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, groupTypes, membershipRule, membershipRuleProcessingState, visibility, securityEnabled, mailEnabled, isAssignableToRole, onPremisesSyncEnabled]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: groupTypes, op: contains, value: Unified }
        - { field: visibility, op: eq, value: Public }
    evidence: "{displayName}: visibility {visibility}"

  - id: ENTRA-GROUP-M365-NO-OWNER
    title: Microsoft 365 group has no owner
    kind: missing
    category: HYG
    severity: low
    entity: group
    lens: both
    why: "Without an owner nobody approves joins, renews the group or decides when its content can go."
    fix: "Assign two owners, or let the group expiration policy retire it."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:CM-8(4)"]
    query:
      protocol: graph
      path: /groups
      filter: "groupTypes/any(c:c eq 'Unified')"
      select: [id, displayName]
      expand: owners($select=id)
      key: id
      name: displayName
    each: { field: owners, op: empty }
    evidence: "{displayName}: no owner"

  - id: ENTRA-ROLEGROUP-HAS-OWNERS
    title: Role-assignable group has owners
    kind: misconfigured
    category: IAM
    severity: high
    entity: group
    why: "An owner of a role-assignable group can add members, and every member gets the roles assigned to the group."
    fix: "Remove the owners; manage the group's membership through PIM for Groups or Privileged Role Administrators only."
    refs: ["NIST-800-53:AC-6(5)", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /groups
      filter: "isAssignableToRole eq true"
      select: [id, displayName]
      expand: owners($select=id)
      key: id
      name: displayName
    each: { field: owners, op: notempty }
    evidence: "{displayName}: owners {owners[].id}"

  - id: ENTRA-ROLEGROUP-LARGE
    title: Role-assignable group has many members
    kind: misconfigured
    category: IAM
    severity: medium
    entity: group
    why: "A big group holding a directory role spreads the role to people who were added for another reason; role groups should be small and reviewed."
    fix: "Shrink the group to the people who need the role, or split the role across smaller groups. (The expanded member list is capped at 20 by Graph, so keep the threshold below 20.)"
    refs: ["NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /groups
      filter: "isAssignableToRole eq true"
      select: [id, displayName]
      expand: members($select=id)
      key: id
      name: displayName
    each: { field: members, op: size-gt, value: 10, threshold: entra.rolegroup-max-members }
    evidence: "{displayName}: more members than allowed ({members[].id})"

  - id: ENTRA-GROUP-LIFECYCLE-NONE
    title: No Microsoft 365 group expiration policy
    kind: missing
    category: HYG
    severity: low
    entity: tenant
    lens: maintenance
    why: "Without an expiration policy unused Microsoft 365 groups and Teams live forever with their data and members."
    fix: "Create a group lifecycle policy (for example 365 days) so owners must renew active groups."
    refs: ["NIST-800-53:AC-2(3)"]
    query:
      protocol: graph
      path: /groupLifecyclePolicies
      key: id
    count: none
    evidence: "no group lifecycle policy"

  - id: ENTRA-GROUP-DYNAMIC-GUEST-CONTROLLED-ATTRIBUTE
    title: Dynamic group rule keys on attributes a guest's home tenant controls
    kind: misconfigured
    category: IAM
    severity: low
    entity: group
    why: "Mail, other mails, proxy addresses, display name, given name, surname and company name of a guest come from the guest's own organisation. A dynamic rule on them that does not exclude guests lets a partner place their account in the group, and in whatever the group grants."
    fix: "Add (user.userType -eq \"Member\") to the rule, or key it on an attribute only your admins or HR set (employeeId, extension attributes, department from the HR feed). Tune both patterns with the thresholds."
    refs: ["NIST-800-53:AC-2(9)", "NIST-800-53:AC-3", "MITRE-ATTACK:T1199"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName, groupTypes, membershipRule, membershipRuleProcessingState, visibility, securityEnabled, mailEnabled, isAssignableToRole, onPremisesSyncEnabled]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: groupTypes, op: contains, value: DynamicMembership }
        - { field: membershipRule, op: match, value: 'user\.(mail|otherMails|proxyAddresses|displayName|givenName|surname|companyName)\b', threshold: entra.dynamic-rule-external-attribute-pattern }
        - { field: membershipRule, op: notmatch, value: 'user\.userType\s+-eq\s+"?Member"?', threshold: entra.dynamic-rule-member-guard-pattern }
    evidence: "{displayName}: rule {membershipRule}"

  - id: ENTRA-GROUP-ONBOARDING-NOT-ASSIGNED
    title: Group that onboarding fills is assigned to no application
    kind: broken
    category: IAM
    severity: high
    entity: group
    lens: both
    why: "When the group that the joiner process fills is no longer assigned to the application it was meant to grant, every new hire lands in it and silently never reaches the app (or its provisioning). The groups are tenant-specific: list their object ids in the threshold; with the list empty the rule checks nothing."
    fix: "Assign the group to the application again, or point the onboarding step at the group that is assigned and retire this one."
    refs: ["NIST-800-53:AC-2(1)", "CIS-Controls-v8:6.1"]
    query:
      protocol: graph
      path: /groups
      select: [id, displayName]
      expand: appRoleAssignments($select=id,resourceDisplayName)
      key: id
      name: displayName
    each:
      all:
        - field: id
          op: in
          threshold: entra.onboarding-group-ids
          value: []
        - { field: appRoleAssignments, op: empty }
    evidence: "{displayName}: onboarding group with no application assignment"

  # ======================================================================= devices ===
  - id: ENTRA-DEVICE-STALE
    title: Enabled device object with no sign-in for a long time
    kind: misconfigured
    category: HYG
    severity: low
    entity: device
    lens: both
    why: "Stale device objects keep their compliance state, certificates and BitLocker keys and make device-based Conditional Access and inventories unreliable."
    fix: "Disable devices with no sign-in in the window, delete them after a further grace period (hybrid-joined: clean up in AD and let sync remove them)."
    refs: ["NIST-800-53:CM-8(3)"]
    query:
      protocol: graph
      path: /devices
      select: [id, displayName, accountEnabled, operatingSystem, operatingSystemVersion, trustType, isManaged, isCompliant, approximateLastSignInDateTime, registrationDateTime]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - any:
            - { field: approximateLastSignInDateTime, op: age-gt, value: 90, threshold: entra.device-stale-days }
            - all:
                - { field: approximateLastSignInDateTime, op: absent }
                - { field: registrationDateTime, op: age-gt, value: 90, threshold: entra.device-stale-days }
    evidence: "{displayName} ({trustType}, {operatingSystem}): last sign-in {approximateLastSignInDateTime}"

  - id: ENTRA-DEVICE-JOINED-UNMANAGED
    title: Active Entra-joined or hybrid-joined Windows device is not managed
    kind: missing
    category: CFG
    severity: medium
    entity: device
    why: "A joined Windows device outside MDM gets no compliance evaluation, so device-based Conditional Access cannot tell it apart from a healthy one."
    fix: "Enrol the device in Intune (or co-management) and investigate why automatic enrolment did not happen."
    refs: ["NIST-800-53:CM-2", "NIST-800-53:CM-8"]
    query:
      protocol: graph
      path: /devices
      select: [id, displayName, accountEnabled, operatingSystem, operatingSystemVersion, trustType, isManaged, isCompliant, approximateLastSignInDateTime, registrationDateTime]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: operatingSystem, op: match, value: '^Windows' }
        - { field: trustType, op: in, value: [AzureAd, ServerAd] }
        - { field: approximateLastSignInDateTime, op: age-lt, value: 30, threshold: entra.device-active-days }
        - any:
            - { field: isManaged, op: absent }
            - { field: isManaged, op: eq, value: false }
    evidence: "{displayName} ({trustType}): last sign-in {approximateLastSignInDateTime}, isManaged {isManaged}"

  - id: ENTRA-DEVICE-WINDOWS-UNSUPPORTED
    title: Active Windows device runs a release past end of servicing
    kind: misconfigured
    category: LCM
    severity: medium
    entity: device
    lens: both
    why: "A Windows build out of servicing gets no security updates. The default pattern marks builds below Windows 11 23H2 (22631) as unsupported, which includes all Windows 10 builds unless they are on Extended Security Updates; tune it with the threshold."
    fix: "Upgrade the device to a serviced Windows 11 release, or record it as covered by Extended Security Updates."
    refs: ["NIST-800-53:SI-2", "NIST-800-53:SA-22"]
    query:
      protocol: graph
      path: /devices
      select: [id, displayName, accountEnabled, operatingSystem, operatingSystemVersion, trustType, isManaged, isCompliant, approximateLastSignInDateTime, registrationDateTime]
      top: 999
      key: id
      name: displayName
    each:
      all:
        - { field: accountEnabled, op: eq, value: true }
        - { field: operatingSystem, op: match, value: '^Windows' }
        - { field: approximateLastSignInDateTime, op: age-lt, value: 30, threshold: entra.device-active-days }
        - { field: operatingSystemVersion, op: match, value: '^10\.0\.(\d{1,4}|1\d{4}|2[01]\d{3}|22[0-5]\d{2}|226[0-2]\d|22630)(\.|$)', threshold: entra.windows-unsupported-build-pattern }
    evidence: "{displayName}: Windows {operatingSystemVersion}, last sign-in {approximateLastSignInDateTime}"

  # ========================================================== tenant, sync and contacts ===
  - id: ENTRA-SYNC-STALE
    title: Directory synchronisation has not run recently
    kind: broken
    category: HLT
    severity: high
    entity: organization
    lens: both
    why: "Entra Connect syncs every 30 minutes; a sync older than a few hours means it is stopped or failing, and leavers disabled in AD stay active in the cloud until it is fixed."
    fix: "Check the Entra Connect (or Cloud Sync) server, its service and its connector accounts; read Connect Health alerts."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:SI-4"]
    refresh: 1h
    query:
      protocol: graph
      path: /organization
      select: [id, displayName, onPremisesSyncEnabled, onPremisesLastSyncDateTime, technicalNotificationMails, securityComplianceNotificationMails]
      key: id
      name: displayName
    each:
      all:
        - { field: onPremisesSyncEnabled, op: eq, value: true }
        - { field: onPremisesLastSyncDateTime, op: age-gt, value: 0.125, threshold: entra.sync-max-age-days }
    evidence: "last directory sync {onPremisesLastSyncDateTime}"

  - id: ENTRA-SYNC-PASSWORD-HASH-STALE
    title: Password hash synchronisation heartbeat is old
    kind: broken
    category: HLT
    severity: medium
    entity: organization
    lens: both
    why: "When password hash sync stops, password changes stop reaching the cloud and leaked-credential detection works on old hashes. The heartbeat is only exposed in the beta API."
    fix: "Check the password hash sync agent on the Entra Connect server and its AD connector account permissions."
    refs: [CIS-M365-5.1.8.1, "NIST-800-53:IA-5"]
    refresh: 1h
    query:
      protocol: graph
      version: beta
      path: /organization
      select: [id, displayName, onPremisesSyncEnabled, onPremisesLastSyncDateTime, onPremisesLastPasswordSyncDateTime]
      key: id
      name: displayName
    each:
      all:
        - { field: onPremisesSyncEnabled, op: eq, value: true }
        - any:
            - { field: onPremisesLastPasswordSyncDateTime, op: absent }
            - { field: onPremisesLastPasswordSyncDateTime, op: age-gt, value: 0.125, threshold: entra.password-sync-max-age-days }
    evidence: "last password hash sync {onPremisesLastPasswordSyncDateTime} (last directory sync {onPremisesLastSyncDateTime})"

  - id: ENTRA-SYNC-PASSWORD-HASH-OFF
    title: Password hash synchronisation is disabled
    kind: missing
    category: AUT
    severity: medium
    entity: sync-configuration
    why: "Without password hash sync Entra cannot detect leaked credentials and there is no cloud fallback when federation or pass-through agents fail. Not applicable to cloud-only tenants."
    fix: "Enable password hash synchronisation in Entra Connect (it can run alongside federation or pass-through authentication)."
    refs: [CIS-M365-5.1.8.1, "NIST-800-53:SI-4"]
    query:
      protocol: graph
      path: /directory/onPremisesSynchronization
      key: id
    each: { field: features.passwordSyncEnabled, op: eq, value: false }
    evidence: "features.passwordSyncEnabled = {features.passwordSyncEnabled}"

  - id: ENTRA-SYNC-HARD-MATCH-TAKEOVER-OPEN
    title: Cloud accounts can be taken over by hard-matching from AD
    kind: misconfigured
    category: IAM
    severity: medium
    entity: sync-configuration
    why: "If hard-match takeover is not blocked, an on-premises object with a crafted source anchor can take over an existing cloud-only account, including an administrator."
    fix: "Block cloud object takeover through hard match (and soft match) in the directory synchronisation features."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:IA-4"]
    query:
      protocol: graph
      path: /directory/onPremisesSynchronization
      key: id
    each: { field: features.blockCloudObjectTakeoverThroughHardMatchEnabled, op: eq, value: false }
    evidence: "blockCloudObjectTakeoverThroughHardMatchEnabled = {features.blockCloudObjectTakeoverThroughHardMatchEnabled}, blockSoftMatchEnabled = {features.blockSoftMatchEnabled}"

  - id: ENTRA-TENANT-NO-TECH-CONTACT
    title: No technical notification contact is set
    kind: missing
    category: MON
    severity: low
    entity: organization
    lens: maintenance
    why: "Microsoft sends service, security and expiry notices to the technical contact; with none set (or a person who left), those notices go nowhere."
    fix: "Set a monitored team mailbox as the technical notification contact."
    refs: ["NIST-800-53:IR-6", "NIST-800-53:SI-5"]
    query:
      protocol: graph
      path: /organization
      select: [id, displayName, onPremisesSyncEnabled, onPremisesLastSyncDateTime, technicalNotificationMails, securityComplianceNotificationMails]
      key: id
      name: displayName
    each: { field: technicalNotificationMails, op: empty }
    evidence: "technicalNotificationMails is empty"

  - id: ENTRA-TENANT-NO-SECURITY-CONTACT
    title: No security and compliance notification contact is set
    kind: missing
    category: MON
    severity: low
    entity: organization
    why: "Security and compliance notices from Microsoft have nowhere to go."
    fix: "Set a monitored security team mailbox as the security and compliance notification contact."
    refs: ["NIST-800-53:IR-6"]
    query:
      protocol: graph
      path: /organization
      select: [id, displayName, onPremisesSyncEnabled, onPremisesLastSyncDateTime, technicalNotificationMails, securityComplianceNotificationMails]
      key: id
      name: displayName
    each: { field: securityComplianceNotificationMails, op: empty }
    evidence: "securityComplianceNotificationMails is empty"

  - id: ENTRA-ACCESS-REVIEWS-NONE
    title: No access reviews are defined
    kind: missing
    category: IAM
    severity: medium
    entity: tenant
    why: "Without access reviews guest accounts and privileged role holders accumulate; nobody re-confirms them. Needs Entra ID P2 or Governance."
    fix: "Create recurring access reviews for guests and for privileged directory roles at least."
    refs: [CIS-M365-5.3.2, CIS-M365-5.3.3, "NIST-800-53:AC-2(3)"]
    query:
      protocol: graph
      path: /identityGovernance/accessReviews/definitions
      key: id
      name: displayName
    count: none
    evidence: "no access review definitions"

  - id: ENTRA-RECOMMENDATION-ACTIVE
    title: Open Microsoft Entra recommendation
    kind: misconfigured
    category: CFG
    severity:
      field: priority
      map: { high: high, medium: medium, low: low }
      default: low
    entity: recommendation
    why: "Entra recommendations are Microsoft's own checks of this tenant (stale apps, expiring credentials, legacy auth use, MFA gaps); an active one is a gap Microsoft already sees. Beta API only."
    fix: "Work the recommendation in the Entra admin centre; dismiss or postpone it with a reason when it is accepted risk."
    refs: ["NIST-800-53:CA-7"]
    query:
      protocol: graph
      version: beta
      path: /directory/recommendations
      key: id
      name: displayName
    each: { field: status, op: eq, value: active }
    evidence: "{displayName} ({recommendationType}, priority {priority})"

  - id: ENTRA-DOMAIN-FEDERATED
    title: Verified domain signs in through federation
    kind: misconfigured
    category: AUT
    severity: medium
    entity: domain
    why: "For a federated domain the federation server's token-signing key can mint a sign-in for any user of the domain (golden SAML), and its MFA claims decide whether Entra asks for MFA at all. Not wrong in itself, but each federated domain must be a known, reviewed fact. Uses the same domain query as m365.yaml."
    fix: "Record the federation server's owner, patch level and signing-certificate rotation date, check federatedIdpMfaBehavior (see backlog), and plan the move to password hash sync with cloud MFA."
    refs: ["MITRE-ATTACK:T1606.002", "MITRE-ATTACK:T1484.002", "NIST-800-53:IA-5(2)", "NIST-800-53:SC-12"]
    query:
      protocol: graph
      path: /domains
      select: [id, authenticationType, isVerified, isDefault, isInitial, passwordValidityPeriodInDays, supportedServices]
      key: id
    each:
      all:
        - { field: isVerified, op: eq, value: true }
        - { field: authenticationType, op: eq, value: Federated }
    evidence: "{id}: authenticationType {authenticationType}"

  - id: ENTRA-CUSTOM-AUTH-EXTENSION-PRESENT
    title: Custom authentication extension calls out to an external endpoint
    kind: misconfigured
    category: AUT
    severity: medium
    entity: auth-extension
    why: "A custom authentication extension (token issuance start, attribute collection, OTP send) makes Entra call an HTTP endpoint during sign-in and can put claims from it into every token issued to the apps that use it. Legitimate but rare; an extension nobody can explain is persistence."
    fix: "Confirm the owner, the target URL and the apps that use it; delete extensions no app uses. Accept the documented ones."
    refs: ["MITRE-ATTACK:T1556", "NIST-800-53:CM-6", "NIST-800-53:IA-5"]
    query:
      protocol: graph
      path: /identity/customAuthenticationExtensions
      key: id
      name: displayName
    each: any
    evidence: "{displayName}: calls {endpointConfiguration.targetUrl} ({description})"

  - id: ENTRA-AU-NO-RESTRICTED-MANAGEMENT
    title: No restricted-management administrative unit exists
    kind: missing
    category: IAM
    severity: low
    entity: tenant
    why: "Without a restricted-management administrative unit any User, Helpdesk or Authentication Administrator can reset the password and MFA methods of the emergency-access and other sensitive accounts. Restricted management is the Entra-native way to fence them off."
    fix: "Create a restricted-management administrative unit holding the emergency-access and tier-0 admin accounts and assign the roles that may manage them at that scope only."
    refs: ["NIST-800-53:AC-6(5)", "NIST-800-53:AC-2(7)", "MITRE-ATTACK:T1098"]
    query:
      protocol: graph
      path: /directory/administrativeUnits
      select: [id, displayName, isMemberManagementRestricted, visibility, membershipType]
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where: { field: isMemberManagementRestricted, op: eq, value: true }
    evidence: "{count} restricted-management administrative units among {rows}"

  - id: ENTRA-LIFECYCLE-NO-LEAVER-WORKFLOW
    title: No enabled Lifecycle Workflow handles leavers
    kind: missing
    category: IAM
    severity: low
    entity: tenant
    lens: both
    why: "Without a leaver workflow offboarding is a manual checklist; the 'disabled account still has ...' findings elsewhere in this pack are what a skipped checklist leaves behind. Needs Microsoft Entra ID Governance; without it the query fails and the rule reports unknown."
    fix: "Enable the leaver templates (real-time employee termination, post-offboarding) and scope them to the HR-driven employee population."
    refs: ["NIST-800-53:PS-4", "NIST-800-53:AC-2(3)", "CIS-Controls-v8:6.2"]
    query:
      protocol: graph
      path: /identityGovernance/lifecycleWorkflows/workflows
      select: [id, displayName, category, isEnabled, isSchedulingEnabled]
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: category, op: eq, value: leaver }
          - { field: isEnabled, op: eq, value: true }
    evidence: "{count} enabled leaver workflows among {rows} workflows"

  # ============================================================ sign-in and audit logs ===
  # Bounded with relative dates ({DAYS_AGO:n}). The sign-in log returns interactive sign-ins only, keeps
  # 30 days (7 without Entra ID P1) and does not support $select. Each rule keys its rows so that one
  # finding stands for one account and protocol (or one event); the row count per key is not exposed.
  - id: ENTRA-SIGNIN-LEGACY-AUTH-SUCCESS-RECENT
    title: Successful sign-in over a legacy protocol in the last week
    kind: broken
    category: AUT
    severity: high
    entity: sign-in
    why: "A successful IMAP, POP, SMTP AUTH, ActiveSync basic, EWS or other legacy sign-in is proof that the legacy-authentication block is missing, excluded or bypassed for this account - the protocol carries no MFA, so a sprayed password is enough. One finding per account and protocol."
    fix: "Find the client from the IP and app (often a printer, scanner, script or old mail app), move it to modern authentication or a scoped exception, then confirm the block policy covers the account."
    refs: [CIS-M365:5.2.2.3, "MITRE-ATTACK:T1078.004", "MITRE-ATTACK:T1110.003", "NIST-800-53:IA-2(1)"]
    query:
      protocol: graph
      path: /auditLogs/signIns
      filter: "createdDateTime ge {DAYS_AGO:7} and status/errorCode eq 0 and (clientAppUsed eq 'Exchange ActiveSync' or clientAppUsed eq 'IMAP4' or clientAppUsed eq 'POP3' or clientAppUsed eq 'Authenticated SMTP' or clientAppUsed eq 'Exchange Web Services' or clientAppUsed eq 'MAPI Over HTTP' or clientAppUsed eq 'Offline Address Book' or clientAppUsed eq 'Outlook Anywhere (RPC over HTTP)' or clientAppUsed eq 'Exchange Online PowerShell' or clientAppUsed eq 'AutoDiscover' or clientAppUsed eq 'Reporting Web Services' or clientAppUsed eq 'Other clients')"
      maxPages: 20
      key: "{userId}|{clientAppUsed}"
      name: userPrincipalName
    each: any
    evidence: "{userPrincipalName}: {clientAppUsed} sign-in to {appDisplayName} from {ipAddress} ({location.countryOrRegion}) at {createdDateTime}, Conditional Access {conditionalAccessStatus}"

  - id: ENTRA-SIGNIN-RISKY-SUCCESS-RECENT
    title: Risky sign-in succeeded and nobody remediated it
    kind: broken
    category: AUT
    severity:
      field: riskLevelDuringSignIn
      map: { high: high, medium: medium }
      default: medium
    entity: sign-in
    why: "A successful sign-in that Identity Protection scored medium or high, and that is still at risk (not remediated by MFA, dismissed or confirmed safe), means the risk-based policy did not act. Each one is an account to look at today. Real risk levels need Entra ID P2 (others see 'hidden')."
    fix: "Review the sign-in; if it was not the user, reset the password, revoke sessions and review the MFA methods; then make sure an enforced sign-in risk policy covers the account (ENTRA-CA-BASELINE-SIGNIN-RISK)."
    refs: [CIS-M365:5.2.2.7, "MITRE-ATTACK:T1078.004", "NIST-800-53:SI-4", "NIST-800-53:IR-4"]
    query:
      protocol: graph
      path: /auditLogs/signIns
      filter: "createdDateTime ge {DAYS_AGO:7} and status/errorCode eq 0 and (riskLevelDuringSignIn eq 'high' or riskLevelDuringSignIn eq 'medium')"
      maxPages: 20
      key: "{userId}|{riskLevelDuringSignIn}"
      name: userPrincipalName
    each: { field: riskState, op: in, value: [atRisk, confirmedCompromised] }
    evidence: "{userPrincipalName}: {riskLevelDuringSignIn} risk ({riskEventTypes_v2}), {riskState}, to {appDisplayName} from {ipAddress} ({location.countryOrRegion}) at {createdDateTime}"

  # Role grants: activityDisplayName covers direct assignments, scoped assignments and PIM assignments
  # (eligible and active); PIM requests and routine activations are left out by the pattern. The tier-0
  # test matches the role template ids anywhere in the JSON text of targetResources (the role's id for
  # PIM events, its Role.TemplateId modified property for direct ones).
  - id: ENTRA-AUDIT-ROLE-ASSIGNMENT-RECENT
    title: Directory role granted in the last two days
    kind: misconfigured
    category: IAM
    severity: low
    entity: audit-event
    why: "Granting a role is the step every tenant takeover ends with. A daily list of new grants, checked against change records, catches the one nobody asked for while it is still fresh. Tier-0 roles have their own rule."
    fix: "Confirm each grant against a request or change record; remove the ones nobody can explain and find out who made them."
    refs: ["MITRE-ATTACK:T1098.003", "NIST-800-53:AC-2(4)", "NIST-800-53:AU-6", "CIS-Controls-v8:8.11"]
    query:
      protocol: graph
      path: /auditLogs/directoryAudits
      filter: "activityDateTime ge {DAYS_AGO:2} and category eq 'RoleManagement' and result eq 'success'"
      maxPages: 20
      key: id
      name: activityDisplayName
    each:
      all:
        - { field: activityDisplayName, op: match, value: '^Add (eligible |scoped )?member to role(?!.*(request|activat))', threshold: entra.audit-role-activity-pattern }
        - { field: targetResources, op: notmatch, value: '(62e90394-69f5-4237-9190-012177145e10|e8611ab8-c189-46e8-94e1-60213ab1f814|7be44c8a-adaf-4e2a-84d6-ab2649e08a13|194ae4cb-b126-40b2-bd5b-6091b380977d|8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2|b1be1c3e-b65d-4f19-8427-f6fa0d97feb9|9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3|158c047a-c907-4556-b7ef-446551a6b5f7|be2f45a1-457d-42af-a067-6ec1fa63bc45|8329153b-31d0-4727-b945-745eb3bc5f31|3a2c62db-5318-420d-8d74-23affee5d9d5)', threshold: entra.tier0-role-id-pattern }
    evidence: "{activityDateTime}: {activityDisplayName} by {initiatedBy.user.userPrincipalName}{initiatedBy.app.displayName} - {targetResources[].displayName} {targetResources[].userPrincipalName}"

  - id: ENTRA-AUDIT-TIER0-ROLE-ASSIGNMENT-RECENT
    title: Tier-0 directory role granted in the last two days
    kind: misconfigured
    category: IAM
    severity: high
    entity: audit-event
    why: "A new holder of Global, Privileged Role, Privileged Authentication, Security, Hybrid Identity, Conditional Access, Application, Cloud Application, External Identity Provider, Domain Name or Intune Administrator can take over the tenant. Every such grant needs a named request behind it, checked the next morning."
    fix: "Confirm the grant against a change record today; if nobody asked for it, remove it, revoke the account's sessions and investigate who granted it."
    refs: ["MITRE-ATTACK:T1098.003", "NIST-800-53:AC-2(4)", "NIST-800-53:AC-6(5)", "CIS-Controls-v8:8.11"]
    query:
      protocol: graph
      path: /auditLogs/directoryAudits
      filter: "activityDateTime ge {DAYS_AGO:2} and category eq 'RoleManagement' and result eq 'success'"
      maxPages: 20
      key: id
      name: activityDisplayName
    each:
      all:
        - { field: activityDisplayName, op: match, value: '^Add (eligible |scoped )?member to role(?!.*(request|activat))', threshold: entra.audit-role-activity-pattern }
        - { field: targetResources, op: match, value: '(62e90394-69f5-4237-9190-012177145e10|e8611ab8-c189-46e8-94e1-60213ab1f814|7be44c8a-adaf-4e2a-84d6-ab2649e08a13|194ae4cb-b126-40b2-bd5b-6091b380977d|8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2|b1be1c3e-b65d-4f19-8427-f6fa0d97feb9|9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3|158c047a-c907-4556-b7ef-446551a6b5f7|be2f45a1-457d-42af-a067-6ec1fa63bc45|8329153b-31d0-4727-b945-745eb3bc5f31|3a2c62db-5318-420d-8d74-23affee5d9d5)', threshold: entra.tier0-role-id-pattern }
    evidence: "{activityDateTime}: {activityDisplayName} by {initiatedBy.user.userPrincipalName}{initiatedBy.app.displayName} - {targetResources[].displayName} {targetResources[].userPrincipalName}"

  # ================================================= SaaS provisioning (SCIM) jobs and logs ===
  # The job rules share one per-object query: every enterprise app (service principals tagged
  # WindowsAzureActiveDirectoryIntegratedApp, gallery and non-gallery, at most 1000) is asked for its
  # provisioning jobs; apps without provisioning return an empty list. Row shape (entity
  # provisioning-job): the synchronizationJob (id, templateId, schedule.{interval,state,expiration},
  # status.{code, countSuccessiveCompleteFailures, quarantine.*, lastExecution.*,
  # lastSuccessfulExecution.*, lastSuccessfulExecutionWithExports.*, steadyStateLastAchievedTime,
  # troubleshootingUrl}, synchronizationJobSettings) plus parent.{id, appId, displayName,
  # accountEnabled} = the service principal; key "{parent.id}|{id}". The job id is the jobId that the
  # provisioning log rows below carry, so the two can be joined in the store.
  - id: ENTRA-PROVISIONING-JOB-QUARANTINE
    title: Provisioning job to a SaaS app is in quarantine
    kind: broken
    category: HLT
    severity: high
    entity: provisioning-job
    lens: both
    why: "In quarantine Entra retries at most once a day and stops creating, updating and disabling users in the app: joiners never arrive and leavers keep their access there. The warning mail goes to the job's notification address, often a person who has left."
    fix: "Open the job's provisioning logs, fix the cause (expired or revoked credential, a mapping the target rejects, a burst of target errors), then restart the job to clear the quarantine; set a monitored mailbox as the notification address."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:SI-4", "CIS-Controls-v8:6.1", "CIS-Controls-v8:6.2"]
    query:
      protocol: graph
      path: /servicePrincipals/{id}/synchronization/jobs
      for_each:
        path: /servicePrincipals
        filter: "tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
        select: [id, appId, displayName, accountEnabled]
        field: id
        max: 1000
      key: "{parent.id}|{id}"
      name: parent.displayName
    each: { field: status.code, op: eq, value: Quarantine }
    evidence: "{parent.displayName}: job {id} ({templateId}) in quarantine since {status.quarantine.seriesBegan}, reason {status.quarantine.reason}, re-evaluated {status.quarantine.seriesCount} times, next attempt {status.quarantine.nextAttempt}; error {status.quarantine.error.code} {status.quarantine.error.message}; {status.troubleshootingUrl}"

  - id: ENTRA-PROVISIONING-JOB-FAILING
    title: Provisioning job keeps failing (the step before quarantine)
    kind: broken
    category: HLT
    severity:
      field: status.countSuccessiveCompleteFailures
      ranges: [ { min: 3, value: high } ]
      default: medium
    entity: provisioning-job
    lens: both
    why: "A job whose last run failed, or that failed several runs in a row, is about to be quarantined; fixing it now keeps joiners and leavers flowing to the app."
    fix: "Read status.lastExecution.error and the provisioning log of the last cycle; fix the credential, the mapping or the target before the quarantine threshold is reached."
    refs: ["NIST-800-53:SI-4", "NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /servicePrincipals/{id}/synchronization/jobs
      for_each:
        path: /servicePrincipals
        filter: "tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
        select: [id, appId, displayName, accountEnabled]
        field: id
        max: 1000
      key: "{parent.id}|{id}"
      name: parent.displayName
    each:
      all:
        - { field: status.code, op: eq, value: Active }
        - any:
            - { field: status.countSuccessiveCompleteFailures, op: gt, value: 0, threshold: entra.provisioning-max-successive-failures }
            - { field: status.lastExecution.state, op: eq, value: Failed }
            - { field: status.lastExecution.error.code, op: notempty }
    evidence: "{parent.displayName}: job {id} last run {status.lastExecution.state} at {status.lastExecution.timeEnded}, {status.countSuccessiveCompleteFailures} successive failures; error {status.lastExecution.error.code} {status.lastExecution.error.message}"

  - id: ENTRA-PROVISIONING-JOB-STALE-EXPORT
    title: Active provisioning job has exported nothing for weeks
    kind: broken
    category: HLT
    severity: medium
    entity: provisioning-job
    lens: both
    why: "A job can look healthy while it skips every object: nobody new is in scope, or onboarding fills a group that is not the one assigned to the app. No export for weeks in an organisation that hires people is that symptom seen from the job. Tenants with no joiners for long periods raise the threshold."
    fix: "Compare the app's assigned groups with the group onboarding fills; provision one recent hire on demand to prove the path; check the scoping filters."
    refs: ["NIST-800-53:AC-2", "CIS-Controls-v8:6.1"]
    query:
      protocol: graph
      path: /servicePrincipals/{id}/synchronization/jobs
      for_each:
        path: /servicePrincipals
        filter: "tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
        select: [id, appId, displayName, accountEnabled]
        field: id
        max: 1000
      key: "{parent.id}|{id}"
      name: parent.displayName
    each:
      all:
        - { field: status.code, op: eq, value: Active }
        - any:
            - { field: status.lastSuccessfulExecutionWithExports.timeEnded, op: absent }
            - { field: status.lastSuccessfulExecutionWithExports.timeEnded, op: age-gt, value: 14, threshold: entra.provisioning-export-max-age-days }
    evidence: "{parent.displayName}: job {id} last exported {status.lastSuccessfulExecutionWithExports.timeEnded} ({status.lastSuccessfulExecutionWithExports.countExported} objects); last run {status.lastExecution.timeEnded}"

  - id: ENTRA-PROVISIONING-JOB-PAUSED
    title: Provisioning job to an enabled app is paused, never run or not configured
    kind: misconfigured
    category: CFG
    severity:
      field: status.code
      map: { NotConfigured: low }
      default: medium
    entity: provisioning-job
    lens: both
    why: "Provisioning was set up and then stopped, or never started, while the app is still in use: its users are being created and removed by hand, or not at all, without anyone deciding that."
    fix: "Start the job (and fix whatever made someone pause it), or delete it and record that the app is provisioned manually with an owner for joiners and leavers."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:CM-3"]
    query:
      protocol: graph
      path: /servicePrincipals/{id}/synchronization/jobs
      for_each:
        path: /servicePrincipals
        filter: "tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
        select: [id, appId, displayName, accountEnabled]
        field: id
        max: 1000
      key: "{parent.id}|{id}"
      name: parent.displayName
    each:
      all:
        - { field: parent.accountEnabled, op: eq, value: true }
        - { field: status.code, op: ne, value: Quarantine }
        - any:
            - { field: status.code, op: in, value: [Paused, NotRun, NotConfigured] }
            - { field: schedule.state, op: in, value: [Paused, Disabled] }
    evidence: "{parent.displayName}: job {id} ({templateId}) status {status.code}, schedule {schedule.state}"

  - id: ENTRA-PROVISIONING-JOB-REDUCED-SCHEDULE
    title: Provisioning job runs less often than the normal cycle
    kind: misconfigured
    category: CFG
    severity: low
    entity: provisioning-job
    lens: maintenance
    why: "The normal cycle is about every 40 minutes; a job on a schedule of hours or days delivers joiners, changes and leavers to the app late. The rule accepts any interval of 40 minutes or less (tune the pattern with the threshold); quarantined jobs are left to their own rule."
    fix: "Reset the job's schedule to the default interval, or record why the app needs a slower one."
    refs: ["NIST-800-53:AC-2"]
    query:
      protocol: graph
      path: /servicePrincipals/{id}/synchronization/jobs
      for_each:
        path: /servicePrincipals
        filter: "tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
        select: [id, appId, displayName, accountEnabled]
        field: id
        max: 1000
      key: "{parent.id}|{id}"
      name: parent.displayName
    each:
      all:
        - { field: status.code, op: eq, value: Active }
        - { field: schedule.state, op: eq, value: Active }
        - { field: schedule.interval, op: notmatch, value: '^PT([1-9]|[1-3][0-9]|40)M$', threshold: entra.provisioning-interval-ok-pattern }
    evidence: "{parent.displayName}: job {id} runs every {schedule.interval}"

  # Provisioning log (last 7 days). Filters support eq, contains, gt and lt only, are case-sensitive and
  # $select is not supported. Failures are keyed per job and error code, skips per job and source object.
  # The failure patterns match the JSON text of errorInformation (errorCode and reason together).
  - id: ENTRA-PROVISIONING-PAYLOAD-REJECTED-RECENT
    title: SaaS app rejects what provisioning sends (attribute mapping)
    kind: broken
    category: HLT
    severity: high
    entity: provisioning-event
    lens: both
    why: "The target answered with a bad-request or invalid-payload error: one attribute mapping sends a value or an operation the app does not accept, and every object that carries it fails - often thousands at once, until the job is quarantined."
    fix: "Open a failed event's steps to find the attribute; remove or correct that mapping (or its expression), test with provision on demand on one user, then restart the job."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:SI-4", "CIS-Controls-v8:6.1"]
    query:
      protocol: graph
      path: /auditLogs/provisioning
      filter: "activityDateTime gt {DAYS_AGO:7} and provisioningStatusInfo/status eq 'failure'"
      maxPages: 100
      key: "{jobId}|{provisioningStatusInfo.errorInformation.errorCode}"
      name: servicePrincipal.displayName
    each: { field: provisioningStatusInfo.errorInformation, op: match, value: '(BadRequest|InvalidPayload|InvalidPatch|invalid.{0,30}(patch|payload|request|value)|status code 400\b)', threshold: entra.provisioning-payload-error-pattern }
    evidence: "{servicePrincipal.displayName}{servicePrincipal[].displayName} (job {jobId}): {provisioningStatusInfo.errorInformation.errorCode} on {provisioningAction} of {sourceIdentity.identityType} {sourceIdentity.displayName} at {activityDateTime}: {provisioningStatusInfo.errorInformation.reason}"

  - id: ENTRA-PROVISIONING-MATCH-CONFLICT-RECENT
    title: SaaS app already holds the object under another identity (matching conflict)
    kind: broken
    category: HLT
    severity: medium
    entity: provisioning-event
    lens: both
    why: "The target reports that a user or group with the same email or name already exists: the app holds the person under another username, and the job matches on an attribute that differs (UPN against email, for example), so it tries to create a duplicate and fails."
    fix: "Add the target's key attribute (often email) as a matching attribute with the right precedence, or clean the duplicate in the app; then restart the job."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:IA-4", "CIS-Controls-v8:6.1"]
    query:
      protocol: graph
      path: /auditLogs/provisioning
      filter: "activityDateTime gt {DAYS_AGO:7} and provisioningStatusInfo/status eq 'failure'"
      maxPages: 100
      key: "{jobId}|{provisioningStatusInfo.errorInformation.errorCode}"
      name: servicePrincipal.displayName
    each: { field: provisioningStatusInfo.errorInformation, op: match, value: '(EntryConflict|Duplicate|AlreadyExists|already exists|status code 409\b)', threshold: entra.provisioning-conflict-error-pattern }
    evidence: "{servicePrincipal.displayName}{servicePrincipal[].displayName} (job {jobId}): {provisioningStatusInfo.errorInformation.errorCode} on {provisioningAction} of {sourceIdentity.identityType} {sourceIdentity.displayName} at {activityDateTime}: {provisioningStatusInfo.errorInformation.reason}"

  - id: ENTRA-PROVISIONING-FAILURES-RECENT
    title: Provisioning to a SaaS app failed in the last week
    kind: broken
    category: HLT
    severity: medium
    entity: provisioning-event
    lens: both
    why: "Any other failure of the provisioning service to create, update or disable an object in the app (rejected mappings and matching conflicts have their own rules). One finding per app and error code; the latest event is the sample."
    fix: "Read the reason and the event's steps, fix the cause in the app, the mapping or the source object, then retry with provision on demand."
    refs: ["NIST-800-53:AC-2", "NIST-800-53:SI-4", "CIS-Controls-v8:6.1"]
    query:
      protocol: graph
      path: /auditLogs/provisioning
      filter: "activityDateTime gt {DAYS_AGO:7} and provisioningStatusInfo/status eq 'failure'"
      maxPages: 100
      key: "{jobId}|{provisioningStatusInfo.errorInformation.errorCode}"
      name: servicePrincipal.displayName
    each:
      any:
        - { field: provisioningStatusInfo.errorInformation, op: absent }
        - all:
            - { field: provisioningStatusInfo.errorInformation, op: notmatch, value: '(BadRequest|InvalidPayload|InvalidPatch|invalid.{0,30}(patch|payload|request|value)|status code 400\b)', threshold: entra.provisioning-payload-error-pattern }
            - { field: provisioningStatusInfo.errorInformation, op: notmatch, value: '(EntryConflict|Duplicate|AlreadyExists|already exists|status code 409\b)', threshold: entra.provisioning-conflict-error-pattern }
    evidence: "{servicePrincipal.displayName}{servicePrincipal[].displayName} (job {jobId}): {provisioningStatusInfo.errorInformation.errorCode} on {provisioningAction} of {sourceIdentity.identityType} {sourceIdentity.displayName} at {activityDateTime}: {provisioningStatusInfo.errorInformation.reason}"

  - id: ENTRA-PROVISIONING-SKIPPED-NOT-ENTITLED-RECENT
    title: Assigned user skipped by provisioning as "not effectively entitled"
    kind: broken
    category: IAM
    severity: medium
    entity: provisioning-event
    lens: both
    why: "Entra skips an object as not effectively entitled when its assignment to the app is broken or only carries the default-access role: the person was given the app, the job runs, and they still never arrive in it. Unassigned users are skipped for other reasons and are not matched by the default pattern."
    fix: "Remove and re-add the user's (or group's) assignment with a real app role; if the app has only the default-access role, assign the role the provisioning mapping expects."
    refs: ["NIST-800-53:AC-2", "CIS-Controls-v8:6.1"]
    query:
      protocol: graph
      path: /auditLogs/provisioning
      filter: "activityDateTime gt {DAYS_AGO:7} and provisioningStatusInfo/status eq 'skipped'"
      maxPages: 100
      key: "{jobId}|{sourceIdentity.id}"
      name: sourceIdentity.displayName
    each:
      any:
        - { field: 'provisioningSteps[].description', op: match, value: '(NotEffectivelyEntitled|not effectively entitled)', threshold: entra.provisioning-skip-not-entitled-pattern }
        - { field: 'provisioningSteps[].details', op: match, value: '(NotEffectivelyEntitled|not effectively entitled)', threshold: entra.provisioning-skip-not-entitled-pattern }
    evidence: "{servicePrincipal.displayName}{servicePrincipal[].displayName} (job {jobId}): {sourceIdentity.identityType} {sourceIdentity.displayName} skipped at {activityDateTime}: {provisioningSteps[].description}"
