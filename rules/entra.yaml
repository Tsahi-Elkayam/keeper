    fix: "Create (or switch on) a user risk policy: users All, resources All, user risk High, grant Require password change (with MFA), sign-in frequency every time."
    refs: [CIS-M365-5.2.2.6, "NIST-800-53:IA-5", "NIST-800-53:IR-4"]
