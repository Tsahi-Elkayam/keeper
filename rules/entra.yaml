          - { field: conditions.signInRiskLevels, op: empty }
          - { field: conditions.userRiskLevels, op: empty }
          - any:
              - { field: grantControls.builtInControls, op: contains, value: mfa }
              - { field: grantControls.authenticationStrength.id, op: exists }
          - any:
              - all:
                  - { field: conditions.users.includeUsers, op: contains, value: All }
                  - { field: conditions.users.excludeUsers, op: notcontains, value: GuestsOrExternalUsers }
                  - { field: conditions.users.excludeGuestsOrExternalUsers, op: absent }
              - { field: conditions.users.includeUsers, op: contains, value: GuestsOrExternalUsers }
              - { field: conditions.users.includeGuestsOrExternalUsers, op: exists }
