      op: lt
      value: 1
      where:
        all:
          - { field: state, op: eq, value: enabled }
          - { field: conditions.applications.includeApplications, op: contains, value: All }
          - { field: conditions.signInRiskLevels, op: empty }
          - { field: conditions.userRiskLevels, op: empty }
          - any:
              - { field: grantControls.builtInControls, op: contains, value: mfa }
              - { field: grantControls.authenticationStrength.id, op: exists }
          - any:
              - all:
                  - { field: conditions.users.includeUsers, op: contains, value: All }
                  - { field: conditions.users.excludeRoles, op: empty }
              - all:
                  - { field: conditions.users.includeRoles, op: contains, value: 62e90394-69f5-4237-9190-012177145e10 }
                  - { field: conditions.users.includeRoles, op: contains, value: e8611ab8-c189-46e8-94e1-60213ab1f814 }
                  - { field: conditions.users.includeRoles, op: contains, value: 7be44c8a-adaf-4e2a-84d6-ab2649e08a13 }
                  - { field: conditions.users.includeRoles, op: contains, value: 194ae4cb-b126-40b2-bd5b-6091b380977d }
                  - { field: conditions.users.includeRoles, op: contains, value: b1be1c3e-b65d-4f19-8427-f6fa0d97feb9 }
                  - { field: conditions.users.includeRoles, op: contains, value: 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3 }
                  - { field: conditions.users.includeRoles, op: contains, value: 158c047a-c907-4556-b7ef-446551a6b5f7 }
                  - { field: conditions.users.includeRoles, op: contains, value: 29232cdf-9323-42fd-ade2-1d097af3e4de }
                  - { field: conditions.users.includeRoles, op: contains, value: f28a1f50-f6e7-4571-818b-6a12f2af6b6c }
                  - { field: conditions.users.includeRoles, op: contains, value: fe930be7-5e62-47db-91af-98c3a49a38b1 }
                  - { field: conditions.users.includeRoles, op: contains, value: c4e39bd9-1100-46d3-8c65-fb160da0071f }
                  - { field: conditions.users.includeRoles, op: contains, value: 729827e3-9c14-49f7-bb1b-9608f156bbb8 }
                  - { field: conditions.users.includeRoles, op: contains, value: 966707d0-3269-4727-9be2-8c3a10f19b9d }
                  - { field: conditions.users.includeRoles, op: contains, value: b0f54661-2d74-4c50-afa3-1ec803f12efe }
                  - { field: conditions.users.includeRoles, op: contains, value: f2ef992c-3afb-46b9-b7cf-a126ee74c451 }
    evidence: "{count} enforced MFA policies cover all administrator roles, among {rows} policies"

  - id: ENTRA-CA-BASELINE-PHISHING-RESISTANT-ADMINS
    title: No enforced policy requires phishing-resistant MFA for Global Administrators
    kind: missing
    category: AUT
    severity: medium
    entity: tenant
    why: "Push, codes and phone methods can be relayed by adversary-in-the-middle phishing kits; only an authentication strength limited to passkeys (FIDO2), Windows Hello and multifactor certificates stops that. A policy counts if it targets the Global Administrator role (or all users) and its authentication strength allows only those methods."
    fix: "Require the built-in Phishing-resistant MFA authentication strength for admin roles (start with Global Administrator) once the admins have registered a passkey."
    refs: ["NIST-800-53:IA-2(6)", "NIST-800-53:IA-2(8)"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: state, op: eq, value: enabled }
          - { field: conditions.applications.includeApplications, op: contains, value: All }
          - any:
              - { field: conditions.users.includeRoles, op: contains, value: 62e90394-69f5-4237-9190-012177145e10 }
              - { field: conditions.users.includeUsers, op: contains, value: All }
          - { field: grantControls.authenticationStrength.allowedCombinations, op: notempty }
          - not: { field: grantControls.authenticationStrength.allowedCombinations, op: notmatch, value: '^(windowsHelloForBusiness|fido2|x509CertificateMultiFactor)$' }
    evidence: "{count} enforced phishing-resistant policies cover Global Administrators, among {rows} policies"

  - id: ENTRA-CA-BASELINE-LEGACY-AUTH-BLOCKED
    title: No enforced policy blocks legacy authentication for all users
    kind: missing
