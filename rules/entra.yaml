schema: keeper.rules/1
system: entra
name: Microsoft Entra ID
integration: graph

# Generic rules for any Microsoft Entra tenant, read through Microsoft Graph (GET only).
# Graph permissions per query: docs\backlog\microsoft-cloud.md, section "Graph permissions".
#
# Built-in Entra role template ids used below (Microsoft constants, identical in every tenant):
#   62e90394-69f5-4237-9190-012177145e10 Global Administrator
#   e8611ab8-c189-46e8-94e1-60213ab1f814 Privileged Role Administrator
#   7be44c8a-adaf-4e2a-84d6-ab2649e08a13 Privileged Authentication Administrator
#   194ae4cb-b126-40b2-bd5b-6091b380977d Security Administrator
#   8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2 Hybrid Identity Administrator
#   b1be1c3e-b65d-4f19-8427-f6fa0d97feb9 Conditional Access Administrator
#   9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3 Application Administrator
#   158c047a-c907-4556-b7ef-446551a6b5f7 Cloud Application Administrator
#   be2f45a1-457d-42af-a067-6ec1fa63bc45 External Identity Provider Administrator
#   8329153b-31d0-4727-b945-745eb3bc5f31 Domain Name Administrator
#   3a2c62db-5318-420d-8d74-23affee5d9d5 Intune Administrator
#   29232cdf-9323-42fd-ade2-1d097af3e4de Exchange Administrator
#   f28a1f50-f6e7-4571-818b-6a12f2af6b6c SharePoint Administrator
#   69091246-20e8-4a56-aa4d-066075b2a7a8 Teams Administrator
#   fe930be7-5e62-47db-91af-98c3a49a38b1 User Administrator
#   c4e39bd9-1100-46d3-8c65-fb160da0071f Authentication Administrator
#   729827e3-9c14-49f7-bb1b-9608f156bbb8 Helpdesk Administrator
#   966707d0-3269-4727-9be2-8c3a10f19b9d Password Administrator
#   b0f54661-2d74-4c50-afa3-1ec803f12efe Billing Administrator
#   fdd7a751-b60b-444a-984c-02652fe8fa1c Groups Administrator
#   f2ef992c-3afb-46b9-b7cf-a126ee74c451 Global Reader
# Tier 0 (threshold entra.tier0-role-ids) = the first eleven: each one is a path to full tenant takeover.
# Privileged (threshold entra.privileged-role-ids) = all of the above.
#
# The user inventory query (rules ENTRA-USER-INACTIVE and the sign-in rules) is shared with
# m365.yaml and is the Entra side of the AD/Entra join on onPremisesSecurityIdentifier.

defaults:
  lens: security
  refresh: 1d

rules:
  # ======================================================================= privileged roles ===
  - id: ENTRA-ROLE-GA-TOO-MANY
    title: More Global Administrator assignments than the tenant allows
    kind: misconfigured
    category: IAM
    severity: high
    entity: tenant
    why: "Every Global Administrator is a full-tenant takeover path. Active assignments above a small number usually mean daily accounts or service identities hold the role."
    fix: "Keep two to four Global Administrators (emergency-access accounts included); move the rest to narrower roles or to eligible PIM assignments."
    refs: [CIS-M365-1.1.3, "NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleAssignments
      filter: "roleDefinitionId eq '62e90394-69f5-4237-9190-012177145e10'"
      key: principalId
    count: { op: gt, value: 4, threshold: entra.global-admin-max }
    evidence: "{count} active Global Administrator assignments (principals: {sample})"

  - id: ENTRA-ROLE-GA-TOO-FEW
    title: Fewer than two active Global Administrator assignments
    kind: misconfigured
    category: AVL
    severity: medium
    entity: tenant
    lens: both
    why: "With a single active Global Administrator (or none outside PIM) one lost device, one expired password or one PIM outage locks the tenant out of its own administration."
    fix: "Keep at least two permanent, cloud-only emergency-access accounts with Global Administrator, excluded from Conditional Access and protected by phishing-resistant credentials kept offline."
    refs: [CIS-M365-1.1.2, CIS-M365-1.1.3, "NIST-800-53:CP-2"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleAssignments
      filter: "roleDefinitionId eq '62e90394-69f5-4237-9190-012177145e10'"
      key: principalId
    count: { op: lt, value: 2, threshold: entra.global-admin-min }
    evidence: "only {count} active Global Administrator assignment(s)"

  - id: ENTRA-ROLE-GA-ELIGIBLE-TOO-MANY
    title: More eligible Global Administrators than the tenant allows
    kind: misconfigured
    category: IAM
    severity: medium
    entity: tenant
    why: "Each eligible Global Administrator can activate the role at will; a long eligible list is as wide a takeover surface as permanent assignments, just one step later. Needs Entra ID P2."
    fix: "Reduce eligibility to the few people who need the role weekly and give the others a narrower role."
    refs: [CIS-M365-1.1.3, "NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleEligibilityScheduleInstances
      filter: "roleDefinitionId eq '62e90394-69f5-4237-9190-012177145e10'"
      key: principalId
    count: { op: gt, value: 4, threshold: entra.global-admin-eligible-max }
    evidence: "{count} eligible Global Administrator assignments (principals: {sample})"

  - id: ENTRA-ROLE-PRA-TOO-MANY
    title: More Privileged Role Administrators than the tenant allows
    kind: misconfigured
    category: IAM
    severity: high
    entity: tenant
    why: "A Privileged Role Administrator can grant any role, including Global Administrator, to anyone."
    fix: "Limit the role to one or two named administrators, preferably eligible through PIM with approval."
    refs: ["NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleAssignments
      filter: "roleDefinitionId eq 'e8611ab8-c189-46e8-94e1-60213ab1f814'"
      key: principalId
    count: { op: gt, value: 2, threshold: entra.privileged-role-admin-max }
    evidence: "{count} active Privileged Role Administrator assignments (principals: {sample})"

  - id: ENTRA-ROLE-PERMANENT-TIER0
    title: Tier-0 role held permanently instead of through PIM
    kind: misconfigured
    category: IAM
    severity: high
    entity: role-assignment
    why: "A permanent (non-PIM) assignment of a takeover-capable role is usable at every moment by whoever controls the account; just-in-time activation narrows that window to minutes. Needs Entra ID P2 for PIM."
    fix: "Convert the assignment to an eligible PIM assignment. Keep only the emergency-access accounts permanent and record them as an accepted exception."
    refs: ["NIST-800-53:AC-6(5)", "NIST-800-53:AC-2(7)"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleAssignmentScheduleInstances
      filter: "assignmentType eq 'Assigned'"
      expand: principal
      key: id
      name: principal.displayName
    each:
      all:
        - field: roleDefinitionId
          op: in
          threshold: entra.tier0-role-ids
          value: [62e90394-69f5-4237-9190-012177145e10, e8611ab8-c189-46e8-94e1-60213ab1f814, 7be44c8a-adaf-4e2a-84d6-ab2649e08a13, 194ae4cb-b126-40b2-bd5b-6091b380977d, 8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2, b1be1c3e-b65d-4f19-8427-f6fa0d97feb9, 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3, 158c047a-c907-4556-b7ef-446551a6b5f7, be2f45a1-457d-42af-a067-6ec1fa63bc45, 8329153b-31d0-4727-b945-745eb3bc5f31, 3a2c62db-5318-420d-8d74-23affee5d9d5]
        - { field: memberType, op: eq, value: Direct }
        - { field: endDateTime, op: absent }
    evidence: "{principal.displayName} {principal.userPrincipalName} holds role {roleDefinitionId} permanently (scope {directoryScopeId})"

  - id: ENTRA-ROLE-ELIGIBLE-NO-END
    title: Tier-0 role eligibility that never expires
    kind: misconfigured
    category: IAM
    severity: low
    entity: role-eligibility
    why: "An eligibility without an end date outlives the reason it was granted; nobody re-decides it. Needs Entra ID P2."
    fix: "Give eligible assignments of tier-0 roles an end date (for example one year) and renew them through an access review."
    refs: ["NIST-800-53:AC-2(3)", "NIST-800-53:AC-6(7)"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleEligibilitySchedules
      expand: principal
      key: id
      name: principal.displayName
    each:
      all:
        - field: roleDefinitionId
          op: in
          threshold: entra.tier0-role-ids
          value: [62e90394-69f5-4237-9190-012177145e10, e8611ab8-c189-46e8-94e1-60213ab1f814, 7be44c8a-adaf-4e2a-84d6-ab2649e08a13, 194ae4cb-b126-40b2-bd5b-6091b380977d, 8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2, b1be1c3e-b65d-4f19-8427-f6fa0d97feb9, 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3, 158c047a-c907-4556-b7ef-446551a6b5f7, be2f45a1-457d-42af-a067-6ec1fa63bc45, 8329153b-31d0-4727-b945-745eb3bc5f31, 3a2c62db-5318-420d-8d74-23affee5d9d5]
        - { field: scheduleInfo.expiration.type, op: eq, value: noExpiration }
    evidence: "{principal.displayName} {principal.userPrincipalName} is eligible for role {roleDefinitionId} with no end date"

  - id: ENTRA-ROLE-GUEST-HOLDER
    title: Guest account holds a directory role
    kind: misconfigured
    category: IAM
    severity: high
    entity: role-assignment
    why: "A guest is governed by another organisation's joiner/leaver process and credentials; a directory role in this tenant on such an account is outside your control."
    fix: "Remove the role from the guest; give the person a member account in this tenant if they really administer it."
    refs: ["NIST-800-53:AC-6(5)", "NIST-800-53:AC-2(9)"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleAssignments
      expand: principal
      key: id
      name: principal.displayName
    each: { field: principal.userType, op: eq, value: Guest }
    evidence: "guest {principal.userPrincipalName} holds role {roleDefinitionId}"

  - id: ENTRA-ROLE-DISABLED-HOLDER
    title: Disabled account still holds a directory role
    kind: misconfigured
    category: HYG
    severity: medium
    entity: role-assignment
    lens: both
    why: "A disabled account that keeps its role gets the role back the moment someone re-enables it, and it hides who really administers the tenant."
    fix: "Remove role assignments from disabled accounts as part of the leaver process."
    refs: ["NIST-800-53:AC-2(3)"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleAssignments
      expand: principal
      key: id
      name: principal.displayName
    each: { field: principal.accountEnabled, op: eq, value: false }
    evidence: "disabled {principal.userPrincipalName}{principal.appId} holds role {roleDefinitionId}"

  - id: ENTRA-ROLE-SYNCED-HOLDER
    title: Account synchronised from on-premises AD holds a privileged role
    kind: misconfigured
    category: IAM
    severity: high
    entity: role-assignment
    why: "Whoever compromises on-premises AD controls a synchronised account's password and attributes; a privileged cloud role on it turns an AD breach into a cloud breach."
    fix: "Give administrators separate cloud-only accounts for Entra roles and remove roles from synchronised accounts."
    refs: [CIS-M365-1.1.1, "NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleAssignments
      expand: principal
      key: id
      name: principal.displayName
    each:
      all:
        - field: roleDefinitionId
          op: in
          threshold: entra.privileged-role-ids
          value: [62e90394-69f5-4237-9190-012177145e10, e8611ab8-c189-46e8-94e1-60213ab1f814, 7be44c8a-adaf-4e2a-84d6-ab2649e08a13, 194ae4cb-b126-40b2-bd5b-6091b380977d, 8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2, b1be1c3e-b65d-4f19-8427-f6fa0d97feb9, 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3, 158c047a-c907-4556-b7ef-446551a6b5f7, be2f45a1-457d-42af-a067-6ec1fa63bc45, 8329153b-31d0-4727-b945-745eb3bc5f31, 3a2c62db-5318-420d-8d74-23affee5d9d5, 29232cdf-9323-42fd-ade2-1d097af3e4de, f28a1f50-f6e7-4571-818b-6a12f2af6b6c, 69091246-20e8-4a56-aa4d-066075b2a7a8, fe930be7-5e62-47db-91af-98c3a49a38b1, c4e39bd9-1100-46d3-8c65-fb160da0071f, 729827e3-9c14-49f7-bb1b-9608f156bbb8, 966707d0-3269-4727-9be2-8c3a10f19b9d, b0f54661-2d74-4c50-afa3-1ec803f12efe, fdd7a751-b60b-444a-984c-02652fe8fa1c, f2ef992c-3afb-46b9-b7cf-a126ee74c451]
        - { field: principal.onPremisesSyncEnabled, op: eq, value: true }
    evidence: "synchronised account {principal.userPrincipalName} holds role {roleDefinitionId}"

  - id: ENTRA-ROLE-LICENSED-HOLDER
    title: Privileged role holder carries licences
    kind: misconfigured
    category: IAM
    severity: low
    entity: role-assignment
    why: "An admin account with a mailbox and Teams is phished, browsed with and exposed like a daily account; a separate, unlicensed (or Entra-only licensed) admin identity is much harder to reach."
    fix: "Use dedicated admin accounts without productivity licences; keep only identity licences (for example Entra ID P2) on them."
    refs: [CIS-M365-1.1.4, "NIST-800-53:AC-6(2)"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleAssignments
      expand: principal
      key: id
      name: principal.displayName
    each:
      all:
        - field: roleDefinitionId
          op: in
          threshold: entra.privileged-role-ids
          value: [62e90394-69f5-4237-9190-012177145e10, e8611ab8-c189-46e8-94e1-60213ab1f814, 7be44c8a-adaf-4e2a-84d6-ab2649e08a13, 194ae4cb-b126-40b2-bd5b-6091b380977d, 8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2, b1be1c3e-b65d-4f19-8427-f6fa0d97feb9, 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3, 158c047a-c907-4556-b7ef-446551a6b5f7, be2f45a1-457d-42af-a067-6ec1fa63bc45, 8329153b-31d0-4727-b945-745eb3bc5f31, 3a2c62db-5318-420d-8d74-23affee5d9d5, 29232cdf-9323-42fd-ade2-1d097af3e4de, f28a1f50-f6e7-4571-818b-6a12f2af6b6c, 69091246-20e8-4a56-aa4d-066075b2a7a8, fe930be7-5e62-47db-91af-98c3a49a38b1, c4e39bd9-1100-46d3-8c65-fb160da0071f, 729827e3-9c14-49f7-bb1b-9608f156bbb8, 966707d0-3269-4727-9be2-8c3a10f19b9d, b0f54661-2d74-4c50-afa3-1ec803f12efe, fdd7a751-b60b-444a-984c-02652fe8fa1c, f2ef992c-3afb-46b9-b7cf-a126ee74c451]
        - { field: principal.assignedLicenses, op: size-gt, value: 0 }
    evidence: "{principal.userPrincipalName} holds role {roleDefinitionId} and licences {principal.assignedLicenses[].skuId}"

  - id: ENTRA-ROLE-SERVICE-PRINCIPAL-TIER0
    title: Service principal holds a tier-0 directory role
    kind: misconfigured
    category: IAM
    severity: medium
    entity: role-assignment
    why: "Anyone who can add a credential to the application (its owners, Application Administrators) acts with the role, without MFA or Conditional Access."
    fix: "Replace the directory role with the narrowest Graph application permission that does the job, or document the need and lock down the app's owners and credentials."
    refs: ["NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleAssignments
      expand: principal
      key: id
      name: principal.displayName
    each:
      all:
        - field: roleDefinitionId
          op: in
          threshold: entra.tier0-role-ids
          value: [62e90394-69f5-4237-9190-012177145e10, e8611ab8-c189-46e8-94e1-60213ab1f814, 7be44c8a-adaf-4e2a-84d6-ab2649e08a13, 194ae4cb-b126-40b2-bd5b-6091b380977d, 8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2, b1be1c3e-b65d-4f19-8427-f6fa0d97feb9, 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3, 158c047a-c907-4556-b7ef-446551a6b5f7, be2f45a1-457d-42af-a067-6ec1fa63bc45, 8329153b-31d0-4727-b945-745eb3bc5f31, 3a2c62db-5318-420d-8d74-23affee5d9d5]
        - { field: principal.appId, op: exists }
    evidence: "service principal {principal.displayName} (appId {principal.appId}) holds role {roleDefinitionId}"

  - id: ENTRA-PIM-NO-APPROVAL
    title: Activating the most powerful roles needs no approval
    kind: misconfigured
    category: IAM
    severity: medium
    entity: role-policy
    why: "Without approval a stolen eligible account activates Global Administrator or Privileged Role Administrator on its own; a second person in the loop stops that. Needs Entra ID P2."
    fix: "In PIM role settings require approval (by a named approver group) to activate these roles."
    refs: [CIS-M365-5.3.4, CIS-M365-5.3.5, "NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /policies/roleManagementPolicyAssignments
      filter: "scopeId eq '/' and scopeType eq 'DirectoryRole'"
      expand: policy($expand=rules)
      key: id
      name: roleDefinitionId
    each:
      all:
        - field: roleDefinitionId
          op: in
          threshold: entra.approval-required-role-ids
          value: [62e90394-69f5-4237-9190-012177145e10, e8611ab8-c189-46e8-94e1-60213ab1f814]
        - { field: 'policy.rules[].setting.isApprovalRequired', op: eq, value: false }
    evidence: "role {roleDefinitionId}: activation approval not required"

  - id: ENTRA-PIM-ALERT-ACTIVE
    title: PIM security alert is active
    kind: misconfigured
    category: IAM
    severity:
      field: alertDefinition.severityLevel
      map: { high: high, medium: medium, low: low, informational: info }
      default: medium
    entity: pim-alert
    why: "PIM raises alerts for stale privileged accounts, roles assigned outside PIM, too many Global Administrators and activations without MFA; an active alert is a known gap nobody closed. Beta API (the alerts exist only in beta); needs Entra ID P2."
    fix: "Open the alert in PIM, remediate the incidents it lists, and keep the alert configuration enabled."
    refs: ["NIST-800-53:AC-2(3)", "NIST-800-53:AC-6(7)"]
    query:
      protocol: graph
      version: beta
      path: /identityGovernance/roleManagementAlerts/alerts
      filter: "scopeId eq '/' and scopeType eq 'DirectoryRole'"
      expand: alertDefinition
      key: id
      name: alertDefinition.displayName
    each:
      all:
        - { field: isActive, op: eq, value: true }
        - { field: incidentCount, op: gt, value: 0 }
    evidence: "{alertDefinition.displayName}: {incidentCount} incident(s), last scan {lastScannedDateTime}"

  - id: ENTRA-ROLE-CUSTOM-DANGEROUS-ACTIONS
    title: Custom directory role can manage credentials, passwords or role membership
    kind: misconfigured
    category: IAM
    severity: high
    entity: role-definition
    why: "A custom role that may add app credentials or owners, reset passwords or authentication methods, grant app roles or change the members of groups is a path to tenant takeover, yet it never shows up in a review of the built-in admin roles. Attack-path tools walk exactly these actions."
    fix: "Cut the role down to the actions the job needs. If it really needs these actions, treat every holder as tier 0: PIM eligibility, phishing-resistant MFA, separate admin accounts. Tune the action pattern with the threshold."
    refs: ["MITRE-ATTACK:T1098.003", "NIST-800-53:AC-6(5)", "CIS-Controls-v8:6.8"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleDefinitions
      filter: "isBuiltIn eq false"
      key: id
      name: displayName
    each:
      all:
        - { field: isEnabled, op: eq, value: true }
        - field: 'rolePermissions[].allowedResourceActions'
          op: match
          threshold: entra.custom-role-dangerous-action-pattern
          value: '/(applications|servicePrincipals)/(credentials|owners)/update|/servicePrincipals/synchronizationCredentials/|/servicePrincipals/appRoleAssignedTo/update|/users/password/update|/users/authenticationMethods/|/roleAssignments/|/roleDefinitions/|/groups/(members|owners)/update|/allTasks$'
    evidence: "{displayName}: allows {rolePermissions[].allowedResourceActions}"

  - id: ENTRA-ROLE-HOLDER-NAMING
    title: Directory role held by an account outside the admin-account naming convention
    kind: misconfigured
    category: IAM
    severity: low
    entity: role-assignment
    why: "A role on an account that does not follow the organisation's admin-account convention is usually a daily account (mailbox, browsing, Teams) that also carries administrative power. The convention is tenant-specific: put it in the threshold as a pattern; until then the rule checks nothing. Service principals and the emergency-access accounts (entra.breakglass-user-ids) are left out."
    fix: "Move the role to a dedicated admin account that follows the convention, or rename the account if it already is a dedicated one."
    refs: ["NIST-800-53:AC-6(2)", "NIST-800-53:IA-4", "CIS-Controls-v8:5.4"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleAssignments
      expand: principal
      key: id
      name: principal.displayName
    each:
      all:
        - { field: principal.userPrincipalName, op: exists }
        - { field: principal.userPrincipalName, op: notmatch, value: '.*', threshold: entra.admin-account-pattern }
        - field: principalId
          op: notin
          threshold: entra.breakglass-user-ids
          value: []
    evidence: "{principal.userPrincipalName} holds role {roleDefinitionId} (scope {directoryScopeId})"

  - id: ENTRA-ROLE-AU-SCOPED-ASSIGNMENT
    title: Directory role scoped to an administrative unit or a single object
    kind: misconfigured
    category: IAM
    severity: info
    entity: role-assignment
    why: "A role scoped below the tenant (an administrative unit, one application, one group) lets its holder reset passwords, manage members or change credentials inside that scope; such grants are invisible in the tenant-wide role review. A review list: accept each scope that is documented."
    fix: "Confirm each scoped holder and scope with its owner; remove the ones nobody can explain, and keep admin accounts in a restricted-management unit so scoped admins cannot reach them."
    refs: ["NIST-800-53:AC-6", "NIST-800-53:AC-2(7)"]
    query:
      protocol: graph
      path: /roleManagement/directory/roleAssignments
      expand: principal
      key: id
      name: principal.displayName
    each: { field: directoryScopeId, op: ne, value: '/' }
    evidence: "{principal.displayName} {principal.userPrincipalName} holds role {roleDefinitionId} on scope {directoryScopeId}"

  # Workload administrator role template ids (Microsoft constants, threshold entra.workload-admin-role-ids):
  #   11648597-926c-4cf3-9c36-bcebb0ba8dcc Power Platform Administrator
  #   44367163-eba1-44c3-98af-f5787879f96a Dynamics 365 Administrator
  #   a9ea8996-122f-4c74-9520-8edcd192826c Fabric Administrator
  - id: PP-ADMIN-ROLE-PERMANENT
    title: Power Platform, Dynamics 365 or Fabric administrator role held permanently
    kind: misconfigured
    category: IAM
    severity: medium
    entity: role-assignment
    why: "These roles control every Power Platform environment, every data-loss policy and the whole BI service, yet they are not on the tier-0 list, so the permanent tier-0 rule never sees them. A permanent (non-PIM) assignment is usable at every moment by whoever controls the account. Needs Entra ID P2 for PIM."
    fix: "Convert the holders to eligible PIM assignments with approval; keep at most one documented permanent holder."
    refs: ["NIST-800-53:AC-6(5)", "NIST-800-53:AC-2(7)", "CIS-Controls-v8:5.4", CIS-M365:5.3.1]
    query:
      protocol: graph
      path: /roleManagement/directory/roleAssignmentScheduleInstances
      filter: "assignmentType eq 'Assigned'"
      expand: principal
      key: id
      name: principal.displayName
    each:
      all:
        - field: roleDefinitionId
          op: in
          threshold: entra.workload-admin-role-ids
          value: [11648597-926c-4cf3-9c36-bcebb0ba8dcc, 44367163-eba1-44c3-98af-f5787879f96a, a9ea8996-122f-4c74-9520-8edcd192826c]
        - { field: memberType, op: eq, value: Direct }
        - { field: endDateTime, op: absent }
    evidence: "{principal.displayName} {principal.userPrincipalName} holds workload admin role {roleDefinitionId} permanently"

  # ------------------------------------------------------------- PIM role settings, per rule ---
  # One request per directory role's PIM policy: the policy assignments (scope '/', DirectoryRole) give
  # policyId and roleDefinitionId, and /policies/roleManagementPolicies/{policyId}/rules returns one row
  # per PIM rule (Expiration_EndUser_Assignment, Enablement_EndUser_Assignment, Approval_EndUser_Assignment,
  # Expiration_Admin_Eligibility, ...) with the role as parent. Needs Entra ID P2 for PIM.
  - id: ENTRA-PIM-ACTIVATION-NO-MFA
    title: Activating a privileged role in PIM asks for no MFA
    kind: misconfigured
    category: AUT
    severity:
      field: parent.roleDefinitionId
      map: { 62e90394-69f5-4237-9190-012177145e10: high, e8611ab8-c189-46e8-94e1-60213ab1f814: high, 7be44c8a-adaf-4e2a-84d6-ab2649e08a13: high, 194ae4cb-b126-40b2-bd5b-6091b380977d: high, 8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2: high, b1be1c3e-b65d-4f19-8427-f6fa0d97feb9: high, 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3: high, 158c047a-c907-4556-b7ef-446551a6b5f7: high, be2f45a1-457d-42af-a067-6ec1fa63bc45: high, 8329153b-31d0-4727-b945-745eb3bc5f31: high, 3a2c62db-5318-420d-8d74-23affee5d9d5: high }
      default: medium
    entity: pim-rule
    why: "Without MFA on activation, a stolen password of an eligible account is enough to switch the role on; PIM then adds only a delay. Tier-0 roles are high. A role that requires an authentication context instead of MFA (AuthenticationContext_EndUser_Assignment) also shows here: accept it by override."
    fix: "In the role's PIM settings require Azure MFA (or a phishing-resistant authentication context) on activation."
    refs: ["NIST-800-53:IA-2(1)", "NIST-800-53:AC-6(5)", "MITRE-ATTACK:T1098.003"]
    query:
      protocol: graph
      path: /policies/roleManagementPolicies/{policyId}/rules
      for_each:
        path: /policies/roleManagementPolicyAssignments
        filter: "scopeId eq '/' and scopeType eq 'DirectoryRole'"
        select: [id, policyId, roleDefinitionId]
        field: policyId
        max: 300
      key: "{parent.roleDefinitionId}|{id}"
      name: parent.roleDefinitionId
    each:
      all:
        - { field: id, op: eq, value: Enablement_EndUser_Assignment }
        - field: parent.roleDefinitionId
          op: in
          threshold: entra.privileged-role-ids
          value: [62e90394-69f5-4237-9190-012177145e10, e8611ab8-c189-46e8-94e1-60213ab1f814, 7be44c8a-adaf-4e2a-84d6-ab2649e08a13, 194ae4cb-b126-40b2-bd5b-6091b380977d, 8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2, b1be1c3e-b65d-4f19-8427-f6fa0d97feb9, 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3, 158c047a-c907-4556-b7ef-446551a6b5f7, be2f45a1-457d-42af-a067-6ec1fa63bc45, 8329153b-31d0-4727-b945-745eb3bc5f31, 3a2c62db-5318-420d-8d74-23affee5d9d5, 29232cdf-9323-42fd-ade2-1d097af3e4de, f28a1f50-f6e7-4571-818b-6a12f2af6b6c, 69091246-20e8-4a56-aa4d-066075b2a7a8, fe930be7-5e62-47db-91af-98c3a49a38b1, c4e39bd9-1100-46d3-8c65-fb160da0071f, 729827e3-9c14-49f7-bb1b-9608f156bbb8, 966707d0-3269-4727-9be2-8c3a10f19b9d, b0f54661-2d74-4c50-afa3-1ec803f12efe, fdd7a751-b60b-444a-984c-02652fe8fa1c, f2ef992c-3afb-46b9-b7cf-a126ee74c451]
        - { field: enabledRules, op: notcontains, value: MultiFactorAuthentication }
    evidence: "role {parent.roleDefinitionId}: activation requires {enabledRules}"

  - id: ENTRA-PIM-ACTIVATION-NO-JUSTIFICATION
    title: Activating a privileged role in PIM needs no justification
    kind: misconfigured
    category: IAM
    severity: low
    entity: pim-rule
    why: "Without a justification an activation leaves no reason in the audit trail, so a review cannot tell routine work from misuse."
    fix: "In the role's PIM settings require a justification (and a ticket number where the change process has one) on activation."
    refs: ["NIST-800-53:AU-3", "NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /policies/roleManagementPolicies/{policyId}/rules
      for_each:
        path: /policies/roleManagementPolicyAssignments
        filter: "scopeId eq '/' and scopeType eq 'DirectoryRole'"
        select: [id, policyId, roleDefinitionId]
        field: policyId
        max: 300
      key: "{parent.roleDefinitionId}|{id}"
      name: parent.roleDefinitionId
    each:
      all:
        - { field: id, op: eq, value: Enablement_EndUser_Assignment }
        - field: parent.roleDefinitionId
          op: in
          threshold: entra.privileged-role-ids
          value: [62e90394-69f5-4237-9190-012177145e10, e8611ab8-c189-46e8-94e1-60213ab1f814, 7be44c8a-adaf-4e2a-84d6-ab2649e08a13, 194ae4cb-b126-40b2-bd5b-6091b380977d, 8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2, b1be1c3e-b65d-4f19-8427-f6fa0d97feb9, 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3, 158c047a-c907-4556-b7ef-446551a6b5f7, be2f45a1-457d-42af-a067-6ec1fa63bc45, 8329153b-31d0-4727-b945-745eb3bc5f31, 3a2c62db-5318-420d-8d74-23affee5d9d5, 29232cdf-9323-42fd-ade2-1d097af3e4de, f28a1f50-f6e7-4571-818b-6a12f2af6b6c, 69091246-20e8-4a56-aa4d-066075b2a7a8, fe930be7-5e62-47db-91af-98c3a49a38b1, c4e39bd9-1100-46d3-8c65-fb160da0071f, 729827e3-9c14-49f7-bb1b-9608f156bbb8, 966707d0-3269-4727-9be2-8c3a10f19b9d, b0f54661-2d74-4c50-afa3-1ec803f12efe, fdd7a751-b60b-444a-984c-02652fe8fa1c, f2ef992c-3afb-46b9-b7cf-a126ee74c451]
        - { field: enabledRules, op: notcontains, value: Justification }
    evidence: "role {parent.roleDefinitionId}: activation requires {enabledRules}"

  - id: ENTRA-PIM-ACTIVATION-LONG
    title: A privileged role can be activated for more than eight hours
    kind: misconfigured
    category: IAM
    severity:
      field: parent.roleDefinitionId
      map: { 62e90394-69f5-4237-9190-012177145e10: medium, e8611ab8-c189-46e8-94e1-60213ab1f814: medium, 7be44c8a-adaf-4e2a-84d6-ab2649e08a13: medium, 194ae4cb-b126-40b2-bd5b-6091b380977d: medium, 8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2: medium, b1be1c3e-b65d-4f19-8427-f6fa0d97feb9: medium, 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3: medium, 158c047a-c907-4556-b7ef-446551a6b5f7: medium, be2f45a1-457d-42af-a067-6ec1fa63bc45: medium, 8329153b-31d0-4727-b945-745eb3bc5f31: medium, 3a2c62db-5318-420d-8d74-23affee5d9d5: medium }
      default: low
    entity: pim-rule
    why: "Each activation stays usable for its whole duration; one longer than a working day leaves the role on overnight for whoever holds the session. The maximum is an ISO 8601 duration (PT8H); the rule accepts anything up to eight hours by pattern (tune it with the threshold)."
    fix: "Cap the activation maximum duration at a few hours (tier-0 roles one to four) in the role's PIM settings."
    refs: ["NIST-800-53:AC-6(5)", "NIST-800-53:AC-2(7)"]
    query:
      protocol: graph
      path: /policies/roleManagementPolicies/{policyId}/rules
      for_each:
        path: /policies/roleManagementPolicyAssignments
        filter: "scopeId eq '/' and scopeType eq 'DirectoryRole'"
        select: [id, policyId, roleDefinitionId]
        field: policyId
        max: 300
      key: "{parent.roleDefinitionId}|{id}"
      name: parent.roleDefinitionId
    each:
      all:
        - { field: id, op: eq, value: Expiration_EndUser_Assignment }
        - field: parent.roleDefinitionId
          op: in
          threshold: entra.privileged-role-ids
          value: [62e90394-69f5-4237-9190-012177145e10, e8611ab8-c189-46e8-94e1-60213ab1f814, 7be44c8a-adaf-4e2a-84d6-ab2649e08a13, 194ae4cb-b126-40b2-bd5b-6091b380977d, 8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2, b1be1c3e-b65d-4f19-8427-f6fa0d97feb9, 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3, 158c047a-c907-4556-b7ef-446551a6b5f7, be2f45a1-457d-42af-a067-6ec1fa63bc45, 8329153b-31d0-4727-b945-745eb3bc5f31, 3a2c62db-5318-420d-8d74-23affee5d9d5, 29232cdf-9323-42fd-ade2-1d097af3e4de, f28a1f50-f6e7-4571-818b-6a12f2af6b6c, 69091246-20e8-4a56-aa4d-066075b2a7a8, fe930be7-5e62-47db-91af-98c3a49a38b1, c4e39bd9-1100-46d3-8c65-fb160da0071f, 729827e3-9c14-49f7-bb1b-9608f156bbb8, 966707d0-3269-4727-9be2-8c3a10f19b9d, b0f54661-2d74-4c50-afa3-1ec803f12efe, fdd7a751-b60b-444a-984c-02652fe8fa1c, f2ef992c-3afb-46b9-b7cf-a126ee74c451]
        - { field: maximumDuration, op: notmatch, value: '^PT(([1-7]H)?([1-9]|[1-5][0-9])M|[1-8]H)$', threshold: entra.pim-activation-ok-pattern }
    evidence: "role {parent.roleDefinitionId}: activation lasts up to {maximumDuration}"

  - id: ENTRA-PIM-ELIGIBILITY-PERMANENT-ALLOWED
    title: PIM allows permanent eligibility for a tier-0 role
    kind: misconfigured
    category: IAM
    severity: medium
    entity: pim-rule
    why: "When the role's settings do not require eligible assignments to expire, nobody ever re-decides who may activate the most powerful roles; ENTRA-ROLE-ELIGIBLE-NO-END lists the eligibilities that already have no end date, this finds the setting that allows them."
    fix: "In the role's PIM settings turn off 'allow permanent eligible assignment' and set a maximum eligibility (for example one year), renewed through an access review."
    refs: ["NIST-800-53:AC-2(3)", "NIST-800-53:AC-6(7)"]
    query:
      protocol: graph
      path: /policies/roleManagementPolicies/{policyId}/rules
      for_each:
        path: /policies/roleManagementPolicyAssignments
        filter: "scopeId eq '/' and scopeType eq 'DirectoryRole'"
        select: [id, policyId, roleDefinitionId]
        field: policyId
        max: 300
      key: "{parent.roleDefinitionId}|{id}"
      name: parent.roleDefinitionId
    each:
      all:
        - { field: id, op: eq, value: Expiration_Admin_Eligibility }
        - field: parent.roleDefinitionId
          op: in
          threshold: entra.tier0-role-ids
          value: [62e90394-69f5-4237-9190-012177145e10, e8611ab8-c189-46e8-94e1-60213ab1f814, 7be44c8a-adaf-4e2a-84d6-ab2649e08a13, 194ae4cb-b126-40b2-bd5b-6091b380977d, 8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2, b1be1c3e-b65d-4f19-8427-f6fa0d97feb9, 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3, 158c047a-c907-4556-b7ef-446551a6b5f7, be2f45a1-457d-42af-a067-6ec1fa63bc45, 8329153b-31d0-4727-b945-745eb3bc5f31, 3a2c62db-5318-420d-8d74-23affee5d9d5]
        - { field: isExpirationRequired, op: eq, value: false }
    evidence: "role {parent.roleDefinitionId}: eligible assignments may be permanent (maximum {maximumDuration})"

  # ==================================================================== Conditional Access ===
  - id: ENTRA-CA-NONE
    title: The tenant has no Conditional Access policy
    kind: missing
    category: AUT
    severity: high
    entity: tenant
    why: "Without Conditional Access (and with security defaults off) nothing forces MFA, blocks legacy protocols or reacts to risk. Needs Entra ID P1."
    fix: "Create at least: MFA for all users, MFA for admin roles, block legacy authentication, block device-code flow; or keep security defaults on if the tenant has no P1."
    refs: [CIS-M365-5.2.2.2, "NIST-800-53:IA-2(1)"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    count: none
    evidence: "no Conditional Access policy returned"

  - id: ENTRA-CA-REPORT-ONLY-STALE
    title: Conditional Access policy left in report-only mode
    kind: misconfigured
    category: AUT
    severity: low
    entity: conditional-access-policy
    why: "Report-only is a test phase. A policy left there for weeks protects nothing while looking like coverage in every review."
    fix: "Read its sign-in impact, then switch it on or delete it."
    refs: ["NIST-800-53:CM-3"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    each:
      all:
        - { field: state, op: eq, value: enabledForReportingButNotEnforced }
        - any:
            - { field: modifiedDateTime, op: age-gt, value: 30, threshold: entra.ca-report-only-days }
            - all:
                - { field: modifiedDateTime, op: absent }
                - { field: createdDateTime, op: age-gt, value: 30, threshold: entra.ca-report-only-days }
    evidence: "{displayName}: report-only, last changed {modifiedDateTime} (created {createdDateTime})"

  - id: ENTRA-CA-DISABLED-STALE
    title: Disabled Conditional Access policy kept for months
    kind: misconfigured
    category: HYG
    severity: low
    entity: conditional-access-policy
    lens: both
    why: "Old disabled policies confuse reviewers and get switched back on by mistake."
    fix: "Export the policy definition for the record and delete it."
    refs: ["NIST-800-53:CM-3"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    each:
      all:
        - { field: state, op: eq, value: disabled }
        - any:
            - { field: modifiedDateTime, op: age-gt, value: 90, threshold: entra.ca-disabled-days }
            - all:
                - { field: modifiedDateTime, op: absent }
                - { field: createdDateTime, op: age-gt, value: 90, threshold: entra.ca-disabled-days }
    evidence: "{displayName}: disabled, last changed {modifiedDateTime} (created {createdDateTime})"

  - id: ENTRA-CA-ALL-USERS-NO-EXCLUSION
    title: Enforced all-users policy excludes nobody (emergency access at risk)
    kind: misconfigured
    category: AVL
    severity: high
    entity: conditional-access-policy
    why: "A policy that applies to every user with no exclusion can lock out every administrator at once (a bad change, an MFA outage, a device-compliance failure). Emergency-access accounts must be outside it."
    fix: "Exclude the emergency-access accounts (or their group) from the policy and monitor their sign-ins instead."
    refs: ["NIST-800-53:CP-2", "NIST-800-53:AC-3"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    each:
      all:
        - { field: state, op: eq, value: enabled }
        - { field: conditions.users.includeUsers, op: contains, value: All }
        - { field: conditions.users.excludeUsers, op: empty }
        - { field: conditions.users.excludeGroups, op: empty }
        - { field: grantControls, op: exists }
    evidence: "{displayName}: applies to all users with no excluded user or group (grant {grantControls.builtInControls})"

  # ------------------------------------------------- Conditional Access baselines (must exist) ---
  # Each rule counts the ENFORCED policies (state enabled) that satisfy the baseline on their own and
  # fails when there is none. Report-only and disabled policies never count; a policy the engine
  # cannot judge (a field missing) is not counted either, and the evidence says how many those were.
  # Coverage split over several policies (for example admin roles spread across two policies) is not
  # recognised: one policy must carry the whole baseline.
  - id: ENTRA-CA-BASELINE-MFA-ALL-USERS
    title: No enforced policy requires MFA for all users on all resources
    kind: missing
    category: AUT
    severity: high
    entity: tenant
    why: "Without one enforced policy that asks every user for MFA on every resource, any stolen password works somewhere. A policy counts only if it targets all users and all resources, excludes no resource, is not limited to risky sign-ins and is not limited to some client types."
    fix: "Create (or switch on) a policy: users All (exclude only the emergency-access accounts), target resources All, grant Require MFA or an authentication strength."
    refs: [CIS-M365-5.2.2.2, "NIST-800-53:IA-2(1)", "NIST-800-53:IA-2(2)"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: state, op: eq, value: enabled }
          - { field: conditions.users.includeUsers, op: contains, value: All }
          - { field: conditions.applications.includeApplications, op: contains, value: All }
          - { field: conditions.applications.excludeApplications, op: empty }
          - { field: conditions.signInRiskLevels, op: empty }
          - { field: conditions.userRiskLevels, op: empty }
          - any:
              - { field: conditions.clientAppTypes, op: empty }
              - { field: conditions.clientAppTypes, op: contains, value: all }
          - any:
              - { field: grantControls.builtInControls, op: contains, value: mfa }
              - { field: grantControls.authenticationStrength.id, op: exists }
    evidence: "{count} enforced all-users, all-resources MFA policies among {rows} policies"

  - id: ENTRA-CA-BASELINE-MFA-ADMINS
    title: No enforced policy requires MFA for all administrator roles
    kind: missing
    category: AUT
    severity: high
    entity: tenant
    why: "Administrators must never sign in with a password alone. A policy counts if it requires MFA on all resources, is not limited to risky sign-ins, and either targets all users without excluding roles or names every privileged role (Global, Privileged Role, Privileged Authentication, Security, Conditional Access, Application, Cloud Application, Exchange, SharePoint, User, Authentication, Helpdesk, Password and Billing Administrator, Global Reader)."
    fix: "Create a policy that includes all those directory roles (or extend the all-users MFA policy), target resources All, grant MFA or the phishing-resistant authentication strength."
    refs: [CIS-M365-5.2.2.1, "NIST-800-53:IA-2(1)", "NIST-800-53:AC-6(5)"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
    count:
      op: lt
      value: 1
      where:
        all:
          - { field: state, op: eq, value: enabled }
          - { field: conditions.applications.includeApplications, op: contains, value: All }
          - { field: conditions.signInRiskLevels, op: empty }
          - { field: conditions.userRiskLevels, op: empty }
          - any:
              - { field: grantControls.builtInControls, op: contains, value: mfa }
              - { field: grantControls.authenticationStrength.id, op: exists }
          - any:
              - all:
                  - { field: conditions.users.includeUsers, op: contains, value: All }
                  - { field: conditions.users.excludeRoles, op: empty }
              - all:
                  - { field: conditions.users.includeRoles, op: contains, value: 62e90394-69f5-4237-9190-012177145e10 }
                  - { field: conditions.users.includeRoles, op: contains, value: e8611ab8-c189-46e8-94e1-60213ab1f814 }
                  - { field: conditions.users.includeRoles, op: contains, value: 7be44c8a-adaf-4e2a-84d6-ab2649e08a13 }
                  - { field: conditions.users.includeRoles, op: contains, value: 194ae4cb-b126-40b2-bd5b-6091b380977d }
                  - { field: conditions.users.includeRoles, op: contains, value: b1be1c3e-b65d-4f19-8427-f6fa0d97feb9 }
                  - { field: conditions.users.includeRoles, op: contains, value: 9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3 }
                  - { field: conditions.users.includeRoles, op: contains, value: 158c047a-c907-4556-b7ef-446551a6b5f7 }
                  - { field: conditions.users.includeRoles, op: contains, value: 29232cdf-9323-42fd-ade2-1d097af3e4de }
                  - { field: conditions.users.includeRoles, op: contains, value: f28a1f50-f6e7-4571-818b-6a12f2af6b6c }
                  - { field: conditions.users.includeRoles, op: contains, value: fe930be7-5e62-47db-91af-98c3a49a38b1 }
                  - { field: conditions.users.includeRoles, op: contains, value: c4e39bd9-1100-46d3-8c65-fb160da0071f }
                  - { field: conditions.users.includeRoles, op: contains, value: 729827e3-9c14-49f7-bb1b-9608f156bbb8 }
                  - { field: conditions.users.includeRoles, op: contains, value: 966707d0-3269-4727-9be2-8c3a10f19b9d }
                  - { field: conditions.users.includeRoles, op: contains, value: b0f54661-2d74-4c50-afa3-1ec803f12efe }
                  - { field: conditions.users.includeRoles, op: contains, value: f2ef992c-3afb-46b9-b7cf-a126ee74c451 }
    evidence: "{count} enforced MFA policies cover all administrator roles, among {rows} policies"

  - id: ENTRA-CA-BASELINE-PHISHING-RESISTANT-ADMINS
    title: No enforced policy requires phishing-resistant MFA for Global Administrators
    kind: missing
    category: AUT
    severity: medium
    entity: tenant
    why: "Push, codes and phone methods can be relayed by adversary-in-the-middle phishing kits; only an authentication strength limited to passkeys (FIDO2), Windows Hello and multifactor certificates stops that. A policy counts if it targets the Global Administrator role (or all users) and its authentication strength allows only those methods."
    fix: "Require the built-in Phishing-resistant MFA authentication strength for admin roles (start with Global Administrator) once the admins have registered a passkey."
    refs: ["NIST-800-53:IA-2(6)", "NIST-800-53:IA-2(8)"]
    query:
      protocol: graph
      path: /identity/conditionalAccess/policies
      key: id
      name: displayName
