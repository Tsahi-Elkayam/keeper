schema: keeper.rules/1
system: prtg
name: PRTG Network Monitor
integration: prtg
# Endpoint: the PRTG web server (https://prtg.example.org). The integration adds the API token; rules
# only name GET paths. All sensor rules share one table query: /api/table.json answers
# {"prtg-version": ..., "treesize": n, "sensors": [...]}, so items is "sensors". The table API pages
# with start/count (count at most 50,000), mapped to the runner's offset paging.
# Numeric columns come twice: "status" is the display text, "status_raw" the number, which does not
# depend on the user interface language. Sensor status codes (filter_status in the PRTG API docs):
#   1 Unknown, 2 Collecting, 3 Up, 4 Warning, 5 Down, 6 No probe, 7 Paused by user,
#   8 Paused by dependency, 9 Paused by schedule, 10 Unusual, 11 Paused by licence, 12 Paused until,
#   13 Down (acknowledged), 14 Down (partial).
# downtimesince_raw is in seconds; priority_raw is 1 (lowest) to 5 (highest).
# Devices use the same table with content=devices ({"devices": [...]}) and the per-device sensor counts
# (totalsens, upsens, downsens, ... each with a _raw twin). Probes: the vendor's support answer reads
# them as content=probes with filter_parentid=0 ({"probes": [...]}); condition_raw 2 = connected,
# 0 = disconnected. If that answer shape is wrong the list is empty and PRTG-PROBE-NONE says so.
defaults:
  lens: maintenance
  refresh: 1h
  category: MON
  entity: sensor
rules:

  - id: PRTG-SENSOR-DOWN
    title: Sensor is down
    kind: broken
    severity:
      field: priority_raw
      ranges: [ { min: 5, value: critical }, { min: 4, value: high } ]
      default: medium
    why: A down sensor is a monitored thing that has stopped answering; priority says how much the owner said it matters.
    fix: Fix the device or service, or acknowledge the alarm with a note while the fix is underway.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each: { field: status_raw, op: in, value: [5, 14] }
    evidence: "{probe} / {group} / {device} / {sensor}: {status} for {downtimesince} - {message}"

  - id: PRTG-SENSOR-DOWN-ACKNOWLEDGED
    title: Sensor is down and acknowledged
    kind: broken
    severity: medium
    why: An acknowledged alarm is suppressed in PRTG's own views; acknowledged means somebody saw it, not that it was fixed.
    fix: Fix it, or pause the sensor with a dated reason if the outage is planned; do not leave it acknowledged indefinitely.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each: { field: status_raw, op: eq, value: 13 }
    evidence: "{device} / {sensor}: {status} for {downtimesince} - {message}"

  - id: PRTG-SENSOR-DOWN-LONG
    title: Sensor has been down for more than a week
    kind: broken
    category: HYG
    severity: medium
    why: A sensor down for weeks is either a real outage nobody owns or monitoring of something that no longer exists - both teach people to ignore red.
    fix: Fix the monitored service, or delete the sensor if the thing it watched is gone.
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each:
      all:
        - { field: status_raw, op: in, value: [5, 13, 14] }
        - { field: downtimesince_raw, op: gt, value: 604800, threshold: prtg.down-max-seconds }
    evidence: "{device} / {sensor}: {status} for {downtimesince}"

  - id: PRTG-SENSOR-UNKNOWN
    title: Sensor reports no data (unknown or no probe)
    kind: broken
    severity: medium
    why: Unknown is neither green nor red, so no alert rule catches it - it is monitoring that is not monitoring, often a probe that lost its connection.
    fix: Check the probe connection and the sensor's credentials or target; recreate sensors that never returned data.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each: { field: status_raw, op: in, value: [1, 6] }
    evidence: "{probe} / {device} / {sensor}: {status} - {message}"

  - id: PRTG-SENSOR-PAUSED-BY-USER
    title: Sensor paused by a user
    kind: misconfigured
    severity: low
    why: A paused sensor raises no alerts at all. Pauses made for maintenance are routinely forgotten, and the sensor stays silent for months.
    fix: Resume the sensor, delete it if the device is gone, or use a timed pause (pause until) so it comes back by itself.
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each: { field: status_raw, op: eq, value: 7 }
    evidence: "{device} / {sensor}: {status} - {message}"

  - id: PRTG-SENSOR-PAUSED-BY-DEPENDENCY
    title: Sensor paused because a parent object is down
    kind: broken
    severity: low
    why: A parent that goes down pauses its whole subtree, which is often a larger blind spot than the one alarm anybody noticed.
    fix: Fix the parent object; the dependent sensors resume on their own.
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each: { field: status_raw, op: eq, value: 8 }
    evidence: "{device} / {sensor}: {status}"

  - id: PRTG-SENSOR-PAUSED-BY-LICENSE
    title: Sensor paused because the licence limit is reached
    kind: missing
    severity: high
    why: At the sensor limit PRTG pauses or refuses sensors without an alarm - the estate grows and monitoring does not.
    fix: Remove unused sensors or extend the licence, then resume the paused sensors.
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each: { field: status_raw, op: eq, value: 11 }
    evidence: "{device} / {sensor}: {status}"

  - id: PRTG-SENSOR-WARNING
    title: Sensor is in a warning state
    kind: broken
    severity: low
    why: A warning crossed a limit someone set on purpose; left alone it either turns into an outage or into noise people learn to ignore.
    fix: Fix the cause or adjust the limit with a reason.
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each: { field: status_raw, op: eq, value: 4 }
    evidence: "{device} / {sensor}: {status} - {message}"

  - id: PRTG-SENSOR-DOWN-HIGH-PRIORITY-DAY
    title: High-priority sensor down and unacknowledged for more than a day
    kind: broken
    severity: high
    why: A priority 4 or 5 sensor is one its owner marked as important; down and unacknowledged after a day means the outage and the alert path are both broken.
    fix: Fix the monitored service, or acknowledge the alarm with a note; then find out why the alert reached nobody.
    refs: [NIST-800-53:SI-4, NIST-800-53:IR-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each:
      all:
        - { field: status_raw, op: in, value: [5, 14] }
        - { field: priority_raw, op: ge, value: 4 }
        - { field: downtimesince_raw, op: gt, value: 86400, threshold: prtg.high-priority-down-max-seconds }
    evidence: "{probe} / {device} / {sensor} (priority {priority_raw}): {status} for {downtimesince} - {message}"

  - id: PRTG-SENSOR-UNUSUAL
    title: Sensor reports unusual values
    kind: broken
    severity: low
    why: Unusual means the values are far from the sensor's own history - the early warning before a limit is crossed, or a sign the baseline needs tuning.
    fix: Look at the channel graph; open a ticket if the change is real, tune unusual detection if it is not.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each: { field: status_raw, op: eq, value: 10 }
    evidence: "{device} / {sensor}: {status} - {message}"

  # ---- probes --------------------------------------------------------------------------------

  - id: PRTG-PROBE-DISCONNECTED
    title: Probe is not connected to the core server
    kind: broken
    severity: high
    entity: probe
    refresh: 30m
    why: Every sensor under a disconnected probe stops reporting, while the dashboards keep showing their last known state.
    fix: Check the probe service and its path to the core server; approve the probe again if it re-registered with a new identity.
    refs: [NIST-800-53:SI-4, CIS-Controls-v8:8.2]
    query:
      protocol: http
      path: /api/table.json
      params: { content: probes, columns: "objid,name,condition,status,message", filter_parentid: "0" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: probes
      key: objid
      name: name
    each: { field: condition_raw, op: ne, value: 2 }
    evidence: "probe {name}: {condition} - {message}"

  - id: PRTG-PROBE-NONE
    title: PRTG returned no probes
    kind: missing
    severity: medium
    entity: instance
    why: An empty probe table means the API account cannot see the probes (so the sensor table is partial too), or the probe query is not answered in the shape the rules expect.
    fix: Give the API user read rights on the root group; if probes are visible in the web interface, the query shape needs checking.
    refs: [NIST-800-53:CA-7]
    query:
      protocol: http
      path: /api/table.json
      params: { content: probes, columns: "objid,name,condition,status,message", filter_parentid: "0" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: probes
      key: objid
      name: name
    count: none
    evidence: "the probe table is empty"

  # ---- devices -------------------------------------------------------------------------------

  - id: PRTG-DEVICE-ALL-SENSORS-DOWN
    title: Device has sensors down and none up
    kind: broken
    category: AVL
    severity: high
    entity: device
    why: When no sensor of a device is up and some are down, the device itself is down - a bigger event than the separate sensor alarms suggest, and easy to lose among them.
    fix: Treat it as a host outage - check power, network and the device - before working the individual sensors.
    refs: [NIST-800-53:SI-4, NIST-800-53:IR-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: devices, columns: "objid,device,host,group,probe,status,message,totalsens,upsens,downsens,downacksens,partialdownsens,warnsens,pausedsens,unusualsens,undefinedsens" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: devices
      key: objid
      name: device
    each:
      all:
        - { field: totalsens_raw, op: gt, value: 0 }
        - { field: upsens_raw, op: eq, value: 0 }
        - { field: warnsens_raw, op: eq, value: 0 }
        - { field: unusualsens_raw, op: eq, value: 0 }
        - { field: downsens_raw, op: gt, value: 0 }
    evidence: "{probe} / {group} / {device}: {downsens_raw} of {totalsens_raw} sensors down, none up"

  - id: PRTG-DEVICE-WITHOUT-SENSORS
    title: Device has no sensors
    kind: missing
    category: MON
    severity: low
    entity: device
    refresh: 1d
    why: A device without sensors is inventoried but not monitored; it looks covered in the device tree while nothing watches it.
    fix: Add at least an availability (ping) sensor, or delete the device if it is gone.
    refs: [NIST-800-53:SI-4, CIS-Controls-v8:1.1]
    query:
      protocol: http
      path: /api/table.json
      params: { content: devices, columns: "objid,device,host,group,probe,status,message,totalsens,upsens,downsens,downacksens,partialdownsens,warnsens,pausedsens,unusualsens,undefinedsens" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: devices
      key: objid
      name: device
    each: { field: totalsens_raw, op: eq, value: 0 }
    evidence: "{probe} / {group} / {device}: no sensors"

  - id: PRTG-DEVICE-PAUSED
    title: Whole device paused by a user
    kind: misconfigured
    category: MON
    severity: medium
    entity: device
    why: Pausing a device silences every sensor on it - a larger blind spot than one paused sensor, and the pause people forget after maintenance.
    fix: Resume the device, or use a timed pause (pause until) so it comes back by itself.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: devices, columns: "objid,device,host,group,probe,status,message,totalsens,upsens,downsens,downacksens,partialdownsens,warnsens,pausedsens,unusualsens,undefinedsens" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: devices
      key: objid
      name: device
    each: { field: status_raw, op: eq, value: 7 }
    evidence: "{probe} / {group} / {device}: {status} - {message}"

  - id: PRTG-NO-SENSORS
    title: PRTG returned no sensors
    kind: missing
    severity: medium
    entity: instance
    why: An empty sensor table means either the API account sees nothing or nothing is monitored - both look identical to a calm dashboard.
    fix: Check the API user's group rights on the probes and groups, then rerun.
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    count: none
    evidence: "the sensor table is empty"

  # ---- more sensor states (acknowledged / paused / warning duration) -------------------------

  - id: PRTG-SENSOR-DOWN-ACK-LONG
    title: Sensor down and acknowledged for more than a week
    kind: broken
    category: HYG
    severity: medium
    why: An alarm acknowledged a week ago and still down was never fixed, only silenced - the acknowledgement hides it from every PRTG view that drops acknowledged alarms.
    fix: Fix the monitored service, or delete the sensor if the thing it watched is gone; do not leave an acknowledgement standing for weeks.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each:
      all:
        - { field: status_raw, op: eq, value: 13 }
        - { field: downtimesince_raw, op: gt, value: 604800, threshold: prtg.down-ack-max-seconds }
    evidence: "{device} / {sensor}: acknowledged and down for {downtimesince} - {message}"

  - id: PRTG-SENSOR-PAUSED-BY-SCHEDULE
    title: Sensor paused by a schedule
    kind: misconfigured
    severity: low
    why: A schedule can pause a sensor during a window that no longer matches the service, so the thing is unmonitored at exactly the hours someone once decided it did not matter.
    fix: Check the schedule attached to the sensor or its parent; narrow or remove it if the quiet window is no longer wanted.
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each: { field: status_raw, op: eq, value: 9 }
    evidence: "{device} / {sensor}: {status}"

  - id: PRTG-SENSOR-PAUSED-UNTIL
    title: Sensor paused until a set time
    kind: misconfigured
    severity: low
    why: A timed pause comes back on its own, but one set far ahead is the same silent blind spot as an open-ended pause until that date arrives.
    fix: Check the pause-until date; shorten it, or resume the sensor if the maintenance is over.
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each: { field: status_raw, op: eq, value: 12 }
    evidence: "{device} / {sensor}: {status} - {message}"

  - id: PRTG-SENSOR-PAUSED-LONG
    title: Sensor paused for more than a week
    kind: misconfigured
    category: HYG
    severity: medium
    why: A sensor paused at 02:00 for maintenance stays paused for a year - a pause by a user, a schedule or a pause-until that nobody came back to lift raises no alert for the whole time.
    fix: Resume the sensor, or delete it if the device is gone; use a short timed pause for real maintenance.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each:
      all:
        - { field: status_raw, op: in, value: [7, 9, 12] }
        - { field: downtimesince_raw, op: gt, value: 604800, threshold: prtg.paused-max-seconds }
    evidence: "{device} / {sensor}: {status} for {downtimesince}"

  - id: PRTG-SENSOR-PAUSED-BY-DEPENDENCY-LONG
    title: Sensor paused by a dependency for more than a day
    kind: broken
    category: AVL
    severity: medium
    why: A dependency that has held a subtree paused for over a day is either a parent outage nobody is working or a dependency pointed at the wrong object - a whole branch silenced either way.
    fix: Fix the parent object so the subtree resumes, or correct the dependency if the parent is not really the thing these sensors depend on.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each:
      all:
        - { field: status_raw, op: eq, value: 8 }
        - { field: downtimesince_raw, op: gt, value: 86400, threshold: prtg.dependency-paused-max-seconds }
    evidence: "{device} / {sensor}: {status} for {downtimesince}"

  - id: PRTG-SENSOR-WARNING-LONG
    title: Sensor in a warning state for more than a month
    kind: broken
    category: HYG
    severity: low
    why: A warning that never clears trains everyone to ignore warnings; it is usually a limit set too tight or a slow problem nobody owns.
    fix: Fix the cause, or adjust the limit with a reason; a warning no one acts on should not stand for a month.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,message,downtimesince,priority,lastcheck" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each:
      all:
        - { field: status_raw, op: eq, value: 4 }
        - { field: downtimesince_raw, op: gt, value: 2592000, threshold: prtg.warning-max-seconds }
    evidence: "{device} / {sensor}: {status} for {downtimesince} - {message}"

  # ---- scanning interval -----------------------------------------------------------------------

  - id: PRTG-SENSOR-INTERVAL-TOO-SHORT
    title: Sensor scans more often than once a minute
    kind: misconfigured
    category: HYG
    severity: low
    why: Very short intervals multiply the load on the probe and the core for little gain, and are usually left over from a test rather than chosen on purpose.
    fix: Raise the interval to the standard for the sensor type, unless a sub-minute interval is genuinely needed and recorded.
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,interval" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each: { field: interval_raw, op: lt, value: 60, threshold: prtg.min-interval-seconds }
    evidence: "{device} / {sensor}: scans every {interval}"

  - id: PRTG-SENSOR-INTERVAL-TOO-LONG
    title: Sensor scans less than once a day
    kind: misconfigured
    severity: low
    why: A sensor that scans only every few days detects an outage days late; on a service that matters that is as good as not monitoring it.
    fix: Shorten the interval to match how quickly a problem on this thing needs to be seen.
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,interval" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each: { field: interval_raw, op: gt, value: 86400, threshold: prtg.max-interval-seconds }
    evidence: "{device} / {sensor}: scans every {interval}"

  # ---- alerting coverage (notification triggers) ----------------------------------------------

  - id: PRTG-SENSOR-NO-NOTIFICATION
    title: Sensor has no notification trigger, own or inherited
    kind: missing
    category: MON
    severity: low
    why: A sensor with no trigger above it goes red on the screen and tells nobody; monitoring that cannot send is monitoring for the dashboard only.
    fix: Add a state trigger on the sensor, or on a parent group or device so it inherits one, pointing at a monitored recipient.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,device,group,probe,sensor,status,notifiesx" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: sensors
      key: objid
      name: sensor
    each:
      any:
        - { field: notifiesx, op: eq, value: 'None' }
        - { field: notifiesx, op: empty }
    evidence: "{device} / {sensor}: notification triggers {notifiesx}"

  - id: PRTG-DEVICE-NO-NOTIFICATION-TRIGGER
    title: Device has no notification trigger, own or inherited
    kind: missing
    category: MON
    severity: medium
    entity: device
    why: With no trigger on a device or anything above it, every sensor on that device can go down without an alert - a whole host that alarms nobody.
    fix: Add a state trigger at the device or group level pointing at a monitored recipient, so all the device's sensors are covered.
    refs: [NIST-800-53:SI-4, CIS-Controls-v8:8.2]
    query:
      protocol: http
      path: /api/table.json
      params: { content: devices, columns: "objid,device,host,group,probe,status,notifiesx" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: devices
      key: objid
      name: device
    each:
      any:
        - { field: notifiesx, op: eq, value: 'None' }
        - { field: notifiesx, op: empty }
    evidence: "{probe} / {group} / {device}: notification triggers {notifiesx}"

  # ---- devices and groups (coverage and paused subtrees) --------------------------------------

  - id: PRTG-DEVICE-UNKNOWN
    title: Device is in an unknown state
    kind: broken
    category: AVL
    severity: medium
    entity: device
    why: A device PRTG reports as Unknown is one it cannot place up or down - usually its parent probe or the device's own reachability is lost, and no down alarm fires for it.
    fix: Check the probe that owns the device and the device's address and credentials; recreate monitoring that never returned a state.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: devices, columns: "objid,device,host,group,probe,status,message,totalsens,upsens,downsens,downacksens,partialdownsens,warnsens,pausedsens,unusualsens,undefinedsens" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: devices
      key: objid
      name: device
    each: { field: status_raw, op: eq, value: 1 }
    evidence: "{probe} / {group} / {device}: {status} - {message}"

  - id: PRTG-GROUP-NO-SENSORS
    title: Group contains no sensors
    kind: missing
    category: MON
    severity: low
    entity: group
    refresh: 1d
    why: A group with no sensors under it is a labelled but empty branch of the tree - it looks like coverage and watches nothing.
    fix: Add devices and sensors under the group, or delete it if it is a leftover of a reorganisation.
    refs: [NIST-800-53:SI-4, CIS-Controls-v8:1.1]
    query:
      protocol: http
      path: /api/table.json
      params: { content: groups, columns: "objid,group,probe,status,totalsens" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: groups
      key: objid
      name: group
    each: { field: totalsens_raw, op: eq, value: 0 }
    evidence: "{probe} / {group}: no sensors"

  - id: PRTG-GROUP-PAUSED
    title: Whole group paused by a user
    kind: misconfigured
    category: MON
    severity: medium
    entity: group
    why: Pausing a group silences every device and sensor beneath it - the widest blind spot a single pause can make, and the one most easily forgotten after maintenance.
    fix: Resume the group, or use a short timed pause so it comes back by itself.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: groups, columns: "objid,group,probe,status,message,totalsens" }
      paging: offset
      offsetParam: start
      limitParam: count
      pageSize: 5000
      items: groups
      key: objid
      name: group
    each: { field: status_raw, op: eq, value: 7 }
    evidence: "{probe} / {group}: {status} - {message}"

  # ---- instance: version and sensor-count headroom --------------------------------------------
  # Every table.json answer carries "prtg-version" and "treesize" at its root, beside the items array.
  # With items left out, the whole answer object is one row, so these read those two header fields.
  # Both compare with a tenant setting that has no safe default (the supported build, the licence-based
  # warning level), so until it is set the rule is not configured - never a pass that compared nothing.

  - id: PRTG-VERSION-OUTDATED
    title: PRTG core is below the supported version
    kind: misconfigured
    lens: security
    category: LCM
    severity: high
    entity: instance
    refresh: 7d
    why: The monitoring server holds credentials for much of the estate and has had authenticated remote-code-execution flaws; a build below the one the organisation has settled on is missing those fixes.
    fix: Update the core in a window after a configuration backup, then let the remote probes auto-update to match.
    refs: [NIST-800-53:SI-2, CIS-Controls-v8:7.3]
    query:
      protocol: http
      path: /api/table.json
      params: { content: probes, columns: "objid,name,condition", filter_parentid: "0" }
      paging: none
      key: prtg-version
      name: prtg-version
    each: { field: prtg-version, op: version-lt, value: '0.0.0', threshold: prtg.min-version, required: true }
    evidence: "PRTG core version {prtg-version} is below the supported minimum"

  - id: PRTG-SENSOR-COUNT-NEAR-LIMIT
    title: Sensor count near the configured warning level
    kind: misconfigured
    category: CST
    severity: high
    entity: instance
    refresh: 1d
    why: At the licensed sensor limit PRTG silently refuses or pauses new sensors with no alarm - the estate keeps growing while monitoring quietly stops. The licence figure is not in the API, so the warning level is a tenant setting.
    fix: Reclaim sensors on dead or duplicate monitoring, or extend the licence, before the limit is reached.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/table.json
      params: { content: sensors, columns: "objid,sensor,status" }
      paging: none
      key: prtg-version
      name: prtg-version
    each: { field: treesize, op: gt, value: 0, threshold: prtg.sensor-count-warn, required: true }
    evidence: "the sensor tree holds {treesize} sensors, at or above the configured warning level"
