  # The register has no as-of date per field, so the age of the whole row stands in for the age of
  # seats_used: any save of the row (even unchanged) counts as a fresh reading.
  - id: REG-LIC-USAGE-STALE
    title: Licence seat usage has not been updated in a quarter
    kind: missing
    lens: maintenance
    category: CST
    severity: low
    entity: licence
    why: >-
      The cap, nearly-full and unused-seat rules judge seats_used as recorded. When the row has not
      been touched for months, a cap hit or a shelfware finding is a guess based on old numbers - and
      a real cap problem may be hidden.
    fix: >-
      Read the current usage in the vendor portal or the product's admin console and update
      seats_used (saving the row records the date).
    refs: [NIST-800-53:CM-10, NIST-800-53:CM-8]
    refresh: 1d
    query:
      protocol: store
      key: licence_id
      name: product
      text: |
