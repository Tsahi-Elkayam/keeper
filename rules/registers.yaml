  - id: REG-VEN-UNCLASSIFIED
    title: Vendor in use was never classified for the data it handles
    kind: missing
    lens: security
    category: HYG
    severity: low
    entity: vendor
    why: >-
      The vendor has a current agreement, is not marked sensitive and has no record of the data it
      handles. Not sensitive is only the register's default, not a decision - and every rule about
      sensitive vendors (security review, data record, exit) skips this one.
    fix: >-
      Write in data_handled what the vendor touches (or that it touches nothing, for example
      on-premises software with no vendor access), and mark it sensitive when it handles personal,
      health or financial data or holds privileged access.
    refs: [NIST-800-53:SA-9, NIST-800-53:RA-2, CIS-Controls-v8:15.3, ISO-27001:A.5.19]
    refresh: 1d
    query:
      protocol: store
      key: vendor_id
      name: name
      text: |
        SELECT v.vendor_id,
               v.name,
               v.sole_vendor,
               v.sensitive,
               NULLIF(TRIM(v.exit_plan), '') AS exit_plan,
               NULLIF(TRIM(v.sla), '') AS sla,
               NULLIF(TRIM(v.data_handled), '') AS data_handled,
               COALESCE(NULLIF(TRIM(v.data_handled), ''), 'unrecorded data') AS data_shown,
               NULLIF(TRIM(v.security_review_on), '') AS security_review_on,
               COALESCE(NULLIF(TRIM(v.security_review_on), ''), 'never') AS reviewed_shown,
               v.updated_at,
               COALESCE(date(NULLIF(TRIM(v.security_review_on), ''), '+' ||
                   COALESCE((SELECT st.value FROM setting st WHERE st.key = 'threshold.registers.vendor-review-days'), '365')
                   || ' days'), :today) AS review_due,
               (SELECT COUNT(*) FROM contract c
                 WHERE c.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(c.end_on), ''), '9999-12-31') >= :today) AS current_contracts,
               (SELECT COUNT(*) FROM licence l
                 WHERE l.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(l.expires_on), ''), '9999-12-31') >= :today) AS current_licences
        FROM vendor v
        WHERE v.state = 'confirmed'
    each:
      all:
        - { field: sensitive, op: eq, value: 0 }
        - { field: data_handled, op: absent }
        - any:
            - { field: current_contracts, op: gt, value: 0 }
            - { field: current_licences, op: gt, value: 0 }
    evidence: "{name} ({vendor_id}) has {current_contracts} current contract(s) and {current_licences} licence(s) but no classification of the data it handles"

  - id: REG-VEN-NO-SLA
