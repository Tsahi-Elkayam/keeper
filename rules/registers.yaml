    deadline: end_on
    evidence: "{title} ({contract_id}, {vendor}) ended {end_on}, {days_past} days ago; decision recorded: {decision}. Owner: {owner_shown}"

  - id: REG-CON-RENEWAL-NOT-RECORDED
