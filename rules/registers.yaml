        - any:
            - { field: expires_on, op: absent }
            - { field: days_left, op: ge, value: 0 }
    deadline: expires_on
    evidence: "{product} ({licence_id}) renews automatically on {expires_on} with only {notice_days} days' notice recorded. Owner: {owner_shown}"

