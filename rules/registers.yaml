        - { field: current_licences, op: eq, value: 0 }
    evidence: "{name} ({vendor_id}) is marked sensitive and has no current contract or licence in the registers"

  - id: REG-VEN-SOLE-NO-EXIT-PLAN
    title: Sole vendor has no exit plan
    kind: missing
    lens: maintenance
    category: AVL
    severity: medium
    entity: vendor
    why: >-
      When only one vendor can supply or support a system, its failure, a steep price rise or its
      exit from the market leaves the organisation with no alternative ready - and short extensions
      granted "while alternatives are checked" tend to repeat. The exit plan is what turns that
      into a project instead of a crisis.
    fix: >-
      Write a short exit plan (alternatives, data export format and path, legal retention of the
      data, time and cost to switch, who decides) and record where it lives in exit_plan.
    refs: [NIST-800-53:SR-2, NIST-800-53:SA-9]
    refresh: 1d
    query:
      protocol: store
      key: vendor_id
      name: name
      text: |
        SELECT v.vendor_id,
               v.name,
               v.sole_vendor,
               v.sensitive,
               NULLIF(TRIM(v.exit_plan), '') AS exit_plan,
               NULLIF(TRIM(v.sla), '') AS sla,
               NULLIF(TRIM(v.data_handled), '') AS data_handled,
               COALESCE(NULLIF(TRIM(v.data_handled), ''), 'unrecorded data') AS data_shown,
               NULLIF(TRIM(v.security_review_on), '') AS security_review_on,
               COALESCE(NULLIF(TRIM(v.security_review_on), ''), 'never') AS reviewed_shown,
               v.updated_at,
               COALESCE(date(NULLIF(TRIM(v.security_review_on), ''), '+' ||
                   COALESCE((SELECT st.value FROM setting st WHERE st.key = 'threshold.registers.vendor-review-days'), '365')
                   || ' days'), :today) AS review_due,
               (SELECT COUNT(*) FROM contract c
                 WHERE c.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(c.end_on), ''), '9999-12-31') >= :today) AS current_contracts,
               (SELECT COUNT(*) FROM licence l
                 WHERE l.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(l.expires_on), ''), '9999-12-31') >= :today) AS current_licences
        FROM vendor v
        WHERE v.state = 'confirmed'
    each:
      all:
        - { field: sole_vendor, op: eq, value: 1 }
        - { field: exit_plan, op: absent }
    evidence: "{name} ({vendor_id}) is a sole vendor with no exit plan recorded"

