    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
        WHERE k.kind = 'price-change'
    each:
      all:
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: due_on
    evidence: "{title} ({key_date_id}) takes effect {due_on}, {days_left} days left. Owner: {owner_shown}"

  - id: REG-KEY-CONTRACT-DUE
    title: Recorded contract date is near
    kind: missing
    lens: maintenance
    category: CST
    severity:
      daysLeft: due_on
      ranges:
        - { max: 14, value: critical }
        - { max: 45, value: high }
      default: medium
    entity: key-date
    why: >-
      A contract milestone kept as a key date (a termination window, an option to extend, a price
      review, an offer that expires) is inside its notice period. Once it passes, the option is gone
      until the next term.
    fix: >-
      Take the decision the date calls for, then move due_on to the next milestone. Consider
      recording the contract in the contract register so its decision and owner are tracked.
    refs: [NIST-800-53:SA-4]
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
        WHERE k.kind = 'contract'
    each:
      all:
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: due_on
    evidence: "{title} ({key_date_id}) on {due_on}, {days_left} days left. Owner: {owner_shown}"

  # A support end needs an upgrade or replacement project, which takes longer than the 14-day default
  # notice of a key date, so the rule warns from registers.support-end-notice-days before the date
  # even when the row's own notice_days is shorter (a longer notice_days still warns earlier).
  - id: REG-KEY-SUPPORT-END-DUE
    title: Product, version or model leaves vendor support soon
    kind: missing
    lens: both
    category: LCM
    severity:
      daysLeft: due_on
      ranges:
        - { max: 30, value: high }
        - { max: 90, value: medium }
      default: low
    entity: key-date
    why: >-
      After the vendor's end of support (end of maintenance, end of life, the last release a
      compatibility matrix allows) there are no security fixes and no help when it breaks. The
      lifecycle of application releases, telephony software, device models and hosted runtimes
      cannot be scanned, but the dates are published in advance and rarely move; the upgrade or
      replacement has to start long before them.
    fix: >-
      Plan and budget the upgrade or replacement with the owner now, so it is done before the date.
      When it is done, move due_on to the new version's end of support (or delete the row if the
      product is gone).
    refs: [NIST-800-53:SA-22, CIS-Controls-v8:2.2, ISO-27001:A.8.8]
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
        WHERE k.kind = 'support-end'
    each:
      all:
        - { field: days_left, op: ge, value: 0 }
        - any:
            - { field: days_to_notice, op: le, value: 0 }
            - { field: days_left, op: le, value: 180, threshold: registers.support-end-notice-days }
    deadline: due_on
    evidence: "{title} ({key_date_id}) leaves vendor support {due_on}, {days_left} days left. Owner: {owner_shown}"

  # Payments are key dates of kind "payment". Rows recorded before that kind existed are kind "other"
  # whose title matches the pattern in threshold registers.payment-title-pattern (a .NET regular
  # expression, case-insensitive; add words in the tenant's own language there), so both are read.
  # The same test keeps payments out of REG-KEY-OTHER-DUE and REG-KEY-DATE-PASSED so each date is
  # reported once.
  - id: REG-KEY-PAYMENT-DUE
    title: Payment due date is near
    kind: missing
    lens: both
    category: CST
    severity:
      daysLeft: due_on
      ranges:
        - { max: 3, value: critical }
        - { max: 10, value: high }
      default: medium
    entity: key-date
    why: >-
      An invoice, subscription charge or arrears settlement is due. Providers suspend accounts and
      services for non-payment, and the people who pay are rarely the people who would notice the
      outage - so IT needs to know the payment cleared before the date.
    fix: >-
      Confirm with whoever pays (finance, treasury, procurement) that the payment is approved and
      will clear before the due date, and know which services stop if it does not. Then move due_on
      to the next payment or delete the row.
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
        WHERE k.kind IN ('payment', 'other')
    each:
      all:
        - any:
            - { field: kind, op: eq, value: payment }
            - { field: title, op: match, value: '\b(pay|payment|payments|invoice|invoices|bill|billing|arrears|overdue|suspension|suspend)', threshold: registers.payment-title-pattern }
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: due_on
    evidence: "{title} ({key_date_id}) is due {due_on}, {days_left} days left. Owner: {owner_shown}"

  - id: REG-KEY-PAYMENT-OVERDUE
    title: Payment due date has passed
    kind: broken
    lens: both
    category: CST
    severity: critical
    entity: key-date
    why: >-
      The payment date passed and the register was not moved on. Either the account is in arrears -
      the step before collection and suspension of the service - or it was paid and the next due
      date is not tracked.
    fix: >-
      Ask whoever pays for the payment status today. If it is unpaid, get a committed payment date
      and warn the owners of the services that would be suspended; if it was paid, move due_on to
      the next payment.
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
        WHERE k.kind IN ('payment', 'other')
    each:
      all:
        - any:
            - { field: kind, op: eq, value: payment }
            - { field: title, op: match, value: '\b(pay|payment|payments|invoice|invoices|bill|billing|arrears|overdue|suspension|suspend)', threshold: registers.payment-title-pattern }
        - { field: days_left, op: lt, value: 0 }
    deadline: due_on
    evidence: "{title} ({key_date_id}) was due {due_on}, {days_past} days ago. Owner: {owner_shown}"

  - id: REG-KEY-OTHER-DUE
    title: Other key date is near
    kind: missing
    lens: maintenance
    category: HYG
    severity:
      daysLeft: due_on
      ranges:
        - { max: 3, value: high }
        - { max: 14, value: medium }
      default: low
    entity: key-date
    why: Someone recorded this date because missing it has a cost, and it is inside its notice period.
    fix: Do what the date calls for, then move due_on to the next occurrence or delete the row.
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
        WHERE k.kind = 'other'
    each:
      all:
        - { field: title, op: notmatch, value: '\b(pay|payment|payments|invoice|invoices|bill|billing|arrears|overdue|suspension|suspend)', threshold: registers.payment-title-pattern }
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: due_on
    evidence: "{title} ({key_date_id}) on {due_on}, {days_left} days left. Owner: {owner_shown}"

  - id: REG-KEY-DATE-PASSED
    title: Key date has passed and was not moved on
    kind: missing
    lens: maintenance
    category: HYG
    severity:
      field: kind
      map:
        certificate: critical
        licence: critical
        report: high
        renewal: high
        contract: high
        support-end: high
        price-change: medium
        other: medium
        maintenance: low
      default: medium
    entity: key-date
    why: >-
      The register has no "done" mark, so a date that passed is either overdue (the report was not
      sent, the renewal did not happen) or handled but never rolled forward - and then the next
      occurrence will not be warned about.
    fix: >-
      If it was handled, move due_on to the next occurrence or delete the row. If it was not, treat
      it as overdue now - a passed support-end date means the product runs without vendor fixes.
      Payments are reported by REG-KEY-PAYMENT-OVERDUE instead.
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
    each:
      all:
        - { field: days_left, op: lt, value: 0 }
        - { field: kind, op: ne, value: payment }
        - not:
            all:
              - { field: kind, op: eq, value: other }
              - { field: title, op: match, value: '\b(pay|payment|payments|invoice|invoices|bill|billing|arrears|overdue|suspension|suspend)', threshold: registers.payment-title-pattern }
    deadline: due_on
    evidence: "{kind} date {title} ({key_date_id}) was {due_on}, {days_past} days ago. Owner: {owner_shown}"

  - id: REG-KEY-DATE-NO-OWNER
    title: Upcoming key date has no owner
    kind: missing
    lens: maintenance
    category: HYG
    severity: low
    entity: key-date
    why: >-
      A warning that reaches nobody in particular is acted on by nobody - the typical fate of a
      reminder that lives in one person's calendar or a filed mail thread.
    fix: Name the person or team who acts on this date.
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
    each:
      all:
        - { field: owner, op: absent }
        - { field: days_left, op: ge, value: 0 }
    deadline: due_on
    evidence: "{kind} date {title} ({key_date_id}) on {due_on} has no owner"

  - id: REG-KEY-NOTICE-TOO-SHORT
    title: Key date that needs lead time has less than a week's notice
    kind: misconfigured
    lens: maintenance
    category: HYG
    severity: low
    entity: key-date
    why: >-
      Certificates, licences, renewals, contract milestones, support ends, payments and reports all
      need preparation: a purchase, an approval, a change window, someone else's input. With a
      notice period under a week the warning arrives when nothing can be done in time any more.
    fix: >-
      Set notice_days to the time the work really takes - for certificates and licences at least 30
      days, for a support end the length of an upgrade project, for payments the approval cycle,
      for reports the time it takes to collect the figures.
    refs: [NIST-800-53:SA-4, NIST-800-53:SC-17]
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
    each:
      all:
        - { field: kind, op: in, value: [certificate, licence, renewal, contract, report, support-end, payment] }
        - { field: notice_days, op: lt, value: 7, threshold: registers.min-key-date-notice-days }
        - { field: days_left, op: ge, value: 0 }
    deadline: due_on
    evidence: "{kind} date {title} ({key_date_id}) on {due_on} has only {notice_days} days' notice. Owner: {owner_shown}"

  - id: REG-KEY-SYSTEM-INACTIVE
    title: Upcoming key date belongs to a system marked inactive
    kind: misconfigured
    lens: maintenance
    category: HYG
    severity: low
    entity: key-date
    why: >-
      The date is still ahead but the system it is recorded against has been retired: someone will
      renew a certificate, a subscription or a support plan for a service that no longer runs - or
      the date belongs to the live system and is filed under the wrong one, so its owner never sees
      the warning.
    fix: >-
      Delete the key date, or move it to the system that really needs it. If the system is still in
      use, set it active again.
    refs: [NIST-800-53:CM-8]
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               s.active AS system_active,
               s.name AS system_name,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left
        FROM key_date k
        JOIN system s ON s.system_id = k.system_id
    each:
      all:
        - { field: system_active, op: eq, value: 0 }
        - { field: days_left, op: ge, value: 0 }
    deadline: due_on
    evidence: "{kind} date {title} ({key_date_id}) on {due_on} belongs to system {system_name} ({system_id}), which is inactive. Owner: {owner_shown}"

  # ----------------------------------------------------------------- vendors
  - id: REG-VEN-SENSITIVE-NO-REVIEW
    title: Vendor handling sensitive data has no security review in the last year
    kind: missing
    lens: security
    category: HYG
    severity: high
    entity: vendor
    why: >-
      A vendor that handles sensitive data (personal, health, financial) or holds privileged access
      is part of the organisation's attack surface. Moving such data to a vendor's service without a
      review, or never reviewing again, leaves nobody knowing whether its controls, sub-processors,
      retention and access still match what was agreed.
    fix: >-
      Run the security and privacy review (questionnaire, certifications, access and data held,
      retention and export), record the date in security_review_on, and track the gaps it finds.
    refs: [NIST-800-53:SA-9, NIST-800-53:SR-6, CIS-Controls-v8:15.5]
    refresh: 1d
    query:
      protocol: store
      key: vendor_id
      name: name
      text: |
        SELECT v.vendor_id,
               v.name,
               v.sole_vendor,
               v.sensitive,
               NULLIF(TRIM(v.exit_plan), '') AS exit_plan,
               NULLIF(TRIM(v.sla), '') AS sla,
               NULLIF(TRIM(v.data_handled), '') AS data_handled,
               COALESCE(NULLIF(TRIM(v.data_handled), ''), 'unrecorded data') AS data_shown,
               NULLIF(TRIM(v.security_review_on), '') AS security_review_on,
               COALESCE(NULLIF(TRIM(v.security_review_on), ''), 'never') AS reviewed_shown,
               v.updated_at,
               COALESCE(date(NULLIF(TRIM(v.security_review_on), ''), '+' ||
                   COALESCE((SELECT st.value FROM setting st WHERE st.key = 'threshold.registers.vendor-review-days'), '365')
                   || ' days'), :today) AS review_due,
               (SELECT COUNT(*) FROM contract c
                 WHERE c.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(c.end_on), ''), '9999-12-31') >= :today) AS current_contracts,
               (SELECT COUNT(*) FROM licence l
                 WHERE l.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(l.expires_on), ''), '9999-12-31') >= :today) AS current_licences
        FROM vendor v
        WHERE v.state = 'confirmed'
    each:
      all:
        - { field: sensitive, op: eq, value: 1 }
        - any:
            - { field: security_review_on, op: absent }
            - { field: security_review_on, op: age-gt, value: 365, threshold: registers.vendor-review-days }
    deadline: review_due
    evidence: "{name} ({vendor_id}) handles {data_shown}; last security review: {reviewed_shown}, next was due {review_due}"

  - id: REG-VEN-SENSITIVE-NO-DATA-RECORD
    title: Sensitive vendor has no record of the data it handles
    kind: missing
    lens: security
    category: HYG
    severity: low
    entity: vendor
    why: >-
      The vendor is marked sensitive but the register does not say what data or access it has, so
      a breach notice from them, or the end of the contract, cannot be acted on quickly.
    fix: >-
      Record in data_handled what data the vendor processes, what access it holds and any legal
      retention period that applies to it.
    refs: [NIST-800-53:SA-9]
    refresh: 1d
    query:
      protocol: store
      key: vendor_id
      name: name
      text: |
        SELECT v.vendor_id,
               v.name,
               v.sole_vendor,
               v.sensitive,
               NULLIF(TRIM(v.exit_plan), '') AS exit_plan,
               NULLIF(TRIM(v.sla), '') AS sla,
               NULLIF(TRIM(v.data_handled), '') AS data_handled,
               COALESCE(NULLIF(TRIM(v.data_handled), ''), 'unrecorded data') AS data_shown,
               NULLIF(TRIM(v.security_review_on), '') AS security_review_on,
               COALESCE(NULLIF(TRIM(v.security_review_on), ''), 'never') AS reviewed_shown,
               v.updated_at,
               COALESCE(date(NULLIF(TRIM(v.security_review_on), ''), '+' ||
                   COALESCE((SELECT st.value FROM setting st WHERE st.key = 'threshold.registers.vendor-review-days'), '365')
                   || ' days'), :today) AS review_due,
               (SELECT COUNT(*) FROM contract c
                 WHERE c.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(c.end_on), ''), '9999-12-31') >= :today) AS current_contracts,
               (SELECT COUNT(*) FROM licence l
                 WHERE l.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(l.expires_on), ''), '9999-12-31') >= :today) AS current_licences
        FROM vendor v
        WHERE v.state = 'confirmed'
    each:
      all:
        - { field: sensitive, op: eq, value: 1 }
        - { field: data_handled, op: absent }
    evidence: "{name} ({vendor_id}) is marked sensitive but data_handled is empty"

  - id: REG-VEN-SENSITIVE-NO-AGREEMENT
    title: Sensitive vendor has no current contract or licence
    kind: missing
    lens: security
    category: HYG
    severity: medium
    entity: vendor
    why: >-
      A vendor that handles sensitive data or holds access, with nothing current in the contract or
      licence registers, either works without agreed terms or the relationship ended and its access
      and copies of data may still exist.
    fix: >-
      Record the current agreement, or close the relationship properly: remove the vendor's
      accounts and access, get the data returned or destroyed, and mark the vendor rejected.
    refs: [NIST-800-53:SA-9, NIST-800-53:PS-7, CIS-Controls-v8:15.7]
    refresh: 1d
    query:
      protocol: store
      key: vendor_id
      name: name
      text: |
        SELECT v.vendor_id,
               v.name,
               v.sole_vendor,
               v.sensitive,
               NULLIF(TRIM(v.exit_plan), '') AS exit_plan,
               NULLIF(TRIM(v.sla), '') AS sla,
               NULLIF(TRIM(v.data_handled), '') AS data_handled,
               COALESCE(NULLIF(TRIM(v.data_handled), ''), 'unrecorded data') AS data_shown,
               NULLIF(TRIM(v.security_review_on), '') AS security_review_on,
               COALESCE(NULLIF(TRIM(v.security_review_on), ''), 'never') AS reviewed_shown,
               v.updated_at,
               COALESCE(date(NULLIF(TRIM(v.security_review_on), ''), '+' ||
                   COALESCE((SELECT st.value FROM setting st WHERE st.key = 'threshold.registers.vendor-review-days'), '365')
                   || ' days'), :today) AS review_due,
               (SELECT COUNT(*) FROM contract c
                 WHERE c.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(c.end_on), ''), '9999-12-31') >= :today) AS current_contracts,
               (SELECT COUNT(*) FROM licence l
                 WHERE l.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(l.expires_on), ''), '9999-12-31') >= :today) AS current_licences
        FROM vendor v
        WHERE v.state = 'confirmed'
    each:
      all:
        - { field: sensitive, op: eq, value: 1 }
