    each:
      all:
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: due_on
    evidence: "{title} ({key_date_id}) on {due_on}, {days_left} days left. Owner: {owner_shown}"

  - id: REG-KEY-CERTIFICATE-DUE
    title: Recorded certificate expires within its notice period
    kind: broken
    lens: security
    category: PKI
    severity:
      daysLeft: due_on
      ranges:
        - { max: 7, value: critical }
        - { max: 14, value: high }
      default: medium
    entity: key-date
    why: >-
      A certificate that no TLS scan can reach (signing certificates, CA and KDC certificates,
      identity provider and federation certificates, device and client certificates) is about to
      expire. These fail just as hard as web certificates and are usually forgotten.
    fix: >-
      Renew the certificate, distribute it to every party that trusts it (federation partners,
      apps, devices), then move due_on to the new expiry date.
    refs: [NIST-800-53:SC-17, NIST-SP-1800-16]
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
        WHERE k.kind = 'certificate'
    each:
      all:
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: due_on
    evidence: "{title} ({key_date_id}) expires {due_on}, {days_left} days left. Owner: {owner_shown}"

  - id: REG-KEY-LICENCE-DUE
    title: Recorded licence date is near
    kind: broken
    lens: both
    category: CST
    severity:
      daysLeft: due_on
      ranges:
        - { max: 7, value: critical }
        - { max: 30, value: high }
      default: medium
    entity: key-date
    why: >-
      A licence date kept as a key date (for example a licence key or activation that has to be
      replaced) is inside its notice period. When it passes, the product stops or runs unlicensed.
    fix: >-
      Renew or replace the licence, then move due_on to the new date. Consider moving it to the
      licence register so seats and owner are tracked as well.
    refs: [NIST-800-53:CM-10]
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
        WHERE k.kind = 'licence'
    each:
      all:
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: due_on
    evidence: "{title} ({key_date_id}) on {due_on}, {days_left} days left. Owner: {owner_shown}"

  - id: REG-KEY-PRICE-CHANGE-DUE
    title: Announced price change takes effect soon
    kind: missing
    lens: maintenance
    category: CST
    severity:
      daysLeft: due_on
      ranges:
        - { max: 7, value: high }
        - { max: 30, value: medium }
      default: low
    entity: key-date
    why: >-
      A vendor or provider price change is about to apply - including an agreement that falls back
      to list price when its offer ends. After the date the new price applies; before it there is
      still room to commit, switch tier, renew on the offer or budget for it.
    fix: >-
      Decide with the owner whether to commit early, change plan or accept the increase, update the
      budget, then delete the row or move it to the next announced change.
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
        WHERE k.kind = 'price-change'
    each:
      all:
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: due_on
    evidence: "{title} ({key_date_id}) takes effect {due_on}, {days_left} days left. Owner: {owner_shown}"

  - id: REG-KEY-CONTRACT-DUE
    title: Recorded contract date is near
    kind: missing
    lens: maintenance
    category: CST
    severity:
      daysLeft: due_on
      ranges:
        - { max: 14, value: critical }
        - { max: 45, value: high }
      default: medium
    entity: key-date
    why: >-
      A contract milestone kept as a key date (a termination window, an option to extend, a price
      review, an offer that expires) is inside its notice period. Once it passes, the option is gone
      until the next term.
    fix: >-
      Take the decision the date calls for, then move due_on to the next milestone. Consider
      recording the contract in the contract register so its decision and owner are tracked.
    refs: [NIST-800-53:SA-4]
    refresh: 1d
    query:
