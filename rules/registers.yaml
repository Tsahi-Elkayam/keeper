        - { field: seats_used, op: exists }
        - { field: updated_at, op: age-gt, value: 90, threshold: registers.licence-usage-max-age-days }
        - any:
            - { field: expires_on, op: absent }
            - { field: days_left, op: ge, value: 0 }
    evidence: "{product} ({licence_id}): {seats_used} of {seats} units used, row last saved {updated_at}. Owner: {owner_shown}"

  # --------------------------------------------------------------- contracts
  - id: REG-CON-ENDING-UNDECIDED
    title: Contract ends within its notice period with no decision
    kind: missing
    lens: maintenance
    category: CST
    severity:
      daysLeft: end_on
      ranges:
        - { max: 14, value: critical }
        - { max: 45, value: high }
      default: medium
    entity: contract
    why: >-
      The date by which the organisation had to decide (renew, replace or end) has passed and no
      decision is recorded. Past that point the choice is made by default: an extension on the
      vendor's terms, a fall-back to list price, or a service that stops.
    fix: >-
      Get a decision from the owner and record it (renew, replace or end). If it is renew or
      replace, start the purchase now.
    refs: [NIST-800-53:SA-4, NIST-800-53:SA-9]
    refresh: 1d
    query:
      protocol: store
      key: contract_id
      name: title
      text: |
        SELECT c.contract_id,
               c.title,
               c.vendor_id,
               v.name AS vendor,
               c.system_id,
               NULLIF(TRIM(c.start_on), '') AS start_on,
               NULLIF(TRIM(c.end_on), '') AS end_on,
               c.notice_days,
               c.value,
               c.currency,
               COALESCE(c.decision, 'none') AS decision,
               NULLIF(TRIM(c.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(c.owner), ''), 'nobody') AS owner_shown,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(c.end_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(c.end_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(c.end_on), '')) - julianday(:today) AS INTEGER) - c.notice_days AS days_to_notice,
               date(NULLIF(TRIM(c.end_on), ''), '-' || c.notice_days || ' days') AS decide_by,
               (SELECT COUNT(*) FROM system_dependency d WHERE d.depends_on = c.system_id) AS dependants
        FROM contract c
        LEFT JOIN vendor v ON v.vendor_id = c.vendor_id
        LEFT JOIN system s ON s.system_id = c.system_id
    each:
      all:
        - { field: decision, op: in, value: [none, undecided] }
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: end_on
    evidence: "{title} ({contract_id}, {vendor}) ends {end_on}, {days_left} days left; decision was due {decide_by}, recorded: {decision}. Owner: {owner_shown}"

  - id: REG-CON-ENDING-PLANNED
    title: Contract ends by decision within its notice period
    kind: missing
    lens: both
    category: CST
    severity:
      field: dependants
      ranges:
        - { min: 1, value: high }
      default: medium
    entity: contract
    why: >-
