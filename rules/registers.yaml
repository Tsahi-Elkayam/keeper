        - { field: days_left, op: ge, value: 0 }
        - { field: days_left, op: le, value: 30, threshold: registers.contract-execution-days }
    deadline: end_on
    evidence: "{title} ({contract_id}, {vendor}): decision {decision}, but the recorded term still ends {end_on} ({days_left} days). Owner: {owner_shown}"

