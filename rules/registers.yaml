               l.cost,
               l.currency,
               NULLIF(TRIM(l.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(l.owner), ''), 'nobody') AS owner_shown,
               NULLIF(TRIM(l.notes), '') AS notes,
               l.updated_at,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(l.expires_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) - l.notice_days AS days_to_notice,
               date(NULLIF(TRIM(l.expires_on), ''), '-' || l.notice_days || ' days') AS renew_by,
               CASE WHEN l.seats > 0 AND l.seats_used IS NOT NULL
                    THEN ROUND(100.0 * l.seats_used / l.seats, 1) END AS used_pct,
               CASE WHEN l.seats IS NOT NULL AND l.seats_used IS NOT NULL
                    THEN l.seats - l.seats_used END AS seats_free,
               CASE WHEN l.cost IS NULL OR l.cost > 0 THEN 1 ELSE 0 END AS paid,
               (SELECT COUNT(*) FROM licence o
                 WHERE LOWER(TRIM(o.product)) = LOWER(TRIM(l.product))
                   AND o.licence_id <> l.licence_id
                   AND COALESCE(NULLIF(TRIM(o.expires_on), ''), '9999-12-31') >= :today) AS same_product_current
        FROM licence l
        LEFT JOIN vendor v ON v.vendor_id = l.vendor_id
        LEFT JOIN system s ON s.system_id = l.system_id
    each:
