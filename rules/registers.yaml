  # Many vendors require notice 30-90 days before the term ends. A notice period shorter than that
  # makes REG-LIC-AUTORENEW-DUE warn after the right to cancel or reduce has already passed.
  - id: REG-LIC-AUTORENEW-SHORT-NOTICE
    title: Auto-renewing licence has a notice period too short to cancel in time
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: medium
    entity: licence
    why: >-
      The licence renews by itself and the lead time recorded for it is shorter than the
      cancellation window such agreements usually carry. By the time the renewal warning fires, the
      chance to cancel, cut units or renegotiate has already gone - the register warns too late by
      construction.
    fix: >-
      Read the cancellation clause and set notice_days to that window plus the time a decision takes
      (often about 90 days). If the licence really can be cancelled at any time, record an exception
      for this licence with that reason.
    refs: [NIST-800-53:CM-10, NIST-800-53:SA-4]
    refresh: 1d
    query:
      protocol: store
      key: licence_id
      name: product
      text: |
        SELECT l.licence_id,
               l.product,
               l.vendor_id,
               v.name AS vendor,
               l.system_id,
               l.seats,
               l.seats_used,
               NULLIF(TRIM(l.expires_on), '') AS expires_on,
               l.notice_days,
               l.auto_renews,
               l.cost,
               l.currency,
               NULLIF(TRIM(l.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(l.owner), ''), 'nobody') AS owner_shown,
               NULLIF(TRIM(l.notes), '') AS notes,
               l.updated_at,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(l.expires_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) - l.notice_days AS days_to_notice,
               date(NULLIF(TRIM(l.expires_on), ''), '-' || l.notice_days || ' days') AS renew_by,
               CASE WHEN l.seats > 0 AND l.seats_used IS NOT NULL
                    THEN ROUND(100.0 * l.seats_used / l.seats, 1) END AS used_pct,
               CASE WHEN l.seats IS NOT NULL AND l.seats_used IS NOT NULL
                    THEN l.seats - l.seats_used END AS seats_free,
               CASE WHEN l.cost IS NULL OR l.cost > 0 THEN 1 ELSE 0 END AS paid,
               (SELECT COUNT(*) FROM licence o
                 WHERE LOWER(TRIM(o.product)) = LOWER(TRIM(l.product))
                   AND o.licence_id <> l.licence_id
                   AND COALESCE(NULLIF(TRIM(o.expires_on), ''), '9999-12-31') >= :today) AS same_product_current
        FROM licence l
