        - { field: decision, op: ne, value: end }
    deadline: end_on
    evidence: "{title} ({contract_id}, {vendor}) ended {end_on}, {days_past} days ago; decision recorded: {decision}. Owner: {owner_shown}"

  - id: REG-CON-RENEWAL-NOT-RECORDED
    title: Contract renewal decided but the new term is not recorded
    kind: missing
    lens: maintenance
    category: CST
    severity: medium
    entity: contract
    why: >-
