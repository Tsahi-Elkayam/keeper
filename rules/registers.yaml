  # --------------------------------------------------------------- key dates
  - id: REG-KEY-REPORT-DUE
    title: Report due date is near
    kind: missing
    lens: maintenance
    category: HYG
    severity:
      daysLeft: due_on
      ranges:
        - { max: 2, value: critical }
        - { max: 7, value: high }
      default: medium
    entity: key-date
    why: >-
      A report someone outside IT expects (regulator, management, auditor, customer) is due within
      its notice period. Late reports are noticed by the people who matter most.
    fix: >-
      Prepare and send the report, then move due_on to the next reporting date (or delete the row
      if it was a one-off).
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
        WHERE k.kind = 'report'
    each:
      all:
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: due_on
    evidence: "{title} ({key_date_id}) is due {due_on}, {days_left} days left. Owner: {owner_shown}"

  - id: REG-KEY-RENEWAL-DUE
    title: Renewal date is near
    kind: missing
    lens: maintenance
    category: CST
    severity:
      daysLeft: due_on
      ranges:
        - { max: 7, value: critical }
        - { max: 30, value: high }
      default: medium
    entity: key-date
    why: >-
      Something that has to be renewed - a subscription, a marketplace agreement, a domain name, a
      support plan, a registration - is inside its notice period. Missing it is an outage, a lost
      asset or billing at list price.
    fix: >-
      Renew it, then move due_on to the next renewal date. If it is a licence or contract, consider
      recording it in that register instead so seats and decisions are tracked too.
    refs: [NIST-800-53:SA-4]
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
        WHERE k.kind = 'renewal'
    each:
      all:
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: due_on
    evidence: "{title} ({key_date_id}) renews {due_on}, {days_left} days left. Owner: {owner_shown}"

  - id: REG-KEY-MAINTENANCE-DUE
    title: Planned maintenance window is near
    kind: missing
    lens: maintenance
    category: AVL
    severity:
      daysLeft: due_on
      ranges:
        - { max: 1, value: high }
        - { max: 7, value: medium }
      default: low
    entity: key-date
    why: >-
      A maintenance window (vendor, provider or internal) is coming. Without preparation users are
      surprised, changes collide with it and nobody watches the systems afterwards.
    fix: >-
      Tell the affected users, freeze conflicting changes, name who checks the systems afterwards,
      then move due_on to the next window or delete the row.
    refs: [NIST-800-53:MA-2]
    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
