        - { field: sla, op: absent }
        - { field: current_contracts, op: gt, value: 0 }
    evidence: "{name} ({vendor_id}) has {current_contracts} current contract(s) and no SLA recorded"

  - id: REG-VEN-ROW-STALE
    title: Vendor record in use has not been reviewed in a year
    kind: missing
    lens: maintenance
    category: HYG
    severity: low
    entity: vendor
    why: >-
      The vendor still has current agreements, but nothing in its register row - contacts, SLA, data
      handled, exit plan, review date - has been confirmed for over a year. Decisions in an incident
      or at renewal are then made on stale facts.
    fix: >-
      Confirm the row's fields with the vendor contact and the owner of the agreement, then save it
      (saving it unchanged also records the date).
    refs: [NIST-800-53:SA-9, CIS-Controls-v8:15.1]
    refresh: 1d
    query:
      protocol: store
      key: vendor_id
      name: name
      text: |
        SELECT v.vendor_id,
               v.name,
               v.sole_vendor,
               v.sensitive,
               NULLIF(TRIM(v.exit_plan), '') AS exit_plan,
               NULLIF(TRIM(v.sla), '') AS sla,
               NULLIF(TRIM(v.data_handled), '') AS data_handled,
               COALESCE(NULLIF(TRIM(v.data_handled), ''), 'unrecorded data') AS data_shown,
               NULLIF(TRIM(v.security_review_on), '') AS security_review_on,
               COALESCE(NULLIF(TRIM(v.security_review_on), ''), 'never') AS reviewed_shown,
               v.updated_at,
               COALESCE(date(NULLIF(TRIM(v.security_review_on), ''), '+' ||
                   COALESCE((SELECT st.value FROM setting st WHERE st.key = 'threshold.registers.vendor-review-days'), '365')
                   || ' days'), :today) AS review_due,
               (SELECT COUNT(*) FROM contract c
                 WHERE c.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(c.end_on), ''), '9999-12-31') >= :today) AS current_contracts,
               (SELECT COUNT(*) FROM licence l
                 WHERE l.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(l.expires_on), ''), '9999-12-31') >= :today) AS current_licences
        FROM vendor v
        WHERE v.state = 'confirmed'
    each:
      all:
        - { field: updated_at, op: age-gt, value: 365, threshold: registers.vendor-row-max-age-days }
        - any:
            - { field: current_contracts, op: gt, value: 0 }
            - { field: current_licences, op: gt, value: 0 }
    evidence: "{name} ({vendor_id}): row last saved {updated_at}; {current_contracts} current contract(s), {current_licences} licence(s)"

  # Vendors not (yet, or no longer) confirmed. A contract recorded with decision 'end' is being wound
  # down and does not count as current; a licence counts as ongoing when it renews by itself or has
  # no expiry date.
  - id: REG-VEN-REJECTED-WITH-AGREEMENT
    title: Rejected vendor still has a current contract or a renewing licence
    kind: misconfigured
    lens: both
    category: HYG
    severity: high
    entity: vendor
    why: >-
      The organisation decided to drop this vendor, yet the registers show an agreement that runs on.
      Either it is still paying a vendor it rejected, or the vendor keeps its access and its copies of
      the data while everyone believes the relationship has ended.
    fix: >-
      End the agreements (record the decision to end the contract, switch off the licence's automatic
      renewal), remove the vendor's accounts and access, and confirm the data was returned or
      destroyed. If the rejection was a mistake, set the vendor back to confirmed with a note.
    refs: [NIST-800-53:SA-9, NIST-800-53:PS-7, CIS-Controls-v8:15.7]
    refresh: 1d
    query:
      protocol: store
      key: vendor_id
      name: name
      text: |
        SELECT v.vendor_id,
               v.name,
               v.state,
               v.sensitive,
               v.updated_at,
               (SELECT COUNT(*) FROM contract c
                 WHERE c.vendor_id = v.vendor_id
                   AND COALESCE(c.decision, '') <> 'end'
                   AND COALESCE(NULLIF(TRIM(c.end_on), ''), '9999-12-31') >= :today) AS current_contracts,
               (SELECT COUNT(*) FROM licence l
                 WHERE l.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(l.expires_on), ''), '9999-12-31') >= :today) AS current_licences,
               (SELECT COUNT(*) FROM licence l
                 WHERE l.vendor_id = v.vendor_id
                   AND (l.auto_renews = 1 OR NULLIF(TRIM(l.expires_on), '') IS NULL)
                   AND COALESCE(NULLIF(TRIM(l.expires_on), ''), '9999-12-31') >= :today) AS ongoing_licences
        FROM vendor v
        WHERE v.state <> 'confirmed'
    each:
      all:
        - { field: state, op: eq, value: rejected }
        - any:
            - { field: current_contracts, op: gt, value: 0 }
            - { field: ongoing_licences, op: gt, value: 0 }
    evidence: "{name} ({vendor_id}) is rejected but has {current_contracts} current contract(s) not set to end and {ongoing_licences} licence(s) that renew or never expire"

  - id: REG-VEN-CANDIDATE-STALE
    title: Vendor left as a candidate
    kind: missing
    lens: both
    category: HYG
    severity: low
    entity: vendor
    why: >-
      A candidate vendor is one nobody has decided on. After a quarter it is an evaluation that was
      never finished - or, when agreements are already recorded, a vendor in use that was never
      confirmed and so never enters the sensitive-vendor and review rules, which read confirmed
      vendors only.
    fix: >-
      Decide: confirm the vendor (and classify the data it handles, with a security review where it
      is sensitive) or reject it and close what was started.
    refs: [NIST-800-53:SA-9, CIS-Controls-v8:15.1]
    refresh: 1d
    query:
      protocol: store
      key: vendor_id
      name: name
      text: |
        SELECT v.vendor_id,
               v.name,
               v.state,
               v.sensitive,
               v.updated_at,
               (SELECT COUNT(*) FROM contract c
                 WHERE c.vendor_id = v.vendor_id
                   AND COALESCE(c.decision, '') <> 'end'
                   AND COALESCE(NULLIF(TRIM(c.end_on), ''), '9999-12-31') >= :today) AS current_contracts,
               (SELECT COUNT(*) FROM licence l
                 WHERE l.vendor_id = v.vendor_id
                   AND COALESCE(NULLIF(TRIM(l.expires_on), ''), '9999-12-31') >= :today) AS current_licences,
               (SELECT COUNT(*) FROM licence l
                 WHERE l.vendor_id = v.vendor_id
                   AND (l.auto_renews = 1 OR NULLIF(TRIM(l.expires_on), '') IS NULL)
                   AND COALESCE(NULLIF(TRIM(l.expires_on), ''), '9999-12-31') >= :today) AS ongoing_licences
        FROM vendor v
        WHERE v.state <> 'confirmed'
    each:
      all:
        - { field: state, op: eq, value: candidate }
        - any:
            - { field: updated_at, op: age-gt, value: 90, threshold: registers.vendor-decision-days }
            - { field: current_contracts, op: gt, value: 0 }
            - { field: current_licences, op: gt, value: 0 }
    evidence: "{name} ({vendor_id}) is still a candidate (row last saved {updated_at}); {current_contracts} current contract(s), {current_licences} licence(s)"

  # ----------------------------------------------------------------- systems
  - id: REG-SYS-CRITICAL-NO-AGREEMENT
    title: Most critical system has no current contract or licence
    kind: missing
    lens: maintenance
    category: AVL
    severity: medium
    entity: system
    why: >-
      The system is marked criticality 1 - the organisation stops without it - yet no current
      contract or licence is recorded against it. Either its support is not in the registers (so no
      rule warns before it lapses), or it runs with no support at all.
    fix: >-
      Record the support contract or licence against the system. If it is supported in-house with no
      vendor, record an exception for this system that names the team responsible, so the answer is
      on record.
    refs: [NIST-800-53:SA-9, NIST-800-53:CP-2, ISO-27001:A.5.20]
    refresh: 1d
    query:
      protocol: store
      key: system_id
      name: name
      text: |
        SELECT s.system_id,
               s.name,
               s.criticality,
               s.team,
               s.owner,
               s.owner_person,
               COALESCE(NULLIF(TRIM(s.team), ''), 'no team') AS team_shown,
               (SELECT COUNT(*) FROM contract c
                 WHERE c.system_id = s.system_id
                   AND COALESCE(c.decision, '') <> 'end'
                   AND COALESCE(NULLIF(TRIM(c.end_on), ''), '9999-12-31') >= :today) AS current_contracts,
               (SELECT COUNT(*) FROM licence l
                 WHERE l.system_id = s.system_id
                   AND COALESCE(NULLIF(TRIM(l.expires_on), ''), '9999-12-31') >= :today) AS current_licences
        FROM system s
        WHERE s.active = 1 AND s.system_id NOT IN ('KEEPER', 'ORG', 'UNMAPPED')
    each:
      all:
        - { field: criticality, op: eq, value: 1 }
        - { field: current_contracts, op: eq, value: 0 }
        - { field: current_licences, op: eq, value: 0 }
    evidence: "{name} ({system_id}, criticality {criticality}, {team_shown}) has no current contract or licence in the registers"

  # ------------------------------------------------------------- initiatives
  # Saving initiatives: proposed -> approved -> in-progress -> done (or dropped). updated_at moves on
  # every save of the row, so "stale" means nobody saved it in the interval.
  - id: REG-INI-STALE
    title: Approved saving initiative has not moved in two months
    kind: missing
    lens: maintenance
    category: CST
    severity: medium
    entity: initiative
    why: >-
      Work that was approved and then stops moving is the saving that never reaches the bill, while
      the forecast still counts it.
    fix: >-
      The owner updates the status and notes (what was done, what blocks it). If it will not happen,
      drop it with the reason so the saving leaves the forecast.
    refs: [NIST-800-53:PM-3, NIST-800-53:SA-2]
    refresh: 1d
    query:
      protocol: store
      key: initiative_id
      name: title
      text: |
        SELECT i.initiative_id,
               i.title,
               i.status,
               NULLIF(TRIM(i.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(i.owner), ''), 'nobody') AS owner_shown,
               i.saving_monthly,
               i.currency,
               COALESCE(i.measured, 'not measured') AS measured,
               COALESCE(CAST(i.saving_monthly AS TEXT) || ' ' || COALESCE(i.currency, ''), 'no saving recorded') AS saving_shown,
               NULLIF(TRIM(i.notes), '') AS notes,
               i.updated_by,
               i.updated_at,
               CAST(julianday(:now) - julianday(i.updated_at) AS INTEGER) AS days_since_update
        FROM initiative i
    each:
      all:
        - { field: status, op: in, value: [approved, in-progress] }
        - { field: updated_at, op: age-gt, value: 60, threshold: registers.initiative-stale-days }
    evidence: "{title} ({initiative_id}) is {status} and unchanged for {days_since_update} days; monthly saving: {saving_shown} ({measured}). Owner: {owner_shown}"

  - id: REG-INI-NO-OWNER
    title: Approved saving initiative has no owner
    kind: missing
    lens: maintenance
    category: CST
    severity: medium
    entity: initiative
    why: >-
      A saving everyone agreed to and nobody is assigned to deliver does not happen.
    fix: >-
      Name the person who delivers it. If nobody will, drop it with the reason.
    refs: [NIST-800-53:PM-3]
    refresh: 1d
    query:
      protocol: store
      key: initiative_id
      name: title
      text: |
        SELECT i.initiative_id,
               i.title,
               i.status,
               NULLIF(TRIM(i.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(i.owner), ''), 'nobody') AS owner_shown,
               i.saving_monthly,
               i.currency,
               COALESCE(i.measured, 'not measured') AS measured,
               COALESCE(CAST(i.saving_monthly AS TEXT) || ' ' || COALESCE(i.currency, ''), 'no saving recorded') AS saving_shown,
               NULLIF(TRIM(i.notes), '') AS notes,
               i.updated_by,
               i.updated_at,
               CAST(julianday(:now) - julianday(i.updated_at) AS INTEGER) AS days_since_update
        FROM initiative i
    each:
      all:
        - { field: status, op: in, value: [approved, in-progress] }
        - { field: owner, op: absent }
    evidence: "{title} ({initiative_id}) is {status} with no owner"

  - id: REG-INI-NO-SAVING
    title: Approved saving initiative has no saving recorded
    kind: missing
    lens: maintenance
    category: CST
    severity: low
    entity: initiative
    why: >-
