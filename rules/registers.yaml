               l.seats,
               l.seats_used,
               NULLIF(TRIM(l.expires_on), '') AS expires_on,
               l.notice_days,
               l.auto_renews,
               l.cost,
               l.currency,
               NULLIF(TRIM(l.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(l.owner), ''), 'nobody') AS owner_shown,
               NULLIF(TRIM(l.notes), '') AS notes,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(l.expires_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) - l.notice_days AS days_to_notice,
               date(NULLIF(TRIM(l.expires_on), ''), '-' || l.notice_days || ' days') AS renew_by,
               CASE WHEN l.seats > 0 AND l.seats_used IS NOT NULL
                    THEN ROUND(100.0 * l.seats_used / l.seats, 1) END AS used_pct,
               CASE WHEN l.seats IS NOT NULL AND l.seats_used IS NOT NULL
                    THEN l.seats - l.seats_used END AS seats_free,
               CASE WHEN l.cost IS NULL OR l.cost > 0 THEN 1 ELSE 0 END AS paid,
               (SELECT COUNT(*) FROM licence o
                 WHERE LOWER(TRIM(o.product)) = LOWER(TRIM(l.product))
                   AND o.licence_id <> l.licence_id
                   AND COALESCE(NULLIF(TRIM(o.expires_on), ''), '9999-12-31') >= :today) AS same_product_current
        FROM licence l
        LEFT JOIN vendor v ON v.vendor_id = l.vendor_id
    each:
      all:
        - { field: seats, op: gt, value: 0 }
        - { field: seats_used, op: absent }
    deadline: expires_on
    evidence: "{product} ({licence_id}): {seats} units bought, usage unknown"

  # --------------------------------------------------------------- contracts
  - id: REG-CON-ENDING-UNDECIDED
    title: Contract ends within its notice period with no decision
    kind: missing
    lens: maintenance
    category: CST
    severity:
      daysLeft: end_on
      ranges:
        - { max: 14, value: critical }
        - { max: 45, value: high }
      default: medium
    entity: contract
    why: >-
      The date by which the organisation had to decide (renew, replace or end) has passed and no
      decision is recorded. Past that point the choice is made by default: an extension on the
      vendor's terms, a fall-back to list price, or a service that stops.
    fix: >-
      Get a decision from the owner and record it (renew, replace or end). If it is renew or
      replace, start the purchase now.
    refs: [NIST-800-53:SA-4, NIST-800-53:SA-9]
    refresh: 1d
    query:
      protocol: store
      key: contract_id
      name: title
      text: |
        SELECT c.contract_id,
               c.title,
               c.vendor_id,
               v.name AS vendor,
               c.system_id,
               NULLIF(TRIM(c.start_on), '') AS start_on,
               NULLIF(TRIM(c.end_on), '') AS end_on,
               c.notice_days,
               c.value,
               c.currency,
               COALESCE(c.decision, 'none') AS decision,
               NULLIF(TRIM(c.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(c.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(NULLIF(TRIM(c.end_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(c.end_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(c.end_on), '')) - julianday(:today) AS INTEGER) - c.notice_days AS days_to_notice,
               date(NULLIF(TRIM(c.end_on), ''), '-' || c.notice_days || ' days') AS decide_by,
               (SELECT COUNT(*) FROM system_dependency d WHERE d.depends_on = c.system_id) AS dependants
        FROM contract c
        LEFT JOIN vendor v ON v.vendor_id = c.vendor_id
    each:
      all:
        - { field: decision, op: in, value: [none, undecided] }
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: end_on
    evidence: "{title} ({contract_id}, {vendor}) ends {end_on}, {days_left} days left; decision was due {decide_by}, recorded: {decision}. Owner: {owner_shown}"

  - id: REG-CON-ENDING-PLANNED
    title: Contract ends by decision within its notice period
    kind: missing
    lens: both
    category: CST
    severity:
      field: dependants
      ranges:
        - { min: 1, value: high }
