schema: keeper.rules/1
system: registers
name: Licences, contracts, key dates and vendors
integration: keeper
# Rules over the registers people keep in Keeper's store (licence, contract, key_date, vendor,
# initiative) and the system register they point at.
# Dates are yyyy-MM-dd. Each register row's own notice_days says how early it needs attention;
# days_left and days_to_notice are computed in SQL against :today.
# Rules with the same query text share one read: the licence rules read the licence table once,
# the contract rules the contract table once, and so on. Keep the copies identical.
rules:
  # ---------------------------------------------------------------- licences
  - id: REG-LIC-EXPIRING
    title: Licence expires within its notice period
    kind: broken
    lens: both
    category: CST
    severity:
      daysLeft: expires_on
      ranges:
        - { max: 7, value: critical }
        - { max: 30, value: high }
        - { max: 60, value: medium }
      default: low
    entity: licence
    why: >-
      The licence does not renew by itself and its expiry is inside the lead time recorded for it.
      Quotes, approvals and orders take weeks; a renewal that was planned but never ordered looks
      exactly like this until the product stops or runs unlicensed.
    fix: >-
      Start the renewal with the owner now (quote, budget, order) and confirm the order was placed,
      or record the decision to let it lapse and plan the replacement. Update expires_on when the
      new term is confirmed.
    refs: [NIST-800-53:CM-10, NIST-800-53:SA-4]
    refresh: 1d
    query:
      protocol: store
      key: licence_id
      name: product
      text: |
        SELECT l.licence_id,
               l.product,
               l.vendor_id,
               v.name AS vendor,
               l.system_id,
               l.seats,
               l.seats_used,
               NULLIF(TRIM(l.expires_on), '') AS expires_on,
               l.notice_days,
               l.auto_renews,
               l.cost,
               l.currency,
               NULLIF(TRIM(l.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(l.owner), ''), 'nobody') AS owner_shown,
               NULLIF(TRIM(l.notes), '') AS notes,
               l.updated_at,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(l.expires_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) - l.notice_days AS days_to_notice,
               date(NULLIF(TRIM(l.expires_on), ''), '-' || l.notice_days || ' days') AS renew_by,
               CASE WHEN l.seats > 0 AND l.seats_used IS NOT NULL
                    THEN ROUND(100.0 * l.seats_used / l.seats, 1) END AS used_pct,
               CASE WHEN l.seats IS NOT NULL AND l.seats_used IS NOT NULL
                    THEN l.seats - l.seats_used END AS seats_free,
               CASE WHEN l.cost IS NULL OR l.cost > 0 THEN 1 ELSE 0 END AS paid,
               (SELECT COUNT(*) FROM licence o
                 WHERE LOWER(TRIM(o.product)) = LOWER(TRIM(l.product))
                   AND o.licence_id <> l.licence_id
                   AND COALESCE(NULLIF(TRIM(o.expires_on), ''), '9999-12-31') >= :today) AS same_product_current
        FROM licence l
        LEFT JOIN vendor v ON v.vendor_id = l.vendor_id
        LEFT JOIN system s ON s.system_id = l.system_id
    each:
      all:
        - { field: auto_renews, op: eq, value: 0 }
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: expires_on
    evidence: "{product} ({licence_id}) expires {expires_on}, {days_left} days left; renewal was due to start {renew_by} ({notice_days}-day notice). Owner: {owner_shown}"

  - id: REG-LIC-AUTORENEW-DUE
    title: Auto-renewing licence renews within its notice period
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: licence
    why: >-
      An automatic renewal commits money and a unit count without anyone deciding, and some terms
      fall back to list price if nobody renews on the negotiated offer. The notice period is the
      last chance to cut unused seats, renegotiate or cancel.
    fix: >-
      Have the owner confirm the seat count and price before the renewal date, or cancel. After it
      renews, set expires_on to the new end of term.
    refs: [NIST-800-53:CM-10]
    refresh: 1d
    query:
      protocol: store
      key: licence_id
      name: product
      text: |
        SELECT l.licence_id,
               l.product,
               l.vendor_id,
               v.name AS vendor,
               l.system_id,
               l.seats,
               l.seats_used,
               NULLIF(TRIM(l.expires_on), '') AS expires_on,
               l.notice_days,
               l.auto_renews,
               l.cost,
               l.currency,
               NULLIF(TRIM(l.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(l.owner), ''), 'nobody') AS owner_shown,
               NULLIF(TRIM(l.notes), '') AS notes,
               l.updated_at,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(l.expires_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) - l.notice_days AS days_to_notice,
               date(NULLIF(TRIM(l.expires_on), ''), '-' || l.notice_days || ' days') AS renew_by,
               CASE WHEN l.seats > 0 AND l.seats_used IS NOT NULL
                    THEN ROUND(100.0 * l.seats_used / l.seats, 1) END AS used_pct,
               CASE WHEN l.seats IS NOT NULL AND l.seats_used IS NOT NULL
                    THEN l.seats - l.seats_used END AS seats_free,
               CASE WHEN l.cost IS NULL OR l.cost > 0 THEN 1 ELSE 0 END AS paid,
               (SELECT COUNT(*) FROM licence o
                 WHERE LOWER(TRIM(o.product)) = LOWER(TRIM(l.product))
                   AND o.licence_id <> l.licence_id
                   AND COALESCE(NULLIF(TRIM(o.expires_on), ''), '9999-12-31') >= :today) AS same_product_current
        FROM licence l
        LEFT JOIN vendor v ON v.vendor_id = l.vendor_id
        LEFT JOIN system s ON s.system_id = l.system_id
    each:
      all:
        - { field: auto_renews, op: eq, value: 1 }
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: expires_on
    evidence: "{product} ({licence_id}) renews automatically on {expires_on}, {days_left} days left; confirm units and price before then. Owner: {owner_shown}"

  - id: REG-LIC-EXPIRED
    title: Licence has expired
    kind: broken
    lens: both
    category: CST
    severity:
      field: auto_renews
      map: { "0": critical, "1": medium }
      default: critical
    entity: licence
    why: >-
      The recorded expiry date has passed. Either the product now runs unlicensed or has stopped
      (support, updates and protection signatures usually stop first), or it renewed and the
      register is out of date - in which case every other date in it is suspect too.
    fix: >-
      Renew or retire the product today. If it already renewed, set expires_on to the new end of
      term; if it was retired, delete the licence row.
    refs: [NIST-800-53:CM-10]
    refresh: 1d
    query:
      protocol: store
      key: licence_id
      name: product
      text: |
        SELECT l.licence_id,
               l.product,
               l.vendor_id,
               v.name AS vendor,
               l.system_id,
               l.seats,
               l.seats_used,
               NULLIF(TRIM(l.expires_on), '') AS expires_on,
               l.notice_days,
               l.auto_renews,
               l.cost,
               l.currency,
               NULLIF(TRIM(l.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(l.owner), ''), 'nobody') AS owner_shown,
               NULLIF(TRIM(l.notes), '') AS notes,
               l.updated_at,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(l.expires_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) - l.notice_days AS days_to_notice,
               date(NULLIF(TRIM(l.expires_on), ''), '-' || l.notice_days || ' days') AS renew_by,
               CASE WHEN l.seats > 0 AND l.seats_used IS NOT NULL
                    THEN ROUND(100.0 * l.seats_used / l.seats, 1) END AS used_pct,
               CASE WHEN l.seats IS NOT NULL AND l.seats_used IS NOT NULL
                    THEN l.seats - l.seats_used END AS seats_free,
               CASE WHEN l.cost IS NULL OR l.cost > 0 THEN 1 ELSE 0 END AS paid,
               (SELECT COUNT(*) FROM licence o
                 WHERE LOWER(TRIM(o.product)) = LOWER(TRIM(l.product))
                   AND o.licence_id <> l.licence_id
                   AND COALESCE(NULLIF(TRIM(o.expires_on), ''), '9999-12-31') >= :today) AS same_product_current
        FROM licence l
        LEFT JOIN vendor v ON v.vendor_id = l.vendor_id
        LEFT JOIN system s ON s.system_id = l.system_id
    each: { field: days_left, op: lt, value: 0 }
    deadline: expires_on
    evidence: "{product} ({licence_id}) expired on {expires_on}, {days_past} days ago (auto-renews: {auto_renews}). Owner: {owner_shown}"

  - id: REG-LIC-NO-EXPIRY
    title: Licence has no expiry date recorded
    kind: missing
    lens: maintenance
    category: CST
    severity: low
    entity: licence
    why: >-
      Without an expiry date no rule can warn before the licence lapses, which is exactly the
      surprise the register exists to prevent. A term copied in incompletely ends up here too.
    fix: >-
      Record expires_on from the order or the vendor portal. For a genuinely perpetual licence,
      write the word "perpetual" in its notes so it is not reported again.
    refs: [NIST-800-53:CM-10]
    refresh: 1d
    query:
      protocol: store
      key: licence_id
      name: product
      text: |
        SELECT l.licence_id,
               l.product,
               l.vendor_id,
               v.name AS vendor,
               l.system_id,
               l.seats,
               l.seats_used,
               NULLIF(TRIM(l.expires_on), '') AS expires_on,
               l.notice_days,
               l.auto_renews,
               l.cost,
               l.currency,
               NULLIF(TRIM(l.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(l.owner), ''), 'nobody') AS owner_shown,
               NULLIF(TRIM(l.notes), '') AS notes,
               l.updated_at,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(l.expires_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) - l.notice_days AS days_to_notice,
               date(NULLIF(TRIM(l.expires_on), ''), '-' || l.notice_days || ' days') AS renew_by,
               CASE WHEN l.seats > 0 AND l.seats_used IS NOT NULL
                    THEN ROUND(100.0 * l.seats_used / l.seats, 1) END AS used_pct,
               CASE WHEN l.seats IS NOT NULL AND l.seats_used IS NOT NULL
                    THEN l.seats - l.seats_used END AS seats_free,
               CASE WHEN l.cost IS NULL OR l.cost > 0 THEN 1 ELSE 0 END AS paid,
               (SELECT COUNT(*) FROM licence o
                 WHERE LOWER(TRIM(o.product)) = LOWER(TRIM(l.product))
                   AND o.licence_id <> l.licence_id
                   AND COALESCE(NULLIF(TRIM(o.expires_on), ''), '9999-12-31') >= :today) AS same_product_current
        FROM licence l
        LEFT JOIN vendor v ON v.vendor_id = l.vendor_id
        LEFT JOIN system s ON s.system_id = l.system_id
    each:
      all:
        - { field: expires_on, op: absent }
        - any:
            - { field: notes, op: absent }
            - { field: notes, op: notmatch, value: perpetual }
    evidence: "{product} ({licence_id}) has no expiry date. Owner: {owner_shown}"

  - id: REG-LIC-SEATS-AT-CAP
    title: Licence seats used at or over the cap
    kind: broken
    lens: maintenance
    category: CST
    severity:
      field: seats_free
      ranges:
        - { max: -1, value: high }
      default: medium
    entity: licence
    why: >-
      At the cap the next user, device or workload cannot be added - often discovered when a joiner
      is blocked. Over the cap is a compliance exposure: an audit or true-up bills the difference,
      often at list price and backdated. Free tiers have caps too, and usually no support to raise
      them quickly.
    fix: >-
      Reclaim units from leavers and idle accounts, or order more (or request a cap increase)
      before demand hits it; then verify the new cap in the vendor console and update seats.
      Seats can be any unit the licence counts: users, devices, hosts, cores, GB or credits.
    refs: [NIST-800-53:CM-10]
    refresh: 1d
    query:
      protocol: store
      key: licence_id
      name: product
      text: |
        SELECT l.licence_id,
               l.product,
               l.vendor_id,
               v.name AS vendor,
               l.system_id,
               l.seats,
               l.seats_used,
               NULLIF(TRIM(l.expires_on), '') AS expires_on,
               l.notice_days,
               l.auto_renews,
               l.cost,
               l.currency,
               NULLIF(TRIM(l.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(l.owner), ''), 'nobody') AS owner_shown,
               NULLIF(TRIM(l.notes), '') AS notes,
               l.updated_at,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(l.expires_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) - l.notice_days AS days_to_notice,
               date(NULLIF(TRIM(l.expires_on), ''), '-' || l.notice_days || ' days') AS renew_by,
               CASE WHEN l.seats > 0 AND l.seats_used IS NOT NULL
                    THEN ROUND(100.0 * l.seats_used / l.seats, 1) END AS used_pct,
               CASE WHEN l.seats IS NOT NULL AND l.seats_used IS NOT NULL
                    THEN l.seats - l.seats_used END AS seats_free,
               CASE WHEN l.cost IS NULL OR l.cost > 0 THEN 1 ELSE 0 END AS paid,
               (SELECT COUNT(*) FROM licence o
                 WHERE LOWER(TRIM(o.product)) = LOWER(TRIM(l.product))
                   AND o.licence_id <> l.licence_id
                   AND COALESCE(NULLIF(TRIM(o.expires_on), ''), '9999-12-31') >= :today) AS same_product_current
        FROM licence l
        LEFT JOIN vendor v ON v.vendor_id = l.vendor_id
        LEFT JOIN system s ON s.system_id = l.system_id
    each:
      all:
        - { field: seats, op: gt, value: 0 }
        - { field: seats_free, op: le, value: 0 }
    deadline: expires_on
    evidence: "{product} ({licence_id}): {seats_used} units used of a cap of {seats} ({seats_free} free). Owner: {owner_shown}"

  - id: REG-LIC-SEATS-NEARLY-FULL
    title: Licence is nearly out of seats
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: licence
    why: >-
      With almost every unit taken, the next joiner or new server waits for a purchase, or someone
      quietly reuses an account or goes over the count.
    fix: Reclaim seats from leavers and idle accounts, or order more ahead of demand.
    refs: [NIST-800-53:CM-10]
    refresh: 1d
    query:
      protocol: store
      key: licence_id
      name: product
      text: |
        SELECT l.licence_id,
               l.product,
               l.vendor_id,
               v.name AS vendor,
               l.system_id,
               l.seats,
               l.seats_used,
               NULLIF(TRIM(l.expires_on), '') AS expires_on,
               l.notice_days,
               l.auto_renews,
               l.cost,
               l.currency,
               NULLIF(TRIM(l.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(l.owner), ''), 'nobody') AS owner_shown,
               NULLIF(TRIM(l.notes), '') AS notes,
               l.updated_at,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(l.expires_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) - l.notice_days AS days_to_notice,
               date(NULLIF(TRIM(l.expires_on), ''), '-' || l.notice_days || ' days') AS renew_by,
               CASE WHEN l.seats > 0 AND l.seats_used IS NOT NULL
                    THEN ROUND(100.0 * l.seats_used / l.seats, 1) END AS used_pct,
               CASE WHEN l.seats IS NOT NULL AND l.seats_used IS NOT NULL
                    THEN l.seats - l.seats_used END AS seats_free,
               CASE WHEN l.cost IS NULL OR l.cost > 0 THEN 1 ELSE 0 END AS paid,
               (SELECT COUNT(*) FROM licence o
                 WHERE LOWER(TRIM(o.product)) = LOWER(TRIM(l.product))
                   AND o.licence_id <> l.licence_id
                   AND COALESCE(NULLIF(TRIM(o.expires_on), ''), '9999-12-31') >= :today) AS same_product_current
        FROM licence l
        LEFT JOIN vendor v ON v.vendor_id = l.vendor_id
        LEFT JOIN system s ON s.system_id = l.system_id
    each:
      all:
        - { field: seats_free, op: gt, value: 0 }
        - { field: used_pct, op: ge, value: 95, threshold: registers.licence-full-pct }
    evidence: "{product} ({licence_id}): {seats_used} of {seats} units used ({used_pct}%)"

  - id: REG-LIC-UNUSED-SEATS
    title: Paid licence seats mostly unused
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: medium
    entity: licence
    why: >-
      Units that are paid for and not used are money spent every term for nothing; the cheapest
      moment to drop them is before the next renewal.
    fix: >-
      Agree the real need with the owner and reduce the count at the next renewal (or now, if the
      contract allows). Correct seats_used if the register is behind.
    refs: [NIST-800-53:CM-10]
    refresh: 1d
    query:
      protocol: store
      key: licence_id
      name: product
      text: |
        SELECT l.licence_id,
               l.product,
               l.vendor_id,
               v.name AS vendor,
               l.system_id,
               l.seats,
               l.seats_used,
               NULLIF(TRIM(l.expires_on), '') AS expires_on,
               l.notice_days,
               l.auto_renews,
               l.cost,
               l.currency,
               NULLIF(TRIM(l.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(l.owner), ''), 'nobody') AS owner_shown,
               NULLIF(TRIM(l.notes), '') AS notes,
               l.updated_at,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(l.expires_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) - l.notice_days AS days_to_notice,
               date(NULLIF(TRIM(l.expires_on), ''), '-' || l.notice_days || ' days') AS renew_by,
               CASE WHEN l.seats > 0 AND l.seats_used IS NOT NULL
                    THEN ROUND(100.0 * l.seats_used / l.seats, 1) END AS used_pct,
               CASE WHEN l.seats IS NOT NULL AND l.seats_used IS NOT NULL
                    THEN l.seats - l.seats_used END AS seats_free,
               CASE WHEN l.cost IS NULL OR l.cost > 0 THEN 1 ELSE 0 END AS paid,
               (SELECT COUNT(*) FROM licence o
                 WHERE LOWER(TRIM(o.product)) = LOWER(TRIM(l.product))
                   AND o.licence_id <> l.licence_id
                   AND COALESCE(NULLIF(TRIM(o.expires_on), ''), '9999-12-31') >= :today) AS same_product_current
        FROM licence l
        LEFT JOIN vendor v ON v.vendor_id = l.vendor_id
        LEFT JOIN system s ON s.system_id = l.system_id
    each:
      all:
        - { field: paid, op: eq, value: 1 }
        - { field: used_pct, op: lt, value: 70, threshold: registers.licence-min-used-pct }
        - { field: seats_free, op: ge, value: 5, threshold: registers.licence-min-idle-seats }
    deadline: expires_on
    evidence: "{product} ({licence_id}): {seats_used} of {seats} units used ({used_pct}%), {seats_free} idle; cost {cost} {currency}, term ends {expires_on}"

  - id: REG-LIC-DUPLICATE-PRODUCT
    title: Another current licence exists for the same product
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: licence
    why: >-
      Two current licences for the same product can mean paying twice - a new offer or order
      accepted while an existing agreement for the same thing still runs.
    fix: >-
      Compare the terms of both. Merge or cancel one before its next charge, or rename the products
      so the register shows why they are different (edition, department, environment).
    refs: [NIST-800-53:CM-10]
    refresh: 1d
    query:
      protocol: store
      key: licence_id
      name: product
      text: |
        SELECT l.licence_id,
               l.product,
               l.vendor_id,
               v.name AS vendor,
               l.system_id,
               l.seats,
               l.seats_used,
               NULLIF(TRIM(l.expires_on), '') AS expires_on,
               l.notice_days,
               l.auto_renews,
               l.cost,
               l.currency,
               NULLIF(TRIM(l.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(l.owner), ''), 'nobody') AS owner_shown,
               NULLIF(TRIM(l.notes), '') AS notes,
               l.updated_at,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(l.expires_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) - l.notice_days AS days_to_notice,
               date(NULLIF(TRIM(l.expires_on), ''), '-' || l.notice_days || ' days') AS renew_by,
               CASE WHEN l.seats > 0 AND l.seats_used IS NOT NULL
                    THEN ROUND(100.0 * l.seats_used / l.seats, 1) END AS used_pct,
               CASE WHEN l.seats IS NOT NULL AND l.seats_used IS NOT NULL
                    THEN l.seats - l.seats_used END AS seats_free,
               CASE WHEN l.cost IS NULL OR l.cost > 0 THEN 1 ELSE 0 END AS paid,
               (SELECT COUNT(*) FROM licence o
                 WHERE LOWER(TRIM(o.product)) = LOWER(TRIM(l.product))
                   AND o.licence_id <> l.licence_id
                   AND COALESCE(NULLIF(TRIM(o.expires_on), ''), '9999-12-31') >= :today) AS same_product_current
        FROM licence l
        LEFT JOIN vendor v ON v.vendor_id = l.vendor_id
        LEFT JOIN system s ON s.system_id = l.system_id
    each:
      all:
        - { field: same_product_current, op: gt, value: 0 }
        - any:
            - { field: expires_on, op: absent }
            - { field: days_left, op: ge, value: 0 }
    deadline: expires_on
    evidence: "{product} ({licence_id}, vendor {vendor}) has {same_product_current} other current licence(s) for the same product"

  - id: REG-LIC-NO-OWNER
    title: Licence has no owner
    kind: missing
    lens: maintenance
    category: CST
    severity: medium
    entity: licence
    why: >-
      A licence nobody owns is renewed by nobody: the notice period passes unnoticed and the first
      sign is the product stopping.
    fix: >-
      Name the person or team responsible for renewing and right-sizing it, and point the vendor's
      renewal notices at a shared mailbox rather than one person.
    refs: [NIST-800-53:CM-10]
    refresh: 1d
    query:
      protocol: store
      key: licence_id
      name: product
      text: |
        SELECT l.licence_id,
               l.product,
               l.vendor_id,
               v.name AS vendor,
               l.system_id,
               l.seats,
               l.seats_used,
               NULLIF(TRIM(l.expires_on), '') AS expires_on,
               l.notice_days,
               l.auto_renews,
               l.cost,
               l.currency,
               NULLIF(TRIM(l.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(l.owner), ''), 'nobody') AS owner_shown,
               NULLIF(TRIM(l.notes), '') AS notes,
               l.updated_at,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(l.expires_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(l.expires_on), '')) - julianday(:today) AS INTEGER) - l.notice_days AS days_to_notice,
               date(NULLIF(TRIM(l.expires_on), ''), '-' || l.notice_days || ' days') AS renew_by,
               CASE WHEN l.seats > 0 AND l.seats_used IS NOT NULL
                    THEN ROUND(100.0 * l.seats_used / l.seats, 1) END AS used_pct,
               CASE WHEN l.seats IS NOT NULL AND l.seats_used IS NOT NULL
                    THEN l.seats - l.seats_used END AS seats_free,
               CASE WHEN l.cost IS NULL OR l.cost > 0 THEN 1 ELSE 0 END AS paid,
               (SELECT COUNT(*) FROM licence o
                 WHERE LOWER(TRIM(o.product)) = LOWER(TRIM(l.product))
                   AND o.licence_id <> l.licence_id
                   AND COALESCE(NULLIF(TRIM(o.expires_on), ''), '9999-12-31') >= :today) AS same_product_current
        FROM licence l
        LEFT JOIN vendor v ON v.vendor_id = l.vendor_id
        LEFT JOIN system s ON s.system_id = l.system_id
    each: { field: owner, op: absent }
    deadline: expires_on
    evidence: "{product} ({licence_id}) has no owner; expires {expires_on}"

