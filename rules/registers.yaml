      really covers. If the system is still in use, set it active again.
    refs: [NIST-800-53:SA-4, NIST-800-53:SA-9]
    refresh: 1d
    query:
      protocol: store
      key: contract_id
      name: title
      text: |
        SELECT c.contract_id,
               c.title,
               c.vendor_id,
               v.name AS vendor,
               c.system_id,
               NULLIF(TRIM(c.start_on), '') AS start_on,
               NULLIF(TRIM(c.end_on), '') AS end_on,
               c.notice_days,
               c.value,
               c.currency,
               COALESCE(c.decision, 'none') AS decision,
               NULLIF(TRIM(c.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(c.owner), ''), 'nobody') AS owner_shown,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(c.end_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(c.end_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(c.end_on), '')) - julianday(:today) AS INTEGER) - c.notice_days AS days_to_notice,
               date(NULLIF(TRIM(c.end_on), ''), '-' || c.notice_days || ' days') AS decide_by,
               (SELECT COUNT(*) FROM system_dependency d WHERE d.depends_on = c.system_id) AS dependants
        FROM contract c
        LEFT JOIN vendor v ON v.vendor_id = c.vendor_id
        LEFT JOIN system s ON s.system_id = c.system_id
    each:
      all:
        - { field: system_active, op: eq, value: 0 }
        - { field: decision, op: ne, value: end }
        - any:
            - { field: end_on, op: absent }
            - { field: days_left, op: ge, value: 0 }
    deadline: end_on
    evidence: "{title} ({contract_id}, {vendor}) runs until {end_on} but system {system_name} ({system_id}) is inactive; decision recorded: {decision}. Owner: {owner_shown}"

  - id: REG-CON-NOTICE-TOO-SHORT
    title: Contract notice period is too short to act on
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: medium
    entity: contract
    why: >-
      notice_days decides when the register asks for a renewal decision. The register's default is
      90 days, so a value under a month was typed on purpose or copied from a renewal reminder - and
      the decision date it produces arrives after the contractual termination notice has passed.
    fix: >-
      Set notice_days to the contract's termination notice plus the time procurement needs to
      replace or renew it.
    refs: [NIST-800-53:SA-4]
    refresh: 1d
    query:
      protocol: store
      key: contract_id
      name: title
      text: |
        SELECT c.contract_id,
               c.title,
               c.vendor_id,
               v.name AS vendor,
               c.system_id,
               NULLIF(TRIM(c.start_on), '') AS start_on,
               NULLIF(TRIM(c.end_on), '') AS end_on,
               c.notice_days,
               c.value,
               c.currency,
               COALESCE(c.decision, 'none') AS decision,
               NULLIF(TRIM(c.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(c.owner), ''), 'nobody') AS owner_shown,
               s.active AS system_active,
               s.name AS system_name,
               CAST(julianday(NULLIF(TRIM(c.end_on), '')) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(NULLIF(TRIM(c.end_on), '')) AS INTEGER) AS days_past,
               CAST(julianday(NULLIF(TRIM(c.end_on), '')) - julianday(:today) AS INTEGER) - c.notice_days AS days_to_notice,
               date(NULLIF(TRIM(c.end_on), ''), '-' || c.notice_days || ' days') AS decide_by,
               (SELECT COUNT(*) FROM system_dependency d WHERE d.depends_on = c.system_id) AS dependants
        FROM contract c
        LEFT JOIN vendor v ON v.vendor_id = c.vendor_id
        LEFT JOIN system s ON s.system_id = c.system_id
    each:
      all:
        - { field: notice_days, op: lt, value: 30, threshold: registers.min-contract-notice-days }
        - { field: decision, op: ne, value: end }
        - any:
            - { field: end_on, op: absent }
            - { field: days_left, op: ge, value: 0 }
    deadline: end_on
    evidence: "{title} ({contract_id}, {vendor}) ends {end_on} with only {notice_days} days' notice recorded. Owner: {owner_shown}"

