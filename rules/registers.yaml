    refresh: 1d
    query:
      protocol: store
      key: key_date_id
      name: title
      text: |
        SELECT k.key_date_id,
               k.kind,
               k.title,
               k.due_on,
               k.notice_days,
               k.system_id,
               NULLIF(TRIM(k.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(k.owner), ''), 'nobody') AS owner_shown,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) AS days_left,
               CAST(julianday(:today) - julianday(k.due_on) AS INTEGER) AS days_past,
               CAST(julianday(k.due_on) - julianday(:today) AS INTEGER) - k.notice_days AS days_to_notice
        FROM key_date k
        WHERE k.kind = 'maintenance'
    each:
      all:
        - { field: days_left, op: ge, value: 0 }
        - { field: days_to_notice, op: le, value: 0 }
    deadline: due_on
    evidence: "{title} ({key_date_id}) on {due_on}, {days_left} days left. Owner: {owner_shown}"

  - id: REG-KEY-CERTIFICATE-DUE
    title: Recorded certificate expires within its notice period
    kind: broken
    lens: security
    category: PKI
    severity:
      daysLeft: due_on
      ranges:
        - { max: 7, value: critical }
        - { max: 14, value: high }
      default: medium
    entity: key-date
    why: >-
      A certificate that no TLS scan can reach (signing certificates, CA and KDC certificates,
      identity provider and federation certificates, device and client certificates) is about to
      expire. These fail just as hard as web certificates and are usually forgotten.
    fix: >-
      Renew the certificate, distribute it to every party that trusts it (federation partners,
      apps, devices), then move due_on to the new expiry date.
