    refs: [NIST-800-53:SA-2, NIST-800-53:PM-3]
    refresh: 1d
    query:
      protocol: store
      key: initiative_id
      name: title
      text: |
        SELECT i.initiative_id,
               i.title,
               i.status,
               NULLIF(TRIM(i.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(i.owner), ''), 'nobody') AS owner_shown,
               i.saving_monthly,
               i.currency,
               COALESCE(i.measured, 'not measured') AS measured,
               COALESCE(CAST(i.saving_monthly AS TEXT) || ' ' || COALESCE(i.currency, ''), 'no saving recorded') AS saving_shown,
               NULLIF(TRIM(i.notes), '') AS notes,
               i.updated_by,
               i.updated_at,
               CAST(julianday(:now) - julianday(i.updated_at) AS INTEGER) AS days_since_update
        FROM initiative i
    each:
      all:
        - { field: status, op: in, value: [approved, in-progress] }
        - { field: saving_monthly, op: absent }
    evidence: "{title} ({initiative_id}) is {status} with no monthly saving recorded. Owner: {owner_shown}"

  - id: REG-INI-DONE-ESTIMATE-ONLY
    title: Completed saving initiative was never measured on the bill
    kind: missing
    lens: maintenance
    category: CST
    severity: low
    entity: initiative
    why: >-
      The initiative is marked done but its saving is still an estimate, or not measured at all. It
      is reported as achieved without the invoice proving it, and savings that did not materialise
      stay in the totals.
    fix: >-
      Compare the invoices before and after, record the measured figure in saving_monthly and set
      measured to bill. If the saving did not appear, say so in notes.
    refs: [NIST-800-53:PM-3, NIST-800-53:SA-2]
    refresh: 1d
    query:
      protocol: store
      key: initiative_id
      name: title
      text: |
        SELECT i.initiative_id,
               i.title,
               i.status,
               NULLIF(TRIM(i.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(i.owner), ''), 'nobody') AS owner_shown,
               i.saving_monthly,
               i.currency,
               COALESCE(i.measured, 'not measured') AS measured,
               COALESCE(CAST(i.saving_monthly AS TEXT) || ' ' || COALESCE(i.currency, ''), 'no saving recorded') AS saving_shown,
               NULLIF(TRIM(i.notes), '') AS notes,
               i.updated_by,
               i.updated_at,
               CAST(julianday(:now) - julianday(i.updated_at) AS INTEGER) AS days_since_update
        FROM initiative i
    each:
      all:
        - { field: status, op: eq, value: done }
        - { field: measured, op: ne, value: bill }
    evidence: "{title} ({initiative_id}) is done; monthly saving {saving_shown} is {measured}. Owner: {owner_shown}"

  - id: REG-INI-PROPOSED-STALE
    title: Proposed saving initiative has waited a quarter for a decision
    kind: missing
    lens: maintenance
    category: CST
    severity: low
    entity: initiative
    why: >-
      A proposal nobody approves or rejects keeps its saving in limbo and its author waiting; after a
      quarter the figures it was based on are probably out of date too.
    fix: >-
      Approve it or drop it; a dropped proposal keeps the reason in notes.
    refs: [NIST-800-53:PM-3]
    refresh: 1d
    query:
      protocol: store
      key: initiative_id
      name: title
      text: |
        SELECT i.initiative_id,
               i.title,
               i.status,
               NULLIF(TRIM(i.owner), '') AS owner,
               COALESCE(NULLIF(TRIM(i.owner), ''), 'nobody') AS owner_shown,
               i.saving_monthly,
               i.currency,
               COALESCE(i.measured, 'not measured') AS measured,
               COALESCE(CAST(i.saving_monthly AS TEXT) || ' ' || COALESCE(i.currency, ''), 'no saving recorded') AS saving_shown,
               NULLIF(TRIM(i.notes), '') AS notes,
               i.updated_by,
               i.updated_at,
               CAST(julianday(:now) - julianday(i.updated_at) AS INTEGER) AS days_since_update
        FROM initiative i
    each:
      all:
        - { field: status, op: eq, value: proposed }
        - { field: updated_at, op: age-gt, value: 90, threshold: registers.initiative-decision-days }
    evidence: "{title} ({initiative_id}) has been proposed for {days_since_update} days without a decision. Owner: {owner_shown}"
