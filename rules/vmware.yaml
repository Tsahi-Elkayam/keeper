schema: keeper.rules/1
system: vmware
name: VMware vCenter and vCenter Server Appliance
integration: vcenter
# Endpoint: the vCenter base URL (https://vcenter.example.org). The integration creates the API session
# (POST /api/session) and adds the vmware-api-session-id header; rules only name GET paths.
#
# Two base paths are used on purpose:
#   /api/...   vSphere Automation API (7.0 U2 and later). Lists come back as a JSON array of objects.
#   /rest/...  the older, deprecated base path, still served by 7.x and 8.x. It wraps every answer in
#              {"value": ...} and renders maps as [{key, value}] lists. It is used only where /api returns a
#              bare string, boolean or map (appliance health colours, SSH, time sync, backup schedules and
#              job details), because a bare value cannot become a row. The session id is the same for both.
# Field names follow the vSphere Automation API reference (8.0.3 data structures).
# Per-VM rules use for_each: the VM list (/api/vcenter/vm, powered-on only) is read first, then one GET per
# VM; each row carries the VM summary as "parent". Capped at 2000 VMs - beyond that the result is partial.
# Still not readable: a bare array of strings (/api/appliance/local-accounts, /rest/appliance/ntp) gives
# no rows, so no rule counts one - an empty answer would look like a pass.
defaults:
  lens: maintenance
  refresh: 1d
rules:

  # ---- hosts ---------------------------------------------------------------------------------

  - id: VMW-HOST-CONNECTION
    title: ESXi host is not connected to vCenter
    kind: broken
    category: AVL
    severity:
      field: connection_state
      map: { NOT_RESPONDING: critical, DISCONNECTED: high }
      default: high
    entity: host
    refresh: 6h
    why: A host that is not responding keeps running its VMs, but vCenter can no longer manage, migrate or back them up, and HA cannot protect them.
    fix: Check the host's management network and the vpxa/hostd agents; reconnect the host from vCenter once it answers.
    refs: [NIST-800-53:CP-10]
    query:
      protocol: http
      path: /api/vcenter/host
      paging: none
      key: host
      name: name
    each: { field: connection_state, op: ne, value: CONNECTED }
    evidence: "{name}: connection state {connection_state}"

  - id: VMW-HOST-NOT-POWERED-ON
    title: Connected ESXi host is in standby or powered off
    kind: broken
    category: AVL
    severity: low
    entity: host
    why: A host in standby (power management) or powered off is capacity the cluster counts on for failover but cannot use until it wakes.
    fix: Confirm the standby is intended by the power-management policy; otherwise power the host on and exit standby.
    query:
      protocol: http
      path: /api/vcenter/host
      paging: none
      key: host
      name: name
    each:
      all:
        - { field: connection_state, op: eq, value: CONNECTED }
        - { field: power_state, op: ne, value: POWERED_ON }
    evidence: "{name}: power state {power_state}"

  - id: VMW-HOST-NONE
    title: vCenter returned no ESXi hosts
    kind: missing
    category: MON
    severity: medium
    entity: instance
    why: An empty host list means the review account cannot read the inventory, or this vCenter manages no hosts; either way every other host rule stays silent and the result looks clean.
    fix: Give the review account the read-only role on the vCenter root object with propagation, then rerun the scan.
    refs: [NIST-800-53:CA-7]
    query:
      protocol: http
      path: /api/vcenter/host
      paging: none
      key: host
      name: name
    count: none
    evidence: "the host list is empty"

  - id: VMW-HOST-STANDALONE
    title: ESXi host is not in a cluster
    kind: misconfigured
    category: AVL
    severity: low
    entity: host
    why: A host outside every cluster gets no HA restart of its VMs when it fails and no DRS evacuation before patching, so its VMs depend on that one machine.
    fix: Move the host into a cluster, or record why it stands alone (witness, management or licensing host).
    refs: [NIST-800-53:CP-10]
    query:
      protocol: http
      path: /api/vcenter/host
      params: { standalone: "true" }
      paging: none
      key: host
      name: name
    each: any
    evidence: "{name}: not in a cluster, connection {connection_state}, power {power_state}"

  # ---- virtual machines ----------------------------------------------------------------------

  - id: VMW-VM-CONFIG-UNAVAILABLE
    title: VM whose configuration vCenter cannot read
    kind: broken
    category: AVL
    severity: medium
    entity: vm
    why: The VM list leaves CPU and memory unset when the VM configuration is unavailable - the usual sign of an orphaned or inaccessible VM. Such VMs cannot be backed up and distort capacity figures.
    fix: Find why the .vmx is unreadable (datastore lost, files moved); re-register the VM from its files or remove the stale inventory entry.
    query:
      protocol: http
      path: /api/vcenter/vm
      paging: none
      key: vm
      name: name
    each: { field: cpu_count, op: absent }
    evidence: "{name} ({vm}): no CPU/memory configuration returned, power state {power_state}"

  - id: VMW-VM-SUSPENDED
    title: VM is suspended
    kind: misconfigured
    category: HYG
    severity: low
    entity: vm
    why: A suspended VM is neither running nor cleanly off; its memory image sits on the datastore and backups capture a frozen state.
    fix: Resume or shut the VM down properly, or remove it if it is no longer needed.
    query:
      protocol: http
      path: /api/vcenter/vm
      paging: none
      key: vm
      name: name
    each: { field: power_state, op: eq, value: SUSPENDED }
    evidence: "{name}: suspended"

  # ---- per VM (for_each over the powered-on VMs) ---------------------------------------------
  # Tools: run_state NOT_RUNNING / RUNNING / EXECUTING_SCRIPTS; version_status NOT_INSTALLED, CURRENT,
  # UNMANAGED (guest-managed open-vm-tools), TOO_OLD_UNSUPPORTED, SUPPORTED_OLD, SUPPORTED_NEW, TOO_NEW,
  # BLACKLISTED. version_status can be missing when the Tools are too old to report it.

  - id: VMW-VM-TOOLS-NOT-RUNNING
    title: VMware Tools is installed but not running in a powered-on VM
    kind: broken
    category: AVL
    severity: medium
    entity: vm
    why: Without running Tools the guest cannot be quiesced, so image-level backups are only crash-consistent while the job still reports success; guest shutdown and heartbeat monitoring stop working too.
    fix: Start the Tools service in the guest (or reinstall it) and confirm the VM reports Tools running.
    refs: [NIST-800-53:CP-9]
    query:
      protocol: http
      path: /api/vcenter/vm/{vm}/tools
      for_each: { path: /api/vcenter/vm, params: { power_states: POWERED_ON }, paging: none, field: vm, max: 2000 }
      paging: none
      key: "{parent.vm}"
      name: parent.name
    each:
      all:
        - { field: run_state, op: eq, value: NOT_RUNNING }
        - any:
            - { field: version_status, op: absent }
            - { field: version_status, op: ne, value: NOT_INSTALLED }
    evidence: "{parent.name}: Tools {run_state}, version {version} ({version_status})"

  - id: VMW-VM-TOOLS-NOT-INSTALLED
    title: Powered-on VM has no VMware Tools
    kind: missing
    category: AVL
    severity: medium
    entity: vm
    why: A VM without Tools cannot be quiesced for backup, shut down cleanly by the host or watched by HA guest monitoring, and runs with the slower generic drivers.
    fix: Install VMware Tools, or the distribution's open-vm-tools package on Linux.
    refs: [NIST-800-53:CP-9]
    query:
      protocol: http
      path: /api/vcenter/vm/{vm}/tools
      for_each: { path: /api/vcenter/vm, params: { power_states: POWERED_ON }, paging: none, field: vm, max: 2000 }
      paging: none
      key: "{parent.vm}"
      name: parent.name
    each: { field: version_status, op: eq, value: NOT_INSTALLED }
    evidence: "{parent.name}: VMware Tools not installed"

  - id: VMW-VM-TOOLS-UNSUPPORTED
    title: VM runs a VMware Tools version that is unsupported or flagged as defective
    kind: broken
    lens: both
    category: LCM
    severity:
      field: version_status
      map: { BLACKLISTED: high, TOO_OLD_UNSUPPORTED: medium, TOO_NEW: medium }
      default: medium
    entity: vm
    refresh: 7d
    why: The vendor marks a Tools version as defective when it has a serious bug, and as too old or too new when it no longer works correctly with the host; drivers and quiescing in the guest depend on it.
    fix: Upgrade Tools to the version the host offers (or the current open-vm-tools package), in the VM's next maintenance window.
    refs: [NIST-800-53:SI-2]
    query:
      protocol: http
      path: /api/vcenter/vm/{vm}/tools
      for_each: { path: /api/vcenter/vm, params: { power_states: POWERED_ON }, paging: none, field: vm, max: 2000 }
      paging: none
      key: "{parent.vm}"
      name: parent.name
    each: { field: version_status, op: in, value: [BLACKLISTED, TOO_OLD_UNSUPPORTED, TOO_NEW] }
    evidence: "{parent.name}: Tools {version} is {version_status}"

  - id: VMW-VM-TOOLS-OUTDATED
    title: VM's VMware Tools has a newer version available
    kind: broken
    category: LCM
    severity: low
    entity: vm
    refresh: 7d
    why: Outdated Tools miss driver and security fixes; the gap grows with every host upgrade.
    fix: Upgrade Tools in a maintenance window, or set the upgrade policy to upgrade at power cycle.
    refs: [NIST-800-53:SI-2]
    query:
      protocol: http
      path: /api/vcenter/vm/{vm}/tools
      for_each: { path: /api/vcenter/vm, params: { power_states: POWERED_ON }, paging: none, field: vm, max: 2000 }
      paging: none
      key: "{parent.vm}"
      name: parent.name
    each: { field: version_status, op: eq, value: SUPPORTED_OLD }
    evidence: "{parent.name}: Tools {version} ({version_status}), upgrade policy {upgrade_policy}"

  - id: VMW-VM-ISO-CONNECTED
    title: Powered-on VM has an ISO image connected
    kind: misconfigured
    category: HYG
    severity: low
    entity: vm
    why: A connected ISO pins the VM - vMotion and DRS fail when the image sits on storage the target host cannot see, maintenance mode stalls on it, and installer media stays readable inside the guest.
    fix: Disconnect the CD-ROM (and clear "connect at power on") once the installation or update is done.
    refs: [NIST-800-53:CM-7]
    # /rest is used because /api answers the VM's devices as a map keyed by device id; /rest renders it
    # as [{key, value}]. Conditions over cdroms[] match any element: a VM with two CD-ROMs could pair one
    # device's backing with the other's state (rare; see the backlog's element-wise gap).
    query:
      protocol: http
      path: /rest/vcenter/vm/{vm}
      for_each: { path: /api/vcenter/vm, params: { power_states: POWERED_ON }, paging: none, field: vm, max: 2000 }
      paging: none
      items: value
      key: "{parent.vm}"
      name: parent.name
    each:
      all:
        - { field: "cdroms[].value.backing.type", op: eq, value: ISO_FILE }
        - { field: "cdroms[].value.state", op: eq, value: CONNECTED }
    evidence: "{parent.name}: CD-ROM connected to {cdroms[].value.backing.iso_file}"

  # ---- datastores ----------------------------------------------------------------------------

  - id: VMW-DATASTORE-FREE-SPACE
    title: Datastore is low on free space
    kind: broken
    category: HLT
    severity:
      field: free_space
      ranges: [ { max: 21474836480, value: critical }, { max: 53687091200, value: high } ]
      default: medium
    entity: datastore
    why: A full datastore pauses every thin-provisioned VM that tries to write and blocks snapshots, so backups fail at the same moment.
    fix: Remove orphaned snapshots and old files, move VMs to another datastore, or grow the volume. The threshold is in bytes because the engine cannot compute a percentage.
    refs: [NIST-800-53:SC-5]
    query:
      protocol: http
      path: /api/vcenter/datastore
      paging: none
      key: datastore
      name: name
    each: { field: free_space, op: lt, value: 107374182400, threshold: vmware.datastore-free-bytes-min }
    evidence: "{name} ({type}): {free_space} bytes free of {capacity}"

  - id: VMW-DATASTORE-CAPACITY-UNKNOWN
    title: Datastore reports no capacity
    kind: broken
    category: HLT
    severity: medium
    entity: datastore
    why: vCenter leaves capacity unset when it cannot read the datastore - usually an inaccessible or all-paths-down volume, which nothing else in the list reveals.
    fix: Check the storage paths and the datastore's accessibility on each host; rescan storage.
    query:
      protocol: http
      path: /api/vcenter/datastore
      paging: none
      key: datastore
      name: name
    each: { field: capacity, op: absent }
    evidence: "{name} ({type}): capacity unknown"

  # ---- clusters ------------------------------------------------------------------------------

  - id: VMW-CLUSTER-HA-OFF
    title: Cluster has vSphere HA turned off
    kind: misconfigured
    category: AVL
    severity: medium
    entity: cluster
    why: Without HA a host failure leaves its VMs down until someone restarts them by hand, and nothing warns that failover is off.
    fix: Enable vSphere HA with admission control, or record why the cluster runs without it.
    refs: [NIST-800-53:CP-10]
    query:
      protocol: http
      path: /api/vcenter/cluster
      paging: none
      key: cluster
      name: name
    each: { field: ha_enabled, op: eq, value: false }
    evidence: "{name}: HA disabled"

  - id: VMW-CLUSTER-DRS-OFF
    title: Cluster has DRS turned off
    kind: misconfigured
    category: AVL
    severity: low
    entity: cluster
    why: Without DRS load is never rebalanced and maintenance mode cannot evacuate hosts automatically, so patching slips.
    fix: Enable DRS (at least partially automated), or record why the cluster runs without it.
    query:
      protocol: http
      path: /api/vcenter/cluster
      paging: none
      key: cluster
      name: name
    each: { field: drs_enabled, op: eq, value: false }
    evidence: "{name}: DRS disabled"

  # ---- vCenter Server Appliance health -------------------------------------------------------

  - id: VMW-VCSA-HEALTH-SYSTEM
    title: Appliance overall health is not green
    kind: broken
    category: HLT
    severity:
      field: value
      map: { red: critical, orange: high, yellow: medium, gray: medium }
      default: medium
    entity: appliance
    refresh: 6h
    why: The overall colour rolls up every appliance subsystem. Gray means the appliance could not tell - no data, not health.
    fix: Open the appliance management interface (port 5480) and fix the subsystem that is not green.
    query:
      protocol: http
      path: /rest/appliance/health/system
      paging: none
      key: "-"
    each: { field: value, op: ne, value: green }
    evidence: "appliance overall health: {value}"

  - id: VMW-VCSA-HEALTH-STORAGE
    title: Appliance storage health is not green
    kind: broken
    category: HLT
    severity:
      field: value
      map: { red: critical, orange: high, yellow: medium, gray: medium }
      default: medium
    entity: appliance
    refresh: 6h
    why: A full appliance partition (logs, database, core dumps) stops vCenter services, and every backup that goes through vCenter stops with it.
    fix: Find the full partition in the appliance shell or management interface, clear it or grow the disk.
    refs: [NIST-800-53:SC-5]
    query:
      protocol: http
      path: /rest/appliance/health/storage
      paging: none
      key: "-"
    each: { field: value, op: ne, value: green }
    evidence: "appliance storage health: {value}"

  - id: VMW-VCSA-HEALTH-DATABASE-STORAGE
    title: Appliance database storage health is not green
    kind: broken
    category: HLT
    severity:
      field: value
      map: { red: critical, orange: high, yellow: medium, gray: medium }
      default: medium
    entity: appliance
    refresh: 6h
    why: When the vCenter database volume fills, vpxd stops and vCenter goes down.
    fix: Purge old events and tasks per the vendor guidance or grow the database disk.
    query:
      protocol: http
      path: /rest/appliance/health/database-storage
      paging: none
      key: "-"
    each: { field: value, op: ne, value: green }
    evidence: "appliance database storage health: {value}"

  - id: VMW-VCSA-HEALTH-MEMORY
    title: Appliance memory health is not green
    kind: broken
    category: HLT
    severity:
      field: value
      map: { red: critical, orange: high, yellow: medium, gray: medium }
      default: medium
    entity: appliance
    refresh: 6h
    why: Memory pressure makes vCenter services slow or crash; it usually means the inventory outgrew the deployment size.
    fix: Check which service grows; resize the appliance to the next deployment size if the inventory has grown.
    query:
      protocol: http
      path: /rest/appliance/health/mem
      paging: none
      key: "-"
    each: { field: value, op: ne, value: green }
    evidence: "appliance memory health: {value}"

  - id: VMW-VCSA-HEALTH-LOAD
    title: Appliance CPU load health is not green
    kind: broken
    category: HLT
    severity:
      field: value
      map: { red: critical, orange: high, yellow: medium, gray: medium }
      default: medium
    entity: appliance
    refresh: 6h
    why: Sustained CPU load delays tasks, DRS and API calls, including the ones backup products make.
    fix: Find the busy service; add vCPUs or resize the appliance.
    query:
      protocol: http
      path: /rest/appliance/health/load
      paging: none
      key: "-"
    each: { field: value, op: ne, value: green }
    evidence: "appliance load health: {value}"

  - id: VMW-VCSA-HEALTH-SWAP
    title: Appliance swap health is not green
    kind: broken
    category: HLT
    severity:
      field: value
      map: { red: critical, orange: high, yellow: medium, gray: medium }
      default: medium
    entity: appliance
    refresh: 6h
    why: A swapping appliance is short of memory; services slow down long before they fail.
    fix: Add memory or resize the appliance; check for a leaking service.
    query:
      protocol: http
      path: /rest/appliance/health/swap
      paging: none
      key: "-"
    each: { field: value, op: ne, value: green }
    evidence: "appliance swap health: {value}"

  - id: VMW-VCSA-HEALTH-APPLMGMT
    title: Appliance management service health is not green
    kind: broken
    category: HLT
    severity:
      field: value
      map: { red: critical, orange: high, yellow: medium, gray: medium }
      default: medium
    entity: appliance
    refresh: 6h
    why: The appliance management service runs backups, patching and the health checks themselves; when it is unhealthy those stop quietly.
    fix: Restart the applmgmt service and check its log.
    query:
      protocol: http
      path: /rest/appliance/health/applmgmt
      paging: none
      key: "-"
    each: { field: value, op: ne, value: green }
    evidence: "appliance management service health: {value}"

  - id: VMW-VCSA-HEALTH-PACKAGES
    title: Appliance has pending software updates
    kind: broken
    lens: both
    category: LCM
    severity:
      field: value
      map: { red: high, orange: medium, yellow: low, gray: medium }
      default: medium
    entity: appliance
    refresh: 7d
    why: The software-packages colour turns red when security updates are available and orange for other updates; an unpatched vCenter is a prime target because it controls every VM.
    fix: Stage and install the latest appliance patch in a change window, after a file-based backup.
    refs: [NIST-800-53:SI-2]
    query:
      protocol: http
      path: /rest/appliance/health/software-packages
      paging: none
      key: "-"
    each: { field: value, op: ne, value: green }
    evidence: "appliance software-packages health: {value}"

  - id: VMW-VCSA-DATABASE
    title: vCenter database reports degraded or unhealthy
    kind: broken
    category: HLT
    severity:
      field: status
      map: { UNHEALTHY: critical, DEGRADED: medium }
      default: medium
    entity: appliance
    refresh: 6h
    why: An unhealthy database means corruption that will impact vCenter; degraded means issues with low impact today.
    fix: Read the messages returned with the status, take a file-based backup, and open a vendor case for an unhealthy database.
    query:
      protocol: http
      path: /api/appliance/health/database
      paging: none
      key: "-"
    each: { field: status, op: ne, value: HEALTHY }
    evidence: "database status {status}: {messages[].message.default_message}"

  - id: VMW-VCSA-HEALTH-CHECK-STALE
    title: Appliance health check has not run recently
    kind: broken
    category: MON
    severity: low
    entity: appliance
    why: Every appliance health colour comes from the last health check; when the check stops running the colours stay green while nothing is being measured.
    fix: Check the appliance management service (applmgmt) and restart it; the timestamp should move within minutes.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /rest/appliance/health/system/lastcheck
      paging: none
      key: "-"
    each: { field: value, op: age-gt, value: 1, threshold: vmware.health-check-max-age-days }
    evidence: "last appliance health check {value}"

  # ---- vCenter services (vcenter.services; /rest renders the map as [{key, value}]) --------------
  # startup_type MANUAL / AUTOMATIC / DISABLED; state STARTING / STOPPING / STARTED / STOPPED;
  # health DEGRADED / HEALTHY / HEALTHY_WITH_WARNINGS.

  - id: VMW-VC-SERVICE-AUTO-STOPPED
    title: vCenter service set to start automatically is not running
    kind: broken
    category: AVL
    severity: high
    entity: service
    refresh: 6h
    why: The API still answers while a stopped service quietly takes its feature with it - content library, lifecycle manager, the token service or the performance charts.
    fix: Start the service from the appliance management interface and read its log for why it stopped.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /rest/vcenter/services
      paging: none
      key: key
      name: value.name_key
    each:
      all:
        - { field: value.startup_type, op: eq, value: AUTOMATIC }
        - { field: value.state, op: ne, value: STARTED }
    evidence: "{key}: startup {value.startup_type}, state {value.state}"

  - id: VMW-VC-SERVICE-UNHEALTHY
    title: Running vCenter service reports degraded health or warnings
    kind: broken
    category: HLT
    severity:
      field: value.health
      map: { DEGRADED: high, HEALTHY_WITH_WARNINGS: medium }
      default: medium
    entity: service
    refresh: 6h
    why: A degraded service is running but not functional; warnings usually precede it.
    fix: Act on the service's health messages; restart it if the messages say so.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /rest/vcenter/services
      paging: none
      key: key
      name: value.name_key
    each:
      all:
        - { field: value.state, op: eq, value: STARTED }
        - { field: value.health, op: ne, value: HEALTHY }
    evidence: "{key}: {value.health} - {value.health_messages[].default_message}"

  # ---- Enhanced Linked Mode replication (an empty list on a single vCenter) ------------------

  - id: VMW-VC-ELM-REPLICATION-BROKEN
    title: Linked Mode replication with a partner vCenter is not working
    kind: broken
    category: AVL
    severity: high
    entity: replication-partner
    refresh: 6h
    why: When directory replication between linked vCenters stops, sign-on, roles, permissions and tags drift apart, and the longer it lasts the harder the repair.
    fix: Check the partner's directory service and the network path between the appliances; re-establish the replication agreement if needed.
    refs: [NIST-800-53:CP-10, NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/vcenter/topology/replication-status
      paging: none
      key: "{node}|{replication_partner}"
      name: node
    each:
      any:
        - { field: replicating, op: eq, value: false }
        - { field: partner_available, op: eq, value: false }
        - { field: status_available, op: eq, value: false }
    evidence: "{node} -> {replication_partner}: replicating {replicating}, partner available {partner_available}, status available {status_available}"

  - id: VMW-VC-ELM-REPLICATION-LAG
    title: Linked Mode replication is falling behind
    kind: broken
    category: HLT
    severity: medium
    entity: replication-partner
    refresh: 6h
    why: A replication backlog that does not drain means changes made on one vCenter are not yet on the other - usually a saturated link or a struggling partner.
    fix: Check the link and the partner's load; a lag that keeps growing needs the same repair as broken replication.
    refs: [NIST-800-53:SI-4]
    query:
      protocol: http
      path: /api/vcenter/topology/replication-status
      paging: none
      key: "{node}|{replication_partner}"
      name: node
    each:
      all:
        - { field: replicating, op: eq, value: true }
        - { field: change_lag, op: gt, value: 100, threshold: vmware.replication-max-lag }
    evidence: "{node} -> {replication_partner}: {change_lag} changes behind"

  # ---- appliance networking and logging ------------------------------------------------------

  - id: VMW-VCSA-DNS-SINGLE-SERVER
    title: Appliance has fewer than two static DNS servers
    kind: misconfigured
    category: AVL
    severity: medium
    entity: appliance
    why: vCenter resolves its own name, its hosts and the identity source through DNS; with one resolver, one outage breaks sign-on, host connections and backups at once.
    fix: Add a second DNS server on a different host or site.
    refs: [NIST-800-53:CP-10, NIST-800-53:SC-5]
    query:
      protocol: http
      path: /api/appliance/networking/dns/servers
      paging: none
      key: "-"
    each:
      all:
        - { field: mode, op: eq, value: is_static }
        - { field: servers, op: size-lt, value: 2 }
    evidence: "DNS mode {mode}, servers {servers}"

  - id: VMW-VCSA-SYSLOG-FORWARDING-MISSING
    title: Appliance forwards its logs to no syslog server
    kind: missing
    lens: security
    category: LOG
    severity: medium
    entity: appliance
    why: Without forwarding, the only copy of vCenter's logs and audit trail is on the appliance itself - lost when its disk fills, and editable by whoever compromises it.
    fix: Add the organisation's log collector as a forwarding target (TLS) and confirm the collector receives events.
    refs: [NIST-800-53:AU-4, NIST-800-53:AU-9, CIS-Controls-v8:8.2, CIS-Controls-v8:8.9]
    query:
      protocol: http
      path: /api/appliance/logging/forwarding
      paging: none
      key: "{hostname}:{port}"
      name: hostname
    count: none
    evidence: "no syslog forwarding target is configured"

  - id: VMW-VCSA-SYSLOG-UNENCRYPTED
    title: Appliance syslog forwarding is not encrypted
    kind: misconfigured
    lens: security
    category: LOG
    severity: low
    entity: syslog-target
    why: Over UDP or plain TCP the log stream - user names, host names, commands - crosses the network readable, and UDP drops messages without anyone knowing.
    fix: Switch the target to TLS (port 6514 by convention) once the collector accepts it.
    refs: [NIST-800-53:AU-9, NIST-800-53:SC-8, CIS-Controls-v8:3.10]
    query:
      protocol: http
      path: /api/appliance/logging/forwarding
      paging: none
      key: "{hostname}:{port}"
      name: hostname
    each: { field: protocol, op: ne, value: TLS }
    evidence: "{hostname}:{port} over {protocol}"

  # ---- lifecycle -----------------------------------------------------------------------------

  - id: VMW-VCSA-VERSION-UNSUPPORTED
    title: vCenter runs a major version past end of general support
    kind: broken
    lens: both
    category: LCM
    severity: high
    entity: appliance
    refresh: 7d
    why: Past end of general support a vCenter gets no security patches, and it holds administrative control over every host and VM.
    fix: Plan the upgrade to a supported major version. Widen the pattern when the next major version leaves support.
    refs: [NIST-800-53:SA-22, NIST-800-53:SI-2]
    query:
      protocol: http
      path: /api/appliance/system/version
      paging: none
      key: "-"
    each: { field: version, op: match, value: '^(5|6|7)\.', threshold: vmware.unsupported-version-pattern }
    evidence: "{product} {version} build {build}"

  - id: VMW-VCSA-VERSION-SUPPORT-ENDING
    title: vCenter runs a major version whose general support ends within the planning horizon
    kind: broken
    lens: both
    category: LCM
    severity: low
    entity: appliance
    refresh: 7d
    why: The vendor's lifecycle notice (KB 456708) ends general support for vCenter Server 8 on 2027-10-11; a major upgrade needs hardware compatibility checks, licensing and months of lead time. Raise the severity as the date nears - the engine cannot attach a fixed deadline yet.
    fix: Plan the upgrade to the next major version now, starting with the host hardware compatibility check. Move the pattern on when the next major version enters its last year.
    refs: [NIST-800-53:SA-22, NIST-800-53:SI-2]
    query:
      protocol: http
      path: /api/appliance/system/version
      paging: none
      key: "-"
    each: { field: version, op: match, value: '^8\.', threshold: vmware.support-ending-version-pattern }
    evidence: "{product} {version} build {build}"

  - id: VMW-VCSA-UPDATE-FAILED
    title: Appliance update failed or is rolling back
    kind: broken
    category: LCM
    severity: high
    entity: appliance
    refresh: 6h
    why: A failed update leaves the appliance between versions; the vendor state says it cannot recover by itself.
    fix: Read the update task error, restore from the pre-update backup or snapshot if services are down, and retry the update.
    query:
      protocol: http
      path: /api/appliance/update
      paging: none
      key: "-"
    each: { field: state, op: in, value: [INSTALL_FAILED, ROLLBACK_IN_PROGRESS] }
    evidence: "update state {state} for version {version}"

  - id: VMW-VCSA-UPDATE-CHECK-STALE
    title: Appliance has not checked for updates recently
    kind: missing
    category: LCM
    severity: low
    entity: appliance
    refresh: 7d
    why: If the appliance never queries its update repository, the software-packages health stays green while patches pile up.
    fix: Check the update policy and repository URL (or proxy) and run a check for updates.
    query:
      protocol: http
      path: /api/appliance/update
      paging: none
      key: "-"
    each:
      any:
        - { field: latest_query_time, op: absent }
        - { field: latest_query_time, op: age-gt, value: 30, threshold: vmware.update-check-max-age-days }
    evidence: "last update check {latest_query_time}"

  # ---- certificates and accounts -------------------------------------------------------------

  - id: VMW-VC-TLS-CERT-EXPIRY
    title: vCenter machine TLS certificate expires soon
    kind: broken
    lens: both
    category: PKI
    severity:
      daysLeft: valid_to
      ranges: [ { max: 0, value: critical }, { max: 14, value: high }, { max: 30, value: medium } ]
      default: low
    entity: certificate
    refresh: 1d
    why: When the machine SSL certificate expires, clients, backup products and linked services refuse to connect to vCenter.
    fix: Renew the certificate through Certificate Management (VMCA or a CA-signed replacement) in a change window.
    refs: [NIST-800-53:SC-17]
    deadline: valid_to
    query:
      protocol: http
      path: /api/vcenter/certificate-management/vcenter/tls
      paging: none
      key: serial_number
      name: subject_dn
    each: { field: valid_to, op: until-lt, value: 60, threshold: vmware.cert-notice-days }
    evidence: "{subject_dn} issued by {issuer_dn} expires {valid_to}"

  - id: VMW-VC-TLS-CERT-WEAK-SIGNATURE
    title: vCenter machine TLS certificate uses a weak signature algorithm
    kind: misconfigured
    lens: security
    category: PKI
    severity: medium
    entity: certificate
    why: SHA-1 and MD5 signatures can be forged; current clients reject them, and a forged certificate lets an attacker impersonate the system that controls every VM.
    fix: Replace the machine certificate with one signed with SHA-256 or stronger (VMCA or the enterprise CA).
    refs: [NIST-800-53:SC-13, NIST-800-53:SC-17, CIS-Controls-v8:3.10]
    query:
      protocol: http
      path: /api/vcenter/certificate-management/vcenter/tls
      paging: none
      key: serial_number
      name: subject_dn
    each: { field: signature_algorithm, op: match, value: 'sha-?1(?![0-9])|md[25]' }
    evidence: "{subject_dn}: signed with {signature_algorithm}"

  - id: VMW-VCSA-ROOT-PASSWORD-EXPIRY
    title: Appliance root password expires soon
    kind: broken
    lens: both
    category: IAM
    severity:
      daysLeft: password_expires_at
      ranges: [ { max: 0, value: critical }, { max: 7, value: high }, { max: 14, value: medium } ]
      default: low
    entity: account
    why: An expired root password locks administrators out of the appliance shell and management interface, which turns a routine fix into a recovery procedure.
    fix: Change the root password before it expires and store it in the privileged-access vault; align the expiry policy with the vault's rotation.
    refs: [NIST-800-53:IA-5]
    deadline: password_expires_at
    query:
      protocol: http
      path: /api/appliance/local-accounts/root
      paging: none
      key: "-"
    each:
      all:
        - { field: password_expires_at, op: exists }
        - { field: password_expires_at, op: until-lt, value: 30, threshold: vmware.root-password-notice-days }
    evidence: "root password expires {password_expires_at} (last changed {last_password_change})"

  - id: VMW-VCSA-ROOT-PASSWORD-NEVER-EXPIRES
    title: Appliance root password never expires
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: account
    why: The API leaves the expiry unset when the root password never expires; a root password that is never rotated stays valid for anyone who ever learned it.
    fix: Set a root password expiry (90 days or the vault's rotation period) and put the rotation in the vault's calendar.
    refs: [NIST-800-53:IA-5, CIS-Controls-v8:5.2]
    query:
      protocol: http
      path: /api/appliance/local-accounts/root
      paging: none
      key: "-"
    each:
      all:
        - { field: enabled, op: eq, value: true }
        - { field: password_expires_at, op: absent }
    evidence: "root password has no expiry (last changed {last_password_change})"

  - id: VMW-VCSA-PASSWORD-POLICY-MAX-DAYS
    title: Appliance local-account password policy allows old or never-expiring passwords
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: appliance
    why: The global policy sets the maximum password age for every local appliance account; the API leaves max_days unset when the limit is switched off.
    fix: Set the maximum password age to 90 days or less, with a warning a week before expiry.
    refs: [NIST-800-53:IA-5, CIS-Controls-v8:5.2]
    query:
      protocol: http
      path: /api/appliance/local-accounts/global-policy
      paging: none
      key: "-"
    each:
      any:
        - { field: max_days, op: absent }
        - { field: max_days, op: gt, value: 90, threshold: vmware.local-password-max-days }
    evidence: "local-account policy: max {max_days} days, min {min_days}, warn {warn_days}"

  - id: VMW-VCSA-SSH-ENABLED
    title: SSH is enabled on the appliance
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: appliance
    why: An always-on root shell over SSH widens the attack surface of the system that controls every VM; hardening guidance keeps it off except during maintenance.
    fix: Disable SSH in the appliance management interface and enable it only for the duration of a support task.
    refs: [NIST-800-53:CM-7]
    query:
      protocol: http
      path: /rest/appliance/access/ssh
      paging: none
      key: "-"
    each: { field: value, op: eq, value: true }
    evidence: "SSH access enabled"

  - id: VMW-VCSA-SHELL-ENABLED
    title: The appliance Bash shell is enabled
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: appliance
    why: The Bash shell gives unrestricted root access on the appliance; it should only be switched on, with a timeout, for a support task.
    fix: Disable the shell, or set a short timeout when it is needed.
    refs: [NIST-800-53:CM-7]
    query:
      protocol: http
      path: /api/appliance/access/shell
      paging: none
      key: "-"
    each: { field: enabled, op: eq, value: true }
    evidence: "shell enabled, timeout {timeout} s"

  - id: VMW-VCSA-TIMESYNC-DISABLED
    title: Appliance time synchronisation is off
    kind: misconfigured
    lens: both
    category: CFG
    severity: medium
    entity: appliance
    why: Clock drift on vCenter breaks single sign-on token validation and makes log times useless for investigations.
    fix: Configure NTP (or host time sync) on the appliance and point it at the same sources the directory uses.
    refs: [NIST-800-53:AU-8]
    query:
      protocol: http
      path: /rest/appliance/timesync
      paging: none
      key: "-"
    each: { field: value, op: eq, value: DISABLED }
    evidence: "time synchronisation mode {value}"

  # ---- appliance file-based backup -----------------------------------------------------------

  - id: VMW-VCSA-BACKUP-SCHEDULE-MISSING
    title: No file-based backup schedule on the appliance
    kind: missing
    category: BCK
    severity: high
    entity: appliance
    why: Image-level VM backups of vCenter are not a supported restore path for its database; the file-based backup is the one the vendor restore procedure uses.
    fix: Create a daily file-based backup schedule to a location outside the appliance, with retention and an encryption password.
    refs: [NIST-800-53:CP-9]
    query:
      protocol: http
      path: /rest/appliance/recovery/backup/schedules
      paging: none
      key: key
    count: none
    evidence: "no backup schedule is defined"

  - id: VMW-VCSA-BACKUP-SCHEDULE-DISABLED
    title: Appliance backup schedule is disabled
    kind: misconfigured
    category: BCK
    severity: high
    entity: backup-schedule
    why: A disabled schedule produces no backups and no failures - the appliance looks protected while it is not.
    fix: Re-enable the schedule, or replace it with a working one.
    refs: [NIST-800-53:CP-9]
    query:
      protocol: http
      path: /rest/appliance/recovery/backup/schedules
      paging: none
      key: key
    each: { field: value.enable, op: eq, value: false }
    evidence: "schedule {key} to {value.location} is disabled"

  - id: VMW-VCSA-BACKUP-PLAINTEXT-PROTOCOL
    title: Appliance backup goes to a plain FTP or HTTP location
    kind: misconfigured
    lens: security
    category: BCK
    severity: medium
    entity: backup-schedule
    why: The file-based backup holds the vCenter database and its stored credentials; over FTP or HTTP both the backup and the location's login cross the network readable.
    fix: Move the schedule to FTPS, HTTPS or SFTP (or SMB/NFS on a trusted segment) and set a backup encryption password.
    refs: [NIST-800-53:SC-8, NIST-800-53:CP-9, CIS-Controls-v8:3.10, CIS-Controls-v8:11.3]
    query:
      protocol: http
      path: /rest/appliance/recovery/backup/schedules
      paging: none
      key: key
    each: { field: value.location, op: match, value: '^(ftp|http)://' }
    evidence: "schedule {key} writes to {value.location}"

  - id: VMW-VCSA-BACKUP-FAILED
    title: Appliance file-based backup failed recently
    kind: broken
    category: BCK
    severity: high
    entity: backup-job
    refresh: 6h
    why: A failed vCenter backup means the next restore would start from an older configuration - or from nothing.
    fix: Read the job's error messages (location credentials, free space, network) and run a manual backup once fixed.
    refs: [NIST-800-53:CP-9]
    query:
      protocol: http
      path: /rest/appliance/recovery/backup/job/details
      paging: none
      key: key
    each:
      all:
        - { field: value.status, op: eq, value: FAILED }
        - { field: value.end_time, op: age-lt, value: 7, threshold: vmware.backup-failure-window-days }
    evidence: "{value.type} backup {key} to {value.location} failed at {value.end_time}"

  - id: VMW-VCSA-BACKUP-STUCK
    title: Appliance backup job has been running for too long
    kind: broken
    category: BCK
    severity: medium
    entity: backup-job
    refresh: 6h
    why: A backup job that never finishes blocks the next scheduled run, so the appliance silently stops getting backups.
    fix: Check the job progress and the target location; cancel and rerun the job if it is hung.
    refs: [NIST-800-53:CP-9]
    query:
      protocol: http
      path: /rest/appliance/recovery/backup/job/details
      paging: none
      key: key
    each:
      all:
        - { field: value.status, op: in, value: [RUNNING, BLOCKED, PENDING] }
        - { field: value.start_time, op: age-gt, value: 0.5, threshold: vmware.backup-max-run-days }
    evidence: "backup {key} {value.status} since {value.start_time}"
