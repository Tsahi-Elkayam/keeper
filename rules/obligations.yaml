               CASE WHEN s.target = '-' THEN 'sec.awareness-training' ELSE 'sec.awareness-training@' || s.target END AS item,
               s.last_done,
               COALESCE(s.latest_state, 'none') AS latest_state,
               CASE WHEN s.last_done IS NULL THEN 'never attested as done'
                    ELSE 'last done ' || s.last_done || ', ' || CAST(julianday(:today) - julianday(s.last_done) AS INTEGER) || ' days ago' END AS status_text,
               CASE WHEN s.last_done IS NULL THEN :today
                    ELSE date(s.last_done, '+' || COALESCE((SELECT st.value FROM setting st WHERE st.key = 'threshold.obligations.sec.awareness-training.interval-days'), '365') || ' days') END AS due_on
