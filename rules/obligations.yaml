  - id: OBL-APP-SOD-REVIEW
    title: Segregation of duties not reviewed within the interval
    kind: missing
    lens: security
    category: IAM
    severity: high
    entity: obligation
    why: >-
      In a system that moves money or changes pay, one person who can both enter and approve - or
      change a payee's bank details without a second check - can commit fraud the system will
      record as normal work. Small teams lose this separation quietly when people cover for each
      other, and administrators of the platform often can edit business data too.
    fix: >-
