  - id: OBL-BACKUP-OFFLINE-COPY-VERIFIED
    title: Offline or immutable backup copy not verified within the interval
    kind: missing
    lens: both
    category: BCK
    severity: high
    entity: obligation
    why: >-
      Ransomware deletes or encrypts the backups it can reach before it encrypts anything else. A job
      that succeeds to storage the attacker can reach is not a backup; only an offline or immutable
      copy, checked to be current, survives that.
    fix: >-
      Check the immutability lock or the offline media rotation, the age of the newest offline copy,
      and that the credentials able to delete it are not the ones the backup server uses, then
      attest obligation backup.offline-copy-verified with the backup system as target.
