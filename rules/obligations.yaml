  - id: OBL-APP-BACKUP-VERIFIED
    title: Application-level copy not verified within the interval
    kind: missing
    lens: both
    category: BCK
    severity: high
    entity: obligation
    why: >-
      Image backups of a host and the vendor's own backups do not cover what a rebuild needs: the
      data of a SaaS service, a database bundled with the product, its keys and keystores, the
      licence file, project sources. When the product or its vendor is gone, only a copy kept
      outside the host, in a format readable without the product, brings the data back. A restore
      test proves a copy works; this proves a recent one exists at all.
    fix: >-
      Schedule the application's export (database dump, configuration, keys, licence, SaaS export)
      to storage outside the host, newer than the last change, with any passphrase escrowed in the
      vault. Then attest obligation app.backup-verified with the system as target and the copy's
      location and date as evidence.
