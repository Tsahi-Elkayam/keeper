  # ----------------------------------------------- certificate authorities (target = the CA)
  - id: OBL-PKI-CA-KEY-BACKUP
    title: Certificate authority backup not verified within the interval
    kind: missing
    lens: both
    category: PKI
    severity: high
    entity: obligation
    why: >-
      Without a usable backup of the CA's private key, database and configuration, losing the CA
      host means no certificate it issued can be renewed or revoked: every sign-in, VPN and server
      certificate that depends on it has to be replaced at once.
    fix: >-
      Back up the CA (private key, database, configuration) to offline storage with the key's
      password in the privileged vault, check that the backup is readable, then attest obligation
      pki.ca-key-backup with the CA as target.
    refs: [NIST-800-53:CP-9, NIST-800-53:SC-12(1), NIST-800-53:SC-17, ISO-27001:A.8.13]
