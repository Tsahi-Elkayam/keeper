  - id: OBL-APP-SSO-ENFORCED
    title: Application sign-in through the identity provider not confirmed within the interval
    kind: missing
    lens: security
    category: AUT
    severity: high
    entity: obligation
    why: >-
      Offboarding, MFA and conditional access reach an application only when people sign in to it
      through the identity provider. A local or vendor-side password outlives every leaver process
      and every MFA rollout. The directory side of single sign-on is scanned; whether the
      application still accepts local passwords, and from whom, is visible only in the application.
    fix: >-
      Turn on the federation the product supports (SAML, OIDC or integrated Windows authentication)
      with MFA at the identity provider; where it cannot federate, enforce the product's own MFA and
      lockout. Keep local accounts only for documented emergency and integration use, and make sure
      no self-service page signs people in by a public identifier alone. Attest obligation
      app.sso-enforced with the system as target and the remaining local accounts as evidence.
