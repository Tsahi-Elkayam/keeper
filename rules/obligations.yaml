  - id: OBL-PRIVACY-DATABASE-RECORD
    title: Personal-data record of a system not reviewed within the interval
    kind: missing
    lens: security
    category: HYG
    severity: high
    entity: obligation
    why: >-
      Whether a system may hold personal data, for what purpose, for how long and who may see it is
      answered by documents, not settings - and those documents expire when the law, the purpose or
      the system changes. Special categories (biometrics, health records, minors, footage and call
      recordings) need the data-protection officer's explicit approval, and a retention period that
      nothing enforces means data is kept for ever.
    fix: >-
      With the data-protection officer, prepare or refresh the system's record: definitions
      document and security level, purpose, retention per data type with its legal basis and the
      last disposal run, the access model, and the approval of any special category or notice to
      data subjects. Align the product's retention settings with it, then attest obligation
      privacy.database-record with the system as target.
