  # One-off, not recurring: a decommission done is done, so a 'yes' never expires here (the template's
  # interval would reopen every retired system each quarter). Targets are the systems attested for it
  # plus every system the register marks inactive; there is no '-' row, because nothing retired means
  # nothing to do. The interval (default 90 days) is how long a decommission may stay open: the
  # deadline counts from the first attestation for the target, or from the last save of the inactive
  # system row (which stands in for the day it was retired).
  - id: OBL-SYS-DECOMMISSION
    title: Retired system has an open decommission
    kind: missing
    lens: both
    category: HYG
    severity: medium
    entity: obligation
    why: >-
      Decommissions stall at "switched off": the disk with the database, the DNS name and firewall
      rules, the service and API accounts, the vendor's copy of the data, the backup and monitoring
      jobs and the contract all outlive the service, and each is a cost or a way in that nobody
      watches any more.
    fix: >-
      Work through the decommission checklist: data exported or disposed of with a record,
      application accounts and API keys revoked, directory and service accounts disabled, DNS names
      and firewall rules removed, monitoring and backup jobs deleted, licences and contracts ended,
      disks wiped, documentation closed. Attest obligation sys.decommission with the system as
      target - 'no' with the open items while it runs, 'yes' only when the last item is closed - and
      mark the system inactive so the licence and contract rules catch what still costs money.
    refs: [NIST-800-53:CM-8, NIST-800-53:MP-6, NIST-800-53:SA-9, CIS-Controls-v8:1.1, ISO-27001:A.8.10, ISO-27001:A.5.20]
    refresh: 1d
    query:
      protocol: store
      key: item
      name: title
      text: |
        WITH t AS (
          SELECT DISTINCT a.target FROM attestation a WHERE a.obligation = 'sys.decommission'
          UNION
          SELECT sy.system_id FROM system sy
           WHERE sy.active = 0 AND sy.system_id NOT IN ('KEEPER', 'ORG', 'UNMAPPED')
        ),
        s AS (
          SELECT t.target,
                 (SELECT MAX(a.done_on) FROM attestation a
                   WHERE a.obligation = 'sys.decommission' AND a.target = t.target AND a.state = 'yes'
                     AND NULLIF(TRIM(a.done_on), '') IS NOT NULL) AS last_done,
                 (SELECT la.state FROM latest_attestation la
                   WHERE la.obligation = 'sys.decommission' AND la.target = t.target) AS latest_state,
                 (SELECT substr(MIN(a.recorded_at), 1, 10) FROM attestation a
                   WHERE a.obligation = 'sys.decommission' AND a.target = t.target) AS first_recorded,
                 (SELECT substr(sy.updated_at, 1, 10) FROM system sy
                   WHERE sy.system_id = t.target AND sy.active = 0) AS inactive_since
          FROM t
        )
        SELECT 'sys.decommission' AS obligation,
               'Decommission of a retired system closed' AS title,
               s.target,
               'sys.decommission@' || s.target AS item,
               s.last_done,
               COALESCE(s.latest_state, 'none') AS latest_state,
               COALESCE(s.first_recorded, s.inactive_since, :today) AS open_since,
               CASE WHEN s.last_done IS NOT NULL THEN 'closed on ' || s.last_done
                    ELSE 'open since ' || COALESCE(s.first_recorded, s.inactive_since, :today) || ', never attested as closed' END AS status_text,
               date(COALESCE(s.first_recorded, s.inactive_since, :today),
                    '+' || COALESCE((SELECT st.value FROM setting st WHERE st.key = 'threshold.obligations.sys.decommission.interval-days'), '90') || ' days') AS due_on
        FROM s
    each:
      all:
        - { field: latest_state, op: ne, value: na }
        - { field: last_done, op: absent }
    deadline: due_on
    evidence: "{title} ({item}): {status_text}; due {due_on}. Latest attestation: {latest_state}"

  # ----------------------------------------------- every attestation, any obligation
  - id: OBL-ATTESTATION-EXPIRED
    title: Attestation has expired
    kind: missing
    lens: both
    category: HYG
    severity:
      field: obligation
      map:
        ad.krbtgt-rotation: high
        ad.system-state-backup: high
        ad.forest-recovery-test: high
        backup.restore-test: high
        dr.drill: high
        change.code-review: high
        ir.exercise: high
        vuln.scan-external: high
        backup.offline-copy-verified: high
        iam.break-glass-test: high
        pki.ca-key-backup: high
        pki.template-review: high
        app.backup-verified: high
        app.sso-enforced: high
        app.audit-trail: high
        app.interface-inventory: high
        app.sod-review: high
        sys.hardening-review: high
        sys.network-exposure-review: high
        privacy.database-record: high
        tel.emergency-call-test: critical
        iam.stale-account-cleanup: low
        licence.review: low
        sec.awareness-training: low
        gov.policy-review: low
      default: medium
    entity: attestation
    why: >-
      Whoever attested this said how long it holds. Past that date it proves nothing - a 'na' may
      no longer be true and a 'yes' may describe a system that has since changed.
    fix: Do the obligation again (or re-confirm that it does not apply) and record a new attestation.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each: { field: expires_on, op: until-lt, value: 0 }
    deadline: expires_on
    evidence: "{item}: attested {state} by {actor} on {recorded_at}, expired {expires_on}"

  - id: OBL-ATTESTATION-EXPIRING
    title: Attestation expires soon
    kind: missing
    lens: both
    category: HYG
    severity:
      daysLeft: expires_on
      ranges:
        - { max: 7, value: high }
        - { max: 14, value: medium }
      default: low
    entity: attestation
    why: >-
      An attestation that lapses turns a proven obligation into an open finding. Planning the
      repeat (a drill, a restore test, a review) takes longer than the last few days.
    fix: Schedule the obligation now so a new attestation is recorded before this one expires.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each:
      all:
        - { field: expires_on, op: until-lt, value: 30, threshold: obligations.expiry-notice-days }
        - not: { field: expires_on, op: until-lt, value: 0 }
    deadline: expires_on
    evidence: "{item}: attested {state} by {actor}, expires {expires_on}"

  - id: OBL-ATTESTED-NO
    title: Obligation attested as not done
    kind: missing
    lens: both
    category: HYG
    severity:
      field: obligation
      map:
        ad.krbtgt-rotation: high
        ad.system-state-backup: high
        ad.forest-recovery-test: high
        backup.restore-test: high
        dr.drill: high
        change.code-review: high
        ir.exercise: high
        vuln.scan-external: high
        backup.offline-copy-verified: high
        iam.break-glass-test: high
        pki.ca-key-backup: high
        pki.template-review: high
        app.backup-verified: high
        app.sso-enforced: high
        app.audit-trail: high
        app.interface-inventory: high
        app.sod-review: high
        sys.hardening-review: high
        sys.network-exposure-review: high
        privacy.database-record: high
        tel.emergency-call-test: critical
        iam.stale-account-cleanup: low
        licence.review: low
        sec.awareness-training: low
        gov.policy-review: low
      default: medium
    entity: attestation
    why: >-
      Someone recorded that this obligation is not met - for example a script running in production
      without review, or a restore test that failed. That is an open gap until it is redone.
    fix: Close the gap the attestation describes, then record a new 'yes' attestation with evidence.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each: { field: state, op: eq, value: "no" }
    evidence: "{item}: attested 'no' by {actor} on {recorded_at}"

  - id: OBL-ATTESTATION-NO-DATE
    title: Attestation of a done obligation has no date
    kind: missing
    lens: both
    category: HYG
    severity: low
    entity: attestation
    why: >-
      A 'yes' without the date it was done cannot show the obligation is within its interval, so the
      obligation rules ignore it and keep reporting the obligation as due.
    fix: Record a new attestation with done_on set to the day the work was done.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each:
      all:
        - { field: state, op: eq, value: "yes" }
        - { field: done_on, op: absent }
    evidence: "{item}: attested 'yes' by {actor} on {recorded_at} without a done_on date"

  - id: OBL-ATTESTATION-FUTURE-DATE
    title: Attestation is dated in the future
    kind: misconfigured
    lens: both
    category: HYG
    severity: low
    entity: attestation
    why: >-
      A done_on date in the future (usually a typo) makes the obligation look fresh for longer than
      it is, hiding the moment it really falls due.
    fix: Record a corrected attestation with the real done_on date.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each:
      all:
        - { field: state, op: eq, value: "yes" }
        - { field: done_on, op: age-lt, value: -1 }
    evidence: "{item}: attested 'yes' by {actor} with done_on {done_on}, which is in the future"

  - id: OBL-ATTESTED-NA-NO-EXPIRY
    title: Obligation excused as not applicable with no expiry
    kind: missing
    lens: both
    category: HYG
    severity: medium
    entity: attestation
    why: >-
      'Does not apply' was true on the day it was recorded. Without an expiry nothing ever asks
      again, so a system that is added later, or a service that stops covering it, leaves the
      obligation excused for ever.
    fix: >-
      Record the 'na' again with an expires_on date (a year at most) and the reason as evidence, so
      the exemption is re-confirmed on a schedule.
    refs: [NIST-800-53:CA-7, NIST-800-53:RA-7]
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each:
      all:
        - { field: state, op: eq, value: na }
        - { field: expires_on, op: absent }
    evidence: "{item}: attested 'na' by {actor} on {recorded_at} with no expiry ({evidence})"

  - id: OBL-ATTESTATION-EVIDENCE-THIN
    title: Attestation of a done obligation has almost no evidence
    kind: missing
    lens: both
    category: HYG
    severity: low
    entity: attestation
    why: >-
      A 'yes' whose evidence is a word or two ("done", "ok") satisfies the obligation rule but not an
      auditor, and a year later nobody can say what was actually done or where the proof is.
    fix: >-
      Record the attestation again with what was done, where the proof lives (ticket, report,
      screenshot location) and who took part.
    refs: [NIST-800-53:CA-7, NIST-800-53:CA-2]
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each:
      all:
        - { field: state, op: eq, value: "yes" }
        - { field: evidence_length, op: lt, value: 20, threshold: obligations.min-evidence-chars }
    evidence: "{item}: attested 'yes' by {actor} on {recorded_at} with evidence '{evidence}' ({evidence_length} characters)"

  # An obligation id maps to the rule OBL-<id in capitals, dots as dashes> (backup.restore-test ->
  # OBL-BACKUP-RESTORE-TEST); a tenant's own obligation rules should follow the same naming. Judged
  # only once the rule catalogue holds this rule, so an empty catalogue reports nothing.
  - id: OBL-ATTESTATION-UNKNOWN-ID
    title: Attestation names an obligation no rule checks
    kind: misconfigured
    lens: both
    category: HYG
    severity: low
    entity: attestation
    why: >-
      An attestation under a misspelt or unknown obligation id proves nothing: no rule reads it, so
      the real obligation stays "never done" while the person who recorded it believes it is
      covered.
    fix: >-
      Record the attestation again under the right obligation id (the obligation rules list them), or
      add the obligation rule the id was meant for.
    refs: [NIST-800-53:CA-7]
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               la.actor,
               la.recorded_at,
               'OBL-' || UPPER(REPLACE(la.obligation, '.', '-')) AS expected_rule
        FROM latest_attestation la
        WHERE NOT EXISTS (SELECT 1 FROM rule r
                           WHERE UPPER(r.rule_id) = 'OBL-' || UPPER(REPLACE(la.obligation, '.', '-')))
          AND EXISTS (SELECT 1 FROM rule r WHERE r.rule_id = 'OBL-ATTESTATION-UNKNOWN-ID')
    each: any
    evidence: "{item}: attested {state} by {actor} on {recorded_at}, but no rule {expected_rule} checks obligation {obligation}"
