  # Per change, not per calendar: target = the script, automation or pipeline. Attest 'yes' when it
  # was reviewed (code and behaviour), checked for embedded secrets, run in staging and signed;
  # attest 'no' for one that runs in production without that. The interval is the re-review period.
  - id: OBL-CHANGE-CODE-REVIEW
    title: Production script or automation not reviewed, staged and signed within the interval
    kind: missing
    lens: security
    category: IAM
    severity: high
    entity: obligation
    why: >-
      Scripts and automations that create accounts, change permissions or reconfigure production
      act with high privilege and at scale. Without review, a secrets check, a staging run and a
      signature, one mistake reaches every object at once, embedded keys leak, and its alerts bury
      real incidents in the SOC.
    fix: >-
      Before a script runs in production: review the code and what it does, check it holds no
      secrets, run it in staging, sign the approved version, prefer an already-approved tool where
      one exists - then attest obligation change.code-review with the script as target. Re-review
      when it changes or when the interval passes.
    refs: [NIST-800-53:CM-3, NIST-800-53:SA-11, NIST-800-53:CM-14]
    refresh: 1d
    query:
      protocol: store
      key: item
      name: title
      text: |
        WITH t AS (
          SELECT DISTINCT a.target FROM attestation a WHERE a.obligation = 'change.code-review'
          UNION
          SELECT '-' WHERE NOT EXISTS (SELECT 1 FROM attestation a WHERE a.obligation = 'change.code-review')
        ),
        s AS (
          SELECT t.target,
                 (SELECT MAX(a.done_on) FROM attestation a
                   WHERE a.obligation = 'change.code-review' AND a.target = t.target AND a.state = 'yes'
                     AND NULLIF(TRIM(a.done_on), '') IS NOT NULL) AS last_done,
                 (SELECT la.state FROM latest_attestation la
                   WHERE la.obligation = 'change.code-review' AND la.target = t.target) AS latest_state
          FROM t
        )
        SELECT 'change.code-review' AS obligation,
               'Script and automation review before production' AS title,
               s.target,
               CASE WHEN s.target = '-' THEN 'change.code-review' ELSE 'change.code-review@' || s.target END AS item,
               s.last_done,
               COALESCE(s.latest_state, 'none') AS latest_state,
               CASE WHEN s.last_done IS NULL THEN 'never attested as done'
                    ELSE 'last done ' || s.last_done || ', ' || CAST(julianday(:today) - julianday(s.last_done) AS INTEGER) || ' days ago' END AS status_text,
               CASE WHEN s.last_done IS NULL THEN :today
                    ELSE date(s.last_done, '+' || COALESCE((SELECT st.value FROM setting st WHERE st.key = 'threshold.obligations.change.code-review.interval-days'), '365') || ' days') END AS due_on
        FROM s
    each:
      all:
        - { field: latest_state, op: ne, value: na }
        - any:
            - { field: last_done, op: absent }
            - { field: last_done, op: age-gt, value: 365, threshold: obligations.change.code-review.interval-days }
    deadline: due_on
    evidence: "{title} ({item}): {status_text}; was due {due_on}. Latest attestation: {latest_state}"

  # ----------------------------------------------- every attestation, any obligation
  - id: OBL-ATTESTATION-EXPIRED
    title: Attestation has expired
    kind: missing
    lens: both
    category: HYG
    severity:
      field: obligation
      map:
        ad.krbtgt-rotation: high
        ad.system-state-backup: high
        ad.forest-recovery-test: high
        backup.restore-test: high
        dr.drill: high
        change.code-review: high
        iam.stale-account-cleanup: low
        licence.review: low
      default: medium
    entity: attestation
    why: >-
      Whoever attested this said how long it holds. Past that date it proves nothing - a 'na' may
      no longer be true and a 'yes' may describe a system that has since changed.
    fix: Do the obligation again (or re-confirm that it does not apply) and record a new attestation.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at
        FROM latest_attestation la
    each: { field: expires_on, op: until-lt, value: 0 }
    deadline: expires_on
    evidence: "{item}: attested {state} by {actor} on {recorded_at}, expired {expires_on}"

  - id: OBL-ATTESTATION-EXPIRING
    title: Attestation expires soon
    kind: missing
    lens: both
    category: HYG
    severity:
      daysLeft: expires_on
      ranges:
        - { max: 7, value: high }
        - { max: 14, value: medium }
      default: low
    entity: attestation
    why: >-
      An attestation that lapses turns a proven obligation into an open finding. Planning the
      repeat (a drill, a restore test, a review) takes longer than the last few days.
    fix: Schedule the obligation now so a new attestation is recorded before this one expires.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at
        FROM latest_attestation la
    each:
      all:
        - { field: expires_on, op: until-lt, value: 30, threshold: obligations.expiry-notice-days }
        - not: { field: expires_on, op: until-lt, value: 0 }
    deadline: expires_on
    evidence: "{item}: attested {state} by {actor}, expires {expires_on}"

  - id: OBL-ATTESTED-NO
    title: Obligation attested as not done
    kind: missing
    lens: both
    category: HYG
    severity:
      field: obligation
      map:
        ad.krbtgt-rotation: high
        ad.system-state-backup: high
        ad.forest-recovery-test: high
        backup.restore-test: high
        dr.drill: high
        change.code-review: high
        iam.stale-account-cleanup: low
        licence.review: low
      default: medium
    entity: attestation
    why: >-
      Someone recorded that this obligation is not met - for example a script running in production
      without review, or a restore test that failed. That is an open gap until it is redone.
    fix: Close the gap the attestation describes, then record a new 'yes' attestation with evidence.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at
        FROM latest_attestation la
    each: { field: state, op: eq, value: "no" }
    evidence: "{item}: attested 'no' by {actor} on {recorded_at}"

  - id: OBL-ATTESTATION-NO-DATE
    title: Attestation of a done obligation has no date
    kind: missing
    lens: both
    category: HYG
    severity: low
    entity: attestation
    why: >-
      A 'yes' without the date it was done cannot show the obligation is within its interval, so the
      obligation rules ignore it and keep reporting the obligation as due.
    fix: Record a new attestation with done_on set to the day the work was done.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at
        FROM latest_attestation la
    each:
      all:
        - { field: state, op: eq, value: "yes" }
        - { field: done_on, op: absent }
    evidence: "{item}: attested 'yes' by {actor} on {recorded_at} without a done_on date"

  - id: OBL-ATTESTATION-FUTURE-DATE
    title: Attestation is dated in the future
    kind: misconfigured
    lens: both
    category: HYG
    severity: low
    entity: attestation
    why: >-
      A done_on date in the future (usually a typo) makes the obligation look fresh for longer than
      it is, hiding the moment it really falls due.
    fix: Record a corrected attestation with the real done_on date.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at
        FROM latest_attestation la
    each:
      all:
        - { field: state, op: eq, value: "yes" }
        - { field: done_on, op: age-lt, value: -1 }
    evidence: "{item}: attested 'yes' by {actor} with done_on {done_on}, which is in the future"
