    category: PKI
    severity: high
    entity: obligation
    why: >-
      Template settings - who may enrol, subjects supplied in the request, purposes that allow
      sign-in, weak key sizes - are behind the well-known escalation paths through certificate
      services. The certificate services checks find the known patterns; only a review decides
      whether each published template and its permissions are still needed.
