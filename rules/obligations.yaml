  - id: OBL-APP-INTERFACE-INVENTORY
    title: Application interfaces not inventoried within the interval
    kind: missing
    lens: security
    category: CFG
    severity: high
    entity: obligation
    why: >-
      Integrations are where personal data leaves the application's access control: file drops,
      database links, mail attachments and API feeds set up once and then forgotten. Nobody knows
      which one carries what until it breaks or leaks, and a clear-text channel is invisible from
      inside the application.
    fix: >-
      List every data exchange of the system - source and target, channel and protocol,
      authentication, owner, what happens when it fails and how batch files are reconciled - from
      the product's connector list and the integrator's documentation. Move clear-text flows (plain
      FTP or HTTP, unencrypted database links, personal data in mail) to encrypted ones. Attest
      obligation app.interface-inventory with the system as target and the list's location as
      evidence.
