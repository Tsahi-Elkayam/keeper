          UNION
          SELECT '-' WHERE NOT EXISTS (SELECT 1 FROM attestation a WHERE a.obligation = 'pki.ca-key-backup')
        ),
        s AS (
          SELECT t.target,
                 (SELECT MAX(a.done_on) FROM attestation a
                   WHERE a.obligation = 'pki.ca-key-backup' AND a.target = t.target AND a.state = 'yes'
                     AND NULLIF(TRIM(a.done_on), '') IS NOT NULL) AS last_done,
                 (SELECT la.state FROM latest_attestation la
