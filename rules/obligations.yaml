  - id: OBL-APP-AUDIT-TRAIL
    title: Application audit trail not confirmed within the interval
    kind: missing
    lens: security
    category: MON
    severity: high
    entity: obligation
    why: >-
      For SaaS services and appliances the only record of who signed in, read personal data,
      changed or exported records is the product's own, and self-hosted products keep it for days
      by default. When the record never leaves the system, an incident or a data-subject complaint
      cannot be answered, and rules on access to personal data ask for years, not days.
    fix: >-
      Enable the product's audit features (sign-ins, reads of personal data where required, changes,
      exports), set the retention the policy requires, and send the record off the host - an export
      to the central log store or a scheduled pull from the vendor. Attest obligation
      app.audit-trail with the system as target and a sample export as evidence.
    refs: [NIST-800-53:AU-2, NIST-800-53:AU-11, NIST-800-53:AU-6(3), CIS-Controls-v8:8.2, CIS-Controls-v8:8.9, ISO-27001:A.8.15]
