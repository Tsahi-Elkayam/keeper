  # ----------------------------------------------- every attestation, any obligation
  - id: OBL-ATTESTATION-EXPIRED
    title: Attestation has expired
    kind: missing
    lens: both
    category: HYG
    severity:
      field: obligation
      map:
        ad.krbtgt-rotation: high
        ad.system-state-backup: high
        ad.forest-recovery-test: high
        backup.restore-test: high
        dr.drill: high
        change.code-review: high
        ir.exercise: high
        vuln.scan-external: high
        backup.offline-copy-verified: high
        iam.break-glass-test: high
        pki.ca-key-backup: high
        pki.template-review: high
        iam.stale-account-cleanup: low
        licence.review: low
        sec.awareness-training: low
        gov.policy-review: low
      default: medium
    entity: attestation
    why: >-
      Whoever attested this said how long it holds. Past that date it proves nothing - a 'na' may
      no longer be true and a 'yes' may describe a system that has since changed.
    fix: Do the obligation again (or re-confirm that it does not apply) and record a new attestation.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each: { field: expires_on, op: until-lt, value: 0 }
    deadline: expires_on
    evidence: "{item}: attested {state} by {actor} on {recorded_at}, expired {expires_on}"

  - id: OBL-ATTESTATION-EXPIRING
    title: Attestation expires soon
    kind: missing
    lens: both
    category: HYG
    severity:
      daysLeft: expires_on
      ranges:
        - { max: 7, value: high }
        - { max: 14, value: medium }
      default: low
    entity: attestation
    why: >-
      An attestation that lapses turns a proven obligation into an open finding. Planning the
      repeat (a drill, a restore test, a review) takes longer than the last few days.
    fix: Schedule the obligation now so a new attestation is recorded before this one expires.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each:
      all:
        - { field: expires_on, op: until-lt, value: 30, threshold: obligations.expiry-notice-days }
        - not: { field: expires_on, op: until-lt, value: 0 }
    deadline: expires_on
    evidence: "{item}: attested {state} by {actor}, expires {expires_on}"

  - id: OBL-ATTESTED-NO
    title: Obligation attested as not done
    kind: missing
    lens: both
    category: HYG
    severity:
      field: obligation
      map:
        ad.krbtgt-rotation: high
        ad.system-state-backup: high
        ad.forest-recovery-test: high
        backup.restore-test: high
        dr.drill: high
        change.code-review: high
        ir.exercise: high
        vuln.scan-external: high
        backup.offline-copy-verified: high
        iam.break-glass-test: high
        pki.ca-key-backup: high
        pki.template-review: high
        iam.stale-account-cleanup: low
        licence.review: low
        sec.awareness-training: low
        gov.policy-review: low
      default: medium
    entity: attestation
    why: >-
      Someone recorded that this obligation is not met - for example a script running in production
      without review, or a restore test that failed. That is an open gap until it is redone.
    fix: Close the gap the attestation describes, then record a new 'yes' attestation with evidence.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each: { field: state, op: eq, value: "no" }
    evidence: "{item}: attested 'no' by {actor} on {recorded_at}"

  - id: OBL-ATTESTATION-NO-DATE
    title: Attestation of a done obligation has no date
    kind: missing
    lens: both
    category: HYG
    severity: low
    entity: attestation
    why: >-
      A 'yes' without the date it was done cannot show the obligation is within its interval, so the
      obligation rules ignore it and keep reporting the obligation as due.
    fix: Record a new attestation with done_on set to the day the work was done.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each:
      all:
        - { field: state, op: eq, value: "yes" }
        - { field: done_on, op: absent }
    evidence: "{item}: attested 'yes' by {actor} on {recorded_at} without a done_on date"

  - id: OBL-ATTESTATION-FUTURE-DATE
    title: Attestation is dated in the future
    kind: misconfigured
    lens: both
    category: HYG
    severity: low
    entity: attestation
    why: >-
      A done_on date in the future (usually a typo) makes the obligation look fresh for longer than
      it is, hiding the moment it really falls due.
    fix: Record a corrected attestation with the real done_on date.
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each:
      all:
        - { field: state, op: eq, value: "yes" }
        - { field: done_on, op: age-lt, value: -1 }
    evidence: "{item}: attested 'yes' by {actor} with done_on {done_on}, which is in the future"

  - id: OBL-ATTESTED-NA-NO-EXPIRY
    title: Obligation excused as not applicable with no expiry
    kind: missing
    lens: both
    category: HYG
    severity: medium
    entity: attestation
    why: >-
      'Does not apply' was true on the day it was recorded. Without an expiry nothing ever asks
      again, so a system that is added later, or a service that stops covering it, leaves the
      obligation excused for ever.
    fix: >-
      Record the 'na' again with an expires_on date (a year at most) and the reason as evidence, so
      the exemption is re-confirmed on a schedule.
    refs: [NIST-800-53:CA-7, NIST-800-53:RA-7]
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each:
      all:
        - { field: state, op: eq, value: na }
        - { field: expires_on, op: absent }
    evidence: "{item}: attested 'na' by {actor} on {recorded_at} with no expiry ({evidence})"

  - id: OBL-ATTESTATION-EVIDENCE-THIN
    title: Attestation of a done obligation has almost no evidence
    kind: missing
    lens: both
    category: HYG
    severity: low
    entity: attestation
    why: >-
      A 'yes' whose evidence is a word or two ("done", "ok") satisfies the obligation rule but not an
      auditor, and a year later nobody can say what was actually done or where the proof is.
    fix: >-
      Record the attestation again with what was done, where the proof lives (ticket, report,
      screenshot location) and who took part.
    refs: [NIST-800-53:CA-7, NIST-800-53:CA-2]
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.attestation_id,
               la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               NULLIF(TRIM(la.done_on), '') AS done_on,
               NULLIF(TRIM(la.expires_on), '') AS expires_on,
               la.actor,
               la.recorded_at,
               TRIM(la.evidence) AS evidence,
               LENGTH(TRIM(la.evidence)) AS evidence_length
        FROM latest_attestation la
    each:
      all:
        - { field: state, op: eq, value: "yes" }
        - { field: evidence_length, op: lt, value: 20, threshold: obligations.min-evidence-chars }
    evidence: "{item}: attested 'yes' by {actor} on {recorded_at} with evidence '{evidence}' ({evidence_length} characters)"

  # An obligation id maps to the rule OBL-<id in capitals, dots as dashes> (backup.restore-test ->
  # OBL-BACKUP-RESTORE-TEST); a tenant's own obligation rules should follow the same naming. Judged
  # only once the rule catalogue holds this rule, so an empty catalogue reports nothing.
  - id: OBL-ATTESTATION-UNKNOWN-ID
    title: Attestation names an obligation no rule checks
    kind: misconfigured
    lens: both
    category: HYG
    severity: low
    entity: attestation
    why: >-
      An attestation under a misspelt or unknown obligation id proves nothing: no rule reads it, so
      the real obligation stays "never done" while the person who recorded it believes it is
      covered.
    fix: >-
      Record the attestation again under the right obligation id (the obligation rules list them), or
      add the obligation rule the id was meant for.
    refs: [NIST-800-53:CA-7]
    refresh: 1d
    query:
      protocol: store
      key: item
      name: obligation
      text: |
        SELECT la.obligation,
               la.target,
               CASE WHEN la.target = '-' THEN la.obligation ELSE la.obligation || '@' || la.target END AS item,
               la.state,
               la.actor,
               la.recorded_at,
               'OBL-' || UPPER(REPLACE(la.obligation, '.', '-')) AS expected_rule
        FROM latest_attestation la
        WHERE NOT EXISTS (SELECT 1 FROM rule r
                           WHERE UPPER(r.rule_id) = 'OBL-' || UPPER(REPLACE(la.obligation, '.', '-')))
          AND EXISTS (SELECT 1 FROM rule r WHERE r.rule_id = 'OBL-ATTESTATION-UNKNOWN-ID')
    each: any
    evidence: "{item}: attested {state} by {actor} on {recorded_at}, but no rule {expected_rule} checks obligation {obligation}"
