  - id: SCUBA-PRODUCT-NOT-SCANNED-POWERPLATFORM
    title: Newest ScubaGear run did not cover Power Platform
    kind: missing
    lens: security
    category: MON
    severity: medium
    entity: scuba-report
    why: >-
      The newest results hold no Power Platform controls (MS.POWERPLATFORM), so the environment and
      data-policy controls have silently dropped out of the findings.
    fix: >-
      Run Invoke-SCuBA with every licensed product in -ProductNames (powerplatform included) and copy
      the new ScubaResults.csv and ScubaResults_*.json into imports\scubagear\.
    refs: [NIST-800-53:CA-7, NIST-800-53:CA-2]
    refresh: 1d
    query:
      protocol: file
      key: Control ID
      name: Requirement
      path: "scubagear/ScubaResults*.csv"
