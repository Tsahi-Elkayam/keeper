    refs: [NIST-800-53:CA-7, NIST-800-53:CA-2]
    refresh: 1d
    query:
      protocol: file
      key: Control ID
      name: Requirement
      path: "scubagear/ScubaResults*.csv"
      format: csv
    count: { op: lt, value: 1, where: { field: Control ID, op: match, value: '^MS\.SHAREPOINT\.' } }
    evidence: "The newest ScubaGear results hold {rows} controls and none for SharePoint (MS.SHAREPOINT)"

  - id: SCUBA-PRODUCT-NOT-SCANNED-TEAMS
    title: Newest ScubaGear run did not cover Teams
    kind: missing
    lens: security
    category: MON
    severity: medium
    entity: scuba-report
    why: >-
      The newest results hold no Teams controls (MS.TEAMS), so the external access, guest and meeting
      controls have silently dropped out of the findings.
    fix: >-
      Run Invoke-SCuBA with every licensed product in -ProductNames (teams included) and copy the new
      ScubaResults.csv and ScubaResults_*.json into imports\scubagear\.
    refs: [NIST-800-53:CA-7, NIST-800-53:CA-2]
    refresh: 1d
    query:
      protocol: file
      key: Control ID
      name: Requirement
      path: "scubagear/ScubaResults*.csv"
      format: csv
    count: { op: lt, value: 1, where: { field: Control ID, op: match, value: '^MS\.TEAMS\.' } }
