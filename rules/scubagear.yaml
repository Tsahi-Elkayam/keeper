schema: keeper.rules/1
system: scubagear
name: CISA ScubaGear Microsoft 365 baseline (imported)
integration: files
# Input: the files ScubaGear writes into its time-stamped output folder.
#   Install-Module ScubaGear; Initialize-SCuBA
#   Invoke-SCuBA -ProductNames aad, defender, exo, powerplatform, sharepoint, teams
#   -> M365BaselineConformance_<timestamp>\ScubaResults.csv
#      M365BaselineConformance_<timestamp>\ScubaResults_<uuid>.json (plus HTML reports, ActionPlan.csv)
# Copy ScubaResults.csv AND ScubaResults_*.json into imports\scubagear\.
# The controls are read from the CSV: the JSON nests them per product and per group, which the
# file runner cannot flatten. The CSV has one row per control with the columns "Control ID",
# Requirement, Result (Pass, Fail, Warning, N/A, Error, Omitted, ...), Criticality (Shall, Should,
# .../3rd Party, .../Not-Implemented) and Details. A failed SHALL is Fail; an unmet SHOULD is Warning.
rules:
  - id: SCUBA-FAILED
    title: ScubaGear baseline control not met
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: scuba-control
    why: >-
      The tenant does not meet a control of CISA's secure configuration baseline for Microsoft 365.
      SHALL controls are the baseline's mandatory requirements; SHOULD controls are strong
      recommendations.
    fix: >-
      Read the control's details in the ScubaGear report and change the setting. If the control is
      covered another way, record that in the ScubaGear configuration (omission with a reason and an
      expiry) rather than leaving it failing. Re-run Invoke-SCuBA and copy the new files into
      imports\scubagear\.
    refresh: 1d
    query:
      protocol: file
      key: Control ID
      name: Requirement
      path: "scubagear/ScubaResults*.csv"
      format: csv
    each: { field: Result, op: in, value: [Fail, Warning] }
    emit:
      check: "SCUBA-{Control ID}"
      title: "{Requirement}"
      severity:
        field: Criticality
        map: { Shall: high, Should: medium }
        default: medium
    evidence: "{Control ID} {Result} ({Criticality}): {Details}"

  - id: SCUBA-TEST-ERROR
    title: ScubaGear control could not be evaluated
    kind: missing
    lens: security
    category: MON
    severity: low
    entity: scuba-control
    why: >-
      ScubaGear could not evaluate the control - missing permissions, a product it could not
      connect to, or missing test results. The setting is unchecked, which is not the same as
      compliant.
    fix: >-
      Check the ScubaGear console output for the failing product, fix the permission or connection,
      and run Invoke-SCuBA again.
    refresh: 1d
    query:
      protocol: file
      key: Control ID
      name: Requirement
      path: "scubagear/ScubaResults*.csv"
      format: csv
    each: { field: Result, op: match, value: '^Error' }
    evidence: "{Control ID} {Result}: {Details}"

  - id: SCUBA-OMITTED
    title: ScubaGear control omitted as an accepted risk
    kind: misconfigured
    lens: security
    category: CFG
    severity: info
    entity: scuba-control
    why: >-
      A control omitted in the ScubaGear configuration disappears from the failures. Each omission
      is an accepted risk; listed here, it stays visible so that it is confirmed again rather than
      forgotten.
    fix: >-
      Keep the omission's rationale and expiry date in the ScubaGear configuration and re-decide when
      it expires. In Keeper, an exception on the finding records who accepted it and why.
    refs: [NIST-800-53:CA-5, NIST-800-53:RA-7]
    refresh: 1d
    query:
      protocol: file
      key: Control ID
      name: Requirement
      path: "scubagear/ScubaResults*.csv"
      format: csv
    each: { field: Result, op: eq, value: Omitted }
    emit:
      check: "SCUBA-OMITTED-{Control ID}"
      title: "Omitted: {Requirement}"
    evidence: "{Control ID} omitted ({Criticality}): {Details}"

  # Controls ScubaGear does not test itself (criticality .../Not-Implemented or .../3rd Party) come
  # out as not applicable, which looks like nothing to do. Those it did evaluate are left out.
  - id: SCUBA-MANUAL-CHECK
    title: ScubaGear control needs a manual or third-party check
    kind: missing
    lens: security
    category: CFG
    severity: info
    entity: scuba-control
    why: >-
      The baseline requires the control, but ScubaGear cannot test it - it is a policy decision or is
      met by a third-party product - so it is reported as not applicable. Unless a person checks it,
      nobody knows whether it is met.
    fix: >-
      Check the control by hand (or in the third-party product's own reports), then record the result
      as an exception on this finding with the evidence, or fix the gap you find.
    refs: [NIST-800-53:CA-7, NIST-800-53:CA-2]
    refresh: 1d
    query:
      protocol: file
      key: Control ID
      name: Requirement
      path: "scubagear/ScubaResults*.csv"
      format: csv
    each:
      all:
        - { field: Criticality, op: match, value: '(Not-Implemented|3rd Party)' }
        - { field: Result, op: notmatch, value: '^(Pass|Fail|Warning|Error|Omitted)' }
    emit:
      check: "SCUBA-MANUAL-{Control ID}"
      title: "Manual check: {Requirement}"
    evidence: "{Control ID} ({Criticality}) reported {Result}: {Details}"

  # One rule per product: a run with fewer -ProductNames silently drops every control of the missing
  # product. Disable the rule of a product the tenant does not license with an override.
  - id: SCUBA-PRODUCT-NOT-SCANNED-AAD
    title: Newest ScubaGear run did not cover Entra ID
    kind: missing
    lens: security
    category: MON
    severity: medium
    entity: scuba-report
    why: >-
      The newest results hold no Entra ID controls (MS.AAD), so every identity control has silently
      dropped out of the findings - a run limited to other products looks like a clean identity
      configuration.
    fix: >-
      Run Invoke-SCuBA with every licensed product in -ProductNames (aad included) and copy the new
      ScubaResults.csv and ScubaResults_*.json into imports\scubagear\.
    refs: [NIST-800-53:CA-7, NIST-800-53:CA-2]
    refresh: 1d
    query:
      protocol: file
      key: Control ID
      name: Requirement
      path: "scubagear/ScubaResults*.csv"
      format: csv
    count: { op: lt, value: 1, where: { field: Control ID, op: match, value: '^MS\.AAD\.' } }
    evidence: "The newest ScubaGear results hold {rows} controls and none for Entra ID (MS.AAD)"

  - id: SCUBA-PRODUCT-NOT-SCANNED-DEFENDER
    title: Newest ScubaGear run did not cover Defender
    kind: missing
    lens: security
    category: MON
    severity: medium
    entity: scuba-report
    why: >-
      The newest results hold no Defender controls (MS.DEFENDER), so the protection, alerting and
      data-loss controls have silently dropped out of the findings.
    fix: >-
      Run Invoke-SCuBA with every licensed product in -ProductNames (defender included) and copy the
      new ScubaResults.csv and ScubaResults_*.json into imports\scubagear\.
    refs: [NIST-800-53:CA-7, NIST-800-53:CA-2]
    refresh: 1d
    query:
      protocol: file
      key: Control ID
      name: Requirement
      path: "scubagear/ScubaResults*.csv"
      format: csv
    count: { op: lt, value: 1, where: { field: Control ID, op: match, value: '^MS\.DEFENDER\.' } }
    evidence: "The newest ScubaGear results hold {rows} controls and none for Defender (MS.DEFENDER)"

  - id: SCUBA-PRODUCT-NOT-SCANNED-EXO
    title: Newest ScubaGear run did not cover Exchange Online
    kind: missing
    lens: security
    category: MON
    severity: medium
    entity: scuba-report
    why: >-
      The newest results hold no Exchange Online controls (MS.EXO), so every mail control -
      forwarding, sender authentication, filtering - has silently dropped out of the findings.
    fix: >-
      Run Invoke-SCuBA with every licensed product in -ProductNames (exo included) and copy the new
      ScubaResults.csv and ScubaResults_*.json into imports\scubagear\.
    refs: [NIST-800-53:CA-7, NIST-800-53:CA-2]
    refresh: 1d
    query:
      protocol: file
      key: Control ID
      name: Requirement
      path: "scubagear/ScubaResults*.csv"
      format: csv
    count: { op: lt, value: 1, where: { field: Control ID, op: match, value: '^MS\.EXO\.' } }
    evidence: "The newest ScubaGear results hold {rows} controls and none for Exchange Online (MS.EXO)"

  - id: SCUBA-PRODUCT-NOT-SCANNED-SHAREPOINT
    title: Newest ScubaGear run did not cover SharePoint and OneDrive
    kind: missing
    lens: security
    category: MON
    severity: medium
    entity: scuba-report
    why: >-
      The newest results hold no SharePoint controls (MS.SHAREPOINT), so the external sharing and
      link controls have silently dropped out of the findings.
    fix: >-
