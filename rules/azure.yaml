  # ==== Cosmos DB (Resource Graph, one shared query) ===========================================

  - id: AZ-COSMOS-OPEN-TO-ALL-NETWORKS
    title: Cosmos DB account accepts connections from every network
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: cosmos-account
    why: "With public access on, no IP rules and no VNet filter, the account answers any address on the internet; a leaked key is then usable from anywhere."
    fix: Add IP and VNet rules for the consumers, or a private endpoint with public network access disabled.
    refs: [MCSB:NS-2, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.documentdb/databaseaccounts' | project id, name, kind, location, subscriptionId, resourceGroup, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - { field: properties.publicNetworkAccess, op: eq, value: Enabled }
        - { field: properties.ipRules, op: empty }
        - any:
            - { field: properties.isVirtualNetworkFilterEnabled, op: absent }
            - { field: properties.isVirtualNetworkFilterEnabled, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): public access with no IP or VNet rules"

  - id: AZ-COSMOS-ALLOWS-AZURE-DATACENTERS
    title: Cosmos DB account accepts connections from all Azure datacenters
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: cosmos-account
    why: "The 0.0.0.0 IP rule admits every Azure public address, including other customers' workloads, not just this organisation's services."
    fix: Remove the 0.0.0.0 rule and give the Azure consumers a private endpoint or VNet service endpoint.
    refs: [MCSB:NS-2, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.documentdb/databaseaccounts' | project id, name, kind, location, subscriptionId, resourceGroup, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: "properties.ipRules[].ipAddressOrRange", op: eq, value: 0.0.0.0 }
    evidence: "{name} (subscription {subscriptionId}): IP rule 0.0.0.0 (all Azure datacenters)"

  - id: AZ-COSMOS-KEY-METADATA-WRITE
    title: Cosmos DB account keys can change databases and containers
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: cosmos-account
    why: "Unless key-based metadata writes are disabled, anyone with an account key can create, change or delete databases and containers, not only read and write data."
    fix: Set disableKeyBasedMetadataWriteAccess to true and make schema changes through ARM with RBAC.
    refs: [MCSB:PA-7, NIST-800-53:AC-6]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.documentdb/databaseaccounts' | project id, name, kind, location, subscriptionId, resourceGroup, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: properties.disableKeyBasedMetadataWriteAccess, op: absent }
        - { field: properties.disableKeyBasedMetadataWriteAccess, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): key-based metadata writes allowed"

