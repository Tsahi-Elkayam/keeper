  - id: AZ-DEFENDER-HIGH-ALERT-ACTIVE
    title: High-severity Defender for Cloud alert is still open
    kind: broken
    lens: security
    category: MON
    severity: high
    entity: security-alert
    refresh: 6h
    why: "An open high-severity alert is a detected attack or compromise that nobody has closed; configuration posture matters little while one is unhandled."
    fix: Triage the alert now - investigate the affected resource, contain it, then resolve or dismiss the alert with a reason.
    refs: [MCSB:IR-3, MCSB:LT-1, NIST-800-53:IR-4]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "SecurityResources | where type =~ 'microsoft.security/locations/alerts' | extend status = tostring(properties.Status), severity = tostring(properties.Severity) | where status in~ ('Active','InProgress') and severity =~ 'High' | project id, name, subscriptionId, alert = tostring(properties.AlertDisplayName), affected = tostring(properties.CompromisedEntity), started = tostring(properties.StartTimeUtc), status"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: alert
    each: any
    evidence: "subscription {subscriptionId}: {alert} on {affected} since {started} ({status})"

  # ==== Activity-log alerts (Resource Graph, one row per enabled subscription) =================
  # A subscription passes when an enabled activity-log alert in it has an allOf condition with
  # operationName equal to the operation (or category ServiceHealth). An alert defined in another
  # subscription that scopes this one is not counted.

  - id: AZ-ACTIVITY-ALERT-POLICY-ASSIGNMENT-WRITE
    title: No activity-log alert on policy assignment create or update
    kind: missing
    lens: security
    category: MON
    severity: low
    entity: subscription
    why: "Changing a policy assignment can switch off a guardrail for a whole scope; without an alert the change is seen only if someone reads the activity log."
    fix: Create an activity-log alert on Microsoft.Authorization/policyAssignments/write routed to the security action group.
    refs: [MCSB:LT-3, NIST-800-53:AU-6, NIST-800-53:CM-3]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "ResourceContainers | where type =~ 'microsoft.resources/subscriptions' and tostring(properties.state) =~ 'Enabled' | project subscriptionId, subscriptionName = name | join kind=leftouter (Resources | where type =~ 'microsoft.insights/activitylogalerts' and tobool(properties.enabled) | mv-expand cond = properties.condition.allOf | where tostring(cond.field) =~ 'operationName' and tostring(cond.equals) =~ 'Microsoft.Authorization/policyAssignments/write' | summarize alerts = dcount(id) by subscriptionId) on subscriptionId | project id = strcat('/subscriptions/', subscriptionId), subscriptionId, subscriptionName, alerts = coalesce(alerts, 0)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: subscriptionName
    each: { field: alerts, op: lt, value: 1 }
    evidence: "{subscriptionName}: no enabled alert on policy assignment write"

