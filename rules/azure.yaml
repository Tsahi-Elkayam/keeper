      body:
        query: "Resources | where type =~ 'microsoft.search/searchservices' | project id, name, subscriptionId, resourceGroup, publicNetworkAccess = tostring(properties.publicNetworkAccess), ipRules = properties.networkRuleSet.ipRules, disableLocalAuth = properties.disableLocalAuth"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: disableLocalAuth, op: absent }
        - { field: disableLocalAuth, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): API key authentication allowed"

