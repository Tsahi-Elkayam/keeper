    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: search-service
    why: "A public search endpoint exposes indexed content - often copies of internal documents for retrieval - to anyone holding a query key."
    fix: Use a private endpoint and disable public network access, or restrict it with IP rules.
    refs: [MCSB:NS-2, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.search/searchservices' | project id, name, subscriptionId, resourceGroup, publicNetworkAccess = tostring(properties.publicNetworkAccess), ipRules = properties.networkRuleSet.ipRules, disableLocalAuth = properties.disableLocalAuth"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
