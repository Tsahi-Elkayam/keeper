  - id: AZ-SYNAPSE-FIREWALL-OPEN-TO-INTERNET
    title: Synapse workspace firewall allows the whole internet
    kind: misconfigured
    lens: security
    category: CFG
    severity: critical
    entity: synapse-firewall-rule
    why: "A rule from 0.0.0.0 to 255.255.255.255 (the wizard's 'allow all') puts the workspace's SQL endpoints on the internet for anyone to try."
    fix: Delete the rule and allow only named ranges, or move access to private endpoints.
    refs: [MCSB:NS-2, NIST-800-53:SC-7, MITRE-ATTACK:T1190]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Synapse/workspaces/{name}/firewallRules
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.synapse/workspaces' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2021-06-01" }
      key: id
      name: name
    each:
      all:
        - { field: properties.startIpAddress, op: eq, value: 0.0.0.0 }
        - { field: properties.endIpAddress, op: ne, value: 0.0.0.0 }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): rule {name} allows {properties.startIpAddress}-{properties.endIpAddress}"

