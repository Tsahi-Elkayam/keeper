  # ==== AI services and search (Resource Graph) ================================================

  - id: AZ-AI-SERVICES-OPEN-TO-ALL-NETWORKS
    title: AI services account (including Azure OpenAI) accepts every network
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: ai-account
    why: "An AI account open to all networks can be called from anywhere with a leaked key or token, running up cost and exposing prompts, files and model deployments."
    fix: Set the network default action to Deny with the needed ranges, or use a private endpoint and disable public access.
    refs: [MCSB:NS-2, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.cognitiveservices/accounts' | project id, name, kind, subscriptionId, resourceGroup, publicNetworkAccess = tostring(properties.publicNetworkAccess), defaultAction = tostring(properties.networkAcls.defaultAction)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - { field: publicNetworkAccess, op: ne, value: Disabled }
        - { field: defaultAction, op: ne, value: Deny }
    evidence: "{name} ({kind}, subscription {subscriptionId}): public access '{publicNetworkAccess}', default action '{defaultAction}'"

