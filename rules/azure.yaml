  # ==== Subscription activity log export (ARM, per subscription) ===============================

  - id: AZ-ACTIVITY-LOG-NOT-EXPORTED
    title: Subscription activity log is not exported anywhere
    kind: missing
    lens: security
    category: LOG
    severity: medium
    entity: subscription
    why: "The activity log keeps 90 days in the platform and cannot be queried with other logs; without a diagnostic setting nothing reaches the SIEM or long-term storage, so older control-plane actions cannot be investigated."
    fix: Add a subscription diagnostic setting that sends all activity-log categories to the central Log Analytics workspace (and storage for retention where required).
    refs: [MCSB:LT-3, MCSB:LT-5, NIST-800-53:AU-6, NIST-800-53:AU-11]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Insights/diagnosticSettings
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2021-05-01-preview" }
      paging: none
      map: true
      key: parent.subscriptionId
      name: parent.displayName
    each:
      all:
        - { field: key, op: eq, value: value }
        - { field: value, op: empty }
    evidence: "{parent.displayName}: no activity-log diagnostic setting"

  - id: AZ-ACTIVITY-LOG-CATEGORY-OFF
    title: Activity-log export leaves out a security category
    kind: misconfigured
    lens: security
    category: LOG
    severity: low
    entity: diagnostic-setting
    why: "A setting that exports Administrative but not Security, Policy or Alert loses exactly the records an investigation of a Defender alert or a policy change needs."
    fix: Enable at least the Administrative, Security, Policy and Alert categories on the setting (or all categories).
    refs: [MCSB:LT-3, NIST-800-53:AU-2]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Insights/diagnosticSettings
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2021-05-01-preview" }
      paging: none
      key: id
      name: name
    each:
      element:
        of: properties.logs
        where:
          all:
            - { field: category, op: in, value: [Administrative, Security, Policy, Alert] }
            - { field: enabled, op: eq, value: false }
    evidence: "{parent.displayName}: setting {name} has a security category off"

  # ==== Log Analytics and Application Insights (Resource Graph) ===============================

  - id: AZ-LOG-ANALYTICS-RETENTION-SHORT
    title: Log Analytics workspace keeps data for less than 90 days
    kind: misconfigured
    lens: security
    category: LOG
    severity: low
    entity: log-workspace
    refresh: 7d
    why: "Intrusions are often found months after they start; a workspace that keeps 30 days cannot show how an attacker got in."
    fix: Set the workspace (or the security tables) retention to at least 90 days, with long-term archive for the tables the incident process needs.
    refs: [MCSB:LT-6, NIST-800-53:AU-11]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.operationalinsights/workspaces' | project id, name, subscriptionId, resourceGroup, retentionDays = properties.retentionInDays, sku = tostring(properties.sku.name), disableLocalAuth = properties.features.disableLocalAuth"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: retentionDays, op: lt, value: 90, threshold: azure.log-retention-days }
    evidence: "workspace {name} (subscription {subscriptionId}): retention {retentionDays} days"

  - id: AZ-LOG-ANALYTICS-LOCAL-AUTH-ENABLED
    title: Log Analytics workspace accepts shared-key ingestion and queries
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: log-workspace
    refresh: 7d
    why: "Workspace keys let anyone holding them write forged records or read the logs without an identity; with local auth off only Entra identities can."
    fix: Move agents to the Azure Monitor Agent (Entra-authenticated) and set disableLocalAuth on the workspace.
    refs: [MCSB:IM-1, NIST-800-53:IA-2]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.operationalinsights/workspaces' | project id, name, subscriptionId, resourceGroup, retentionDays = properties.retentionInDays, sku = tostring(properties.sku.name), disableLocalAuth = properties.features.disableLocalAuth"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: disableLocalAuth, op: absent }
        - { field: disableLocalAuth, op: eq, value: false }
    evidence: "workspace {name} (subscription {subscriptionId}): local (key) authentication allowed"

  - id: AZ-APP-INSIGHTS-CLASSIC
    title: Application Insights resource is classic (not workspace-based)
    kind: broken
    lens: maintenance
    category: LCM
    severity: medium
    entity: app-insights
    refresh: 7d
    why: "Classic Application Insights retired on 2024-02-29; resources not moved to a Log Analytics workspace lose ingestion and the telemetry behind application alerts."
    fix: Migrate the resource to workspace-based mode, pointing at the central workspace.
    refs: [NIST-800-53:SA-22]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.insights/components' | project id, name, subscriptionId, resourceGroup, ingestionMode = tostring(properties.IngestionMode), workspace = tostring(properties.WorkspaceResourceId)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: ingestionMode, op: eq, value: ApplicationInsights }
        - { field: workspace, op: empty }
    evidence: "{name} (subscription {subscriptionId}): ingestion mode {ingestionMode}, no workspace"

