  # ==== Defender for Cloud: plan components and notifications (ARM, per subscription) ============

  - id: AZ-DEFENDER-SERVERS-PLAN-1-ONLY
    title: Defender for Servers runs Plan 1 only
    kind: misconfigured
    lens: security
    category: MON
    severity: low
    entity: defender-plan
    why: "Plan 1 gives EDR onboarding but no agentless vulnerability and secret scanning, file integrity monitoring or just-in-time VM access; servers holding production data usually need Plan 2."
    fix: Move the subscription's VirtualMachines plan to subPlan P2, or record why Plan 1 is enough there.
    refs: [MCSB:PV-5, MCSB:ES-1, NIST-800-53:RA-5]
    query:
      protocol: http
