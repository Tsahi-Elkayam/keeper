      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: softDelete, op: eq, value: "Off" }
    evidence: "{name} (subscription {subscriptionId}): soft delete {softDelete}"

  - id: AZ-BACKUP-LAST-JOB-FAILED
    title: Last backup of a protected item failed
    kind: broken
    lens: maintenance
    category: BCK
    severity: high
    entity: backup-item
    refresh: 6h
    why: "Each failed backup widens the gap between the last good restore point and now; a run of failures leaves the item effectively unprotected."
    fix: Read the failed job's error in the vault, fix the cause (agent, snapshot, permissions, VM state) and run an on-demand backup.
    refs: [MCSB:BR-1, NIST-800-53:CP-9]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "RecoveryServicesResources | where type =~ 'microsoft.recoveryservices/vaults/backupfabrics/protectioncontainers/protecteditems' | project id, name, subscriptionId, resourceGroup, vault = tostring(split(id, '/')[8]), item = tostring(properties.friendlyName), workload = tostring(properties.workloadType), lastBackupStatus = tostring(properties.lastBackupStatus), lastBackupTime = tostring(properties.lastBackupTime), protectionState = tostring(properties.protectionState)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: item
    each:
      all:
        - { field: lastBackupStatus, op: eq, value: Failed }
        - { field: protectionState, op: ne, value: ProtectionStopped }
    evidence: "{item} ({workload}) in vault {vault}: last backup {lastBackupStatus}, last success {lastBackupTime}"

  - id: AZ-BACKUP-STALE
    title: Protected item has no recent backup
    kind: broken
    lens: maintenance
    category: BCK
    severity: high
    entity: backup-item
    refresh: 6h
    why: "An item marked Protected whose last backup is days old will lose those days of data in a restore, and usually means a schedule or agent has silently stopped."
    fix: Check the item's backup jobs and policy schedule, fix the cause and run an on-demand backup.
    refs: [MCSB:BR-1, NIST-800-53:CP-9]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "RecoveryServicesResources | where type =~ 'microsoft.recoveryservices/vaults/backupfabrics/protectioncontainers/protecteditems' | project id, name, subscriptionId, resourceGroup, vault = tostring(split(id, '/')[8]), item = tostring(properties.friendlyName), workload = tostring(properties.workloadType), lastBackupStatus = tostring(properties.lastBackupStatus), lastBackupTime = tostring(properties.lastBackupTime), protectionState = tostring(properties.protectionState)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: item
    each:
      all:
        - { field: protectionState, op: eq, value: Protected }
        - { field: lastBackupTime, op: age-gt, value: 2, threshold: azure.backup-max-age-days }
    evidence: "{item} ({workload}) in vault {vault}: last backup {lastBackupTime}"

  - id: AZ-BACKUP-PROTECTION-ERROR
    title: Protected item is in error or paused
    kind: broken
    lens: maintenance
    category: BCK
    severity: medium
    entity: backup-item
    refresh: 1d
    why: "An item in ProtectionError or ProtectionPaused takes no new backups while still appearing in the vault's inventory."
