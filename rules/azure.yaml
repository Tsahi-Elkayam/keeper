        - { field: ipRules, op: empty }
    evidence: "{name} (subscription {subscriptionId}): public network access with no IP rules"

  - id: AZ-AI-SEARCH-KEY-AUTH
    title: AI Search service accepts API keys
    kind: misconfigured
