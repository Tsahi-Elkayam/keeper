  - id: AZ-BACKUP-VAULT-SOFT-DELETE-OFF
    title: Backup vault (Data Protection) has soft delete off
    kind: misconfigured
    lens: security
    category: BCK
    severity: high
    entity: backup-vault
    why: "Backup vaults protect disks, blobs and databases; with soft delete off, deleted backup data is gone immediately."
    fix: Set the vault's soft delete state to On (or AlwaysOn) with at least 14 days retention.
    refs: [MCSB:BR-2, NIST-800-53:CP-9, MITRE-ATTACK:T1490]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
