  # ==== Network visibility: flow logs and Network Watcher (Resource Graph) =====================

  - id: AZ-VNET-NO-FLOW-LOG
    title: Virtual network has no flow log
    kind: missing
    lens: security
    category: LOG
    severity: low
    entity: vnet
    refresh: 7d
    why: "Flow logs are the record of which address talked to which on what port; without them an investigation cannot tell what a compromised host reached. NSG flow logs on every subnet's NSG give the same record, so check those before acting."
    fix: Enable a VNet flow log (the successor of NSG flow logs) to a storage account, with traffic analytics to the central workspace.
    refs: [MCSB:LT-4, NIST-800-53:AU-12, NIST-800-53:SI-4]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/virtualnetworks' | project id, name, subscriptionId, resourceGroup, location, target = tolower(id) | join kind=leftouter (Resources | where type =~ 'microsoft.network/networkwatchers/flowlogs' and tobool(properties.enabled) | project target = tolower(tostring(properties.targetResourceId)), flowLog = name) on target | summarize flowLogs = countif(isnotempty(flowLog)) by id, name, subscriptionId, resourceGroup, location"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: flowLogs, op: lt, value: 1 }
    evidence: "VNet {name} ({location}, subscription {subscriptionId}): no enabled VNet flow log"

  - id: AZ-FLOW-LOG-DISABLED
    title: Flow log exists but is disabled
    kind: misconfigured
    lens: security
    category: LOG
    severity: medium
    entity: flow-log
    refresh: 7d
    why: "A disabled flow log looks like coverage in an inventory but records nothing."
    fix: Enable the flow log, or delete it if the network it covered is gone.
    refs: [MCSB:LT-4, NIST-800-53:AU-12]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/networkwatchers/flowlogs' | project id, name, subscriptionId, resourceGroup, location, target = tostring(properties.targetResourceId), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: properties.enabled, op: eq, value: false }
    evidence: "flow log {name} for {target}: disabled"

  - id: AZ-FLOW-LOG-RETENTION-SHORT
    title: Flow log retention is shorter than 90 days
    kind: misconfigured
    lens: security
    category: LOG
    severity: low
    entity: flow-log
    refresh: 7d
    why: "Network records kept for a few days are gone before most intrusions are discovered."
    fix: Set the flow log retention to at least 90 days (0 keeps the data with no time limit).
    refs: [MCSB:LT-6, NIST-800-53:AU-11]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/networkwatchers/flowlogs' | project id, name, subscriptionId, resourceGroup, location, target = tostring(properties.targetResourceId), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - { field: properties.retentionPolicy.enabled, op: eq, value: true }
        - { field: properties.retentionPolicy.days, op: gt, value: 0 }
        - { field: properties.retentionPolicy.days, op: lt, value: 90, threshold: azure.flow-log-retention-days }
    evidence: "flow log {name} for {target}: retention {properties.retentionPolicy.days} days"

  - id: AZ-FLOW-LOG-NO-TRAFFIC-ANALYTICS
    title: Flow log has no traffic analytics
    kind: misconfigured
    lens: security
    category: MON
    severity: low
    entity: flow-log
    refresh: 7d
    why: "Raw flow logs in a storage account are rarely read; traffic analytics puts them in the workspace where malicious-IP flows and unusual ports can be queried and alerted on."
    fix: Enable traffic analytics on the flow log, sending to the central workspace.
    refs: [MCSB:LT-4, NIST-800-53:SI-4]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/networkwatchers/flowlogs' | project id, name, subscriptionId, resourceGroup, location, target = tostring(properties.targetResourceId), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: properties.flowAnalyticsConfiguration.networkWatcherFlowAnalyticsConfiguration.enabled, op: absent }
        - { field: properties.flowAnalyticsConfiguration.networkWatcherFlowAnalyticsConfiguration.enabled, op: eq, value: false }
    evidence: "flow log {name} for {target}: traffic analytics off"

  - id: AZ-NSG-FLOW-LOG-RETIRING
    title: Flow log is an NSG flow log (retiring)
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: low
    entity: flow-log
    refresh: 7d
    why: "NSG flow logs can no longer be created and retire on 2027-09-30; after that the network record they give stops unless VNet flow logs replace them."
    fix: Enable VNet flow logs on the virtual networks concerned and remove the NSG flow logs once the new ones are flowing.
    refs: [NIST-800-53:SA-22]
    deadline: 2027-09-30
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/networkwatchers/flowlogs' | project id, name, subscriptionId, resourceGroup, location, target = tostring(properties.targetResourceId), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: target, op: match, value: '/networkSecurityGroups/' }
    evidence: "flow log {name} targets NSG {target}"

  - id: AZ-NETWORK-WATCHER-MISSING
    title: No Network Watcher in a region that has virtual networks
    kind: missing
    lens: both
    category: MON
    severity: low
    entity: region
    refresh: 7d
    why: "Flow logs, connection troubleshooting and packet capture all need a Network Watcher in the region; without one, the first hour of a network incident is spent creating it."
    fix: Enable Network Watcher for the subscription in that region (or let the platform's automatic enablement run).
    refs: [MCSB:LT-4, NIST-800-53:SI-4]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/virtualnetworks' | summarize vnets = count() by subscriptionId, location | join kind=leftouter (Resources | where type =~ 'microsoft.network/networkwatchers' | summarize watchers = count() by subscriptionId, location) on subscriptionId, location | project id = strcat('/subscriptions/', subscriptionId, '/locations/', location), subscriptionId, location, vnets, watchers = coalesce(watchers, 0)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: location
    each: { field: watchers, op: lt, value: 1 }
    evidence: "subscription {subscriptionId}, region {location}: {vnets} VNet(s), no Network Watcher"

  # ==== NSG rules and subnets (Resource Graph) =================================================

  - id: AZ-NSG-SENSITIVE-PORT-RANGE-FROM-INTERNET
    title: NSG rule opens a sensitive port to the internet through a range or a list
    kind: misconfigured
    lens: security
    category: CFG
    severity: high
    entity: nsg-rule
    why: "A port range such as 20-3400, a port list or a source list that includes the internet opens remote-access, database and cluster ports just as a single-port rule does, and it slips past reviews that only read the single port field."
    fix: "Narrow the rule to the ports and sources the service needs; reach admin and data ports through Bastion, a VPN or private endpoints."
    refs: [MCSB:NS-1, NIST-800-53:SC-7, MITRE-ATTACK:T1133]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/networksecuritygroups' | mv-expand rule = properties.securityRules | where tostring(rule.properties.direction) =~ 'Inbound' and tostring(rule.properties.access) =~ 'Allow' and tostring(rule.properties.protocol) in~ ('Tcp','*','Any') | extend singleSrc = array_length(rule.properties.sourceAddressPrefixes) == 0, singlePort = array_length(rule.properties.destinationPortRanges) == 0 | extend srcs = iff(singleSrc, pack_array(rule.properties.sourceAddressPrefix), rule.properties.sourceAddressPrefixes), ranges = iff(singlePort, pack_array(rule.properties.destinationPortRange), rule.properties.destinationPortRanges) | mv-expand src = srcs | extend src = tostring(src) | where src in~ ('*','0.0.0.0/0','Internet','Any','::/0') | mv-expand r = ranges | extend r = tostring(r) | where not(singleSrc and singlePort and r in ('*','22','3389','5985','5986','445','135','1433','3306','5432')) | extend lo = iff(r == '*', 0, toint(split(r, '-')[0])), hi = iff(r == '*', 65535, iff(r contains '-', toint(split(r, '-')[1]), toint(r))) | mv-expand port = dynamic([20,21,22,23,25,53,110,135,139,161,389,445,636,1433,1521,2375,2376,2379,3306,3389,4333,5432,5601,5900,5984,5985,5986,6379,7001,8020,9042,9200,9300,11211,27017]) | extend port = toint(port) | where port between (lo .. hi) | summarize ports = make_set(port), sources = make_set(src) by id, name, subscriptionId, resourceGroup, nsgRule = tostring(rule.name)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: "{id}|{nsgRule}"
      name: name
    each: any
    evidence: "NSG {name} (subscription {subscriptionId}) rule {nsgRule}: sources {sources} reach ports {ports}"

  - id: AZ-NSG-UDP-FROM-INTERNET
    title: NSG rule allows UDP from the internet
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: nsg-rule
    why: "UDP services (DNS, NTP, SNMP, SSDP, CLDAP) answered to the internet are used for reflection and amplification attacks and often expose management data."
    fix: Remove the rule or restrict its source to the partners that need the service; front public UDP services with DDoS protection.
    refs: [MCSB:NS-1, NIST-800-53:SC-7, NIST-800-53:SC-5]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/networksecuritygroups' | mv-expand rule = properties.securityRules | where tostring(rule.properties.direction) =~ 'Inbound' and tostring(rule.properties.access) =~ 'Allow' and tostring(rule.properties.protocol) =~ 'Udp' | extend srcs = iff(array_length(rule.properties.sourceAddressPrefixes) == 0, pack_array(rule.properties.sourceAddressPrefix), rule.properties.sourceAddressPrefixes) | mv-expand src = srcs | extend src = tostring(src) | where src in~ ('*','0.0.0.0/0','Internet','Any','::/0') | summarize sources = make_set(src) by id, name, subscriptionId, resourceGroup, nsgRule = tostring(rule.name), ports = strcat(tostring(rule.properties.destinationPortRange), tostring(rule.properties.destinationPortRanges))"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: "{id}|{nsgRule}"
      name: name
    each: any
    evidence: "NSG {name} (subscription {subscriptionId}) rule {nsgRule}: UDP {ports} from {sources}"

  - id: AZ-SUBNET-NO-NSG
    title: Subnet has no network security group
    kind: missing
    lens: security
    category: CFG
    severity: medium
    entity: subnet
    why: "A subnet without an NSG relies only on whatever sits upstream; any VM given a public IP there, or any lateral move inside the VNet, meets no filter."
    fix: Associate an NSG with the subnet (deny-by-default plus the flows the workload needs). Gateway, firewall, Bastion and route-server subnets are excluded.
    refs: [MCSB:NS-1, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/virtualnetworks' | mv-expand s = properties.subnets | extend subnet = tostring(s.name), nsg = tostring(s.properties.networkSecurityGroup.id) | where subnet !in~ ('GatewaySubnet','AzureFirewallSubnet','AzureFirewallManagementSubnet','AzureBastionSubnet','RouteServerSubnet') | project id, name, subscriptionId, resourceGroup, subnet, nsg"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: "{id}|{subnet}"
      name: subnet
    each: { field: nsg, op: empty }
    evidence: "VNet {name} (subscription {subscriptionId}) subnet {subnet}: no NSG"

  - id: AZ-VNET-DDOS-PROTECTION-OFF
    title: Virtual network has no DDoS network protection plan
    kind: missing
    lens: security
    category: AVL
    severity: low
    entity: vnet
    refresh: 7d
    why: "Without DDoS network protection, public IPs in the VNet get only the platform's basic infrastructure protection, tuned for Azure as a whole rather than the workload, with no attack telemetry or cost protection."
    fix: Link the VNets that hold internet-facing services to a DDoS protection plan (or use per-IP protection), or record the accepted risk.
    refs: [MCSB:NS-5, NIST-800-53:SC-5]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/virtualnetworks' | project id, name, subscriptionId, resourceGroup, location, ddos = properties.enableDdosProtection"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: ddos, op: absent }
        - { field: ddos, op: eq, value: false }
    evidence: "VNet {name} ({location}, subscription {subscriptionId}): DDoS protection off"

  - id: AZ-PRIVATE-ENDPOINT-NOT-APPROVED
    title: Private endpoint connection is not approved
    kind: broken
    lens: maintenance
    category: AVL
    severity: medium
    entity: private-endpoint
    refresh: 6h
    why: "A private endpoint whose connection is pending, rejected or disconnected carries no traffic; clients resolving the private name fail, or fall back to the public endpoint."
    fix: Approve the connection on the target resource, or remove the endpoint and its DNS record if the connection was rejected on purpose.
    refs: [MCSB:NS-2, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/privateendpoints' | mv-expand c = array_concat(coalesce(properties.privateLinkServiceConnections, dynamic([])), coalesce(properties.manualPrivateLinkServiceConnections, dynamic([]))) | extend status = tostring(c.properties.privateLinkServiceConnectionState.status) | where isnotempty(status) | project id, name, subscriptionId, resourceGroup, connection = tostring(c.name), status, target = tostring(c.properties.privateLinkServiceId)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: "{id}|{connection}"
      name: name
    each: { field: status, op: ne, value: Approved }
    evidence: "private endpoint {name} (subscription {subscriptionId}) to {target}: {status}"

  # ==== Application Gateway, WAF, Front Door and CDN (Resource Graph) ===========================

  - id: AZ-APPGW-WAF-OFF
    title: Application gateway has no web application firewall
    kind: missing
    lens: security
    category: CFG
    severity: medium
    entity: app-gateway
    why: "An application gateway publishing web apps without WAF passes injection, cross-site scripting and known-exploit requests straight to the backends."
    fix: Move the gateway to the WAF_v2 tier and attach a WAF policy in prevention mode, or record why the apps behind it are not internet-facing.
    refs: [MCSB:NS-6, NIST-800-53:SC-7, NIST-800-53:SI-3]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/applicationgateways' | project id, name, subscriptionId, resourceGroup, tier = tostring(properties.sku.tier), wafPolicy = tostring(properties.firewallPolicy.id), wafConfig = properties.webApplicationFirewallConfiguration.enabled, sslPolicy = properties.sslPolicy"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: tier, op: notmatch, value: '^WAF' }
        - all:
            - { field: wafPolicy, op: empty }
            - any:
                - { field: wafConfig, op: absent }
                - { field: wafConfig, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): tier {tier}, no WAF policy or WAF configuration"

  - id: AZ-APPGW-WEAK-TLS-POLICY
    title: Application gateway TLS policy allows TLS below 1.2
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: app-gateway
    why: "The 2015 and 2017 predefined policies, or a custom policy with a 1.0 or 1.1 minimum, let clients negotiate deprecated TLS versions and weak ciphers on the published apps."
    fix: Set the gateway's SSL policy to a current predefined policy (AppGwSslPolicy20220101 or later) or a custom policy with minimum TLSv1_2.
    refs: [MCSB:DP-3, NIST-800-53:SC-8, NIST-800-53:SC-13]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/applicationgateways' | project id, name, subscriptionId, resourceGroup, tier = tostring(properties.sku.tier), wafPolicy = tostring(properties.firewallPolicy.id), wafConfig = properties.webApplicationFirewallConfiguration.enabled, sslPolicy = properties.sslPolicy"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: sslPolicy.policyName, op: in, value: [AppGwSslPolicy20150501, AppGwSslPolicy20170401] }
        - { field: sslPolicy.minProtocolVersion, op: in, value: [TLSv1_0, TLSv1_1] }
    evidence: "{name} (subscription {subscriptionId}): SSL policy {sslPolicy.policyName} minimum {sslPolicy.minProtocolVersion}"

  - id: AZ-APPGW-WAF-POLICY-NOT-BLOCKING
    title: Application Gateway WAF policy is in detection mode or disabled
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: waf-policy
    why: "A WAF policy in detection mode only logs the attacks it recognises; a disabled one does not even log. Either way the requests reach the application."
    fix: After a tuning period with exclusions for false positives, set the policy to Prevention and Enabled.
    refs: [MCSB:NS-6, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/applicationgatewaywebapplicationfirewallpolicies' | project id, name, subscriptionId, resourceGroup, mode = tostring(properties.policySettings.mode), state = tostring(properties.policySettings.state), gateways = array_length(properties.applicationGateways)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: mode, op: eq, value: Detection }
        - { field: state, op: eq, value: Disabled }
    evidence: "WAF policy {name} (subscription {subscriptionId}): mode {mode}, state {state}, on {gateways} gateway(s)"

  - id: AZ-FRONTDOOR-WAF-POLICY-NOT-BLOCKING
    title: Front Door WAF policy is in detection mode or disabled
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: waf-policy
    why: "At the edge, a detection-only or disabled WAF policy lets every recognised attack through to the origins."
    fix: After tuning, set the Front Door WAF policy to Prevention and Enabled.
    refs: [MCSB:NS-6, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/frontdoorwebapplicationfirewallpolicies' | project id, name, subscriptionId, resourceGroup, mode = tostring(properties.policySettings.mode), state = tostring(properties.policySettings.enabledState)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: mode, op: eq, value: Detection }
        - { field: state, op: eq, value: Disabled }
    evidence: "Front Door WAF policy {name} (subscription {subscriptionId}): mode {mode}, state {state}"

  - id: AZ-FRONTDOOR-NO-WAF
    title: Front Door profile has no WAF security policy
    kind: missing
    lens: security
    category: CFG
    severity: high
    entity: cdn-profile
    why: "A Front Door Standard or Premium profile without a security policy publishes its origins to the internet with no web application firewall in front of them."
    fix: Create a security policy that links a WAF policy (prevention mode) to the profile's domains.
    refs: [MCSB:NS-6, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Cdn/profiles/{name}/securityPolicies
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.cdn/profiles' and tostring(sku.name) in~ ('Standard_AzureFrontDoor','Premium_AzureFrontDoor') | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2023-05-01" }
      paging: none
      map: true
      key: parent.id
      name: parent.name
    each:
      all:
        - { field: key, op: eq, value: value }
        - { field: value, op: empty }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): no security (WAF) policy"

  - id: AZ-FRONTDOOR-CLASSIC
    title: Front Door (classic) profile still in use
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: medium
    entity: front-door
    refresh: 7d
    why: "Front Door (classic) retires on 2027-03-31; sites still on it stop being served on Microsoft's schedule, and new features and WAF rule sets go to Standard and Premium only."
    fix: Migrate the profile to Front Door Standard or Premium with the built-in migration tool, then move the DNS.
    refs: [NIST-800-53:SA-22]
    deadline: 2027-03-31
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/frontdoors' | project id, name, subscriptionId, resourceGroup"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: any
    evidence: "{name} (subscription {subscriptionId}): Front Door (classic)"

  - id: AZ-CDN-RETIRED-SKU
    title: CDN profile on a retired or retiring tier
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity:
      field: sku
      map: { Standard_Verizon: high, Premium_Verizon: high, Standard_Akamai: high, Standard_Microsoft: medium }
      default: medium
    entity: cdn-profile
    refresh: 7d
    why: "The Edgio (Verizon) and Akamai CDN tiers are already retired, and Azure CDN Standard from Microsoft (classic) retires on 2027-09-30; content on them stops being delivered when the platform cuts over."
    fix: Move the endpoints to Azure Front Door Standard or Premium and switch the DNS before the date.
    refs: [NIST-800-53:SA-22]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.cdn/profiles' | project id, name, subscriptionId, resourceGroup, sku = tostring(sku.name)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: sku, op: in, value: [Standard_Verizon, Premium_Verizon, Standard_Akamai, Standard_Microsoft] }
    evidence: "{name} (subscription {subscriptionId}): CDN tier {sku}"

  # ==== Azure Firewall, Bastion, VPN and ExpressRoute (Resource Graph) =========================

  - id: AZ-FIREWALL-THREAT-INTEL-OFF
    title: Azure Firewall threat intelligence filtering is off
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: firewall
    why: "Threat-intelligence filtering alerts on or blocks traffic to and from known malicious addresses and domains at no extra cost; off, command-and-control traffic passes unflagged."
    fix: Set threat intelligence mode to Alert, or Deny once tuned (on the firewall policy when one is attached).
    refs: [MCSB:NS-3, NIST-800-53:SI-4, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where (type =~ 'microsoft.network/azurefirewalls' and isempty(tostring(properties.firewallPolicy.id))) or type =~ 'microsoft.network/firewallpolicies' | project id, name, type, subscriptionId, resourceGroup, threatIntelMode = tostring(properties.threatIntelMode), tier = tostring(properties.sku.tier), idpsMode = tostring(properties.intrusionDetection.mode)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: threatIntelMode, op: eq, value: "Off" }
    evidence: "{name} ({type}, subscription {subscriptionId}): threat intelligence {threatIntelMode}"

  - id: AZ-FIREWALL-IDPS-OFF
    title: Premium firewall policy has intrusion detection off
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: firewall-policy
    why: "The Premium tier is bought for signature-based intrusion detection; with IDPS off the policy pays for it and inspects nothing."
    fix: Set the policy's intrusion detection mode to Alert, then Alert and Deny once tuned.
    refs: [MCSB:NS-3, NIST-800-53:SI-4]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where (type =~ 'microsoft.network/azurefirewalls' and isempty(tostring(properties.firewallPolicy.id))) or type =~ 'microsoft.network/firewallpolicies' | project id, name, type, subscriptionId, resourceGroup, threatIntelMode = tostring(properties.threatIntelMode), tier = tostring(properties.sku.tier), idpsMode = tostring(properties.intrusionDetection.mode)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - { field: type, op: eq, value: microsoft.network/firewallpolicies }
        - { field: tier, op: eq, value: Premium }
        - any:
            - { field: idpsMode, op: empty }
            - { field: idpsMode, op: eq, value: "Off" }
    evidence: "{name} (subscription {subscriptionId}): Premium policy with IDPS {idpsMode}"

  - id: AZ-BASTION-SHAREABLE-LINK
    title: Bastion host allows shareable links
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: bastion
    why: "A shareable link lets anyone holding the URL open an RDP or SSH session to the VM without an Azure sign-in; links are easily forwarded and outlive the need."
    fix: Turn off shareable links on the Bastion host and delete existing links, unless a recorded use case needs them.
    refs: [MCSB:PA-7, NIST-800-53:AC-17]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/bastionhosts' | project id, name, subscriptionId, resourceGroup, sku = tostring(sku.name), shareableLink = properties.enableShareableLink"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: shareableLink, op: eq, value: true }
    evidence: "{name} (subscription {subscriptionId}): shareable links enabled"

  - id: AZ-VPN-GATEWAY-BASIC-SKU
    title: Virtual network gateway uses the Basic SKU
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: low
    entity: vnet-gateway
    refresh: 7d
    why: "The Basic VPN gateway has no BGP, no zone redundancy, no IKEv2 for point-to-site and runs on a Basic public IP, which is retired; it is the weakest link in site connectivity."
    fix: Migrate the gateway to a VpnGw1AZ or higher SKU in a maintenance window.
    refs: [NIST-800-53:SA-22, NIST-800-53:CP-8]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/virtualnetworkgateways' | project id, name, subscriptionId, resourceGroup, gatewayType = tostring(properties.gatewayType), sku = tostring(properties.sku.name)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: sku, op: eq, value: Basic }
    evidence: "{name} (subscription {subscriptionId}): {gatewayType} gateway on SKU {sku}"

  - id: AZ-VPN-CONNECTION-NOT-CONNECTED
    title: Site-to-site VPN connection is not connected
    kind: broken
    lens: maintenance
    category: AVL
    severity: high
    entity: vpn-connection
    refresh: 6h
    why: "A down site-to-site tunnel cuts the on-premises or partner network off from the workloads behind it, often without any alert in place."
    fix: Check the on-premises device, shared key and IPsec parameters; reset the connection if both sides look healthy. The state comes from the Resource Graph snapshot, so confirm it on the connection itself.
    refs: [NIST-800-53:CP-8, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/connections' | project id, name, subscriptionId, resourceGroup, connectionType = tostring(properties.connectionType), status = tostring(properties.connectionStatus)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - { field: connectionType, op: eq, value: IPsec }
        - { field: status, op: eq, value: NotConnected }
    evidence: "{name} (subscription {subscriptionId}): {connectionType} connection {status}"

  - id: AZ-EXPRESSROUTE-NOT-PROVISIONED
    title: ExpressRoute circuit is not provisioned by the provider
    kind: broken
    lens: maintenance
    category: AVL
    severity: medium
    entity: expressroute-circuit
    refresh: 6h
    why: "A circuit the provider has not provisioned (or has deprovisioned) carries no traffic but is still billed, and the private connectivity that depends on it is not there."
    fix: Chase the connectivity provider to complete provisioning, or delete the circuit if it is no longer needed.
    refs: [NIST-800-53:CP-8]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/expressroutecircuits' | project id, name, subscriptionId, resourceGroup, providerState = tostring(properties.serviceProviderProvisioningState), circuitState = tostring(properties.circuitProvisioningState)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: providerState, op: ne, value: Provisioned }
    evidence: "ExpressRoute {name} (subscription {subscriptionId}): provider state {providerState}, circuit {circuitState}"

  # ==== Storage accounts: account settings (Resource Graph, one shared query) ===================

  - id: AZ-STORAGE-INFRASTRUCTURE-ENCRYPTION-OFF
    title: Storage account has no infrastructure (double) encryption
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: storage-account
    refresh: 7d
    why: "Infrastructure encryption adds a second, independently keyed layer under the service encryption; for regulated data it is the defence if one algorithm or key is ever compromised. It can only be chosen when the account is created."
    fix: Create new accounts for sensitive data with infrastructure encryption required, and move the data; record an exception for accounts that do not need it.
    refs: [MCSB:DP-4, NIST-800-53:SC-28]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.storage/storageaccounts' | project id, name, kind, location, subscriptionId, resourceGroup, sku = tostring(sku.name), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: properties.encryption.requireInfrastructureEncryption, op: absent }
        - { field: properties.encryption.requireInfrastructureEncryption, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): infrastructure encryption off"

  - id: AZ-STORAGE-KEY-EXPIRY-POLICY-MISSING
    title: Storage account with shared keys has no key expiration policy
    kind: missing
    lens: security
    category: AUT
    severity: low
    entity: storage-account
    refresh: 7d
    why: "While shared keys are allowed, a key expiration policy is what makes a stale key visible and reminds the owner to rotate it; without one a leaked key works for years."
    fix: Set a key expiration period (90 days is usual), or disallow shared-key access altogether.
    refs: [MCSB:IM-8, NIST-800-53:IA-5]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.storage/storageaccounts' | project id, name, kind, location, subscriptionId, resourceGroup, sku = tostring(sku.name), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - any:
            - { field: properties.allowSharedKeyAccess, op: absent }
            - { field: properties.allowSharedKeyAccess, op: eq, value: true }
        - { field: properties.keyPolicy.keyExpirationPeriodInDays, op: absent }
    evidence: "{name} (subscription {subscriptionId}): shared keys allowed, no key expiration policy"

  - id: AZ-STORAGE-SAS-EXPIRY-POLICY-MISSING
    title: Storage account with shared keys has no SAS expiration policy
    kind: missing
    lens: security
    category: AUT
    severity: low
    entity: storage-account
    refresh: 7d
    why: "Account and service SAS tokens can be signed to last for years; a SAS expiration policy limits their lifetime and logs the ones that exceed it."
    fix: Set a SAS expiration policy (for example one day, action Log or Block), or disallow shared-key access.
    refs: [MCSB:IM-8, NIST-800-53:IA-5, NIST-800-53:AC-3]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.storage/storageaccounts' | project id, name, kind, location, subscriptionId, resourceGroup, sku = tostring(sku.name), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - any:
            - { field: properties.allowSharedKeyAccess, op: absent }
            - { field: properties.allowSharedKeyAccess, op: eq, value: true }
        - { field: properties.sasPolicy, op: absent }
    evidence: "{name} (subscription {subscriptionId}): shared keys allowed, no SAS expiration policy"

  - id: AZ-STORAGE-KEYS-NOT-ROTATED
    title: Storage account key not rotated for 90 days
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: storage-account
    refresh: 7d
    why: "An account key grants full control of all data in the account; one that has not been regenerated in months has probably been copied into scripts and config files, and anyone who saw it still holds it."
    fix: Regenerate the keys (one at a time, switching clients between them), or better, move clients to Entra ID and disallow shared keys.
    refs: [MCSB:IM-8, NIST-800-53:IA-5]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.storage/storageaccounts' | project id, name, kind, location, subscriptionId, resourceGroup, sku = tostring(sku.name), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - any:
            - { field: properties.allowSharedKeyAccess, op: absent }
            - { field: properties.allowSharedKeyAccess, op: eq, value: true }
        - any:
            - { field: properties.keyCreationTime.key1, op: age-gt, value: 90, threshold: azure.storage-key-rotation-days }
            - { field: properties.keyCreationTime.key2, op: age-gt, value: 90, threshold: azure.storage-key-rotation-days }
    evidence: "{name} (subscription {subscriptionId}): key1 created {properties.keyCreationTime.key1}, key2 created {properties.keyCreationTime.key2}"

  - id: AZ-STORAGE-SFTP-ENABLED
    title: Storage account has SFTP enabled
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: storage-account
    refresh: 7d
    why: "SFTP uses local users with passwords or SSH keys that live outside Entra ID, Conditional Access and RBAC; the endpoint is reachable wherever the account's network rules allow."
    fix: Disable SFTP where it is not in use; where it is, restrict the network rules and review the local users and their keys.
    refs: [MCSB:IM-1, NIST-800-53:IA-2, NIST-800-53:AC-17]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.storage/storageaccounts' | project id, name, kind, location, subscriptionId, resourceGroup, sku = tostring(sku.name), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: properties.isSftpEnabled, op: eq, value: true }
    evidence: "{name} (subscription {subscriptionId}): SFTP enabled"

  - id: AZ-STORAGE-NO-GEO-REDUNDANCY
    title: Storage account keeps data in one region only
    kind: misconfigured
    lens: maintenance
    category: BCK
    severity: low
    entity: storage-account
    refresh: 7d
    why: "Locally or zone-redundant storage survives a disk or a zone failure but not the loss of the region; data that must survive a regional disaster needs a geo-redundant copy or a separate backup."
    fix: Move accounts holding data that must survive a regional outage to GRS or GZRS, or record that the data is reproducible or backed up elsewhere.
    refs: [MCSB:BR-1, NIST-800-53:CP-9, NIST-800-53:CP-6]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.storage/storageaccounts' | project id, name, kind, location, subscriptionId, resourceGroup, sku = tostring(sku.name), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: sku, op: match, value: '_(LRS|ZRS)$' }
    evidence: "{name} ({location}, subscription {subscriptionId}): redundancy {sku}"

  - id: AZ-STORAGE-GPV1
    title: Storage account is general-purpose v1
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: medium
    entity: storage-account
    refresh: 7d
    why: "General-purpose v1 accounts retire on 2026-10-13; they lack lifecycle management, access tiers and current security features, and are moved or restricted on Microsoft's schedule."
    fix: Upgrade the account to general-purpose v2 (an in-place change; review the access tier and transaction pricing first).
    refs: [NIST-800-53:SA-22]
    deadline: 2026-10-13
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.storage/storageaccounts' | project id, name, kind, location, subscriptionId, resourceGroup, sku = tostring(sku.name), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: kind, op: eq, value: Storage }
    evidence: "{name} (subscription {subscriptionId}): kind {kind} (general-purpose v1)"

  # ==== Storage accounts: blob and file service settings (for_each over Resource Graph) ========

  - id: AZ-STORAGE-BLOB-SOFT-DELETE-OFF
    title: Blob soft delete is off
    kind: missing
    lens: both
    category: BCK
    severity: medium
    entity: storage-account
    refresh: 7d
    why: "Without blob soft delete, a deleted or overwritten blob - by a mistake, a script or ransomware - is gone at once with no way back."
    fix: Enable blob soft delete with a retention of at least 7 days (14 or more for important data).
    refs: [MCSB:BR-2, NIST-800-53:CP-9]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Storage/storageAccounts/{name}/blobServices/default
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.storage/storageaccounts' and kind !~ 'FileStorage' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2023-05-01" }
      paging: none
      missing: empty
      key: parent.id
      name: parent.name
    each:
      any:
        - { field: properties.deleteRetentionPolicy.enabled, op: absent }
        - { field: properties.deleteRetentionPolicy.enabled, op: eq, value: false }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): blob soft delete off"

  - id: AZ-STORAGE-BLOB-SOFT-DELETE-SHORT
    title: Blob soft delete keeps deleted data for under 7 days
    kind: misconfigured
    lens: both
    category: BCK
    severity: low
    entity: storage-account
    refresh: 7d
    why: "A deletion noticed after a long weekend is already past a 1-3 day soft-delete window."
    fix: Raise the blob soft-delete retention to at least 7 days.
    refs: [MCSB:BR-2, NIST-800-53:CP-9]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Storage/storageAccounts/{name}/blobServices/default
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.storage/storageaccounts' and kind !~ 'FileStorage' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2023-05-01" }
      paging: none
      missing: empty
      key: parent.id
      name: parent.name
    each:
      all:
        - { field: properties.deleteRetentionPolicy.enabled, op: eq, value: true }
        - { field: properties.deleteRetentionPolicy.days, op: lt, value: 7, threshold: azure.blob-soft-delete-days }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): blob soft delete {properties.deleteRetentionPolicy.days} days"

  - id: AZ-STORAGE-CONTAINER-SOFT-DELETE-OFF
    title: Container soft delete is off
    kind: missing
    lens: both
    category: BCK
    severity: medium
    entity: storage-account
    refresh: 7d
    why: "Blob soft delete does not bring back a deleted container; without container soft delete, deleting a container removes all its blobs for good."
    fix: Enable container soft delete with a retention of at least 7 days.
    refs: [MCSB:BR-2, NIST-800-53:CP-9]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Storage/storageAccounts/{name}/blobServices/default
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.storage/storageaccounts' and kind !~ 'FileStorage' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2023-05-01" }
      paging: none
      missing: empty
      key: parent.id
      name: parent.name
    each:
      any:
        - { field: properties.containerDeleteRetentionPolicy.enabled, op: absent }
        - { field: properties.containerDeleteRetentionPolicy.enabled, op: eq, value: false }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): container soft delete off"

  - id: AZ-STORAGE-BLOB-VERSIONING-OFF
    title: Blob versioning is off
    kind: missing
    lens: both
    category: BCK
    severity: low
    entity: storage-account
    refresh: 7d
    why: "Soft delete protects against deletion but an overwrite (ransomware encrypting in place) needs versioning to restore the previous content. Accounts with a hierarchical namespace cannot use versioning and are left out."
    fix: Enable blob versioning, with a lifecycle rule that deletes old versions after the retention the data needs.
    refs: [MCSB:BR-2, NIST-800-53:CP-9]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Storage/storageAccounts/{name}/blobServices/default
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.storage/storageaccounts' and kind !~ 'FileStorage' and coalesce(tobool(properties.isHnsEnabled), false) == false | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2023-05-01" }
      paging: none
      missing: empty
      key: parent.id
      name: parent.name
    each:
      any:
        - { field: properties.isVersioningEnabled, op: absent }
        - { field: properties.isVersioningEnabled, op: eq, value: false }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): blob versioning off"

  - id: AZ-STORAGE-FILE-SOFT-DELETE-OFF
    title: File share soft delete is off
    kind: missing
    lens: both
    category: BCK
    severity: medium
    entity: storage-account
    refresh: 7d
    why: "Without share soft delete, deleting an Azure Files share (by mistake or by an attacker) destroys it and its snapshots immediately."
    fix: Enable soft delete for file shares with a retention of at least 7 days.
    refs: [MCSB:BR-2, NIST-800-53:CP-9]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Storage/storageAccounts/{name}/fileServices/default
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.storage/storageaccounts' and kind in~ ('StorageV2','Storage','FileStorage') | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2023-05-01" }
      paging: none
      missing: empty
      key: parent.id
      name: parent.name
    each:
      any:
        - { field: properties.shareDeleteRetentionPolicy.enabled, op: absent }
        - { field: properties.shareDeleteRetentionPolicy.enabled, op: eq, value: false }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): file share soft delete off"

  - id: AZ-STORAGE-CONTAINER-PUBLIC
    title: Blob container is readable anonymously
    kind: misconfigured
    lens: security
    category: CFG
    severity: high
    entity: blob-container
    why: "A container with public access level Blob or Container serves its blobs (and, for Container, the list of them) to anyone on the internet without a credential. Only accounts that still allow anonymous access are read."
    fix: Set the container's public access level to private; publish content that must be public through a CDN or signed URLs, then disallow anonymous access on the account.
    refs: [MCSB:DP-2, MCSB:NS-2, NIST-800-53:AC-3, MITRE-ATTACK:T1530]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Storage/storageAccounts/{name}/blobServices/default/containers
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.storage/storageaccounts' and kind !~ 'FileStorage' and coalesce(tobool(properties.allowBlobPublicAccess), true) | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2023-05-01" }
      missing: empty
      key: id
      name: name
    each: { field: properties.publicAccess, op: in, value: [Blob, Container] }
    evidence: "container {name} in {parent.name} (subscription {parent.subscriptionId}): public access {properties.publicAccess}"

  - id: AZ-STORAGE-FILE-SMB-LEGACY-VERSIONS
    title: File service accepts SMB versions older than 3.1.1
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: storage-account
    refresh: 7d
    why: "With no SMB version list set, the file service accepts SMB 2.1 and 3.0, which lack the pre-authentication integrity and stronger encryption of 3.1.1. Accounts that hold no file shares can take an override."
    fix: Set the file service's SMB versions to SMB3.1.1 (with AES-256-GCM channel encryption and Kerberos authentication) once clients are confirmed to support it.
    refs: [MCSB:DP-3, NIST-800-53:SC-8]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Storage/storageAccounts/{name}/fileServices/default
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.storage/storageaccounts' and kind in~ ('StorageV2','Storage','FileStorage') | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2023-05-01" }
      paging: none
      missing: empty
      key: parent.id
      name: parent.name
    each:
      any:
        - { field: properties.protocolSettings.smb.versions, op: empty }
        - { field: properties.protocolSettings.smb.versions, op: match, value: 'SMB2\.1|SMB3\.0' }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): SMB versions '{properties.protocolSettings.smb.versions}'"

  # ==== Key vaults (Resource Graph; key and secret metadata through ARM, never values) ==========

  - id: AZ-KEYVAULT-SOFT-DELETE-OFF
    title: Key vault has soft delete off
    kind: misconfigured
    lens: security
    category: BCK
    severity: high
    entity: key-vault
    why: "A vault created before soft delete became mandatory, and never updated, loses deleted keys and secrets immediately - and with them every piece of data encrypted by those keys."
    fix: Enable soft delete on the vault (and then purge protection).
    refs: [MCSB:DP-8, NIST-800-53:CP-9, NIST-800-53:SC-12]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.keyvault/vaults' | project id, name, location, subscriptionId, resourceGroup, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: properties.enableSoftDelete, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): soft delete off"

  - id: AZ-KEYVAULT-KEY-NO-EXPIRY
    title: Key vault key has no expiration date
    kind: missing
    lens: security
    category: PKI
    severity: medium
    entity: vault-key
    refresh: 7d
    why: "A key with no expiry is never forced through rotation; the longer one key protects data, the more data an exposure of that key opens."
    fix: Set an expiration date on the key and a rotation policy that creates a new version before it.
    refs: [MCSB:DP-6, NIST-800-53:SC-12]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.KeyVault/vaults/{name}/keys
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.keyvault/vaults' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2023-07-01" }
      key: id
      name: name
    each:
      all:
        - { field: properties.attributes.enabled, op: eq, value: true }
        - { field: properties.attributes.exp, op: absent }
    evidence: "key {name} in vault {parent.name} (subscription {parent.subscriptionId}): no expiration date"

  - id: AZ-KEYVAULT-KEY-EXPIRING
    title: Key vault key expires soon or has expired
    kind: broken
    lens: both
    category: PKI
    severity:
      daysLeft: properties.attributes.exp
      ranges: [ { max: 0, value: high }, { max: 7, value: high }, { max: 30, value: medium } ]
      default: low
    entity: vault-key
    deadline: properties.attributes.exp
    why: "An expired key can no longer encrypt or wrap; disk encryption sets, storage and database CMKs that point at it start failing when it lapses."
    fix: Rotate the key (create a new version) and confirm every dependent resource uses the new version; add a rotation policy so it happens automatically.
    refs: [MCSB:DP-6, NIST-800-53:SC-12]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.KeyVault/vaults/{name}/keys
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.keyvault/vaults' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2023-07-01" }
      key: id
      name: name
    each:
      all:
        - { field: properties.attributes.enabled, op: eq, value: true }
        - { field: properties.attributes.exp, op: until-lt, value: 30, threshold: azure.key-notice-days }
    evidence: "key {name} in vault {parent.name} (subscription {parent.subscriptionId}): expires {properties.attributes.exp}"

  - id: AZ-KEYVAULT-SECRET-NO-EXPIRY
    title: Key vault secret has no expiration date
    kind: missing
    lens: security
    category: PKI
    severity: medium
    entity: vault-secret
    refresh: 7d
    why: "A secret with no expiry (a password, a connection string, a client secret) is never forced through rotation, so one leak stays useful indefinitely."
    fix: Set an expiration date on the secret and rotate it before then; prefer managed identities over stored secrets.
    refs: [MCSB:IM-8, MCSB:DP-6, NIST-800-53:IA-5]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.KeyVault/vaults/{name}/secrets
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.keyvault/vaults' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2023-07-01" }
      key: id
      name: name
    each:
      all:
        - { field: properties.attributes.enabled, op: eq, value: true }
        - { field: properties.attributes.exp, op: absent }
    evidence: "secret {name} in vault {parent.name} (subscription {parent.subscriptionId}): no expiration date"

  - id: AZ-KEYVAULT-SECRET-EXPIRING
    title: Key vault secret expires soon or has expired
    kind: broken
    lens: both
    category: PKI
    severity:
      daysLeft: properties.attributes.exp
      ranges: [ { max: 0, value: high }, { max: 7, value: high }, { max: 30, value: medium } ]
      default: low
    entity: vault-secret
    deadline: properties.attributes.exp
    why: "An application that reads an expired secret fails to authenticate to whatever the secret unlocks; the expiry date is the warning that it is about to happen."
    fix: Rotate the secret at its source, store the new version, and confirm the consumers pick it up; disable the old version.
    refs: [MCSB:IM-8, NIST-800-53:IA-5]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.KeyVault/vaults/{name}/secrets
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.keyvault/vaults' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2023-07-01" }
      key: id
      name: name
    each:
      all:
        - { field: properties.attributes.enabled, op: eq, value: true }
        - { field: properties.attributes.exp, op: until-lt, value: 30, threshold: azure.secret-notice-days }
    evidence: "secret {name} in vault {parent.name} (subscription {parent.subscriptionId}): expires {properties.attributes.exp}"

  # ==== Virtual machines (Resource Graph, one shared query) ====================================

  - id: AZ-VM-ENCRYPTION-AT-HOST-OFF
    title: VM does not use encryption at host
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: vm
    refresh: 7d
    why: "Managed disks are encrypted at rest, but the temporary disk and the disk caches on the host are not unless encryption at host is on; data written there sits unencrypted on shared hardware."
    fix: Register the EncryptionAtHost feature and enable it on the VM (it needs a deallocation).
    refs: [MCSB:DP-4, NIST-800-53:SC-28]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines' | project id, name, location, subscriptionId, resourceGroup, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: properties.securityProfile.encryptionAtHost, op: absent }
        - { field: properties.securityProfile.encryptionAtHost, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): encryption at host off"

  - id: AZ-VM-TRUSTED-LAUNCH-OFF
    title: VM is not a Trusted Launch or confidential VM
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: vm
    refresh: 7d
    why: "Standard-security VMs have no secure boot, no virtual TPM and no boot-integrity monitoring, so bootkits and rootkits that load before the OS go undetected."
    fix: Use Trusted Launch for new VMs and upgrade existing Gen2 VMs in place (Gen1 VMs need a rebuild).
    refs: [MCSB:PV-3, NIST-800-53:SI-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines' | project id, name, location, subscriptionId, resourceGroup, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: properties.securityProfile.securityType, op: absent }
        - { field: properties.securityProfile.securityType, op: notin, value: [TrustedLaunch, ConfidentialVM] }
    evidence: "{name} (subscription {subscriptionId}): security type {properties.securityProfile.securityType}"

  - id: AZ-VM-SECURE-BOOT-OFF
    title: Trusted Launch VM has secure boot off
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: vm
    refresh: 7d
    why: "Trusted Launch without secure boot lets unsigned boot loaders and drivers run, which is the protection Trusted Launch is chosen for."
    fix: Enable secure boot on the VM (check first that any custom kernel modules are signed).
    refs: [MCSB:PV-3, NIST-800-53:SI-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines' | project id, name, location, subscriptionId, resourceGroup, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - { field: properties.securityProfile.securityType, op: eq, value: TrustedLaunch }
        - any:
            - { field: properties.securityProfile.uefiSettings.secureBootEnabled, op: absent }
            - { field: properties.securityProfile.uefiSettings.secureBootEnabled, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): Trusted Launch with secure boot off"

  - id: AZ-VM-VTPM-OFF
    title: Trusted Launch VM has the virtual TPM off
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: vm
    refresh: 7d
    why: "Without the vTPM there is no measured boot or boot-integrity attestation, and BitLocker or credential protection features that need a TPM cannot use it."
    fix: Enable the vTPM on the VM.
    refs: [MCSB:PV-3, NIST-800-53:SI-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines' | project id, name, location, subscriptionId, resourceGroup, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - { field: properties.securityProfile.securityType, op: eq, value: TrustedLaunch }
        - any:
            - { field: properties.securityProfile.uefiSettings.vTpmEnabled, op: absent }
            - { field: properties.securityProfile.uefiSettings.vTpmEnabled, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): Trusted Launch with vTPM off"

  - id: AZ-VM-LINUX-PASSWORD-AUTH
    title: Linux VM allows SSH password authentication
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: vm
    why: "Password logins over SSH can be brute-forced and sprayed; key-based or Entra ID login removes the guessable secret."
    fix: Deploy Linux VMs with password authentication disabled and SSH keys or Entra ID login; for existing VMs, disable PasswordAuthentication in sshd.
    refs: [MCSB:IM-6, NIST-800-53:IA-2, NIST-800-53:IA-5]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines' | project id, name, location, subscriptionId, resourceGroup, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: properties.osProfile.linuxConfiguration.disablePasswordAuthentication, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): SSH password authentication allowed at deployment"

  - id: AZ-VM-PATCH-ASSESSMENT-OFF
    title: VM is not periodically assessed for missing updates
    kind: misconfigured
    lens: both
    category: LCM
    severity: low
    entity: vm
    refresh: 7d
    why: "Without periodic assessment, Azure Update Manager only knows a VM's missing patches when someone checks by hand, so unpatched machines stay invisible in compliance reports."
    fix: Set the VM's patch assessment mode to AutomaticByPlatform (the built-in policy can do this at scale).
    refs: [MCSB:PV-6, NIST-800-53:SI-2]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines' | extend osType = tostring(properties.storageProfile.osDisk.osType) | extend assessmentMode = iff(osType =~ 'Windows', tostring(properties.osProfile.windowsConfiguration.patchSettings.assessmentMode), tostring(properties.osProfile.linuxConfiguration.patchSettings.assessmentMode)), patchMode = iff(osType =~ 'Windows', tostring(properties.osProfile.windowsConfiguration.patchSettings.patchMode), tostring(properties.osProfile.linuxConfiguration.patchSettings.patchMode)) | project id, name, subscriptionId, resourceGroup, osType, assessmentMode, patchMode"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: assessmentMode, op: ne, value: AutomaticByPlatform }
    evidence: "{name} ({osType}, subscription {subscriptionId}): assessment mode '{assessmentMode}', patch mode '{patchMode}'"

  - id: AZ-VM-OS-END-OF-SUPPORT
    title: VM runs an operating system past end of support
    kind: misconfigured
    lens: both
    category: LCM
    severity: high
    entity: vm
    refresh: 7d
    why: "Windows Server 2008/2012 (extended security updates for 2012 ended 2026-10-13), CentOS, Ubuntu 20.04 and older, Debian 10 and older and RHEL 7 get no security fixes, so every new vulnerability stays open. The OS comes from the guest agent's report or the marketplace image, so a VM with neither is not judged."
    fix: Upgrade or rebuild the VM on a supported release, or buy extended support where it exists and record it.
    refs: [MCSB:PV-6, NIST-800-53:SA-22, NIST-800-53:SI-2]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines' | extend osName = tostring(properties.extended.instanceView.osName), osVersion = tostring(properties.extended.instanceView.osVersion), offer = tostring(properties.storageProfile.imageReference.offer), sku = tostring(properties.storageProfile.imageReference.sku) | project id, name, subscriptionId, resourceGroup, os = strcat(osName, ' ', osVersion), image = strcat(offer, ' ', sku)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: os, op: match, value: '^(Windows Server 20(08|12)|centos|ubuntu (1[0-9]|20)\.04|debian (8|9|10)(\.| |$)|(redhat|rhel) 7\.)' }
        - { field: image, op: match, value: '(2008-R2|2012-R2|2012-Datacenter|^CentOS|^UbuntuServer 1[0-9]\.04|focal|bionic|xenial|^debian-(8|9|10) |^RHEL 7)' }
    evidence: "{name} (subscription {subscriptionId}): OS '{os}', image '{image}'"

  - id: AZ-VM-PUBLIC-IP
    title: VM has a public IP address on its network interface
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: vm
    why: "A public IP on the VM itself puts every port its NSG lets through on the internet, bypassing the central firewall, WAF and logging that published services normally sit behind."
    fix: Remove the public IP and publish the service through a load balancer, Application Gateway or Front Door; reach the VM for administration through Bastion or a VPN.
    refs: [MCSB:NS-1, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/networkinterfaces' and isnotempty(tostring(properties.virtualMachine.id)) | mv-expand ipc = properties.ipConfigurations | where isnotempty(tostring(ipc.properties.publicIPAddress.id)) | project vmId = tostring(properties.virtualMachine.id), nic = name, subscriptionId, resourceGroup, publicIp = tostring(split(tostring(ipc.properties.publicIPAddress.id), '/')[8]) | extend vmName = tostring(split(vmId, '/')[8])"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: "{vmId}|{nic}"
      name: vmName
    each: any
    evidence: "VM {vmName} (subscription {subscriptionId}): NIC {nic} has public IP {publicIp}"

  - id: AZ-VM-NO-BACKUP
    title: VM is not protected by Azure Backup
    kind: missing
    lens: both
    category: BCK
    severity: medium
    entity: vm
    refresh: 7d
    why: "A VM with no backup item in any Recovery Services vault cannot be restored after deletion, corruption or ransomware. VMs backed up by another product (Veeam, Rubrik) show here too and can take an override."
    fix: Add the VM to a backup policy in a Recovery Services vault, or record which other product protects it.
    refs: [MCSB:BR-1, NIST-800-53:CP-9]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines' | project id, name, subscriptionId, resourceGroup, vmKey = tolower(id) | join kind=leftouter (RecoveryServicesResources | where type =~ 'microsoft.recoveryservices/vaults/backupfabrics/protectioncontainers/protecteditems' and tostring(properties.sourceResourceId) contains '/virtualMachines/' | project vmKey = tolower(tostring(properties.sourceResourceId)), item = id) on vmKey | summarize backups = countif(isnotempty(item)) by id, name, subscriptionId, resourceGroup"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: backups, op: lt, value: 1 }
    evidence: "{name} (subscription {subscriptionId}): no Azure Backup protected item"

  - id: AZ-VM-NO-AZURE-MONITOR-AGENT
    title: VM has no Azure Monitor Agent
    kind: missing
    lens: both
    category: MON
    severity: low
    entity: vm
    refresh: 7d
    why: "Without the Azure Monitor Agent the VM sends no performance data, event logs or syslog to Log Analytics, so neither the operations team nor the SIEM sees it."
    fix: Install the Azure Monitor Agent (by policy at scale) and associate the VM with the standard data collection rules.
    refs: [MCSB:LT-3, NIST-800-53:AU-12, NIST-800-53:SI-4]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines' | project id, name, subscriptionId, resourceGroup, vmKey = tolower(id), osType = tostring(properties.storageProfile.osDisk.osType) | join kind=leftouter (Resources | where type =~ 'microsoft.compute/virtualmachines/extensions' and tostring(properties.type) in~ ('AzureMonitorWindowsAgent','AzureMonitorLinuxAgent') | extend vmKey = tolower(tostring(split(id, '/extensions/')[0])) | project vmKey, ext = name) on vmKey | summarize agents = countif(isnotempty(ext)) by id, name, subscriptionId, resourceGroup, osType"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: agents, op: lt, value: 1 }
    evidence: "{name} ({osType}, subscription {subscriptionId}): no Azure Monitor Agent extension"

  - id: AZ-VM-LEGACY-LOG-ANALYTICS-AGENT
    title: VM still has the retired Log Analytics (MMA/OMS) agent
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: medium
    entity: vm-extension
    refresh: 7d
    why: "The Log Analytics agent retired on 2024-08-31; it gets no fixes, and data collection that still depends on it can stop without warning."
    fix: Move the VM's data collection to the Azure Monitor Agent with data collection rules, then remove the legacy extension.
    refs: [NIST-800-53:SA-22]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines/extensions' | project id, name, subscriptionId, resourceGroup, vm = tostring(split(id, '/')[8]), extType = tostring(properties.type), state = tostring(properties.provisioningState)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: extType, op: in, value: [MicrosoftMonitoringAgent, OmsAgentForLinux] }
    evidence: "VM {vm} (subscription {subscriptionId}): legacy agent extension {extType}"

  - id: AZ-VM-EXTENSION-FAILED
    title: VM extension is in a failed state
    kind: broken
    lens: maintenance
    category: HLT
    severity: low
    entity: vm-extension
    why: "A failed extension is usually a security or monitoring agent (EDR, Azure Monitor, guest configuration) that is not doing its job on that VM, while the VM looks covered in inventory."
    fix: Check the extension's status message, fix the cause (agent, network, disk space) and reinstall the extension.
    refs: [MCSB:ES-1, NIST-800-53:SI-4]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines/extensions' | project id, name, subscriptionId, resourceGroup, vm = tostring(split(id, '/')[8]), extType = tostring(properties.type), state = tostring(properties.provisioningState)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: state, op: eq, value: Failed }
    evidence: "VM {vm} (subscription {subscriptionId}): extension {name} ({extType}) {state}"

  - id: AZ-DISK-EXPORT-FROM-ANY-NETWORK
    title: Managed disk can be exported from any network
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: disk
    refresh: 7d
    why: "With network access policy AllowAll, anyone who obtains an export SAS for the disk can download its full contents from the internet."
    fix: Set the disk's network access policy to DenyAll (or AllowPrivate through a disk access resource) and public network access to Disabled.
    refs: [MCSB:NS-2, MCSB:DP-2, NIST-800-53:AC-3]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/disks' | project id, name, subscriptionId, resourceGroup, diskState = tostring(properties.diskState), networkAccessPolicy = tostring(properties.networkAccessPolicy), publicNetworkAccess = tostring(properties.publicNetworkAccess)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - { field: networkAccessPolicy, op: eq, value: AllowAll }
        - { field: publicNetworkAccess, op: ne, value: Disabled }
    evidence: "{name} (subscription {subscriptionId}, {diskState}): network access {networkAccessPolicy}, public network '{publicNetworkAccess}'"

  - id: AZ-VMSS-AUTO-OS-UPGRADE-OFF
    title: Scale set has automatic OS image upgrade off
    kind: misconfigured
    lens: both
    category: LCM
    severity: low
    entity: vm-scale-set
    refresh: 7d
    why: "A uniform scale set without automatic OS image upgrades keeps running the image it was built from, falling further behind on patches with every month."
    fix: Enable automatic OS image upgrade with an application health probe or extension, or rebuild the image on a patch cadence and record it.
    refs: [MCSB:PV-6, NIST-800-53:SI-2]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachinescalesets' | project id, name, subscriptionId, resourceGroup, orchestration = tostring(properties.orchestrationMode), upgradeMode = tostring(properties.upgradePolicy.mode), autoOsUpgrade = properties.upgradePolicy.automaticOSUpgradePolicy.enableAutomaticOSUpgrade"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - { field: orchestration, op: ne, value: Flexible }
        - any:
            - { field: autoOsUpgrade, op: absent }
            - { field: autoOsUpgrade, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): upgrade mode {upgradeMode}, automatic OS upgrade off"

  - id: AZ-ARC-MACHINE-DISCONNECTED
    title: Arc-enabled server is disconnected or expired
    kind: broken
    lens: both
    category: HLT
    severity: medium
    entity: arc-machine
    refresh: 1d
    why: "A disconnected Arc machine stops receiving policy, Defender, update and monitoring extensions; after 45 days it expires and must be onboarded again, while it still counts as managed in inventory."
    fix: Check the connected machine agent and its outbound access on the server; re-onboard an expired machine or delete the resource if the server is gone.
    refs: [MCSB:AM-3, NIST-800-53:CM-8]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.hybridcompute/machines' | project id, name, subscriptionId, resourceGroup, status = tostring(properties.status), lastStatusChange = tostring(properties.lastStatusChange), agentVersion = tostring(properties.agentVersion), osName = tostring(properties.osName)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: status, op: in, value: [Disconnected, Expired] }
    evidence: "{name} ({osName}, subscription {subscriptionId}): {status} since {lastStatusChange}, agent {agentVersion}"

  # ==== Azure SQL: servers (Resource Graph), auditing, firewall and TDE (ARM per server) ========

  - id: AZ-SQL-NO-ENTRA-ADMIN
    title: Azure SQL server has no Microsoft Entra administrator
    kind: missing
    lens: security
    category: IAM
    severity: medium
    entity: sql-server
    why: "Without an Entra administrator, only SQL logins can manage the server: no MFA, no Conditional Access and no central offboarding for the people who hold them."
    fix: Set an Entra group as the server's administrator and move administration and applications to Entra identities.
    refs: [MCSB:IM-1, NIST-800-53:IA-2, NIST-800-53:AC-2]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.sql/servers' | project id, name, location, subscriptionId, resourceGroup, kind, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: properties.administrators.administratorType, op: absent }
        - { field: properties.administrators.administratorType, op: ne, value: ActiveDirectory }
    evidence: "{name} (subscription {subscriptionId}): no Entra administrator"

  - id: AZ-SQL-ENTRA-ONLY-AUTH-OFF
    title: Azure SQL server still accepts SQL authentication
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: sql-server
    why: "While SQL authentication is allowed, the server admin login and any SQL logins are passwords that bypass MFA and Conditional Access and can be sprayed from wherever the firewall allows."
    fix: Move applications to managed identities or Entra principals, then turn on Microsoft Entra-only authentication.
    refs: [MCSB:IM-1, NIST-800-53:IA-2]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.sql/servers' | project id, name, location, subscriptionId, resourceGroup, kind, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: properties.administrators.azureADOnlyAuthentication, op: absent }
        - { field: properties.administrators.azureADOnlyAuthentication, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): Entra-only authentication off"

  - id: AZ-SQL-AUDITING-OFF
    title: Azure SQL server auditing is off
    kind: missing
    lens: security
    category: LOG
    severity: medium
    entity: sql-server
    refresh: 7d
    why: "Without server auditing there is no record of logins, permission changes or queries against the databases, so misuse of data cannot be shown or ruled out."
    fix: Enable server-level auditing to the central Log Analytics workspace (and storage if long retention is required).
    refs: [MCSB:LT-3, NIST-800-53:AU-2, NIST-800-53:AU-12]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Sql/servers/{name}/auditingSettings/default
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.sql/servers' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2021-11-01" }
      paging: none
      key: parent.id
      name: parent.name
    each: { field: properties.state, op: eq, value: Disabled }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): auditing {properties.state}"

  - id: AZ-SQL-AUDIT-RETENTION-SHORT
    title: Azure SQL audit logs in storage are kept under 90 days
    kind: misconfigured
    lens: security
    category: LOG
    severity: low
    entity: sql-server
    refresh: 7d
    why: "Audit records deleted after a few weeks are gone before most data breaches are discovered."
    fix: Set the storage audit retention to at least 90 days (0 keeps them indefinitely), or rely on a workspace destination with that retention.
    refs: [MCSB:LT-6, NIST-800-53:AU-11]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Sql/servers/{name}/auditingSettings/default
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.sql/servers' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2021-11-01" }
      paging: none
      key: parent.id
      name: parent.name
    each:
      all:
        - { field: properties.state, op: eq, value: Enabled }
        - { field: properties.storageEndpoint, op: notempty }
        - { field: properties.retentionDays, op: gt, value: 0 }
        - { field: properties.retentionDays, op: lt, value: 90, threshold: azure.sql-audit-retention-days }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): storage audit retention {properties.retentionDays} days"

  - id: AZ-SQL-FIREWALL-OPEN-TO-INTERNET
    title: Azure SQL firewall rule allows the whole internet
    kind: misconfigured
    lens: security
    category: CFG
    severity: critical
    entity: sql-firewall-rule
    why: "A rule starting at 0.0.0.0 and ending above it lets any address on the internet reach the server's login prompt; the database is then one weak or leaked password away."
    fix: Delete the rule; allow only the named ranges that need access, or move clients to a private endpoint and disable public access.
    refs: [MCSB:NS-2, NIST-800-53:SC-7, MITRE-ATTACK:T1190]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Sql/servers/{name}/firewallRules
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.sql/servers' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2021-11-01" }
      key: id
      name: name
    each:
      all:
        - { field: properties.startIpAddress, op: eq, value: 0.0.0.0 }
        - { field: properties.endIpAddress, op: ne, value: 0.0.0.0 }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): rule {name} allows {properties.startIpAddress}-{properties.endIpAddress}"

  - id: AZ-SQL-FIREWALL-ALLOWS-AZURE-SERVICES
    title: Azure SQL server allows access from all Azure services
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: sql-firewall-rule
    why: "The 0.0.0.0 rule admits connections from any Azure address, including other customers' VMs and functions, not only this organisation's services."
    fix: Remove the AllowAllWindowsAzureIps rule and give the services that need access a private endpoint, VNet rule or named address.
    refs: [MCSB:NS-2, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Sql/servers/{name}/firewallRules
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.sql/servers' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2021-11-01" }
      key: id
      name: name
    each:
      all:
        - { field: properties.startIpAddress, op: eq, value: 0.0.0.0 }
        - { field: properties.endIpAddress, op: eq, value: 0.0.0.0 }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): rule {name} admits all Azure services"

  - id: AZ-SQL-DB-TDE-OFF
    title: Azure SQL database has transparent data encryption off
    kind: misconfigured
    lens: security
    category: CFG
    severity: high
    entity: sql-database
    refresh: 7d
    why: "With TDE off, the database files, backups and logs are stored unencrypted; anyone who obtains a copy reads the data."
    fix: Turn TDE on for the database (it is on by default for new databases; this is usually an old or migrated one).
    refs: [MCSB:DP-4, NIST-800-53:SC-28]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Sql/servers/{server}/databases/{name}/transparentDataEncryption/current
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.sql/servers/databases' and name !~ 'master' | project id, name, subscriptionId, resourceGroup, server = tostring(split(id, '/')[8])" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2021-11-01" }
      paging: none
      missing: empty
      key: parent.id
      name: parent.name
    each: { field: properties.state, op: eq, value: Disabled }
    evidence: "database {parent.name} on {parent.server} (subscription {parent.subscriptionId}): TDE {properties.state}"

  - id: AZ-SQL-DB-BACKUP-LOCAL-ONLY
    title: Azure SQL database backups are stored in one region only
    kind: misconfigured
    lens: maintenance
    category: BCK
    severity: low
    entity: sql-database
    refresh: 7d
    why: "With locally redundant backup storage, a regional outage takes the database and every restore point with it; geo-restore is not available."
    fix: Set the database's backup storage redundancy to Geo or GeoZone where the data must survive a regional disaster, or record why it need not.
    refs: [MCSB:BR-1, NIST-800-53:CP-9, NIST-800-53:CP-6]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.sql/servers/databases' and name !~ 'master' | project id, name, subscriptionId, resourceGroup, server = tostring(split(id, '/')[8]), redundancy = tostring(properties.currentBackupStorageRedundancy), requested = tostring(properties.requestedBackupStorageRedundancy)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: redundancy, op: eq, value: Local }
        - { field: requested, op: eq, value: Local }
    evidence: "database {name} on {server} (subscription {subscriptionId}): backup redundancy {redundancy}"

