  # ==== API Management (Resource Graph) ========================================================

  - id: AZ-APIM-LEGACY-PROTOCOLS
    title: API Management allows TLS 1.0/1.1, SSL 3.0 or 3DES
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: api-management
    why: "Gateway or backend settings that re-enable old protocols or the 3DES cipher let API traffic and keys be negotiated down to broken cryptography."
    fix: Turn off TLS 1.0, TLS 1.1, SSL 3.0 and TripleDes168 in the service's protocol and cipher settings (client and backend side).
    refs: [MCSB:DP-3, NIST-800-53:SC-8, NIST-800-53:SC-13]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.apimanagement/service' | extend cp = properties.customProperties | project id, name, subscriptionId, resourceGroup, sku = tostring(sku.name), platformVersion = tostring(properties.platformVersion), tls10 = tostring(cp['Microsoft.WindowsAzure.ApiManagement.Gateway.Security.Protocols.Tls10']), tls11 = tostring(cp['Microsoft.WindowsAzure.ApiManagement.Gateway.Security.Protocols.Tls11']), ssl30 = tostring(cp['Microsoft.WindowsAzure.ApiManagement.Gateway.Security.Protocols.Ssl30']), backendTls10 = tostring(cp['Microsoft.WindowsAzure.ApiManagement.Gateway.Security.Backend.Protocols.Tls10']), backendTls11 = tostring(cp['Microsoft.WindowsAzure.ApiManagement.Gateway.Security.Backend.Protocols.Tls11']), backendSsl30 = tostring(cp['Microsoft.WindowsAzure.ApiManagement.Gateway.Security.Backend.Protocols.Ssl30']), tripleDes = tostring(cp['Microsoft.WindowsAzure.ApiManagement.Gateway.Security.Ciphers.TripleDes168'])"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: tls10, op: eq, value: "true" }
        - { field: tls11, op: eq, value: "true" }
        - { field: ssl30, op: eq, value: "true" }
        - { field: backendTls10, op: eq, value: "true" }
        - { field: backendTls11, op: eq, value: "true" }
        - { field: backendSsl30, op: eq, value: "true" }
        - { field: tripleDes, op: eq, value: "true" }
    evidence: "{name} (subscription {subscriptionId}): TLS1.0 {tls10}, TLS1.1 {tls11}, SSL3 {ssl30}, backend TLS1.0 {backendTls10}, backend TLS1.1 {backendTls11}, 3DES {tripleDes}"

