    evidence: "{name} (subscription {subscriptionId}): Kubernetes RBAC off"

  - id: AZ-AKS-LOCAL-ACCOUNTS-ENABLED
    title: AKS cluster keeps its local admin account
    kind: misconfigured
    lens: security
    category: AUT
    severity: medium
    entity: aks-cluster
    why: "The local cluster-admin credential (listClusterAdminCredential) is a static certificate that bypasses Entra ID, MFA and Kubernetes RBAC, and anyone with the right Azure permission can download it."
    fix: Integrate the cluster with Entra ID and disable local accounts.
    refs: [MCSB:IM-1, NIST-800-53:IA-2, NIST-800-53:AC-6]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerservice/managedclusters' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: properties.disableLocalAccounts, op: absent }
        - { field: properties.disableLocalAccounts, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): local accounts enabled"

  - id: AZ-AKS-API-SERVER-OPEN
    title: AKS API server is reachable from the whole internet
    kind: misconfigured
    lens: security
    category: CFG
    severity: high
    entity: aks-cluster
    why: "A public API server with no authorised IP ranges accepts connections from anywhere, so a leaked kubeconfig or token, or an API server vulnerability, is exploitable from the internet."
    fix: Make the cluster private (or use API server VNet integration), or set authorised IP ranges to the admin and pipeline networks.
    refs: [MCSB:NS-2, NIST-800-53:SC-7, NIST-800-53:AC-17]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerservice/managedclusters' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - any:
            - { field: properties.apiServerAccessProfile.enablePrivateCluster, op: absent }
            - { field: properties.apiServerAccessProfile.enablePrivateCluster, op: eq, value: false }
        - { field: properties.apiServerAccessProfile.authorizedIPRanges, op: empty }
    evidence: "{name} (subscription {subscriptionId}): public API server with no authorised IP ranges"

  - id: AZ-AKS-NO-NETWORK-POLICY
    title: AKS cluster has no network policy engine
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: aks-cluster
    why: "Without a network policy engine every pod can talk to every other pod; one compromised container reaches every service and datastore in the cluster."
    fix: Enable a network policy engine (Azure, Calico or Cilium) and apply default-deny policies per namespace.
    refs: [MCSB:NS-1, NIST-800-53:SC-7, NIST-800-53:AC-4]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerservice/managedclusters' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: properties.networkProfile.networkPolicy, op: absent }
        - { field: properties.networkProfile.networkPolicy, op: eq, value: none }
    evidence: "{name} (subscription {subscriptionId}): network policy '{properties.networkProfile.networkPolicy}'"

  - id: AZ-AKS-NO-ENTRA-INTEGRATION
    title: AKS cluster is not integrated with Microsoft Entra ID
    kind: missing
    lens: security
    category: AUT
    severity: medium
    entity: aks-cluster
    why: "Without Entra integration, cluster access is by certificates and tokens that do not expire with a person's account and cannot be held to MFA or Conditional Access."
    fix: Enable AKS-managed Entra integration and grant access through Entra groups.
    refs: [MCSB:IM-1, NIST-800-53:IA-2]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerservice/managedclusters' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: properties.aadProfile, op: absent }
    evidence: "{name} (subscription {subscriptionId}): no Entra ID integration"

  - id: AZ-AKS-AZURE-RBAC-OFF
    title: AKS cluster does not use Azure RBAC for Kubernetes authorisation
    kind: misconfigured
    lens: security
    category: IAM
    severity: low
    entity: aks-cluster
    why: "With Entra integration but Kubernetes-only RBAC, cluster permissions live in in-cluster bindings that Azure access reviews and PIM never see."
    fix: Enable Azure RBAC for Kubernetes authorisation and grant cluster roles through Azure role assignments (PIM for admin roles).
    refs: [MCSB:PA-7, NIST-800-53:AC-2, NIST-800-53:AC-6]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerservice/managedclusters' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - { field: properties.aadProfile, op: exists }
        - any:
            - { field: properties.aadProfile.enableAzureRBAC, op: absent }
            - { field: properties.aadProfile.enableAzureRBAC, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): Entra-integrated, Azure RBAC for Kubernetes off"

  - id: AZ-AKS-VERSION-OLD
    title: AKS cluster runs an out-of-support Kubernetes version
    kind: misconfigured
    lens: both
    category: LCM
    severity: medium
    entity: aks-cluster
    refresh: 7d
    why: "AKS supports roughly the three newest minor versions; older clusters get no security patches and are force-upgraded on the platform's schedule. Long-term-support clusters are left out."
    fix: Upgrade the control plane and node pools to a supported minor version (one minor at a time), and set an upgrade channel. Raise threshold azure.aks-min-version as versions age out.
    refs: [MCSB:PV-6, NIST-800-53:SA-22, NIST-800-53:SI-2]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerservice/managedclusters' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - { field: properties.currentKubernetesVersion, op: version-lt, value: "1.33", threshold: azure.aks-min-version }
        - any:
            - { field: properties.supportPlan, op: absent }
            - { field: properties.supportPlan, op: ne, value: AKSLongTermSupport }
    evidence: "{name} (subscription {subscriptionId}): Kubernetes {properties.currentKubernetesVersion}, support plan {properties.supportPlan}"

  - id: AZ-AKS-NO-AUTO-UPGRADE
    title: AKS cluster has no automatic upgrade channel
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: low
    entity: aks-cluster
    refresh: 7d
    why: "Without an upgrade channel, patch versions are applied only when someone remembers, and clusters drift out of support."
    fix: Set the cluster's upgrade channel to patch or stable, with a planned maintenance window.
    refs: [MCSB:PV-6, NIST-800-53:SI-2]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerservice/managedclusters' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: properties.autoUpgradeProfile.upgradeChannel, op: absent }
        - { field: properties.autoUpgradeProfile.upgradeChannel, op: eq, value: none }
    evidence: "{name} (subscription {subscriptionId}): upgrade channel '{properties.autoUpgradeProfile.upgradeChannel}'"

  - id: AZ-AKS-AZURE-POLICY-ADDON-OFF
    title: AKS cluster does not run the Azure Policy add-on
    kind: missing
    lens: security
    category: CFG
    severity: low
    entity: aks-cluster
    why: "Without the add-on, Azure Policy cannot audit or block privileged pods, host mounts or images from untrusted registries inside the cluster."
    fix: Enable the Azure Policy add-on and assign the Kubernetes baseline initiative.
    refs: [MCSB:PV-2, NIST-800-53:CM-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerservice/managedclusters' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: properties.addonProfiles.azurepolicy.enabled, op: absent }
        - { field: properties.addonProfiles.azurepolicy.enabled, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): Azure Policy add-on off"

  - id: AZ-AKS-HTTP-APP-ROUTING-ON
    title: AKS cluster uses the retired HTTP application routing add-on
    kind: misconfigured
    lens: both
    category: LCM
    severity: medium
    entity: aks-cluster
    why: "The HTTP application routing add-on was never meant for production, publishes services on a public DNS zone without TLS, and is retired."
    fix: Move ingress to the application routing add-on (managed NGINX) or another supported ingress controller, then disable the old add-on.
    refs: [NIST-800-53:SA-22, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerservice/managedclusters' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: properties.addonProfiles.httpApplicationRouting.enabled, op: eq, value: true }
    evidence: "{name} (subscription {subscriptionId}): HTTP application routing add-on enabled"

  - id: AZ-AKS-NODE-PUBLIC-IP
    title: AKS node pool gives nodes public IP addresses
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: aks-cluster
    why: "Nodes with their own public IPs are reachable from the internet on whatever their NSG allows, bypassing the cluster's load balancer and egress controls."
    fix: Recreate the node pool without node public IPs and publish services through a load balancer or ingress.
    refs: [MCSB:NS-1, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerservice/managedclusters' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      element:
        of: properties.agentPoolProfiles
        where: { field: enableNodePublicIP, op: eq, value: true }
    evidence: "{name} (subscription {subscriptionId}): a node pool assigns public IPs to nodes"

  # ==== Container registries (Resource Graph) ==================================================

  - id: AZ-ACR-ANONYMOUS-PULL
    title: Container registry allows anonymous pull
    kind: misconfigured
    lens: security
    category: AUT
    severity: high
    entity: container-registry
    why: "With anonymous pull on, anyone who can reach the registry can download every image, along with any credentials, keys or internal code baked into them."
    fix: Disable anonymous pull and give consumers an identity with the AcrPull role.
    refs: [MCSB:IM-1, NIST-800-53:AC-3]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerregistry/registries' | project id, name, subscriptionId, resourceGroup, sku = tostring(sku.name), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: properties.anonymousPullEnabled, op: eq, value: true }
    evidence: "{name} (subscription {subscriptionId}): anonymous pull enabled"

  - id: AZ-ACR-OPEN-TO-ALL-NETWORKS
    title: Container registry accepts connections from every network
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: container-registry
    why: "A registry open to all networks lets a leaked token push or pull images from anywhere; Basic and Standard registries cannot restrict networks at all."
    fix: On Premium, set the network default action to Deny with the needed ranges, or use a private endpoint and disable public access.
    refs: [MCSB:NS-2, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerregistry/registries' | project id, name, subscriptionId, resourceGroup, sku = tostring(sku.name), properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      all:
        - { field: properties.publicNetworkAccess, op: eq, value: Enabled }
        - any:
            - { field: properties.networkRuleSet.defaultAction, op: absent }
            - { field: properties.networkRuleSet.defaultAction, op: eq, value: Allow }
    evidence: "{name} ({sku}, subscription {subscriptionId}): public access with default action {properties.networkRuleSet.defaultAction}"

  # ==== RBAC on subscriptions and resources (Resource Graph) ===================================

  - id: AZ-SUBSCRIPTION-OWNERS-TOO-MANY
    title: Subscription has more than three direct Owners
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: subscription
    why: "Every Owner can change anything and grant anyone access; more than a handful of standing Owners on a subscription means privilege that nobody reviews."
    fix: Reduce direct Owner assignments to two or three, make the rest eligible through PIM or move them to narrower roles.
    refs: [MCSB:PA-1, NIST-800-53:AC-6, NIST-800-53:AC-2]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "AuthorizationResources | where type =~ 'microsoft.authorization/roleassignments' | extend scope = tolower(tostring(properties.scope)), rdef = tostring(properties.roleDefinitionId) | where rdef endswith '8e3af657-a8ff-443c-a75c-2fe8c4bcb635' and scope == strcat('/subscriptions/', tolower(subscriptionId)) | summarize owners = count() by subscriptionId | project id = strcat('/subscriptions/', subscriptionId), subscriptionId, owners"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: subscriptionId
    each: { field: owners, op: gt, value: 3, threshold: azure.max-subscription-owners }
    evidence: "subscription {subscriptionId}: {owners} direct Owner assignments"

  - id: AZ-USER-ACCESS-ADMIN-ASSIGNMENT
    title: Standing User Access Administrator assignment
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: role-assignment
    why: "User Access Administrator can grant any role, including Owner, to anyone at its scope; held permanently it is a quiet path to full control."
    fix: Remove the assignment or make it PIM-eligible with approval; prefer a constrained Role Based Access Control Administrator assignment.
    refs: [MCSB:PA-1, MCSB:PA-2, NIST-800-53:AC-6]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "AuthorizationResources | where type =~ 'microsoft.authorization/roleassignments' | extend scope = tostring(properties.scope), rdef = tostring(properties.roleDefinitionId) | where rdef endswith '18d7d88d-d35e-4fb5-a5c3-7773c20a72d9' and scope != '/' | project id, name, subscriptionId, scope, principalId = tostring(properties.principalId), principalType = tostring(properties.principalType)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: principalId
    each: any
    evidence: "{principalType} {principalId} holds User Access Administrator at {scope}"

  - id: AZ-WORKLOAD-IDENTITY-BROAD-CONTRIBUTOR
    title: Service principal holds Contributor on a subscription or management group
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: role-assignment
    why: "A pipeline or automation identity with Contributor across a whole subscription can change or delete any resource in it; its secret or token is then as valuable as an admin account."
    fix: Scope the identity to the resource groups it deploys, with the narrowest role that works; prefer federated credentials over secrets.
    refs: [MCSB:PA-7, NIST-800-53:AC-6]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "AuthorizationResources | where type =~ 'microsoft.authorization/roleassignments' | extend scope = tostring(properties.scope), rdef = tostring(properties.roleDefinitionId), ptype = tostring(properties.principalType) | where ptype =~ 'ServicePrincipal' and rdef endswith 'b24988ac-6180-42a0-ab88-20f7382dd24c' and (scope matches regex '^/subscriptions/[^/]+$' or scope startswith '/providers/Microsoft.Management/managementGroups/') | project id, name, subscriptionId, scope, principalId = tostring(properties.principalId)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: principalId
    each: any
    evidence: "service principal {principalId} holds Contributor at {scope}"

  - id: AZ-CUSTOM-ROLE-WILDCARD-DATA-ACTIONS
    title: Custom role grants every data action of a provider
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: role-definition
    why: "A data action wildcard such as Microsoft.Storage/* or * reads, writes and deletes all data in every account at the role's scope, which reviews of control-plane roles miss."
    fix: List the specific data actions the role needs (for example blob read only) or use the built-in data roles.
    refs: [MCSB:PA-7, NIST-800-53:AC-6]
    query:
      protocol: http
      path: /providers/Microsoft.Authorization/roleDefinitions
      params: { api-version: "2022-04-01", $filter: "type eq 'CustomRole'" }
      paging: none
      key: name
      name: properties.roleName
    each:
      all:
        - { field: properties.type, op: eq, value: CustomRole }
        - { field: "properties.permissions[].dataActions", op: match, value: '^(\*|Microsoft\.[A-Za-z]+/\*)$' }
    evidence: "{properties.roleName}: data actions {properties.permissions[].dataActions}, assignable at {properties.assignableScopes}"

  # ==== Azure Policy coverage per subscription (ARM, map: true) ================================

  - id: AZ-POLICY-NONE-APPLIES
    title: No policy assignment applies to the subscription
    kind: missing
    lens: security
    category: CFG
    severity: medium
    entity: subscription
    why: "With no policy assignment at the subscription or above, nothing audits or blocks insecure resources being created there."
    fix: Assign the organisation's baseline initiatives at the management group above the subscription.
    refs: [MCSB:PV-2, MCSB:GS-7, NIST-800-53:CM-6]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Authorization/policyAssignments
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-04-01", $filter: "atScope()" }
      paging: none
      map: true
      key: parent.subscriptionId
      name: parent.displayName
    each:
      all:
        - { field: key, op: eq, value: value }
        - { field: value, op: empty }
    evidence: "{parent.displayName}: no policy assignment at or above the subscription"

  - id: AZ-POLICY-MCSB-NOT-ASSIGNED
    title: Microsoft cloud security benchmark initiative is not assigned
    kind: missing
    lens: security
    category: CFG
    severity: medium
    entity: subscription
    why: "The benchmark initiative is what Defender for Cloud assesses recommendations and the secure score against; without it the subscription's posture is not measured."
    fix: Assign the Microsoft cloud security benchmark initiative at the management group (Defender for Cloud does this when it is enabled on the subscription).
    refs: [MCSB:PV-2, NIST-800-53:CA-7]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Authorization/policyAssignments
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-04-01", $filter: "atScope()" }
      paging: none
      map: true
      key: parent.subscriptionId
      name: parent.displayName
    each:
      all:
        - { field: key, op: eq, value: value }
        - { field: value, op: notempty }
        - not:
            element:
              of: value
              where: { field: properties.policyDefinitionId, op: match, value: '1f3afdf9-d0c9-4c3d-847f-89da613e70a8$' }
    evidence: "{parent.displayName}: benchmark initiative not among the assignments that apply"

  - id: AZ-SUBSCRIPTION-NO-BUDGET
    title: Subscription has no budget
    kind: missing
    lens: maintenance
    category: CST
    severity: low
    entity: subscription
    refresh: 7d
    why: "Without a budget and its alerts, runaway spend - a forgotten test cluster, a misconfigured autoscale, or a compromised subscription mining crypto - is found on the invoice a month later. Budgets set on a resource group or billing scope instead are not seen here."
    fix: Create a monthly budget on the subscription with actual and forecast alerts to the owner and finance.
    refs: [NIST-800-53:SA-4]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Consumption/budgets
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-05-01" }
      paging: none
      map: true
      key: parent.subscriptionId
      name: parent.displayName
    each:
      all:
        - { field: key, op: eq, value: value }
        - { field: value, op: empty }
    evidence: "{parent.displayName}: no budget on the subscription"

  # ==== Backup: vaults, protected items and locks ==============================================

  - id: AZ-RECOVERY-VAULT-NO-DELETE-LOCK
    title: Recovery Services vault has no delete lock
    kind: missing
    lens: security
    category: BCK
    severity: low
    entity: recovery-vault
    refresh: 7d
    why: "The backup vault is the last line against ransomware and sabotage; a delete lock makes removing it a deliberate two-step act instead of one mistaken or malicious call."
    fix: Add a CanNotDelete lock to the vault (or its resource group).
    refs: [MCSB:BR-2, NIST-800-53:CP-9]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.RecoveryServices/vaults/{name}/providers/Microsoft.Authorization/locks
      for_each:
        path: /providers/Microsoft.ResourceGraph/resources
        params: { api-version: "2022-10-01" }
        method: post
        body: { query: "Resources | where type =~ 'microsoft.recoveryservices/vaults' | project id, name, subscriptionId, resourceGroup" }
        items: data
        paging: body-cursor
        cursorField: "$skipToken"
        cursorBody: "options.$skipToken"
        field: name
        max: 2000
      params: { api-version: "2020-05-01" }
      paging: none
      map: true
      key: parent.id
      name: parent.name
    each:
      all:
        - { field: key, op: eq, value: value }
        - not:
            element:
              of: value
              where: { field: properties.level, op: in, value: [CanNotDelete, ReadOnly] }
    evidence: "{parent.name} (subscription {parent.subscriptionId}): no delete or read-only lock"

  - id: AZ-RECOVERY-VAULT-SOFT-DELETE-OFF
    title: Recovery Services vault has soft delete off
    kind: misconfigured
    lens: security
    category: BCK
    severity: high
    entity: recovery-vault
    why: "With soft delete off, deleting a backup item destroys its recovery points at once - the first thing ransomware operators do before encrypting."
    fix: Enable soft delete (always-on where possible) on the vault.
    refs: [MCSB:BR-2, NIST-800-53:CP-9, MITRE-ATTACK:T1490]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.recoveryservices/vaults' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: properties.securitySettings.softDeleteSettings.softDeleteState, op: eq, value: Disabled }
    evidence: "{name} (subscription {subscriptionId}): soft delete {properties.securitySettings.softDeleteSettings.softDeleteState}"

  - id: AZ-RECOVERY-VAULT-IMMUTABILITY-OFF
    title: Recovery Services vault immutability is off
    kind: misconfigured
    lens: security
    category: BCK
    severity: medium
    entity: recovery-vault
    refresh: 7d
    why: "Without immutability, recovery points can be removed early by changing the backup policy or stopping protection, so an attacker with vault rights can still erase the backups."
    fix: Enable vault immutability, and lock it once the retention settings are confirmed.
    refs: [MCSB:BR-2, NIST-800-53:CP-9, MITRE-ATTACK:T1490]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.recoveryservices/vaults' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: properties.securitySettings.immutabilitySettings.state, op: eq, value: Disabled }
    evidence: "{name} (subscription {subscriptionId}): immutability {properties.securitySettings.immutabilitySettings.state}"

  - id: AZ-RECOVERY-VAULT-PUBLIC-NETWORK
    title: Recovery Services vault allows public network access
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: recovery-vault
    refresh: 7d
    why: "Backup and restore traffic over the vault's public endpoint can be reached from any network; a private endpoint keeps it inside."
    fix: Add private endpoints for backup and set public network access to Disabled.
    refs: [MCSB:NS-2, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.recoveryservices/vaults' | project id, name, location, subscriptionId, resourceGroup, sku, properties"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: properties.publicNetworkAccess, op: eq, value: Enabled }
    evidence: "{name} (subscription {subscriptionId}): public network access Enabled"

  - id: AZ-RECOVERY-VAULT-LOCAL-REDUNDANCY
    title: Recovery Services vault stores backups in one region only
    kind: misconfigured
    lens: maintenance
    category: BCK
    severity: low
    entity: recovery-vault
    refresh: 7d
    why: "With locally or zone-redundant backup storage, a regional disaster takes the workload and its backups together."
    fix: Use geo-redundant storage with cross-region restore for vaults protecting production (set before the first item is protected).
    refs: [MCSB:BR-1, NIST-800-53:CP-9, NIST-800-53:CP-6]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
