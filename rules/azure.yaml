      name: name
    each: { field: properties.backup.geoRedundantBackup, op: eq, value: Disabled }
    evidence: "{name} (subscription {subscriptionId}): geo-redundant backup Disabled"

  - id: AZ-POSTGRES-ENTRA-AUTH-OFF
