      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: httpsOnly, op: absent }
        - { field: httpsOnly, op: eq, value: false }
    evidence: "slot {name} (subscription {subscriptionId}): HTTPS-only off"

