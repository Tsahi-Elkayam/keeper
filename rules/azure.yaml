    kind: misconfigured
    lens: security
    category: MON
    severity: medium
    entity: defender-plan
    why: "Agentless scanning reads VM disk snapshots for vulnerabilities, secrets and malware without an agent; with it off on a paid Servers or CSPM plan, machines without a healthy agent are not assessed at all."
    fix: Enable the AgentlessVmScanning extension on the subscription's VirtualMachines and CloudPosture plans.
    refs: [MCSB:PV-5, NIST-800-53:RA-5]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Security/pricings
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
