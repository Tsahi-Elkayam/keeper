schema: keeper.rules/1
system: azure
name: Azure Resource Manager (tenant scope)
integration: azure
# Endpoint: https://management.azure.com. The integration obtains the ARM token; rules only name GET
# paths, plus the one POST the azure type answers as a read: Resource Graph KQL
# (/providers/Microsoft.ResourceGraph/resources, items: data, $skipToken body-cursor paging).
# Tenant-wide routes (subscription list, root-scope role assignments and role definitions, billing,
# reservations, savings plans, management groups, tenant service-health events) are read once.
# Subscription-scoped routes use for_each over /subscriptions: one GET per subscription the review
# identity can see, each row carrying the subscription as "parent" (capped at 500).
# Resource posture is read through Resource Graph across every visible subscription in one query; the
# rules that share a resource type use the same query text. Sub-resources Resource Graph does not hold
# (blob/file service settings, SQL auditing and firewall rules, server parameters, App Service site
# config, diagnostic settings, key and secret metadata, locks) use for_each over a Resource Graph list
# that projects subscriptionId, resourceGroup and name: for_each fills every {placeholder} of the path
# from the parent row (plain ids only - a resource group name with brackets is skipped and makes the
# read partial). "Must exist" per object or per subscription uses map: true: the answer's top-level
# "value" array becomes one row (key "value"), judged empty or by element. Per-subscription must-exist
# that Resource Graph can answer is a KQL leftouter join from ResourceContainers. ARM nextLink is
# followed (paging auto) except where a rule says paging: none. What still cannot be written is in
# docs/backlog/azure.md.
defaults:
  lens: both
  refresh: 1d
rules:

  # ---- subscriptions -------------------------------------------------------------------------

  - id: AZ-SUBSCRIPTION-STATE
    title: Subscription is not in the enabled state
    kind: broken
    lens: maintenance
    category: AVL
    severity:
      field: state
      map: { PastDue: high, Warned: high, Disabled: medium, Deleted: low }
      default: medium
    entity: subscription
    why: A warned or past-due subscription is days away from having its resources stopped; a disabled one already has.
    fix: Settle the billing issue or reactivate the subscription; if it is retired on purpose, move or delete what is left in it.
    query:
      protocol: http
      path: /subscriptions
      params: { api-version: "2022-12-01" }
      paging: none
      key: subscriptionId
      name: displayName
    each: { field: state, op: ne, value: Enabled }
    evidence: "{displayName}: state {state}, offer {subscriptionPolicies.quotaId}"

  - id: AZ-SUBSCRIPTION-SPENDING-LIMIT
    title: Subscription has a spending limit that stops resources
    kind: misconfigured
    lens: maintenance
    category: AVL
    severity: medium
    entity: subscription
    why: With the spending limit on, Azure disables the subscription's resources when the credit runs out - a production outage triggered by billing.
    fix: Remove the spending limit (or move the workloads to a pay-as-you-go or enterprise subscription) and use budgets for cost control.
    query:
      protocol: http
      path: /subscriptions
      params: { api-version: "2022-12-01" }
      paging: none
      key: subscriptionId
      name: displayName
    each: { field: subscriptionPolicies.spendingLimit, op: eq, value: "On" }
    evidence: "{displayName}: spending limit {subscriptionPolicies.spendingLimit}, offer {subscriptionPolicies.quotaId}"

  - id: AZ-SUBSCRIPTION-DELEGATED
    title: Subscription is managed from another tenant
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: subscription
    why: A delegation to another tenant (for example a service provider) grants access that does not appear in this tenant's role assignments or sign-in logs.
    fix: Confirm every managing tenant is a current, contracted provider with least-privilege roles; remove delegations that are not.
    refs: [NIST-800-53:AC-2, NIST-800-53:AC-6]
    query:
      protocol: http
      path: /subscriptions
      params: { api-version: "2022-12-01" }
      paging: none
      key: subscriptionId
      name: displayName
    each: { field: managedByTenants, op: size-gt, value: 0 }
    evidence: "{displayName}: managed by tenant(s) {managedByTenants[].tenantId}"

  - id: AZ-SUBSCRIPTION-NONE
    title: The review identity sees no subscriptions
    kind: missing
    category: MON
    severity: medium
    entity: instance
    why: With no subscription visible, every subscription rule in this file reads nothing and the result looks clean.
    fix: Grant the review identity Reader at the root management group (or on each subscription), then rerun.
    refs: [NIST-800-53:CA-7]
    query:
      protocol: http
      path: /subscriptions
      params: { api-version: "2022-12-01" }
      paging: none
      key: subscriptionId
      name: displayName
    count: none
    evidence: "no subscriptions returned"

  - id: AZ-SUBSCRIPTION-UNTAGGED
    title: Subscription has no tags
    kind: missing
    lens: maintenance
    category: HYG
    severity: low
    entity: subscription
    refresh: 7d
    why: Without owner, cost-centre and environment tags, cost reports and incident routing have nothing to group the subscription by, and nobody is obviously responsible for it.
    fix: Apply the tagging standard (owner, cost centre, environment) to the subscription and enforce it with policy.
    refs: [NIST-800-53:CM-8, CIS-Controls-v8:1.1]
    query:
      protocol: http
      path: /subscriptions
      params: { api-version: "2022-12-01" }
      paging: none
      key: subscriptionId
      name: displayName
    each:
      any:
        - { field: tags, op: absent }
        - { field: tags, op: eq, value: "{}" }
    evidence: "{displayName}: no tags"

  # ---- root scope ----------------------------------------------------------------------------

  - id: AZ-ROOT-SCOPE-ROLE-ASSIGNMENT
    title: Role assignment at the tenant root scope
    kind: misconfigured
    lens: security
    category: IAM
    severity:
      field: properties.roleDefinitionId
      map:
        /providers/Microsoft.Authorization/roleDefinitions/18d7d88d-d35e-4fb5-a5c3-7773c20a72d9: critical
        /providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635: critical
      default: high
    entity: role-assignment
    why: An assignment at "/" covers every management group and subscription. The usual one is User Access Administrator left behind by a Global Administrator who elevated access and never turned it off.
    fix: Remove root-scope assignments that are not deliberate; turn off "Access management for Azure resources" after each elevation. Reading this scope needs root-scope read rights, otherwise the rule is unknown.
    refs: [NIST-800-53:AC-6, NIST-800-53:AC-2]
    query:
      protocol: http
      path: /providers/Microsoft.Authorization/roleAssignments
      params: { api-version: "2022-04-01", $filter: "atScope()" }
      paging: none
      key: name
      name: properties.principalId
    each: { field: properties.scope, op: eq, value: / }
    evidence: "principal {properties.principalId} ({properties.principalType}) holds {properties.roleDefinitionId} at / since {properties.createdOn}"

  # Role definitions read at the tenant level with type eq 'CustomRole' return every custom role in the
  # tenant, whatever scopes it is assignable at (per the vendor's RBAC listing guide).

  - id: AZ-CUSTOM-ROLE-WILDCARD-ACTIONS
    title: Custom role grants every action, or every write, delete or action operation
    kind: misconfigured
    lens: security
    category: IAM
    severity: high
    entity: role-definition
    why: A custom role with "*" (or "*/write", "*/delete", "*/action") is Owner or Contributor under a harmless name; reviews of the built-in privileged roles never see who holds it.
    fix: Replace the wildcard with the explicit actions the role needs; if it truly needs everything, use the built-in role so access reviews see it.
    refs: [NIST-800-53:AC-6, NIST-800-53:AC-2, CIS-Controls-v8:6.8]
    query:
      protocol: http
      path: /providers/Microsoft.Authorization/roleDefinitions
      params: { api-version: "2022-04-01", $filter: "type eq 'CustomRole'" }
      paging: none
      key: name
      name: properties.roleName
    each:
      all:
        - { field: properties.type, op: eq, value: CustomRole }
        - { field: "properties.permissions[].actions", op: match, value: '^\*(/(write|delete|action))?$' }
    evidence: "{properties.roleName}: actions {properties.permissions[].actions}, not-actions {properties.permissions[].notActions}, assignable at {properties.assignableScopes}"

  - id: AZ-CUSTOM-ROLE-ROOT-ASSIGNABLE
    title: Custom role can be assigned at the tenant root
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: role-definition
    why: A custom role assignable at "/" can be granted over every management group and every subscription, including the ones created later.
    fix: Narrow the role's assignable scopes to the management groups or subscriptions it is meant for.
    refs: [NIST-800-53:AC-6, CIS-Controls-v8:6.8]
    query:
      protocol: http
      path: /providers/Microsoft.Authorization/roleDefinitions
      params: { api-version: "2022-04-01", $filter: "type eq 'CustomRole'" }
      paging: none
      key: name
      name: properties.roleName
    each:
      all:
        - { field: properties.type, op: eq, value: CustomRole }
        - { field: properties.assignableScopes, op: contains, value: / }
    evidence: "{properties.roleName}: assignable at {properties.assignableScopes}"

  - id: AZ-MANAGEMENT-GROUP-FLAT
    title: No management group below the tenant root
    kind: missing
    category: CFG
    severity: low
    entity: instance
    refresh: 7d
    why: Without a management-group hierarchy, policy, access and security settings can only be set subscription by subscription, and a new subscription inherits nothing. The same result appears when the review identity cannot read the groups.
    fix: Create a small hierarchy (for example platform, workloads, sandbox) and move the subscriptions into it; grant the review identity read on the root group.
    refs: [NIST-800-53:CM-6, CIS-Controls-v8:4.1]
    query:
      protocol: http
      path: /providers/Microsoft.Management/managementGroups
      params: { api-version: "2021-04-01" }
      paging: none
      key: name
      name: properties.displayName
    count: { op: lt, value: 2 }
    evidence: "{count} management group(s) visible, the root included"

  # ---- billing -------------------------------------------------------------------------------
  # Needs Billing Reader on the billing account; without it the list is empty (AZ-BILLING-ACCOUNT-NONE).

  - id: AZ-BILLING-ACCOUNT-STATUS
    title: Billing account is not active
    kind: broken
    lens: maintenance
    category: CST
    severity:
      field: properties.accountStatus
      map: { Disabled: high, Expired: high, Terminated: high, Deleted: medium, UnderReview: medium, Pending: medium, Extended: medium, Transferred: low, New: low }
      default: medium
    entity: billing-account
    why: A disabled, expired or terminated billing account stops the subscriptions under it; under review or extended is the step before.
    fix: Contact the billing owner or reseller and resolve the account status before the subscriptions are affected.
    refs: [NIST-800-53:SA-4]
    query:
      protocol: http
      path: /providers/Microsoft.Billing/billingAccounts
      params: { api-version: "2024-04-01" }
      paging: none
      key: name
      name: properties.displayName
    each: { field: properties.accountStatus, op: ne, value: Active }
    evidence: "{properties.displayName} ({properties.agreementType}): {properties.accountStatus} {properties.accountStatusReasonCode}"

  - id: AZ-BILLING-ENROLLMENT-ENDING
    title: Enterprise Agreement enrollment ends soon
    kind: broken
    lens: maintenance
    category: CST
    severity:
      daysLeft: properties.enrollmentDetails.endDate
      ranges: [ { max: 30, value: high } ]
      default: medium
    entity: billing-account
    why: When the enrollment ends without a renewal or a move to another agreement, its subscriptions lose their contract terms and, eventually, service.
    fix: Start the renewal or the move to the next agreement with procurement now; it takes weeks.
    refs: [NIST-800-53:SA-4]
    deadline: properties.enrollmentDetails.endDate
    query:
      protocol: http
      path: /providers/Microsoft.Billing/billingAccounts
      params: { api-version: "2024-04-01" }
      paging: none
      key: name
      name: properties.displayName
    each:
      all:
        - { field: properties.agreementType, op: eq, value: EnterpriseAgreement }
        - { field: properties.enrollmentDetails.endDate, op: until-lt, value: 90, threshold: azure.enrollment-notice-days }
    evidence: "{properties.displayName}: enrollment ends {properties.enrollmentDetails.endDate}"

  - id: AZ-BILLING-ACCOUNT-NONE
    title: The review identity sees no billing account
    kind: missing
    lens: maintenance
    category: MON
    severity: low
    entity: instance
    refresh: 7d
    why: Without a visible billing account the billing rules read nothing, so an account under review or an ending enrollment goes unnoticed.
    fix: Grant the review identity Billing Reader on the billing account.
    refs: [NIST-800-53:CA-7]
    query:
      protocol: http
      path: /providers/Microsoft.Billing/billingAccounts
      params: { api-version: "2024-04-01" }
      paging: none
      key: name
      name: properties.displayName
    count: none
    evidence: "no billing account returned"

  # ---- reservations --------------------------------------------------------------------------

  - id: AZ-RESERVATION-EXPIRY
    title: Reservation expires soon and will not renew
    kind: broken
    lens: maintenance
    category: CST
    severity:
      daysLeft: properties.expiryDateTime
      ranges: [ { max: 7, value: high }, { max: 30, value: medium } ]
      default: low
    entity: reservation
    why: When a reservation lapses without renewal the covered resources fall back to pay-as-you-go prices overnight.
    fix: Decide whether the capacity is still needed; turn on auto-renew or buy the replacement before the expiry date.
    deadline: properties.expiryDateTime
    query:
      protocol: http
      path: /providers/Microsoft.Capacity/reservations
      params: { api-version: "2022-11-01", $filter: "(properties/archived eq false)" }
      paging: none
      key: name
      name: properties.displayName
    each:
      all:
        - { field: properties.provisioningState, op: eq, value: Succeeded }
        - { field: properties.renew, op: eq, value: false }
        - { field: properties.expiryDateTime, op: until-lt, value: 60, threshold: azure.reservation-notice-days }
    evidence: "{properties.displayName} ({properties.reservedResourceType}, {sku.name}) expires {properties.expiryDate}, renew off"

  - id: AZ-RESERVATION-FAILED
    title: Reservation is in a failed billing or provisioning state
    kind: broken
    lens: maintenance
    category: CST
    severity: high
    entity: reservation
    why: A reservation whose billing failed gives no discount while the organisation believes it is covered.
    fix: Fix the payment method or billing scope and contact billing support to restore the reservation.
    query:
      protocol: http
      path: /providers/Microsoft.Capacity/reservations
      params: { api-version: "2022-11-01", $filter: "(properties/archived eq false)" }
      paging: none
      key: name
      name: properties.displayName
    each: { field: properties.provisioningState, op: in, value: [BillingFailed, Failed] }
    evidence: "{properties.displayName}: {properties.provisioningState}"

  - id: AZ-SAVINGS-PLAN-EXPIRY
    title: Savings plan expires soon and will not renew
    kind: broken
    lens: maintenance
    category: CST
    severity:
      daysLeft: properties.expiryDateTime
      ranges: [ { max: 7, value: high }, { max: 30, value: medium } ]
      default: low
    entity: savings-plan
    why: When a savings plan lapses without renewal, the compute it covered falls back to pay-as-you-go prices overnight.
    fix: Decide with finance whether to renew; turn on renew or buy the replacement before the expiry date.
    refs: [NIST-800-53:SA-4]
    deadline: properties.expiryDateTime
    query:
      protocol: http
      path: /providers/Microsoft.BillingBenefits/savingsPlans
      params: { api-version: "2022-11-01", $filter: "(properties/archived eq false)" }
      paging: none
      key: name
      name: properties.displayName
    each:
      all:
        - { field: properties.provisioningState, op: eq, value: Succeeded }
        - { field: properties.renew, op: eq, value: false }
        - { field: properties.expiryDateTime, op: until-lt, value: 60, threshold: azure.savings-plan-notice-days }
    evidence: "{properties.displayName} ({properties.term}) expires {properties.expiryDateTime}, renew off"

  - id: AZ-SAVINGS-PLAN-FAILED
    title: Savings plan is failed or expired but still listed
    kind: broken
    lens: maintenance
    category: CST
    severity: medium
    entity: savings-plan
    why: A failed savings plan gives no discount while the organisation believes the compute is covered.
    fix: Fix the billing problem behind it, or archive the plan once it is truly finished.
    refs: [NIST-800-53:SA-4]
    query:
      protocol: http
      path: /providers/Microsoft.BillingBenefits/savingsPlans
      params: { api-version: "2022-11-01", $filter: "(properties/archived eq false)" }
      paging: none
      key: name
      name: properties.displayName
    each: { field: properties.provisioningState, op: in, value: [Failed, Expired] }
    evidence: "{properties.displayName}: {properties.provisioningState}"

  # ---- tenant service health -----------------------------------------------------------------
  # Tenant-level events cover services scoped to the tenant; subscription-level service health is
  # in the backlog. queryStartTime is set far back because the default (last 3 days of updates)
  # drops active events that have not been updated recently.

  - id: AZ-HEALTH-SERVICE-ISSUE
    title: Active Azure service issue affecting the tenant
    kind: broken
    lens: maintenance
    category: AVL
    severity: high
    entity: health-event
    refresh: 1h
    why: Knowing early that a failure is on the provider's side saves hours of local troubleshooting and lets users be told.
    fix: Follow the event's updates and recommended actions; fail over if the impact is long.
    query:
      protocol: http
      path: /providers/Microsoft.ResourceHealth/events
      params: { api-version: "2025-05-01", queryStartTime: "1/1/2024" }
      paging: none
      key: name
      name: properties.title
    each:
      all:
        - { field: properties.eventType, op: eq, value: ServiceIssue }
        - { field: properties.status, op: eq, value: Active }
    evidence: "{name}: {properties.title} (since {properties.impactStartTime})"

  - id: AZ-HEALTH-PLANNED-MAINTENANCE
    title: Planned Azure maintenance is coming up
    kind: broken
    lens: maintenance
    category: AVL
    severity:
      daysLeft: properties.impactStartTime
      ranges: [ { max: 2, value: high }, { max: 7, value: medium } ]
      default: low
    entity: health-event
    refresh: 6h
    why: Maintenance only helps if someone plans around it - change freezes, failover tests and user notices need lead time.
    fix: Check the impacted services and regions, and schedule or reschedule work around the window.
    deadline: properties.impactStartTime
    query:
      protocol: http
      path: /providers/Microsoft.ResourceHealth/events
      params: { api-version: "2025-05-01", queryStartTime: "1/1/2024" }
      paging: none
      key: name
      name: properties.title
    each:
      all:
        - { field: properties.eventType, op: eq, value: PlannedMaintenance }
        - { field: properties.status, op: eq, value: Active }
        - { field: properties.impactStartTime, op: until-lt, value: 14, threshold: azure.maintenance-notice-days }
    evidence: "{name}: {properties.title} starts {properties.impactStartTime}"

  - id: AZ-HEALTH-SECURITY-ADVISORY
    title: Active Azure security advisory for the tenant
    kind: broken
    lens: security
    category: CFG
    severity: high
    entity: health-event
    refresh: 6h
    why: Security advisories announce issues that may need action on the customer side (credential rotation, configuration change).
    fix: Read the advisory (sensitive details need the fetchEventDetails permission) and carry out its recommended actions.
    refs: [NIST-800-53:SI-5]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceHealth/events
      params: { api-version: "2025-05-01", queryStartTime: "1/1/2024" }
      paging: none
      key: name
      name: properties.title
    each:
      all:
        - { field: properties.eventType, op: eq, value: SecurityAdvisory }
        - { field: properties.status, op: eq, value: Active }
    evidence: "{name}: {properties.title}"

  - id: AZ-HEALTH-RETIREMENT
    title: Azure service or feature retirement announced
    kind: broken
    lens: maintenance
    category: LCM
    severity: medium
    entity: health-event
    refresh: 7d
    why: Retirements give months of notice that are easy to waste; whatever still depends on the retired feature stops on the date.
    fix: Inventory what uses the retiring feature and plan the migration now.
    refs: [NIST-800-53:SA-22]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceHealth/events
      params: { api-version: "2025-05-01", queryStartTime: "1/1/2024" }
      paging: none
      key: name
      name: properties.title
    each:
      all:
        - { field: properties.eventSubType, op: eq, value: Retirement }
        - { field: properties.status, op: eq, value: Active }
    evidence: "{name}: {properties.title}"

  - id: AZ-HEALTH-ACTION-RECOMMENDED
    title: Azure health advisory asks for customer action
    kind: broken
    lens: maintenance
    category: CFG
    severity: medium
    entity: health-event
    refresh: 1d
    why: Events tagged "Action Recommended" need something done on the customer side to avoid disruption.
    fix: Carry out the recommended actions listed in the event.
    query:
      protocol: http
      path: /providers/Microsoft.ResourceHealth/events
      params: { api-version: "2025-05-01", queryStartTime: "1/1/2024" }
      paging: none
      key: name
      name: properties.title
    each:
      all:
        - { field: properties.eventTags, op: contains, value: Action Recommended }
        - { field: properties.status, op: eq, value: Active }
    evidence: "{name}: {properties.title} ({properties.eventType})"

  # ---- per subscription (for_each over /subscriptions) ---------------------------------------
  # Rows are keyed by the resource id, which already names the subscription.

  - id: AZ-DEFENDER-PLAN-OFF
    title: Required Defender for Cloud plan is off for a subscription
    kind: missing
    lens: security
    category: MON
    severity: medium
    entity: defender-plan
    why: On the free tier Defender for Cloud only scores posture; threat detection for servers, storage, key vaults and the management plane stays off, so attacks there raise no alert. Which plans are required is a tenant decision (the threshold is a pattern of plan names).
    fix: Turn the plan on for the subscription (or at the management group through policy), or narrow the required-plan pattern with a recorded reason.
    refs: [NIST-800-53:SI-4, NIST-800-53:RA-5, CIS-Controls-v8:13.1]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Security/pricings
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2024-01-01" }
      paging: none
      key: id
      name: name
    each:
      all:
        - { field: name, op: match, value: '^(VirtualMachines|StorageAccounts|KeyVaults|Arm|CloudPosture)$', threshold: azure.defender-required-plans }
        - { field: properties.pricingTier, op: eq, value: Free }
        - any:
            - { field: properties.deprecated, op: absent }
            - { field: properties.deprecated, op: eq, value: false }
    evidence: "{parent.displayName}: plan {name} is on the {properties.pricingTier} tier"

  - id: AZ-STORAGE-HTTP-ALLOWED
    title: Storage account accepts unencrypted HTTP
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: storage-account
    why: With secure transfer off, data and shared-access signatures can travel over plain HTTP, readable and replayable by anyone on the path.
    fix: Turn on "secure transfer required" (HTTPS only); check first that no client still calls the account over HTTP.
    refs: [NIST-800-53:SC-8, CIS-Controls-v8:3.10]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Storage/storageAccounts
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-05-01" }
      paging: none
      key: id
      name: name
    each: { field: properties.supportsHttpsTrafficOnly, op: eq, value: false }
    evidence: "{name} in {parent.displayName}: HTTPS-only off"

  - id: AZ-STORAGE-BLOB-PUBLIC-ACCESS-ALLOWED
    title: Storage account allows anonymous public access to blobs
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: storage-account
    why: While the account allows anonymous access, any container set to public - by mistake or by a script - serves its blobs to the internet without a credential.
    fix: Disallow anonymous blob access on the account; serve public content through a CDN or signed URLs instead.
    refs: [NIST-800-53:AC-3, NIST-800-53:SC-7, CIS-Controls-v8:3.3]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Storage/storageAccounts
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-05-01" }
      paging: none
      key: id
      name: name
    each: { field: properties.allowBlobPublicAccess, op: eq, value: true }
    evidence: "{name} in {parent.displayName}: anonymous blob access allowed"

  - id: AZ-STORAGE-SHARED-KEY-ALLOWED
    title: Storage account accepts shared-key authorisation
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: storage-account
    why: The account keys (and every SAS signed with them) grant full access with no identity attached, are rarely rotated and bypass conditional access; the setting is on unless explicitly turned off.
    fix: Move the account's clients to Entra ID authorisation and disallow shared-key access; record an override where a dependent service still needs keys.
    refs: [NIST-800-53:IA-5, NIST-800-53:AC-6]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Storage/storageAccounts
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-05-01" }
      paging: none
      key: id
      name: name
    each:
      any:
        - { field: properties.allowSharedKeyAccess, op: absent }
        - { field: properties.allowSharedKeyAccess, op: eq, value: true }
    evidence: "{name} in {parent.displayName}: shared-key access allowed"

  - id: AZ-KEYVAULT-PURGE-PROTECTION-OFF
    title: Key vault has no purge protection
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: key-vault
    why: Without purge protection, anyone with enough rights can delete a vault and purge it immediately, destroying its keys and every piece of data encrypted with them - a ransomware and sabotage path.
    fix: Enable purge protection on the vault (it cannot be turned off again; check the retention period first).
    refs: [NIST-800-53:SC-12, NIST-800-53:CP-9, MITRE-ATTACK:T1485]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.KeyVault/vaults
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-07-01" }
      paging: none
      key: id
      name: name
    each:
      any:
        - { field: properties.enablePurgeProtection, op: absent }
        - { field: properties.enablePurgeProtection, op: eq, value: false }
    evidence: "{name} in {parent.displayName}: purge protection off"

  - id: AZ-DISK-UNATTACHED
    title: Managed disk has been unattached for a month
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: disk
    refresh: 7d
    why: An unattached disk is paid for every month and often holds a copy of a retired server's data that nobody looks after.
    fix: Snapshot or archive it if the data matters, then delete it.
    refs: [NIST-800-53:CM-8]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Compute/disks
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2024-03-02" }
      paging: none
      key: id
      name: name
    each:
      all:
        - { field: properties.diskState, op: eq, value: Unattached }
        - any:
            - { field: properties.lastOwnershipUpdateTime, op: age-gt, value: 30, threshold: azure.unattached-disk-days }
            - all:
                - { field: properties.lastOwnershipUpdateTime, op: absent }
                - { field: properties.timeCreated, op: age-gt, value: 30, threshold: azure.unattached-disk-days }
    evidence: "{name} in {parent.displayName}: {properties.diskSizeGB} GB {sku.name}, unattached since {properties.lastOwnershipUpdateTime} (created {properties.timeCreated})"

  - id: AZ-PUBLIC-IP-UNATTACHED
    title: Public IP address is attached to nothing
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: public-ip
    refresh: 7d
    why: An unused public address costs money and is easy to re-attach to the wrong resource; a public address nobody owns is also an address someone may still have in an allow-list.
    fix: Delete the address, or record what it is reserved for.
    refs: [NIST-800-53:CM-8]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Network/publicIPAddresses
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2024-05-01" }
      paging: none
      key: id
      name: name
    each:
      all:
        - { field: properties.ipConfiguration, op: absent }
        - { field: properties.natGateway, op: absent }
    evidence: "{name} in {parent.displayName}: {properties.ipAddress} ({sku.name}) is not attached"

  - id: AZ-VM-STOPPED-NOT-DEALLOCATED
    title: VM is stopped but still allocated
    kind: misconfigured
    lens: maintenance
    category: CST
    severity: low
    entity: vm
    why: A VM shut down from inside the guest stays allocated and keeps billing for compute while doing nothing.
    fix: Stop (deallocate) the VM from the portal or API, or delete it if it is no longer needed.
    refs: [NIST-800-53:CM-8]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Compute/virtualMachines
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2024-07-01", statusOnly: "true" }
      paging: none
      key: id
      name: name
    each: { field: "properties.instanceView.statuses[].code", op: eq, value: PowerState/stopped }
    evidence: "{name} in {parent.displayName}: stopped, not deallocated"

  # ---- RBAC and access (tenant and per subscription) -----------------------------------------

  - id: AZ-CLASSIC-ADMINISTRATOR
    title: Classic subscription co-administrator still present
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: role-assignment
    why: "Classic co-administrators held Owner-equivalent rights outside RBAC and retired on 2024-08-31; any entry left is a standing admin that no RBAC or PIM review ever sees."
    fix: Confirm what the co-administrator did, re-create the access as an RBAC role assignment, then remove the classic entry.
    refs: [NIST-800-53:AC-2, NIST-800-53:AC-6]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Authorization/classicAdministrators
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2015-07-01" }
      paging: none
      key: id
      name: properties.role
    each: { field: properties.role, op: match, value: 'CoAdministrator' }
    evidence: "{parent.displayName}: classic administrator role {properties.role}"

  - id: AZ-CUSTOM-ROLE-AUTHORIZATION-WRITE
    title: Custom role can grant access (Authorization write)
    kind: misconfigured
    lens: security
    category: IAM
    severity: high
    entity: role-definition
    why: "A custom role that holds Microsoft.Authorization/*/write or roleAssignments/write can grant itself and others any role; it is a path to Owner that the built-in privileged-role reviews never look at."
    fix: Remove the Authorization write actions from the role; access administration belongs to User Access Administrator through PIM, not a work role.
    refs: [NIST-800-53:AC-6, NIST-800-53:AC-2, CIS-Controls-v8:6.8]
    query:
      protocol: http
      path: /providers/Microsoft.Authorization/roleDefinitions
      params: { api-version: "2022-04-01", $filter: "type eq 'CustomRole'" }
      paging: none
      key: name
      name: properties.roleName
    each:
      all:
        - { field: properties.type, op: eq, value: CustomRole }
        - { field: "properties.permissions[].actions", op: match, value: '^Microsoft\.Authorization/(\*(/write)?|roleAssignments/write|roleDefinitions/write)$' }
    evidence: "{properties.roleName}: actions {properties.permissions[].actions}, assignable at {properties.assignableScopes}"

  - id: AZ-ROLE-ASSIGNMENT-FOREIGN-PRINCIPAL
    title: Role assignment to a cross-tenant (foreign) principal
    kind: misconfigured
    lens: security
    category: IAM
    severity: high
    entity: role-assignment
    why: "A ForeignGroup assignment (a CSP reseller's admin agents, or another tenant's group) grants access governed by that tenant's MFA and offboarding, not this one's, and it survives the end of the partner relationship."
    fix: Confirm the assignment belongs to a current contracted partner; remove it from subscriptions that partner no longer manages, and prefer least-privilege, time-bound access.
    refs: [NIST-800-53:AC-6, NIST-800-53:SA-9, NIST-800-53:AC-2]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "AuthorizationResources | where type =~ 'microsoft.authorization/roleassignments' | extend ptype = tostring(properties.principalType) | where ptype =~ 'ForeignGroup' | project id, name, subscriptionId, scope = tostring(properties.scope), principalId = tostring(properties.principalId), roleDefinitionId = tostring(properties.roleDefinitionId)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: principalId
    each: any
    evidence: "foreign principal {principalId} holds {roleDefinitionId} at {scope} (subscription {subscriptionId})"

  - id: AZ-WORKLOAD-IDENTITY-OWNER
    title: Service principal holds Owner
    kind: misconfigured
    lens: security
    category: IAM
    severity: high
    entity: role-assignment
    why: "A pipeline or automation identity with Owner is a standing tier-0 credential whose secret lives in a script or a pipeline variable; one leak is full control of the scope."
    fix: Scope the identity down to the resource groups it actually deploys, with a work role instead of Owner; prefer a managed identity or federated credential over a secret.
    refs: [NIST-800-53:AC-6, NIST-800-53:IA-9, CIS-Controls-v8:6.8]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "AuthorizationResources | where type =~ 'microsoft.authorization/roleassignments' | extend ptype = tostring(properties.principalType), rdef = tostring(properties.roleDefinitionId) | where ptype =~ 'ServicePrincipal' and rdef endswith '8e3af657-a8ff-443c-a75c-2fe8c4bcb635' | project id, name, subscriptionId, scope = tostring(properties.scope), principalId = tostring(properties.principalId)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: principalId
    each: any
    evidence: "service principal {principalId} holds Owner at {scope} (subscription {subscriptionId})"

  - id: AZ-LIGHTHOUSE-DELEGATION
    title: Azure Lighthouse delegation to a managing tenant
    kind: misconfigured
    lens: security
    category: IAM
    severity: high
    entity: role-assignment
    why: "A Lighthouse registration lets a managing tenant act in these subscriptions with its own identities, outside this tenant's MFA, Conditional Access and offboarding, and it does not appear in the normal role-assignment review."
    fix: Confirm every delegation is a current contracted provider; remove or narrow it, allow no Owner or User Access Administrator authorization, and keep write access eligible only.
    refs: [NIST-800-53:AC-6, NIST-800-53:SA-9, NIST-800-53:PS-7]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.ManagedServices/registrationAssignments
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2022-10-01", $expandRegistrationDefinition: "true" }
      paging: none
      key: id
      name: name
    each: any
    evidence: "{parent.displayName}: delegated to {properties.registrationDefinition.properties.managedByTenantId} ({properties.registrationDefinition.properties.managedByTenantName})"

  - id: AZ-KEYVAULT-RBAC-AUTHORIZATION-OFF
    title: Key vault uses legacy access policies, not Azure RBAC
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: key-vault
    why: "Access policies are invisible to RBAC reviews and to PIM, and anyone with Contributor on the vault can grant themselves one; the RBAC model is what access reviews and least-privilege rely on."
    fix: Migrate the vault to the Azure RBAC permission model after mapping each application and user to a data-plane role.
    refs: [NIST-800-53:AC-3, NIST-800-53:AC-6, CIS-Azure:8.3.6]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.KeyVault/vaults
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-07-01" }
      paging: none
      key: id
      name: name
    each:
      any:
        - { field: properties.enableRbacAuthorization, op: absent }
        - { field: properties.enableRbacAuthorization, op: eq, value: false }
    evidence: "{name} in {parent.displayName}: RBAC authorisation off (legacy access policies)"

  # ---- subscription and tenant governance ----------------------------------------------------

  - id: AZ-TENANT-SUBSCRIPTION-TRANSFER-UNRESTRICTED
    title: Subscriptions may be moved into or out of the tenant by anyone
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: instance
    why: "A subscription moved out of the tenant takes its data and resources beyond this tenant's control; one moved in brings unknown RBAC and billing. The tenant policy is what blocks both."
    fix: "Set the tenant subscription policy to block subscriptions leaving and entering the tenant, exempting only named admin groups (needs Global Administrator)."
    refs: [NIST-800-53:AC-3, NIST-800-53:CM-5, CIS-Azure:5.6]
    query:
      protocol: http
      path: /providers/Microsoft.Subscription/policies/default
      params: { api-version: "2021-10-01" }
      paging: none
      key: id
    each:
      any:
        - { field: properties.blockSubscriptionsLeavingTenant, op: absent }
        - { field: properties.blockSubscriptionsLeavingTenant, op: eq, value: false }
        - { field: properties.blockSubscriptionsIntoTenant, op: absent }
        - { field: properties.blockSubscriptionsIntoTenant, op: eq, value: false }
    evidence: "tenant subscription policy: leaving blocked {properties.blockSubscriptionsLeavingTenant}, entering blocked {properties.blockSubscriptionsIntoTenant}"

  - id: AZ-POLICY-EXEMPTION-NO-EXPIRY
    title: Policy exemption has no expiry
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: policy-exemption
    refresh: 7d
    why: "An exemption without an expiry is a control silently switched off for good; nobody revisits it, and the resource it covers drifts out of the baseline unseen."
    fix: Set an expiry (at most twelve months) and a description that names the approver, or remove the exemption.
    refs: [NIST-800-53:CA-7, NIST-800-53:CM-6]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "PolicyResources | where type =~ 'microsoft.authorization/policyexemptions' | project id, name, subscriptionId, exemptionCategory = tostring(properties.exemptionCategory), expiresOn = properties.expiresOn, assignmentId = tostring(properties.policyAssignmentId)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: expiresOn, op: absent }
    evidence: "{name} (subscription {subscriptionId}): exemption category {exemptionCategory}, no expiry, assignment {assignmentId}"

  - id: AZ-POLICY-ASSIGNMENT-ENFORCEMENT-DISABLED
    title: Policy assignment is not enforced
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: policy-assignment
    refresh: 7d
    why: "An assignment in DoNotEnforce mode audits but never blocks, so resources are still created outside the baseline; it reads as coverage while enforcing nothing."
    fix: Set the assignment's enforcement mode to Default once the existing non-compliant resources are remediated, or record why it must stay audit-only.
    refs: [NIST-800-53:CM-6, NIST-800-53:CA-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "PolicyResources | where type =~ 'microsoft.authorization/policyassignments' | extend mode = tostring(properties.enforcementMode) | where mode =~ 'DoNotEnforce' | project id, name, subscriptionId, displayName = tostring(properties.displayName), enforcementMode = mode"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: displayName
    each: any
    evidence: "{displayName} (subscription {subscriptionId}): enforcement {enforcementMode}"

  # ---- Defender for Cloud (per subscription) -------------------------------------------------

  - id: AZ-DEFENDER-SECURITY-CONTACT-NO-EMAIL
    title: Defender for Cloud security contact has no notification email
    kind: misconfigured
    lens: security
    category: MON
    severity: medium
    entity: defender-contact
    why: "Defender raises alerts, but with no contact email they reach nobody; a security contact pointing at an empty or a departed address is an alert channel that is silently dead."
    fix: Set the security contact to a monitored shared mailbox and turn on alert notifications for the Owner role.
    refs: [NIST-800-53:IR-6, NIST-800-53:SI-4, CIS-Azure:8.1.12]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Security/securityContacts
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2020-01-01-preview" }
      paging: none
      key: id
      name: name
    each: { field: properties.emails, op: empty }
    evidence: "{parent.displayName}: security contact {name} has no notification email"

  - id: AZ-DEFENDER-MDE-INTEGRATION-OFF
    title: Defender for Cloud integration with Defender for Endpoint is off
    kind: misconfigured
    lens: security
    category: MON
    severity: medium
    entity: defender-setting
    why: "With the WDATP integration off, Azure and Arc servers are not onboarded to Defender for Endpoint automatically, so the EDR coverage the Servers plan is paying for never reaches the machines."
    fix: Enable the WDATP setting on the subscription (consistent with the agreed endpoint-protection product).
    refs: [NIST-800-53:SI-3, NIST-800-53:SI-4]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Security/settings
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2022-05-01" }
      paging: none
      key: id
      name: name
    each:
      all:
        - { field: name, op: eq, value: WDATP }
        - { field: properties.enabled, op: eq, value: false }
    evidence: "{parent.displayName}: Defender for Endpoint integration (WDATP) is off"

  # ---- storage accounts (per subscription) ---------------------------------------------------

  - id: AZ-STORAGE-MIN-TLS-BELOW-1-2
    title: Storage account allows TLS below 1.2
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: storage-account
    why: "A minimum TLS of 1.0 or 1.1 lets a client negotiate a protocol with known weaknesses to carry data and shared-access signatures; 1.2 is the floor every current client supports."
    fix: Set the account's minimum TLS version to 1.2 after confirming no legacy client still negotiates an older one.
    refs: [NIST-800-53:SC-8, CIS-Controls-v8:3.10, CIS-Azure:9.3.6]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Storage/storageAccounts
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-05-01" }
      paging: none
      key: id
      name: name
    each:
      any:
        - { field: properties.minimumTlsVersion, op: absent }
        - { field: properties.minimumTlsVersion, op: notmatch, value: '^TLS1_(2|3)$' }
    evidence: "{name} in {parent.displayName}: minimum TLS {properties.minimumTlsVersion}"

  - id: AZ-STORAGE-NETWORK-DEFAULT-ALLOW
    title: Storage account firewall defaults to allow all networks
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: storage-account
    why: "With the network default action Allow, the account is reachable from every network and leans on keys and SAS alone; deny-by-default with named exceptions removes the internet as an attack path."
    fix: Set the network rule default action to Deny and add the specific networks or a private endpoint the consumers need, after testing them.
    refs: [NIST-800-53:SC-7, CIS-Azure:9.3.5]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Storage/storageAccounts
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-05-01" }
      paging: none
      key: id
      name: name
    each: { field: properties.networkAcls.defaultAction, op: eq, value: Allow }
    evidence: "{name} in {parent.displayName}: network default action Allow"

  - id: AZ-STORAGE-PUBLIC-NETWORK-ENABLED
    title: Storage account allows public network access
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: storage-account
    why: "Public network access keeps the account's public endpoint reachable from the internet; an account holding non-public data should be reached over a private endpoint only."
    fix: Set public network access to Disabled and add a private endpoint for the in-Azure consumers, or restrict it with the network rules where a public path is still needed.
    refs: [NIST-800-53:SC-7, CIS-Azure:9.3.2.1]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Storage/storageAccounts
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-05-01" }
      paging: none
      key: id
      name: name
    each: { field: properties.publicNetworkAccess, op: eq, value: Enabled }
    evidence: "{name} in {parent.displayName}: public network access Enabled"

  - id: AZ-STORAGE-CROSS-TENANT-REPLICATION-ALLOWED
    title: Storage account allows cross-tenant object replication
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: storage-account
    why: "Cross-tenant replication lets object replication copy blobs to an account in another tenant, a data-exfiltration path that leaves no trace in this tenant's own resources."
    fix: Set allowCrossTenantReplication to false unless a replication to another tenant is a recorded, intended arrangement.
    refs: [NIST-800-53:AC-3, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Storage/storageAccounts
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-05-01" }
      paging: none
      key: id
      name: name
    each:
      any:
        - { field: properties.allowCrossTenantReplication, op: absent }
        - { field: properties.allowCrossTenantReplication, op: eq, value: true }
    evidence: "{name} in {parent.displayName}: cross-tenant replication allowed"

  # ---- key vaults (per subscription) ---------------------------------------------------------

  - id: AZ-KEYVAULT-SOFT-DELETE-RETENTION-SHORT
    title: Key vault soft-delete retention is below 90 days
    kind: misconfigured
    lens: security
    category: BCK
    severity: medium
    entity: key-vault
    why: "Soft delete is the only window to recover a deleted vault or secret; a retention shorter than 90 days narrows the time to notice and undo a mistaken or malicious deletion."
    fix: Set the soft-delete retention to 90 days (soft delete cannot be turned off on current vaults).
    refs: [NIST-800-53:CP-9, NIST-800-53:SC-12, CIS-Azure:8.3.5]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.KeyVault/vaults
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-07-01" }
      paging: none
      key: id
      name: name
    each:
      any:
        - { field: properties.softDeleteRetentionInDays, op: absent }
        - { field: properties.softDeleteRetentionInDays, op: lt, value: 90 }
    evidence: "{name} in {parent.displayName}: soft-delete retention {properties.softDeleteRetentionInDays} days"

  - id: AZ-KEYVAULT-NETWORK-DEFAULT-ALLOW
    title: Key vault firewall defaults to allow all networks
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: key-vault
    why: "With the network default action Allow, a stolen token can read the vault's secrets from any network; deny-by-default with named exceptions keeps access to the paths that need it."
    fix: Set the vault's network default action to Deny, allow only the AzureServices bypass and named exceptions, and add a private endpoint for in-Azure consumers.
    refs: [NIST-800-53:SC-7, CIS-Azure:8.3.7]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.KeyVault/vaults
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-07-01" }
      paging: none
      key: id
      name: name
    each: { field: properties.networkAcls.defaultAction, op: eq, value: Allow }
    evidence: "{name} in {parent.displayName}: vault network default action Allow"

  - id: AZ-KEYVAULT-PUBLIC-NETWORK-ENABLED
    title: Key vault allows public network access
    kind: misconfigured
    lens: security
    category: CFG
    severity: low
    entity: key-vault
    why: "Public network access keeps the vault's endpoint reachable from the internet; a vault holding production secrets should be reached over a private endpoint only."
    fix: Set public network access to Disabled and add a private endpoint, after confirming the consumers reach the vault privately.
    refs: [NIST-800-53:SC-7, CIS-Azure:8.3.8]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.KeyVault/vaults
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2023-07-01" }
      paging: none
      key: id
      name: name
    each: { field: properties.publicNetworkAccess, op: eq, value: Enabled }
    evidence: "{name} in {parent.displayName}: vault public network access Enabled"

  # ---- SQL servers (per subscription) --------------------------------------------------------

  - id: AZ-SQL-PUBLIC-NETWORK-ENABLED
    title: Azure SQL server allows public network access
    kind: misconfigured
    lens: security
    category: CFG
    severity: high
    entity: sql-server
    why: "A SQL logical server with public network access on is reachable from the internet, subject only to its firewall rules; a private endpoint removes the public path entirely."
    fix: Set public network access to Disabled and reach the server through a private endpoint, or restrict the firewall to named ranges after testing the clients.
    refs: [NIST-800-53:SC-7, NIST-800-53:AC-3]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Sql/servers
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2021-11-01" }
      paging: none
      key: id
      name: name
    each: { field: properties.publicNetworkAccess, op: eq, value: Enabled }
    evidence: "{name} in {parent.displayName}: SQL server public network access Enabled"

  - id: AZ-SQL-MIN-TLS-BELOW-1-2
    title: Azure SQL server allows TLS below 1.2
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: sql-server
    why: "A minimal TLS version below 1.2 (or unset) lets a client negotiate a protocol with known weaknesses to reach the database; 1.2 is the floor current drivers support."
    fix: Set the server's minimal TLS version to 1.2 after confirming no legacy client still connects with an older one.
    refs: [NIST-800-53:SC-8, NIST-800-53:SC-13]
    query:
      protocol: http
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Sql/servers
      for_each: { path: /subscriptions, params: { api-version: "2022-12-01" }, paging: none, field: subscriptionId, max: 500 }
      params: { api-version: "2021-11-01" }
      paging: none
      key: id
      name: name
    each:
      any:
        - { field: properties.minimalTlsVersion, op: absent }
        - { field: properties.minimalTlsVersion, op: notmatch, value: '^1\.(2|3)$' }
    evidence: "{name} in {parent.displayName}: minimal TLS {properties.minimalTlsVersion}"

  # ---- networking (Resource Graph) -----------------------------------------------------------

  - id: AZ-NSG-MGMT-PORT-OPEN-FROM-INTERNET
    title: NSG rule opens a management port to the internet
    kind: misconfigured
    lens: security
    category: CFG
    severity: critical
    entity: nsg-rule
    why: "An inbound Allow from the internet to RDP, SSH, WinRM, SMB, RPC or a database port is how cloud estates are taken over, and it is almost always someone's temporary rule left in place."
    fix: "Remove the rule the same day; reach the machine through Bastion or Just-in-Time access, or restrict the source to a named range."
    refs: [NIST-800-53:SC-7, NIST-800-53:AC-17, CIS-Azure:7.1, MITRE-ATTACK:T1133]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/networksecuritygroups' | mv-expand rule = properties.securityRules | where tostring(rule.properties.direction) =~ 'Inbound' and tostring(rule.properties.access) =~ 'Allow' and tostring(rule.properties.sourceAddressPrefix) in~ ('*','0.0.0.0/0','Internet','Any') | extend dport = tostring(rule.properties.destinationPortRange) | where dport in ('*','22','3389','5985','5986','445','135','1433','3306','5432') | project id, name, subscriptionId, resourceGroup, nsgRule = tostring(rule.name), src = tostring(rule.properties.sourceAddressPrefix), dport"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: "{id}|{nsgRule}"
      name: name
    each: any
    evidence: "NSG {name} (subscription {subscriptionId}) rule {nsgRule}: source {src} to port {dport}"

  - id: AZ-VNET-PEERING-DISCONNECTED
    title: VNet peering is not connected
    kind: broken
    lens: maintenance
    category: AVL
    severity: high
    entity: vnet-peering
    refresh: 6h
    why: "A peering that is Disconnected or out of sync cuts traffic between hub and spoke while both VNets still look healthy, so the outage is found only when a workload cannot reach the other side."
    fix: Re-sync or re-create the peering; a Disconnected state usually means the peering on the other VNet was deleted or changed.
    refs: [NIST-800-53:SC-7, NIST-800-53:CP-8]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.network/virtualnetworks' | mv-expand peering = properties.virtualNetworkPeerings | extend pstate = tostring(peering.properties.peeringState) | where isnotempty(pstate) and pstate !~ 'Connected' | project id, name, subscriptionId, resourceGroup, peeringName = tostring(peering.name), peeringState = pstate"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: "{id}|{peeringName}"
      name: name
    each: any
    evidence: "VNet {name} (subscription {subscriptionId}) peering {peeringName}: {peeringState}"

  - id: AZ-RESOURCE-RETIRED-TYPE
    title: Resource of a retired type
    kind: broken
    lens: maintenance
    category: LCM
    severity: medium
    entity: resource
    refresh: 7d
    why: "Basic public IPs and Basic load balancers retired on 2025-09-30 and classic (ASM) resources are long retired; they lose support and are migrated or stopped on Microsoft's schedule, not the organisation's."
    fix: Migrate each resource to the current type with Microsoft's migration tooling before the enforced cut-over.
    refs: [NIST-800-53:SA-22]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where (type =~ 'microsoft.network/publicipaddresses' and tostring(sku.name) =~ 'Basic') or (type =~ 'microsoft.network/loadbalancers' and tostring(sku.name) =~ 'Basic') or type startswith 'microsoft.classic' | project id, name, type, subscriptionId, resourceGroup, skuName = tostring(sku.name)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: any
    evidence: "{name} (subscription {subscriptionId}): retired type {type} sku {skuName}"

  # ---- compute (Resource Graph) --------------------------------------------------------------

  - id: AZ-VM-UNMANAGED-DISK
    title: VM uses an unmanaged (VHD) OS disk
    kind: misconfigured
    lens: maintenance
    category: LCM
    severity: medium
    entity: vm
    refresh: 7d
    why: "An unmanaged OS disk is a page blob in a storage account, outside managed-disk encryption, backup integration and availability guarantees, and it depends on a storage account that counts against IOPS limits."
    fix: Convert the VM to managed disks in a maintenance window.
    refs: [NIST-800-53:CM-8, NIST-800-53:SA-22]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines' | where isnotnull(properties.storageProfile.osDisk.vhd) | project id, name, subscriptionId, resourceGroup"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: any
    evidence: "{name} (subscription {subscriptionId}): unmanaged VHD OS disk"

  - id: AZ-VM-BOOT-DIAGNOSTICS-OFF
    title: VM has boot diagnostics off
    kind: misconfigured
    lens: maintenance
    category: MON
    severity: low
    entity: vm
    refresh: 7d
    why: "Without boot diagnostics a VM that fails to boot - a bad update, a full disk - cannot be seen through the serial log or screenshot, so the first move in the incident is unavailable."
    fix: Enable boot diagnostics with a managed storage account on the VM.
    refs: [NIST-800-53:CP-10, NIST-800-53:SI-4]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.compute/virtualmachines' | extend bd = properties.diagnosticsProfile.bootDiagnostics.enabled | project id, name, subscriptionId, resourceGroup, bootDiagnostics = bd"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: bootDiagnostics, op: absent }
        - { field: bootDiagnostics, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}): boot diagnostics {bootDiagnostics}"

  # ---- PaaS and application services (Resource Graph) ----------------------------------------

  - id: AZ-APP-SERVICE-HTTPS-ONLY-OFF
    title: App Service app does not force HTTPS
    kind: misconfigured
    lens: security
    category: CFG
    severity: medium
    entity: app-service
    why: "With HTTPS-only off, the app answers on plain HTTP, so a request and any cookie or token it carries can be read on the path; an HTTP-to-HTTPS redirect is not the same guarantee."
    fix: Turn on HTTPS Only for the app (and set the minimum TLS version to 1.2).
    refs: [NIST-800-53:SC-8, CIS-Controls-v8:3.10]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.web/sites' | project id, name, subscriptionId, resourceGroup, kind, httpsOnly = properties.httpsOnly"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: httpsOnly, op: absent }
        - { field: httpsOnly, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}, {kind}): HTTPS-only off"

  - id: AZ-PAAS-LOCAL-AUTH-ENABLED
    title: PaaS service allows key-based local authentication
    kind: misconfigured
    lens: security
    category: AUT
    severity: low
    entity: resource
    why: "Keys and connection strings for Cosmos DB, Service Bus, Event Hubs, Event Grid, AI services and App Configuration bypass Entra ID, MFA and RBAC, and they leak into configuration files and scripts."
    fix: Move the clients to Entra ID authentication, then set disableLocalAuth to true; record an exception where a dependent client still needs a key.
    refs: [NIST-800-53:IA-2, NIST-800-53:IA-5]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type in~ ('microsoft.documentdb/databaseaccounts','microsoft.servicebus/namespaces','microsoft.eventhub/namespaces','microsoft.eventgrid/topics','microsoft.cognitiveservices/accounts','microsoft.appconfiguration/configurationstores') | project id, name, type, subscriptionId, resourceGroup, disableLocalAuth = properties.disableLocalAuth"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: disableLocalAuth, op: absent }
        - { field: disableLocalAuth, op: eq, value: false }
    evidence: "{name} (subscription {subscriptionId}, {type}): local (key) authentication allowed"

  - id: AZ-ACR-ADMIN-USER-ENABLED
    title: Container registry admin user is enabled
    kind: misconfigured
    lens: security
    category: IAM
    severity: medium
    entity: resource
    why: "The registry admin user is a single shared username and password with push rights; it bypasses Entra ID identities and cannot be attributed to a person, and its credentials spread into pipelines."
    fix: Disable the admin user and authenticate to the registry with Entra ID identities (a managed identity or a service principal with the needed role).
    refs: [NIST-800-53:AC-3, NIST-800-53:IA-2, CIS-Controls-v8:6.8]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "Resources | where type =~ 'microsoft.containerregistry/registries' | project id, name, subscriptionId, resourceGroup, adminUserEnabled = properties.adminUserEnabled"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each: { field: adminUserEnabled, op: eq, value: true }
    evidence: "{name} (subscription {subscriptionId}): registry admin user enabled"

  # ==== Defender for Cloud: plans where the workload exists (Resource Graph) ===================
  # One row per subscription that both has the plan's pricing object and holds at least one resource
  # the plan protects, so a plan left on Free where nothing of that kind is deployed is not a finding.
  # AZ-DEFENDER-PLAN-OFF (ARM, per subscription) covers the plans every subscription should have.

  - id: AZ-DEFENDER-SQL-PLAN-OFF
    title: Defender for Azure SQL is off where SQL servers exist
    kind: missing
    lens: security
    category: MON
    severity: medium
    entity: defender-plan
    why: "Without the SQL plan, SQL injection attempts, anomalous logins and data exfiltration from Azure SQL raise no alert, and vulnerability assessment does not run on the servers."
    fix: Turn the SqlServers plan on for the subscription (or by policy at the management group).
    refs: [MCSB:LT-1, MCSB:PV-5, NIST-800-53:SI-4]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "SecurityResources | where type =~ 'microsoft.security/pricings' and name =~ 'SqlServers' | project subscriptionId, tier = tostring(properties.pricingTier) | join kind=inner (Resources | where type =~ 'microsoft.sql/servers' or type =~ 'microsoft.sql/managedinstances' | summarize resources = count() by subscriptionId) on subscriptionId | project id = strcat('/subscriptions/', subscriptionId, '/providers/Microsoft.Security/pricings/SqlServers'), subscriptionId, tier, resources"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: subscriptionId
    each: { field: tier, op: eq, value: Free }
    evidence: "subscription {subscriptionId}: SqlServers plan {tier} with {resources} SQL server(s) or managed instance(s)"

