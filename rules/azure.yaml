    why: "Every new public IP is a new internet-facing entry point; an alert lets the network team check it against the approved exposure list."
    fix: Create an activity-log alert on Microsoft.Network/publicIPAddresses/write.
    refs: [MCSB:LT-3, NIST-800-53:AU-6, NIST-800-53:SC-7]
    query:
      protocol: http
      path: /providers/Microsoft.ResourceGraph/resources
      params: { api-version: "2022-10-01" }
      method: post
      body:
        query: "ResourceContainers | where type =~ 'microsoft.resources/subscriptions' and tostring(properties.state) =~ 'Enabled' | project subscriptionId, subscriptionName = name | join kind=leftouter (Resources | where type =~ 'microsoft.insights/activitylogalerts' and tobool(properties.enabled) | mv-expand cond = properties.condition.allOf | where tostring(cond.field) =~ 'operationName' and tostring(cond.equals) =~ 'Microsoft.Network/publicIPAddresses/write' | summarize alerts = dcount(id) by subscriptionId) on subscriptionId | project id = strcat('/subscriptions/', subscriptionId), subscriptionId, subscriptionName, alerts = coalesce(alerts, 0)"
      items: data
      paging: body-cursor
      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: subscriptionName
    each: { field: alerts, op: lt, value: 1 }
    evidence: "{subscriptionName}: no enabled alert on public IP write"

