      cursorField: "$skipToken"
      cursorBody: "options.$skipToken"
      key: id
      name: name
    each:
      any:
        - { field: properties.authConfig.activeDirectoryAuth, op: absent }
        - { field: properties.authConfig.activeDirectoryAuth, op: ne, value: Enabled }
    evidence: "{name} (subscription {subscriptionId}): Entra authentication {properties.authConfig.activeDirectoryAuth}, password authentication {properties.authConfig.passwordAuth}"

  - id: AZ-POSTGRES-VERSION-OLD
