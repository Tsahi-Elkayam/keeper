schema: keeper.rules/1
system: windows-baseline
name: Windows CIS/Microsoft security baseline (registry, over CIM)
integration: cim
# Generated by scratchpad\Build-BaselineRules.ps1 on 2026-10-21 from the public CIS (HardeningKitty) and
# Microsoft Security Compliance Toolkit Windows baselines. One rule per DISTINCT registry setting,
# deduped by (path + name + expected + operator). The CIS Operator states COMPLIANCE; each rule's
# condition states the FAILURE, and a value that is not set counts as a finding (any: [ {absent}, ... ]).
#
# OS targeting: the file-level targets below resolve ALL recently-active Windows hosts. Where a setting's expected
# value genuinely differs between Windows client and Windows Server, two variants are emitted with distinct ids
# (-CLIENT / -SERVER) and the per-OS value; each carries an `applies` condition, so a host is judged only against
# the variant for its own kind. See docs/backlog/windows-baseline.md.
targets:
  entity: computer
  field: dNSHostName
  where:
    all:
      - { field: operatingSystem, op: match, value: '^Windows' }
      - { field: lastLogonTimestamp, op: age-lt, value: 30 }
defaults:
  lens: security
  kind: misconfigured
  refresh: 7d
  entity: computer
rules:

  - id: CIS-18-4-4
    title: 'MS Security Guide: Enable Certificate Padding'
    category: PKI
    severity: medium
    why: 'The CIS/Microsoft Windows security baseline expects SOFTWARE\Microsoft\Cryptography\Wintrust\Config\EnableCertPaddingCheck = 1; a value that is not set counts as not compliant.'
    fix: 'Set SOFTWARE\Microsoft\Cryptography\Wintrust\Config\EnableCertPaddingCheck to the baseline value (= 1) through the group policy or MDM profile that enforces the baseline, then let policy refresh.'
    refs: ['CIS-Microsoft-Windows:18.4.4']
    query: { protocol: registry, hive: HKLM, path: 'SOFTWARE\Microsoft\Cryptography\Wintrust\Config', values: ['EnableCertPaddingCheck'], key: host }
    each: { any: [ { field: 'EnableCertPaddingCheck', op: absent }, { field: 'EnableCertPaddingCheck', op: ne, value: '1' } ] }
    evidence: '{host}: EnableCertPaddingCheck is {EnableCertPaddingCheck} (expected = 1)'

